[project]
# pecot monorepo workspace の root placeholder。
# リリース対象ではなく、root 共通の ruff 設定を束ねるためだけに存在する。
name = "pecot"
version = "0.0.0"
license = "MIT"
requires-python = ">=3.10,<3.15"

[tool.ruff]
# repo root の設定。
# plugins/pecot-workflow (py310-py314) と plugins/pecot-visual (py314) を両立させる。
# そのため共通最小の py310 を採用。
# py314 限定の lint が要るときは、
# plugins/pecot-visual/pyproject.toml の [tool.ruff] で上書きする。
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pecot", "pecotv"]

[tool.ruff.lint.per-file-ignores]
# typer は Option/Argument を関数引数 default で受ける慣用句のため B008 を許容。
# pre-commit (CWD=repo root) と run-lint.sh (CWD=plugins/pecot-visual) の両方でマッチさせる。
# そのため、CWD 起点 glob として **/ prefix を付ける。
"**/cli/pecotv/slidev/create.py" = ["B008"]
"**/cli/pecotv/slidev/convert.py" = ["B008"]
"**/cli/pecotv/slidev/pptx.py" = ["B008"]
"**/cli/pecotv/slidev/sync.py" = ["B008"]
"**/cli/pecotv/drawio/url.py" = ["B008"]
