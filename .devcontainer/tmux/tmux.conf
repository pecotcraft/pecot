# devcontainer の中で動く tmux の設定（#53）。
# pecot-open.sh / pecot-open-mobile.sh が `tmux -f` で渡す。

set -g default-terminal "tmux-256color"

# Claude Code の fullscreen は、ホイールのスクロールに mouse mode が要る。
set -g mouse on

# Claude Code がマウスで選んだ文字を OSC 52 で送り、tmux がホストの端末へ渡す。
# 外側の端末の TERM が clipboard の機能を名乗らなくても渡すよう、機能を足す。
# allow-passthrough は on にしない。Claude Code は tmux の中で 2 形式の OSC 52 を送る。
# 両方を on にすると、1 回のコピーが 2 回届く（anthropics/claude-code#74214）。
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

# Ghostty から attach すると、TERM は ghostty になる（#85）。tmux の既定の機能は xterm* にしか当たらない。
# コンテナの ghostty の terminfo には RGB も無いので、truecolor とカーソルの形・色を名前で足す（#87）。
set -as terminal-features ",ghostty*:RGB:ccolour:cstyle"
