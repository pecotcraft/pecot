name: test-report

# Allure Report を artifact test-report-<side> に上げる。開発版は ci の結果を拾って結果の無いレーンだけ、リリース版は全レーンを動かし、履歴を S3 で読み書きする。
# 契機と出力の決まりは specs/030-allure-test-report/contracts/test-report.md。形は .githooks/tests/test_report_workflow.py が固定する。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      side:
        description: "作る側（release か dev）。main からだけ起動できる"
        type: choice
        options: [release, dev]
        default: dev

permissions:
  contents: read

concurrency:
  group: test-report-${{ inputs.side || 'dev' }}
  cancel-in-progress: false

env:
  PECOT_NX_CI: "1"
  PECOTV_E2E_CEILING_SCALE: "3"
  DEV_SITE_URL: https://pecotcraft.github.io/pecot/dev/
  RELEASE_SITE_URL: https://pecotcraft.github.io/pecot/

jobs:
  side:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 他の run の artifact と jobs を読む。
    permissions:
      contents: read
      actions: read
    outputs:
      side: ${{ steps.decide.outputs.side }}
      site_url: ${{ steps.decide.outputs.site_url }}
      report: ${{ steps.sources.outputs.report }}
      run_tests: ${{ steps.sources.outputs.run_tests }}
      matrix: ${{ steps.sources.outputs.matrix }}
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      # main 以外のブランチや、main という名前のタグからの手での起動はレポートを作らない。
      - name: Check ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::workflow_dispatch must run on refs/heads/main: $REF"
          exit 1

      # タグと merge-base に全部の履歴が要る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Decide side
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SIDE: ${{ inputs.side }}
        run: |
          set -euo pipefail
          side=dev
          [ "$EVENT_NAME" != "workflow_dispatch" ] || side=$INPUT_SIDE
          case "$side" in
            dev) site_url=$DEV_SITE_URL ;;
            release) site_url=$RELEASE_SITE_URL ;;
            *)
              echo "::error::side must be dev or release: $side"
              exit 1
              ;;
          esac
          {
            echo "side=$side"
            echo "site_url=$site_url"
          } >> "$GITHUB_OUTPUT"

      # 開発版の dev_sources.py は、list-test-lanes.sh で nx を動かす。
      - name: Set up Node.js
        if: ${{ steps.decide.outputs.side == 'dev' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Enable Corepack
        if: ${{ steps.decide.outputs.side == 'dev' }}
        run: corepack enable

      - name: Install dependencies
        if: ${{ steps.decide.outputs.side == 'dev' }}
        run: pnpm install --frozen-lockfile --ignore-scripts --filter pecot

      # data-model の ReportSources。開発版はレポートを必ず作り、リリース版は材料が無ければ後の job を飛ばす。
      - name: Resolve report sources
        id: sources
        env:
          SIDE: ${{ steps.decide.outputs.side }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MSG_MISSING: "結果を出せるタグが無いので、レポートに入れないプラグイン:"
          MSG_NO_REPORT: "レポートに入れるプラグインが無いので、レポートを作りません。"
        run: |
          set -euo pipefail
          if [ "$SIDE" = "dev" ]; then
            out=$(python3 .githooks/scripts/test_report/dev_sources.py resolve --head "$SHA" --repo "$REPO")
          else
            out=$(python3 .githooks/scripts/pages_site/release_sources.py --report release --main origin/main)
          fi
          run_tests=$(printf '%s' "$out" | jq -r 'if (.matrix | length) > 0 then "true" else "false" end')
          report=$run_tests
          [ "$SIDE" != "dev" ] || report=true
          {
            echo "sources=$(printf '%s' "$out" | jq -c .sources)"
            echo "matrix=$(printf '%s' "$out" | jq -c .matrix)"
            echo "report=$report"
            echo "run_tests=$run_tests"
          } >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s' "$out" | jq '.sources.missing | length')" -gt 0 ]; then
            {
              echo "$MSG_MISSING"
              echo
              printf '%s' "$out" | jq -r '.sources.missing[] | "- \(.)"'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$report" = "false" ]; then
            printf '\n%s\n' "$MSG_NO_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 空の matrix は GitHub がエラーにするため、動かすレーンが無ければ job ごと飛ばす。
  tests:
    needs: side
    if: ${{ needs.side.outputs.run_tests == 'true' }}
    name: tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMMIT: ${{ matrix.commit }}
      RESULTS: ${{ matrix.results }}
      CHECKS_LANE: ${{ matrix.lane }}
      PECOT_REPORT_SITE_URL: ${{ needs.side.outputs.site_url }}
      # ci.yml の tests の job と同じ式。
      PECOT_CI_BROWSER: ${{ (startsWith(matrix.lane, 'pecot-visual:') || matrix.lane == 'interface-spec:test-site') && '1' || '0' }}
      # 共通の名前は dev-container.sh が渡す。ここには job 固有の名前だけを書く。
      DEVCONTAINER_ENV: |
        CHECKS_LANE
        PECOT_REPORT_SITE_URL
        PECOT_CI_BROWSER
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.side.outputs.matrix) }}
    steps:
      # ref は step の出力でなく GitHub が決める値から取る（CodeQL の actions/cache-poisoning）。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # dev container の取得と起動より前に替え、そのコミットの .devcontainer の定義で動かす。
      - name: Check out report commit
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character lowercase hex commit SHA: $COMMIT"
            exit 1
          fi
          git checkout --force "$COMMIT"

      - name: Start pulling dev container image
        run: .githooks/ci/dev-container.sh prefetch

      - name: Start dev container
        run: .githooks/ci/dev-container.sh up

      # テストが落ちても結果を上げ、レポートに載せる。
      - name: Run tests
        continue-on-error: true
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && pnpm exec nx run "$CHECKS_LANE" --skip-nx-cache'

      - name: Restore workspace owner
        if: always()
        run: .githooks/ci/dev-container.sh restore-owner

      # 結果が無くても source.json は上げる。欠けたことは report の ResultsCheck がレーンの名前を出して落とす。
      - name: Stage results
        if: always()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/test-report-results"
          parent=$(dirname "$RESULTS")
          mkdir -p "$stage/$parent"
          if [ -d "$RESULTS" ]; then
            cp -R "$RESULTS" "$stage/$parent/"
          fi
          jq -n --arg lane "$CHECKS_LANE" --arg commit "$(git rev-parse HEAD)" \
            '{lane: $lane, commit: $commit}' > "$stage/$parent/source.json"

      # include-hidden-files が無いと、.githooks/ の下のレーンの結果が外れる。
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-${{ matrix.slug }}
          path: ${{ runner.temp }}/test-report-results/
          retention-days: 1
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

  # S3 の履歴を取る。取れなくても成功で終え、state を unreadable にして history-put を止める（FR-021）。
  history-get:
    needs: side
    if: ${{ needs.side.outputs.report == 'true' && needs.side.outputs.side == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # ロールはこの environment の run だけが引き受けられる。デプロイではないので記録を積まない。
    environment:
      name: test-report-history
      deployment: false
    outputs:
      state: ${{ steps.get.outputs.state }}
      etag: ${{ steps.get.outputs.etag }}
    steps:
      # 行の確かめに generate.py の read_history を使う。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .githooks/scripts/test_report
          persist-credentials: false

      - name: Configure AWS credentials
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.TEST_REPORT_HISTORY_ROLE_ARN }}
          aws-region: ap-southeast-2

      # read_history は、読めない行があると 3 で終わる。ほかの失敗は step を落とす。
      - name: Get history
        id: get
        env:
          CREDENTIALS: ${{ steps.aws.outcome }}
          BUCKET: ${{ vars.TEST_REPORT_HISTORY_BUCKET }}
          MSG_NO_CREDENTIALS: "AWS のロールを引き受けられませんでした。"
          MSG_GET_FAILED: "S3 から履歴を取れませんでした。"
          MSG_BAD_LINES: "S3 の履歴に、Allure の読めない行があります。"
          MSG_EMPTY: "空の履歴でレポートを作り、S3 の履歴は書き換えません。"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/test-report-history"
          history="$dir/history.jsonl"
          mkdir -p "$dir"
          : > "$history"
          state=unreadable
          reason=""
          if [ "$CREDENTIALS" != "success" ]; then
            reason=$MSG_NO_CREDENTIALS
          elif aws s3api get-object --bucket "$BUCKET" --key release/history.jsonl \
            --query ETag --output text "$history" > "$RUNNER_TEMP/history-etag" 2> "$RUNNER_TEMP/history-error"; then
            if python3 -c 'import sys; sys.path.insert(0, ".githooks/scripts/test_report"); from generate import read_history; sys.exit(3 if read_history(open(sys.argv[1], "rb").read()) else 0)' "$history"; then
              state=found
            else
              code=$?
              [ "$code" -eq 3 ] || exit "$code"
              reason=$MSG_BAD_LINES
            fi
          elif grep -q '(NoSuchKey)' "$RUNNER_TEMP/history-error"; then
            state=absent
          else
            cat "$RUNNER_TEMP/history-error" >&2
            reason=$MSG_GET_FAILED
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "found" ]; then
            echo "etag=$(cat "$RUNNER_TEMP/history-etag")" >> "$GITHUB_OUTPUT"
          else
            : > "$history"
          fi
          if [ "$state" = "unreadable" ]; then
            printf '\n> [!WARNING]\n> %s%s\n' "$reason" "$MSG_EMPTY" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 空の履歴は上げず、report が state を見て空のファイルを作る。
      - name: Upload history
        if: ${{ steps.get.outputs.state == 'found' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-history-in
          path: ${{ runner.temp }}/test-report-history/history.jsonl
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # tests・history-get が飛ばされても、一部が基盤で落ちても動き、ResultsCheck で欠けたレーンを出す。
  report:
    needs: [side, tests, history-get]
    if: ${{ !cancelled() && needs.side.outputs.report == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCES: ${{ needs.side.outputs.sources }}
      SIDE: ${{ needs.side.outputs.side }}
    steps:
      # generate.py が結果のコミットを git merge-base で HEAD と比べるので、全部の履歴を取る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # dev container の中からは GITHUB_STEP_SUMMARY に書けないので、ランナーで作る。
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # pnpm の版は package.json の packageManager が決める。
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter pecot

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Write report sources
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/test-report"
          mkdir -p "$work"
          printf '%s' "$SOURCES" > "$work/report-sources.json"

      # 開発版の latest のレーンの結果を、ci と前の開発版の run の artifact から取り、レーンの場所に写す。
      - name: Fetch latest results
        if: ${{ needs.side.outputs.side == 'dev' }}
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .githooks/scripts/test_report/dev_sources.py fetch \
            --sources "$RUNNER_TEMP/test-report/report-sources.json" --repo "$REPO" --root .

      # 履歴はリリース版だけで、history-get が S3 から取ったものを受ける。
      - name: Download history
        if: ${{ needs.side.outputs.side == 'release' && needs.history-get.outputs.state == 'found' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report-history-in
          path: ${{ runner.temp }}/test-report

      # absent・unreadable は空の履歴で作る。unreadable の知らせは history-get が出している。
      # history-get が落ちたか、found なのに受け取れなかったときも、空の履歴で作って知らせる（FR-021）。
      - name: Prepare history
        if: ${{ needs.side.outputs.side == 'release' }}
        env:
          STATE: ${{ needs.history-get.outputs.state }}
          MSG_NO_HISTORY: "S3 の履歴を受け取れなかったので、空の履歴でレポートを作ります。"
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/test-report/history.jsonl"
          if [ ! -f "$history" ]; then
            : > "$history"
            if [ "$STATE" != "absent" ] && [ "$STATE" != "unreadable" ]; then
              printf '\n> [!WARNING]\n> %s\n' "$MSG_NO_HISTORY" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Generate report
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/test-report"
          args=(--sources "$work/report-sources.json" --output "$work/site")
          [ "$SIDE" = "dev" ] || args+=(--history "$work/history.jsonl")
          python3 .githooks/scripts/test_report/generate.py "${args[@]}"

      # 履歴は allure generate --clean に消されないよう出力の外で書かせ、tar には入れない。
      - name: Pack report
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/test-report"
          out="$RUNNER_TEMP/test-report-artifact"
          mkdir -p "$out"
          tar -C "$work/site" -cf "$out/report.tar" .
          cp "$work/report-sources.json" "$out/report-sources.json"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ needs.side.outputs.side }}
          path: ${{ runner.temp }}/test-report-artifact/
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      # 履歴は pages-store に置かず、history-put が S3 に戻す（FR-019）。
      - name: Upload history
        if: ${{ needs.side.outputs.side == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-history-out
          path: ${{ runner.temp }}/test-report/history.jsonl
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      # 次の開発版の run が持ち越す、全レーンの結果と index（data-model の LaneLatest）。
      - name: Pack lane results
        if: ${{ needs.side.outputs.side == 'dev' }}
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .githooks/scripts/test_report/dev_sources.py pack \
            --sources "$RUNNER_TEMP/test-report/report-sources.json" --root . \
            --out "$RUNNER_TEMP/lane-latest" --commit "$SHA" --run-id "$RUN_ID"

      - name: Upload lane results
        if: ${{ needs.side.outputs.side == 'dev' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-latest
          path: ${{ runner.temp }}/lane-latest/lane-latest/
          retention-days: 90
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload lane index
        if: ${{ needs.side.outputs.side == 'dev' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-latest-index
          path: ${{ runner.temp }}/lane-latest/lane-latest-index/lane-latest-index.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  # 読めなかった回は書かない。空の履歴から作った 1 行で、S3 の行を消さないため。
  history-put:
    needs: [side, history-get, report]
    if: ${{ !cancelled() && needs.side.outputs.side == 'release' && needs.report.result == 'success' && needs.history-get.result == 'success' && needs.history-get.outputs.state != 'unreadable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: test-report-history
      deployment: false
    steps:
      - name: Download history
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report-history-out
          path: ${{ runner.temp }}/test-report-history

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.TEST_REPORT_HISTORY_ROLE_ARN }}
          aws-region: ap-southeast-2

      # 条件付きの書き込みで、古い run のやり直しが新しい履歴を上書きしないようにする。
      - name: Put history
        env:
          BUCKET: ${{ vars.TEST_REPORT_HISTORY_BUCKET }}
          STATE: ${{ needs.history-get.outputs.state }}
          ETAG: ${{ needs.history-get.outputs.etag }}
          MSG_CHANGED: "S3 の履歴が、この run が読んだ後に変わったので、書き戻しませんでした。"
        run: |
          set -euo pipefail
          args=(--bucket "$BUCKET" --key release/history.jsonl --body "$RUNNER_TEMP/test-report-history/history.jsonl")
          case "$STATE" in
            found) args+=(--if-match "$ETAG") ;;
            absent) args+=(--if-none-match '*') ;;
            *)
              echo "::error::history state must be found or absent: $STATE"
              exit 1
              ;;
          esac
          if ! aws s3api put-object "${args[@]}" > /dev/null 2> "$RUNNER_TEMP/history-error"; then
            cat "$RUNNER_TEMP/history-error" >&2
            if grep -q '(PreconditionFailed)' "$RUNNER_TEMP/history-error"; then
              echo "::error::$MSG_CHANGED"
              printf '\n> [!WARNING]\n> %s\n' "$MSG_CHANGED" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
