name: pages-build

# 公開サイトの 1 つの側（release / dev / pr）を作り、artifact に上げる。確かめと公開は pages-deploy.yml が行う。
# 契機と出力の決まりは specs/028-pages-site/contracts/pages.md。形は .githooks/tests/test_pages_workflows.py が固定する。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      side:
        description: "作る側（release か dev）。main からだけ起動できる"
        type: choice
        options: [release, dev]
        default: dev

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.event_name == 'pull_request' && 'pr' || inputs.side || 'dev' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PECOT_NX_CI: "1"
  PECOTV_E2E_CEILING_SCALE: "3"
  PECOT_NX_PARALLEL: "2"

jobs:
  side:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      side: ${{ steps.decide.outputs.side }}
      pr: ${{ steps.decide.outputs.pr }}
      sha: ${{ steps.release.outputs.sha || steps.decide.outputs.sha }}
      artifact: ${{ steps.decide.outputs.artifact }}
      built_at: ${{ steps.decide.outputs.built_at }}
      sources: ${{ steps.release.outputs.sources }}
    steps:
      # main 以外のブランチや、main という名前のタグからの手での起動は側を作らない。
      - name: Check ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::workflow_dispatch must run on refs/heads/main: $REF"
          exit 1

      # closed の PR は pages-deploy.yml を起こすためだけに成功で終わる。fork の PR は作らない。
      - name: Decide side and commit
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SIDE: ${{ inputs.side }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          build=true
          pr=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            side="pr"
            pr=$PR_NUMBER
            SHA=$PR_HEAD_SHA
            if [ "$PR_ACTION" = "closed" ] || [ "$PR_HEAD_REPO" != "$REPO" ]; then
              build=false
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            side=$INPUT_SIDE
            SHA=$PUSH_SHA
          else
            side="dev"
            SHA=$PUSH_SHA
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase hex commit SHA: $SHA"
            exit 1
          fi
          artifact="pages-side-$side"
          [ "$side" != "pr" ] || artifact="pages-side-pr-$pr"
          {
            echo "build=$build"
            echo "side=$side"
            echo "pr=$pr"
            echo "sha=$SHA"
            echo "artifact=$artifact"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "side=$side pr=$pr sha=$SHA build=$build"

      - name: Checkout
        if: steps.decide.outputs.side == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.decide.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # リリース版は、プラグインごとの最新のタグと骨組みのコミットで作る（data-model の ReleaseSources）。
      - name: Resolve release sources
        id: release
        if: steps.decide.outputs.side == 'release'
        run: |
          set -euo pipefail
          sources=$(python3 .githooks/scripts/pages_site/release_sources.py --main origin/main)
          skeleton=$(printf '%s' "$sources" | jq -r .skeleton)
          {
            echo "sources=$(printf '%s' "$sources" | jq -c .)"
            echo "sha=$skeleton"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$sources" | jq -r '.tags | to_entries[] | "- \(.key): \(.value)"' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: side
    if: ${{ needs.side.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SIDE: ${{ needs.side.outputs.side }}
      PR: ${{ needs.side.outputs.pr }}
      SHA: ${{ needs.side.outputs.sha }}
      SOURCES: ${{ needs.side.outputs.sources }}
      # Chromium を使う pecot-visual のレーンも同じ job で動かす。
      PECOT_CI_BROWSER: "1"
      PECOT_SITE_STRICT: "1"
      PECOT_SITE_SIDE: ${{ needs.side.outputs.side }}
      PECOT_SITE_PR: ${{ needs.side.outputs.pr }}
      PECOT_SITE_SHA: ${{ needs.side.outputs.sha }}
      PECOT_SITE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PECOT_SITE_BUILT_AT: ${{ needs.side.outputs.built_at }}
      DEVCONTAINER_ENV: |
        PECOT_CI_BROWSER
        PECOT_SITE_STRICT
        PECOT_SITE_SIDE
        PECOT_SITE_PR
        PECOT_SITE_SHA
        PECOT_SITE_RUN_URL
        PECOT_SITE_BUILT_AT
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.side.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Start pulling dev container image
        run: .githooks/ci/dev-container.sh prefetch

      - name: Start dev container
        run: .githooks/ci/dev-container.sh up

      # テストが落ちても次のレーンへ進む。合否は JUnit に残り、JUnit が欠けたら次の Collect JUnit が落ちる。
      - name: Run lanes
        if: env.SIDE != 'release'
        run: |
          set -euo pipefail
          for lane in $(python3 .githooks/scripts/pages_site/lanes.py | jq -r '.[].lane'); do
            echo "::group::$lane"
            rc=0
            # shellcheck disable=SC2016
            PAGES_LANE=$lane DEVCONTAINER_ENV="$DEVCONTAINER_ENV PAGES_LANE" .githooks/ci/dev-container.sh exec -- \
              'cd /workspaces/base/pecot && pnpm exec nx run "$PAGES_LANE" --skip-nx-cache' || rc=$?
            [ "$rc" = 0 ] || echo "::warning::$lane exited with $rc"
            echo "::endgroup::"
          done

      - name: Restore workspace owner after lanes
        if: always() && env.SIDE != 'release'
        run: .githooks/ci/dev-container.sh restore-owner

      - name: Collect JUnit
        if: env.SIDE != 'release'
        run: |
          python3 .githooks/scripts/pages_site/collect.py --out "$RUNNER_TEMP/pages-side" \
            --side "$SIDE" --pr "$PR" --sha "$SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Build site
        if: env.SIDE != 'release'
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && pnpm exec nx run interface-spec:docs --skip-nx-cache'

      # タグのコミットと骨組みのコミットを順に取り出して作る（contracts の「リリース版の build」）。
      - name: Build release side
        if: env.SIDE == 'release'
        run: |
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/release-sources-full.json"
          python3 .githooks/scripts/pages_site/release_build.py \
            --sources "$RUNNER_TEMP/release-sources-full.json" --out "$RUNNER_TEMP/pages-side"

      - name: Restore workspace owner
        if: always()
        run: .githooks/ci/dev-container.sh restore-owner

      - name: Pack site
        if: env.SIDE != 'release'
        run: tar -C libs/interface-spec/docs/_build -cf "$RUNNER_TEMP/pages-side/site.tar" .

      - name: Upload side
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.side.outputs.artifact }}
          path: ${{ runner.temp }}/pages-side/
          retention-days: 7
          if-no-files-found: error
