name: pages-build

# 公開サイトの 1 つの側（リリース版・開発版・PR 版）を作り、artifact に上げる。テストは動かさない。確かめと公開は pages-deploy.yml が行う。
# 契機と出力の決まりは specs/028-pages-site/contracts/pages.md。形は .githooks/tests/test_pages_workflows.py が固定する。

on:
  push:
    branches: [main]
  # closed は、閉じた PR の掃除を pages-deploy.yml に起こさせるためだけに動く。
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      side:
        description: "作る側（release か dev）。main からだけ起動できる"
        type: choice
        options: [release, dev]
        default: dev

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.event_name == 'pull_request' && 'pr' || inputs.side || 'dev' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PECOT_NX_CI: "1"

jobs:
  side:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      side: ${{ steps.decide.outputs.side }}
      pr: ${{ steps.decide.outputs.pr }}
      sha: ${{ steps.release.outputs.sha || steps.decide.outputs.sha }}
      artifact: ${{ steps.decide.outputs.artifact }}
      sources: ${{ steps.release.outputs.sources }}
    steps:
      # main 以外のブランチや、main という名前のタグからの手での起動は側を作らない。
      - name: Check ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::workflow_dispatch must run on refs/heads/main: $REF"
          exit 1

      # 閉じた PR と fork の PR の run は、何も作らずに成功で終わる。
      - name: Decide side and commit
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SIDE: ${{ inputs.side }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          build=true
          pr=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            side="pr"
            pr=$PR_NUMBER
            SHA=$PR_HEAD_SHA
            if [ "$PR_ACTION" = "closed" ] || [ "$PR_HEAD_REPO" != "$REPO" ]; then
              build=false
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            side=$INPUT_SIDE
            SHA=$PUSH_SHA
          else
            side="dev"
            SHA=$PUSH_SHA
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase hex commit SHA: $SHA"
            exit 1
          fi
          artifact="pages-side-$side"
          [ "$side" != "pr" ] || artifact="pages-side-pr-$pr"
          {
            echo "build=$build"
            echo "side=$side"
            echo "pr=$pr"
            echo "sha=$SHA"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"
          echo "side=$side pr=$pr sha=$SHA build=$build"

      - name: Checkout
        if: steps.decide.outputs.side == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # リリース版は、プラグインごとの最新のタグと骨組みのコミットで作る（data-model の ReleaseSources）。
      - name: Resolve release sources
        id: release
        if: steps.decide.outputs.side == 'release'
        run: |
          set -euo pipefail
          sources=$(python3 .githooks/scripts/pages_site/release_sources.py --main origin/main)
          skeleton=$(printf '%s' "$sources" | jq -r .skeleton)
          {
            echo "sources=$(printf '%s' "$sources" | jq -c .)"
            echo "sha=$skeleton"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$sources" | jq -r '.tags | to_entries[] | "- \(.key): \(.value)"' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: side
    if: ${{ needs.side.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIDE: ${{ needs.side.outputs.side }}
      SOURCES: ${{ needs.side.outputs.sources }}
      PECOT_SITE_SIDE: ${{ needs.side.outputs.side }}
      PECOT_SITE_PR: ${{ needs.side.outputs.pr }}
      DEVCONTAINER_ENV: |
        PECOT_SITE_SIDE
        PECOT_SITE_PR
    steps:
      # ref は step の出力でなく GitHub が決める値から取る（CodeQL の actions/cache-poisoning）。リリース版は release_build.py が取り出す。
      # PR 版は、merge のコミットでなく PR の head で作る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Start pulling dev container image
        run: .githooks/ci/dev-container.sh prefetch

      - name: Start dev container
        run: .githooks/ci/dev-container.sh up

      - name: Build site
        if: env.SIDE != 'release'
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && pnpm exec nx run interface-spec:docs --skip-nx-cache'

      # タグのコミットと骨組みのコミットを順に取り出して作る（contracts の「リリース版の build」）。
      - name: Build release side
        if: env.SIDE == 'release'
        run: |
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/release-sources-full.json"
          python3 .githooks/scripts/pages_site/release_build.py \
            --sources "$RUNNER_TEMP/release-sources-full.json" --out "$RUNNER_TEMP/pages-side"

      - name: Restore workspace owner
        if: always()
        run: .githooks/ci/dev-container.sh restore-owner

      - name: Pack site
        if: env.SIDE != 'release'
        run: |
          mkdir -p "$RUNNER_TEMP/pages-side"
          tar -C libs/interface-spec/docs/_build -cf "$RUNNER_TEMP/pages-side/site.tar" .

      - name: Upload side
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.side.outputs.artifact }}
          path: ${{ runner.temp }}/pages-side/
          retention-days: 7
          overwrite: true
          if-no-files-found: error
