# GitHub の今のスキーマ（SDL・OpenAPI）を Issue の機能の写しと比べ、差を Tracker 1 件に書き直してボードに載せる。差が無くなれば閉じる。
# .github/board-sync/ の Lambda の Scheduler が毎時 dispatch する。変数 SECURITY_APP_CLIENT_ID が空の間は job を飛ばす。
# GITHUB_TOKEN は org の Projects を書けないため、GitHub App のトークンを使う。
name: issue-surface-drift

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Compare only and write nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: issue-surface-drift
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.SECURITY_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SECURITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-organization-projects: write

      - name: Compare the issue surface
        uses: ./actions/tracker-sync
        with:
          token: ${{ steps.app-token.outputs.token }}
          source: issue-surface
          surface-file: plugins/pecot-workflow/interface/github-issue-surface.json
          dry-run: ${{ inputs.dry-run }}
