name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: read

env:
  PECOT_NX_CI: "1"
  PECOTV_E2E_CEILING_SCALE: "3"
  PECOT_NX_PARALLEL: "2"
  PECOT_CI_SUMMARY: /workspaces/base/pecot/.pecot/tmp/ci/step-summary.md

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint・githooks と、変更が届いたレーンごとの tests を別の job に分けて同時に動かす。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHECKS_PART: ${{ matrix.part }}
      DEVCONTAINER_ENV: |
        CI
        NX_BASE
        NX_HEAD
        NO_PREV
        CHECKS_PART
        PECOT_NX_CI
        PECOTV_E2E_CEILING_SCALE
        PECOT_NX_PARALLEL
        PECOT_CI_IMAGE
        PECOT_CI_SUMMARY
    strategy:
      fail-fast: false
      matrix:
        part: [lint, githooks]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull dev container image
        run: .githooks/ci/dev-container.sh prefetch

      # error-on-no-successful-workflow は書かない。成功した run が無いとき、noPreviousBuild=true で全レーンのモードに入る。
      - name: Derive base and head SHAs
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      # GITHUB_ACTIONS は nx の ::group:: で切り出しが崩れるため、env に渡さない。
      - name: Start dev container
        id: up
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
        run: .githooks/ci/dev-container.sh up

      # exec の cwd は /workspaces/base のため、cd してから動かす。
      - name: Run checks
        id: verify
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && .githooks/ci/run-pr-checks.sh --part="$CHECKS_PART" "$NX_BASE" "$NX_HEAD"'

      - name: Restore workspace owner
        if: always()
        run: .githooks/ci/dev-container.sh restore-owner

      # チェックが途中で止まると完了の印が付かないため、印が無ければ失敗にする。
      - name: Write job summary
        if: always()
        env:
          UP_OUTCOME: ${{ steps.up.outcome }}
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: .githooks/ci/finish-ci-summary.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ matrix.part }}
          path: |
            .pecot/tmp/nx-affected-tests/
            .pecot/tmp/githooks-timing.tsv
            .pecot/tmp/ci/step-summary.md
          if-no-files-found: ignore

  # tests の job が使う base・head・NO_PREV はここでだけ決める。job ごとに決めると、その間に別の run が終わって base がずれる。
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lanes: ${{ steps.list.outputs.lanes }}
      count: ${{ steps.list.outputs.count }}
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      no_prev: ${{ steps.shas.outputs.noPreviousBuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # error-on-no-successful-workflow は書かない。成功した run が無いとき、noPreviousBuild=true で全レーンのモードに入る。
      - name: Derive base and head SHAs
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # pnpm の版は package.json の packageManager が決める。
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter pecot

      - name: List test lanes
        id: list
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
        run: .githooks/ci/list-test-lanes.sh "$NX_BASE" "$NX_HEAD" >> "$GITHUB_OUTPUT"

  # レーンが 0 本のとき、空の matrix は GitHub がエラーにするため job ごと飛ばす。
  tests:
    needs: lanes
    if: needs.lanes.outputs.count != '0'
    name: tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_BASE: ${{ needs.lanes.outputs.base }}
      NX_HEAD: ${{ needs.lanes.outputs.head }}
      NO_PREV: ${{ needs.lanes.outputs.no_prev }}
      CHECKS_LANE: ${{ matrix.lane }}
      CHECKS_SLUG: ${{ matrix.slug }}
      PECOT_CI_NX_CACHE: /workspaces/base/pecot/.pecot/tmp/ci/nx-remote
      DEVCONTAINER_ENV: |
        CI
        NX_BASE
        NX_HEAD
        NO_PREV
        CHECKS_LANE
        CHECKS_SLUG
        PECOT_NX_CI
        PECOTV_E2E_CEILING_SCALE
        PECOT_NX_PARALLEL
        PECOT_CI_IMAGE
        PECOT_CI_SUMMARY
        PECOT_CI_NX_CACHE
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lanes.outputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull dev container image
        run: .githooks/ci/dev-container.sh prefetch

      # 取り込むのは同じ repo の同じ PR の run の artifact だけにする。fork の PR や対象外の event の判定はスクリプトに任せる。
      # 取り込めないときは、キャッシュなしで動かす。
      - name: Find nx cache source
        id: nxsrc
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: nx-cache-tests-${{ matrix.slug }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: .githooks/ci/fetch-pr-nx-cache.sh

      - name: Download nx cache
        id: nxdl
        if: steps.nxsrc.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nx-cache-tests-${{ matrix.slug }}
          run-id: ${{ steps.nxsrc.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .pecot/tmp/ci/nx-remote

      - name: Record nx cache download result
        if: steps.nxdl.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SRC_RUN_ID: ${{ steps.nxsrc.outputs.run_id }}
          ARTIFACT_NAME: nx-cache-tests-${{ matrix.slug }}
        run: .githooks/ci/fetch-pr-nx-cache.sh --download-failed

      # GITHUB_ACTIONS は nx の ::group:: で切り出しが崩れるため、env に渡さない。
      - name: Start dev container
        id: up
        run: .githooks/ci/dev-container.sh up

      # exec の cwd は /workspaces/base のため、cd してから動かす。
      - name: Run checks
        id: verify
        env:
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && .githooks/ci/run-pr-checks.sh --part=tests --lane="$CHECKS_LANE" "$NX_BASE" "$NX_HEAD"'

      - name: Restore workspace owner
        if: always()
        run: .githooks/ci/dev-container.sh restore-owner

      # チェックが途中で止まると完了の印が付かないため、印が無ければ失敗にする。
      - name: Write job summary
        if: always()
        env:
          UP_OUTCOME: ${{ steps.up.outcome }}
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: .githooks/ci/finish-ci-summary.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-tests-${{ matrix.slug }}
          path: |
            .pecot/tmp/nx-affected-tests/
            .pecot/tmp/githooks-timing.tsv
            .pecot/tmp/ci/step-summary.md
          if-no-files-found: ignore

      # 失敗した job の結果を取り込み元にしないため、always() を付けず成功時だけ上げる。
      - name: Upload nx cache
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx-cache-tests-${{ matrix.slug }}
          path: .pecot/tmp/ci/nx-upload/
          retention-days: 7
          if-no-files-found: ignore

  # ci-result の needs には入れない。main の push で飛ばしても、ci-result の結果は変わらない。
  version-plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # pnpm の版は package.json の packageManager が決める。
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter pecot

      # 判定できないときも失敗にするため、PECOT_VERSION_PLAN_STRICT を渡す。
      - name: Check version plan
        env:
          PRE_COMMIT_TO_REF: HEAD
          PECOT_VERSION_PLAN_BASE: origin/main
          PECOT_VERSION_PLAN_STRICT: "1"
        run: .githooks/ci/check-version-plan.sh

  ci-result:
    needs: [checks, lanes, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 取り消された matrix の job があっても、needs.checks.result が success になる報告がある
      # （community discussion #211624）。そのため、job の conclusion を直接確かめる。
      - name: Require checks to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          LANES_RESULT: ${{ needs.lanes.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          LANES_COUNT: ${{ needs.lanes.outputs.count }}
          LANES_JSON: ${{ needs.lanes.outputs.lanes }}
          GH_TOKEN: ${{ github.token }}
        run: .githooks/ci/check-ci-result.sh
