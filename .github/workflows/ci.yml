name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint・githooks・tests を 3 つの job に分けて同時に動かす。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [lint, githooks, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # error-on-no-successful-workflow は書かない。成功した run が無いとき、noPreviousBuild=true で全レーンのモードに入る。
      - name: Derive base and head SHAs
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      # push: never にする。省くと main の push で image を push しようとする。
      # GITHUB_STEP_SUMMARY は Action が固定するため、GITHUB_ACTIONS は nx の ::group:: で切り出しが崩れるため、env に渡さない。
      - name: Start dev container
        id: up
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          push: never
          runCmd: "true"
          env: |
            CI
            NX_BASE
            NX_HEAD
            NO_PREV
            PECOT_NX_CI=1
            PECOTV_E2E_CEILING_SCALE=3
            PECOT_CI_IMAGE=ghcr.io/pecotcraft/pecot-devcontainer
            PECOT_CI_SUMMARY=/workspaces/base/pecot/.pecot/tmp/ci/step-summary.md

      # exec の cwd は /workspaces/base のため、cd してから動かす。
      - name: Run checks
        id: verify
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
          CHECKS_PART: ${{ matrix.part }}
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          push: never
          runCmd: cd /workspaces/base/pecot && .githooks/ci/run-pr-checks.sh --part="$CHECKS_PART" "$NX_BASE" "$NX_HEAD"
          env: |
            CI
            NX_BASE
            NX_HEAD
            NO_PREV
            CHECKS_PART
            PECOT_NX_CI=1
            PECOTV_E2E_CEILING_SCALE=3
            PECOT_CI_IMAGE=ghcr.io/pecotcraft/pecot-devcontainer
            PECOT_CI_SUMMARY=/workspaces/base/pecot/.pecot/tmp/ci/step-summary.md

      # buildx が無いと Action は警告だけで成功するため、完了の印が無ければ失敗にする。
      - name: Write job summary
        if: always()
        env:
          UP_OUTCOME: ${{ steps.up.outcome }}
        run: .githooks/ci/finish-ci-summary.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ matrix.part }}
          path: |
            .pecot/tmp/pre-push/
            .pecot/tmp/githooks-timing.tsv
            .pecot/tmp/ci/step-summary.md
          if-no-files-found: ignore

  ci-result:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 取り消された matrix の job があっても、needs.checks.result が success になる報告がある
      # （community discussion #211624）。そのため、3 件の job の conclusion を直接確かめる。
      - name: Require checks to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "checks: $CHECKS_RESULT"
          [ "$CHECKS_RESULT" = "success" ]
          jobs=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs)
          for part in lint githooks tests; do
            conclusion=$(jq -r --arg name "checks ($part)" '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].conclusion else "missing" end' <<< "$jobs")
            echo "checks ($part): $conclusion"
            [ "$conclusion" = "success" ]
          done
