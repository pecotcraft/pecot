# PR と main への push で、変更が届いたレーンの lint とテストを devcontainer の中で動かす。
# 検証の本体は .githooks/ci/run-pr-checks.sh で、pre-commit の 3 つの stage を範囲指定で呼ぶ。
# 結果は ci-result のチェックと Step Summary に出す。
# merge_group の起動と version-plan の job は Phase 6 で足す。
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # error-on-no-successful-workflow は書かない（既定の false）。
      # 成功した run が無いとき、失敗にせず origin/main~1 と noPreviousBuild=true を返させ、全レーンのモードに入る。
      - name: 範囲の base を決める
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      # build・up・post-create までをここで済ませる。runCmd は何もしない。
      # push: never にする。省くと main の push で image を push しようとする。
      # env は 1 行に 1 件で書く。値を書かない名前は、step / job の env から取る。
      # GITHUB_STEP_SUMMARY は渡さない。Action がこの step のファイルに固定する。
      # GITHUB_ACTIONS は渡さない。nx が ::group:: を出し、レーンの塊の切り出しが崩れる。
      - name: コンテナを取得・起動する
        id: up
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          push: never
          runCmd: "true"
          env: |
            CI
            NX_BASE
            NX_HEAD
            NO_PREV
            PECOT_NX_CI=1
            PECOT_CI_IMAGE=ghcr.io/pecotcraft/pecot-devcontainer
            PECOT_CI_SUMMARY=/workspaces/base/pecot/.pecot/tmp/ci/step-summary.md

      # 既にあるコンテナを使う。post-create は再び動かない。
      # exec の cwd は /workspaces/base のため、cd してから動かす。
      - name: 検証する
        id: verify
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          push: never
          runCmd: cd /workspaces/base/pecot && .githooks/ci/run-pr-checks.sh "$NX_BASE" "$NX_HEAD"
          env: |
            CI
            NX_BASE
            NX_HEAD
            NO_PREV
            PECOT_NX_CI=1
            PECOT_CI_IMAGE=ghcr.io/pecotcraft/pecot-devcontainer
            PECOT_CI_SUMMARY=/workspaces/base/pecot/.pecot/tmp/ci/step-summary.md

      # buildx が無いと Action は警告だけで成功する。完了の印（done）が無ければ失敗にする。
      - name: Summary を書き写す
        if: always()
        env:
          UP_OUTCOME: ${{ steps.up.outcome }}
        run: .githooks/ci/finish-ci-summary.sh

      - name: ログを artifact に上げる
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs
          path: |
            .pecot/tmp/pre-push/
            .pecot/tmp/githooks-timing.tsv
          if-no-files-found: ignore

  ci-result:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checks の結果を確かめる
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $CHECKS_RESULT"
          [ "$CHECKS_RESULT" = "success" ]
