name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  packages: read
  pull-requests: read

env:
  PECOT_NX_CI: "1"
  PECOTV_E2E_CEILING_SCALE: "3"
  PECOT_NX_PARALLEL: "2"
  PECOT_CI_SUMMARY: /workspaces/base/pecot/.pecot/tmp/ci/step-summary.md

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint と、変更が届いたレーンごとの tests を別の job に分けて同時に動かす。
  # main が進んでいない merge queue では lanes が lint=skip を出し、lint の runner を立てない。
  checks:
    needs: lanes
    if: ${{ !cancelled() && needs.lanes.outputs.lint != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHECKS_PART: ${{ matrix.part }}
      # 共通の名前は dev-container.sh が渡す。ここには job 固有の名前だけを書く。
      DEVCONTAINER_ENV: |
        CHECKS_PART
    strategy:
      fail-fast: false
      matrix:
        # 要素は 1 つ。job 名 `checks (lint)` と artifact 名 `ci-logs-lint` を保つために matrix を残す。
        part: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &prefetch
        name: Start pulling dev container image
        run: .githooks/ci/dev-container.sh prefetch

      - name: Derive base and head SHAs
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      # GITHUB_ACTIONS は nx の ::group:: で切り出しが崩れるため、env に渡さない。
      - name: Start dev container
        id: up
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
        run: .githooks/ci/dev-container.sh up

      # exec の cwd は /workspaces/base のため、cd してから動かす。
      - name: Run checks
        id: verify
        env:
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && .githooks/ci/run-pr-checks.sh --part="$CHECKS_PART" "$NX_BASE" "$NX_HEAD"'

      - &restore-owner
        name: Restore workspace owner
        if: always()
        run: .githooks/ci/dev-container.sh restore-owner

      # チェックが途中で止まると完了の印が付かないため、印が無ければ失敗にする。
      - &job-summary
        name: Write job summary
        if: always()
        env:
          UP_OUTCOME: ${{ steps.up.outcome }}
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: .githooks/ci/finish-ci-summary.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ matrix.part }}
          path: |
            .pecot/tmp/nx-affected-tests/
            .pecot/tmp/githooks-timing.tsv
            .pecot/tmp/ci/step-summary.md
          if-no-files-found: ignore

  # tests の job が使う base・head・NO_PREV はここでだけ決める。job ごとに決めると、その間に別の run が終わって base がずれる。
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lanes: ${{ steps.list.outputs.lanes }}
      count: ${{ steps.list.outputs.count }}
      lint: ${{ steps.list.outputs.lint }}
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      no_prev: ${{ steps.shas.outputs.noPreviousBuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive base and head SHAs
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # pnpm の版は package.json の packageManager が決める。
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter pecot

      # merge queue の lanes が PR の CI で test した main を知るための印。同じ repo の PR だけが上げる。
      - name: Write ci-base
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p .pecot/tmp/ci/ci-base
          {
            echo "main_sha=$(git rev-parse HEAD^1)"
            echo "pr_head=$(git rev-parse HEAD^2)"
          } > .pecot/tmp/ci/ci-base/ci-base.txt

      - name: Upload ci-base
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-base
          path: .pecot/tmp/ci/ci-base/ci-base.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # 失敗しても pr_main が空になるだけで、全レーンを動かす側に倒れる。
      - name: Find PR CI base
        id: prbase
        if: github.event_name == 'merge_group'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: .githooks/ci/find-pr-ci-base.sh >> "$GITHUB_OUTPUT"

      - name: List test lanes
        id: list
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
          NO_PREV: ${{ steps.shas.outputs.noPreviousBuild }}
          PR_MAIN: ${{ steps.prbase.outputs.pr_main }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          args=()
          if [ -n "$PR_MAIN" ]; then
            args+=(--pr-main="$PR_MAIN" --queue-base="$QUEUE_BASE")
          fi
          .githooks/ci/list-test-lanes.sh "${args[@]}" "$NX_BASE" "$NX_HEAD" >> "$GITHUB_OUTPUT"

  # レーンが 0 本のとき、空の matrix は GitHub がエラーにするため job ごと飛ばす。
  tests:
    needs: lanes
    if: needs.lanes.outputs.count != '0'
    name: tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_BASE: ${{ needs.lanes.outputs.base }}
      NX_HEAD: ${{ needs.lanes.outputs.head }}
      NO_PREV: ${{ needs.lanes.outputs.no_prev }}
      CHECKS_LANE: ${{ matrix.lane }}
      CHECKS_SLUG: ${{ matrix.slug }}
      PECOT_CI_NX_CACHE: /workspaces/base/pecot/.pecot/tmp/ci/nx-remote
      # Chromium を使うテストは、pecot-visual と interface-spec:test-site にある。別のレーンに足すときは、この条件も直す。
      PECOT_CI_BROWSER: ${{ (startsWith(matrix.lane, 'pecot-visual:') || matrix.lane == 'interface-spec:test-site') && '1' || '0' }}
      # 共通の名前は dev-container.sh が渡す。ここには job 固有の名前だけを書く。
      DEVCONTAINER_ENV: |
        CHECKS_LANE
        CHECKS_SLUG
        PECOT_CI_NX_CACHE
        PECOT_CI_BROWSER
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lanes.outputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *prefetch

      # 取り込むのは同じ repo の同じ PR の run の artifact だけにする。fork の PR や対象外の event の判定はスクリプトに任せる。
      # 取り込めないときは、キャッシュなしで動かす。
      - name: Find nx cache source
        id: nxsrc
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: nx-cache-tests-${{ matrix.slug }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: .githooks/ci/fetch-pr-nx-cache.sh

      - name: Download nx cache
        id: nxdl
        if: steps.nxsrc.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nx-cache-tests-${{ matrix.slug }}
          run-id: ${{ steps.nxsrc.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .pecot/tmp/ci/nx-remote

      - name: Record nx cache download result
        if: steps.nxdl.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SRC_RUN_ID: ${{ steps.nxsrc.outputs.run_id }}
          ARTIFACT_NAME: nx-cache-tests-${{ matrix.slug }}
        run: .githooks/ci/fetch-pr-nx-cache.sh --download-failed

      # GITHUB_ACTIONS は nx の ::group:: で切り出しが崩れるため、env に渡さない。
      - name: Start dev container
        id: up
        run: .githooks/ci/dev-container.sh up

      # exec の cwd は /workspaces/base のため、cd してから動かす。
      - name: Run checks
        id: verify
        env:
          PECOT_CI_IMAGE: ${{ steps.up.outputs.image }}
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && .githooks/ci/run-pr-checks.sh --part=tests --lane="$CHECKS_LANE" "$NX_BASE" "$NX_HEAD"'

      - *restore-owner

      # pages-preview が PR 版の合否に使う。JUnit は dev container の中で書かれるので、持ち主を戻した後に写す。
      # PR 版の失敗で tests を落とさない。欠けた JUnit は pages-preview の Collect JUnit が止める。
      - name: Stage JUnit
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          junit=$(python3 .githooks/scripts/pages_site/lanes.py | jq -r --arg lane "$CHECKS_LANE" '.[] | select(.lane == $lane) | .junit')
          if [ -z "$junit" ] || [ ! -f "$junit" ]; then
            echo "no JUnit to stage for $CHECKS_LANE"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/pages-junit/$(dirname "$junit")"
          cp "$junit" "$RUNNER_TEMP/pages-junit/$junit"

      # path はディレクトリにする。ファイル 1 つだと階層が消え、merge-multiple で junit.xml どうしがぶつかる。
      - name: Upload JUnit
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-junit-${{ matrix.slug }}
          path: ${{ runner.temp }}/pages-junit/
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      # チェックが途中で止まると完了の印が付かないため、印が無ければ失敗にする。
      - *job-summary

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-tests-${{ matrix.slug }}
          path: |
            .pecot/tmp/nx-affected-tests/
            .pecot/tmp/githooks-timing.tsv
            .pecot/tmp/ci/step-summary.md
          if-no-files-found: ignore

      # 失敗した job の結果を取り込み元にしないため、always() を付けず成功時だけ上げる。
      - name: Upload nx cache
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx-cache-tests-${{ matrix.slug }}
          path: .pecot/tmp/ci/nx-upload/
          retention-days: 7
          if-no-files-found: ignore

  # 公開サイトの PR 版を、tests の JUnit と開発版の JUnit で作る。テストは動かさない。
  # ci-result の needs に入れず、PR 版の失敗でマージを止めない。確かめと公開は pages-deploy.yml が行う。
  pages-preview:
    needs: [lanes, tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.lanes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PECOT_SITE_STRICT: "1"
      PECOT_SITE_SIDE: pr
      PECOT_SITE_PR: ${{ github.event.pull_request.number }}
      DEVCONTAINER_ENV: |
        PECOT_SITE_STRICT
        PECOT_SITE_SIDE
        PECOT_SITE_PR
    steps:
      # PR 版の中身は、ci がテストした merge のコミットでなく PR の head に合わせる。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - *prefetch

      - name: Download lane JUnit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pages-junit-*
          merge-multiple: true
          path: ${{ runner.temp }}/pages-junit

      - name: Find dev side
        id: dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .githooks/scripts/pages_site/dev_side.py --repo "$REPO"

      - name: Download dev JUnit
        id: devdl
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-side-dev
          run-id: ${{ steps.dev.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pages-dev

      - name: Explain missing dev side
        if: failure() && steps.devdl.outcome == 'failure'
        env:
          DEV_RUN_ID: ${{ steps.dev.outputs.run_id }}
        run: |
          echo "::error::pages-side-dev of run $DEV_RUN_ID is not available. Rebuild the dev side: gh workflow run pages-build.yml --ref main -f side=dev"
          exit 1

      - name: Collect JUnit
        env:
          RAN: ${{ needs.lanes.outputs.lanes }}
          DEV_SHA: ${{ steps.dev.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .githooks/scripts/pages_site/collect.py --out "$RUNNER_TEMP/pages-side" \
            --side pr --pr "$PR" --sha "$SHA" --ran "$RAN" \
            --ci-dir "$RUNNER_TEMP/pages-junit" --dev-dir "$RUNNER_TEMP/pages-dev" --dev-sha "$DEV_SHA" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Start dev container
        run: .githooks/ci/dev-container.sh up

      - name: Build site
        run: |
          # shellcheck disable=SC2016
          .githooks/ci/dev-container.sh exec -- 'cd /workspaces/base/pecot && pnpm exec nx run interface-spec:docs --skip-nx-cache'

      - *restore-owner

      - name: Pack site
        run: tar -C libs/interface-spec/docs/_build -cf "$RUNNER_TEMP/pages-side/site.tar" .

      - name: Upload side
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-side-dev
          path: ${{ runner.temp }}/pages-side/
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  version-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # pnpm の版は package.json の packageManager が決める。
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter pecot

      # 判定できないときも失敗にするため、PECOT_VERSION_PLAN_STRICT を渡す。
      - name: Check version plan
        env:
          PRE_COMMIT_TO_REF: HEAD
          PECOT_VERSION_PLAN_BASE: origin/main
          PECOT_VERSION_PLAN_STRICT: "1"
        run: .githooks/ci/check-version-plan.sh

  ci-result:
    needs: [checks, lanes, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 取り消された matrix の job があっても、needs.checks.result が success になる報告がある
      # （community discussion #211624）。そのため、job の conclusion を直接確かめる。
      - name: Require checks to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          LANES_RESULT: ${{ needs.lanes.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          LANES_COUNT: ${{ needs.lanes.outputs.count }}
          LINT_MODE: ${{ needs.lanes.outputs.lint }}
          LANES_JSON: ${{ needs.lanes.outputs.lanes }}
          GH_TOKEN: ${{ github.token }}
        run: .githooks/ci/check-ci-result.sh
