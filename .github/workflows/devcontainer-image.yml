# .devcontainer/ の定義から CI 用のイメージを build し、GHCR へ push する。
# tag は .devcontainer/ の tree hash の def-<tree> で、main のときだけ latest も付ける。
# push するのは push・schedule・workflow_dispatch のときだけにする。
# PR では build だけを動かし、マージ前に Dockerfile が通ることを確かめる。
# 週 1 回の schedule は --no-cache で動かす。自分のイメージを cache に使うため、
# --no-cache が無いと apt のパッケージと features が新しくならない。
name: devcontainer-image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR では push しないので、ログインは要らない。
      # fork からの PR は packages: write が使えず、ログインが失敗するため飛ばす。
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # npm は repo の devEngines で止まるため、cwd を / にして入れる。
      - name: Install devcontainer CLI
        run: cd / && npm install -g @devcontainers/cli@0.90.0

      # 層は zstd で push する。gzip だと、CI の job の pull で展開に 20 秒以上かかる。
      # PR では push せず build だけにする。latest は main のときだけ付ける。
      - name: Build and push image
        env:
          REPO: ghcr.io/pecotcraft/pecot-devcontainer
          NO_CACHE: ${{ github.event_name == 'schedule' }}
        run: |
          tree=$(git rev-parse HEAD:.devcontainer)
          args=(--workspace-folder . --image-name "$REPO:def-$tree" --cache-from "$REPO:latest")
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            args+=(--image-name "$REPO:latest")
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            args+=(--output "type=registry,compression=zstd,force-compression=true,oci-mediatypes=true")
          fi
          if [ "$NO_CACHE" = true ]; then
            args+=(--no-cache)
          fi
          devcontainer build "${args[@]}"
