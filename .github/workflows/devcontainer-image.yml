# .devcontainer/ の定義から CI 用のイメージを build し、GHCR へ push する。
# tag は dev-container.sh tag が出す def-<key>（.devcontainer/ の定義の hash）で、main のときだけ latest を付ける。
# main 以外の ref では、def-<key> が既にあれば build と push を飛ばす。
# push するのは push・schedule・workflow_dispatch のときだけにする。
# PR では build だけを動かし、マージ前に Dockerfile が通ることを確かめる。
# 週 1 回の schedule は --no-cache で動かす。自分のイメージを cache に使うため、
# --no-cache が無いと apt のパッケージと features が新しくならない。
name: devcontainer-image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR では push しないので、ログインは要らない。
      # fork からの PR は packages: write が使えず、ログインが失敗するため飛ばす。
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: .githooks/ci/dev-container.sh install-cli

      # 層は zstd で push する。gzip だと、CI の job の pull で展開に 20 秒以上かかる。
      # PR では push せず build だけにする。latest は main のときだけ付ける。
      # feature ブランチの実行で、main が使う def-<key> を上書きしない。
      - name: Build and push image
        env:
          REPO: ghcr.io/pecotcraft/pecot-devcontainer
          PECOT_CI_IMAGE_REPO: ghcr.io/pecotcraft/pecot-devcontainer
          NO_CACHE: ${{ github.event_name == 'schedule' }}
          # buildx は何も指定しないと unknown/unknown の attestation manifest を付け、GHCR の一覧に余計な行が出る。
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          ref=$(.githooks/ci/dev-container.sh tag)
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" != refs/heads/main ] \
            && docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "$ref already exists. Skip build and push."
            exit 0
          fi
          args=(--workspace-folder . --image-name "$ref" --cache-from "$REPO:latest")
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            args+=(--image-name "$REPO:latest")
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            args+=(--output "type=registry,compression=zstd,force-compression=true,oci-mediatypes=true")
          fi
          if [ "$NO_CACHE" = true ]; then
            args+=(--no-cache)
          fi
          devcontainer build "${args[@]}"
