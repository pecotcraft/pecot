# .devcontainer/ の定義から CI 用のイメージを build し、GHCR へ push する。
# tag は .devcontainer/ の tree hash の def-<tree> で、main のときだけ latest も付ける。
# push するのは push・schedule・workflow_dispatch のときだけにする。
# PR では build だけを動かし、マージ前に Dockerfile が通ることを確かめる。
# 週 1 回の schedule は noCache で動かす。自分のイメージを cache に使うため、
# noCache が無いと apt のパッケージと features が新しくならない。
name: devcontainer-image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR では push しないので、ログインは要らない。
      # fork からの PR は packages: write が使えず、ログインが失敗するため飛ばす。
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          tree=$(git rev-parse HEAD:.devcontainer)
          tags="def-$tree"
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            tags="$tags,latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # runCmd を書かない。省くと devcontainer build だけが動き、lifecycle は動かない。
      # devcontainers/ci は post 処理で push するため、latest を後の step で付け直せない。tag が複数だと cacheFrom を自動で足さないため、明示する。
      # eventFilterForPush は 1 行に 1 件で書く。カンマ区切りは 1 件として読まれ、push されない。
      - name: Build and push image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          imageTag: ${{ steps.tags.outputs.tags }}
          cacheFrom: ghcr.io/pecotcraft/pecot-devcontainer:latest
          push: filter
          eventFilterForPush: |
            push
            schedule
            workflow_dispatch
          noCache: ${{ github.event_name == 'schedule' }}
