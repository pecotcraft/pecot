# Dependabot の PR に、runtime-lock・version plan・playwright-deps の版の commit を足す。
# devcontainer のイメージは push の前に載せる。
# push は App のトークンで行う。GITHUB_TOKEN の push で起きる ci の run は承認待ちで止まる。client id と鍵は Dependabot secrets から読む。
name: dependabot-commit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependabot-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # App の push で起きる run は actor が App になり、Dependabot secrets を読めない。
      # その run では lock と plan の差分が無く push もしないので、トークンを作らない。
      - name: Generate GitHub App token
        id: app-token
        if: ${{ github.actor == 'dependabot[bot]' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PECOT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PECOT_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # pnpm の版は package.json の packageManager が決める。
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate runtime lock
        run: node .githooks/scripts/gen-runtime-lock.mjs --write

      - name: Sync playwright-deps version
        run: node .githooks/scripts/sync-playwright-deps.mjs

      - name: Create version plans
        id: plans
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node .nx/nx-release/src/dependabot-plans.js --pr "$PR_NUMBER" --base "origin/$BASE_REF"

      # commit の本文の [dependabot skip] が無いと、dependabot は他者の commit がある PR を rebase しなくなる。
      # 固定するテスト: .githooks/tests/test_gen_runtime_lock.py
      - name: Commit generated files
        id: commit
        env:
          COMMIT_MSG: "chore(repo): runtime-lock・version plan と devcontainer の playwright-deps の版を dependabot の更新から作る"
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          NO_TOKEN_MSG: "App のトークンが無く、lock と plan を push できない。PR で @dependabot recreate を打つ"
        run: |
          git add -A -- ':(glob)**/runtime-*.yaml' .nx/version-plans .devcontainer/devcontainer.json
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$HAS_APP_TOKEN" = "false" ]; then
            echo "::error::${NO_TOKEN_MSG}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MSG" -m "[dependabot skip]"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          if git diff --name-only HEAD~1 HEAD | grep -qx '.devcontainer/devcontainer.json'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

      # push で起きる ci の job が def-<key> を pull できるよう、push の前にイメージを載せる。
      - name: Log in to GHCR
        id: login
        if: ${{ steps.commit.outputs.image == 'true' }}
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish devcontainer image
        id: publish
        if: ${{ steps.commit.outputs.image == 'true' }}
        continue-on-error: true
        env:
          PECOT_CI_IMAGE_REPO: ghcr.io/pecotcraft/pecot-devcontainer
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          .githooks/ci/dev-container.sh install-cli
          .githooks/ci/dev-container.sh publish --push --base "$BASE_REF"

      # 載せられなくても push は続ける。ci は PR の定義から build して通る。
      - name: Warn when image was not published
        if: ${{ steps.commit.outputs.image == 'true' && (steps.login.outcome == 'failure' || steps.publish.outcome == 'failure') }}
        run: |
          msg="イメージを載せられなかった。ci は build に回る"
          echo "::warning::${msg}"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Push generated files
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:${HEAD_REF}"

      - name: Fail when version plans were not created
        if: ${{ steps.plans.outcome == 'failure' }}
        env:
          PLANS_FAILED_MSG: "version plan を作れなかった。runtime-lock は push した。ログを見て、PR で @dependabot recreate を打つ"
        run: |
          echo "::error::${PLANS_FAILED_MSG}"
          exit 1
