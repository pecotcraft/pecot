# main の security alert（Dependabot・code scanning・secret scanning）を読み、ボードの Tracker の一覧にそろえる。
# App の webhook と EventBridge Scheduler（.github/board-sync/ の Lambda）が、workflow_dispatch で起動する。
# schedule（毎時 17 分）は、AWS 側の障害に備えた最後の補助で、1 時間は保証しない。
# GITHUB_TOKEN は secret scanning の alert と org の Projects を扱えないため、GitHub App のトークンを使う。
# 変数 SECURITY_APP_CLIENT_ID が空の間は job を飛ばし、失敗の通知を出さない。
# 利用者に見せる文は env に置き、run のシェルは日本語を持たない形にする。
name: security-alerts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-alerts
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.SECURITY_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # bin/pecot の初回起動が、実行用ミラーの依存導入に pnpm を使う。
      - name: Enable Corepack
        run: corepack enable

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SECURITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-organization-projects: write
          permission-security-events: read
          permission-secret-scanning-alerts: read
          permission-vulnerability-alerts: read

      - name: Sync security alerts
        env:
          PECOT_GITHUB_COM_TOKEN: ${{ steps.app-token.outputs.token }}
        run: plugins/pecot-workflow/bin/pecot tracker sync security
