# 承認なしで動くリリース。dry-run=true（既定）は案だけ、false は sha の案から release を出す。
# 利用者に見せる文は env に置き、run のシェルは日本語を持たない。
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "true は案だけを出す。false で本番（sha が必須）"
        type: boolean
        default: true
      sha:
        description: "本番で使う main の SHA（dry-run の run の headSha）"
        type: string
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && vars.PECOT_BOT_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-plan
    steps:
      - name: Check sha input
        id: sha-input
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          INPUT_SHA: ${{ inputs.sha }}
          MSG_SHA_REQUIRED: "本番には sha（dry-run の run の headSha）が必要です。"
          MSG_SHA_FORMAT: "sha は 40 桁の小文字 16 進で指定してください（ブランチ名や短い SHA は使えません）。"
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$INPUT_SHA" ]; then
            echo "::error::$MSG_SHA_REQUIRED"
            exit 1
          fi
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$MSG_SHA_FORMAT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify sha
        id: verify-sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          MSG_SHA_NOT_IN_MAIN: "sha が origin/main の祖先ではありません。dry-run をやり直してください。"
        run: |
          if [ -n "$INPUT_SHA" ] && ! git merge-base --is-ancestor "$INPUT_SHA" origin/main; then
            echo "::error::$MSG_SHA_NOT_IN_MAIN"
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PECOT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PECOT_BOT_PRIVATE_KEY }}
          permission-contents: ${{ inputs.dry-run && 'read' || 'write' }}
          # publish-npm.yml の起動（attach-mcp-tgz.sh）に要る。
          permission-actions: ${{ !inputs.dry-run && 'write' || '' }}
          permission-vulnerability-alerts: read
          permission-security-events: read
          permission-secret-scanning-alerts: read

      - name: Resolve bot identity
        id: bot
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # コンテナより先にホストで作り、Summary を書く側の持ち主にそろえる。
      - name: Prepare output directory
        run: mkdir -p .pecot/tmp/release

      # push: never にする。省くと main で image を push しようとする。
      - name: Start dev container
        id: up
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          CI: "true"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PECOT_GITHUB_COM_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          push: never
          runCmd: "true"
          env: &release-env |
            CI
            GH_TOKEN
            PECOT_GITHUB_COM_TOKEN
            DRY_RUN
            BOT_NAME
            BOT_EMAIL
            RUN_ID
            RUN_ATTEMPT

      # 本番は nx が失敗しても、一時ブランチが残っていれば land で bump を main へ入れる。
      - name: Run release
        id: release
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          CI: "true"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PECOT_GITHUB_COM_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          imageName: ghcr.io/pecotcraft/pecot-devcontainer
          push: never
          runCmd: |
            cd /workspaces/base/pecot &&
            d=.pecot/tmp/release &&
            run() { n=$1; shift; "$@" > "$d/$n.log" 2>&1; rc=$?; cat "$d/$n.log"; return $rc; } &&
            run preflight plugins/pecot-workflow/bin/pecot release preflight &&
            if [ "$DRY_RUN" = true ]; then
              run nx pnpm exec nx release --dry-run --verbose --yes
            else
              git config user.name "$BOT_NAME" &&
              git config user.email "$BOT_EMAIL" &&
              gh auth setup-git &&
              base=$(git rev-parse HEAD) &&
              branch="release/run-${RUN_ID}-${RUN_ATTEMPT}" &&
              git switch -c "$branch" || exit 1
              nx_rc=0
              run nx env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=push.default GIT_CONFIG_VALUE_0=current pnpm exec nx release --verbose --yes || nx_rc=$?
              land_rc=0
              ls_out=$(git ls-remote --exit-code origin "refs/heads/$branch" 2>&1)
              ls_rc=$?
              if [ "$ls_rc" -eq 0 ]; then
                run land .githooks/scripts/release-land.sh "$base" "$branch" || land_rc=$?
              elif [ "$ls_rc" -ne 2 ]; then
                { echo "error: git ls-remote failed with exit code $ls_rc (branch: $branch)"; printf '%s\n' "$ls_out" | sed 's/^/  /'; } > "$d/land.log"
                cat "$d/land.log"
                land_rc=$ls_rc
              fi
              [ "$nx_rc" -eq 0 ] || exit "$nx_rc"
              exit "$land_rc"
            fi
          env: *release-env

      # GITHUB_STEP_SUMMARY はコンテナの中から書けないため、ログをここでまとめる。
      - name: Write job summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          SHA_INPUT_OUTCOME: ${{ steps.sha-input.outcome }}
          SHA_VERIFY_OUTCOME: ${{ steps.verify-sha.outcome }}
          UP_OUTCOME: ${{ steps.up.outcome }}
          RUN_OUTCOME: ${{ steps.release.outcome }}
          MSG_SHA_FAILED: "sha の確認で止まりました（入力の誤りで、基盤の失敗ではありません）。上の step のエラーを確かめてください。"
          MSG_UP_FAILED: "コンテナの取得・起動に失敗しました（基盤の失敗で、リリースの失敗ではありません）。"
          MSG_PLAN_FAILED: "案の作成に失敗しました。各ログを確かめてください。"
          MSG_RELEASE_FAILED: "リリースに失敗しました。各ログと、一時ブランチ release/run-* の有無を確かめてください。"
          MSG_NOT_RUN: "リリースの手順まで進みませんでした。失敗した step を確かめてください。"
        run: |
          d=.pecot/tmp/release
          fence='```'
          mkdir -p "$d"
          {
            if [ "$DRY_RUN" = "true" ]; then echo "## Release plan"; else echo "## Release"; fi
            echo
            if [ "$SHA_INPUT_OUTCOME" = "failure" ] || [ "$SHA_VERIFY_OUTCOME" = "failure" ]; then
              echo "$MSG_SHA_FAILED"
            elif [ "$UP_OUTCOME" = "failure" ]; then
              echo "$MSG_UP_FAILED"
            elif [ "$RUN_OUTCOME" = "failure" ]; then
              if [ "$DRY_RUN" = "true" ]; then echo "$MSG_PLAN_FAILED"; else echo "$MSG_RELEASE_FAILED"; fi
            elif [ "$RUN_OUTCOME" != "success" ]; then
              echo "$MSG_NOT_RUN"
            fi
            if [ -f "$d/land.log" ]; then
              landed="$(grep -E '^(landed|skipped|error):' "$d/land.log" | tail -n 50 || true)"
              if [ -n "$landed" ]; then
                echo
                echo "### land"
                echo
                printf '%s\n' "${fence}text"
                printf '%s\n' "$landed"
                echo "$fence"
              fi
            fi
            if [ -f "$d/preflight.log" ]; then
              warn="$(awk '/^warning:/ {on=1; print; next} on && /^[[:space:]]/ {print; next} {on=0}' "$d/preflight.log" | head -c 50000)"
              if [ -n "$warn" ]; then
                echo
                echo "### preflight warnings"
                echo
                printf '%s\n' "${fence}text"
                printf '%s\n' "$warn"
                echo "$fence"
              fi
            fi
            for n in preflight nx; do
              [ -f "$d/$n.log" ] || continue
              echo
              echo "<details><summary>$n</summary>"
              echo
              printf '%s\n' "${fence}text"
              tail -c 300000 "$d/$n.log"
              echo "$fence"
              echo
              echo "</details>"
            done
          } > "$d/summary.md"
          cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # gh では Step Summary を取れないため、w-release が読む用に artifact にも残す。
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.dry-run && 'release-plan' || 'release-log' }}
          path: .pecot/tmp/release/
          if-no-files-found: ignore
