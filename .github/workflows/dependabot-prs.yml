# 人の判断を待つ dependabot の PR を読み、ボードの Tracker の一覧にそろえる。
# App の webhook と EventBridge Scheduler（.github/board-sync/ の Lambda）が、workflow_dispatch で起動する。
# schedule（毎時 47 分）は、AWS 側の障害に備えた最後の補助。security-alerts.yml の 17 分とずらす。
# GITHUB_TOKEN は org の Projects を扱えないため、GitHub App のトークンを使う。
# App は security alert 用とは分け、この用途専用のものを使う。
# 変数 DEPENDABOT_PRS_APP_CLIENT_ID が空の間は job を飛ばし、失敗の通知を出さない。
name: dependabot-prs

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-prs
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.DEPENDABOT_PRS_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      # bin/pecot の初回起動が、実行用ミラーの依存導入に pnpm を使う。
      - name: Enable Corepack
        run: corepack enable

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_PRS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_PRS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-organization-projects: write
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-statuses: read

      - name: Sync dependabot PRs
        env:
          PECOT_GITHUB_COM_TOKEN: ${{ steps.app-token.outputs.token }}
        run: plugins/pecot-workflow/bin/pecot tracker sync dependabot
