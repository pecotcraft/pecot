# Dependabot の minor・patch の PR を、必須チェックが通ったら自動でマージする。
# マージは App のトークンで行う。GITHUB_TOKEN で入れた auto-merge は、後続の run を起こさないため。
# App の秘密が無い間は、notice を出して成功で終える。
name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # App の push による synchronize では動かさない。fetch-metadata が head の commit を見ると、App の commit で失敗するため。
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP: ${{ secrets.PECOT_BOT_CLIENT_ID != '' && secrets.PECOT_BOT_PRIVATE_KEY != '' }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Check app credentials
        if: ${{ env.HAS_APP != 'true' }}
        run: echo "::notice::App の秘密（PECOT_BOT_CLIENT_ID・PECOT_BOT_PRIVATE_KEY）が無いので、自動マージを飛ばします。"

      - name: Fetch Dependabot metadata
        id: metadata
        if: ${{ env.HAS_APP == 'true' }}
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # 必須チェックの無い branch では、gh が auto-merge でなく即座にマージするため、merge queue がある場合だけ進む。
      # major と playwright（devcontainer の版とそろえる）は人が見る。
      - name: Check merge queue
        id: queue
        if: ${{ env.HAS_APP == 'true' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch') && !contains(steps.metadata.outputs.dependency-names, 'playwright') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_NOTICE: merge queue が無効なので、自動マージを飛ばします。
        run: |
          enabled=$(gh pr view "$PR_URL" --json isMergeQueueEnabled -q .isMergeQueueEnabled)
          if [ "$enabled" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${SKIP_NOTICE}"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: ${{ steps.queue.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PECOT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PECOT_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: ${{ steps.queue.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "$PR_URL"
