name: pages-deploy

# pages-build.yml（定義書）と test-report.yml（レポート）の run を確かめる。pages-store のその側だけを差し替えて公開する。
# 決まりは specs/028-pages-site/contracts/pages.md。レポートの決まりは specs/030-allure-test-report/contracts/test-report.md。
# 形は .githooks/tests/test_pages_workflows.py が固定する。

on:
  workflow_run:
    workflows: [pages-build, test-report]
    types: [completed]
  # pages-store の今の中身を公開し直すだけ。
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      side: ${{ steps.verify.outputs.side }}
      kind: ${{ steps.verify.outputs.kind }}
      pr: ${{ steps.verify.outputs.pr }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      open_prs: ${{ steps.verify.outputs.open_prs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # artifact は作業ツリーの外に取り、中身は実行しない。
      - name: Verify run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 .githooks/scripts/pages_site/verify.py --run-id "$RUN_ID" --repo "$REPO" \
            --out "$RUNNER_TEMP/pages-verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified side
        if: steps.verify.outputs.side != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-verified
          path: ${{ runner.temp }}/pages-verified/
          retention-days: 1
          if-no-files-found: error

  # 合わない run と closed の PR の run でも、閉じた PR の掃除のために動く。手での起動は、pages-store の今の中身を上げるだけ。
  store:
    needs: verify
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # configure-pages は enablement が偽なら GET /repos/{owner}/{repo}/pages だけを呼ぶ。statuses は、変更の無い PR 版に付ける。
    permissions:
      contents: read
      pages: read
      statuses: write
    environment: pages-store
    # starter workflow と同じく、上げる job と deploy を group pages に並べる。保管も 1 つずつになる。
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      uploaded: ${{ steps.decide.outputs.uploaded }}
      version: ${{ steps.marker.outputs.version }}
    env:
      SIDE: ${{ needs.verify.outputs.side }}
      KIND: ${{ needs.verify.outputs.kind }}
      PR: ${{ needs.verify.outputs.pr }}
      HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
      OPEN_PRS: ${{ needs.verify.outputs.open_prs }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download verified side
        if: github.event_name == 'workflow_run' && env.SIDE != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-verified
          path: ${{ runner.temp }}/pages-verified

      # pages-store の ruleset の bypass は、この App だけ。client ID と秘密鍵は environment pages-store にだけ置く。
      - name: Generate GitHub App token
        id: app-token
        if: github.event_name == 'workflow_run'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PAGES_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_STORE_APP_PRIVATE_KEY }}
          permission-contents: write

      # トークンは URL に入れず、actions/checkout と同じ extraheader で渡す。レポートは --kind report で側の test-report/ に置く。
      - name: Store side
        id: publish
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          args=(--remote-url "https://github.com/$REPO.git" --open-prs "$OPEN_PRS" --run-id "$RUN_ID" --history . --main-ref origin/main --workdir "$RUNNER_TEMP/pages-store")
          if [ -n "$SIDE" ]; then
            verified="$RUNNER_TEMP/pages-verified"
            args+=(--side "$SIDE" --kind "$KIND" --sha "$HEAD_SHA")
            if [ "$KIND" = "report" ]; then
              args+=(--tar "$verified/report.tar")
              [ ! -f "$verified/report-sources.json" ] || args+=(--sources "$verified/report-sources.json")
            else
              args+=(--tar "$verified/site.tar")
              [ -z "$PR" ] || args+=(--pr "$PR")
              [ ! -f "$verified/release-sources.json" ] || args+=(--sources "$verified/release-sources.json")
            fi
          else
            args+=(--side none)
          fi
          python3 .githooks/scripts/pages_site/store.py publish "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      # 手での起動と、push の後に失敗した store のやり直しでも上げる（store.py は push 済みの中身に changed=false を返す）。
      - name: Decide upload
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          set -euo pipefail
          uploaded=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$RUN_ATTEMPT" != "1" ] || [ "$CHANGED" = "true" ]; then
            uploaded=true
          fi
          echo "uploaded=$uploaded" >> "$GITHUB_OUTPUT"

      # 同じ group の後の保管を待たせているので、取れるのはこの run が push した中身。
      - name: Checkout pages-store
        if: steps.decide.outputs.uploaded == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages-store
          path: pages-site
          persist-credentials: false

      # deploy の job が公開の後に読み戻す目印。pages-store には commit しない。run の番号で、中身の変わらない deploy も見分ける。
      - name: Write version marker
        id: marker
        if: steps.decide.outputs.uploaded == 'true'
        run: |
          set -euo pipefail
          version="$(git -C pages-site rev-parse HEAD) ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$version" > pages-site/pages-version.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.decide.outputs.uploaded == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.decide.outputs.uploaded == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site

      # 変更が無く deploy を飛ばす PR 版は、保管済みの中身を指してここで付ける。
      - name: Set preview status
        if: env.SIDE == 'pr' && steps.decide.outputs.uploaded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.verify.outputs.pr }}
          HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="pages / preview" \
            -f target_url="https://pecotcraft.github.io/pecot/pr/$PR/" \
            -f description="PR preview is published"

  # 上げた直後の artifact は deploy-pages の照会に出ないことがある。starter workflow と同じく job を分ける（actions/deploy-pages#451）。
  deploy:
    needs: [verify, store]
    if: ${{ !cancelled() && needs.store.result == 'success' && needs.store.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    # deploy 5 分・確かめ 3 分・待ち 1 分・deploy し直し 5 分・確かめ 3 分に余裕を足す。
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.redeploy.outputs.page_url || steps.deployment.outputs.page_url }}
    # PR への push のたびに deploy が起きるので、待っている deploy を取り消さずに並べる。
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .githooks/scripts/pages_site
          persist-credentials: false

      # 直前の deploy の処理中は作成を断られる。断られても、待って deploy し直す。
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      # 成功を報告しても公開されないことがある（actions/deploy-pages#383）。出そろうまで group pages を持つ。
      - name: Check served
        id: served
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERSION: ${{ needs.store.outputs.version }}
        run: python3 .githooks/scripts/pages_site/served.py --page-url "$PAGE_URL" --expect "$VERSION"

      - name: Wait before redeploy
        if: steps.served.outputs.served != 'true'
        run: sleep 60

      - name: Redeploy to GitHub Pages
        id: redeploy
        if: steps.served.outputs.served != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      - name: Check redeployed
        if: steps.redeploy.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.redeploy.outputs.page_url }}
          VERSION: ${{ needs.store.outputs.version }}
        run: python3 .githooks/scripts/pages_site/served.py --page-url "$PAGE_URL" --expect "$VERSION" --require

      # 開いたときに中身があるように、deploy の後で付ける。
      - name: Set preview status
        if: needs.verify.outputs.side == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.verify.outputs.pr }}
          HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="pages / preview" \
            -f target_url="https://pecotcraft.github.io/pecot/pr/$PR/" \
            -f description="PR preview is published"
