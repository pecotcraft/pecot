name: pages-deploy

# pages-build.yml（定義書）と test-report.yml（レポート）の run を確かめる。pages-store のその側だけを差し替えて公開する。
# 決まりは specs/028-pages-site/contracts/pages.md。レポートの決まりは specs/030-allure-test-report/contracts/test-report.md。
# 形は .githooks/tests/test_pages_workflows.py が固定する。

on:
  workflow_run:
    workflows: [pages-build, test-report]
    types: [completed]
  # pages-store の今の中身を公開し直すだけ。
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      side: ${{ steps.verify.outputs.side }}
      kind: ${{ steps.verify.outputs.kind }}
      pr: ${{ steps.verify.outputs.pr }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      open_prs: ${{ steps.verify.outputs.open_prs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # artifact は作業ツリーの外に取り、中身は実行しない。
      - name: Verify run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 .githooks/scripts/pages_site/verify.py --run-id "$RUN_ID" --repo "$REPO" \
            --out "$RUNNER_TEMP/pages-verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified side
        if: steps.verify.outputs.side != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-verified
          path: ${{ runner.temp }}/pages-verified/
          retention-days: 1
          if-no-files-found: error

  # 合わない run と closed の PR の run でも、閉じた PR の掃除のために動く。
  store:
    needs: verify
    if: ${{ github.event_name == 'workflow_run' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: pages-store
    concurrency:
      group: pages-store
      cancel-in-progress: false
      queue: max
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    env:
      SIDE: ${{ needs.verify.outputs.side }}
      KIND: ${{ needs.verify.outputs.kind }}
      PR: ${{ needs.verify.outputs.pr }}
      HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
      OPEN_PRS: ${{ needs.verify.outputs.open_prs }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download verified side
        if: env.SIDE != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-verified
          path: ${{ runner.temp }}/pages-verified

      # pages-store の ruleset の bypass は、この App だけ。client ID と秘密鍵は environment pages-store にだけ置く。
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PAGES_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_STORE_APP_PRIVATE_KEY }}
          permission-contents: write

      # トークンは URL に入れず、actions/checkout と同じ extraheader で渡す。レポートは --kind report で側の test-report/ に置く。
      - name: Store side
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          args=(--remote-url "https://github.com/$REPO.git" --open-prs "$OPEN_PRS" --run-id "$RUN_ID" --history . --main-ref origin/main --workdir "$RUNNER_TEMP/pages-store")
          if [ -n "$SIDE" ]; then
            verified="$RUNNER_TEMP/pages-verified"
            args+=(--side "$SIDE" --kind "$KIND" --sha "$HEAD_SHA")
            if [ "$KIND" = "report" ]; then
              args+=(--tar "$verified/report.tar")
              [ ! -f "$verified/report-sources.json" ] || args+=(--sources "$verified/report-sources.json")
            else
              args+=(--tar "$verified/site.tar")
              [ -z "$PR" ] || args+=(--pr "$PR")
              [ ! -f "$verified/release-sources.json" ] || args+=(--sources "$verified/release-sources.json")
            fi
          else
            args+=(--side none)
          fi
          python3 .githooks/scripts/pages_site/store.py publish "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

  # 上げた直後の artifact は deploy-pages の照会に出ないことがある。starter workflow と同じく job を分ける（actions/deploy-pages#451）。
  upload:
    needs: [verify, store]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.store.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    # deploy と同じ group に入れ、pages-store を取った順に公開する。
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages-store
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    needs: upload
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # PR への push のたびに deploy が起きるので、待っている deploy を取り消さずに並べる。
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # 開いたときに中身があるように、deploy の後で付ける。変更が無く deploy を飛ばしたときも付ける。
  preview-status:
    needs: [verify, store, deploy]
    if: ${{ !cancelled() && needs.verify.outputs.side == 'pr' && needs.store.result == 'success' && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && needs.store.outputs.changed != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set preview status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.verify.outputs.pr }}
          HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="pages / preview" \
            -f target_url="https://pecotcraft.github.io/pecot/pr/$PR/" \
            -f description="PR preview is published"
