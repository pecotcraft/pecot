AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  pecot の security alert の webhook を受け、security-alerts.yml を workflow_dispatch で起こす Lambda（#175）

Parameters:
  GitHubAppClientId:
    Type: String
    Description: GitHub App の Client ID（変数 SECURITY_APP_CLIENT_ID の値）
  GitHubAppInstallationId:
    Type: String
    Description: 組織への App の installation id
  GitHubRepositoryId:
    Type: String
    Description: pecot の repository id
  GitHubRepository:
    Type: String
    Default: pecotcraft/pecot
  WorkflowFile:
    Type: String
    Default: security-alerts.yml
  DispatchRef:
    Type: String
    Default: main
  SsmPrivateKeyName:
    Type: String
    Default: /pecot/security-webhook/app-private-key
  SsmWebhookSecretName:
    Type: String
    Default: /pecot/security-webhook/webhook-secret
  ConfigVersion:
    Type: String
    Default: "1"
    Description: 値を変えると温まった実行環境が入れ替わる（deploy.sh --rotate が上げる）

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/pecot-security-webhook
      RetentionInDays: 14

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pecot-security-webhook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: ${LogGroup.Arn}:*
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrivateKeyName}
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmWebhookSecretName}

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pecot-security-webhook
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: handler.handler
      MemorySize: 256
      Timeout: 9
      Role:
        Fn::GetAtt: [Role, Arn]
      LoggingConfig:
        LogGroup:
          Ref: LogGroup
      Environment:
        Variables:
          GITHUB_APP_CLIENT_ID:
            Ref: GitHubAppClientId
          GITHUB_APP_INSTALLATION_ID:
            Ref: GitHubAppInstallationId
          GITHUB_REPOSITORY_ID:
            Ref: GitHubRepositoryId
          GITHUB_REPOSITORY:
            Ref: GitHubRepository
          WORKFLOW_FILE:
            Ref: WorkflowFile
          DISPATCH_REF:
            Ref: DispatchRef
          SSM_PRIVATE_KEY_NAME:
            Ref: SsmPrivateKeyName
          SSM_WEBHOOK_SECRET_NAME:
            Ref: SsmWebhookSecretName
          CONFIG_VERSION:
            Ref: ConfigVersion
      # 仮のコード。本物の handler.mjs は deploy.sh が update-function-code で載せる。
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: "placeholder" });

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt: [Function, Arn]
      AuthType: NONE

  PermissionInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PermissionInvokeFunction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: App の Webhook URL に入れる URL
    Value:
      Fn::GetAtt: [FunctionUrl, FunctionUrl]
