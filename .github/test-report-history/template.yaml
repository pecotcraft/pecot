AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  リリース版のテストレポートの履歴を置く S3 のバケットと、test-report.yml の 2 つの job が OIDC で引き受けるロール（#822）

Parameters:
  SubjectPrefix:
    Type: String
    Description: OIDC の sub の前置き（gh api repos/pecotcraft/pecot/actions/oidc/customization/sub の sub_claim_prefix）
  EnvironmentName:
    Type: String
    Default: test-report-history
    Description: ロールを引き受けられる job の environment
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: アカウントに GitHub の OIDC のプロバイダが既にあるときの ARN。空ならこのスタックで作る

Conditions:
  CreateOidcProvider:
    Fn::Equals:
      - Ref: ExistingOidcProviderArn
      - ""

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: pecot-test-report-history-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # 書き損じたときに、前の版へ戻すため。
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # 境界のポリシー pecot-test-report-history-boundary は、スタックの外で人が先に作る。
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pecot-test-report-history-actions
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/pecot-test-report-history-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateOidcProvider
                  - Ref: OidcProvider
                  - Ref: ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: ${SubjectPrefix}:environment:${EnvironmentName}
      Policies:
        - PolicyName: pecot-test-report-history
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${Bucket.Arn}/release/history.jsonl
              # 無いと、ファイルが無いときも 403 になり、初めての回と入れない回を見分けられない。
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::GetAtt: [Bucket, Arn]

Outputs:
  RoleArn:
    Description: environment test-report-history の変数 TEST_REPORT_HISTORY_ROLE_ARN の値
    Value:
      Fn::GetAtt: [Role, Arn]
  BucketName:
    Description: environment test-report-history の変数 TEST_REPORT_HISTORY_BUCKET の値
    Value:
      Ref: Bucket
