format: 1
plugin: actions
prose: ja
environment:
  - name: GITHUB_SERVER_URL
    effect: 'ワークフローが動く GitHub の URL です。`token` の input は、このホストのトークンとして使います。値が無いか URL として読めないときは、`github.com` とみなします。自動処理の action は、コメントに書く実行の URL にも使います。'
  - name: GITHUB_REPOSITORY
    effect: 'ワークフローが動くリポジトリです（`owner/repo`）。番号だけの参照（`N`）は、このリポジトリの Issue か PR とみなします。'
  - name: GITHUB_RUN_ID
    effect: 'ワークフローの実行の ID です。コメントの目印と、コメントに書く実行の URL に使います。'
  - name: GITHUB_RUN_ATTEMPT
    effect: 'ワークフローの実行の試行の回数です。コメントの目印に使います。省くと `1` です。'
  - name: GITHUB_EVENT_NAME
    effect: 'auto-gate だけが読みます。ワークフローを起こしたイベントの名前です。'
  - name: GITHUB_EVENT_PATH
    effect: 'auto-gate だけが読みます。ワークフローを起こしたイベントの JSON のファイルのパスです。'
  - name: GITHUB_ACTOR
    effect: 'review-finish だけが読みます。ワークフローを起こした利用者です。この利用者がリポに書けないときは、コメントを書きません。名前が `[bot]` で終わるときと値が無いときは、書ける利用者とみなします。'
  - name: GITHUB_WORKSPACE
    effect: 'github-ops の `workflow-doctor` だけが読みます。checkout したリポのディレクトリです。無ければ作業ディレクトリを使います。'
  - name: RUNNER_TEMP
    effect: 'auto-start だけが読みます。この下に、続きに要る文脈のファイルを書きます。値が無いと、入力エラーで止まります。'
  - name: PECOT_AUTO_LABEL
    effect: '自動処理を起こす Issue のラベルです。省くと `pecot-auto` です。'
  - name: PECOT_REVIEW_TRIGGER_PHRASE
    effect: 'review-finish だけが読みます。自動レビューをもう一度起こすコメントの言葉です。止まったことを知らせるコメントに書きます。省くと `@pecotbot review` です。'
  - name: PECOT_GITHUB_API_URL
    effect: 'GitHub API のリクエストを、本物のホストではなくこの URL に送ります。テストだけが使います。受け付けるのは `http://127.0.0.1` か `http://localhost` の URL だけです。'
  - name: PECOT_GITHUB_*_TOKEN
    effect: 'ホストの GitHub トークンです。`token` の input があれば、ワークフローが動くホストの変数にその値を入れます。変数の名前は、`github.com` なら `PECOT_GITHUB_COM_TOKEN`、ほかのホストなら `PECOT_GITHUB_<HOST>_TOKEN` です。`<HOST>` は、ホスト名を大文字にして `.` を `_` に替えたものです。`token` の input が空なら、step の `env` で渡したこの変数を使います。'
  - name: GITHUB_COM_TOKEN
    effect: '`github.com` の GitHub トークンです。`token` の input が空で、`PECOT_GITHUB_COM_TOKEN` も無いときに使います。'
  - name: CLAUDE_PROJECT_DIR
    effect: 'あれば、プロジェクトのルートにします。無ければ、作業ディレクトリの git の toplevel を使います。`.pecot/config/projects` の設定は、この下で探します。'
  - name: CLAUDE_PLUGIN_DATA
    effect: '共有のライブラリが、データディレクトリを決めるときに読みます。どの action も、データディレクトリを使いません。'
  - name: PLUGIN_DATA
    effect: '共有のライブラリが、データディレクトリを決めるときに読みます。どの action も、データディレクトリを使いません。'
  - name: XDG_DATA_HOME
    effect: '共有のライブラリが、データディレクトリを決めるときに読みます。どの action も、データディレクトリを使いません。'
  - name: HOME
    effect: '共有のライブラリが、データディレクトリを決めるときに読みます。どの action も、データディレクトリを使いません。'
common_behaviors: []
entries:
  PA-BOARD-SYNC:
    summary: 'Ready・Blocked・Active・In Review の Issue を、判定に合った列と Status へ動かします。更新の新しい 20 件を超えた Archived の項目を、ボードから削除します。'
    arguments:
      token: 'ボードを読み書きする GitHub トークンです。ワークフローの App のトークンか PAT を渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、アクティブなプロジェクトを使います。アクティブなプロジェクトが無く、設定が 1 つだけなら、その設定を使います。'
      dry-run: '`true` なら、ボードへ書き込まず、動かす予定だけを出します。省くと `false` です。'
    constraints: []
    details:
      - 'ワークフローの step が呼びます。定期起動のワークフローと、手で起動するワークフロー（`workflow_dispatch`）から呼べます。'
      - 'ボードの全体を読み、Ready・Blocked・Active・In Review にある open の Issue を、判定が求める列と Status へ動かします。'
      - '判定・列の移動・Status の書き込みは、ワークフローのほかの部分と同じです（blocked-by・ブランチ・PR を見ます）。'
      - 'ブランチか PR のある Issue は動かしません。その Issue が blocked のときは、`warning` の行で知らせます。'
      - '自動処理が人の対応を待って付けた `Needs Attention` の札は、`Todo` に戻しません。自動処理が付けた札かは、Issue に bot が書いた最後の自動処理の結果のコメントで決めます。'
      - 'Backlog・Pending・Archived にある Issue と、PR のカード・Tracker・Epic は動かしません。'
      - '判定を読めない Issue（`develop_branch` が未設定のときなど）は動かさず、`warning` の行に理由を出します。'
      - 'ブランチと PR はボードの一覧に載らないので、Blocked・Active・In Review の Issue は 1 件ずつ読みます。読むのを省くのは、一覧で前提が無いと分かる Ready の Issue だけです。札が `Needs Attention` で着手の跡の無い Issue は、コメントも読みます。'
      - '動かした後で、Archived の項目を、更新の新しい 20 件を残して、ボードから削除します。削除できない Archived の項目は飛ばして続け、最後に step を失敗にします。'
      - '設定は、`project` の設定、アクティブなプロジェクト、`.pecot/config/projects` にある唯一の設定の順で選びます。設定が 2 つ以上あってアクティブなプロジェクトが無いときは、`project` を求めて step を失敗にします。'
      - '実行の前後に GraphQL の rate limit を読み（REST なので点数は減りません）、使った点数と残りの点数を出します。読めないときは、その行を省きます。実行中に rate limit の窓が切り替わったときと、差が負のときは、使った点数の行を省きます。'
      - 'Issue の依存関係に対応していない GitHub Enterprise Server では、`warning` の行を 1 つ出し、何も動かしません。'
      - '進行の欄がまだ旧い名前（`pecot-workflow-<suffix>`）なら、同じように Issue を動かします。旧い名前を載せて `project_init` を案内する `warning` の行を 1 つ出します。'
      - 'Item の値に `pecot-priority`・`pecot-size` が残っていれば、残ったフィールドの名前を同じ警告に足します。値の入った Item が無いボードと、値が 10 個を超える Item だけのボードでは、残っていても気づけません。'
    stdin: none
    output:
      format: none
    diagnostics: '実行のログに、移動ごとの結果の行（`moved`）と、Status の書き込みごとの結果の行（`set`）と、削除した Archived の項目の結果の行（`deleted`）を出します。`dry-run` が `true` のときは、代わりに `dry-run` の行を出します。`warning` の行を出すのは、次のときです。ブランチか PR のある Issue が blocked のとき。判定を読めない Issue があるとき。書き込みに失敗したとき。Archived の項目を削除できなかったとき。ボードが定義していない値があるとき。GitHub Enterprise Server が Issue の依存関係に対応していないとき。進行の欄が旧い名前のときか、`pecot-priority`・`pecot-size` が残っているとき。`count` の行には、使った GraphQL の点数と残りを出します。rate limit を読んだ後にエラーで止まったときも出します。最後に、書き込みに失敗した Issue の数を `error` の行で出します。削除できなかった Archived の項目の数も、別の `error` の行で出します。'
    environment:
      - name: GITHUB_SERVER_URL
        effect: '`token` を渡す先の GitHub のホストです。無いか空なら `github.com` にします。'
    exit_status:
      - kind: partial-failure
        when: 'ボードへの書き込みが 1 件以上の Issue で失敗したか、Archived の項目を 1 件以上削除できませんでした。ほかの Issue をすべて同期した後で、step を失敗にします。'
      - kind: no-active-project
        when: 'アクティブなプロジェクトが無く、設定も 1 つに決まりません。step は失敗になります。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。step は失敗になります。'
      - kind: config-invalid
        when: '設定ファイルの内容が不正です。step は失敗になります。'
      - kind: invalid-input
        when: '`dry-run` が `true`・`false` のどちらでもありません。GitHub を読まずに、step を失敗にします。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。step は失敗になります。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。step は失敗になります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: '既に書いた移動と、既に削除した Archived の項目は、そのまま残ります。書き込みの失敗は `warning` の行に出し、ほかの Issue の同期を続けてから、step を失敗にします。Archived の項目を削除できないときも `warning` の行に出して続け、step を失敗にします。判定を読めない Issue があるときと、Issue の依存関係に対応していない GitHub Enterprise Server のときは、step は成功です。'
    effects:
      - target: github
        kind: read
        what: 'ボードの項目を読みます。Blocked・Active・In Review の Issue と、前提のある Ready の Issue は、blocked-by・ブランチ・PR も読みます。そのうち札が `Needs Attention` で着手の跡の無い Issue は、コメントも読みます。GraphQL の rate limit も読みます。'
      - target: github
        kind: destructive
        what: '判定に合っていない Issue の列（pecot-workflow のフィールド）と Status を設定します。'
      - target: github
        kind: destructive
        what: '更新の新しい 20 件を超えた Archived の項目を、プロジェクトのボードから削除します。'
      - target: file
        kind: read
        what: '設定ファイルを読みます。'
    prerequisites:
      - 'リポジトリを checkout した後の step で呼びます。'
      - '`.pecot/config/projects` の下に設定が要ります。`project` で名前を渡した設定か、アクティブな設定か、唯一の設定を使います。'
      - 'プロジェクトを編集する権限を持つ GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
        note: '唯一の設定のボードを同期します。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          project: example-config
        note: '名前を渡した設定のボードを同期します。設定が 2 つ以上あるリポで使います。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          dry-run: true
        note: 'ボードへ書き込まず、動かす予定を出します。'
    default_notes: {}
    behaviors:
      - id: PA-BOARD-SYNC-01
        pattern: event
        statement: '呼ぶと、Blocked の Issue の判定が `startable` か `stackable` なら、Ready へ動かします'
      - id: PA-BOARD-SYNC-02
        pattern: event
        statement: 'Ready の Issue に済んでいない前提があると、Blocked へ動かします'
      - id: PA-BOARD-SYNC-03
        pattern: event
        statement: '着手の跡の無い Issue が Active か In Review にあると、判定に合った列（Ready か Blocked）へ戻します'
      - id: PA-BOARD-SYNC-04
        pattern: unwanted
        statement: 'もし着手の跡（ブランチか PR）のある Issue が `blocked` なら、列と札を変えず、`warning` の行で知らせます'
      - id: PA-BOARD-SYNC-05
        pattern: unwanted
        statement: 'もし前提の無い Blocked の Issue に着手の跡があるなら、Ready へ動かしません'
      - id: PA-BOARD-SYNC-06
        pattern: state
        statement: 'Backlog・Pending・Archived の間、その Issue の前提を読まず、列と札を動かしません'
      - id: PA-BOARD-SYNC-07
        pattern: event
        statement: '前提がマージされずに閉じると、待っていた Issue の札を Needs Attention にします'
      - id: PA-BOARD-SYNC-08
        pattern: event
        statement: '札が Needs Attention の Issue の前提がすべて済むと、札を Todo に戻します'
      - id: PA-BOARD-SYNC-09
        pattern: event
        statement: '`dry-run` を `true` にして呼ぶと、ボードに書かず、動かす予定を `dry-run` の行で出します'
      - id: PA-BOARD-SYNC-10
        pattern: unwanted
        statement: 'もし書き込みに失敗した Issue があるなら、`warning` の行を出してほかの Issue を続け、最後に step を失敗にします。選択肢の ID が古くて書けないときは、ID を読み直す `project_activate` の案内を、1 回の実行で 1 回だけ添えます'
      - id: PA-BOARD-SYNC-11
        pattern: event
        statement: '一覧で前提が 0 件の Ready の Issue があると、前提を個別に読みません。Blocked・Active・In Review の Issue は、前提の件数によらず個別に読みます'
      - id: PA-BOARD-SYNC-12
        pattern: unwanted
        statement: 'もし動かす先の値がボードに無いなら、その Issue を動かさず、`warning` の行を 1 つ出します'
      - id: PA-BOARD-SYNC-13
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、`warning` の行を 1 つ出し、何も動かさずに step を成功にします'
      - id: PA-BOARD-SYNC-14
        pattern: event
        statement: '呼ぶと、実行の前後の GraphQL の点数から、使用量と残りを `count` の行で出します。差が負か、点数の窓が途中で切り替わったときは、使用量の行を省きます'
      - id: PA-BOARD-SYNC-15
        pattern: unwanted
        statement: 'もし点数を読めないなら、`count` の行を出さずに続けます'
      - id: PA-BOARD-SYNC-16
        pattern: unwanted
        statement: 'もしボードの取得で GitHub API がエラーを返したなら、点数の行を出して、step を失敗にします'
      - id: PA-BOARD-SYNC-17
        pattern: state
        statement: 'アクティブなプロジェクトが無く、設定がちょうど 1 つの間、その設定を使います'
      - id: PA-BOARD-SYNC-18
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無く、設定が 2 つ以上あるなら、`project` を求める `error` の行を出して、step を失敗にします'
      - id: PA-BOARD-SYNC-19
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、アクティブな設定ではなく、その設定を使います'
      - id: PA-BOARD-SYNC-20
        pattern: unwanted
        statement: 'もし `project` の設定が無いなら、使える設定の名前を `error` の行に出して、step を失敗にします'
      - id: PA-BOARD-SYNC-21
        pattern: unwanted
        statement: 'もし設定が 1 つも無いなら、アクティブなプロジェクトが無いと `error` の行に出して、step を失敗にします'
      - id: PA-BOARD-SYNC-22
        pattern: event
        statement: '一覧の新しいクエリがスキーマの失敗になると、古いクエリで読み直し、前提を読まずに step を成功にします'
      - id: PA-BOARD-SYNC-23
        pattern: unwanted
        statement: 'もし判定を読めない Issue があるなら、理由を `warning` の行に出し、その Issue を動かしません'
      - id: PA-BOARD-SYNC-24
        pattern: event
        statement: 'Ready の Issue の前提が輪になると、Blocked へ動かします'
      - id: PA-BOARD-SYNC-25
        pattern: unwanted
        statement: 'もしカードが PR・Tracker・Epic なら、列と札を動かしません'
      - id: PA-BOARD-SYNC-26
        pattern: event
        statement: '設定で先頭にないリポジトリの Issue を動かすと、結果の行で `owner/repo#N` の形で表します'
      - id: PA-BOARD-SYNC-27
        pattern: unwanted
        statement: 'もし設定のファイルが JSON として読めないなら、`error` の行を出して、step を失敗にします'
      - id: PA-BOARD-SYNC-28
        pattern: event
        statement: '更新の新しい 20 件を超える Archived の項目があると、超えた分だけをボードから削除し、件数を `deleted` の行で出します'
      - id: PA-BOARD-SYNC-29
        pattern: event
        statement: '`dry-run` を `true` にして呼ぶと、Archived の項目を削除せず、`dry-run: would delete N archived items` の行を出します'
      - id: PA-BOARD-SYNC-30
        pattern: unwanted
        statement: 'もし Archived の項目を削除できなかったなら、`warning` の行を出して続けます'
      - id: PA-BOARD-SYNC-31
        pattern: unwanted
        statement: 'もし Archived の項目を削除できなかったなら、step を失敗にします。最後に `error: could not delete N archived items from the board` の行を出します'
      - id: PA-BOARD-SYNC-32
        pattern: unwanted
        statement: 'もし札が `Needs Attention` で、bot が書いた最後の結果のコメントが `question`・`failed`・`limit` のどれかなら、前提がすべて済んでも札を `Todo` に戻しません'
      - id: PA-BOARD-SYNC-33
        pattern: state
        statement: '進行の欄が旧い名前（`pecot-workflow-<suffix>`）である間、同じ Issue を動かし、`project_init` を案内する `warning` の行を 1 つ出します'
      - id: PA-BOARD-SYNC-34
        pattern: state
        statement: 'Item の値に `pecot-priority`・`pecot-size` が残っている間、同じ Issue を動かします。残ったフィールドの名前は、`project_init` を案内する警告に足します。進行の欄の警告と合わせて、警告は 1 つです'
      - id: PA-BOARD-SYNC-35
        pattern: unwanted
        statement: 'もし `dry-run` が `true`・`false` のどちらでもないなら、GitHub を読まず、入力の誤りの `error` の行を出して step を失敗にします'
  PA-SESSION-FINISH:
    summary: 'マージ済みの PR の、GitHub 側の後片付けをします。関連する Issue を閉じ、それを待っていた Issue の列と札を動かします。ブランチは削除しません。'
    arguments:
      token: 'Issue を閉じ、ボードを書く GitHub トークンです。ワークフローの App のトークンか PAT を渡します。'
      pr: 'PR の参照です。`owner/repo/N` か、番号だけの `N` で渡します。`N` は、ワークフローが動くリポジトリの PR です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
      dry-run: '`true` なら、何も変えずに、する予定だけを出します。省くと `false` です。'
    constraints: []
    details:
      - 'PR がマージされた後のワークフローの step が呼びます。マージ済みの PR の、GitHub 側の後片付けだけをします。'
      - 'ブランチは削除しません。checkout したリポジトリのブランチとフラグのファイルにも触れません。'
      - '関連する Issue は、PR のリポの closing issues と、head ブランチ名の末尾の番号の Issue です。base が既定ブランチでない PR では、本文の Closes・Fixes・Resolves の後に書いた、PR のリポの Issue も含めます。GitHub がキーワードを読むのは既定ブランチ宛ての PR だけなので、そこで読まない所（コードブロック・インラインコード・HTML コメントの中）は数えません。'
      - '閉じた理由を残すため、すでに閉じた Issue は閉じ直さず、`unchanged` の行で知らせます。状態を読めない Issue も閉じず、`warning` の行で知らせます。'
      - 'Epic と、sub-issue を持つ Issue は閉じず、`skipped` の行で知らせます。'
      - 'Issue を閉じた後、その Issue を待っている Issue を読み、判定に合わせてボードの列と Status の札を動かします。着手の跡がある Issue は動かしません。判定に、閉じた Issue が済んだ前提として出ていないときは、約 1.5 秒後に 1 回だけ読み直します。それでも出なければ、後で pecot-board-sync のワークフローを手で起動するよう `warning` の行で知らせ、列を動かしません。'
      - '判定が変わった Issue を、標準出力の `Readiness changed:` の行の下に、1 件 1 行で出します。`from` は、閉じた Issue と PR がまだ開いていたとしたときの判定です。'
      - '待っている Issue のうち、種類が `stack` でブランチか PR を持つものは、この PR の子ブランチの Issue です。その作業ディレクトリでブランチをスタックし直すよう `warning` の行で知らせます。'
      - '選んだプロジェクトのボードに無い Issue と、`Ready`・`Blocked`・`Active`・`In Review` の外の列の Issue は、動かしません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: 'outputs はありません。判定の変わった Issue があるときだけ、実行のログに `Readiness changed:` の行と、Issue ごとの `- <Issue> <前の判定> -> <後の判定>` の行を出します。'
    diagnostics: '実行のログに、閉じる Issue の `count` の行を出し、続けて手順ごとに結果の行を 1 つ出します。結果の行は、`closed`・`skipped`・`unchanged`・`moved`・`set` です。`dry-run` が `true` のときは、結果の行の代わりに `dry-run: would` の行を出します。失敗した手順には、`warning` の行を出します。子ブランチがあるときと、待っている Issue の判定を確かめられないときも、`warning` の行を出します。'
    environment:
      - name: GITHUB_REPOSITORY
        effect: '`pr` が番号だけのとき、補うリポジトリです。'
      - name: GITHUB_SERVER_URL
        effect: '`token` を渡す先の GitHub のホストです。無いか空なら `github.com` にします。'
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。step は失敗になります。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。step は失敗になります。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。step は失敗になります。'
      - kind: pr-state
        when: 'PR がマージされていません。何も変えずに、step を失敗にします。'
      - kind: invalid-input
        when: '`pr` の形が誤っているか、`dry-run` が `true`・`false` のどちらでもありません。GitHub を読まずに、step を失敗にします。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。step は失敗になります。'
      - kind: github-not-found
        when: 'PR がないか、GitHub に対象が見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。step は失敗になります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: 'マージされていない PR はそのまま残し、何も変えません。Issue を閉じられなかったときは `warning` の行を出し、ほかの Issue と後の手順を続けます。巻き戻しはしません。待っている Issue の列を書けなかったときも、`warning` の行を出して続けます。`warning` の行を出して飛ばした手順があっても、step は成功です。'
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue それぞれの種類と状態を読みます。閉じた Issue を待っている Issue の、ボードの項目と前提も読みます。'
      - target: github
        kind: destructive
        what: '関連する Issue を閉じます。'
      - target: github
        kind: destructive
        what: '閉じた Issue を待っている Issue の列（pecot-workflow のフィールド）と Status を設定します。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - 'リポジトリを checkout した後の step で呼びます。'
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'Issue を閉じ、プロジェクトを編集する権限を持つ GitHub トークンが要ります。'
      - 'PR は、マージ済みでなければなりません。'
    idempotent: true
    examples:
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          pr: '${{ github.event.pull_request.number }}'
        note: 'マージされた PR の、GitHub 側の後片付けをします。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          pr: example-org/my-repo/123
          dry-run: true
        note: '何も変えずに、後片付けの予定を出します。'
    default_notes:
      pr: '番号だけの `N` は、ワークフローが動くリポジトリ（`GITHUB_REPOSITORY`）で補います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PA-SESSION-FINISH-01
        pattern: event
        statement: 'マージ済みの PR の `pr` を渡すと、PR のリポの closing issues と head ブランチ名の末尾の番号の Issue を close します。base が既定ブランチでない PR では、本文のコードと HTML コメントの外の Closes / Fixes / Resolves の後の、PR のリポの Issue も close します'
      - id: PA-SESSION-FINISH-02
        pattern: event
        statement: 'Epic か sub-issue を持つ Issue があると、その Issue を close しません'
      - id: PA-SESSION-FINISH-03
        pattern: event
        statement: 'Epic か sub-issue を持つ Issue があると、`skipped` の行で Epic として知らせます'
      - id: PA-SESSION-FINISH-10
        pattern: ubiquitous
        statement: '常に、ブランチを消す要求を送らず、checkout したリポジトリのブランチとフラグのファイルに触れません'
      - id: PA-SESSION-FINISH-12
        pattern: event
        statement: '`dry-run` を `true` にして呼ぶと、何も変えずに、する予定を `dry-run` の行で出します'
      - id: PA-SESSION-FINISH-13
        pattern: event
        statement: '呼ぶと、close する Issue の件数を `count` の行で出します'
      - id: PA-SESSION-FINISH-14
        pattern: event
        statement: 'Issue を close すると、`closed` の行を出します'
      - id: PA-SESSION-FINISH-20
        pattern: unwanted
        statement: 'もし Issue の close に失敗したなら、`warning` の行を 1 つ出します'
      - id: PA-SESSION-FINISH-21
        pattern: unwanted
        statement: 'もし Issue の close に失敗したなら、ほかの Issue と後の処理を続けます'
      - id: PA-SESSION-FINISH-24
        pattern: unwanted
        statement: 'もし PR がマージされていないなら、GitHub の画面でマージするよう案内する `error` の行を出し、step を失敗にします'
      - id: PA-SESSION-FINISH-25
        pattern: unwanted
        statement: 'もし PR がマージされていないなら、何も変えません'
      - id: PA-SESSION-FINISH-26
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、候補の名前と `project` の案内を `error` の行に出し、step を失敗にします'
      - id: PA-SESSION-FINISH-27
        pattern: unwanted
        statement: 'もし PR を取得できないか、PR が無いなら、step を失敗にします'
      - id: PA-SESSION-FINISH-28
        pattern: unwanted
        statement: 'もし `pr` の形が誤っているなら、GitHub を読まず、step を失敗にします'
      - id: PA-SESSION-FINISH-31
        pattern: event
        statement: 'Issue を閉じると、その Issue を待っている Issue の列と札を判定どおりに動かします'
      - id: PA-SESSION-FINISH-32
        pattern: unwanted
        statement: 'もし待っている Issue に着手の跡があるなら、その列と札を動かしません'
      - id: PA-SESSION-FINISH-33
        pattern: event
        statement: '待っている Issue の判定が変わると、その Issue を `Readiness changed:` の行の下に出します'
      - id: PA-SESSION-FINISH-34
        pattern: unwanted
