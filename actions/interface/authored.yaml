  PA-RELEASE-CHECK:
    summary: 'リリースを出す前の確認をします。open の code scanning と secret scanning の alert があれば止めます。Nx でリリースしないリポジトリでは、CHANGELOG・タグ・リリースするコミットも確かめます。'
    arguments:
      token: 'alert とコミットを読む GitHub トークンです。ワークフローの App のトークンを渡します。'
      version: 'リリースするバージョンです。省くと、CHANGELOG の最新のバージョンを使います。Nx でリリースするリポジトリでは、省きます。'
      package: 'monorepo のパッケージ名です。`packages` を設定したリポジトリでは必須です。Nx でリリースするリポジトリでは、省きます。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
      log-file: '出力の行を、実行のログに加えて書くファイルです。同じ順で書き、前の中身は消します。ディレクトリが無ければ作ります。'
    constraints: []
    details:
      - 'リリースの workflow の、リリースを始める前の step が呼びます。checkout したリポジトリのルートで動かします。'
      - '確かめるのは、Dependabot・code scanning・secret scanning の open の alert です。1 つが失敗しても、残りを確かめてから結果を決めます。'
      - 'open の Dependabot alert は、`warning` の行で知らせるだけで、リリースを止めません。code scanning と secret scanning は、open の alert が 1 件でもあれば止めます。'
      - 'alert の機能が無効のリポジトリは、通します。確かめなかったことを `skipped` の行で知らせます。'
      - 'プロジェクトの設定で `release_type` が `nx` のリポジトリは、alert だけを確かめて通ります。バージョンは Nx Release が決めます。'
      - 'ほかのリポジトリは、alert の後に、CHANGELOG・ローカルとリモートのタグ・開発ブランチからリリースブランチへのコミットの数を確かめます。通ると、標準出力に `version:`・`tag:` の行と、リリースノートを出します。'
    stdin: none
    output:
      format: text
      description: 'outputs はありません。実行のログに、確認ごとの行を出します。Nx でないリポジトリでは、標準出力に `version:`・`tag:` の行と、CHANGELOG から取ったリリースノートも出します。'
    diagnostics: '実行のログに、alert の確認ごとに `count`・`skipped`・`warning`・`error` のどれかの行を出します。Nx でないリポジトリでは、リリースするコミットの数を `count` の行で出します。止めるときは、理由を `error` の行に出します。'
    environment:
      - name: GITHUB_REPOSITORY
        effect: '対象のリポジトリは、checkout した git の主の remote から決めます。この変数は読みません。'
      - name: GITHUB_SERVER_URL
        effect: '`token` を渡す先の GitHub のホストです。無いか空なら `github.com` にします。'
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。step は失敗になります。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。step は失敗になります。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。step は失敗になります。'
      - kind: invalid-input
        when: '`version` の形が誤っているか、`package` の指定が設定と合いません。Nx でリリースするリポジトリで `version` か `package` を渡したときも含みます。step は失敗になります。'
      - kind: repo-setting-missing
        when: 'Nx でないリポジトリで、`develop_branch` か `release_branch` がプロジェクトの設定にありません。step は失敗になります。'
      - kind: preflight-failed
        when: 'open の code scanning か secret scanning の alert があります。Nx でないリポジトリでは、次のときも含みます。CHANGELOG やリリースするコミットが無いとき、同じタグがあるとき、CHANGELOG にバージョンの無いときです。step は失敗になります。'
      - kind: git-unresolved
        when: 'checkout したリポジトリのルートか、主の remote のリポジトリを読めません。step は失敗になります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。step は失敗になります。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。step は失敗になります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: 'alert を読めなかった確認は、`error` の行を出して失敗にし、残りの確認を続けます。Dependabot alert だけは、読めなくても `warning` の行を出して続けます。何も書き換えないので、巻き戻しはありません。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの Dependabot・code scanning・secret scanning の open の alert を読みます。Nx でないリポジトリでは、開発ブランチがリリースブランチより進んだコミットの数も読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルと、Nx でないリポジトリでは CHANGELOG を読みます。'
      - target: file
        kind: write
        what: '`log-file` を渡したときだけ、そのファイルに出力の行を書きます。'
    prerequisites:
      - 'リポジトリを checkout した後の step で呼びます。Nx でないリポジトリでは、タグを確かめるため、リモートを読める必要があります。'
      - '対象のリポを `repositories` に持つプロジェクトの設定が要ります。'
      - 'alert を読む権限を持つ GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          log-file: .pecot/tmp/release/preflight.log
        note: 'リリースを始める前に、alert を確かめ、出力を `preflight.log` にも残します。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          version: 1.2.0
        note: 'Nx でないリポジトリで、バージョン 1.2.0 のリリースを出せるかを確かめます。'
    default_notes:
      version: 'CHANGELOG の最新のバージョンを使います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PA-RELEASE-CHECK-01
        pattern: event
        statement: '呼ぶと、Dependabot・code scanning・secret scanning の open の alert の数を、確認ごとに `count` の行で出します'
      - id: PA-RELEASE-CHECK-02
        pattern: unwanted
        statement: 'もし code scanning か secret scanning に open の alert があるなら、件数・番号・一覧の URL を `error` の行に出します。残りの確認は続けて、step を失敗にします'
      - id: PA-RELEASE-CHECK-03
        pattern: unwanted
        statement: 'もし Dependabot の open の alert があるなら、件数・最も高い重大度・一覧を `warning` の行に出し、リリースは止めません'
      - id: PA-RELEASE-CHECK-04
        pattern: unwanted
        statement: 'もし Dependabot alert を読めないなら、理由を `warning` の行に出し、リリースは止めません'
      - id: PA-RELEASE-CHECK-05
        pattern: unwanted
        statement: 'もし code scanning か secret scanning の alert を読めないなら、理由を `error` の行に出し、残りの確認を続けて、step を失敗にします'
      - id: PA-RELEASE-CHECK-06
        pattern: event
        statement: 'プロジェクトの設定の `release_type` が `nx` のリポジトリで呼ぶと、alert だけを確かめ、CHANGELOG とタグは確かめずに通ります'
      - id: PA-RELEASE-CHECK-07
        pattern: unwanted
        statement: 'もし `release_type` が `nx` のリポジトリで `version` か `package` を渡したなら、alert を読まず、`error` の行を出して step を失敗にします'
      - id: PA-RELEASE-CHECK-08
        pattern: event
        statement: '`release_type` が `nx` でないリポジトリで alert が通ると、リリースするコミットの数を `count` の行で出します。標準出力には `version:`・`tag:` の行とリリースノートを出します'
      - id: PA-RELEASE-CHECK-09
        pattern: unwanted
        statement: 'もし CHANGELOG かリリースするコミットが無いか、同じ名前のタグがすでにあるなら、理由を `error` の行に出して step を失敗にします'
      - id: PA-RELEASE-CHECK-10
        pattern: unwanted
        statement: 'もし `version` の形が誤っているなら、alert を読まず、`error` の行を出して step を失敗にします'
      - id: PA-RELEASE-CHECK-11
        pattern: event
        statement: '`log-file` を渡すと、出力の行を実行のログに加えて、そのファイルに同じ順で書きます'
  PA-AUTO-GATE:
    summary: 'GitHub Actions のイベントから、自動処理を進めるかと、その種類を決めます。進めないときに Issue へ知らせる理由があれば、結果のコメントを書きます。'
    arguments:
      token: 'Issue とボードを読み、結果のコメントを書く GitHub トークンです。ワークフローの App のトークンを渡します。'
      max-ci-attempts: '1 つのブランチで CI を直す回数の上限です。省くと `3` です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、イベントのリポジトリを含む設定を使います。'
    constraints: []
    details:
      - 'ワークフローの先の job が呼びます。イベントの名前を `GITHUB_EVENT_NAME` から、イベントの JSON を `GITHUB_EVENT_PATH` のファイルから読みます。'
      - '後の job が読む値を、outputs の `proceed`・`kind`・`issue`・`number`・`branch` に出します。実行のログには、理由・PR・CI を直した回数も入れた JSON を 1 行出します。'
      - '`issues` では、ラベルを付けた人（`sender`）の権限を読みます。`admin` か `write` でないとき、名前が `[bot]` で終わるとき、権限を読めないときは、何も書かずに `proceed` を偽にします。'
      - '次の Issue には `out-of-scope` の結果のコメントを書き、起動ラベルを外し、`proceed` を偽にします。閉じた Issue、PR に付いたラベル、Epic、Tracker、sub-issue を持つ Issue が当たります。進行の欄が Backlog・Pending・Archived・Blocked の Issue も当たります。進行の欄が Active・In Review で、自動処理の結果のコメントが無い Issue も同じです。'
      - 'ほかの Issue では、`proceed` を真にします。計画のコメント・ブランチ・開いた PR のどれかがあれば `kind` を `resume` に、無ければ `start` にします。計画のコメントは、見出し `## Plan` で始まり、bot か書き込み権限を持つ人が書いたコメントです。'
      - '`workflow_run` で扱うのは、終わった CI の run のうち、ブランチの末尾が Issue 番号で、fork でないものです。自動処理が PR を作ったブランチの、先頭の commit の run に限ります。CI が通った後に、人が push した run（`workflow_run.actor` が bot でない）には、何も書きません。'
      - 'CI が落ちて、直した回数が `max-ci-attempts` より少なければ、`kind` を `ci-fix` にして `proceed` を真にします。上限に達していれば、`limit` の結果のコメントを書き、Status を Needs Attention にして起動ラベルを外します。'
      - 'CI が通ると、`ci-passed` の結果のコメントを書き、`proceed` を偽にします。同じ commit のほかの run が落ちているとき、同じ push の CI でもう書いたときは、書きません。'
      - '`proceed` が偽でも、step は成功です。'
      - 'プロジェクトの設定に `fields.status` が要ります。結果のコメントは、auto-finish と同じ処理で書きます。'
    stdin: none
    output:
      format: text
      description: 'outputs の `proceed` は、自動処理を進めるか（`true` か `false`）です。`kind` は `start`・`resume`・`ci-fix`・`ci-passed` のどれかで、決まらないときは空です。`issue` は `owner/repo/N` の形の Issue、`number` はその番号で、分からないときは `0` です。`branch` は Issue の既にあるブランチで、無いときは空です。'
    diagnostics: '実行のログに、実行の欄を持つ JSON を 1 行出します。欄は `issue`・`number`・`kind`・`proceed`・`reason`・`branch`・`pr`・`ci_attempts` です。何も書かずに進めないときは、理由を添えた `skipped` の行を出します。結果のコメントを書いたときは、`created`・`set`・`removed` の行を出します。'
    environment:
      - name: GITHUB_EVENT_NAME
        effect: 'イベントの名前です。`issues` か `workflow_run` でなければ、step を失敗にします。'
      - name: GITHUB_EVENT_PATH
        effect: '読むイベントの JSON のパスです。'
      - name: PECOT_AUTO_LABEL
        effect: '外す起動ラベルの名前です。無いか空なら `pecot-auto` にします。'
      - name: GITHUB_RUN_ID
        effect: '結果のコメントの目印に入れる実行の ID です。実行の記録の URL にも使います。無いか空なら、目印を付けません。'
      - name: GITHUB_RUN_ATTEMPT
        effect: '目印に入れる試行の番号です。無いか空なら `1` にします。'
      - name: GITHUB_REPOSITORY
        effect: '実行の記録の URL に入れるリポジトリです。無いか空なら、実行の記録を「分からない」と書きます。'
      - name: GITHUB_SERVER_URL
        effect: '実行の記録の URL のホストです。無いか空なら `https://github.com` にします。'
    exit_status:
      - kind: invalid-input
        when: 'イベントのファイルが無いか、JSON として読めないか、要る欄がありません。step は失敗になります。'
      - kind: invalid-input
        when: '`GITHUB_EVENT_NAME` が `issues`・`workflow_run` のどちらでもないか、`max-ci-attempts` が 0 以上の整数でありません。step は失敗になります。'
      - kind: not-initialized
        when: 'プロジェクトの設定に `fields.status` がありません。step は失敗になります。'
      - kind: content-invalid
        when: '埋めた本文がテンプレートに合いません。何も書かずに step を失敗にします。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。step は失敗になります。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。step は失敗になります。'
      - kind: repo-not-in-project
        when: 'リポジトリがプロジェクトにありません。step は失敗になります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。step は失敗になります。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。step は失敗になります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: '判定の前に止まったときは、何も書きません。結果のコメントの後で Status かラベルの書き込みに失敗したときは、同じ run で呼び直した auto-finish が書き直します。'
    effects:
      - target: github
        kind: read
        what: 'ラベルを付けた人の権限、Issue の進行の欄とブランチと PR、Issue のコメント、計画を書いた人の権限、ブランチの先頭の commit を読みます。'
      - target: github
        kind: write
        what: '進めない理由を知らせるときと CI の結果を知らせるときに、Issue に結果のコメントを書きます。'
      - target: github
        kind: destructive
        what: '同じときに、Status と起動ラベルを書きます。'
      - target: file
        kind: read
        what: 'イベントの JSON と、プロジェクトの設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'step の outputs のファイル（`GITHUB_OUTPUT`）に、outputs を足します。'
    prerequisites:
      - 'リポジトリを checkout した後の step で呼びます。'
      - '対象のリポを含み、`fields.status` を持つプロジェクトの設定が要ります。'
      - 'Issue とプロジェクトを編集する権限を持つ GitHub トークンが要ります。'
    idempotent: false
    examples:
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
        note: 'ラベルを付けた Issue で、自動処理を進めるかを決めます。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          max-ci-attempts: 3
        note: '自動処理が作った PR の CI を、直すかを決めます。'
    default_notes: {}
    behaviors:
      - id: PA-AUTO-GATE-01
        pattern: event
        statement: '書き込み権限を持つ人が、計画のコメントとブランチの無い Ready の Issue にラベルを付けると、`kind` を `start` に、`proceed` を真にします。何も書きません'
      - id: PA-AUTO-GATE-02
        pattern: ubiquitous
        statement: '常に、outputs の `proceed`・`kind`・`issue`・`number`・`branch` に、判定した値を出します'
      - id: PA-AUTO-GATE-03
        pattern: unwanted
        statement: 'もしラベルを付けた人の権限が `admin`・`write` のどちらでもないか、名前が `[bot]` で終わるなら、Issue を読まず、何も書かずに `proceed` を偽にします'
      - id: PA-AUTO-GATE-04
        pattern: unwanted
        statement: 'もし Issue が自動処理の対象外なら、`out-of-scope` の結果のコメントを書いて起動ラベルを外し、`proceed` を偽にして step を成功にします'
      - id: PA-AUTO-GATE-05
        pattern: event
        statement: '自動処理が PR を作ったブランチの CI が落ち、直した回数が上限より少ないと、`kind` を `ci-fix` に、`proceed` を真にします'
      - id: PA-AUTO-GATE-06
        pattern: event
        statement: '自動処理が PR を作ったブランチの CI が通ると、`ci-passed` の結果のコメントを書き、Status と起動ラベルを書きません'
      - id: PA-AUTO-GATE-07
        pattern: unwanted
        statement: 'もし CI を直した回数が上限に達しているなら、`limit` の結果のコメントを書き、Status を Needs Attention にして起動ラベルを外します'
      - id: PA-AUTO-GATE-08
        pattern: unwanted
        statement: 'もし CI の run が fork のブランチか、末尾が Issue 番号でないブランチのものなら、何も読まずに `proceed` を偽にします'
      - id: PA-AUTO-GATE-09
        pattern: unwanted
        statement: 'もし CI の run が、自動処理が PR を作っていないブランチか、ブランチの先頭でない commit のものなら、何も書かずに `proceed` を偽にします。CI が通った後に人が push した run も同じです'
      - id: PA-AUTO-GATE-10
        pattern: ubiquitous
        statement: '常に、トークンの値を、実行のログとコメントに書きません'
      - id: PA-AUTO-GATE-11
        pattern: unwanted
        statement: 'もしプロジェクトの設定に `fields.status` が無いなら、何も読まずに、`project init` を案内して step を失敗にします'
      - id: PA-AUTO-GATE-12
        pattern: unwanted
        statement: 'もしイベントのファイルが無いなら、JSON でないなら、またはイベントの名前が `issues`・`workflow_run` のどちらでもないなら、何も読まずに step を失敗にします'
      - id: PA-AUTO-GATE-13
        pattern: unwanted
        statement: 'もし CI が通っても、同じ commit のほかの run が落ちているか、同じ push の CI でもう `ci-passed` を書いているなら、何も書かずに `proceed` を偽にします'
      - id: PA-AUTO-GATE-14
        pattern: event
        statement: '計画のコメントとブランチが無く、開いた PR だけがある Issue に起動ラベルが付くと、`kind` を `resume` にします'
  PA-AUTO-START:
    summary: '自動処理の実行を始めます。自動処理が書いた Status を戻し、続きに要る文脈を JSON のファイルに書きます。'
    arguments:
      token: 'Issue を読み、ボードを書く GitHub トークンです。ワークフローの App のトークンを渡します。'
      issue: 'Issue の参照です。ワークフローのリポジトリの Issue の番号か、`owner/repo/N` で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
    constraints: []
    details:
      - '自動処理の job が、AI の step の前に呼びます。文脈の JSON を、`RUNNER_TEMP` の下の `pecot-auto/context.json` に書きます。欄は、Issue・計画・前回までの結果・答え・本文を書かなかったコメントの数・ブランチ・PR です。'
      - '書いたファイルのパスを、outputs の `context-file` に出します。ワークフローは、このパスをスキルへのプロンプトで渡します。'
      - '計画は、見出し `## Plan` で始まるコメントのうち、bot か書き込み権限を持つ人が書いた最後のものです。'
      - '答えは、最後の結果のコメントの後に付いたコメントのうち、書いた人の権限が `admin` か `write` のものです。'
      - 'ほかの人の計画と答えは、本文を書かずに数だけを書きます。'
      - 'Issue がボードに無ければ、進行の欄を Ready にしてボードに載せます。'
      - '既定の Status が、自動処理の書いた Needs Attention なら、開いた PR があれば In Progress に、無ければ Todo に戻します。pecot の判定が置いた Needs Attention は戻しません。'
      - 'どちらでもなければ、ボードに何も書きません。'
      - 'プロジェクトの設定に `fields.status` が要ります。'
    stdin: none
    output:
      format: text
      description: 'outputs の `context-file` は、文脈を書いた JSON のファイルのパスです。ファイルの欄は、`issue`（`ref`・`title`・`body`）・`plan`・`results`・`answers`（`author`・`body`）・`withheld`・`branch`・`pr` です。計画やブランチが無いときは空、PR が無いときは `0` です。'
    diagnostics: '実行のログに、ボードに載せたときは `added` の行を、Status を戻したときは `set` の行を出します。本文を書かなかったコメントがあるときは、その数を `count` の行で出します。'
    environment:
      - name: RUNNER_TEMP
        effect: '文脈のファイルを置く、runner の一時ディレクトリです。無いか空なら、何も読まずに step を失敗にします。'
      - name: GITHUB_REPOSITORY
        effect: '`issue` が番号だけのときに補うリポジトリです。'
    exit_status:
      - kind: invalid-input
        when: '`RUNNER_TEMP` がありません。step は失敗になります。'
      - kind: invalid-input
        when: '`issue` の形が誤っています。step は失敗になります。'
      - kind: not-initialized
        when: 'プロジェクトの設定に `fields.status` がありません。step は失敗になります。'
      - kind: status-not-configured
        when: '設定に、要る選択肢がありません。ボードに載せるときは進行の欄の Ready が、Status を戻すときは Todo か In Progress が要ります。step は失敗になります。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。step は失敗になります。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。step は失敗になります。'
      - kind: repo-not-in-project
        when: 'リポジトリがプロジェクトにありません。step は失敗になります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。step は失敗になります。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。step は失敗になります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: 'ボードへ書く前に止まったときは、何も書きません。step が失敗すると、後の auto-finish が `start-outcome` を見て `setup-missing` の結果のコメントを書きます。呼び直せば、同じ判定でボードに載せるか、Status を戻します。'
    effects:
      - target: github
        kind: read
        what: 'Issue の本文・進行の欄・Status・ブランチ・PR、Issue のコメント、コメントを書いた人の権限、ボードの項目を読みます。'
      - target: github
        kind: write
        what: 'Issue をボードに載せます。'
      - target: github
        kind: destructive
        what: '載せた Issue の進行の欄を Ready にするか、既定の Status を Todo か In Progress に戻します。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。'
      - target: file
        kind: write
        what: '`RUNNER_TEMP` の下の `pecot-auto/context.json` に文脈を書き、outputs のファイル（`GITHUB_OUTPUT`）に `context-file` を足します。'
    prerequisites:
      - 'リポジトリを checkout した後の step で呼びます。'
      - '対象のリポを含み、`fields.status` を持つプロジェクトの設定が要ります。'
      - 'プロジェクトを編集する権限を持つ GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          issue: '${{ needs.gate.outputs.number }}'
        note: 'Status を戻し、続きに要る文脈をファイルに書きます。'
    default_notes:
      issue: '番号だけの形は、`GITHUB_REPOSITORY` のリポジトリで補います。'
    behaviors:
      - id: PA-AUTO-START-01
        pattern: event
        statement: 'ボードにあり、Status を自動処理が書いていない Issue で呼ぶと、ボードに何も書かずに、計画・前回までの結果・答え・ブランチ・PR を文脈のファイルに書きます'
      - id: PA-AUTO-START-02
        pattern: unwanted
        statement: 'もし計画か答えを書いた人が書き込み権限を持たないなら、その本文を書かず、数を `withheld` に入れます'
      - id: PA-AUTO-START-03
        pattern: event
        statement: 'ボードに無い Issue で呼ぶと、進行の欄を Ready にしてボードに載せます'
      - id: PA-AUTO-START-04
        pattern: event
        statement: 'Status が自動処理の書いた Needs Attention の Issue で呼ぶと、開いた PR があれば In Progress に、無ければ Todo に戻します'
      - id: PA-AUTO-START-05
        pattern: unwanted
        statement: 'もし Needs Attention を pecot の判定が置いたなら、Status を戻しません'
      - id: PA-AUTO-START-06
        pattern: unwanted
        statement: 'もし `RUNNER_TEMP` が無いなら、何も読まずに step を失敗にします'
      - id: PA-AUTO-START-07
        pattern: unwanted
        statement: 'もしプロジェクトの設定に `fields.status` か、戻す Status の選択肢が無いなら、書かずに `project init` を案内して step を失敗にします'
      - id: PA-AUTO-START-08
        pattern: ubiquitous
        statement: '常に、トークンの値を、実行のログと文脈のファイルに書きません'
      - id: PA-AUTO-START-09
        pattern: event
        statement: '呼ぶと、文脈を書いたファイルのパスを outputs の `context-file` に出します'
  PA-AUTO-FINISH:
    summary: '自動処理の実行を終えます。結果を決めて Issue に結果のコメントを書き、待ちの Status を書き、起動ラベルを外します。'
    arguments:
      token: 'コメント・ボード・ラベルを書く GitHub トークンです。ワークフローの App のトークンを渡します。'
      issue: 'Issue の参照です。ワークフローのリポジトリの Issue の番号か、`owner/repo/N` で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
      result-file: 'スキルが書く結果のファイルのパスです。結果は frontmatter の `result` に、コメントに足す文は本文に書きます。ファイルが無ければ、スキルが結果を書かなかったとみなします。'
      job-status: 'job の終わり方（`job.status`）です。`success`・`failure`・`cancelled` のどれかです。`result` の無いときに要ります。'
      execution-file: 'claude-code-action の出力 `execution_file` のパスです。省いても、空でもかまいません。'
      start-outcome: 'auto-start の step の終わり方（`steps.<id>.outcome`）です。`result` の無いときに要ります。'
      result: '決めた結果をそのまま書くときの結果です。setup job が `setup-missing` を渡します。`pr-created`・`ci-passed`・`ci-fix-pushed`・`question`・`out-of-scope`・`failed`・`limit`・`setup-missing` のどれかです。'
      body-file: '`result` のときの、コメントに足す文を書いたファイルのパスです。'
    constraints:
      - conflicts: [result, job-status]
      - conflicts: [result, start-outcome]
      - conflicts: [result, result-file]
      - conflicts: [result, execution-file]
      - requires: {body-file: [result]}
    details:
      - '自動処理の job の最後の step（`if: always()`）が、`job-status`・`start-outcome`・`result-file`・`execution-file` を渡して呼びます。setup job は、決めた結果を `result` と `body-file` で渡して呼びます。'
      - '`result` の無いときは、上から順に見て、最初に当たったもので結果を決めます。'
      - '`start-outcome` が `success` でなければ、`setup-missing` にします。本文には、Start の step が成功しなかったことを書きます。'
      - '`result-file` のファイルがあれば、frontmatter の `result` を結果とし、本文をコメントに足します。本文の先頭の HTML コメントは除きます。frontmatter が無いか、`result` が決まった値でなければ、`warning` の行を出し、読めなかった理由を本文にして `failed` にします。'
      - 'ファイルが無く、job が `success` なら、スキルが結果を書かずに終わったことを本文にして `failed` にします。'
      - 'ファイルが無く、job が `cancelled` なら `limit` にします。`failure` なら、`execution-file` の最後の `result` の行が `error_max_turns` のとき `limit` に、ほかは `failed` にします。'
      - '結果が `question`・`failed`・`limit` のときは、コメントを書き、既定の Status（`fields.status`）を Needs Attention にし、起動ラベルを外します。'
      - '結果が `pr-created`・`out-of-scope`・`setup-missing` のときは、コメントを書き、起動ラベルを外します。Status は書きません。'
      - '結果が `ci-passed`・`ci-fix-pushed` のときは、コメントだけを書きます。'
      - '本文の先頭に、結果・`GITHUB_RUN_ID`・`GITHUB_RUN_ATTEMPT`・ブランチを入れた、画面に出ない目印の行を付けます。ブランチは、Issue に紐づく開いた PR の head です。PR が無ければ、Development のブランチのうち、末尾が Issue の番号のものです。'
      - '同じ目印を持つ bot のコメントがあれば、コメントを書きません。起動ラベルが残っていれば外し、結果が待ちの Status を書くものなら、Status も書き直します。'
      - 'Issue がボードに無いか、Status に Needs Attention の選択肢が無いときは、足りない設定をコメントに書き、Status を変えずに step を成功にします。'
      - '外す起動ラベルの名前は、`PECOT_AUTO_LABEL` から読みます。無ければ `pecot-auto` です。ラベルが既に外れていても、失敗にしません。'
      - 'プロジェクトの設定に `fields.status` が要ります。'
      - '本文は、テンプレート `auto-result` を埋めて作ります。トークンの値と secret の値を書きません。'
    stdin: none
    output:
      format: none
    diagnostics: '実行のログに、書いたコメントの URL の行と、書いたものを `created`・`set`・`removed` の行で出します。書かなかったときは、理由を添えた `skipped` の行を出します。起動ラベルが既に外れていたときは `unchanged` の行を、Status を書けないときと結果のファイルを読めないときは `warning` の行を出します。本文がテンプレートに合わないときは、`error` の行を出します。'
    environment:
      - name: PECOT_AUTO_LABEL
        effect: '外す起動ラベルの名前です。無いか空なら `pecot-auto` にします。'
      - name: GITHUB_RUN_ID
        effect: '目印に入れる実行の ID です。実行の記録の URL にも使います。無いか空なら、目印を付けず、既にあるコメントも読みません。'
      - name: GITHUB_RUN_ATTEMPT
        effect: '目印に入れる試行の番号です。無いか空なら `1` にします。'
      - name: GITHUB_REPOSITORY
        effect: '`issue` が番号だけのときに補うリポジトリです。実行の記録の URL にも入れます。無いか空なら、実行の記録を「分からない」と書きます。'
      - name: GITHUB_SERVER_URL
        effect: '実行の記録の URL のホストです。無いか空なら `https://github.com` にします。'
    exit_status:
      - kind: invalid-input
        when: '`result` と、`job-status`・`start-outcome`・`result-file`・`execution-file` のどれかを一緒に渡しました。`result` の無いときに `job-status` か `start-outcome` が無いとき、`result` の無い `body-file`、無い `body-file` のファイルも同じです。step は失敗になります。'
      - kind: invalid-input
        when: '`issue` の形が誤っているか、`result`・`job-status`・`start-outcome` が決まった値でありません。step は失敗になります。'
      - kind: not-initialized
        when: 'プロジェクトの設定に `fields.status` がありません。step は失敗になります。'
      - kind: content-invalid
        when: '埋めた本文がテンプレートに合いません。何も書かずに step を失敗にします。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。step は失敗になります。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。step は失敗になります。'
      - kind: repo-not-in-project
        when: 'リポジトリがプロジェクトにありません。step は失敗になります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。step は失敗になります。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。step は失敗になります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: 'コメントを書く前に止まったときは、Issue に何も残りません。コメントの後で Status かラベルの書き込みに失敗したときは、同じ run を再実行せずに step を呼び直すと、同じ実行の目印を見て、コメントを重ねずに書き直します。'
    effects:
      - target: github
        kind: write
        what: 'Issue に結果のコメントを 1 つ書きます。'
      - target: github
        kind: destructive
        what: 'ボードの既定の Status を書き、起動ラベルを外します。'
      - target: github
        kind: read
        what: 'Issue のブランチと PR、Issue のコメント、ボードの項目を読みます。'
      - target: file
        kind: read
        what: '`result-file`・`body-file`・`execution-file` のファイルと、プロジェクトの設定ファイルを読みます。'
    prerequisites:
      - 'リポジトリを checkout した後の step で呼びます。'
      - '対象のリポを含み、`fields.status` を持つプロジェクトの設定が要ります。'
      - 'Issue とプロジェクトを編集する権限を持つ GitHub トークンが要ります。'
    idempotent: false
    examples:
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          issue: '${{ needs.gate.outputs.number }}'
          job-status: '${{ job.status }}'
          start-outcome: '${{ steps.start.outcome }}'
          result-file: '${{ runner.temp }}/pecot-auto/result.md'
          execution-file: '${{ steps.claude.outputs.execution_file }}'
        note: '自動処理の job の最後に、結果を決めてコメントを書きます。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          issue: '${{ needs.gate.outputs.number }}'
          result: setup-missing
          body-file: '${{ steps.check.outputs.body-file }}'
        note: 'setup job で、足りない設定を書いた本文の `setup-missing` を書きます。'
    default_notes:
      issue: '番号だけの形は、`GITHUB_REPOSITORY` のリポジトリで補います。'
    behaviors:
      - id: PA-AUTO-FINISH-01
        pattern: event
        statement: '結果が `question`・`failed`・`limit` だと、結果のコメントを書き、Status を Needs Attention にして、起動ラベルを外します。コメントの URL を実行のログに出します'
      - id: PA-AUTO-FINISH-02
        pattern: event
        statement: '結果が `pr-created`・`out-of-scope`・`setup-missing`・`ci-passed`・`ci-fix-pushed` だと、Status を書きません。`ci-passed`・`ci-fix-pushed` では、起動ラベルを残します'
      - id: PA-AUTO-FINISH-03
        pattern: unwanted
        statement: 'もし起動ラベルが既に外れているなら、`unchanged` の行を出して step を成功にします'
      - id: PA-AUTO-FINISH-04
        pattern: state
        statement: '`PECOT_AUTO_LABEL` がある間、その名前のラベルを起動ラベルとして外します'
      - id: PA-AUTO-FINISH-05
        pattern: unwanted
        statement: 'もし Issue がボードに無いか、Status に Needs Attention の選択肢が無いなら、Status を書きません。足りない設定をコメントに書き、`warning` の行を出して step を成功にします'
      - id: PA-AUTO-FINISH-06
        pattern: unwanted
        statement: 'もし `result-file` のファイルが無く、job が `success` なら、スキルが結果を書かずに終わったことを本文にして `failed` を書きます'
      - id: PA-AUTO-FINISH-07
        pattern: unwanted
        statement: 'もし `result-file` のファイルが無く、job が `cancelled` か、実行のファイルの最後の `result` が `error_max_turns` なら、`limit` を書きます。ほかの失敗では `failed` を書きます'
      - id: PA-AUTO-FINISH-08
        pattern: unwanted
        statement: 'もし同じ実行・同じ試行の目印を持つ bot のコメントがあるなら、コメントを書きません。Status と起動ラベルを書き直し、`skipped` の行を出します'
      - id: PA-AUTO-FINISH-09
        pattern: state
        statement: '`GITHUB_RUN_ID` が無い間、目印を付けず、Issue のコメントを読みません'
      - id: PA-AUTO-FINISH-10
        pattern: unwanted
        statement: 'もし `result` と job から決める入力を一緒に渡したか、`result` の無いときに `job-status` か `start-outcome` が無いなら、何も読まずに step を失敗にします。無い `body-file` のファイルも同じです'
      - id: PA-AUTO-FINISH-11
        pattern: unwanted
        statement: 'もし `start-outcome` が `success` でないなら、結果のファイルがあっても、Start の step の失敗を本文にして `setup-missing` を書きます'
      - id: PA-AUTO-FINISH-12
        pattern: unwanted
        statement: 'もしプロジェクトの設定に `fields.status` が無いなら、何も読まずに、`project init` を案内して step を失敗にします'
      - id: PA-AUTO-FINISH-13
        pattern: event
        statement: '`start-outcome` が `success` で `result-file` のファイルがあると、job の終わり方にかかわらず、frontmatter の `result` と本文をそのまま書きます'
      - id: PA-AUTO-FINISH-14
        pattern: unwanted
        statement: 'もし結果のファイルに frontmatter が無いか、`result` が決まった値でないなら、`warning` の行を出し、読めなかった理由を本文にして `failed` を書きます'
      - id: PA-AUTO-FINISH-15
        pattern: ubiquitous
        statement: '常に、トークンの値を、実行のログとコメントに書きません'
      - id: PA-AUTO-FINISH-16
        pattern: event
        statement: 'Issue に紐づく開いた PR があると、目印のブランチに、その PR の head を書きます'
  PA-GITHUB-OPS:
    summary: '公式の GitHub の MCP に手の無い GitHub の操作を 1 つ行い、結果を実行のログの `PECOT_RESULT` の行に JSON で出します。'
    arguments:
      token: '操作に使う GitHub トークンです。`link-branch`・`stack-register`・`repo-settings` には `GITHUB_TOKEN` を、ほかの操作には App のトークンを渡します。'
      operation: '行う操作の名前です。`params` の説明に並べた 8 つの操作のどれかを渡します。'
      request-id: '呼び出し元が決める ID です。結果の行にそのまま入ります。省くと空の文字列です。'
      params: '操作ごとの値を入れた JSON のオブジェクトです。省くと `{}` です。'
    constraints: []
    details:
      - 'スキルが、公式の GitHub の MCP の `actions_run_trigger` で `pecot-github-ops.yml` を起動し、その job の step が呼びます。'
      - 'どの操作も、渡された中身を書くか、読んだ値を返すだけです。何を書くかは呼び出し元が決めます。'
      - '`link-branch` は `issue`・`branch`・`base` を受け、`base` の先頭から Issue につながったブランチを作ります。`base` を省くと、リポの既定のブランチを使います。'
      - '`stack-register` は `pr`・`parent_pr` を受け、子の PR を親の PR の直後へ登録します。親がスタックに無いときはスタックを作り、親が一番上なら足します。子が既に親の直後にあるときは書きません。'
      - '`project-fields` は `project`・`changes` を受けます。`changes` の各項目は、`create`・`rename`・`delete`・`set-options` のどれかです。並べた順に 1 つずつ書き、書く前に欄を読み直します。'
      - '`set-options` は、名前の合う既存の選択肢の ID・色・説明を引き継ぎます。ID を外すと選択肢が作り直され、カードの値が消えるためです。'
      - '`project-view` は `project`・`name`・`column`・`row` を受け、列と行を単一選択の欄で分けたボードのビューを作ります。同じ名前のビューがあれば、作らずに返します。'
      - '`project-link` は `project`・`repo` を受け、リポをボードにつなぎます。`repo` を省くと、ワークフローが動くリポを使います。'
      - '`repo-settings` は、`delete_branch_on_merge`・既定のブランチ・持ち主の種類を返します。'
      - '`workflow-doctor` は、secret と variable の名前と、checkout したリポに置いた pecot のワークフローの雛形の目印を返します。値は読みません。揃っているかの判定はしません。'
      - '`release-create` は `tag`・`sha`・`body`・`name`・`prerelease` を受け、`sha` の commit にタグを付けてリリースを作ります。`name` を省くとタグを名前にします。'
      - 'ボードは、ワークフローが動くリポと同じ組織のものだけを扱います。'
    stdin: none
    output:
      format: text
      description: 'outputs はありません。実行のログに、`PECOT_RESULT ` に続けて JSON を書いた行を 1 つ出します。JSON は `operation`・`request_id`・`ok` と、成功なら `result`、失敗なら `error`（`kind`・`message`）を持ちます。'
    diagnostics: '失敗したときは、結果の行に加えて、標準エラーに `error:` の行を出します。'
    environment:
      - name: GITHUB_REPOSITORY
        effect: '操作するリポジトリです。ボードの持ち主にもします。'
      - name: GITHUB_SERVER_URL
        effect: '`token` を渡す先の GitHub のホストです。無いか空なら `github.com` にします。'
      - name: GITHUB_WORKSPACE
        effect: '`workflow-doctor` だけが読みます。checkout したリポのディレクトリです。無ければ作業ディレクトリを使います。'
    exit_status:
      - kind: invalid-input
        when: '`operation` が一覧に無いか、`params` が JSON でないか、操作の値の形と合いません。単一選択でない欄に `set-options` を渡したときも含みます。GitHub を呼ばずに、step を失敗にします。'
      - kind: already-exists
        when: '`project-fields` の `create` で、同じ名前の欄が既にあります。step は失敗になります。'
      - kind: order-conflict
        when: '`stack-register` で、親が一番上でないスタックにあるか、子が別のスタックにあります。書かずに、step を失敗にします。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。`repo-settings` で `delete_branch_on_merge` が返らないときも含みます。step は失敗になります。'
      - kind: github-not-found
        when: 'ボード・欄・Issue・ブランチが GitHub に見つかりません。step は失敗になります。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。step は失敗になります。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。`project-link` でつなげなかったときも含みます。step は失敗になります。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。step は失敗になります。'
    on_error: '失敗した操作は、そこで止めます。`project-fields` で途中の変更が失敗したときは、書いた変更を巻き戻しません。成否にかかわらず、結果の行を 1 つ出します。'
    effects:
      - target: github
        kind: write
        what: '`link-branch` はブランチを作り、`stack-register` はスタック PR を登録し、`project-view` はビューを作り、`project-link` はリポをボードにつなぎます。'
      - target: github
        kind: destructive
        what: '`project-fields` は、ボードの欄を作り・名前を変え・消し、選択肢を書き換えます。'
      - target: github
        kind: write
        what: '`release-create` は、タグとリリースを作ります。'
      - target: github
        kind: read
        what: '`repo-settings` はリポの設定を、`workflow-doctor` は secret と variable の名前を読みます。'
      - target: file
        kind: read
        what: '`workflow-doctor` は、checkout したリポの `.github/workflows` の下の pecot の雛形を読みます。'
    prerequisites:
      - '`workflow_dispatch` で起動したワークフローの step で呼びます。`workflow-doctor` は、リポを checkout した後の step で呼びます。'
      - '操作に合った権限を持つ GitHub トークンが要ります。権限は `pecot-github-ops.yml` の雛形の先頭のコメントにあります。'
    idempotent: false
    examples:
      - arguments:
          token: '${{ github.token }}'
          operation: link-branch
          request-id: 'cuj-1'
          params: '{"issue":7,"branch":"feat/demo/7"}'
        note: 'Issue #7 につながったブランチを、既定のブランチの先頭から作ります。'
      - arguments:
          token: '${{ steps.app-token.outputs.token }}'
          operation: project-view
          params: '{"project":3,"name":"Lanes","column":"pecot-status","row":"pecot-lane"}'
        note: 'ボード #3 に、`pecot-status` を列、`pecot-lane` を行にしたビューを作ります。'
    default_notes:
      request-id: '省くと空の文字列です。'
      params: '省くか空なら `{}` として読みます。'
    behaviors:
      - id: PA-GITHUB-OPS-01
        pattern: event
        statement: '操作が成功すると、`operation`・`request_id`・`ok: true`・`result` を入れた `PECOT_RESULT` の行を 1 つ出します'
      - id: PA-GITHUB-OPS-02
        pattern: unwanted
        statement: 'もし `operation` か `params` が誤っているなら、GitHub を呼ばず、`invalid-input` の結果の行を出して step を失敗にします'
      - id: PA-GITHUB-OPS-03
        pattern: unwanted
        statement: 'もし GitHub が操作を断るか接続が切れたなら、`ok: false` と失敗の種類と GitHub の文を入れた結果の行を出し、step を失敗にします'
      - id: PA-GITHUB-OPS-04
        pattern: event
        statement: '`link-branch` を呼ぶと、`base` か既定のブランチの先頭から Issue につながったブランチを作り、ブランチ名・元のブランチ・commit を返します'
      - id: PA-GITHUB-OPS-05
        pattern: unwanted
        statement: 'もし `link-branch` で GitHub がブランチの作成を断ったなら、GitHub の文を入れた `ok: false` の行を出します'
      - id: PA-GITHUB-OPS-06
        pattern: event
        statement: '`stack-register` を呼ぶと、親の PR のスタックを作るか一番上に子の PR を足し、登録後の PR の並びを返します'
      - id: PA-GITHUB-OPS-07
        pattern: unwanted
        statement: 'もし子の PR が既に親の直後へ並んでいるなら、書き込まず `unchanged` を返します。その順で登録できないなら、書き込まず `order-conflict` を返します'
      - id: PA-GITHUB-OPS-08
        pattern: event
        statement: '`project-fields` を呼ぶと、`changes` を並べた順に書き、書いた後の欄と選択肢の ID を返します'
      - id: PA-GITHUB-OPS-09
        pattern: unwanted
        statement: 'もし `changes` の項目が欄の有無や種類と合わないなら、その項目を書かずに `ok: false` を返します。`set-options` では、名前の合う選択肢の ID を引き継ぎます'
      - id: PA-GITHUB-OPS-10
        pattern: event
        statement: '`project-view` を呼ぶと、列と行の欄で分けたビューを作ります。同じ名前のビューがあれば、作らずに `created: false` で返します'
      - id: PA-GITHUB-OPS-11
        pattern: event
        statement: '`project-link` を呼ぶと、リポをボードにつなぎ、`linked` か `already_linked` を返します。つなげなければ `ok: false` を返します'
      - id: PA-GITHUB-OPS-12
        pattern: event
        statement: '`repo-settings` を呼ぶと、`delete_branch_on_merge`・既定のブランチ・持ち主の種類を返します。`delete_branch_on_merge` が返らなければ `github-auth` を返します'
      - id: PA-GITHUB-OPS-13
        pattern: event
        statement: '`workflow-doctor` を呼ぶと、secret と variable の名前と、置いたワークフローの雛形の目印を返します。読めない一覧は `complete: false` にします'
      - id: PA-GITHUB-OPS-14
        pattern: event
        statement: '`release-create` を呼ぶと、渡したタグ・commit・本文でリリースを作り、`id`・タグ・URL を返します'
      - id: PA-GITHUB-OPS-15
        pattern: ubiquitous
        statement: '常に、トークンの値を、結果の行と標準エラーに書きません'
