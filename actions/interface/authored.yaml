      - id: PA-SESSION-FINISH-36
        pattern: unwanted
        statement: 'もし読み直しても、閉じた Issue が済んだ前提として判定に出ないなら、pecot-board-sync のワークフローを案内する `warning` の行を出して列を動かしません'
      - id: PA-SESSION-FINISH-37
        pattern: event
        statement: '`dry-run` を `true` にして呼ぶと、閉じる予定の Issue を済んだものとして判定し、列を書かずに、判定の変化を出します'
      - id: PA-SESSION-FINISH-38
