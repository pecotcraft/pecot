      - id: PA-SESSION-FINISH-48
        pattern: unwanted
        statement: 'もし `dry-run` が `true`・`false` のどちらでもないなら、GitHub を読まず、入力の誤りの `error` の行を出して step を失敗にします'
      - id: PA-SESSION-FINISH-49
        pattern: event
        statement: '`pr` に番号だけを渡すと、ワークフローが動くリポジトリの PR として片付けます'
  PA-REVIEW-FINISH:
    summary: '自動レビューのワークフローの後始末の step から呼び、レビューを終えます。レビューが止まったときだけ、止まったことを知らせるコメントを PR に 1 つ書きます。'
    arguments:
      token: 'PR を読み、コメントを書くトークンです。ワークフローの App のトークンを渡します。'
      pr: 'PR の参照です。ワークフローが動くリポの PR の番号 `N` か、`owner/repo/N` で渡します。'
      job-status: 'job の終わり方（`job.status`）です。`success`・`failure`・`cancelled` のどれかです。'
      execution-file: 'claude-code-action の出力 `execution_file` のパスです。'
      since: '自動レビューの step を始めた時刻です。ISO 8601 で渡します。この時刻より後のインラインコメントから、止まった場所を決めます。空なら渡さないのと同じです。'
      review-outcome: '自動レビューの step の `outcome` です。`success`・`failure`・`cancelled`・`skipped` のどれかです。'
      review-conclusion: 'claude-code-action の出力 `conclusion` です。Claude Code を動かさなかった run では空なので、空のまま渡します。'
      review-has-token: 'claude-code-action の出力 `github_token` があるかどうかです。`true` か `false` で渡し、トークンの値は受け取りません。'
    constraints: []
    details:
      - '判定は、上から順に見て、最初に当たったもので決めます。'
      - '自動レビューの step が `success` で `conclusion` が空なら、書きません。PR のブランチで雛形を変えたので、action がレビューを飛ばした run です。合言葉で起こし直してもこの PR では動かないことを、`skipped` の行で知らせます。'
      - 'job が `success` のときは、コメントを書かずに、理由を `skipped` の行に出します。'
      - 'job が `cancelled` のときは、`limit` として書きます。時間の上限と、人が run を取り消したときを見分けません。'
      - 'job が `failure` のときは、まず `execution-file` の最後の `result` の行を見ます。'
      - '`execution-file` の最後の `result` の行が `error_max_turns` なら、`limit` として書きます。'
      - '`is_error` が真で `terminal_reason` が `api_error` なら、`failed` として書きます。`result` の文か `errors` に `authentication_error` があれば、トークンを作り直す手順を添えます。'
      - '次に、自動レビューの step が `failure` で `github_token` が無ければ、`setup-missing` にします。Claude の GitHub App を入れる手順を添えます。'
      - 'ほかの `failure` は `failed` として書きます。step が `failure` で `conclusion` が空なら、`GITHUB_ACTOR` の権限を読み、`admin` か `write` でなければ書きません。'
      - '止まった場所は、`since` より後に作られ、先頭が `**F-NN**` のインラインコメントがあるかで決めます。`since` が無ければ「分からない」と書きます。'
      - '本文の末尾に、`GITHUB_RUN_ID` と `GITHUB_RUN_ATTEMPT` を入れた、画面に出ない目印の行を付けます。同じ目印を持つ bot のコメントがあれば、書きません。'
      - '閉じている PR には書きません。プロジェクトの設定は読まず、ホストは `github.com` です。'
      - '本文は、action が持つテンプレート `review-stopped` を埋めて作ります。トークンの値と secret の値を書きません。'
    stdin: none
    output:
      format: none
    diagnostics: 'コメントを書いたときは、その URL を標準出力に出します。標準エラーに、書いたときは `created` の行を、書かなかったときは理由を添えた `skipped` の行を出します。権限を読めないときは `warning` の行を出して書きます。本文がテンプレートに合わないときは、`error` の行を出します。'
    environment:
      - name: GITHUB_RUN_ID
        effect: '目印に入れる実行の ID です。無いか空なら、目印を付けず、既にあるコメントも読みません。'
      - name: GITHUB_RUN_ATTEMPT
        effect: '目印に入れる試行の番号です。無いか空なら `1` にします。'
      - name: GITHUB_ACTOR
        effect: '自動レビューの step が `conclusion` の空の `failure` のときに、権限を読む利用者です。無いときと空のときは、権限を読まずに書きます。名前が `[bot]` で終わるときも同じです。'
      - name: GITHUB_REPOSITORY
        effect: '`pr` が番号だけのときに補う `owner/repo` です。'
      - name: PECOT_REVIEW_TRIGGER_PHRASE
        effect: '次にすることの文に書く合言葉です。無いか空なら `@pecotbot review` を書きます。'
    exit_status:
      - kind: invalid-input
        when: '`since` が ISO 8601 の時刻ではありません。何も読んでいません。'
      - kind: invalid-input
        when: '要る input が無いか、`job-status`・`review-outcome`・`review-has-token` の値が選べるもののどれでもないか、`pr` の形が誤っています。'
      - kind: content-invalid
        when: '埋めた本文がテンプレートに合いません。何も書いていません。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。'
    on_error: 'コメントを書く前に止まったときは、PR に何も残りません。同じ実行の目印は、書いたコメントにだけ付くので、step を動かし直せば書きます。'
    effects:
      - target: github
        kind: write
        what: 'PR に、止まったことを知らせるコメントを 1 つ書きます。'
      - target: github
        kind: read
        what: 'PR の状態、PR のコメント、行のコメント、起動した人の権限を読みます。'
      - target: file
        kind: read
        what: '`execution-file` のファイルを読みます。'
    prerequisites:
      - '`token` に、`github.com` の PR を読み、コメントを書けるトークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          pr: '123'
          job-status: failure
          review-outcome: failure
          review-conclusion: failure
          review-has-token: 'true'
          execution-file: /home/runner/work/_temp/claude-execution-output.json
          since: '2026-11-17T10:00:00Z'
        note: 'ワークフローの後始末から、job が失敗したときにコメントを書きます。'
    default_notes:
      pr: '番号だけの `N` は、ワークフローが動くリポ（`GITHUB_REPOSITORY`）の PR にします。'
    behaviors:
      - id: PA-REVIEW-FINISH-01
        pattern: event
        statement: 'job と自動レビューの step が `failure` で、同じ実行のコメントが無いと、`failed` のコメントを PR に 1 つ書き、その URL を標準出力に出します'
      - id: PA-REVIEW-FINISH-02
        pattern: unwanted
        statement: 'もし同じ実行・同じ試行の目印を持つ bot のコメントがあるなら、書かずに `skipped` の行を出し、step を成功にします'
      - id: PA-REVIEW-FINISH-03
        pattern: event
        statement: 'job が `cancelled` だと、`limit` のコメントを書きます'
      - id: PA-REVIEW-FINISH-04
        pattern: event
        statement: '実行のファイルの最後の `result` が `error_max_turns` だと、`limit` のコメントを書きます'
      - id: PA-REVIEW-FINISH-05
        pattern: event
        statement: '実行のファイルの最後の `result` が `api_error` の認証の失敗だと、トークンを作り直す手順を添えた `failed` のコメントを書きます'
      - id: PA-REVIEW-FINISH-06
        pattern: event
        statement: '自動レビューの step が `failure` で `github_token` が無いと、Claude の GitHub App を入れる手順を添えた `setup-missing` のコメントを書きます'
      - id: PA-REVIEW-FINISH-07
        pattern: unwanted
        statement: 'もし step が `conclusion` の空の `failure` で、起動した人に `write` の権限が無いなら、書かずに `skipped` の行を出します'
      - id: PA-REVIEW-FINISH-09
        pattern: event
        statement: 'job が `success` だと、PR を読まず、書かずに `skipped` の行を出します'
      - id: PA-REVIEW-FINISH-10
        pattern: unwanted
        statement: 'もし PR が閉じているなら、書かずに `skipped` の行を出します'
      - id: PA-REVIEW-FINISH-11
        pattern: event
        statement: '`since` より後に `**F-NN**` で始まるインラインコメントがあると、止まった場所を「インラインコメントを投稿した後」と書きます'
      - id: PA-REVIEW-FINISH-12
        pattern: state
        statement: '`GITHUB_RUN_ID` が無い間、目印を付けず、PR のコメントを読みません'
      - id: PA-REVIEW-FINISH-13
        pattern: unwanted
        statement: 'もし要る input が無いか、値が選べるもののどれでもないか、`since` が ISO 8601 でないなら、何も読まずに step を失敗にします'
      - id: PA-REVIEW-FINISH-14
        pattern: ubiquitous
        statement: '常に、トークンの値を、標準出力・標準エラー・コメントに書きません'
      - id: PA-REVIEW-FINISH-17
        pattern: event
        statement: '起動した人の権限を読めないと、`warning` の行を出して、コメントを書きます'
      - id: PA-REVIEW-FINISH-18
        pattern: event
        statement: '`since` に空の値を渡すと、止まった場所を「分からない」と書きます'
      - id: PA-REVIEW-FINISH-19
        pattern: event
        statement: '自動レビューの step が `success` で `conclusion` が空だと、PR を読まずに、雛形の食い違いを理由に添えた `skipped` の行を出します'
  PA-TRACKER-SYNC:
    summary: 'ワークフローが動くリポで、`source` に選んだものの一覧を、open の Tracker に書き直します。`dependabot` は人の判断を待つ Dependabot の PR、`security` は open のセキュリティ alert です。'
    arguments:
      token: 'PR か alert を読み、Tracker とボードに書くトークンです。ワークフローの App のトークンか PAT を渡します。'
      source: 'Tracker に載せるものです。`dependabot` は人の判断を待つ Dependabot の PR、`security` は open のセキュリティ alert です。どちらかを必ず渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、ワークフローが動くリポを含む設定を使います。'
      dry-run: '`true` なら、何も変えずに、Tracker を変える予定の行だけを出します。既定は `false` です。'
    constraints: []
    details:
      - '`source` で、Tracker に載せるものを選びます。`dependabot` は人の判断を待つ Dependabot の PR、`security` は open のセキュリティ alert です。'
      - '`dependabot` では、ラベルが `dependabot-pr` で、本文に Tracker の印がある open の Tracker の Issue を探します。'
      - '`dependabot` では、Tracker の本文の `list-begin` と `list-end` の間にある表を書き直します。'
      - '`dependabot` では、表には、人の判断を待つ open の Dependabot の PR を載せます。'
      - '`dependabot` では、判断を待つ理由の無い PR は載せません。'
      - '`dependabot` では、PR が自動マージの対象になるのは、次の 2 つがそろうときです。最初のコミットの作者が `dependabot[bot]` で、署名が有効なこと。分かっている update type のうち最大のものが minor か patch であること。'
      - '`dependabot` では、update type が不明の依存は、ほかの依存の type が分かっている間は無視します。PR を不明として数えるのは、どの依存の type も分からないときだけです。'
      - '`dependabot` では、update type が major か不明の PR は載せます。'
      - '`dependabot` では、対象の PR は、検証が失敗していると載せます。'
      - '`dependabot` では、自動マージを入れた対象の PR は、最後の push から 24 時間たっても検証が終わらないと載せます。'
      - '`dependabot` では、対象の PR は、30 分を超えて競合していると載せます。最後の push と base ブランチの最新のコミットのうち、遅い方から数えます。'
      - '`dependabot` では、対象の PR は、最後の push の後で merge queue から外され、自動マージも merge queue の登録も無いと載せます。'
      - '`dependabot` では、自動マージも merge queue の登録も無い対象の PR は、最後の push から 30 分たつと載せます。'
      - '`dependabot` では、最後の push は、最後の force push です。force push が無ければ、PR の作成です。'
      - '`dependabot` では、表の各行は、PR の題、PR へのリンク、検証の状態（passed・failed・pending・none）です。'
      - '`dependabot` では、判断を待つ理由は、Tracker の表に入れず、結果の行に出します。'
      - '`dependabot` では、open の Tracker が無く、載せる PR があるときは、Tracker を作ってプロジェクトのボードに足します。Status を Backlog にします。ほかの欄には値を入れません。'
      - '`dependabot` では、open の Tracker が無く、載せる PR も無いときは、何も作りません。'
      - '`dependabot` では、一覧が空で open の Tracker があるときは、一覧を none にし、Tracker を completed として閉じます。'
      - '`dependabot` では、閉じない open の Tracker には、Status が空の間だけ値を入れます。人が変えた値は残ります。'
      - '`security` では、ラベルが `security-alert` で、本文に Tracker の印がある open の Tracker の Issue を探します。'
      - '`security` では、Tracker の本文の `list-begin` と `list-end` の間にある一覧を、open の alert で書き直します。'
      - '`security` では、open の Dependabot alert と secret scanning alert を読みます。code scanning alert は、既定ブランチの open のものを読みます。'
      - '`security` では、Tracker の本文の見出しと表を、alert の種類ごとに分けます。'
      - '`security` では、表の 3 列目は Severity で、GitHub の alert の重大度をそのまま出します。Dependabot は脆弱性の重大度（critical・high・medium・low）です。code scanning は rule の security severity level で、無ければ rule の severity（error・warning・note・none）です。'
      - '`security` では、GitHub が重大度を持たない secret scanning alert と、重大度の無い alert には `-` を出します。'
      - '`security` では、行を重大度の高い順に並べ、同じなら番号の順にします。順は critical、high と error、medium と warning、low と note、none、`-` です。Dependabot の 1 つの advisory の行は、その alert のうち最も高い重大度を出します。'
      - '`security` では、code scanning alert と secret scanning alert の行では、題を `masked` と書きます。'
      - '`security` では、Dependabot の行には advisory の要約を書きます。同じ advisory の Dependabot alert は、1 つの行にまとめます。'
      - '`security` では、機能が無効の種類は、見出しの下に `disabled` と書き、行を足しません。'
      - '`security` では、code scanning の解析が無いリポジトリは、code scanning alert が無いものとして数えます。'
      - '`security` では、一覧を取れない種類は、前の行を残します。前の行が無かったときは、`unavailable` と書きます。'
      - '`security` では、取れない種類があるときは、ほかの種類を反映した後で、step を失敗にします。'
      - '`security` では、Dependabot alert の 403 と secret scanning の 404 を、無効だと確かめられなければ、取れなかったものとして数えます。'
      - '`security` では、open の Tracker が無く、載せる行があるときは、Tracker を作ってプロジェクトのボードに足します。Status を Backlog にします。ほかの欄には値を入れません。'
      - '`security` では、open の Tracker が無く、載せる行も無いときは、何も作りません。'
      - '`security` では、Tracker を閉じることはありません。'
      - '`security` では、alert がすべて無くなると、どの種類も `none` と書きます。Tracker を閉じて Archived へ動かすのは、人です。'
      - '`security` では、既にある Tracker には、Status が空の間だけ値を入れます。人が変えた値は残ります。'
      - 'Tracker の本文のうち、一覧の印の外にある文はそのまま残します。'
      - 'プロジェクトの設定が定義していないフィールドは設定しません。'
      - 'open の Tracker が複数あるときは、番号が最小のものを使い、ほかは open のまま残します。'
      - '閉じた Tracker は使い回しません。'
    stdin: none
    output:
      format: none
    diagnostics: '`dependabot` では、`count` の行で、open の Dependabot の PR の数、判断を待つ PR の数、判断を待つ PR のうち検証の結果が無いものの数を出します。変更ごとに結果の行（`created`・`added`・`removed`・`updated`・`unchanged`・`closed`・`skipped`）を出します。`dry-run` が `true` のときは、代わりに `dry-run` の行を出します。open の Tracker が複数あるときは、`warning` の行を出します。失敗ごとに `error` の行を出します。`security` では、変更ごとに結果の行（`created`・`added`・`removed`・`updated`・`unchanged`・`skipped`）を出します。`dry-run` が `true` のときは、代わりに `dry-run` の行を出します。open の Tracker が複数あるときは、`warning` の行を出します。失敗ごとに `error` の行を出します。一覧を取れなかった種類ごとの行も含みます。'
    environment:
      - name: GITHUB_REPOSITORY
        effect: '対象のリポの `owner/repo` です。この形でなければ、step を失敗にします。'
    exit_status:
      - kind: no-active-project
        when: 'ワークフローが動くリポを含むプロジェクトの設定が 2 つ以上あり、`project` がありません。'
      - kind: repo-not-in-project
        when: 'ワークフローが動くリポを含むプロジェクトの設定がありません。`project` で選んだ設定がそのリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: content-invalid
        when: 'Tracker の本文にある `list-begin` と `list-end` の印が、ちょうど 1 組ではありません。'
      - kind: partial-failure
        when: 'Tracker の作成・書き直し・クローズ・ボードへの配置のどれかに失敗しました。`security` で取れない種類があるときも含みます。'
      - kind: invalid-input
        when: '`source` が無いか、`dependabot` でも `security` でもありません。`dry-run` が `true` でも `false` でもないときも含みます。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: other
        when: '`GITHUB_REPOSITORY` が `owner/repo` の形でありません。ほかの名前に当たらない失敗も含みます。'
    on_error: '`dependabot` では、作った Tracker は、ボードへの配置に失敗しても GitHub に open のまま残り、次の実行でボードに置きます。本文の書き直しに失敗したときは、本文は元のままで、Tracker は open のままです。クローズに失敗したときは、一覧は none のまま、Tracker は open のままで、次の実行で閉じます。`security` では、作った Tracker は、ボードへの配置に失敗しても GitHub に open のまま残り、次の実行でボードに置きます。本文の書き直しに失敗したときは、本文は元のままで、次の実行でやり直します。どちらも、済んだ変更は巻き戻さず、step を失敗にします。'
    effects:
      - target: github
        kind: read
        what: '`dependabot` では、リポジトリの open の Dependabot の PR と、`dependabot-pr` のラベルが付いた Issue の一覧を読みます。'
      - target: github
        kind: write
        what: '`dependabot` では、Tracker の Issue を作り、プロジェクトのボードに足します。'
      - target: github
