name: pecot github-ops
description: Run one GitHub operation that the official GitHub MCP server has no tool for, and print the result as one PECOT_RESULT line of JSON in the job log.
inputs:
  token:
    description: Token for the operation. GITHUB_TOKEN for link-branch, stack-register, repo-settings and pr-attach; the App token for project-fields, project-view, project-link, workflow-doctor and release-create. pr-attach reads and deletes the pecot-attach/* branches with it
    required: false
  attach-token:
    description: Fine-grained personal access token with Contents and Pull requests (write) on this repository. Only pr-attach uses it, and passes it only to gh, which uploads the images and rewrites the pull request body
    required: false
    default: ''
  operation:
    description: 'Operation to run: link-branch, stack-register, project-fields, project-view, project-link, repo-settings, workflow-doctor, release-create or pr-attach'
    required: true
  request-id:
    description: ID the caller chose for this run. It is copied into the result line, so the caller can tell its run apart
    required: false
    default: ''
  params:
    description: >-
      JSON object with the values of the operation.
      link-branch: issue, branch, base (default: the default branch).
      stack-register: pr, parent_pr.
      project-fields: project, changes (each one of create {name, options}, rename {name, to}, delete {name}, set-options {name, options}).
      project-view: project, name, column, row.
      project-link: project, repo (default: this repository).
      repo-settings and workflow-doctor: none.
      release-create: tag, sha, body, name (default: tag), prerelease (default: false).
      pr-attach: pr, branch (a pecot-attach/ branch whose top-level files are the images to attach)
    required: false
    default: '{}'
runs:
  using: node24
  main: dist/index.js
