format: 1
plugin: pecot-visual
prose: ja
environment:
  - name: CLAUDE_PLUGIN_ROOT
    effect: 'プラグインのディレクトリです。サーバは、ここからアセット・スクリプト・版を読みます。プラグインとして入れたときは、実行時依存を探す起点にもなります。'
  - name: CLAUDE_PLUGIN_DATA
    effect: '実行時依存（`mcp-dist`）と、取得したテーマを置くデータディレクトリです。最初に読みます。'
  - name: PLUGIN_DATA
    effect: '`CLAUDE_PLUGIN_DATA` が無いときのデータディレクトリです。どちらも絶対パスで渡します。'
  - name: XDG_DATA_HOME
    effect: '`CLAUDE_PLUGIN_DATA` と `PLUGIN_DATA` のどちらも無いときに、データディレクトリ（`<XDG_DATA_HOME>/pecot/pecot-visual`）の起点になります。絶対パスで渡します。'
  - name: HOME
    effect: '最後の候補のデータディレクトリ（`~/.local/share/pecot/pecot-visual`）の起点になります。Playwright のブラウザを置くディレクトリ（`~/.cache/ms-playwright`）の起点にもなります。'
  - name: PATH
    effect: 'サーバが pnpm の実行ファイルを探す場所です。同じ値を子プロセスにも渡します。'
  - name: PLAYWRIGHT_BROWSERS_PATH
    effect: 'Playwright の Chromium を入れて探すディレクトリを変えます。`0` にすると、パッケージの中に置きます。'
  - name: NODE_EXTRA_CA_CERTS
    effect: 'SSL を中継するプロキシの CA を書いた PEM ファイルです。子プロセス（pnpm・npm・Chromium のダウンロード）に渡します。'
  - name: PECOTV_DEPENDENCY_ROOT
    effect: '依存を解決する起点にする、プラグインの実行用の写しです。`bin/pecotv` が渡し、`CLAUDE_PLUGIN_ROOT` より先に使います。'
  - name: PECOTV_RUNTIME_DIR
    effect: '`bin/pecotv` が渡す、動いているプラグインの写し（`runtime/<hash>`）です。その親に、Chromium のダウンロードのロックと、OS のライブラリを確かめた記録を置きます。'
  - name: PECOTV_AUTO_INSTALL_BROWSER
    effect: '`1` にすると、Chromium を使うツールが、その場で Chromium をダウンロードします。それ以外では、Chromium が無いときに `runtime_setup` の呼び出しを案内します。'
  - name: WSL_DISTRO_NAME
    effect: '今の WSL のディストリビューションの名前です。このディストリビューションの `\\wsl.localhost\<distro>\` のパスを、WSL の中のパスに変換します。'
  - name: PECOTV_WSL_MOUNT_ROOT
    effect: 'Windows のドライブのパス（`C:\...`）を変換する先の起点を変えます。無いときは `/mnt` です。'
entries:
  PV-DRAWIO-CREATE:
    summary: draw.io の図を、ブラウザで開ける HTML と PNG にします。
    arguments:
      input_path: '入力の `.drawio` ファイルの絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      mode: 'URL の用途です。`view` と `edit` のどちらでも、作る URL は同じです。'
      out_path: '表示用の HTML を書き出す `.html` の絶対パスです。Windows 形式のパスも、`input_path` と同じように渡せます。'
      png: '`out_path` を渡したときに、PNG も書くかどうかです。PNG の書き出し先は、`out_path` の拡張子を `.png` に替えたパスです。'
      theme: 'フォントとフォントサイズを確かめるテーマです。`git+https://<host>/<owner>/<repo>.git#<tag>`、`file:<絶対パス>`、talk-dir かテーマのルートの絶対パスのどれかで渡します。スライドに使う図を talk-dir の外に置くときは、talk-dir の絶対パスを渡します。Windows 形式のパスも、`input_path` と同じように渡せます。'
    constraints: []
    details:
      - '`.drawio` ファイルを 1 つ読み、draw.io で開く URL を作ります。HTML を開くと、その URL へ移ります。'
      - '図の中の `icon://` の参照は、データ URI にして埋め込みます。'
      - '作る前に、ラベルの文面を文面の規則と照らし、フォントとフォントサイズをテーマの宣言と照らします。使ったテーマは `theme` に入ります。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。成功なら `drawio.url.done`、失敗なら `drawio.url.error` です。パスの引数を拒否したときは入りません。'
        url: '図の URL です。`out_path` を省いたときだけ入ります。'
        file: '書いた表示用 HTML の絶対パスです。`out_path` を渡したときだけ入ります。'
        png: '書いた PNG の絶対パスです。`out_path` と `png` を渡したときに入ります。PNG を書けなかったときは `null` です。'
        pngFailed: 'PNG を書けなかったかどうかです。`png` と同じときに入ります。'
        theme: '確かめに使ったテーマです。出どころの `source`・名前の `name`・`fonts`・`fontSizes` を持ちます。成功のときだけ入ります。'
        violations: '`text-violation` のときの、文の規則の違反の全件の配列です。要素は `item`・`ruleId`・`message`・`text` を持ちます。'
        invalidPaths: '`invalid-path` のときの、拒否したパスの引数の配列です。要素は `<引数>=<値>` の形です。'
        convertedPaths: '`invalid-path` のときの、拒否の前に変換した Windows 形式のパスです。引数の名前をキーに、`from` と `to` を持ちます。変換が無ければ入りません。'
    diagnostics: default
    environment:
      - name: PECOTV_FORCE_PNG_FAIL
        effect: '`1` にすると、PNG の描画をわざと失敗させます。呼び出しは、PNG を書かず、`pngFailed` を `true` にした成功の結果を返します。失敗したときの動きを試すために使います。'
    exit_status:
      - kind: invalid-path
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `invalidPaths` に並びます。'
      - kind: invalid-option
        when: '`theme` が、相対パスか、変換できない `file:` のパスです。'
      - kind: invalid-output-extension
        when: '`out_path` の拡張子が `.html` ではありません。'
      - kind: invalid-theme
        when: '`theme` が、テーマの指定・talk-dir・テーマのルートのどれでもありません。'
      - kind: input-not-found
        when: '`input_path` のファイルがありません。'
      - kind: output-write-failed
        when: '`out_path` のファイルを書けませんでした。'
      - kind: text-violation
        when: 'ラベルの文面が文面の規則に反しているか、フォントがテーマの宣言に反しています。ファイルは書きません。違反は、全件が `violations` に並びます。'
      - kind: text-lint-failed
        when: '文面の規則を確かめる処理が動きませんでした。'
      - kind: theme-invalid-shape
        when: 'テーマの宣言が、決まった形ではありません。'
      - kind: theme-unknown-rule
        when: 'テーマの宣言に、存在しない lint の規則の名前があります。'
      - kind: theme-connection
        when: 'テーマのリポジトリに接続できません。'
      - kind: theme-auth
        when: 'テーマのリポジトリが、認証情報を受け付けません。'
      - kind: theme-tag
        when: 'テーマの tag が、リポジトリにありません。'
      - kind: theme-install
        when: 'pnpm でのテーマの依存のインストールに失敗しました。'
      - kind: theme-unknown
        when: 'テーマの取得が、上のどれにも当てはまらない理由で失敗しました。'
      - kind: theme-none
        when: '`theme` で指した talk-dir が、テーマを参照していません。'
      - kind: theme-unlinked
        when: 'talk-dir の `theme:` で指したパッケージは、`dependencies` にありません。'
      - kind: theme-tag-required
        when: '`theme` の git URL に `#<tag>` がありません。'
      - kind: theme-tag-format
        when: '`theme` の tag が、受け付ける形式ではありません。'
      - kind: theme-semver-range
        when: '`theme` の tag が、版の範囲になっています。'
      - kind: theme-unsupported-spec
        when: '`theme` が、`git+https` の URL でも `file:` のパスでもありません。'
      - kind: unknown
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: '文面の確認か入力の確認で失敗したときは、ファイルを 1 つも書きません。PNG を書けなかったときは、HTML を残し、失敗ではなく、`pngFailed` か `pdfFailed` を `true` にした成功の結果で返します。'
    effects:
      - target: file
        kind: read
        what: '`input_path` のファイル、同梱のアイコンのカタログ、テーマの宣言を読みます。テーマは、`theme` のものか、図の上にある talk-dir のものです。'
      - target: file
        kind: destructive
        what: '表示用の HTML を `out_path` に書きます。PNG の書き出し先は、拡張子を `.png` に替えたパスです。同じパスにファイルがあれば、置き換えます。'
      - target: process
        kind: write
        what: 'PNG を描くために Chromium を起動します。Chromium は、ネットワークから viewer.diagrams.net と Web フォントを読みます。'
      - target: process
        kind: write
        what: '`theme` が、まだ取得していない git URL のときは、git と pnpm を動かしてテーマを取得します。'
    prerequisites:
      - '`out_path` を渡して PNG も書くときは、Playwright の Chromium が要ります。入っていなければ、先に `runtime_setup` を呼びます。入っていないときは、HTML だけを書き、`pngFailed` を `true` にして返します。'
    idempotent: true
    examples:
      - arguments:
          input_path: '/work/diagram.drawio'
          out_path: '/work/diagram.html'
        note: '表示用の HTML と、同じ名前の PNG を書きます。'
      - arguments:
          input_path: '/work/diagram.drawio'
          mode: 'edit'
        note: 'ファイルを書かずに、編集用の URL だけを受け取ります。'
    default_notes:
      out_path: '省くと、ファイルを書かずに `url` だけを返します。'
      theme: '省くと、図が talk-dir の `public/` の下にあれば、その talk-dir のテーマを使います。それ以外は、組み込みの既定（sans-serif）を使います。'
    behaviors:
      - id: PV-DRAWIO-CREATE-01
        pattern: event
        statement: '`input_path` を渡して呼ぶと、データ URI に解決した図の URL を `url` に載せた成功の応答を返します'
      - id: PV-DRAWIO-CREATE-02
        pattern: event
        statement: '`out_path` を渡して呼ぶと、その `.html` に表示用の HTML を書き、`file` に載せます'
      - id: PV-DRAWIO-CREATE-03
        pattern: event
        statement: '`out_path` を渡して `png` を省くと、同じ名前で拡張子を `.png` にした PNG も書きます'
      - id: PV-DRAWIO-CREATE-04
        pattern: event
        statement: '`png` を `false` にして呼ぶと、PNG を書かず、Chromium を起動しません'
      - id: PV-DRAWIO-CREATE-05
        pattern: unwanted
        statement: 'もしラベルの文面が文面の規則に反するなら、何も書かずに `text-violation` の失敗を返し、違反の全件を `violations` に載せます'
      - id: PV-DRAWIO-CREATE-06
        pattern: unwanted
        statement: 'もし PNG を書けなかったなら、HTML は残し、`pngFailed` が `true` の成功の応答を返します'
      - id: PV-DRAWIO-CREATE-07
        pattern: unwanted
        statement: 'もし Chromium が入っていないなら、HTML だけを書き、`pngFailed` が `true` の成功の応答を返し、`warnings` で `runtime_setup` の呼び出しを案内します'
      - id: PV-DRAWIO-CREATE-08
        pattern: unwanted
        statement: 'もし `out_path` の拡張子が `.html` でないなら、何も書かずに `invalid-output-extension` の失敗を返します'
      - id: PV-DRAWIO-CREATE-09
        pattern: unwanted
        statement: 'もし `input_path` のファイルが無いなら、`input-not-found` の失敗を返します'
  PV-DRAWIO-EXPORT:
    summary: draw.io の図を、SVG と PDF に書き出します。
    arguments:
      icons_dir: '`icon://` の参照を解決する起点のディレクトリの絶対パスです。プロジェクト独自のアイコンのカタログを使う図では、必ず渡します。省いてもエラーになりません。Windows 形式のパスも、`input_path` と同じように渡せます。'
      input_path: '入力の `.drawio` ファイルの絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      out_path: '書き出す SVG の絶対パスです。PDF の書き出し先は、拡張子を `.pdf` に替えたパスです。Windows 形式のパスも、`input_path` と同じように渡せます。'
      pdf: 'SVG と一緒に PDF も書くかどうかです。'
      print_hash: '`true` にすると、書き出さずに、図が古くなっていないかを確かめるための合成ハッシュだけを返します。'
    constraints: []
    details:
      - '`.drawio` ファイルを 1 つ読み、静的な SVG と、同じ名前の PDF を書きます。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。書き出したなら `drawio.export.done`、`print_hash` なら `drawio.export.hash` です。失敗なら `drawio.export.error` か `chromium.unavailable` です。パスの引数を拒否したときは入りません。'
        file: '書いた SVG の絶対パスです。`print_hash` のときは、入力の絶対パスです。成功のときだけ入ります。'
        icons: '解決した `icon://` の参照の数です。成功のときだけ入ります。'
        pdf: '書いた PDF の絶対パスです。`pdf` が `false` のときと、PDF を書けなかったときは `null` です。`print_hash` のときは入りません。'
        pdfFailed: 'PDF を書けなかったかどうかです。`print_hash` のときは入りません。'
        sourceSha256: '`print_hash` のときの、入力と参照するアイコンの合成ハッシュです。図が古くなっていないかを確かめるのに使います。'
        expectedAt: '実行時依存か Chromium が置かれるはずの場所です。`runtime-dependencies-not-installed`・`chromium-not-installed`・`chromium-install-failed` のときだけ入ります。'
        invalidPaths: '`invalid-path` のときの、拒否したパスの引数の配列です。要素は `<引数>=<値>` の形です。'
        convertedPaths: '`invalid-path` のときの、拒否の前に変換した Windows 形式のパスです。引数の名前をキーに、`from` と `to` を持ちます。変換が無ければ入りません。'
    diagnostics: default
    environment:
      - name: PECOTV_FORCE_SVG_FAIL
        effect: '`1` にすると、SVG の書き出しをわざと失敗させます。呼び出しは `export-failed` で失敗します。失敗したときの動きを試すために使います。'
      - name: PECOTV_FORCE_PDF_FAIL
        effect: '`1` にすると、PDF の書き出しをわざと失敗させます。呼び出しは、PDF を書かず、`pdfFailed` を `true` にした成功の結果を返します。失敗したときの動きを試すために使います。'
    exit_status:
      - kind: invalid-path
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `invalidPaths` に並びます。'
      - kind: invalid-output-extension
        when: '`print_hash` が `false` で、`out_path` の拡張子が `.pdf` です。'
      - kind: input-not-found
        when: '`input_path` のファイルがありません。'
      - kind: icon-unresolved
        when: '図の中の `icon://` の参照が、`icons_dir` の下にありません。'
      - kind: export-failed
        when: 'draw.io での SVG の書き出しに失敗しました。'
      - kind: output-write-failed
        when: '`out_path` のファイルを書けませんでした。'
      - kind: chromium-not-installed
        when: 'Playwright の Chromium が入っておらず、`PECOTV_AUTO_INSTALL_BROWSER` が `1` ではありません。`detail` が `runtime_setup` の呼び出しを案内します。'
      - kind: chromium-install-failed
        when: '`PECOTV_AUTO_INSTALL_BROWSER` が `1` で、Chromium のダウンロードに失敗しました。'
      - kind: unknown
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: '入力の確認か SVG の書き出しで失敗したときは、ファイルを 1 つも書きません。PDF を書けなかったときは、SVG を残し、失敗ではなく、`pngFailed` か `pdfFailed` を `true` にした成功の結果で返します。'
    effects:
      - target: file
        kind: read
        what: '`input_path` のファイルと、`icons_dir` の下のアイコンのカタログを読みます。'
      - target: file
        kind: destructive
        what: 'SVG を `out_path` に書きます。PDF の書き出し先は、拡張子を `.pdf` に替えたパスです。同じパスにファイルがあれば、置き換えます。`print_hash` を `true` にしたときは、何も書きません。'
      - target: process
        kind: write
        what: 'Chromium を起動し、SVG を書き出して PDF を印刷します。Chromium は、ネットワークから embed.diagrams.net と Web フォントを読みます。`print_hash` を `true` にしたときは、起動しません。'
    prerequisites:
      - 'Playwright の Chromium が要ります。入っていなければ、先に `runtime_setup` を呼びます。`print_hash` を `true` にするときは、要りません。'
      - '図は、先に `drawio_create` を通しておきます。このツールは、図の文面を確かめません。'
    idempotent: true
    examples:
      - arguments:
          input_path: '/work/diagram.drawio'
        note: '入力と同じディレクトリに、`diagram.drawio.svg` と `diagram.drawio.pdf` を書きます。'
      - arguments:
          input_path: '/work/diagram.drawio'
          print_hash: true
        note: '書き出さずに、図が古くなっていないかを確かめるためのハッシュだけを受け取ります。'
    default_notes:
      icons_dir: '省くと、プラグインに同梱のアイコンのカタログを使います。'
      out_path: '省くと、`input_path` に `.svg` を付けたパスに書きます。'
    behaviors:
      - id: PV-DRAWIO-EXPORT-01
        pattern: event
        statement: '`input_path` を渡して呼ぶと、SVG と同じ名前の PDF を書き、`file` と `pdf` に載せた成功の応答を返します'
      - id: PV-DRAWIO-EXPORT-02
        pattern: event
        statement: '`pdf` を `false` にして呼ぶと、SVG だけを書きます'
      - id: PV-DRAWIO-EXPORT-03
        pattern: event
        statement: '`print_hash` を `true` にして呼ぶと、何も書かず、Chromium を起動せずに、`sourceSha256` に合成ハッシュを載せて返します'
      - id: PV-DRAWIO-EXPORT-04
        pattern: unwanted
        statement: 'もし PDF を書けなかったなら、SVG は残し、`pdfFailed` が `true` の成功の応答を返します'
      - id: PV-DRAWIO-EXPORT-05
        pattern: unwanted
        statement: 'もし SVG の書き出しに失敗したなら、何も書かずに `export-failed` の失敗を返します'
      - id: PV-DRAWIO-EXPORT-06
        pattern: unwanted
        statement: 'もし `out_path` の拡張子が `.svg` でないなら、何も書かずに `invalid-output-extension` の失敗を返します'
      - id: PV-DRAWIO-EXPORT-07
        pattern: unwanted
        statement: 'もし Chromium が入っていないなら、何も書かずに `chromium-not-installed` の失敗を返し、`detail` で `runtime_setup` の呼び出しを案内します'
  PV-EVIDENCE-CREATE:
    summary: スクリーンショットを貼った作業エビデンスの xlsx を作ります。
    arguments:
      input_path: 'EvidenceSpec を書いた JSON ファイルの絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      out_path: '書き出す xlsx の絶対パスです。Windows 形式のパスも、`input_path` と同じように渡せます。'
    constraints: []
    details:
      - EvidenceSpec の JSON を読み、スクリーンショットを書いた順で並べた xlsx を 1 つ作ります。注釈は、スクリーンショットの上に重なります。
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。成功なら `result`、失敗なら `evidence.create.error` です。パスの引数を拒否したときは入りません。'
        outPath: '書いた xlsx の絶対パスです。成功のときだけ入ります。'
        items: '貼った画像の数です。成功のときだけ入ります。'
        annotations: '足した注釈の数です。成功のときだけ入ります。'
        skipped: '飛ばした画像の配列です。要素は、spec に書いたパスの `path` と、理由の `reason` を持ちます。理由は `not-found`・`unsupported-format`・`unreadable` のどれかです。飛ばした画像が無ければ空です。'
        violations: '`text-violation` のときの、文の規則の違反の全件の配列です。要素は `item`・`ruleId`・`message`・`text` を持ちます。'
        invalidPaths: '`invalid-path` のときの、拒否したパスの引数の配列です。要素は `<引数>=<値>` の形です。'
        convertedPaths: '`invalid-path` のときの、拒否の前に変換した Windows 形式のパスです。引数の名前をキーに、`from` と `to` を持ちます。変換が無ければ入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-path
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `invalidPaths` に並びます。'
      - kind: input-not-found
        when: '`input_path` のファイルがありません。'
      - kind: invalid-json
        when: '`input_path` のファイルを JSON として読めません。'
      - kind: invalid-spec
        when: 'JSON が EvidenceSpec の形式に合っていません。'
      - kind: text-violation
        when: '題・見出し・注釈のどれかが文面の規則に反しています。xlsx は書きません。違反は、全件が `violations` に並びます。'
      - kind: text-lint-failed
        when: '文面の規則を確かめる処理が動きませんでした。'
      - kind: no-valid-images
        when: 'EvidenceSpec の画像を 1 枚も貼れませんでした。'
      - kind: output-write-failed
        when: 'xlsx を書き込めませんでした。'
      - kind: unknown
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: EvidenceSpec の確認か文面の規則の確認で失敗したときは、ファイルを 1 つも書きません。
    effects:
      - target: file
        kind: read
        what: '`input_path` のファイルと、EvidenceSpec に書かれた画像のファイルを読みます。'
      - target: file
        kind: destructive
        what: 'xlsx を `out_path` に書きます。同じパスにファイルがあれば、置き換えます。'
    prerequisites: []
    idempotent: true
    examples:
      - arguments:
          input_path: '/work/evidence/spec.json'
        note: 'EvidenceSpec のファイルと同じディレクトリに `evidence.xlsx` を作ります。'
    default_notes:
      out_path: '省くと、`input_path` と同じディレクトリの `evidence.xlsx` に書きます。'
    behaviors:
      - id: PV-EVIDENCE-CREATE-01
        pattern: event
        statement: '`input_path` を渡して呼ぶと、EvidenceSpec の順に画像を貼った xlsx を書き、`outPath` にそのパスを載せた成功の応答を返します'
      - id: PV-EVIDENCE-CREATE-02
        pattern: event
        statement: '貼れない画像が EvidenceSpec に含まれると、その画像を飛ばし、飛ばした画像と理由を `skipped` に載せます'
      - id: PV-EVIDENCE-CREATE-03
        pattern: unwanted
        statement: 'もし題・見出し・注釈が文面の規則に反するなら、何も書かずに `text-violation` の失敗を返し、違反の全件を `violations` に載せます'
      - id: PV-EVIDENCE-CREATE-04
        pattern: unwanted
        statement: 'もし `input_path` の中身を JSON として読めないなら、`invalid-json` の失敗を返します'
      - id: PV-EVIDENCE-CREATE-05
        pattern: unwanted
        statement: 'もし `input_path` のファイルが無いなら、`input-not-found` の失敗を返します'
  PV-RUNTIME-SETUP:
    summary: スライドと図のツールが使う実行時依存と Chromium を入れます。
    constraints: []
    details:
      - '実行時依存（`@slidev/cli`・`dom-to-pptx`・`@slidev/parser` など）と Playwright の Chromium をダウンロードします。Chromium の起動に要る OS のライブラリも確かめます。'
      - 'ほかのツールが `runtime-dependencies-not-installed` で失敗したときに呼びます。Chromium が入っていないと知らされたときにも呼びます。'
      - '初回は、実行時依存を約 600MB、Chromium を約 120MB ダウンロードします。数十秒かかります。'
      - '入っているものは飛ばします。繰り返し呼んでも、すぐに終わります。'
      - 'OS のライブラリが足りないときは、sudo を使えれば apt-get で入れます。使えなければ、入れるためのコマンドを返します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。何かを取得したときは `setup.done` です。すべて揃っていたときは `setup.skipped` です。失敗のときは `setup.error` です。'
        runtime: '実行時依存の段階の結果です。`installed`・`downloaded`・`durationMs` を必ず持ちます。置き場所の `location` と、失敗の理由の `detail` も持つことがあります。'
        chromium: 'Playwright の Chromium の段階の結果です。`runtime` と同じ項目を持ちます。'
        hostDeps: 'OS のライブラリの段階の結果です。`runtime` と同じ項目を持ち、入れるためのコマンドは `detail` に入ります。Chromium を置けなかったときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: runtime-install-failed
        when: '実行時依存のインストールに失敗しました。原因は `runtime.detail` に入ります。TLS の証明書の検証で失敗したときは、`NODE_EXTRA_CA_CERTS` の案内が加わります。'
      - kind: chromium-install-failed
        when: 'Chromium のダウンロードに失敗しました。'
      - kind: chromium-host-deps-missing
        when: 'Chromium の起動に要る OS のライブラリが足りず、入れられませんでした。入れるためのコマンドは `hostDeps.detail` に入ります。'
    on_error: '失敗した手順より前にダウンロードしたものは、入ったまま残ります。原因を直してから呼ぶと、続きから進みます。実行時依存で失敗しても、Chromium と OS のライブラリの手順は続けます。'
    effects:
      - target: file
        kind: destructive
        what: '実行時依存を `<data-dir>/mcp-dist` の下に書き、その `package.json` とインストールの記録を置き換えます。Chromium は、Playwright のブラウザのディレクトリに書きます。'
      - target: process
        kind: write
        what: 'npm を動かして実行時依存を入れ、Playwright を動かして Chromium をネットワークからダウンロードします。'
      - target: process
        kind: destructive
        what: 'Chromium の起動に要る OS のライブラリが足りず、パスワードなしで sudo を使えるときは、`sudo apt-get` で入れます。'
    prerequisites:
      - 'npm のレジストリと、Playwright のダウンロード元にネットワークで届くことが要ります。SSL を中継するプロキシの内側では、`NODE_EXTRA_CA_CERTS` にプロキシの CA を渡します。'
    idempotent: true
    examples:
      - arguments: {}
        note: '最初の `slide_create` や `drawio_export` の前に、実行時依存と Chromium を入れます。'
    default_notes: {}
    behaviors:
      - id: PV-RUNTIME-SETUP-01
        pattern: event
        statement: '実行時依存が未導入の状態で呼ぶと、実行時依存を取得し、`runtime.downloaded` を `true` にします'
      - id: PV-RUNTIME-SETUP-02
        pattern: event
        statement: '実行時依存が導入済みの状態で呼ぶと、取得を飛ばし、`runtime.downloaded` を `false` にします'
      - id: PV-RUNTIME-SETUP-03
        pattern: event
        statement: 'Chromium が未導入の状態で呼ぶと、Chromium を取得し、`chromium.downloaded` を `true` にします'
      - id: PV-RUNTIME-SETUP-04
        pattern: event
        statement: 'すべて導入済みの状態で呼ぶと、`event` を `setup.skipped` にした成功の応答を返します'
      - id: PV-RUNTIME-SETUP-05
        pattern: unwanted
        statement: 'もし実行時依存の取得に失敗したなら、Chromium の取得は続けて行います'
      - id: PV-RUNTIME-SETUP-06
        pattern: unwanted
        statement: 'もし Chromium の起動に要る OS のライブラリが無くて入れられないなら、`chromium-host-deps-missing` の失敗を返し、入れるためのコマンドを `detail` に載せます'
      - id: PV-RUNTIME-SETUP-07
        pattern: unwanted
        statement: 'もし取得の失敗が TLS の証明書の検証によるなら、`NODE_EXTRA_CA_CERTS` で証明書を渡す案内を `detail` に加えます'
  PV-SLIDE-CONVERT:
    summary: Slidev のスライドを PPTX に変換します。
    arguments:
      cache: '差分のキャッシュを読むかどうかです。`false` にしても、変換が終わるとキャッシュを作り直します。'
      href_json_path: 'ハイパーリンクの JSON の絶対パスです。Windows 形式のパスも、`project_dir` と同じように渡せます。'
      morph_option: 'morph の切り替え効果の粒度です。`transition_type` が `morph` のときだけ使います。'
      out_path: '書き出す `.pptx` の絶対パスです。Windows 形式のパスも、`project_dir` と同じように渡せます。'
      project_dir: 'Slidev のプロジェクト（talk-dir）の絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      spacing_json_path: '字間の JSON の絶対パスです。Windows 形式のパスも、`project_dir` と同じように渡せます。'
      theme: '`slidev --theme` に渡す名前です。使える文字は `[a-zA-Z0-9@/_.-]` です。'
      transition_duration_ms: 'スライドの切り替えにかける時間です。ミリ秒の正の整数で渡します。省くと 500 です。'
      transition_type: 'スライドの切り替え効果の種類です。省くと `fade` です。'
    constraints: []
    details:
      - 'Slidev のプロジェクトを 1 つ読み、PPTX を 1 つ書きます。'
      - 'かかる時間は、スライドの枚数に比例します。55 枚で 30 秒弱です。'
      - '出力先のディレクトリにある差分のキャッシュを読み、変わった工程だけを変換し直します。'
      - '変換の前に、`node_modules` のテーマのリンクを張り直し、talk-dir の生成ファイルをそろえます。古くなったテーマのリンクは、この呼び出しで直ります。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。成功なら `slide.convert.done` です。失敗なら `slide.convert.error`・`runtime-dependencies.unavailable`・`chromium.unavailable` のどれかです。パスの引数を拒否したときは入りません。'
        input: '変換した Slidev のプロジェクトの絶対パスです。成功のときだけ入ります。'
        output: '書いた PPTX の絶対パスです。成功のときだけ入ります。'
        durationMs: '変換にかかった時間です。単位はミリ秒です。成功のときだけ入ります。'
        errors: 'スライドか要素ごとの変換のエラーの配列です。成功のときと `slide.convert.error` のときに入り、無ければ空です。要素のエラーだけなら、結果を失敗にしません。'
        animationTimingRemovedSlides: '飾りの CSS アニメーションから作った `p:timing` を消したスライドの数です。成功のときだけ入ります。'
        timings: '段階ごとにかかった時間です。単位はミリ秒です。測ったときだけ入ります。'
        cache: '差分のキャッシュの結果です。`enabled`・`hits`・`misses`・`invalidated` を持ちます。キャッシュを扱ったときだけ入ります。'
        expectedAt: '実行時依存か Chromium が置かれるはずの場所です。`runtime-dependencies-not-installed`・`chromium-not-installed`・`chromium-install-failed` のときだけ入ります。'
        invalidPaths: '`invalid-path` のときの、拒否したパスの引数の配列です。要素は `<引数>=<値>` の形です。'
        convertedPaths: '`invalid-path` のときの、拒否の前に変換した Windows 形式のパスです。引数の名前をキーに、`from` と `to` を持ちます。変換が無ければ入りません。'
    diagnostics: default
    environment:
      - name: PECOTV_SINGLE_PASS
        effect: '`0` にすると、1 回でまとめて描く処理を切ります。ほかの値のときと、無いときは、入ったままです。'
      - name: PECOTV_SINGLE_PASS_CONCURRENCY
        effect: '1 回でまとめて描く処理で、同時に描く組の数です。1 以上の整数で渡します。ほかの値は無視します。'
    exit_status:
      - kind: invalid-path
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `invalidPaths` に並びます。'
      - kind: runtime-dependencies-not-installed
        when: '実行時依存が入っていません。`detail` が `runtime_setup` の呼び出しを案内します。'
      - kind: chromium-not-installed
        when: 'Playwright の Chromium が入っておらず、`PECOTV_AUTO_INSTALL_BROWSER` が `1` ではありません。`detail` が `runtime_setup` の呼び出しを案内します。'
      - kind: chromium-install-failed
        when: '`PECOTV_AUTO_INSTALL_BROWSER` が `1` で、Chromium のダウンロードに失敗しました。'
      - kind: project-not-found
        when: '`project_dir` が無いか、Slidev のプロジェクトではありません。'
      - kind: invalid-theme
        when: '`theme` に、`[a-zA-Z0-9@/_.-]` の外の文字があります。'
      - kind: invalid-staging-json
        when: '字間の JSON かハイパーリンクの JSON を読めないか、形が違います。'
      - kind: slidev-build-failed
        when: '`slidev build` がエラーで終わりました。診断は `warnings` と `errors` に、失敗の文は `detail` に、ビルドの出力は `log` に入ります。'
      - kind: slidev-build-timeout
        when: '`slidev build` が、制限時間の内に終わりませんでした。'
      - kind: pptx-convert-failed
        when: 'スライドの描画か、PPTX の組み立てに失敗しました。'
      - kind: pptx-convert-timeout
        when: '変換が、制限時間の内に終わりませんでした。'
      - kind: merge-failed
        when: '変換したスライドの結合か、出力の書き込みに失敗しました。'
      - kind: cancelled
        when: 'クライアントが呼び出しを取り消しました。'
      - kind: theme-none
        when: 'talk-dir がテーマを参照していません。移行前の talk-dir です。'
      - kind: theme-unlinked
        when: 'talk-dir のテーマが `node_modules` に張られていないか、`package.json` を読めません。`detail` が、直すための `slide_sync` の呼び出しを示します。'
      - kind: theme-connection
        when: 'テーマのリポジトリに接続できません。'
      - kind: theme-auth
        when: 'テーマのリポジトリが、認証情報を受け付けません。'
      - kind: theme-tag
        when: 'テーマの tag が、リポジトリにありません。'
      - kind: theme-install
        when: 'pnpm でのテーマの依存のインストールに失敗しました。'
      - kind: theme-unknown
        when: 'テーマの取得が、上のどれにも当てはまらない理由で失敗しました。'
      - kind: theme-name-mismatch
        when: '`dependencies` のテーマのキーが、テーマの名前と合っていません。'
      - kind: unknown
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: 'ビルドより後の手順で失敗したときは、`project_dir` の `dist` ディレクトリと `index.html` は消えたままで、PPTX は書きません。'
    effects:
      - target: file
        kind: read
        what: '`project_dir` の `slides.md`・`pages/`・`public/`・テーマと、字間の JSON・ハイパーリンクの JSON を読みます。'
      - target: file
        kind: destructive
        what: 'PPTX を `out_path` に、差分のキャッシュを出力先のディレクトリに書きます。`project_dir` の `node_modules` を張り直し、`vite.config.ts` と `start.mjs` がプラグインのものと違えば書き直します。'
      - target: file
        kind: destructive
        what: 'ビルドの前に、`project_dir` の `dist` ディレクトリと `index.html` を消します。`out_path` に PPTX があれば、置き換えます。'
      - target: process
        kind: write
        what: '`slidev build` を動かし、スライドを描くために Chromium を起動します。'
      - target: process
        kind: write
        what: 'テーマをまだ取得していないときは、git と pnpm を動かして取得します。'
    prerequisites:
      - '実行時依存と Playwright の Chromium が要ります。入っていなければ、先に `runtime_setup` を呼びます。'
      - '`project_dir` は、テーマを参照する talk-dir です。'
    idempotent: true
    examples:
      - arguments:
          project_dir: '/work/talk'
        note: 'talk-dir の `pptx` ディレクトリに PPTX を書きます。'
      - arguments:
          project_dir: '/work/talk'
          out_path: '/work/out/talk.pptx'
          transition_type: 'morph'
          morph_option: 'byWord'
        note: '単語ごとの morph の切り替え効果を付けて変換します。'
    default_notes:
      out_path: '省くと、`project_dir/pptx/` の下に書きます。ファイル名は、`slides.md` の title か、`project_dir` の最後の名前に `.pptx` を付けたものです。'
      spacing_json_path: '省くと、`project_dir` に `staging/slides/letter-spacing.json` があれば、それを使います。'
      href_json_path: '省くと、`project_dir` に `staging/slides/href-map.json` があれば、それを使います。'
    behaviors:
      - id: PV-SLIDE-CONVERT-01
        pattern: event
        statement: '`project_dir` を渡して呼ぶと、PPTX を書き、`output` にそのパスを載せた成功の応答を返します'
      - id: PV-SLIDE-CONVERT-02
        pattern: event
        statement: '`out_path` を渡して呼ぶと、その場所に PPTX を書きます'
      - id: PV-SLIDE-CONVERT-03
        pattern: event
        statement: '`cache` を省いて再度呼ぶと、変わっていない工程の変換を省きます'
      - id: PV-SLIDE-CONVERT-04
        pattern: event
        statement: '`cache` を `false` にして呼ぶと、キャッシュを読まずに全工程を変換し、キャッシュを作り直します'
      - id: PV-SLIDE-CONVERT-05
        pattern: event
        statement: '`transition_type` を `morph` にして呼ぶと、`morph_option` の粒度で切り替え効果を付けます'
      - id: PV-SLIDE-CONVERT-06
        pattern: unwanted
        statement: 'もし実行時依存が未導入なら、`runtime-dependencies-not-installed` の失敗を返し、`detail` で `runtime_setup` の呼び出しを案内します'
      - id: PV-SLIDE-CONVERT-07
        pattern: unwanted
        statement: 'もし Chromium が入っていないなら、`chromium-not-installed` の失敗を返し、`detail` で `runtime_setup` の呼び出しを案内します'
      - id: PV-SLIDE-CONVERT-08
        pattern: unwanted
        statement: 'もし `project_dir` が Slidev のプロジェクトでないなら、`project-not-found` の失敗を返します'
      - id: PV-SLIDE-CONVERT-09
        pattern: unwanted
        statement: 'もし talk-dir がテーマを参照していないなら、`theme-none` の失敗を返します'
      - id: PV-SLIDE-CONVERT-10
        pattern: unwanted
        statement: 'もしクライアントが呼び出しを取り消したなら、変換を打ち切り、`cancelled` の失敗を返します'
  PV-SLIDE-CREATE:
    summary: テーマを参照する talk-dir を新しく作ります。
    arguments:
      force: '`project_dir` が既にあるときに、消して作り直すかどうかです。'
      project_dir: '作る talk-dir の絶対パスです。後で編集できるように、呼び出すエージェントが書き込める場所（作業ディレクトリの下など）を渡します。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      theme: '参照するテーマです。tag 付きの git URL（`git+https://<host>/<owner>/<repo>.git#<tag>`）か、ローカルのパス（`file:<絶対パス>`）で渡します。tag の無い git URL は受け付けません。'
    constraints: []
    details:
      - '`project_dir` に、`theme` の Slidev のテーマを参照する talk-dir を作ります。'
      - 'テーマの提示カテゴリを `categories` に、選べるレイアウトを `layouts` に返します。'
      - '作った直後にデッキ全体を lint し、結果を `lint` に返します。違反があっても、作成は成功です。'
      - '作られる `start.mjs` は、`SLIDEV_PORT` があれば、そのポートで dev サーバを起動します。'
    stdin: none
    output:
      format: none
