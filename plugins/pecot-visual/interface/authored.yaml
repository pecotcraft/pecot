  - id: PV-COMMON-01
    pattern: unwanted
    statement: 'もし `inputSchema` が宣言した型・範囲・列挙・必須に反する入力を渡したなら、ツールを実行せずに入力検証エラーを返し、`structuredContent` を返しません'
  - id: PV-COMMON-02
    pattern: event
    statement: '最上位に宣言外のキーを渡すと、そのキーを無視して通常どおり実行します'
  - id: PV-COMMON-03
    pattern: unwanted
    statement: 'もしパスを渡す入力が相対パスなら、処理を始めずに 失敗（`isError`）を返し、渡した値を `invalidPaths` に載せます'
  - id: PV-COMMON-04
    pattern: event
    statement: 'Windows 形式のパスを渡すと、`/mnt/<ドライブ>/` の下か WSL の中の絶対パスに変換して処理します'
  - id: PV-COMMON-05
    pattern: unwanted
    statement: 'もし Windows 形式のパスを POSIX の絶対パスに変換できないなら、処理を始めずに 失敗（`isError`）を返します'
  - id: PV-COMMON-06
    pattern: ubiquitous
    statement: '常に、応答の `structuredContent` と同じ内容の JSON を、`content` のテキストにも載せます'
  - id: PV-COMMON-07
    pattern: unwanted
    statement: 'もし結果が失敗なら、`isError` を真にし、`kind` と `detail` を最上位に載せます'
  - id: PV-COMMON-08
    pattern: event
    statement: '呼び出しが同時に届くと、1 件ずつ到着順に実行します'
  - id: PV-COMMON-09
    pattern: event
    statement: '`progressToken` を付けて呼ぶと、キューでの待機中と実行中の 10 秒ごとに progress 通知を送ります'
  - id: PV-COMMON-10
    pattern: unwanted
    statement: 'もしクライアントが呼び出しを取り消したなら、取り消した呼び出しへの progress 通知を止めます'
  - id: PV-COMMON-11
    pattern: unwanted
    statement: 'もし失敗のときの子プロセスの出力が 64 KiB を超えたなら、先頭を捨てて末尾の 64 KiB を `log` に残し、先頭に切り詰めを示す行を付けます'
  - id: PV-COMMON-12
    pattern: event
    statement: '呼び出しが失敗した後に次の呼び出しが来ると、同じ接続でその呼び出しに応えます'
  - id: PV-COMMON-13
    pattern: unwanted
    statement: 'もし公開していないツール名で呼ばれたなら、JSON-RPC エラー -32602 を返します'
  - id: PV-COMMON-14
    pattern: unwanted
    statement: 'もしハンドラの中で捕捉されない例外が起きたなら、その呼び出しだけを失敗させ、サーバは次の呼び出しを受け付けます'
common_mcp_output:
  fields:
    kind: '失敗の原因の名前です。値は、エラーの表のエラー名のどれかです。失敗のときだけ入ります。'
    detail: '失敗の文と案内の全文です。失敗のときだけ入ります。'
    log: '失敗のときの子プロセスの出力です。64KB を超えると末尾だけ残し、切り詰めたことを冒頭の 1 行で知らせます。'
    warnings: '警告の文の配列です。無ければ項目ごと入りません。100 件か 64KB を超えた分は省き、最後の要素で省いた数を示します。'
