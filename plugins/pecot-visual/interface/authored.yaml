        when: '`dir` に `slides.md` がありません。talk-dir ではありません。'
      - kind: node-modules-unresolved
        when: 'テーマを張り直しても、`dir` の `node_modules` を解決できません。`detail` が `slide_sync` の呼び出しを示します。'
