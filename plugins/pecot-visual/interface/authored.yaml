      - id: PV-SLIDE-CREATE-02
        pattern: event
        statement: '呼ぶと、`categories` と `layouts` に、テーマの提示カテゴリと選べるレイアウトを載せます'
      - id: PV-SLIDE-CREATE-03
        pattern: event
        statement: '呼ぶと、作った直後のデッキ全体の lint の結果を `lint` に載せます'
      - id: PV-SLIDE-CREATE-04
        pattern: unwanted
        statement: 'もし作った直後の lint が違反を見つけたなら、作成は成功として返します'
      - id: PV-SLIDE-CREATE-05
        pattern: event
        statement: '`force` を `true` にして呼ぶと、組み立てが済んだ後で、既にある `project_dir` を置き換えます'
      - id: PV-SLIDE-CREATE-06
        pattern: unwanted
        statement: 'もし `project_dir` が既にあり `force` が `false` なら、何も変えずに `dest-exists` の失敗を返します'
      - id: PV-SLIDE-CREATE-07
        pattern: unwanted
        statement: 'もし `theme` が tag の無い git URL なら、何も作らずに `theme-tag-required` の失敗を返します'
      - id: PV-SLIDE-CREATE-08
        pattern: unwanted
        statement: 'もし `file:` の `theme` が相対パスなら、何も作らずに `invalid-option` の失敗を返します'
      - id: PV-SLIDE-CREATE-09
        pattern: unwanted
        statement: 'もし実行時依存が未導入なら、何も作らずに `runtime-dependencies-not-installed` の失敗を返し、`detail` で `runtime_setup` の呼び出しを案内します'
      - id: PV-SLIDE-CREATE-10
        pattern: unwanted
        statement: 'もし組み立ての途中で失敗したなら、既にある `project_dir` を残し、一時ディレクトリを消します'
  PV-SLIDE-DEV:
