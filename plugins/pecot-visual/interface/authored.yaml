        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 捕捉した標準エラー出力です。捕捉していなければ、この項目はありません。
        stdout: 捕捉した標準出力です。捕捉していなければ、この項目はありません。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of files and directories created or updated
            items:
              type: string
            type: array
          data:
            additionalProperties: {}
            description: Object with the details of the run
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the tool completed its intended run
            type: boolean
          stderr:
            description: Captured stderr (omitted when nothing was captured)
            type: string
          stdout:
            description: Captured stdout (omitted when nothing was captured)
            type: string
        required:
          - ok
          - exitCode
          - artifacts
          - data
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-path
        code: 2
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `data.invalidPaths` に並びます。'
      - kind: theme-none
        code: 1
        when: 'talk-dir がテーマを参照していません。移行前の talk-dir です。'
      - kind: theme-unlinked
        code: 1
        when: 'talk-dir のテーマが `node_modules` に張られていないか、`package.json` を読めません。`message` が、直すための `slide_sync` の呼び出しを示します。'
      - kind: theme-invalid-shape
        code: 1
        when: 'テーマの宣言が、決まった形ではありません。'
      - kind: theme-unknown-rule
        code: 1
        when: 'テーマの宣言に、存在しない lint の規則の名前があります。'
      - kind: unknown
        code: 1
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: '`dir` の `package.json`・`slides.md` と、張られているテーマを読みます。'
    prerequisites:
      - '`dir` は、テーマを参照する talk-dir で、テーマが `node_modules` に張られています。'
    idempotent: true
    examples:
      - run: "slide_theme {\"dir\": \"/work/talk\"}"
        note: 'テーマのフォント・フォントサイズ・レイアウトを受け取ります。'
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-THEME-01
        pattern: event
        statement: '`dir` を渡して呼ぶと、参照するテーマの名前・宣言・レイアウト・カテゴリを `data` に載せた成功の応答を返します'
      - id: PV-SLIDE-THEME-02
        pattern: ubiquitous
        statement: '常に、ファイルを書き換えず、テーマを取得しません'
      - id: PV-SLIDE-THEME-03
        pattern: unwanted
        statement: 'もし talk-dir がテーマを参照していないなら、`theme-none` の失敗を返します'
      - id: PV-SLIDE-THEME-04
        pattern: unwanted
        statement: 'もしテーマが `node_modules` に張られていないなら、`theme-unlinked` の失敗を返し、`message` で `slide_sync` の呼び出しを案内します'
      - id: PV-SLIDE-THEME-05
        pattern: unwanted
        statement: 'もしテーマの宣言が決まった形でないなら、`theme-invalid-shape` の失敗を返します'
common_behaviors:
  - id: PV-COMMON-01
    pattern: unwanted
    statement: 'もし `inputSchema` が宣言した型・範囲・列挙・必須に反する入力を渡したなら、ツールを実行せずに入力検証エラーを返し、`structuredContent` を返しません'
  - id: PV-COMMON-02
    pattern: event
    statement: '最上位に宣言外のキーを渡すと、そのキーを無視して通常どおり実行します'
  - id: PV-COMMON-03
    pattern: unwanted
    statement: 'もしパスを渡す入力が相対パスなら、処理を始めずに `ok` が `false`・`exitCode` 2 の失敗を返し、渡した値を `data.invalidPaths` に載せます'
  - id: PV-COMMON-04
    pattern: event
    statement: 'Windows 形式のパスを渡すと、`/mnt/<ドライブ>/` の下か WSL の中の絶対パスに変換して処理します'
  - id: PV-COMMON-05
    pattern: unwanted
    statement: 'もし Windows 形式のパスを POSIX の絶対パスに変換できないなら、処理を始めずに `ok` が `false`・`exitCode` 2 の失敗を返します'
  - id: PV-COMMON-06
    pattern: ubiquitous
    statement: '常に、応答の `structuredContent` と同じ内容の JSON を、`content` のテキストにも載せます'
  - id: PV-COMMON-07
    pattern: unwanted
    statement: 'もし `ok` が `false` なら、応答の `isError` を真にします'
  - id: PV-COMMON-08
    pattern: event
    statement: '呼び出しが同時に届くと、1 件ずつ到着順に実行します'
  - id: PV-COMMON-09
    pattern: event
    statement: '`progressToken` を付けて呼ぶと、キューでの待機中と実行中の 10 秒ごとに progress 通知を送ります'
  - id: PV-COMMON-10
    pattern: unwanted
    statement: 'もしクライアントが呼び出しを取り消したなら、取り消した呼び出しへの progress 通知を止めます'
  - id: PV-COMMON-11
    pattern: unwanted
    statement: 'もし捕捉した stdout または stderr が 64 KiB を超えたなら、先頭を捨てて末尾の 64 KiB を残し、先頭に切り詰めを示す行を付けます'
  - id: PV-COMMON-12
    pattern: event
    statement: '呼び出しが失敗した後に次の呼び出しが来ると、同じ接続でその呼び出しに応えます'
  - id: PV-COMMON-13
    pattern: unwanted
    statement: 'もし公開していないツール名で呼ばれたなら、JSON-RPC エラー -32602 を返します'
  - id: PV-COMMON-14
    pattern: unwanted
    statement: 'もしハンドラの中で捕捉されない例外が起きたなら、その呼び出しだけを失敗させ、サーバは次の呼び出しを受け付けます'
