        when: '`dir` がディレクトリではありません。'
      - kind: not-talk-dir
        when: '`dir` に `slides.md` がありません。talk-dir ではありません。'
      - kind: eslint-not-launched
        when: 'eslint を起動できませんでした。'
      - kind: eslint-timeout
        when: 'eslint が、制限時間の内に終わりませんでした。'
      - kind: eslint-failed
        when: 'eslint が、lint の違反ではないエラーで終わりました。'
      - kind: invalid-report
        when: 'eslint の結果を読めませんでした。'
      - kind: theme-none
        when: 'talk-dir がテーマを参照していません。移行前の talk-dir です。'
      - kind: theme-unlinked
        when: 'talk-dir のテーマが `node_modules` に張られていないか、`package.json` を読めません。`detail` が、直すための `slide_sync` の呼び出しを示します。'
