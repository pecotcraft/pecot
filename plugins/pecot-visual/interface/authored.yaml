  PV-SLIDE-CREATE:
    summary: テーマを参照する talk-dir を新しく作ります。
    arguments:
      force: '`project_dir` が既にあるときに、消して作り直すかどうかです。'
      project_dir: '作る talk-dir の絶対パスです。後で編集できるように、呼び出すエージェントが書き込める場所（作業ディレクトリの下など）を渡します。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      theme: '参照するテーマです。tag 付きの git URL（`git+https://<host>/<owner>/<repo>.git#<tag>`）か、ローカルのパス（`file:<絶対パス>`）で渡します。tag の無い git URL は受け付けません。'
    constraints: []
    details:
      - '`project_dir` に、`theme` の Slidev のテーマを参照する talk-dir を作ります。'
      - 'テーマの提示カテゴリを `data.categories` に、選べるレイアウトを `data.layouts` に返します。'
      - '作った直後にデッキ全体を lint し、結果を `data.lint` に返します。違反があっても、作成は成功です。'
      - '作られる `start.mjs` は、`SLIDEV_PORT` があれば、そのポートで dev サーバを起動します。'
    stdin: none
    output:
      format: json
      description: 結果は JSON のオブジェクトです。
      fields:
        artifacts: '作った talk-dir の絶対パスです。失敗したときは空です。'
        data: 'テーマの提示カテゴリ（`categories`）、選べるレイアウト（`layouts`）、作った直後の lint の結果（`lint`）です。失敗したときは `reason` と `detail` です。'
        exitCode: 成功は 0、失敗は 1、引数が不正なら 2 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。lint の違反があっても `true` です。'
        stderr: 捕捉した標準エラー出力です。捕捉していなければ、この項目はありません。
        stdout: 捕捉した標準出力です。捕捉していなければ、この項目はありません。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of files and directories created or updated
            items:
              type: string
            type: array
          data:
            additionalProperties: {}
            description: Object with the details of the run
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the tool completed its intended run
            type: boolean
          stderr:
            description: Captured stderr (omitted when nothing was captured)
            type: string
          stdout:
            description: Captured stdout (omitted when nothing was captured)
            type: string
        required:
          - ok
          - exitCode
          - artifacts
          - data
          - message
        type: object
    diagnostics: default
    environment:
      - name: SLIDEV_PORT
        effect: 'talk-dir から起動する dev サーバのポートです。ツールではなく、作られる `start.mjs` が読みます。'
    exit_status:
      - kind: invalid-path
        code: 2
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `data.invalidPaths` に並びます。'
      - kind: runtime-dependencies-not-installed
        code: 1
        when: '実行時依存が入っていません。`message` が `setup` の呼び出しを案内します。'
      - kind: invalid-option
        code: 2
        when: '`theme` の `file:` のパスが、相対パスか、変換できないパスです。'
      - kind: dest-exists
        code: 2
        when: '`project_dir` が既にあり、`force` が `false` です。'
      - kind: theme-tag-required
        code: 2
        when: '`theme` の git URL に `#<tag>` がありません。'
      - kind: theme-tag-format
        code: 2
        when: '`theme` の tag が、受け付ける形式ではありません。'
      - kind: theme-semver-range
        code: 2
        when: '`theme` の tag が、版の範囲になっています。'
      - kind: theme-unsupported-spec
        code: 2
        when: '`theme` が、`git+https` の URL でも `file:` のパスでもありません。'
      - kind: theme-connection
        code: 1
        when: 'テーマのリポジトリに接続できません。'
      - kind: theme-auth
        code: 1
        when: 'テーマのリポジトリが、認証情報を受け付けません。'
      - kind: theme-tag
        code: 1
        when: 'テーマの tag が、リポジトリにありません。'
      - kind: theme-install
        code: 1
        when: 'pnpm でのテーマの依存のインストールに失敗しました。'
      - kind: theme-unknown
        code: 1
        when: 'テーマの取得が、上のどれにも当てはまらない理由で失敗しました。'
      - kind: theme-invalid-shape
        code: 1
        when: 'テーマの宣言が、決まった形ではありません。'
      - kind: theme-unknown-rule
        code: 1
        when: 'テーマの宣言に、存在しない lint の規則の名前があります。'
      - kind: copy-failed
        code: 1
        when: 'talk-dir のファイルの組み立てに失敗しました。'
      - kind: symlink-failed
        code: 1
        when: '`node_modules` のリンクを張れませんでした。'
      - kind: unknown
        code: 1
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: 'どの手順で失敗しても、既にある `project_dir` はそのまま残り、一時ディレクトリは消えます。`force` を `true` にしたときも同じです。'
    effects:
      - target: file
        kind: write
        what: '`project_dir` を作り、`slides.md`・`package.json`・`pages/`・`public/slides/`・`vite.config.ts`・`start.mjs` を置きます。`node_modules` のリンクも張ります。取得したテーマは、`<data-dir>/themes` の下に置きます。'
      - target: file
        kind: destructive
        what: '`force` が `true` のときは、新しい talk-dir を組み立てた後で、既にある `project_dir` を消します。'
      - target: process
        kind: write
        what: 'git のテーマをまだ取得していないときは、git で tag を解決し、pnpm でテーマの依存をネットワークから入れます。'
      - target: process
        kind: read
        what: '`data.lint` のために、作ったデッキに eslint を動かします。'
    prerequisites:
      - '実行時依存が要ります。入っていなければ、先に `setup` を呼びます。'
      - '`project_dir` とその親に、書き込めることが要ります。'
    idempotent: false
    examples:
      - run: "slide_create {\"project_dir\": \"/work/talk\", \"theme\": \"git+https://github.com/example/slidev-theme.git#v1.0.0\"}"
        note: 'tag 付きのテーマを参照する talk-dir を作ります。'
      - run: "slide_create {\"project_dir\": \"/work/talk\", \"theme\": \"file:/work/theme\", \"force\": true}"
        note: 'ローカルのテーマから、talk-dir を作り直します。'
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-CREATE-01
        pattern: event
        statement: '`project_dir` と `theme` を渡して呼ぶと、テーマを参照する talk-dir を作り、`artifacts` に `project_dir` を載せた成功の応答を返します'
      - id: PV-SLIDE-CREATE-02
        pattern: event
        statement: '呼ぶと、`data.categories` と `data.layouts` に、テーマの提示カテゴリと選べるレイアウトを載せます'
      - id: PV-SLIDE-CREATE-03
        pattern: event
        statement: '呼ぶと、作った直後のデッキ全体の lint の結果を `data.lint` に載せます'
      - id: PV-SLIDE-CREATE-04
        pattern: unwanted
        statement: 'もし作った直後の lint が違反を見つけたなら、作成は成功として返します'
      - id: PV-SLIDE-CREATE-05
        pattern: event
        statement: '`force` を `true` にして呼ぶと、組み立てが済んだ後で、既にある `project_dir` を置き換えます'
      - id: PV-SLIDE-CREATE-06
        pattern: unwanted
        statement: 'もし `project_dir` が既にあり `force` が `false` なら、何も変えずに `dest-exists`・`exitCode` 2 の失敗を返します'
      - id: PV-SLIDE-CREATE-07
        pattern: unwanted
        statement: 'もし `theme` が tag の無い git URL なら、何も作らずに `theme-tag-required`・`exitCode` 2 の失敗を返します'
      - id: PV-SLIDE-CREATE-08
        pattern: unwanted
        statement: 'もし `file:` の `theme` が相対パスなら、何も作らずに `invalid-option`・`exitCode` 2 の失敗を返します'
      - id: PV-SLIDE-CREATE-09
        pattern: unwanted
        statement: 'もし実行時依存が未導入なら、何も作らずに `runtime-dependencies-not-installed` の失敗を返し、`message` で `setup` の呼び出しを案内します'
      - id: PV-SLIDE-CREATE-10
        pattern: unwanted
        statement: 'もし組み立ての途中で失敗したなら、既にある `project_dir` を残し、一時ディレクトリを消します'
