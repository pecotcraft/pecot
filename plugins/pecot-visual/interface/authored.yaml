    exit_status:
      - kind: invalid-path
        when: A path input is relative, or is a Windows-style path that cannot be converted (exitCode 2); data.invalidPaths lists the values as given.
      - kind: invalid-file-name
        when: file is empty, contains a path separator, or contains a character that a page name cannot use (exitCode 1).
      - kind: numeric-filename-prefix
        when: file starts with a digit (exitCode 1).
      - kind: unknown-layout
        when: layout is not in the theme of the talk-dir (exitCode 1); data.categories and data.layouts list the choices.
      - kind: skeleton-unavailable
        when: The reference yaml of the layout is missing or has no usable skeleton (exitCode 1).
      - kind: reference-read-failed
        when: The reference yaml could not be read (exitCode 1).
      - kind: broken-reference
        when: A common specification that the reference yaml includes is missing (exitCode 1).
      - kind: file-exists
        when: pages/<file>.md already exists and force is false (exitCode 1).
      - kind: write-failed
        when: The page could not be written (exitCode 1).
      - kind: theme-none
        when: The talk-dir does not reference a theme, so it is a pre-migration talk-dir (exitCode 1).
      - kind: theme-unlinked
        when: The theme of the talk-dir is not linked in node_modules, or package.json cannot be read (exitCode 1); the message gives the slide_sync call that restores it.
      - kind: theme-invalid-shape
        when: The theme declaration does not have the expected shape (exitCode 1).
      - kind: theme-unknown-rule
        when: The theme declaration names a lint rule that does not exist (exitCode 1).
      - kind: unknown
        when: The run failed for a reason the tool does not classify (exitCode 1).
    on_error: default
    effects:
      - target: file
        kind: read
        what: Reads the theme declaration and the reference yaml of the layout.
      - target: file
        kind: write
        what: Writes pages/<file>.md in dir; replaces an existing page only when force is true.
    prerequisites:
      - dir is a talk-dir that references a theme.
      - The layout name is taken from data.layouts of slide_create or slide_sync.
    idempotent: false
    examples:
      - run: "slide_page {\"layout\": \"cover\", \"dir\": \"/work/talk\", \"file\": \"cover\"}"
        note: Write pages/cover.md from the cover layout.
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-PAGE-01
        pattern: event
        statement: layout・dir・file を渡して呼ぶと、pages/ に骨組みのページを書き、artifacts にそのパスを載せた成功の応答を返す
      - id: PV-SLIDE-PAGE-02
        pattern: event
        statement: 呼ぶと、レイアウトの仕様を data.reference に、その共通仕様を data.includes に載せる
      - id: PV-SLIDE-PAGE-03
        pattern: event
        statement: file を .md なしで渡すと、.md を補ったファイル名で書く
      - id: PV-SLIDE-PAGE-04
        pattern: event
        statement: force を true にして呼ぶと、同名のページがあっても上書きする
      - id: PV-SLIDE-PAGE-05
        pattern: unwanted
        statement: もし同名のページがあり force が false なら、何も書かず file-exists の失敗を返す
      - id: PV-SLIDE-PAGE-06
        pattern: unwanted
        statement: もし layout がテーマに無いなら、何も書かず unknown-layout の失敗を返し、data.categories と data.layouts を載せる
      - id: PV-SLIDE-PAGE-07
        pattern: unwanted
        statement: もし file が数字で始まるなら、何も書かず numeric-filename-prefix の失敗を返す
      - id: PV-SLIDE-PAGE-08
        pattern: unwanted
        statement: もし file にパス区切りが含まれるなら、何も書かず invalid-file-name の失敗を返す
      - id: PV-SLIDE-PAGE-09
        pattern: ubiquitous
        statement: 常に、slides.md を書き換えない
  PV-SLIDE-SYNC:
    constraints:
      - conflicts:
          - theme
          - node_modules_only
    details:
      - Brings an existing talk-dir in line with the plugin and returns its directory in artifacts.
      - "A pre-migration talk-dir (one that holds a copy of the template) is moved to a form that references theme: the files from the template are deleted and the work area (slides.md, pages/*.md, public/slides/) is kept; the deleted names are in data.migration.removed."
      - A migrated talk-dir fetches the theme at the version in the dependency of package.json, relinks node_modules and aligns vite.config.ts and start.mjs with the plugin; other files are not changed.
      - "To raise the theme version, rewrite the #<tag> of the dependency in package.json before calling."
      - Returns data.categories, data.layouts and the lint result of the whole deck after the sync.
      - A running slide_dev has to be stopped with stop true and started again.
    stdin: none
    output:
      format: json
      description: Structured result with ok, exitCode, artifacts, data and message, plus stdout and stderr when output was captured. data carries event, and reason and detail on failure.
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of files and directories created or updated
            items:
              type: string
            type: array
          data:
            additionalProperties: {}
            description: Object with the details of the run
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the tool completed its intended run
            type: boolean
          stderr:
            description: Captured stderr (omitted when nothing was captured)
            type: string
          stdout:
            description: Captured stdout (omitted when nothing was captured)
            type: string
        required:
          - ok
          - exitCode
          - artifacts
          - data
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-path
        when: A path input is relative, or is a Windows-style path that cannot be converted (exitCode 2); data.invalidPaths lists the values as given.
      - kind: runtime-dependencies-not-installed
        when: The runtime dependencies are not installed (exitCode 1); the message tells to call setup.
      - kind: invalid-option
        when: "The file: path of theme is relative or cannot be converted (exitCode 2)."
      - kind: dir-not-found
        when: dir does not exist (exitCode 1).
      - kind: not-a-directory
        when: dir is not a directory (exitCode 1).
      - kind: not-talk-dir
        when: dir has no slides.md, so it is not a talk-dir (exitCode 1).
      - kind: theme-required
        when: dir is a pre-migration talk-dir and theme is not given (exitCode 2).
      - kind: theme-with-node-modules-only
        when: theme and node_modules_only are given together (exitCode 2).
      - kind: theme-root
        when: "The directory of a file: theme is not a theme root (exitCode 1)."
      - kind: theme-name-mismatch
        when: The key of the theme in dependencies does not match the name of the theme (exitCode 1).
      - kind: migrate-failed
        when: Moving the pre-migration talk-dir to the theme form failed (exitCode 1).
      - kind: symlink-failed
        when: Linking node_modules failed (exitCode 1).
      - kind: theme-tag-required
        when: "The git URL of theme has no #<tag> (exitCode 2)."
      - kind: theme-tag-format
        when: The tag of theme is not in the accepted format (exitCode 2).
      - kind: theme-semver-range
        when: The tag of theme is a version range (exitCode 2).
      - kind: theme-unsupported-spec
        when: "theme is neither a git+https URL nor a file: path (exitCode 2)."
      - kind: theme-connection
        when: The theme repository cannot be reached (exitCode 1).
      - kind: theme-auth
        when: The theme repository rejects the credentials (exitCode 1).
      - kind: theme-tag
        when: The tag of the theme does not exist in the repository (exitCode 1).
      - kind: theme-install
        when: Installing the dependencies of the theme with pnpm failed (exitCode 1).
      - kind: theme-unknown
        when: Fetching the theme failed for another reason (exitCode 1).
      - kind: theme-unlinked
        when: The theme of the talk-dir is not linked in node_modules, or package.json cannot be read (exitCode 1); the message gives the slide_sync call that restores it.
      - kind: unknown
        when: The run failed for a reason the tool does not classify (exitCode 1).
    on_error: default
    effects:
      - target: file
        kind: destructive
        what: Deletes the files that came from the template when migrating a pre-migration talk-dir; the work area is kept.
      - target: file
        kind: write
        what: Rewrites package.json, slides.md, vite.config.ts, start.mjs and the node_modules links of dir; stores a fetched theme under <data-dir>/themes.
      - target: process
        kind: write
        what: Runs git and pnpm to fetch the theme from the network when it is not yet fetched.
      - target: process
        kind: read
        what: Runs eslint over the deck for data.lint.
    prerequisites:
      - The runtime dependencies are installed; call setup otherwise.
      - A running slide_dev of dir is stopped.
    idempotent: true
    examples:
      - run: "slide_sync {\"dir\": \"/work/talk\", \"theme\": \"git+https://github.com/example/slidev-theme.git#v1.0.0\"}"
        note: Move a pre-migration talk-dir to a theme reference.
      - run: "slide_sync {\"dir\": \"/work/talk\", \"node_modules_only\": true}"
        note: Relink node_modules only.
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-SYNC-01
        pattern: event
        statement: 移行前の talk-dir に theme を渡して呼ぶと、テンプレート由来のファイルを消してテーマを参照する形へ移し、消した名前を data.migration.removed に載せる
      - id: PV-SLIDE-SYNC-02
        pattern: event
        statement: 移行前の talk-dir を移すと、slides.md・pages/*.md・public/slides/ を残す
      - id: PV-SLIDE-SYNC-03
        pattern: event
        statement: 移行済みの talk-dir を渡して呼ぶと、package.json の依存の版でテーマを取得し、node_modules を張り直す
      - id: PV-SLIDE-SYNC-04
        pattern: event
        statement: 移行済みの talk-dir を渡して呼ぶと、vite.config.ts と start.mjs をプラグインの今の内容にそろえる
      - id: PV-SLIDE-SYNC-05
        pattern: event
        statement: node_modules_only を true にして呼ぶと、node_modules の張り直しと生成ファイルのそろえだけを行う
      - id: PV-SLIDE-SYNC-06
        pattern: event
        statement: 呼ぶと、同期の後のデッキ全体の lint の結果を data.lint に載せる
      - id: PV-SLIDE-SYNC-07
        pattern: unwanted
        statement: もし移行前の talk-dir に theme を渡さないなら、何も変えず theme-required・exitCode 2 の失敗を返す
      - id: PV-SLIDE-SYNC-08
        pattern: unwanted
        statement: もし theme と node_modules_only を同時に渡したなら、何も変えず theme-with-node-modules-only・exitCode 2 の失敗を返す
      - id: PV-SLIDE-SYNC-09
        pattern: unwanted
        statement: もし実行時依存が未導入なら、何も変えず runtime-dependencies-not-installed の失敗を返し、message に setup の呼び出しを案内する
  PV-SLIDE-THEME:
    constraints: []
    details:
      - "Returns the theme that a talk-dir references: its name, spec and root in data.theme, and the declaration in data.declaration."
      - The declaration covers fonts, font sizes, PPTX fonts, link colors and lint rules.
      - Also returns the selectable layouts in data.layouts, the presentation categories in data.categories, the lint settings in data.lint and the warnings in data.warnings.
      - Skills use it to read the theme values.
    stdin: none
    output:
      format: json
      description: Structured result with ok, exitCode, artifacts, data and message, plus stdout and stderr when output was captured. data carries event, and reason and detail on failure.
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of files and directories created or updated
            items:
              type: string
            type: array
          data:
            additionalProperties: {}
            description: Object with the details of the run
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the tool completed its intended run
            type: boolean
          stderr:
            description: Captured stderr (omitted when nothing was captured)
            type: string
          stdout:
            description: Captured stdout (omitted when nothing was captured)
            type: string
        required:
          - ok
          - exitCode
          - artifacts
          - data
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-path
        when: A path input is relative, or is a Windows-style path that cannot be converted (exitCode 2); data.invalidPaths lists the values as given.
      - kind: theme-none
        when: The talk-dir does not reference a theme, so it is a pre-migration talk-dir (exitCode 1).
      - kind: theme-unlinked
        when: The theme of the talk-dir is not linked in node_modules, or package.json cannot be read (exitCode 1); the message gives the slide_sync call that restores it.
      - kind: theme-invalid-shape
        when: The theme declaration does not have the expected shape (exitCode 1).
      - kind: theme-unknown-rule
        when: The theme declaration names a lint rule that does not exist (exitCode 1).
      - kind: unknown
        when: The run failed for a reason the tool does not classify (exitCode 1).
    on_error: default
    effects:
      - target: file
        kind: read
        what: Reads package.json, slides.md and the linked theme of dir.
    prerequisites:
      - dir is a talk-dir that references a theme and has the theme linked in node_modules.
    idempotent: true
    examples:
      - run: "slide_theme {\"dir\": \"/work/talk\"}"
        note: Get the fonts, font sizes and layouts of the theme.
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-THEME-01
        pattern: event
        statement: dir を渡して呼ぶと、参照するテーマの名前・宣言・レイアウト・カテゴリを data に載せた成功の応答を返す
      - id: PV-SLIDE-THEME-02
        pattern: ubiquitous
        statement: 常に、ファイルを書き換えず、テーマを取得しない
      - id: PV-SLIDE-THEME-03
        pattern: unwanted
        statement: もし talk-dir がテーマを参照していないなら、theme-none の失敗を返す
      - id: PV-SLIDE-THEME-04
        pattern: unwanted
        statement: もしテーマが node_modules に張られていないなら、theme-unlinked の失敗を返し、slide_sync の呼び出しを message に案内する
      - id: PV-SLIDE-THEME-05
        pattern: unwanted
        statement: もしテーマの宣言が決まった形でないなら、theme-invalid-shape の失敗を返す
common_behaviors:
  - id: PV-COMMON-01
    pattern: unwanted
    statement: もし inputSchema が宣言した型・範囲・列挙・必須に反する入力を渡したなら、ツールを実行せず入力検証エラーを返し、structuredContent を返さない
  - id: PV-COMMON-02
    pattern: event
    statement: 最上位に宣言外のキーを渡すと、そのキーを無視して通常どおり実行する
  - id: PV-COMMON-03
    pattern: unwanted
    statement: もしパスを渡す入力が相対パスなら、処理を始めず ok が false・exitCode 2 の失敗を返し、渡した値を data.invalidPaths に載せる
  - id: PV-COMMON-04
    pattern: event
    statement: Windows 形式のパスを渡すと、/mnt/<ドライブ>/ の下か WSL 内の絶対パスに変換して処理する
  - id: PV-COMMON-05
    pattern: unwanted
    statement: もし Windows 形式のパスを POSIX の絶対パスに変換できないなら、処理を始めず ok が false・exitCode 2 の失敗を返す
  - id: PV-COMMON-06
    pattern: ubiquitous
    statement: 常に、応答の structuredContent と同じ内容の JSON を content のテキストにも載せる
  - id: PV-COMMON-07
    pattern: unwanted
    statement: もし ok が false なら、応答の isError を真にする
  - id: PV-COMMON-08
    pattern: event
    statement: 呼び出しが同時に届くと、1 件ずつ到着順に実行する
  - id: PV-COMMON-09
    pattern: event
    statement: progressToken を付けて呼ぶと、キューでの待機中と実行中の 10 秒ごとに progress 通知を送る
  - id: PV-COMMON-10
    pattern: unwanted
    statement: もしクライアントが呼び出しを取り消したなら、取り消した呼び出しへの progress 通知を止める
  - id: PV-COMMON-11
    pattern: unwanted
    statement: もし捕捉した stdout または stderr が 64 KiB を超えたなら、先頭を捨てて末尾の 64 KiB を残し、先頭に切り詰めを示す行を付ける
  - id: PV-COMMON-12
    pattern: event
    statement: 呼び出しが失敗した後に次の呼び出しが来ると、同じ接続でその呼び出しに応える
  - id: PV-COMMON-13
    pattern: unwanted
    statement: もし公開していないツール名で呼ばれたなら、JSON-RPC エラー -32602 を返す
  - id: PV-COMMON-14
    pattern: unwanted
    statement: もしハンドラの中で捕捉されない例外が起きたなら、その呼び出しだけを失敗させ、サーバは次の呼び出しを受け付ける
