        what: '`dir` の `slides.md`・`pages/**/*.md` と、テーマの宣言を読みます。'
      - target: process
        kind: read
        what: 'デッキに eslint を動かし、その結果を読みます。ファイルは直さず、書きません。'
    prerequisites:
      - '`dir` は、テーマを参照する talk-dir です。'
    idempotent: true
    examples:
      - arguments:
          dir: '/work/talk'
        note: 'デッキ全体を lint します。'
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-LINT-01
        pattern: event
        statement: '`dir` を渡して呼ぶと、デッキ全体を lint し、違反の一覧を `violations` に載せて返します'
      - id: PV-SLIDE-LINT-02
