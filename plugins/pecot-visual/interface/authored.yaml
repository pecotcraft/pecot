      dir: 'dev サーバを起動する talk-dir の絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      port: '起動するポートです。使用中のときは、別のポートへ移らずに失敗します。起動中の talk-dir に別のポートを渡すと、そのポートで開き直します。'
