      - id: PV-SLIDE-LINT-05
        pattern: unwanted
        statement: 'もし `dir` が talk-dir でないなら、lint を起動せずに `not-talk-dir` の失敗を返します'
      - id: PV-SLIDE-LINT-06
        pattern: unwanted
        statement: 'もし talk-dir がテーマを参照していないなら、lint を起動せずに `theme-none` の失敗を返します'
  PV-SLIDE-PAGE:
    summary: レイアウトを 1 つ選び、骨組みのページを talk-dir に作ります。
    arguments:
      dir: 'ページを作る talk-dir の絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      file: '`pages/` の直下に作るファイルの名前です。`.md` は省けます。パスの区切りを含む名前と、数字で始まる名前は受け付けません。'
      force: '同じ名前のページが既にあるときに、上書きするかどうかです。'
      layout: 'レイアウトの名前です。`slide_create` か `slide_sync` の応答の `categories` で見せ方を決め、そのカテゴリの `layouts` にある名前から選びます。'
    constraints: []
    details:
      - 'レイアウト 1 つの骨組みのページを、talk-dir の `pages/<file>.md` に書きます。'
      - 'レイアウトの仕様（props・文字数の制約・クリックの数・良い例と悪い例）を `reference` に、その仕様が取り込む共通の仕様を `includes` に返します。'
      - '作ったページは、`slides.md` には登録しません。`src:` の行は、呼び出した側が足します。'
      - 'テーマに無いレイアウトの名前を渡すと失敗し、`categories` と `layouts` を返します。そこから名前を選び直せます。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。成功なら `slide.page.done`、失敗なら `slide.page.error` です。パスの引数を拒否したときは入りません。'
        layout: '書いたページのレイアウトの名前です。成功のときだけ入ります。'
        category: 'レイアウトのカテゴリの ID です。成功のときだけ入ります。'
        deprecated: 'レイアウトが非推奨かどうかです。成功のときだけ入ります。'
        path: '書いたページの絶対パスです。成功のときだけ入ります。'
        skeleton: 'ページに書いた frontmatter です。成功のときだけ入ります。'
        reference: 'レイアウトの仕様の yaml の全文です。成功のときだけ入ります。'
        includes: '仕様が取り込む共通の yaml の全文です。名前をキーにします。成功のときだけ入り、無ければ空です。'
        categories: '`unknown-layout` のときの、テーマが宣言する提示カテゴリの配列です。'
        layouts: '`unknown-layout` のときの、選べるレイアウトの配列です。隠したレイアウトは入りません。'
        invalidPaths: '`invalid-path` のときの、拒否したパスの引数の配列です。要素は `<引数>=<値>` の形です。'
        convertedPaths: '`invalid-path` のときの、拒否の前に変換した Windows 形式のパスです。引数の名前をキーに、`from` と `to` を持ちます。変換が無ければ入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-path
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `invalidPaths` に並びます。'
      - kind: invalid-file-name
        when: '`file` が空か、パスの区切りを含むか、ページの名前に使えない文字を含みます。'
      - kind: numeric-filename-prefix
        when: '`file` が数字で始まります。'
      - kind: unknown-layout
        when: '`layout` が、talk-dir のテーマにありません。選べる名前は、`categories` と `layouts` に並びます。'
      - kind: skeleton-unavailable
        when: 'レイアウトの仕様の yaml が無いか、使える骨組みがありません。'
      - kind: reference-read-failed
        when: 'レイアウトの仕様の yaml を読めませんでした。'
      - kind: broken-reference
        when: 'レイアウトの仕様の yaml が取り込む共通の仕様がありません。'
      - kind: file-exists
        when: '`pages/<file>.md` が既にあり、`force` が `false` です。'
      - kind: write-failed
        when: 'ページを書き込めませんでした。'
      - kind: theme-none
        when: 'talk-dir がテーマを参照していません。移行前の talk-dir です。'
      - kind: theme-unlinked
        when: 'talk-dir のテーマが `node_modules` に張られていないか、`package.json` を読めません。`detail` が、直すための `slide_sync` の呼び出しを示します。'
      - kind: theme-invalid-shape
        when: 'テーマの宣言が、決まった形ではありません。'
      - kind: theme-unknown-rule
        when: 'テーマの宣言に、存在しない lint の規則の名前があります。'
      - kind: unknown
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'テーマの宣言と、レイアウトの仕様の yaml を読みます。'
      - target: file
        kind: write
        what: '`dir` の `pages/<file>.md` に、新しいページを書きます。'
      - target: file
        kind: destructive
        what: '`force` が `true` のときは、既にある `pages/<file>.md` を置き換えます。'
    prerequisites:
      - '`dir` は、テーマを参照する talk-dir です。'
      - 'レイアウトの名前は、`slide_create` か `slide_sync` の `layouts` から選びます。'
    idempotent: false
    examples:
      - arguments:
          layout: 'cover'
          dir: '/work/talk'
          file: 'cover'
        note: '`cover` のレイアウトから、`pages/cover.md` を作ります。'
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-PAGE-01
        pattern: event
        statement: '`layout`・`dir`・`file` を渡して呼ぶと、`pages/` に骨組みのページを書き、`path` にそのパスを載せた成功の応答を返します'
      - id: PV-SLIDE-PAGE-02
        pattern: event
        statement: '呼ぶと、レイアウトの仕様を `reference` に、その共通の仕様を `includes` に載せます'
      - id: PV-SLIDE-PAGE-03
        pattern: event
        statement: '`file` を `.md` なしで渡すと、`.md` を補ったファイル名で書きます'
      - id: PV-SLIDE-PAGE-04
        pattern: event
        statement: '`force` を `true` にして呼ぶと、同じ名前のページがあっても上書きします'
      - id: PV-SLIDE-PAGE-05
        pattern: unwanted
        statement: 'もし同じ名前のページがあり `force` が `false` なら、何も書かずに `file-exists` の失敗を返します'
      - id: PV-SLIDE-PAGE-06
        pattern: unwanted
        statement: 'もし `layout` がテーマに無いなら、何も書かずに `unknown-layout` の失敗を返し、`categories` と `layouts` を載せます'
      - id: PV-SLIDE-PAGE-07
        pattern: unwanted
        statement: 'もし `file` が数字で始まるなら、何も書かずに `numeric-filename-prefix` の失敗を返します'
      - id: PV-SLIDE-PAGE-08
        pattern: unwanted
        statement: 'もし `file` にパスの区切りが含まれるなら、何も書かずに `invalid-file-name` の失敗を返します'
      - id: PV-SLIDE-PAGE-09
        pattern: ubiquitous
        statement: '常に、`slides.md` を書き換えません'
  PV-SLIDE-SYNC:
    summary: 既にある talk-dir を、テーマとプラグインの今の内容にそろえます。
    arguments:
      dir: 'そろえる talk-dir の絶対パスです。Windows 形式のパス（`C:\...` と `\\wsl.localhost\<distro>\...`）も渡せます。Windows 形式のパスは、`/mnt/<drive>/` の下か WSL の中の絶対パスに変換します。'
      node_modules_only: '`true` にすると、`node_modules` の張り直しと、生成ファイル（`vite.config.ts`・`start.mjs`）をそろえることだけを行います。`package.json` のテーマは、先に取得してから張ります。取得済みなら、ネットワークを使いません。移行済みの talk-dir では、省いても同じ動きです。'
      theme: '移行前の talk-dir に参照させるテーマです。`git+https://<host>/<owner>/<repo>.git#<tag>` か `file:<絶対パス>` で渡します。移行前の talk-dir では必須です。移行済みの talk-dir では使いません。'
    constraints:
      - conflicts:
          - theme
          - node_modules_only
    details:
      - '移行前の talk-dir（テンプレートの写しを持つもの）は、`theme` のテーマを参照する形へ移します。テンプレートから来たファイルを消し、作業の領域（`slides.md`・`pages/*.md`・`public/slides/`）を残します。消した名前は、`migration.removed` に入ります。'
      - '移行済みの talk-dir は、`package.json` の依存に書かれた版でテーマを取得し、`node_modules` を張り直します。`vite.config.ts` と `start.mjs` は、プラグインの今の内容にそろえます。ほかのファイルは変えません。'
      - 'テーマの版を上げるときは、呼ぶ前に、`package.json` の依存の `#<tag>` を書き換えます。'
      - 'テーマの提示カテゴリ（`categories`）、選べるレイアウト（`layouts`）、そろえた後のデッキ全体の lint の結果を返します。'
      - '起動中の `slide_dev` は、`stop` を `true` にして止めてから、起動し直します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        event: '結果の種類です。成功なら `slide.sync.done` です。失敗なら `slide.sync.error` か `runtime-dependencies.unavailable` です。パスの引数を拒否したときは入りません。'
        dir: 'そろえた talk-dir の絶対パスです。成功のときだけ入ります。'
        nodeModulesTarget: 'talk-dir の `node_modules` のリンク先です。成功のときだけ入ります。'
        nodeModulesOnly: '`node_modules` のリンクだけを張り直したかどうかです。成功のときだけ入ります。'
        theme: 'talk-dir が参照するテーマです。`name`・`spec`・`directory` を持ちます。テーマを参照しないときは `null` です。'
        migration: '移行したときの、消した名前（`removed`）です。移行しなかったときは `null` です。'
        categories: 'テーマが宣言する提示カテゴリの配列です。要素は `id`・`label`・`question` を持ちます。成功のときだけ入ります。'
        layouts: '選べるレイアウトの配列です。隠したレイアウトは入りません。成功のときだけ入ります。'
        lint: 'そろえた後のデッキ全体の lint の結果です。成功のときだけ入ります。'
        expectedAt: '実行時依存か Chromium が置かれるはずの場所です。`runtime-dependencies-not-installed`・`chromium-not-installed`・`chromium-install-failed` のときだけ入ります。'
        invalidPaths: '`invalid-path` のときの、拒否したパスの引数の配列です。要素は `<引数>=<値>` の形です。'
        convertedPaths: '`invalid-path` のときの、拒否の前に変換した Windows 形式のパスです。引数の名前をキーに、`from` と `to` を持ちます。変換が無ければ入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-path
        when: 'パスの引数が、相対パスか、変換できない Windows 形式のパスです。渡された値は、そのまま `invalidPaths` に並びます。'
      - kind: runtime-dependencies-not-installed
        when: '実行時依存が入っていません。`detail` が `runtime_setup` の呼び出しを案内します。'
      - kind: invalid-option
        when: '`theme` の `file:` のパスが、相対パスか、変換できないパスです。'
      - kind: dir-not-found
        when: '`dir` がありません。'
      - kind: not-a-directory
        when: '`dir` がディレクトリではありません。'
      - kind: not-talk-dir
        when: '`dir` に `slides.md` がありません。talk-dir ではありません。'
      - kind: theme-required
        when: '`dir` が移行前の talk-dir で、`theme` を渡していません。'
      - kind: theme-with-node-modules-only
        when: '`theme` と `node_modules_only` を同時に渡しています。'
      - kind: theme-root
        when: '`file:` のテーマのディレクトリが、テーマのルートではありません。'
      - kind: theme-name-mismatch
        when: '`dependencies` のテーマのキーが、テーマの名前と合っていません。'
      - kind: migrate-failed
        when: '移行前の talk-dir を、テーマを参照する形へ移せませんでした。'
      - kind: symlink-failed
        when: '`node_modules` のリンクを張れませんでした。'
      - kind: theme-tag-required
        when: '`theme` の git URL に `#<tag>` がありません。'
      - kind: theme-tag-format
        when: '`theme` の tag が、受け付ける形式ではありません。'
      - kind: theme-semver-range
        when: '`theme` の tag が、版の範囲になっています。'
      - kind: theme-unsupported-spec
        when: '`theme` が、`git+https` の URL でも `file:` のパスでもありません。'
      - kind: theme-connection
        when: 'テーマのリポジトリに接続できません。'
      - kind: theme-auth
        when: 'テーマのリポジトリが、認証情報を受け付けません。'
      - kind: theme-tag
        when: 'テーマの tag が、リポジトリにありません。'
      - kind: theme-install
        when: 'pnpm でのテーマの依存のインストールに失敗しました。'
      - kind: theme-unknown
        when: 'テーマの取得が、上のどれにも当てはまらない理由で失敗しました。'
      - kind: theme-unlinked
        when: 'talk-dir のテーマが `node_modules` に張られていないか、`package.json` を読めません。`detail` が、直すための `slide_sync` の呼び出しを示します。'
      - kind: unknown
        when: '上のどのエラーにも当てはまらない理由で失敗しました。'
    on_error: default
    effects:
      - target: file
        kind: destructive
        what: '移行前の talk-dir を移すときに、テンプレートから来たファイルを消します。作業の領域は残します。'
      - target: file
        kind: destructive
        what: '`dir` の `package.json`・`slides.md`・`vite.config.ts`・`start.mjs` と、`node_modules` のリンクを書き直します。取得したテーマは、`<data-dir>/themes` の下に置きます。'
      - target: process
        kind: write
        what: 'テーマをまだ取得していないときは、git と pnpm を動かして、ネットワークから取得します。'
      - target: process
        kind: read
        what: '`lint` のために、デッキに eslint を動かします。'
    prerequisites:
      - '実行時依存が要ります。入っていなければ、先に `runtime_setup` を呼びます。'
      - '`dir` の `slide_dev` が起動中なら、先に止めます。'
    idempotent: true
    examples:
      - arguments:
          dir: '/work/talk'
          theme: 'git+https://github.com/example/slidev-theme.git#v1.0.0'
        note: '移行前の talk-dir を、テーマを参照する形へ移します。'
      - arguments:
          dir: '/work/talk'
          node_modules_only: true
        note: '`node_modules` だけを張り直します。'
    default_notes: {}
    behaviors:
      - id: PV-SLIDE-SYNC-01
        pattern: event
        statement: '移行前の talk-dir に `theme` を渡して呼ぶと、テンプレートから来たファイルを消してテーマを参照する形へ移し、消した名前を `migration.removed` に載せます'
      - id: PV-SLIDE-SYNC-02
        pattern: event
        statement: '移行前の talk-dir を移すと、`slides.md`・`pages/*.md`・`public/slides/` を残します'
      - id: PV-SLIDE-SYNC-03
        pattern: event
        statement: '移行済みの talk-dir を渡して呼ぶと、`package.json` の依存の版でテーマを取得し、`node_modules` を張り直します'
      - id: PV-SLIDE-SYNC-04
        pattern: event
        statement: '移行済みの talk-dir を渡して呼ぶと、`vite.config.ts` と `start.mjs` をプラグインの今の内容にそろえます'
      - id: PV-SLIDE-SYNC-05
        pattern: event
        statement: '`node_modules_only` を `true` にして呼ぶと、`node_modules` の張り直しと、生成ファイルをそろえることだけを行います'
      - id: PV-SLIDE-SYNC-06
        pattern: event
        statement: '呼ぶと、そろえた後のデッキ全体の lint の結果を `lint` に載せます'
      - id: PV-SLIDE-SYNC-07
        pattern: unwanted
        statement: 'もし移行前の talk-dir に `theme` を渡さないなら、何も変えずに `theme-required` の失敗を返します'
      - id: PV-SLIDE-SYNC-08
        pattern: unwanted
        statement: 'もし `theme` と `node_modules_only` を同時に渡したなら、何も変えずに `theme-with-node-modules-only` の失敗を返します'
      - id: PV-SLIDE-SYNC-09
        pattern: unwanted
        statement: 'もし実行時依存が未導入なら、何も変えずに `runtime-dependencies-not-installed` の失敗を返し、`detail` で `runtime_setup` の呼び出しを案内します'
