      - id: PV-SLIDE-DEV-01
        pattern: event
        statement: '`dir` を渡して呼ぶと、dev サーバを起動し、URL とポートを `url` と `port` に載せた成功の応答を返します'
      - id: PV-SLIDE-DEV-02
        pattern: event
        statement: '起動中の talk-dir に同じ呼び出しをすると、起動中のサーバをそのまま返し、`reused` を `true` にします'
      - id: PV-SLIDE-DEV-03
