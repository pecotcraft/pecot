# Layout Reference: annotated-diagram
# 規則テスト用の汎用レイアウトの宣言

layout: annotated-diagram
description: 図に印を付けて手順を解説する。
category: figure
includes:
  - _common
  - _header
  - _footer
props:
  diagramContent:
    type: Object
    default: "null"
    description: 既定の図
    props:
      xmlSrc:
        type: String
        default: "''"
        description: draw.io のパス
  steps:
    type: Array
    default: "[]"
    description: ステップの配列
    items:
      point1:
        type: String
        default: "''"
        description: 要所の見出し
      diagram:
        type: Object
        default: "null"
        description: このステップの図
        props:
          xmlSrc:
            type: String
            default: "''"
            description: draw.io のパス
      marker:
        type: Object
        default: "null"
        description: 印の位置
        props:
          cell:
            type: String
            default: "''"
            description: 印を付けるセルの ID
text_constraints: {}
clicks:
  supported: true
  recommended_pattern: clicks は steps の件数
  validation:
    type: count
    source_prop: steps
best_practices:
  - 見本の構成パターンを雛形にする
anti_patterns:
  - 宣言に無いキーを足さない
examples:
  - name: 1 ステップ
    frontmatter: |
      ---
      layout: annotated-diagram
      diagramContent:
        xmlSrc: "/assets/diagrams/order-api.drawio"
      steps:
        - point1: "受付"
          marker: { cell: api-gateway }
      ---
