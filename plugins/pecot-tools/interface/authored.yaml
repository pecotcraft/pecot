format: 1
plugin: pecot-tools
prose: ja
environment:
  - name: CLAUDE_PLUGIN_ROOT
    effect: 'プラグインのディレクトリです。サーバは、報告する版をここから読みます。'
  - name: AWS_PROFILE
    effect: 'ツールの呼び出しが `profile` を渡さないときに使う、awscli のプロファイルです。awscli が読みます。'
  - name: AWS_REGION
    effect: 'ツールの呼び出しが `region` を渡さないときに使うリージョンです。awscli が読みます。'
  - name: AWS_DEFAULT_REGION
    effect: '`region` を渡さず、`AWS_REGION` も無いときに使うリージョンです。awscli が読みます。'
  - name: AWS_CONFIG_FILE
    effect: 'プロファイルを書いた awscli の設定ファイルの場所を変えます。awscli が読みます。'
  - name: AWS_SHARED_CREDENTIALS_FILE
    effect: 'awscli の認証情報ファイルの場所を変えます。awscli が読みます。'
  - name: PATH
    effect: 'サーバが awscli の実行ファイルを探す場所です。awscli が無いと、`awscli-missing` の失敗になります。'
entries:
  PT-AWS-ATHENA-GET-QUERY-EXECUTION:
    summary: Athena のクエリの実行 1 件の状態と統計を返します。
    arguments:
      profile: AWS のプロファイルの名前です。
      query_execution_id: '`aws_athena_start_query_execution` が返した ID です。'
      region: 'AWS のリージョンです（例: `ap-northeast-1`）。'
    constraints: []
    details:
      - 'クエリの実行 1 件の状態（`QUEUED`・`RUNNING`・`SUCCEEDED`・`FAILED`・`CANCELLED` のどれか）と統計を返します。'
    stdin: none
    output:
      format: json
      description: 結果は JSON のオブジェクトです。
      fields:
        artifacts: 書き出したローカルのファイルの絶対パスです。
        kind: 失敗の種別です。成功したときは、この項目はありません。
        data: awscli の JSON 出力か、出力の行の配列です。
        exitCode: 成功は 0、実行前の拒否は 2、時間切れは 124、awscli が無いときは 127 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 秘匿化した awscli の標準エラー出力です。失敗したときだけあります。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          kind:
            description: Failure kind (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '入力が、書式か排他の規則に反しています。awscli を動かす前に確かめ、このときの `exitCode` は 2 です。awscli が引数を受け付けなかったときも、この種別になります。'
      - kind: awscli-missing
        code: 127
        when: 'awscli が入っていないか、`PATH` にないか、2.22 より古い版です。'
      - kind: auth-missing
        when: プロファイルの認証情報も SSO の設定も見つかりません。
      - kind: auth-expired
        when: SSO のセッションか認証情報の期限が切れています。
      - kind: permission-denied
        when: プロファイルに、その操作の権限がありません。
      - kind: resource-not-found
        when: awscli が、対象のリソースが無いと返しました。
      - kind: timeout
        code: 124
        when: awscli が 120 秒以内に終わりません。
      - kind: other
        when: 'awscli が、上のどれにも当てはまらない理由で失敗しました。`exitCode` は、awscli の終了コードです。'
    on_error: default
    effects:
      - target: aws
        kind: read
        what: '`athena get-query-execution` を呼びます。'
    prerequisites:
      - '`PATH` にある awscli v2（2.22 以降）が要ります。'
      - '対象のプロファイルの認証情報が要ります。SSO のプロファイルでは、先に `aws_sso_login` を呼びます。'
    idempotent: true
    examples:
      - run: 'aws_athena_get_query_execution {"query_execution_id": "11111111-2222-3333-4444-555555555555"}'
        note: クエリが終わったかどうかを確かめます。
    default_notes:
      profile: '省くと、awscli の決め方に従います。`AWS_PROFILE`、既定のプロファイルの順で決まります。'
      region: '省くと、`AWS_REGION`、`AWS_DEFAULT_REGION`、プロファイルの設定の順で決まります。'
    behaviors:
      - id: PT-AWS-ATHENA-GET-QUERY-EXECUTION-01
        pattern: event
        statement: '`query_execution_id` を渡して呼ぶと、awscli の `athena get-query-execution` を実行し、JSON 出力を `data` に載せた成功の応答を返します'
  PT-AWS-ATHENA-GET-QUERY-RESULTS:
    summary: 終わった Athena のクエリの結果の行を返します。
    arguments:
      max_items: 1 回の応答で返す項目の数の上限です。
      profile: AWS のプロファイルの名前です。
      query_execution_id: '`aws_athena_start_query_execution` が返した ID です。'
      region: 'AWS のリージョンです（例: `ap-northeast-1`）。'
      starting_token: '前の応答の `nextToken` です。渡すと、次のページを取得します。'
    constraints: []
    details:
      - 終わったクエリの結果の行を、1 回の呼び出しで 1 ページずつ返します。
    stdin: none
    output:
      format: json
      description: 結果は JSON のオブジェクトです。
      fields:
        artifacts: 書き出したローカルのファイルの絶対パスです。
        kind: 失敗の種別です。成功したときは、この項目はありません。
        data: awscli の JSON 出力か、出力の行の配列です。
        exitCode: 成功は 0、実行前の拒否は 2、時間切れは 124、awscli が無いときは 127 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 秘匿化した awscli の標準エラー出力です。失敗したときだけあります。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          kind:
            description: Failure kind (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '入力が、書式か排他の規則に反しています。awscli を動かす前に確かめ、このときの `exitCode` は 2 です。awscli が引数を受け付けなかったときも、この種別になります。'
      - kind: awscli-missing
        code: 127
        when: 'awscli が入っていないか、`PATH` にないか、2.22 より古い版です。'
      - kind: auth-missing
        when: プロファイルの認証情報も SSO の設定も見つかりません。
      - kind: auth-expired
        when: SSO のセッションか認証情報の期限が切れています。
      - kind: permission-denied
        when: プロファイルに、その操作の権限がありません。
      - kind: resource-not-found
        when: awscli が、対象のリソースが無いと返しました。
      - kind: timeout
        code: 124
        when: awscli が 120 秒以内に終わりません。
      - kind: other
        when: 'awscli が、上のどれにも当てはまらない理由で失敗しました。`exitCode` は、awscli の終了コードです。'
    on_error: default
    effects:
      - target: aws
        kind: read
        what: '`athena get-query-results` を呼びます。'
    prerequisites:
      - '`PATH` にある awscli v2（2.22 以降）が要ります。'
      - '対象のプロファイルの認証情報が要ります。SSO のプロファイルでは、先に `aws_sso_login` を呼びます。'
    idempotent: true
    examples:
      - run: 'aws_athena_get_query_results {"query_execution_id": "11111111-2222-3333-4444-555555555555", "max_items": 100}'
        note: 最初の 100 行を取得します。
    default_notes:
      profile: '省くと、awscli の決め方に従います。`AWS_PROFILE`、既定のプロファイルの順で決まります。'
      region: '省くと、`AWS_REGION`、`AWS_DEFAULT_REGION`、プロファイルの設定の順で決まります。'
    behaviors:
      - id: PT-AWS-ATHENA-GET-QUERY-RESULTS-01
        pattern: event
        statement: '`query_execution_id` を渡して呼ぶと、awscli の `athena get-query-results` を実行し、JSON 出力を `data` に載せた成功の応答を返します'
      - id: PT-AWS-ATHENA-GET-QUERY-RESULTS-02
        pattern: event
        statement: '応答に `NextToken` が含まれると、その値を `data.nextToken` に載せます'
  PT-AWS-ATHENA-START-QUERY-EXECUTION:
    summary: 参照専用の Athena のクエリを 1 つ始めます。
    arguments:
      catalog: 'データカタログの名前です。`database` と一緒に渡します。`catalog` だけでは渡せません。'
      database: 既定のデータベースの名前です。
      output_location: '結果の出力先です。`s3://` で始めます。'
      profile: AWS のプロファイルの名前です。
      query_string: '実行する参照専用のクエリです。`SELECT`・`WITH`・`SHOW`・`DESCRIBE`・`EXPLAIN` のどれかで始まる文を 1 つだけ渡します。全体を括弧で囲みません。'
      region: 'AWS のリージョンです（例: `ap-northeast-1`）。'
      work_group: ワークグループの名前です。
    constraints:
      - requires:
          catalog:
            - database
    details:
      - '参照専用の Athena のクエリ（`SELECT`・`WITH`・`SHOW`・`DESCRIBE`・`EXPLAIN`）を 1 つ始め、クエリ実行 ID を返します。'
      - データを変えるクエリと、複数の文を含む入力は、awscli を動かす前に拒否します。
      - '終わったかどうかは、`aws_athena_get_query_execution` で確かめます。'
    stdin: none
    output:
      format: json
      description: 結果は JSON のオブジェクトです。
      fields:
        artifacts: 書き出したローカルのファイルの絶対パスです。
        kind: 失敗の種別です。成功したときは、この項目はありません。
        data: awscli の JSON 出力か、出力の行の配列です。
        exitCode: 成功は 0、実行前の拒否は 2、時間切れは 124、awscli が無いときは 127 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 秘匿化した awscli の標準エラー出力です。失敗したときだけあります。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          kind:
            description: Failure kind (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: not-allowed
        code: 2
        when: 入力が、公開している操作の外の操作を求めています。awscli は起動しません。
      - kind: invalid-input
        when: '入力が、書式か排他の規則に反しています。awscli を動かす前に確かめ、このときの `exitCode` は 2 です。awscli が引数を受け付けなかったときも、この種別になります。'
      - kind: awscli-missing
        code: 127
        when: 'awscli が入っていないか、`PATH` にないか、2.22 より古い版です。'
      - kind: auth-missing
        when: プロファイルの認証情報も SSO の設定も見つかりません。
      - kind: auth-expired
        when: SSO のセッションか認証情報の期限が切れています。
      - kind: permission-denied
        when: プロファイルに、その操作の権限がありません。
      - kind: resource-not-found
        when: awscli が、対象のリソースが無いと返しました。
      - kind: timeout
        code: 124
        when: awscli が 120 秒以内に終わりません。
      - kind: other
        when: 'awscli が、上のどれにも当てはまらない理由で失敗しました。`exitCode` は、awscli の終了コードです。'
    on_error: default
    effects:
      - target: aws
        kind: write
        what: '`athena start-query-execution` を呼びます。クエリが始まり、その結果が S3 に書かれます。'
    prerequisites:
      - '`PATH` にある awscli v2（2.22 以降）が要ります。'
      - '対象のプロファイルの認証情報が要ります。SSO のプロファイルでは、先に `aws_sso_login` を呼びます。'
      - 'ワークグループか `output_location` に、クエリの結果の置き場所が要ります。'
    idempotent: false
    examples:
      - run: 'aws_athena_start_query_execution {"query_string": "SELECT 1", "work_group": "primary"}'
        note: '`primary` のワークグループでクエリを始めます。'
    default_notes:
      catalog: 省くと、Athena の決め方に従います。
      database: 省くと、Athena の決め方に従います。
      output_location: 省くと、ワークグループの結果の置き場所の設定に従います。
      profile: '省くと、awscli の決め方に従います。`AWS_PROFILE`、既定のプロファイルの順で決まります。'
      region: '省くと、`AWS_REGION`、`AWS_DEFAULT_REGION`、プロファイルの設定の順で決まります。'
      work_group: 省くと、Athena のワークグループの決め方に従います。
    behaviors:
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-01
        pattern: event
        statement: '参照専用のクエリを渡して呼ぶと、awscli の `athena start-query-execution` を実行し、クエリ実行 ID を含む JSON 出力を `data` に載せて返します'
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-02
        pattern: unwanted
        statement: 'もし `query_string` が参照専用でないなら、awscli を起動せず `not-allowed`・`exitCode` 2 の失敗を返します'
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-03
        pattern: unwanted
        statement: 'もし `query_string` が複数の文を含むなら、awscli を起動せず `not-allowed`・`exitCode` 2 の失敗を返します'
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-04
        pattern: unwanted
        statement: 'もし `catalog` を `database` なしで渡したなら、awscli を起動せず `invalid-input`・`exitCode` 2 の失敗を返します'
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-05
        pattern: unwanted
        statement: 'もし `database`・`catalog`・`output_location` に `,` `=` `{` `}` を含むなら、awscli を起動せず `invalid-input`・`exitCode` 2 の失敗を返します'
  PT-AWS-CLOUDWATCH-GET-METRIC-STATISTICS:
    summary: CloudWatch のメトリクス 1 つのデータポイントを返します。
    arguments:
      dimensions: 絞り込むディメンションです。メトリクスが持つ組み合わせと、ちょうど同じ組み合わせを渡します。
      end_time: '終了時刻です。タイムゾーンを付けた ISO 8601 の形式（`Z` か `+09:00` の形）で、`start_time` と同じように渡します。'
      metric_name: 'メトリクスの名前です（例: `NumberOfMessagesSent`）。'
      namespace: 'メトリクスの名前空間です（例: `AWS/SQS`、`AWS/Lambda`）。'
      period: 集計する間隔の秒数です。60 の倍数で渡します。
      profile: AWS のプロファイルの名前です。
      region: 'AWS のリージョンです（例: `ap-northeast-1`）。'
      start_time: '開始時刻です。タイムゾーンを付けた ISO 8601 の形式（`Z` か `+09:00` の形）で渡します。例は `2026-09-01T00:00:00Z` と `2026-09-01T09:00:00+09:00` です。'
      statistics: 取得する統計です。1〜5 個を渡します。
      unit: 絞り込む単位です。データの単位と合わないと、結果は空になります。
    constraints: []
    details:
      - 'メトリクス 1 つの、ある時間の範囲のデータポイントを返します。データポイントは、求めた統計を `period` ごとに集計した値です。'
      - パーセンタイルの統計は公開していません。
    stdin: none
    output:
      format: json
      description: 結果は JSON のオブジェクトです。
      fields:
        artifacts: 書き出したローカルのファイルの絶対パスです。
        kind: 失敗の種別です。成功したときは、この項目はありません。
        data: awscli の JSON 出力か、出力の行の配列です。
        exitCode: 成功は 0、実行前の拒否は 2、時間切れは 124、awscli が無いときは 127 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 秘匿化した awscli の標準エラー出力です。失敗したときだけあります。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          kind:
            description: Failure kind (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '入力が、書式か排他の規則に反しています。awscli を動かす前に確かめ、このときの `exitCode` は 2 です。awscli が引数を受け付けなかったときも、この種別になります。'
      - kind: awscli-missing
        code: 127
        when: 'awscli が入っていないか、`PATH` にないか、2.22 より古い版です。'
      - kind: auth-missing
        when: プロファイルの認証情報も SSO の設定も見つかりません。
      - kind: auth-expired
        when: SSO のセッションか認証情報の期限が切れています。
      - kind: permission-denied
        when: プロファイルに、その操作の権限がありません。
      - kind: resource-not-found
        when: awscli が、対象のリソースが無いと返しました。
      - kind: timeout
        code: 124
        when: awscli が 120 秒以内に終わりません。
      - kind: other
        when: 'awscli が、上のどれにも当てはまらない理由で失敗しました。`exitCode` は、awscli の終了コードです。'
    on_error: default
    effects:
      - target: aws
        kind: read
        what: '`cloudwatch get-metric-statistics` を呼びます。'
    prerequisites:
      - '`PATH` にある awscli v2（2.22 以降）が要ります。'
      - '対象のプロファイルの認証情報が要ります。SSO のプロファイルでは、先に `aws_sso_login` を呼びます。'
    idempotent: true
    examples:
      - run: 'aws_cloudwatch_get_metric_statistics {"namespace": "AWS/SQS", "metric_name": "NumberOfMessagesSent", "dimensions": [{"name": "QueueName", "value": "my-queue"}], "start_time": "2026-09-01T00:00:00Z", "end_time": "2026-09-01T01:00:00Z", "period": 300, "statistics": ["Sum"]}'
        note: キューに送られたメッセージの数を、5 分ごとの合計で取得します。
