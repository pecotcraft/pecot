format: 1
plugin: pecot-tools
environment:
  - name: CLAUDE_PLUGIN_ROOT
    effect: Locates the plugin directory from which the server reads the version it reports.
  - name: AWS_PROFILE
    effect: Selects the awscli profile when a tool call gives no profile; read by awscli.
  - name: AWS_REGION
    effect: Selects the region when a tool call gives no region; read by awscli.
  - name: AWS_DEFAULT_REGION
    effect: Selects the region when neither a region input nor AWS_REGION is set; read by awscli.
  - name: AWS_CONFIG_FILE
    effect: Moves the awscli config file that holds the profiles; read by awscli.
  - name: AWS_SHARED_CREDENTIALS_FILE
    effect: Moves the awscli credentials file; read by awscli.
  - name: PATH
    effect: Decides where the server looks for the awscli executable; a missing awscli yields awscli-missing.
entries:
  PT-AWS-ATHENA-GET-QUERY-EXECUTION:
    constraints: []
    details:
      - Returns the state (QUEUED, RUNNING, SUCCEEDED, FAILED or CANCELLED) and statistics of one query execution.
    stdin: none
    output:
      format: json
      description: Structured result with ok, exitCode, data, artifacts and message, plus category and stderr on failure.
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          category:
            description: Failure category (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: An input breaks a format or exclusivity rule checked before awscli runs (exitCode 2), or awscli rejects its arguments.
      - kind: awscli-missing
        when: awscli is not installed or not on PATH (exitCode 127).
      - kind: auth-missing
        when: No credentials or SSO configuration can be found for the profile.
      - kind: auth-expired
        when: The SSO session or the credentials have expired.
      - kind: permission-denied
        when: The profile lacks permission for the operation.
      - kind: resource-not-found
        when: The named resource does not exist in the region.
      - kind: timeout
        when: awscli does not finish within 120 seconds (exitCode 124).
      - kind: other
        when: awscli fails for any other reason; the awscli exit code is returned.
    on_error: default
    effects:
      - target: aws
        kind: read
        what: Calls athena get-query-execution.
    prerequisites:
      - awscli v2 (2.22 or later) is on PATH.
      - Credentials for the target profile are available (run aws_sso_login for an SSO profile).
    idempotent: true
    examples:
      - run: 'aws_athena_get_query_execution {"query_execution_id": "11111111-2222-3333-4444-555555555555"}'
        note: Check whether a query finished.
    default_notes:
      profile: "Resolved by awscli: the default profile resolution (AWS_PROFILE, then the default profile)."
      region: "Resolved by awscli: AWS_REGION or AWS_DEFAULT_REGION, then the profile configuration."
    behaviors:
      - id: PT-AWS-ATHENA-GET-QUERY-EXECUTION-01
        pattern: event
        statement: query_execution_id を渡して呼ぶと、awscli の athena get-query-execution を実行し、JSON 出力を data に載せた成功の応答を返す
  PT-AWS-ATHENA-GET-QUERY-RESULTS:
    constraints: []
    details:
      - Returns the result rows of a completed query, one page per call.
    stdin: none
    output:
      format: json
      description: Structured result with ok, exitCode, data, artifacts and message, plus category and stderr on failure.
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          category:
            description: Failure category (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: An input breaks a format or exclusivity rule checked before awscli runs (exitCode 2), or awscli rejects its arguments.
      - kind: awscli-missing
        when: awscli is not installed or not on PATH (exitCode 127).
      - kind: auth-missing
        when: No credentials or SSO configuration can be found for the profile.
      - kind: auth-expired
        when: The SSO session or the credentials have expired.
      - kind: permission-denied
        when: The profile lacks permission for the operation.
      - kind: resource-not-found
        when: The named resource does not exist in the region.
      - kind: timeout
        when: awscli does not finish within 120 seconds (exitCode 124).
      - kind: other
        when: awscli fails for any other reason; the awscli exit code is returned.
    on_error: default
    effects:
      - target: aws
        kind: read
        what: Calls athena get-query-results.
    prerequisites:
      - awscli v2 (2.22 or later) is on PATH.
      - Credentials for the target profile are available (run aws_sso_login for an SSO profile).
    idempotent: true
    examples:
      - run: 'aws_athena_get_query_results {"query_execution_id": "11111111-2222-3333-4444-555555555555", "max_items": 100}'
        note: Get the first 100 rows.
    default_notes:
      profile: "Resolved by awscli: the default profile resolution (AWS_PROFILE, then the default profile)."
      region: "Resolved by awscli: AWS_REGION or AWS_DEFAULT_REGION, then the profile configuration."
    behaviors:
      - id: PT-AWS-ATHENA-GET-QUERY-RESULTS-01
        pattern: event
        statement: query_execution_id を渡して呼ぶと、awscli の athena get-query-results を実行し、JSON 出力を data に載せた成功の応答を返す
      - id: PT-AWS-ATHENA-GET-QUERY-RESULTS-02
        pattern: event
        statement: 応答に NextToken が含まれると、その値を data.nextToken に載せる
  PT-AWS-ATHENA-START-QUERY-EXECUTION:
    constraints:
      - requires:
          catalog:
            - database
    details:
      - Starts one read-only Athena query (SELECT, WITH, SHOW, DESCRIBE or EXPLAIN) and returns its query execution ID.
      - Queries that change data and inputs with several statements are rejected before awscli runs.
      - Completion is checked with aws_athena_get_query_execution.
    stdin: none
    output:
      format: json
      description: Structured result with ok, exitCode, data, artifacts and message, plus category and stderr on failure.
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          category:
            description: Failure category (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: not-allowed
        when: The input asks for an operation outside the exposed ones (exitCode 2); awscli is not started.
      - kind: invalid-input
        when: An input breaks a format or exclusivity rule checked before awscli runs (exitCode 2), or awscli rejects its arguments.
      - kind: awscli-missing
        when: awscli is not installed or not on PATH (exitCode 127).
      - kind: auth-missing
        when: No credentials or SSO configuration can be found for the profile.
      - kind: auth-expired
        when: The SSO session or the credentials have expired.
      - kind: permission-denied
        when: The profile lacks permission for the operation.
      - kind: timeout
        when: awscli does not finish within 120 seconds (exitCode 124).
      - kind: other
        when: awscli fails for any other reason; the awscli exit code is returned.
    on_error: default
    effects:
      - target: aws
        kind: write
        what: Calls athena start-query-execution, which starts the query and writes its result to S3.
    prerequisites:
      - awscli v2 (2.22 or later) is on PATH.
      - Credentials for the target profile are available (run aws_sso_login for an SSO profile).
      - The workgroup or output_location has a query result location.
    idempotent: false
    examples:
      - run: 'aws_athena_start_query_execution {"query_string": "SELECT 1", "work_group": "primary"}'
        note: Start a query in the primary workgroup.
    default_notes:
      catalog: "Resolved by Athena: the default resolution of Athena applies when omitted."
      database: "Resolved by Athena: the default resolution of Athena applies when omitted."
      output_location: "Resolved by Athena: the result location setting of the workgroup applies when omitted."
      profile: "Resolved by awscli: the default profile resolution (AWS_PROFILE, then the default profile)."
      region: "Resolved by awscli: AWS_REGION or AWS_DEFAULT_REGION, then the profile configuration."
      work_group: "Resolved by Athena: the default workgroup resolution applies when omitted."
    behaviors:
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-01
        pattern: event
        statement: 参照専用のクエリを渡して呼ぶと、awscli の athena start-query-execution を実行し、クエリ実行 ID を含む JSON 出力を data に載せて返す
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-02
        pattern: unwanted
        statement: もし query_string が参照専用でないなら、awscli を起動せず not-allowed・exitCode 2 の失敗を返す
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-03
        pattern: unwanted
        statement: もし query_string が複数の文を含むなら、awscli を起動せず not-allowed・exitCode 2 の失敗を返す
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-04
        pattern: unwanted
        statement: もし catalog を database なしで渡したなら、awscli を起動せず invalid-input・exitCode 2 の失敗を返す
      - id: PT-AWS-ATHENA-START-QUERY-EXECUTION-05
        pattern: unwanted
        statement: もし database・catalog・output_location に , = { } を含むなら、awscli を起動せず invalid-input・exitCode 2 の失敗を返す
  PT-AWS-CLOUDWATCH-GET-METRIC-STATISTICS:
