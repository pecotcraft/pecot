common_behaviors:
  - id: PT-COMMON-01
    pattern: unwanted
    statement: もし宣言した型・書式・範囲・列挙・必須の規則に反する入力を渡したなら、awscli を起動せずに入力検証エラーを返す
  - id: PT-COMMON-02
    pattern: event
    statement: 最上位に宣言外のキーを渡すと、そのキーを無視して通常どおり実行する
  - id: PT-COMMON-03
    pattern: unwanted
    statement: もし配列の要素に宣言外のキーがあるなら、awscli を起動せずに入力検証エラーを返す
  - id: PT-COMMON-04
    pattern: unwanted
    statement: もし公開していないツール名で呼ばれたなら、awscli を起動せずに JSON-RPC エラー -32602 を返す
  - id: PT-COMMON-05
    pattern: unwanted
    statement: もし位置引数または配列の要素の値が - で始まるなら、awscli を起動せず invalid-input・exitCode 2 の失敗を返す
  - id: PT-COMMON-06
    pattern: unwanted
    statement: もし値に制御文字が含まれるなら、awscli を起動せず invalid-input・exitCode 2 の失敗を返す
  - id: PT-COMMON-07
    pattern: unwanted
    statement: もし awscli が見つからないなら、category awscli-missing・exitCode 127 の失敗を返す
  - id: PT-COMMON-08
    pattern: unwanted
    statement: もし awscli が 120 秒以内に終わらないなら、category timeout・exitCode 124 の失敗を返す
  - id: PT-COMMON-09
    pattern: unwanted
    statement: もし awscli が 0 以外の終了コードで終わったなら、ok が false で、失敗の種別 category と秘匿化済みの stderr を含む応答を isError を真にして返す
  - id: PT-COMMON-10
    pattern: ubiquitous
    statement: 常に、応答の structuredContent と同じ内容の JSON を content のテキストにも載せる
  - id: PT-COMMON-11
    pattern: unwanted
    statement: もし awscli の出力が 256 KiB を超えたなら、先頭の 256 KiB を data.output に載せ、data.truncated を true にする
  - id: PT-COMMON-12
    pattern: ubiquitous
    statement: 常に、応答に載せる awscli の出力のアクセスキー ID・シークレットアクセスキー・セッショントークンを [redacted] に置き換える
  - id: PT-COMMON-13
    pattern: event
    statement: ツールの呼び出しが失敗した後に次の呼び出しが来ると、同じ接続でその呼び出しに応える
