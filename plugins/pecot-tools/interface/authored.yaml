    stdin: none
    output:
      format: json
      description: 結果は JSON のオブジェクトです。
      fields:
        artifacts: 書き出したローカルのファイルの絶対パスです。
        kind: 失敗の種別です。成功したときは、この項目はありません。
        data: awscli の JSON 出力か、出力の行の配列です。
        exitCode: 成功は 0、実行前の拒否は 2、時間切れは 124、awscli が無いときは 127 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 秘匿化した awscli の標準エラー出力です。失敗したときだけあります。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          kind:
            description: Failure kind (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '入力が、書式か排他の規則に反しています。awscli を動かす前に確かめ、このときの `exitCode` は 2 です。awscli が引数を受け付けなかったときも、この種別になります。'
      - kind: awscli-missing
        code: 127
        when: 'awscli が入っていないか、`PATH` にないか、2.22 より古い版です。'
      - kind: auth-missing
        when: プロファイルの認証情報も SSO の設定も見つかりません。
      - kind: auth-expired
        when: SSO のセッションか認証情報の期限が切れています。
      - kind: permission-denied
        when: プロファイルに、その操作の権限がありません。
      - kind: resource-not-found
        when: awscli が、対象のリソースが無いと返しました。
      - kind: timeout
        code: 124
        when: awscli が 120 秒以内に終わりません。
      - kind: other
        when: 'awscli が、上のどれにも当てはまらない理由で失敗しました。`exitCode` は、awscli の終了コードです。'
