  PT-AWS-SSO-LOGIN:
    constraints: []
    details:
      - Starts AWS SSO device authorization for the profile and returns the verification URL and user code without waiting for approval.
      - Calling it again for a profile whose authorization is still pending returns the same URL and code.
      - Completion is checked with aws_sso_login_status.
    stdin: none
    output:
      format: json
      description: Structured result with ok, exitCode, data, artifacts and message, plus category and stderr on failure.
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          category:
            description: Failure category (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: awscli-missing
        when: awscli is not installed or not on PATH (exitCode 127).
      - kind: auth-missing
        when: No credentials or SSO configuration can be found for the profile.
      - kind: auth-expired
        when: The SSO session or the credentials have expired.
      - kind: permission-denied
        when: The profile lacks permission for the operation.
      - kind: resource-not-found
        when: The named resource does not exist in the region.
      - kind: timeout
        when: awscli does not finish within 120 seconds (exitCode 124).
      - kind: other
        when: awscli fails for any other reason; the awscli exit code is returned.
    on_error: A started authorization stays pending until it completes, fails, or times out after 10 minutes. A failed or timed-out authorization is reported by aws_sso_login_status.
    effects:
      - target: process
        kind: write
        what: Starts `aws sso login --no-browser --use-device-code` in the background.
      - target: file
        kind: write
        what: Writes the SSO token cache of awscli after the user approves.
    prerequisites:
      - awscli v2 (2.22 or later) is on PATH.
      - The profile has SSO settings (sso_start_url and sso_region).
    idempotent: false
    examples:
      - run: 'aws_sso_login {"profile": "dev"}'
        note: Start device authorization for the dev profile.
    default_notes:
      profile: "Resolved by awscli: the default profile resolution (AWS_PROFILE, then the default profile)."
    behaviors:
      - id: PT-AWS-SSO-LOGIN-01
        pattern: event
        statement: デバイス認可を開始できると、確認用の URL とユーザーコードを data に載せ、state が pending の応答を承認の完了を待たずに返す
      - id: PT-AWS-SSO-LOGIN-02
        pattern: state
        statement: 同じ profile の認可が pending の間、新しい認可を始めず、既存の URL とコードを返す
      - id: PT-AWS-SSO-LOGIN-03
        pattern: unwanted
        statement: もし awscli が 2.22 未満なら、認可を始めずに category awscli-missing・exitCode 127 の失敗を返す
      - id: PT-AWS-SSO-LOGIN-04
        pattern: unwanted
        statement: もし profile に SSO 設定が無いなら、category auth-missing の失敗を返す
      - id: PT-AWS-SSO-LOGIN-05
        pattern: unwanted
        statement: もし profile の認証が開始前から有効なら、state が completed の応答を返す
