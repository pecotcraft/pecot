  PT-AWS-S3-LS:
    summary: S3 のバケットかプレフィックスの直下を一覧にします。
    arguments:
      profile: AWS のプロファイルの名前です。
      region: 'AWS のリージョンです（例: `ap-northeast-1`）。'
      s3_uri: '一覧にする対象です（`s3://bucket` か `s3://bucket/prefix/`）。省くと、バケットを一覧にします。'
    constraints: []
    details:
      - 'S3 のバケットかプレフィックスの直下の項目を一覧にします。`s3_uri` を省くと、バケットを一覧にします。'
      - 'このコマンドは JSON を出しません。出力は、1 行を 1 要素にして `data.lines` へ入れます。'
    stdin: none
    output:
      format: json
      description: '結果は JSON のオブジェクトです。awscli が出した行は、`data.lines` に並びます。'
      fields:
        artifacts: 書き出したローカルのファイルの絶対パスです。
        kind: 失敗の種別です。成功したときは、この項目はありません。
        data: 'awscli が出した行の配列（`lines`）です。'
        exitCode: 成功は 0、実行前の拒否は 2、時間切れは 124、awscli が無いときは 127 です。
        message: 結果を 1 行にまとめた文です。
        ok: '成功なら `true`、失敗なら `false` です。'
        stderr: 秘匿化した awscli の標準エラー出力です。失敗したときだけあります。
      schema:
        additionalProperties: false
        properties:
          artifacts:
            description: Absolute paths of the local files written
            items:
              type: string
            type: array
          kind:
            description: Failure kind (omitted on success)
            type: string
          data:
            additionalProperties: {}
            description: awscli JSON output, or an array of lines
            propertyNames:
              type: string
            type: object
          exitCode:
            description: Exit code (0 = success, 2 = rejected before running, 124 = timeout, 127 = not installed)
            type: number
          message:
            description: One-line summary for the calling agent
            type: string
          ok:
            description: Whether the awscli run succeeded
            type: boolean
          stderr:
            description: Redacted awscli stderr (only on failure)
            type: string
        required:
          - ok
          - exitCode
          - data
          - artifacts
          - message
        type: object
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '入力が、書式か排他の規則に反しています。awscli を動かす前に確かめ、このときの `exitCode` は 2 です。awscli が引数を受け付けなかったときも、この種別になります。'
      - kind: awscli-missing
        code: 127
        when: 'awscli が入っていないか、`PATH` にないか、2.22 より古い版です。'
      - kind: auth-missing
        when: プロファイルの認証情報も SSO の設定も見つかりません。
      - kind: auth-expired
        when: SSO のセッションか認証情報の期限が切れています。
      - kind: permission-denied
        when: プロファイルに、その操作の権限がありません。
      - kind: resource-not-found
        when: 'バケットがありません（`NoSuchBucket`）。'
      - kind: timeout
        code: 124
        when: awscli が 120 秒以内に終わりません。
      - kind: other
        when: 'awscli が、上のどれにも当てはまらない理由で失敗しました。`exitCode` は、awscli の終了コードです。'
    on_error: default
    effects:
      - target: aws
        kind: read
        what: '`s3 ls` を呼びます。'
    prerequisites:
      - '`PATH` にある awscli v2（2.22 以降）が要ります。'
      - '対象のプロファイルの認証情報が要ります。SSO のプロファイルでは、先に `aws_sso_login` を呼びます。'
    idempotent: true
    examples:
      - run: 'aws_s3_ls {"s3_uri": "s3://my-bucket/logs/"}'
        note: プレフィックスの下の項目を一覧にします。
    default_notes:
      profile: '省くと、awscli の決め方に従います。`AWS_PROFILE`、既定のプロファイルの順で決まります。'
      region: '省くと、`AWS_REGION`、`AWS_DEFAULT_REGION`、プロファイルの設定の順で決まります。'
