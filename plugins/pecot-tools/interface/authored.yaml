      - kind: auth-expired
        when: The SSO session or the credentials have expired.
      - kind: permission-denied
        when: The profile lacks permission for the operation.
      - kind: resource-not-found
        when: The named resource does not exist in the region.
      - kind: timeout
        when: awscli does not finish within 120 seconds (exitCode 124).
      - kind: other
        when: awscli fails for any other reason; the awscli exit code is returned.
    on_error: default
    effects:
      - target: process
        kind: read
        what: Reads the state of the login that aws_sso_login started and the MCP server holds.
    prerequisites:
      - aws_sso_login was called for the same profile.
    idempotent: true
    examples:
      - run: 'aws_sso_login_status {"profile": "dev"}'
        note: Check whether the dev profile authorization was approved.
    default_notes:
      profile: "Resolved by awscli: the default profile resolution (AWS_PROFILE, then the default profile)."
    behaviors:
      - id: PT-AWS-SSO-LOGIN-STATUS-01
        pattern: event
        statement: 承認が済んでから呼ぶと、state が completed の応答を返す
      - id: PT-AWS-SSO-LOGIN-STATUS-02
        pattern: state
        statement: 承認を待っている間、state が pending で、承認前であることを示す応答を返す
      - id: PT-AWS-SSO-LOGIN-STATUS-03
        pattern: unwanted
        statement: もし aws_sso_login で認可を開始していないなら、awscli を起動せず invalid-input・exitCode 2 の失敗を返す
      - id: PT-AWS-SSO-LOGIN-STATUS-04
        pattern: unwanted
        statement: もし認可が失敗していたなら、失敗の種別と awscli の出力を含む応答を返す
      - id: PT-AWS-SSO-LOGIN-STATUS-05
        pattern: unwanted
        statement: もし認可が 10 分以内に完了しなかったなら、category timeout・exitCode 124 の失敗を返す
