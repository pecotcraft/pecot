        when: An input breaks a format or exclusivity rule checked before awscli runs (exitCode 2), or awscli rejects its arguments.
      - kind: awscli-missing
        when: awscli is not installed or not on PATH (exitCode 127).
      - kind: auth-missing
        when: No credentials or SSO configuration can be found for the profile.
      - kind: auth-expired
        when: The SSO session or the credentials have expired.
      - kind: permission-denied
        when: The profile lacks permission for the operation.
      - kind: timeout
        when: awscli does not finish within 120 seconds (exitCode 124).
      - kind: other
        when: awscli fails for any other reason; the awscli exit code is returned.
    on_error: default
    effects:
      - target: aws
        kind: read
        what: Calls cloudwatch get-metric-statistics.
    prerequisites:
      - awscli v2 (2.22 or later) is on PATH.
      - Credentials for the target profile are available (run aws_sso_login for an SSO profile).
    idempotent: true
    examples:
      - run: 'aws_cloudwatch_get_metric_statistics {"namespace": "AWS/SQS", "metric_name": "NumberOfMessagesSent", "dimensions": [{"name": "QueueName", "value": "my-queue"}], "start_time": "2026-09-01T00:00:00Z", "end_time": "2026-09-01T01:00:00Z", "period": 300, "statistics": ["Sum"]}'
        note: Get the messages sent to a queue in 5-minute sums.
    default_notes:
      profile: "Resolved by awscli: the default profile resolution (AWS_PROFILE, then the default profile)."
      region: "Resolved by awscli: AWS_REGION or AWS_DEFAULT_REGION, then the profile configuration."
    behaviors:
      - id: PT-AWS-CLOUDWATCH-GET-METRIC-STATISTICS-01
        pattern: event
        statement: 必須の引数を渡して呼ぶと、awscli の cloudwatch get-metric-statistics を実行し、JSON 出力を data に載せた成功の応答を返す
      - id: PT-AWS-CLOUDWATCH-GET-METRIC-STATISTICS-02
        pattern: unwanted
        statement: もし start_time または end_time がタイムゾーンの無い日時なら、awscli を起動せず invalid-input・exitCode 2 の失敗を返す
      - id: PT-AWS-CLOUDWATCH-GET-METRIC-STATISTICS-03
        pattern: unwanted
        statement: もし dimensions の要素に宣言外のキーがあるなら、入力検証エラーを返し、awscli を起動しない
