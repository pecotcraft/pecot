# pnpm 11 以降は .npmrc から pnpm 固有の設定を読まないため、ここに置く (#1217)。
# .npmrc の engine-strict=true は npm を engines "<0.0.0" で止めるための npm 向け設定として残す。
nodeLinker: hoisted
sharedWorkspaceLockfile: true
engineStrict: true
# 公開から 1 日未満の版を採用しない。1440 分はデフォルト値と同じだが、
# 明示すると minimumReleaseAgeStrict がデフォルトで true になる。
# 1 日未満の版は minimumReleaseAgeExclude に自動で足されず、解決が止まる。
minimumReleaseAge: 1440
# 依存の install scripts は従来どおり実行しない。pnpm 11 以降は未宣言のものを
# ERR_PNPM_IGNORED_BUILDS で落とすため、実行しないことを明示する。実行が要るものだけ true にする。
allowBuilds:
  esbuild: false
  unrs-resolver: false

packages:
  - cli
