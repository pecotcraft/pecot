# origin のリポがアクティブなプロジェクトに登録されていない。exit 1。
id: worktree-add-state-not-registered
command:
  path: [worktree, add]
  args:
    - "-D"
    - "."
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "other",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      .pecot/config/worktree-config.json: |
        {
          "version": 3,
          "links": [
            {
              "path": "CLAUDE.local.md",
              "target_repo": "demo",
              "target_path": "CLAUDE.local.md"
            }
          ]
        }
      .pecot/config/.worktreeignore: |
        .pecot/
      CLAUDE.local.md: |
        ローカル向けの指示
github: []
