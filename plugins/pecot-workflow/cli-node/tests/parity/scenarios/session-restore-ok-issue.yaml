# --issue を明示する。main ブランチのまま、指定した Issue のタイトルで復元する。
id: session-restore-ok-issue
command:
  path: [session, restore]
  args:
    - "-D"
    - "."
    - "--issue"
    - "acme/demo/9"
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: "GetIssueSlim"
      variables: {"owner": "acme", "repo": "demo", "number": 9, "commentLimit": 0}
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"number": 9, "state": "OPEN", "title": "明示した Issue", "body": "本文です", "comments": {"totalCount": 0, "nodes": []}, "parent": null, "subIssues": {"nodes": []}, "linkedBranches": {"nodes": []}, "timelineItems": {"nodes": []}}}}}
