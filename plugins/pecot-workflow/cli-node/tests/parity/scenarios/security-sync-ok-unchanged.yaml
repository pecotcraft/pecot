# open の Tracker の表が alert の今の状態と同じ。本文を PATCH しない。
# Tracker の本文は sync の出力と同じ値を、JSON のエスケープで書く。表の行が文の長さの規則に当たるため。
id: security-sync-ok-unchanged
command:
  path: [security, sync]
  args: []
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: "{\n  \"host\": \"ghes.example.com\",\n  \"owner\": \"acme\",\n  \"workflow_suffix\": \"acme\",\n  \"project\": {\n    \"number\": 1,\n    \"id\": \"PVT_1\",\n    \"board_url\": \"https://ghes.example.com/users/acme/projects/1\",\n    \"fields\": {\n      \"workflow\": {\n        \"id\": \"PVTSSF_workflow\",\n        \"options\": {\n          \"backlog\": \"o1\",\n          \"pending\": \"o2\",\n          \"ready\": \"o3\",\n          \"active\": \"o4\",\n          \"in_review\": \"o5\",\n          \"archived\": \"o6\"\n        }\n      },\n      \"priority\": {\n        \"id\": \"PVTSSF_priority\",\n        \"options\": {\n          \"high\": \"p1\",\n          \"medium\": \"p2\",\n          \"low\": \"p3\"\n        }\n      },\n      \"size\": {\n        \"id\": \"PVTSSF_size\",\n        \"options\": {\n          \"xs\": \"s1\",\n          \"s\": \"s2\",\n          \"m\": \"s3\",\n          \"l\": \"s4\"\n        }\n      }\n    }\n  },\n  \"repositories\": [\n    {\n      \"owner\": \"acme\",\n      \"name\": \"demo\",\n      \"develop_branch\": \"develop\",\n      \"release_branch\": \"main\"\n    }\n  ]\n}\n"
      .pecot/config/projects/.active: "ghes.example.com_acme_board_acme.json\n"
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: "GET"
      path: "/repos/acme/demo/dependabot/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 200
      body: [{"number": 7, "html_url": "https://ghes.example.com/acme/demo/security/dependabot/7", "security_vulnerability": {"severity": "high"}, "security_advisory": {"ghsa_id": "GHSA-aaaa-bbbb-cccc"}, "dependency": {"package": {"name": "left-pad"}}}]
  - match:
      method: "GET"
      path: "/repos/acme/demo/code-scanning/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 200
      body: [{"number": 3, "html_url": "https://ghes.example.com/acme/demo/security/code-scanning/3", "rule": {"security_severity_level": "medium"}}]
  - match:
      method: "GET"
      path: "/repos/acme/demo/secret-scanning/alerts"
      query: {"state": "open", "hide_secret": "true", "per_page": "100"}
    respond:
      status: 200
      body: []
  - match:
      method: "GET"
      path: "/repos/acme/demo/issues"
      query: {"state": "all", "labels": "security-alert", "per_page": "100"}
    respond:
      status: 200
      body:
        - number: 20
          title: '[Tracker] security alert — 2026-01-01 から'
          state: open
          body: "<!-- pecot-alert: tracker -->\n\nDependabot\u30fbcode scanning\u30fbsecret scanning \u306e open \u306e alert \u3092\u675f\u306d\u308b Tracker\u3002\n`pecot security sync` \u304c\u6bce\u6642\u3001\u4e0b\u306e\u8868\u3092\u66f8\u304d\u76f4\u3059\u3002\u8868\u306e\u5916\u306e\u6587\u306f\u6b8b\u308b\u3002\nalert \u306e\u4e2d\u8eab\u306f\u516c\u958b\u306e Issue \u306b\u66f8\u304b\u305a\u3001Security \u30bf\u30d6\u3067\u78ba\u304b\u3081\u308b\u3002\n\n\u624b\u9806: [Dependabot](https://ghes.example.com/acme/demo/blob/main/SECURITY.md#alert-dependabot)\u30fb[code scanning](https://ghes.example.com/acme/demo/blob/main/SECURITY.md#alert-code-scanning)\u30fb[secret scanning](https://ghes.example.com/acme/demo/blob/main/SECURITY.md#alert-secret-scanning)\n\u4f8b\u5916\u306e\u898b\u76f4\u3057: [\u624b\u9806](https://ghes.example.com/acme/demo/blob/main/SECURITY.md#alert-exceptions-review)\n<!-- pecot-alert: list-begin -->\n| \u7a2e\u985e | alert | Priority | \u30d1\u30c3\u30b1\u30fc\u30b8 | \u72b6\u614b |\n|---|---|---|---|---|\n| <!-- pecot-alert: dependabot/7 state=open priority=high pkg=left%2Dpad ghsa=GHSA-aaaa-bbbb-cccc --> Dependabot | [#7](https://ghes.example.com/acme/demo/security/dependabot/7) | high | left-pad\uff08GHSA-aaaa-bbbb-cccc\uff09 | \u8981\u5224\u65ad |\n| <!-- pecot-alert: code-scanning/3 state=open priority=medium --> code scanning | [#3](https://ghes.example.com/acme/demo/security/code-scanning/3) | medium |  | \u8981\u5224\u65ad |\n<!-- pecot-alert: list-end -->\n"
          labels:
            - name: security-alert
  - match:
      operation: GetIssueNodeId
    respond:
      status: 200
      body:
        data:
          repository:
            issue: {id: I_kwDO20, title: Tracker}
  - match:
      operation: AddToProject
    respond:
      status: 200
      body:
        data:
          addProjectV2ItemById:
            item: {id: PVTI_20}
  - match:
      operation: GetIssueProjectItems
    times: 2
    respond:
      status: 200
      body:
        data:
          repository:
            issue:
              projectItems:
                nodes:
                  - id: PVTI_20
                    project: {id: PVT_1}
                    fieldValues:
                      nodes: [{field: {id: PVTSSF_workflow}}, {field: {id: PVTSSF_priority}}]
