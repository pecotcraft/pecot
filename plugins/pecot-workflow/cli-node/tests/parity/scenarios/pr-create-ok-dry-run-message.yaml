# -m の dry-run。検証を通り、要約を出して終わる（API を呼ばない）。
id: pr-create-ok-dry-run-message
command:
  path: [pr, create]
  args:
    - "-m"
    - "## Summary — 見本の変更を取り込む\n\n見本の変更を取り込みます。\n\n## Changes\n\nなし\n\n## Verified — 見本の確認を終えた\n\n確認しました。\n\n- 見本の確認 — 通過\n\n## Risks — 残る懸念はない\n\nなし。\n\n- 見本の懸念 — なし\n\nCloses #12\n"
    - "-t"
    - "feat(demo): #12 見本の変更"
    - "-b"
    - "main"
    - "-r"
    - "acme/demo"
    - "--dry-run"
setup:
  repo:
    branch: feat/demo/12
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
          {
            "host": "ghes.example.com",
            "owner": "acme",
            "workflow_suffix": "acme",
            "project": {
              "number": 1,
              "id": "PVT_1",
              "board_url": "https://ghes.example.com/users/acme/projects/1",
              "fields": {
                "workflow": {
                  "id": "PVTSSF_workflow",
                  "options": {
                    "backlog": "o1",
                    "pending": "o2",
                    "ready": "o3",
                    "active": "o4",
                    "in_review": "o5",
                    "archived": "o6"
                  }
                },
                "priority": {
                  "id": "PVTSSF_priority",
                  "options": {
                    "high": "p1",
                    "medium": "p2",
                    "low": "p3"
                  }
                },
                "size": {
                  "id": "PVTSSF_size",
                  "options": {
                    "xs": "s1",
                    "s": "s2",
                    "m": "s3",
                    "l": "s4"
                  }
                }
              }
            },
            "repositories": [
              {
                "owner": "acme",
                "name": "demo",
                "develop_branch": "main"
              }
            ]
          }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github: []
