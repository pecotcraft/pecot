# Python が書いた形の状態ファイル（.pecot-session-title を含む）を読む。手本の golden は session-status-ok。
# アクティブな Issue があり、GetIssueSlim が 200 を返す。フラグの表と Issue の本文を出す。
id: session-status-ok-python-state
command:
  path: [session, status]
  args:
    - "-D"
    - "."
setup:
  repo:
    branch: feat/demo/7
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      .pecot/state/.pecot-active: |
        acme/demo/7
      .pecot/state/.pecot-session-title: |
        #7 見本の Issue
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: "GetIssueSlim"
      variables: {"owner": "acme", "repo": "demo", "number": 7, "commentLimit": 0}
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"number": 7, "state": "OPEN", "title": "見本の Issue", "body": "本文の 1 行目\n本文の 2 行目\n", "comments": {"totalCount": 0, "nodes": []}, "parent": null, "subIssues": {"nodes": []}, "linkedBranches": {"nodes": []}, "timelineItems": {"nodes": []}}}}}
