# release_type が nx のリポ。open の alert 1 件を例外ファイルで通し、open でない alert の例外は表示だけする。
id: release-preflight-ok-nx-excepted
command:
  path: [release, preflight]
  args: []
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main",
              "release_branch": "release",
              "release_type": "nx"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      .github/dependabot-exceptions.json: |
        {
          "exceptions": [
            {"alert": 1, "package": "minimatch", "reason": "parent pins the vulnerable major", "reevaluate": "bump when the parent accepts the fix"},
            {"alert": 3, "package": "glob", "reason": "the vulnerable path is not used", "reevaluate": "bump when the parent accepts the fix"}
          ]
        }
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: "GET"
      path: "/repos/acme/demo/dependabot/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 200
      body: [{"number": 1, "dependency": {"package": {"name": "minimatch"}}, "security_vulnerability": {"severity": "medium"}}]
  - match:
      method: "GET"
      path: "/repos/acme/demo/code-scanning/alerts"
      query: {"state": "open", "ref": "refs/heads/main", "per_page": "100"}
    respond:
      status: 200
      body: []
  - match:
      method: "GET"
      path: "/repos/acme/demo/secret-scanning/alerts"
      query: {"state": "open", "hide_secret": "true", "per_page": "100"}
    respond:
      status: 200
      body: []
