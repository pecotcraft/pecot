# -d 付きでマージする。リモートの head と wip ブランチの削除を試す（wip は 404 で無視）。
id: pr-merge-ok-delete-branch
command:
  path: [pr, merge]
  args:
    - "acme/demo/21"
    - "-d"
    - "--skip-local-cleanup"
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
          {
            "host": "ghes.example.com",
            "owner": "acme",
            "workflow_suffix": "acme",
            "project": {
              "number": 1,
              "id": "PVT_1",
              "board_url": "https://ghes.example.com/users/acme/projects/1",
              "fields": {
                "workflow": {
                  "id": "PVTSSF_workflow",
                  "options": {
                    "backlog": "o1",
                    "pending": "o2",
                    "ready": "o3",
                    "active": "o4",
                    "in_review": "o5",
                    "archived": "o6"
                  }
                },
                "priority": {
                  "id": "PVTSSF_priority",
                  "options": {
                    "high": "p1",
                    "medium": "p2",
                    "low": "p3"
                  }
                },
                "size": {
                  "id": "PVTSSF_size",
                  "options": {
                    "xs": "s1",
                    "s": "s2",
                    "m": "s3",
                    "l": "s4"
                  }
                }
              }
            },
            "repositories": [
              {
                "owner": "acme",
                "name": "demo",
                "develop_branch": "main"
              }
            ]
          }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: "GetPullRequestSlim"
    respond:
      status: 200
      body: {"data": {"repository": {"pullRequest": {"number": 21, "state": "OPEN", "title": "feat(demo): #12 見本の変更", "body": "Closes #12\n", "headRefName": "feat/demo/12", "baseRefName": "main", "isDraft": false, "mergeable": "MERGEABLE", "comments": {"totalCount": 0}, "closingIssuesReferences": {"nodes": [{"number": 12, "title": "見本の Issue"}]}, "reviews": {"nodes": []}}}}}
  - match:
      operation: "GetIssueKind"
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"number": 12, "state": "OPEN", "issueType": null, "subIssues": {"totalCount": 0}}}}}
  - match:
      method: "PUT"
      path: "/repos/acme/demo/pulls/21/merge"
    respond:
      status: 200
      body: {"sha": "abcdef1234567890", "merged": true, "message": "merged"}
  - match:
      method: "PATCH"
      path: "/repos/acme/demo/issues/12"
    respond:
      status: 200
      body: {"number": 12, "state": "closed"}
  - match:
      method: "DELETE"
      path: "/repos/acme/demo/git/refs/heads/feat/demo/12"
    respond:
      status: 204
  - match:
      method: "DELETE"
      path: "/repos/acme/demo/git/refs/heads/wip/feat/demo/12"
    respond:
      status: 404
      body: {"message": "Not Found"}
