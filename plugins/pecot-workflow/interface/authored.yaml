        when: 'git のリポジトリの外で `--repo` を省きました。選んだ remote のリポジトリを GitHub の `owner/repo` として読めないときも含みます。`--repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: not-initialized
