  PW-SESSION-STATUS:
    help:
      details:
        - Shows the current branch, the repository of the origin remote (or of the first remote when there is no origin), the Issue inferred from the branch name and the session flag state.
        - The Issue is inferred from the number at the end of the branch name after the last slash.
        - The branch and the repository of the origin remote, or of the first remote when there is no origin, are read in --directory.
        - The flag file .pecot-active is read from .pecot/state/ of the project root, which is resolved from the working directory of the command, not from --directory.
        - The flag table has one row per flag with the flag name, set or unset, and the content of the file.
        - When .pecot-active holds an Issue reference, an Active Issue section follows with the number, the title and the state of the Issue.
        - The body of the Issue follows in the section when it is not empty.
        - When .pecot-active holds an Issue reference and .pecot/state/.pecot-base names an Issue the work stacks on, a Stack section follows with a base line of the branch, the Issue and its PR (the open PR that is not from a fork, else the latest one, else no PR, or PR unknown when it cannot be read).
        - When the readiness of the active Issue is blocked, the Stack section also has a readiness line.
        - The Stack section uses the config and the client of the Active Issue section and is left out when that section is.
        - The command is a diagnostic, so a value that cannot be read is shown as unknown or none, or left out, and does not fail the command.
        - Nothing is written.
      examples:
        - run: pecot session status -D .
          note: Show the session state of the current repository.
      default_notes: {}
    summary: セッションのフラグの状態、ブランチの情報、推定した Issue を出します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
    constraints: []
    details:
      - '今のブランチ、remote の `origin`（無ければ最初の remote）のリポジトリ、ブランチ名から推定した Issue、セッションのフラグの状態を出します。'
      - 'Issue は、ブランチ名の最後のスラッシュより後ろにある、末尾の番号から推定します。'
      - 'ブランチと、remote の `origin`（無ければ最初の remote）のリポジトリは、`--directory` で読みます。'
      - 'フラグのファイル `.pecot-active` は、プロジェクトのルートの `.pecot/state/` から読みます。プロジェクトのルートは、`--directory` ではなく、コマンドの作業ディレクトリから決めます。'
      - 'フラグの表は、フラグごとに 1 行です。フラグの名前、`set` か `unset`、ファイルの内容を載せます。'
      - '`.pecot-active` に Issue の参照があるときは、Active Issue の節が続きます。Issue の番号・題・状態を載せます。'
      - 'Issue の本文が空でなければ、その節に本文が続きます。'
      - '`.pecot-active` に Issue の参照があり、`.pecot/state/.pecot-base` が積んだ先の Issue を指すときは、Stack の節が続きます。節には、ブランチ・Issue・その PR を書いた base の行を載せます。PR は、fork からではない open の PR です。それが無ければ最新の PR、それも無ければ `no PR` で、読めないときは `PR unknown` です。'
      - 'アクティブな Issue の着手の判定が `blocked` のときは、Stack の節に readiness の行も載せます。'
      - 'Stack の節は、Active Issue の節と同じ設定とクライアントを使います。Active Issue の節を出さないときは、Stack の節も出しません。'
      - 'このコマンドは診断用です。読めない値は、`unknown` か `none` と出すか省き、コマンドは失敗しません。'
      - '何も書き込みません。'
    stdin: none
    output:
      format: text
      description: 'Session status の見出しがある Markdown です。Branch・Repository・Inferred Issue の行と、フラグの表を出します。アクティブな Issue を読めたときは Active Issue の節を、作業を積んでいるときは Stack の節を出します。'
    diagnostics: '標準エラーに `warning` の行を出すのは、次のときです。`.pecot-active` に Issue の参照があり、アクティブな Issue を読めないとき。base のブランチの PR を読めないとき。`.pecot-base` の形が誤っているとき。アクティブな Issue の着手の判定ができないとき。アクティブなプロジェクトが無いときと、アクティブな設定ファイルの内容が不正なときも含みます。プロジェクトのルートを決められないときは、`error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: '状態を出しました。ブランチ・リポジトリ・アクティブな Issue を読めなかったときも含みます。`.pecot-active` に Issue の参照があり、アクティブな設定ファイルの内容が不正なときも含みます。'
      - code: 1
        when: 'プロジェクトのルートを決められません（`error` の行を出します）。'
      - code: 2
        when: '次のどれかです。`--directory` がありません。`--directory` が、無いパス・ファイル・読めないディレクトリのどれかです。ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: 'ディレクトリの今のブランチと、remote の `origin` の URL を読みます。`origin` が無ければ、最初の remote の URL を読みます。'
      - target: file
        kind: read
        what: '`.pecot/state/` の下の `.pecot-active` と `.pecot-base`、アクティブな設定ファイルを読みます。'
      - target: github
        kind: read
        what: '`.pecot-active` にある Issue の題・状態・本文を読みます。積んだ作業では、base のブランチの PR と、Issue の前提も読みます。'
    prerequisites: []
    idempotent: true
    examples:
      - run: pecot session status -D .
        note: '今のリポジトリのセッションの状態を出します。'
    default_notes: {}
    behaviors:
      - id: PW-SESSION-STATUS-01
        pattern: event
        statement: '`--directory` を渡して打つと、ブランチ・リポジトリ・推定した Issue・フラグの表を Markdown で標準出力に出します'
