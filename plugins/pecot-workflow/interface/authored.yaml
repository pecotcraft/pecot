format: 1
plugin: pecot-workflow
environment:
  - name: PECOT_GITHUB_API_URL
    effect: Sends GitHub API requests to this URL instead of the real host. Only an http://127.0.0.1 or http://localhost URL is accepted; any other value stops the command with exit status 1 before the subcommand runs. The exceptions are --version and the top-level --help, which finish first with exit status 0. An empty value is ignored.
  - name: PECOT_SESSION_PROJECT_DIR
    effect: When the working directory is inside <value>/.pecot/work (with no nested git repository in between), <value> becomes the project root instead of the git toplevel. CLAUDE_PROJECT_DIR takes precedence.
  - name: CLAUDE_PROJECT_DIR
    effect: Used as the project root when set, ahead of PECOT_SESSION_PROJECT_DIR and the git toplevel. The config files, the active project setting and the work directories are looked up under it.
  - name: CLAUDE_PLUGIN_ROOT
    effect: Locates the plugin directory. The version shown by --version is read from .claude-plugin/plugin.json under it, and the scripts that worktree commands run are looked up under it.
  - name: PECOT_GITHUB_*_TOKEN
    effect: Supplies the GitHub token for a host. The variable name is the env_var of that host in .pecot/config/hosts.json. Without an entry, the name is PECOT_GITHUB_COM_TOKEN for github.com, and PECOT_GITHUB_<HOST>_TOKEN for any other host, where <HOST> is the host name in upper case with each . replaced by _. The variable is read from the environment, after .pecot/config/.env is loaded; a line in that file does not overwrite an existing environment variable. When no token is found, GITHUB_COM_TOKEN is used for github.com, and then the token from gh auth token. When the token is rejected with 401, the command retries once with the token from gh auth token and writes a warning line; this also applies to the token from GITHUB_COM_TOKEN.
  - name: GITHUB_COM_TOKEN
    effect: Supplies the GitHub token for github.com when the variable named for that host is unset (PECOT_GITHUB_COM_TOKEN without an entry in .pecot/config/hosts.json). The variable is read from the environment, after the .env file in the project root is loaded; a line in that file does not overwrite an existing environment variable, and it is loaded after .pecot/config/.env.
entries:
  PW-ISSUE-COMMENT:
    constraints:
      - requires: {message: [issue, template]}
      - requires: {prepare: [template]}
    details:
      - "Has three modes: --prepare, a file argument and -m."
      - When more than one mode is given, --prepare wins over the file and the file wins over -m.
      - With --prepare, copies the template of the given kind to .pecot/tmp/output/ and prints its path.
      - With --prepare and --issue, fills issue_ref in the front matter of the copy with the given reference.
      - With a file, posts its body as a comment on the Issue named by issue_ref in its front matter.
      - With -m, posts the given body as a comment on the Issue given by --issue.
      - A file is validated against the template named in its front matter, and -m against the template given by -t.
      - A file that has comment_url updates that comment instead of posting a new one.
      - After posting from a file, writes the URL of the new comment back to comment_url in that file.
      - comment_url must point to a comment on the Issue named by issue_ref.
      - With a file, a repository that is not in the project gives a warning and the comment is still posted.
    stdin: none
    output:
      format: text
      description: With --prepare, the path of the template copy. Otherwise the URL of the comment that was posted or updated.
    diagnostics: A result line on stderr for the comment (created or updated). A warning line when the repository of a file is not in the project, or when comment_url cannot be written back. When the body does not follow the template, one error line whose first line names the template path, followed by indented lines for the missing sections, heading summary rule violations, unusable notation, collapse rule violations and headings not in the template.
    environment: []
    exit_status:
      - code: 0
        when: The template was copied, or the comment was posted or updated.
      - code: 1
        when: There is no active project, no mode argument is given, -t is missing with --prepare or -m, --issue is missing with -m, the front matter cannot be read or has no template, comment_url is malformed or points to another host or Issue, or the GitHub API returned an error.
      - code: 2
        when: The Issue reference is malformed, or another command line error occurs.
      - code: 3
        when: The body does not follow the template.
    on_error: Nothing is posted when the body does not follow the template. When the comment is posted but comment_url cannot be written back, the comment stays on GitHub and the file is left as it was. A template copy written by --prepare stays in .pecot/tmp/output/.
    effects:
      - target: github
        kind: write
        what: Posts a comment on the Issue, or updates the comment named by comment_url.
      - target: github
        kind: read
        what: With a file, checks whether the repository is linked to the project.
      - target: file
        kind: write
        what: Writes the template copy under .pecot/tmp/output/, and writes comment_url back to the file that was posted.
      - target: file
        kind: read
        what: Reads the comment file, the templates and the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: false
    examples:
      - run: pecot issue comment --prepare -t plan -i example-org/my-repo/12
        note: Write a plan template for Issue 12 and print its path.
      - run: pecot issue comment .pecot/tmp/output/comment-plan-20260101-120000.md
        note: Post the comment in the file, or update it when the file has comment_url.
    default_notes:
      issue: No default. Required with -m; with --prepare, issue_ref in the copy stays empty when omitted; with a file, issue_ref comes from the front matter. The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
      template: No default. Required with --prepare and -m; with a file, the template comes from the front matter.
    behaviors:
      - id: PW-ISSUE-COMMENT-01
        pattern: event
        statement: --prepare とテンプレの種類を付けて打つと、テンプレのコピーを .pecot/tmp/output/ に書く
      - id: PW-ISSUE-COMMENT-02
        pattern: event
        statement: --prepare に --issue を付けて打つと、コピーの issue_ref に渡した参照を入れる
      - id: PW-ISSUE-COMMENT-03
        pattern: event
        statement: コメントのファイルを渡すと、フロントマターの issue_ref の Issue にコメントを投稿する
      - id: PW-ISSUE-COMMENT-04
        pattern: event
        statement: "-m に --issue とテンプレの種類を付けて打つと、その Issue にコメントを投稿する"
      - id: PW-ISSUE-COMMENT-05
        pattern: event
        statement: comment_url を持つファイルを渡すと、新しいコメントを投稿せずにそのコメントを書き換える
      - id: PW-ISSUE-COMMENT-06
        pattern: event
        statement: ファイルからコメントを投稿すると、できたコメントの URL をファイルの comment_url に書き戻す
      - id: PW-ISSUE-COMMENT-07
        pattern: event
        statement: --prepare とファイルを一緒に渡すと、ファイルを投稿せずにテンプレのコピーだけを書く
      - id: PW-ISSUE-COMMENT-08
        pattern: event
        statement: ファイルと -m を一緒に渡すと、-m の本文を使わずにファイルを投稿する
      - id: PW-ISSUE-COMMENT-09
        pattern: event
        statement: --prepare を付けて打つと、書いたテンプレのパスを標準出力に出す
      - id: PW-ISSUE-COMMENT-10
        pattern: event
        statement: コメントを投稿すると、そのコメントの URL を標準出力に出す
      - id: PW-ISSUE-COMMENT-11
        pattern: event
        statement: コメントを書き換えると、書き換えたコメントの URL を標準出力に出す
      - id: PW-ISSUE-COMMENT-12
        pattern: event
        statement: コメントを投稿すると、created の行を標準エラーに出す
      - id: PW-ISSUE-COMMENT-13
        pattern: event
        statement: コメントを書き換えると、updated の行を標準エラーに出す
      - id: PW-ISSUE-COMMENT-14
        pattern: unwanted
        statement: もしファイルの Issue のリポジトリがプロジェクトに無いなら、warning の行を標準エラーに出す
      - id: PW-ISSUE-COMMENT-15
        pattern: unwanted
        statement: もし comment_url を書き戻せないなら、warning の行を標準エラーに出す
      - id: PW-ISSUE-COMMENT-16
        pattern: unwanted
        statement: もし本文がテンプレに合わないなら、終了コード 3 で終わる
      - id: PW-ISSUE-COMMENT-17
        pattern: unwanted
        statement: もし本文がテンプレに合わないなら、違反の種類ごとの行を標準エラーに出す
      - id: PW-ISSUE-COMMENT-18
        pattern: unwanted
        statement: もし本文がテンプレに合わないなら、コメントを投稿しない
      - id: PW-ISSUE-COMMENT-19
        pattern: unwanted
        statement: もし --prepare か -m でテンプレの種類を渡していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-20
        pattern: unwanted
        statement: もし -m で --issue を渡していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-21
        pattern: unwanted
        statement: もし --prepare・ファイル・-m のどれも渡していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-22
        pattern: unwanted
        statement: もしファイルのフロントマターを読めないなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-23
        pattern: unwanted
        statement: もしファイルのフロントマターに template が無いなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-24
        pattern: unwanted
        statement: もし comment_url の形が誤っているか、別のホストや別の Issue を指すなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-25
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-26
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-ISSUE-COMMENT-27
        pattern: unwanted
        statement: もし Issue の参照の形が誤っているなら、終了コード 2 で終わる
  PW-ISSUE-CREATE:
    constraints:
      - requires: {message: [title]}
    details:
      - "Has three modes: --prepare, files and -m."
      - When more than one mode is given, --prepare wins over the files and the files win over -m.
      - With --prepare, copies the template given by --template to .pecot/tmp/output/ and prints its path.
      - With --prepare and --repo, fills the repository line of the copy with the given repository.
      - With --prepare and --suffix, appends the suffix to the file name of the copy.
      - With files, creates one Issue per file in the order given.
      - With files, the front matter decides the type, repository, status, priority, size, parent Epic, order and labels, and the options of the same names are ignored.
      - Before the first Issue of a batch is created, checks that every file exists, that none is given twice and that every {{issue:key}} placeholder points to an earlier file.
      - A {{issue:key}} placeholder in a body expands to the number of the Issue created from the earlier file with that key.
      - With -m, creates one Issue from --title, the body, --repo and --type.
      - With -m, --repo is required unless --type is epic.
      - The body must follow the template of the Issue type.
      - The status at creation can only be the default of the type.
      - An Epic is created in aggregation_repo when no repository is given.
      - Creating an Epic in a repository other than aggregation_repo gives a warning and continues.
      - Adds each created Issue to the project board and sets its status, priority and size.
      - With a parent Epic, links each created Issue as a sub-issue of it.
      - With a parent Epic and --order, stops when another Issue of that Epic has the same order.
    stdin: none
    output:
      format: text
      description: With --prepare, the path of the template copy. Otherwise one line per created Issue with its URL, in the order of the files.
    diagnostics: "Result lines on stderr for each Issue: created, added (to the project and to the parent Epic as a sub-issue) and set (status, priority and size). Warning lines when an Epic is created outside aggregation_repo, and when adding an Issue to the project fails. An error line for each failure; a body that does not follow the template is reported with the template path on the first line and indented lines for each kind of violation. A malformed --parent-epic is reported by the command line parser as a usage error, not as an error line."
    environment: []
    exit_status:
      - code: 0
        when: The template was copied, or every Issue was created. Failing to add an Issue to the project board still gives 0.
      - code: 1
        when: There is no active project, no mode argument is given, -t or -r is missing with -m, a file is missing or given twice, a placeholder does not point to an earlier file, the front matter cannot be read or has a malformed repository, the body does not follow the template, the status is not the default of the type, the repository is not linked to the project, another Issue of the parent Epic has the same order, linking to the parent Epic failed, or the GitHub API returned an error. A body that does not follow the template gives 1, not 3.
      - code: 2
        when: A repository is not in owner/repo form, --repo is missing with --prepare for a type other than epic, the destination of an Epic cannot be decided, --parent-epic is malformed, or another command line error occurs.
    on_error: When a file in a batch fails, the Issues created from earlier files stay on GitHub and later files are not processed. Only the existence of the files, duplicates and placeholders are checked before the first Issue is created; every other check runs just before the Issue of that file is created. The flag issue-create-slash-pending stays after a failure, and issue-pending is removed each time an Issue is created. When adding to the project board fails, a warning is written, the Issue stays, and the next file is processed. When linking to the parent Epic fails, the Issue stays on the board with its fields set.
    effects:
      - target: github
        kind: write
        what: Creates Issues, adds them to the project board, sets their fields and links them to the parent Epic as sub-issues.
      - target: github
        kind: read
        what: Reads the repositories linked to the project and the sub-issues of the parent Epic.
      - target: file
        kind: write
        what: Writes the template copy under .pecot/tmp/output/ and removes the flags issue-pending and issue-create-slash-pending under .pecot/state/.
      - target: file
        kind: read
        what: Reads the Markdown files, the templates and the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: false
    examples:
      - run: pecot issue create --prepare --template task --repo example-org/my-repo
        note: Write a task template and print its path.
      - run: pecot issue create .pecot/work/12/issue-a.md .pecot/work/12/issue-b.md
        note: Create two Issues in the order given.
      - run: "pecot issue create -t \"Add a report\" -r example-org/my-repo -m \"<body>\""
        note: Create one Issue from the command line.
    default_notes:
      status: "Decided by the type: ready for task and bug, backlog for epic and tracker. Any other value stops the command with exit status 1."
      repo: Required with -m and --prepare unless the type is epic. An Epic goes to aggregation_repo of the active project; when that is not set, --repo is required.
      parent_epic: An integer is resolved against aggregation_repo, or against the repository of the new Issue when aggregation_repo is not set. The form owner/repo/N is used as it is.
    behaviors:
      - id: PW-ISSUE-CREATE-01
        pattern: event
        statement: --prepare を付けて打つと、--template のテンプレのコピーを .pecot/tmp/output/ に書く
      - id: PW-ISSUE-CREATE-02
        pattern: event
        statement: --prepare に --repo を付けて打つと、コピーの repository に渡したリポジトリを入れる
      - id: PW-ISSUE-CREATE-03
        pattern: event
        statement: --prepare に --suffix を付けて打つと、コピーのファイル名に suffix を付ける
      - id: PW-ISSUE-CREATE-04
        pattern: event
        statement: 複数のファイルを渡すと、渡した順に 1 件ずつ Issue を作る
      - id: PW-ISSUE-CREATE-05
        pattern: event
        statement: "-m に --title と --repo を付けて打つと、Issue を 1 件作る"
      - id: PW-ISSUE-CREATE-06
        pattern: event
        statement: --prepare とファイルを一緒に渡すと、ファイルから Issue を作らずにテンプレのコピーだけを書く
      - id: PW-ISSUE-CREATE-07
        pattern: event
        statement: ファイルと -m を一緒に渡すと、-m の本文を使わずにファイルから Issue を作る
      - id: PW-ISSUE-CREATE-08
        pattern: event
        statement: ファイルを渡すと、フロントマターの値を使い、--type・--status などのオプションは使わない
      - id: PW-ISSUE-CREATE-09
        pattern: event
        statement: 本文に {{issue:key}} があると、key のファイルから作った Issue の番号に置き換えて投稿する
      - id: PW-ISSUE-CREATE-10
        pattern: event
        statement: Issue を作ると、プロジェクトのボードに足す
      - id: PW-ISSUE-CREATE-11
        pattern: event
        statement: ボードに足すと、status・priority・size を設定する
      - id: PW-ISSUE-CREATE-12
        pattern: event
        statement: --status を省いて -m で打つと、type の既定の status を設定する
      - id: PW-ISSUE-CREATE-13
        pattern: event
        statement: 親 Epic を指定して Issue を作ると、その Epic の sub-issue につなぐ
      - id: PW-ISSUE-CREATE-14
        pattern: event
        statement: --type epic で --repo を省くと、aggregation_repo に Epic を作る
      - id: PW-ISSUE-CREATE-15
        pattern: event
        statement: aggregation_repo と違うリポジトリに Epic を作ると、warning の行を標準エラーに出す
      - id: PW-ISSUE-CREATE-16
        pattern: event
        statement: --prepare を付けて打つと、書いたテンプレのパスを標準出力に出す
      - id: PW-ISSUE-CREATE-17
        pattern: event
        statement: Issue を作ると、その URL を標準出力に出す
      - id: PW-ISSUE-CREATE-18
        pattern: event
        statement: Issue を作ると、created の行を標準エラーに出す
      - id: PW-ISSUE-CREATE-19
        pattern: event
        statement: ボードか親 Epic に足すと、added の行を標準エラーに出す
      - id: PW-ISSUE-CREATE-20
        pattern: event
        statement: 欄を設定すると、set の行を標準エラーに出す
      - id: PW-ISSUE-CREATE-21
        pattern: unwanted
        statement: もしボードへの追加に失敗したなら、warning の行を標準エラーに出す
      - id: PW-ISSUE-CREATE-22
        pattern: unwanted
        statement: もしボードへの追加に失敗したなら、作った Issue の URL を標準出力に出す
      - id: PW-ISSUE-CREATE-23
        pattern: unwanted
        statement: もしボードへの追加に失敗したなら、次のファイルへ進む
      - id: PW-ISSUE-CREATE-24
        pattern: unwanted
        statement: もし欄の設定に失敗したなら、失敗を無視して続ける
      - id: PW-ISSUE-CREATE-25
        pattern: unwanted
        statement: もし親 Epic へのつなぎに失敗したなら、作った Issue の URL を標準出力に出す
      - id: PW-ISSUE-CREATE-26
        pattern: unwanted
        statement: もし親 Epic へのつなぎに失敗したなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-27
        pattern: unwanted
        statement: もし複数のファイルの途中で Issue の作成に失敗したなら、後のファイルを処理しない
      - id: PW-ISSUE-CREATE-28
        pattern: unwanted
        statement: もし複数のファイルの途中で Issue の作成に失敗したなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-29
        pattern: unwanted
        statement: もし本文がテンプレに合わないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-30
        pattern: unwanted
        statement: もし status が type の既定の値でないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-31
        pattern: unwanted
        statement: もし -m に --title を渡していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-32
        pattern: unwanted
        statement: もし epic 以外の -m に --repo を渡していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-33
        pattern: unwanted
        statement: もし --prepare・ファイル・-m のどれも渡していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-34
        pattern: unwanted
        statement: もしファイルが無いか、同じファイルを重ねて渡したか、{{issue:key}} が先のファイルを指していないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-35
        pattern: unwanted
        statement: もしフロントマターを読めないか、repository が owner/repo の形でないなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-36
        pattern: unwanted
        statement: もし同じ親 Epic に同じ order の Issue があるなら、終了コード 1 で終わる
      - id: PW-ISSUE-CREATE-37
