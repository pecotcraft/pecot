  PW-RELEASE-PREFLIGHT:
    help:
      details:
        - Checks the open Dependabot, code scanning and secret scanning alerts of the repository.
        - All three kinds are always checked, even when an earlier one fails.
        - An open Dependabot alert is a warning and does not stop the command.
        - "The Dependabot warning lists each alert as #<number> with its package and severity, and the URL of the alert page."
        - An open code scanning or secret scanning alert fails the command.
        - A repository with the feature disabled passes with a skipped line.
        - A state of code scanning or secret scanning that cannot be determined, such as a missing permission, fails the command.
        - For a repository whose release type is nx, only the alerts are checked, and the version argument and --package are rejected.
        - Otherwise checks that the CHANGELOG exists, that the version is in X.Y.Z form, that the tag exists neither locally nor on the remote, and that <remote>/<develop_branch> has commits that <remote>/<release_branch> does not have, where <remote> is origin, or the first remote when there is no origin.
        - "Without a version argument, the version is the first ## [X.Y.Z] heading of the CHANGELOG, and the Unreleased heading is skipped."
        - The CHANGELOG is the changelog_file of the repository in the config file.
        - Without changelog_file, the CHANGELOG is CHANGELOG.md and then AIST-CHANGELOG.md at the git root, and with --package, the changelog of that package.
        - The tag is v<version>.
        - With --package, the tag is <package>-v<version>.
        - A repository with packages configured needs --package.
        - A repository without packages does not accept --package.
        - The repository is taken from the global pecot --repo, and without it from the origin remote, or from the first remote when there is no origin.
        - With a --repo that differs from the git remote, the git commands still use origin, or the first remote when there is no origin.
        - The command needs the working directory to be inside a git repository.
        - A mismatch between --repo and the current git remote is a warning, and --repo is used.
      examples:
        - run: pecot release preflight
          note: Check the release with the version detected from the CHANGELOG.
        - run: pecot release preflight 0.6.1
          note: Check the release of a given version.
        - run: pecot release preflight 0.6.1 --package pecot-workflow
          note: Check the release of one package in a monorepo.
      default_notes:
        version: "The first ## [X.Y.Z] heading of the CHANGELOG; the Unreleased heading is skipped."
        package: None; required when the repository has packages configured in the config file.
    summary: リリースの前の確認（preflight）をします。nx のリポジトリでは、alert だけを確かめます。
    arguments:
      package: 'monorepo のパッケージの名前です。'
      version: 'リリースする版です。'
    constraints: []
    details:
      - 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を確かめます。'
      - '3 種類は、先の確認が失敗しても、必ずすべて確かめます。'
      - 'open の Dependabot alert は `warning` として扱い、コマンドは止まりません。'
      - 'Dependabot の `warning` には、alert ごとの `#<number>`・パッケージ・severity と、alert のページの URL を並べます。'
      - 'open の code scanning alert か secret scanning alert があると、コマンドは失敗します。'
      - '機能が無効のリポジトリは、`skipped` の行を出して通ります。'
      - '権限が無いなどで code scanning か secret scanning の状態を判定できないと、コマンドは失敗します。'
      - 'リリースの種類が nx のリポジトリでは、alert だけを確かめます。版の引数と `--package` は受け付けません。'
      - 'それ以外では、次のことを確かめます。CHANGELOG があること。版が `X.Y.Z` の形であること。タグがローカルとリモートのどちらにも無いこと。`<remote>/<develop_branch>` に、`<remote>/<release_branch>` に無いコミットがあること。`<remote>` は `origin` で、`origin` が無ければ最初の remote です。'
      - '版の引数が無いときの版は、CHANGELOG の最初の `## [X.Y.Z]` の見出しです。Unreleased の見出しは飛ばします。'
      - 'CHANGELOG は、設定ファイルにあるリポジトリの `changelog_file` です。'
      - '`changelog_file` が無いときの CHANGELOG は、git のルートの `CHANGELOG.md` で、その次が `AIST-CHANGELOG.md` です。`--package` を付けたときは、そのパッケージの changelog です。'
      - 'タグは `v<version>` です。'
      - '`--package` を付けると、タグは `<package>-v<version>` です。'
      - 'packages を設定したリポジトリでは、`--package` が必須です。'
      - 'packages の無いリポジトリでは、`--package` を受け付けません。'
      - 'リポジトリは、pecot 全体のオプション `--repo` から決めます。無ければ remote の `origin` から、`origin` も無ければ最初の remote から決めます。'
      - '`--repo` が git remote と違っても、git のコマンドは `origin` を使います。`origin` が無ければ、最初の remote を使います。'
      - '作業ディレクトリは、git のリポジトリの中でなければなりません。'
      - '`--repo` が今の git remote と食い違うときは、`warning` を出して `--repo` を使います。'
    stdin: none
    output:
      format: text
      description: '版の行、タグの行、空行、その版のリリースノートです。リリースの種類が nx のリポジトリでは、標準出力に何も書きません。'
    diagnostics: 'alert の種類ごとに、`count` の行、`skipped` の行、`warning` の行のどれかを出します。code scanning と secret scanning には、`error` の行も出します。リリースするコミットの `count` の行を出します。`--repo` が git remote と違うときは、`warning` の行を出します。失敗したときは、`error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'すべての確認を通りました。open か読めなかったものが Dependabot alert だけのときも含みます。'
      - code: 1
        when: '次のどれかです。git のリポジトリのルートが見つかりません。アクティブなプロジェクトがありません。`--package` の決まりに反しています。nx のリポジトリに版か `--package` を渡しました。alert の確認が失敗しました。`develop_branch` か `release_branch` が未設定です。CHANGELOG か、その中の版が見つかりません。タグが既にあります。リリースするものがありません。git のコマンドが失敗しました。版が `X.Y.Z` の形ではありません。`--repo` を省いたのに git remote を読めません。git の外で `--repo` を省いたので、リポジトリが決まりません。プロジェクトのルートを決められません。'
      - code: 2
        when: '知らないオプションなど、コマンドラインの誤りがあります。'
    on_error: 'GitHub と作業ツリーのどちらにも、何も作りません。`git fetch` が `<remote>/<release_branch>` と `<remote>/<develop_branch>` を既に更新していることはあります。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を読みます。'
      - target: git
        kind: read
        what: 'git のルート、`<remote>` の URL、ローカルのタグ、`git ls-remote` で見たリモートのタグ、2 つのブランチの間のコミットの数を読みます。'
      - target: git
        kind: write
