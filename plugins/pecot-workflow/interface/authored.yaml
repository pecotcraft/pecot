      - id: PW-PR-SHOW-10
        pattern: event
        statement: '短い形 `N` の参照を渡すと、`repo` か git の remote で補って読みます'
      - id: PW-PR-SHOW-11
        pattern: unwanted
        statement: 'もし PR の参照の形が誤っているなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-SHOW-12
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-PR-SHOW-13
        pattern: unwanted
