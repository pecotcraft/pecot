  PW-ISSUE-CREATE:
    help:
      details:
        - "Has three modes: files, -m and --freeform."
        - When both files and -m are given, the files win over -m.
        - --freeform cannot be used with files or --title.
        - The templates are MCP resources (pecot-template://issue/<type>); copy one to a file and fill it in.
        - To see the table of a batch without creating anything, use pecot issue check.
        - With files, creates one Issue per file in the order given.
        - With files, the front matter decides the type, repository, status, priority, size, parent Epic, order, labels and blocked_by, and the options of the same names are ignored.
        - Before the first Issue of a batch is created, checks that every file exists, that none is given twice, that every {{issue:key}} placeholder points to an earlier file, and that every front matter and body is valid.
        - Before the first Issue of a batch is created, also checks blocked_by, the order numbers and the repository link, and reads the parent Epics and the existing Issues named in blocked_by.
        - Each blocked_by entry names an earlier file of the batch by its key (the stem of the file name) or an existing Issue as owner/repo/N, with wait stack (the default) or wait merge and a reason.
        - Adds each blocked_by entry to the created Issue as blocked-by, right after the Issue is created.
        - For a wait merge entry, writes a line with the prerequisite and the reason into the Waits for merge section of the body, and nothing for a wait stack entry.
        - A task or bug with blocked_by is placed in the Blocked column and one without it in the Ready column, unless the board has no Blocked column; then it is placed in Ready with one warning.
        - After the blocked-by of a Blocked Issue that names an existing Issue are added, reads whether it can start, and moves it to the Ready column when it can. Leaves it in Blocked when the judgement cannot be read.
        - An Issue with a parent Epic and no order gets the highest order in use under that Epic plus one, in the order of the files. A branch letter such as 18a counts as its number. The title carries only the serial number.
        - After posting, prints the stackable chains of the created Issues when every blocked-by was added.
        - The parallel field is not supported; a file that has it is rejected.
        - A {{issue:key}} placeholder in a body expands to the number of the Issue created from the earlier file with that key.
        - With -m, creates one Issue from --title, the body, --repo and --type.
        - With -m, --repo is required unless --type is epic.
        - With --freeform, creates one Issue from --message and --repo without checking the body against the template.
        - With --freeform, the title is the first 50 characters of the first line of the message, with each run of whitespace turned into one space, prefixed by the type.
        - With --freeform, the status is --status, or the default of the type when it is not given. The priority is --priority or medium, and the size is --size or s, except that epic and tracker get no default size.
        - With --freeform, appends a comment that points to the issue-creation rules to the end of the body.
        - With --freeform, a parent Epic given to an Epic gives a warning and continues.
        - With --freeform, creates no branch and records no work target. Use pecot session start for them.
        - The body must follow the template of the Issue type.
        - The status at creation can only be the default of the type, or blocked for a task or bug with blocked_by.
        - An Epic is created in aggregation_repo when no repository is given.
        - Creating an Epic in a repository other than aggregation_repo gives a warning and continues.
        - Adds each created Issue to the project board and sets its status, priority and size.
        - With a parent Epic, links each created Issue as a sub-issue of it.
        - With a parent Epic and --order, stops when another Issue of that Epic has the same order.
        - With files, stops when two files of the batch have the same order under the same parent Epic.
      examples:
        - run: pecot issue create .pecot/work/12/issue-a.md .pecot/work/12/issue-b.md
          note: Create two Issues in the order given.
        - run: pecot issue create --freeform -r example-org/my-repo -m "Fix the status column of the list"
          note: Create one Issue from a free-format message.
        - run: pecot issue create -t "Add a report" -r example-org/my-repo -m "<body>"
          note: Create one Issue from the command line.
      default_notes:
        status: "Decided by the type: ready for task and bug (blocked when the file has blocked_by), backlog for epic and tracker. Any other value stops the command with exit status 1."
        repo: Required with -m unless the type is epic. An Epic goes to aggregation_repo of the active project; when that is not set, --repo is required.
        parent_epic: An integer is resolved against aggregation_repo, or against the repository of the new Issue when aggregation_repo is not set. The form owner/repo/N is used as it is.
    summary: フロントマター付きの Markdown ファイルから Issue を作ります。
    arguments:
      files: 'フロントマター付きの Markdown ファイルのパスの配列です。複数渡すと、まとめて投稿します。'
      freeform: 'テンプレートの検証なしで、`message` と `repo` だけから Issue を作るかどうかです。題は `message` の 1 行目の先頭 50 文字から作ります。'
      label: 'ラベルの配列です。複数渡せます。'
      message: 'Issue の本文です。ファイルを使わずに直接投稿するときの値です。'
      order: 'サブタスクの順番の番号です。`parent_epic` と一緒に使います。'
      parent_epic: '親 Epic の参照です。整数か、`owner/repo/N` の形で渡します。'
      priority: '優先度です。`high`・`medium`・`low` のどれかを渡します。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、作り先のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブなプロジェクトを使います。Epic を `repo` なしで作るときは、アクティブなプロジェクト、設定が 1 つだけならその設定の順で選びます。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。'
      size: 'サイズです。`xs`・`s`・`m`・`l` のどれかを渡します。'
      status: 'Status です。`backlog`・`pending`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
      title: 'Issue の題です。`message` で直接投稿するときは必須です。'
      type: 'Issue の種類です。`task`・`bug`・`epic`・`tracker` のどれかを渡します。'
    constraints:
      - requires: {freeform: [message, repo]}
      - conflicts: [freeform, files]
      - conflicts: [freeform, title]
    details:
      - 'モードは、`files`・`message`・`freeform` の 3 つです。'
      - '`files` と `message` を両方渡すと、`files` が `message` より優先されます。'
      - '`freeform` は、`files`・`title` と一緒に使えません。'
      - 'テンプレートは MCP の resource（`pecot-template://issue/<種類>`）です。ファイルに写して書き込みます。'
      - '何も作らずに一括の表を見るときは、`issue_check` を使います。'
      - '`files` では、渡した順に、ファイルごとに Issue を 1 件作ります。'
      - '`files` では、type・リポジトリ・status・priority・size・親 Epic・order・ラベル・`blocked_by` をフロントマターで決めます。同じ名前の引数は無視します。'
      - '一括の最初の Issue を作る前に、次のことを確かめます。どのファイルもあること。同じファイルを重ねて渡していないこと。どの `{{issue:key}}` も先のファイルを指すこと。どのフロントマターと本文も正しいこと。'
      - '一括の最初の Issue を作る前に、`blocked_by`・order の番号・リポジトリのつながりも確かめます。親 Epic と、`blocked_by` に書いた既存の Issue も読みます。'
      - '`blocked_by` の各要素は、一括の中の先のファイルを key で指すか、既存の Issue を `owner/repo/N` で指します。key は、ファイル名の拡張子を除いた部分です。各要素には、`wait: stack`（既定）か `wait: merge` と、reason を書きます。'
      - '`blocked_by` の各要素は、Issue を作った直後に、その Issue の blocked-by として足します。'
      - '`wait: merge` の要素では、前提と reason の行を本文の Waits for merge の節に書きます。`wait: stack` の要素では何も書きません。'
      - '`blocked_by` のある task か bug は Blocked の列に、無いものは Ready の列に置きます。ボードに Blocked の列が無いときは、`warnings` に 1 つ入れて Ready に置きます。'
      - '既存の Issue を指す Blocked の Issue は、blocked-by を足した後で、着手できるかどうかを読みます。着手できるなら、Ready の列へ動かします。判定を読めないときは、Blocked のまま残します。'
      - '親 Epic があって order の無い Issue には、その Epic で使われている最大の order の次の番号を、ファイルの順に振ります。`18a` のような枝の文字が付いた番号は、その数字として数えます。題には、通し番号だけを入れます。'
      - '投稿の後、すべての blocked-by を足せたときは、作った Issue の積める並びを `stackableChains` に入れます。'
      - '`parallel` の欄には対応していません。この欄のあるファイルは受け付けません。'
      - '本文の `{{issue:key}}` は、その key の先のファイルから作った Issue の番号に展開します。'
      - '`message` では、`title`・本文・`repo`・`type` から Issue を 1 件作ります。'
      - '`message` では、`type` が `epic` でなければ `repo` が必須です。'
      - '`freeform` では、`message` と `repo` から、本文をテンプレートで確かめずに Issue を 1 件作ります。'
      - '`freeform` の題は、`message` の 1 行目の先頭の 50 文字です。連続した空白は 1 つの空白にまとめ、前に type を付けます。'
      - '`freeform` の status は `status` の値で、無ければ type の既定の値です。priority は `priority` の値か `medium` です。size は `size` の値か `s` で、`epic` と `tracker` には既定の size を付けません。'
      - '`freeform` では、本文の末尾に、起票の決まりを指すコメントを付けます。'
      - '`freeform` で Epic に親 Epic を渡すと、`warnings` に入れて続けます。'
      - '`freeform` は、ブランチを作らず、作業対象も記録しません。それは `session_start` が行います。'
      - '本文は、Issue の種類のテンプレートに合っていなければなりません。'
      - '作るときの status にできるのは、type の既定の値だけです。`blocked_by` のある task か bug では、`blocked` にもできます。'
      - 'Epic は、リポジトリを渡さないと `aggregation_repo` に作ります。'
      - '`aggregation_repo` 以外のリポジトリに Epic を作ると、`warnings` に入れて続けます。'
      - '作った Issue は、それぞれプロジェクトのボードに足し、status・priority・size を設定します。'
      - '親 Epic があるときは、作った Issue をそれぞれ親 Epic の sub-issue としてつなぎます。'
      - '親 Epic と `order` を渡したときは、その Epic に同じ order の Issue が既にあると、失敗を返します。'
      - '`files` では、一括の中の 2 つのファイルが同じ親 Epic の下で同じ order を持つと、失敗を返します。'
    stdin: none
    output:
      format: text
      description: '作った Issue ごとに URL を 1 行ずつ、ファイルの順に出します。作った Issue に積める並びがあれば、その後に出します。'
    mcp_output:
      fields:
        issues: '作った Issue の配列です。作った順に並びます。途中で失敗したときも、それまでに作った分が入ります。要素は `owner`・`repository`・`number`・`url` を必ず持ちます。`status` は、ボードに書いた Status（Blocked から出したときは `ready`）です。書かなかったときは入りません。`parent` は、sub-issue として足した親 Epic（`owner/repo/N`）です。親が無いときは入りません。'
        stackableChains: '積める並びの配列です。1 つの並びは、下の段から順に並べた文字列の配列です。ファイルはキー、既存の Issue は `#N` か `owner/repo#N` で書きます。積める並びが無いときは入りません。'
    diagnostics: '標準エラーに、Issue ごとの結果の行を出します。行の種類は、`created` と、`added`（blocked-by・プロジェクト・親 Epic の sub-issue）です。`set`（status・priority・size）と `moved`（Blocked から Ready）もあります。`warning` の行を出すのは、次のときです。`aggregation_repo` の外に Epic を作ったとき。ボードに Blocked の列が無いとき。Issue をプロジェクトに足せなかったとき。blocked-by を足せなかったとき。Issue の blocked-by を全部は読めなかったとき。blocked-by を足せなかったときは、付け直す `pecot issue block` のコマンドを載せた `error` の行が続きます。複数のファイルの一括では、次の 2 種類の `warning` の行を、最初の `created` の行より前にすべて出します。`aggregation_repo` の外に作る Epic の行と、読めない親 Epic の行です。親 Epic の `warning` は、ファイルごとではなく、親ごとに 1 回書きます。`-m` で渡した `--status` が有効な値でないときは、有効な値を並べた `error` の行を出します。失敗ごとに `error` の行を出します。本文がテンプレートに合わないときは、1 行目にテンプレートのパスを、字下げした行に違反の種類ごとの内容を出します。形の誤った `--parent-epic` は、`error` の行ではなく、コマンドラインの解析が使い方のエラーとして知らせます。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        code: 1
        when: 'モードの引数がありません。`message` に `title` か `repo` が無いとき、ファイルが無いとき、同じファイルを重ねて渡したときも含みます。'
      - kind: invalid-input
        code: 1
        when: '`message` で渡した `status` が有効な値ではありません。status が type の既定の値でないときも含みます。'
      - kind: invalid-input
        code: 1
        when: '一括で渡したファイルの作り先のリポが、別々のプロジェクトの設定に分かれています。'
      - kind: content-invalid
        code: 1
        when: 'フロントマターか本文が誤っています。プレースホルダが先のファイルを指していないとき、リポジトリの形が誤っているとき、本文がテンプレートに合わないとき（3 ではなく 1 です）も含みます。'
      - kind: content-invalid
        code: 1
        when: '`blocked_by` が、知らない key・輪・後のファイル・重複した前提のどれかを指しています。`wait: merge` に reason が無いときと、ファイルに `parallel` があるときも含みます。'
      - kind: repo-not-in-project
        code: 1
        when: 'リポジトリがプロジェクトにつながっていません。'
      - kind: order-conflict
        code: 1
        when: '親 Epic の別の Issue が同じ order を持っています。一括の 2 つのファイルが同じ order を持つときも含みます。'
      - kind: dependency-unreadable
        code: 1
        when: '`blocked_by` に書いた Issue を読めません。'
      - kind: dependency-rejected
        code: 1
        when: 'GitHub Enterprise Server が Issue の依存関係に対応していません。'
      - kind: partial-failure
        code: 1
        when: 'blocked-by を足せなかった Issue があります。'
      - kind: other
        code: 1
        when: 'テンプレートが見つかりません。'
      - kind: invalid-input
        code: 2
        when: '`freeform` に `message` か `repo` がありません。`freeform` をファイル・`title` と一緒に渡したときも含みます。リポジトリが `owner/repo` の形でないときも含みます。`parent_epic` の形が誤っているときと、ほかの引数の誤りも含みます。'
      - kind: repo-setting-missing
        code: 2
        when: 'Epic の作り先を決められません。設定に `aggregation_repo` が無く、`repo` もありません。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '一括の途中で Issue の作成に失敗すると、先のファイルから作った Issue は GitHub に残り、後のファイルは処理しません。Issue が無くてもできる確認は、すべて最初の Issue を作る前に行います。そのため、誤ったファイルが 1 つあると一括の全体が止まります。blocked-by を足せなかったときは、`warnings` に入れ、ほかの blocked-by と次のファイルを処理します。最後のファイルの後で、`kind` が `partial-failure` の失敗を返し、`detail` に付け直す `issue_block` の呼び方を入れます。プロジェクトのボードに足せなかったときは、`warnings` に入れます。Issue は残り、フィールドと列の設定は飛ばし、親 Epic へのつなぎは行って、次のファイルを処理します。親 Epic へのつなぎに失敗したときは、Issue はフィールドを設定した状態でボードに残ります。`detail` には、次の内容の文が加わります。手で親へつなぐまで、題の order は次の採番で数えません。ファイルに `blocked_by` があるのにサーバが Issue の依存関係に対応していないときは、何も作らずに失敗を返します。Issue の作成が途中で失敗したときは、既に作った Issue どうしの blocked-by だけを足します。失敗がボードへの追加だけのときは、成功を返します。失敗の結果の `issues` にも、それまでに作った Issue が入ります。'
    effects:
      - target: github
        kind: write
        what: 'Issue を作り、blocked-by を足し、プロジェクトのボードに足します。フィールドを設定し、親 Epic の sub-issue としてつなぎます。前提が済んでいる Issue は、Blocked から Ready へ動かします。'
      - target: github
        kind: read
        what: '次のものを読みます。プロジェクトにつながっているリポジトリ。親 Epic の sub-issue。`blocked_by` に書いた Issue。既存の Issue を指す Issue の前提。'
      - target: file
        kind: read
        what: 'Markdown ファイル、テンプレート、アクティブな設定ファイルを読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: false
    examples:
      - arguments:
          files:
            - .pecot/work/12/issue-a.md
            - .pecot/work/12/issue-b.md
        note: '渡した順に、Issue を 2 件作ります。'
      - arguments:
          freeform: true
          repo: example-org/my-repo
          message: Fix the status column of the list
        note: '自由な形式のメッセージから Issue を 1 件作ります。'
      - arguments:
          title: Add a report
          repo: example-org/my-repo
          message: <body>
        note: 'ファイルを使わずに、引数から Issue を 1 件作ります。'
    default_notes:
      status: '省くと、type で決まります。`task` と `bug` は `ready`（ファイルに `blocked_by` があれば `blocked`）で、`epic` と `tracker` は `backlog` です。ほかの値を渡すと、失敗を返します。'
      repo: '`message` では、type が `epic` のときだけ省けます。省くと、Epic をアクティブなプロジェクトの `aggregation_repo` に作ります。`aggregation_repo` が未設定なら、省けません。'
      parent_epic: '整数は、`aggregation_repo` の Issue として解決します。`aggregation_repo` が未設定なら、新しい Issue のリポジトリで解決します。`owner/repo/N` の形は、そのまま使います。'
    behaviors:
