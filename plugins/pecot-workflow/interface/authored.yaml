        statement: '新しくリンクしたリポジトリがあるプロジェクトを同期すると、そのリポジトリを設定ファイルの末尾に足します'
      - id: PW-PROJECT-ACTIVATE-12
        pattern: unwanted
        statement: 'もし `--host` が要る場面で渡していないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-ACTIVATE-13
        pattern: unwanted
        statement: 'もし指定したプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PROJECT-ACTIVATE-14
        pattern: unwanted
        statement: 'もし指定したプロジェクトが初期化されていないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-ACTIVATE-15
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-PROJECT-ACTIVATE-16
        pattern: unwanted
        statement: 'もし渡した設定ファイルを読めないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-ACTIVATE-17
        pattern: unwanted
        statement: 'もし `--host` が渡した設定ファイルの `host` と違うなら、`warning` の行を標準エラーに出します'
      - id: PW-PROJECT-ACTIVATE-18
