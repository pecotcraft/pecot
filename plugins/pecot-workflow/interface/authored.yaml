        what: 'リンクのパスに既にあるシンボリックリンクは置き換えます。worktree の `.pecot/.gitignore` を書き、追跡していない既存のものは置き換えます。'
      - target: file
        kind: destructive
        what: 'リンクのパスにある実体のファイルかディレクトリを消します。消すのは、`force` で許したものです。'
      - target: process
        kind: destructive
        what: '`.pecot/.gitignore` を書くスクリプトを動かします。'
    prerequisites:
