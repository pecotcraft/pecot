        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-SESSION-START:
    help:
      details:
        - Creates a branch linked to an Issue through the GitHub GraphQL API (createLinkedBranch), so the branch shows in the Development section of the Issue.
        - The Issue reference must be the full form owner/repo/N.
        - The branch is named <branch>/<N>, with the Issue number appended.
        - Before the branch is created, the readiness of the Issue is read in the same way as pecot issue show.
        - "When the readiness is stackable, the branch starts from the head of the branch of the PR it stacks on, and the created line ends with (stacked on #N)."
        - When the readiness is startable, or the Issue has no readiness (an Epic or a Tracker), the branch starts from the head of --base, or from the develop_branch of the repository in the config file without --base.
        - develop_branch and --base are required only after the readiness is decided, and only when the branch is not stacked.
        - When the readiness is blocked, no branch is created; the command writes the reason, the unfinished prerequisites and how to fix it, and stops, even when develop_branch is not set.
        - The fix is one unblock line for each unfinished prerequisite, and one line to stack on it for each prerequisite that waits for merge, each with the reference of that Issue.
        - When the branch of the PR to stack on is gone after the readiness is decided, the command writes an error line with the name of the branch and the Issue, and stops.
        - --base is compared with the base chosen by readiness only when the readiness is stackable, and a different --base stops the command.
        - When the GitHub Enterprise Server does not support issue dependencies, the readiness is not read, a warning line says so, and the branch starts as for an Issue without prerequisites.
        - After the branch is created, the Status of the Issue on the board is set to active.
        - A failure to set the Status does not stop the command.
        - After that, the session title of the Issue is cached in .pecot/state/.pecot-session-title, and .pecot/work/<N>/ is created; a created line for the work directory is written even when it already exists.
        - The work Issue is not recorded in a file; it is found from the git remote and the number that ends the branch name, so .pecot/state/.pecot-active is not written.
        - A failure to record the work target does not stop the command.
        - When the work target is recorded, the chosen base is written to .pecot/state/.pecot-base as <branch> <sha>, followed by owner/repo#N of the Issue it stacks on when the branch is stacked.
        - .pecot/state/.pecot-base is removed before the work target is recorded, so that it never keeps the record of the previous Issue.
        - The repository of the working directory git remote must be the repository of the Issue; no option skips this check, but the check is not made when the owner/repo cannot be read from the URL of the remote.
        - The repository must be registered in the selected project.
        - --checkout and --no-checkout are kept for compatibility and have no effect.
        - The global pecot --repo must match the repository of the current git remote.
        - "When the owner/repo cannot be read from the URL of the remote, --repo is not compared with it: with --repo the command prints a warning and continues, and without --repo it stops."
        - This command does not take its target from --repo.
        - With --dry-run, reads the Issue, its prerequisites and the base commit, and prints dry-run lines for creating the branch, setting the Status and creating the work directory, and writes nothing.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot session start example-org/my-repo/123 feat/my-change
          note: Create the branch feat/my-change/123 from the develop branch.
        - run: pecot session start example-org/my-repo/123 fix/my-bug --base main
          note: Create the branch fix/my-bug/123 from main.
        - run: pecot session start example-org/my-repo/123 feat/my-change --dry-run
          note: Show the planned branch and Status change without creating them.
      default_notes:
        base: The branch of the PR the Issue stacks on when its readiness is stackable; otherwise the develop_branch of the repository in the config file, and without it the command stops with exit status 1.
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: Issue に紐づいたブランチを作ります。
    arguments:
      base: '分岐元のブランチです。'
      branch: '作るブランチの名前です。'
      checkout: '互換のために残した引数で、何も変わりません。'
      issue_ref: 'Issue の参照です。`owner/repo/123` の形で渡します。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'GitHub の GraphQL API（`createLinkedBranch`）で、Issue に紐づいたブランチを作ります。ブランチは、Issue の Development の欄に出ます。'
      - '`issue_ref` は、フル形式の `owner/repo/N` でなければなりません。'
      - 'ブランチの名前は、Issue の番号を後ろに付けた `<branch>/<N>` です。'
      - 'ブランチを作る前に、`issue_show` と同じ方法で Issue の着手の判定を読みます。'
      - '判定が `stackable` のときは、積む先の PR のブランチの先頭から分岐し、積んだ先の Issue の番号を `stackedOn` に入れます。'
      - '判定が `startable` のときと、判定の無い Issue（Epic か Tracker）のときは、`base` の先頭から分岐します。`base` が無ければ、設定ファイルにあるそのリポジトリの `develop_branch` の先頭から分岐します。'
      - '`develop_branch` と `base` が要るのは、判定が決まった後で、ブランチを積まないときだけです。'
      - '判定が `blocked` のときは、ブランチを作りません。`kind` が `not-ready` の失敗を返し、`detail` に理由・済んでいない前提・直し方を入れます。`develop_branch` が未設定でも同じです。'
      - '直し方は、済んでいない前提ごとの unblock の案内と、マージを待つ前提ごとの積む案内です。どの案内にも、その Issue の参照を添えます。'
      - '判定が決まった後で積む先の PR のブランチが無くなったときは、ブランチと Issue の名前を `detail` に入れて失敗を返します。'
      - '`base` を判定が選んだ分岐元と比べるのは、判定が `stackable` のときだけです。違う `base` を渡すと、失敗を返します。'
      - 'GitHub Enterprise Server が Issue の依存関係に対応していないときは、判定を読まず、`warnings` で知らせます。ブランチは、前提の無い Issue と同じように分岐します。'
      - 'ブランチを作った後、ボード上の Issue の Status を `active` にします。'
      - 'Status の設定に失敗しても、成功を返します。'
      - 'その後、Issue のセッション名を `.pecot/state/.pecot-session-title` に記録し、`.pecot/work/<N>/` を作ります。作業ディレクトリがすでにあっても、`workDirectory` に入れます。'
      - '作業中の Issue はファイルに記録しません。git remote とブランチ名の末尾の番号から求めるので、`.pecot/state/.pecot-active` は書きません。'
      - '作業対象の記録に失敗しても、成功を返します。'
      - '作業対象を記録したときは、選んだ分岐元を `.pecot/state/.pecot-base` に `<branch> <sha>` の形で書きます。ブランチを積んだときは、積んだ先の Issue の `owner/repo#N` を続けて書きます。'
      - '`.pecot/state/.pecot-base` は、作業対象を記録する前に消します。前の Issue の記録を残さないためです。'
      - 'セッションのディレクトリの git remote のリポジトリは、Issue のリポジトリでなければなりません。この確かめを外す入力はありません。ただし、remote の URL から `owner/repo` を読めないときは、確かめません。'
      - 'リポジトリは、選んだプロジェクトに登録されていなければなりません。'
      - '`checkout` は互換のために残したもので、何も変わりません。'
      - '引数 `repo` は、今の git remote のリポジトリと一致していなければなりません。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`warnings` に入れて続け、無ければ失敗を返します。'
      - 'このツールは、対象を `repo` から決めません。'
      - '`dry_run` を付けると、Issue・前提・分岐元の commit まで読み、作るブランチの名前を `branch` に入れて、何も書きません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
