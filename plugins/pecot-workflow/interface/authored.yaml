      - id: PW-BRANCH-DELETE-11
        pattern: unwanted
        statement: 'もし削除するブランチが既定ブランチ・`develop_branch`・`release_branch` のどれかなら、`kind` が `guard-blocked` の失敗を返します'
      - id: PW-BRANCH-DELETE-12
        pattern: unwanted
        statement: 'もし `repo` が `owner/repo` の形でないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-BRANCH-DELETE-13
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-BRANCH-DELETE-14
        pattern: unwanted
