format: 1
plugin: pecot-workflow
prose: ja
environment:
  - name: PECOT_GITHUB_API_URL
    effect: 'GitHub API のリクエストを、本物のホストではなくこの URL に送ります。受け付けるのは `http://127.0.0.1` か `http://localhost` の URL だけです。ほかの値では、サブコマンドが動く前に終了コード 1 で止まります。`--version` と最上位の `--help` は例外で、先に終了コード 0 で終わります。空の値は無視します。'
  - name: PECOT_SESSION_PROJECT_DIR
    effect: '作業ディレクトリが `<値>/.pecot/work` の中にあると、git の toplevel ではなく `<値>` をプロジェクトのルートにします。途中に別の git リポジトリが挟まるときは使いません。`CLAUDE_PROJECT_DIR` があれば、そちらを先に使います。'
  - name: CLAUDE_PROJECT_DIR
    effect: 'あれば、プロジェクトのルートにします。`PECOT_SESSION_PROJECT_DIR` と git の toplevel より先に使います。設定ファイル・アクティブなプロジェクトの設定・作業ディレクトリは、この下で探します。`pecot mcp` は、次の 3 つがそろうとこのディレクトリへ移ります。サーバがプラグインのディレクトリの中で起動されたこと、`COPILOT_SESSION_CWD` が無いこと、`COPILOT_PLUGIN_ROOT` が無いことです。`COPILOT_PLUGIN_ROOT` があるときは、この値を使いません。GitHub Copilot CLI を起動したシェルから引き継いだ値だからです。'
  - name: CLAUDE_PLUGIN_ROOT
    effect: 'プラグインのディレクトリの場所です。`--version` が出す版は、この下の `.claude-plugin/plugin.json` から読みます。worktree のコマンドが動かすスクリプトも、この下で探します。`pecot mcp` では、作業ディレクトリがこのディレクトリか `PLUGIN_ROOT` のディレクトリの中にあるかどうかを見ます。中にあれば、ホストがサーバをセッションのディレクトリではなくプラグインのディレクトリで起動したとみなします。'
  - name: PLUGIN_ROOT
    effect: '`pecot mcp` だけが読みます。Agent Plugins 1.0 の仕様がサーバに約束する、プラグインのディレクトリです。作業ディレクトリがこのディレクトリか `CLAUDE_PLUGIN_ROOT` のディレクトリの中にあるかどうかを見ます。中にあれば、ホストがサーバをセッションのディレクトリではなくプラグインのディレクトリで起動したとみなします。空の値は無視します。'
  - name: COPILOT_PLUGIN_ROOT
    effect: '`pecot mcp` だけが読み、値があるかどうかだけを見ます。あれば、GitHub Copilot CLI がサーバを起動したとみなし、セッションのディレクトリを決めるのに `CLAUDE_PROJECT_DIR` を使いません。空の値は無視します。'
  - name: COPILOT_SESSION_CWD
    effect: '`pecot mcp` だけが読みます。サーバがプラグインのディレクトリ（`CLAUDE_PLUGIN_ROOT`）の中で起動されたときに、起動時に 1 回だけこのディレクトリへ移り、セッションのディレクトリとして扱います。`CLAUDE_PROJECT_DIR` より先に使います。値が既にあるディレクトリでないと、どのツールの呼び出しも終了コード 1 で失敗し、理由に変数の名前と値が出ます。この変数が無い 1.0.106 より古い GitHub Copilot CLI では、どのツールの呼び出しも終了コード 1 で失敗し、理由がアップグレードを求めます。空の値は無視します。'
  - name: PECOT_GITHUB_*_TOKEN
    effect: 'ホストの GitHub トークンを渡します。変数の名前は、`.pecot/config/hosts.json` に書いたそのホストの `env_var` です。書いていなければ、`github.com` は `PECOT_GITHUB_COM_TOKEN`、ほかのホストは `PECOT_GITHUB_<HOST>_TOKEN` です。`<HOST>` は、ホスト名を大文字にして `.` を `_` に替えたものです。変数は、`.pecot/config/.env` を読み込んだ後の環境から読みます。このファイルの行は、既にある環境変数を上書きしません。トークンが見つからないときは、`github.com` には `GITHUB_COM_TOKEN` を使い、その次に `gh auth token` のトークンを使います。トークンが 401 で拒否されると、`gh auth token` のトークンで 1 回だけやり直し、`warning` の行を出します。`GITHUB_COM_TOKEN` のトークンでも同じです。'
  - name: GITHUB_COM_TOKEN
    effect: '`github.com` の GitHub トークンを渡します。使うのは、`github.com` 用の名前の変数が無いときです。その名前は、`.pecot/config/hosts.json` に書いていなければ `PECOT_GITHUB_COM_TOKEN` です。変数は、プロジェクトのルートの `.env` を読み込んだ後の環境から読みます。このファイルの行は、既にある環境変数を上書きしません。このファイルは、`.pecot/config/.env` の後で読み込みます。'
  - name: CLAUDE_PLUGIN_DATA
    effect: '絶対パスのときに、データディレクトリになります。`PLUGIN_DATA`・`XDG_DATA_HOME`・`HOME` より先に使う、最初の候補です。場所を調べるだけでは、ディレクトリを作りません。'
  - name: PLUGIN_DATA
    effect: '絶対パスで、`CLAUDE_PLUGIN_DATA` が無いか使えないときに、データディレクトリになります。`XDG_DATA_HOME` と `HOME` より先に使います。'
  - name: XDG_DATA_HOME
    effect: '絶対パスで、`CLAUDE_PLUGIN_DATA` と `PLUGIN_DATA` のどちらも使えないときに、`<値>/pecot/pecot-workflow` がデータディレクトリになります。`HOME` より先に使います。'
  - name: HOME
    effect: 'データディレクトリの最後の候補です。絶対パスで、ほかの変数がどれも使えないときに、`<値>/.local/share/pecot/pecot-workflow` がデータディレクトリになります。どの変数も使えないときは、データディレクトリを決められません。'
  - name: PATH
    effect: 'git の toplevel の下に `node_modules/.bin/nx` が無いときに、nx の実行ファイルを順に探す場所です。空の要素は、今のディレクトリとして扱います。変数が無いときは、`/bin:/usr/bin` を探します。'
  - name: TERMINAL_WIDTH
    effect: '正の整数のときに、ヘルプとエラーの出力の幅（桁数）になります。`COLUMNS` と端末の幅より先に使います。'
  - name: COLUMNS
    effect: '正の整数で `TERMINAL_WIDTH` が無いときに、ヘルプとエラーの出力の幅（桁数）になります。端末の幅より先に使います。どれも無いときの幅は 80 です。'
entries:
  PW-ADD-TO-PROJECT:
    help:
      details:
        - Adds one Issue to the project board of the active project and then sets its Status field.
        - The Issue reference is owner/repo/N or the short form N.
        - The short form N refers to the Issue of the repository given by the global pecot --repo.
        - Without --repo, the short form N refers to the Issue of the repository of the git remote.
        - The repository of the Issue must be registered in the active project.
        - --status takes backlog, pending, blocked, ready, active, in_review or archived, and the Status is set to that value.
        - An empty --status skips the Status update and only adds the Issue.
        - An Issue that is already on the board is not added twice.
        - A --status value that is not one of these values stops the command before anything is added.
        - A --status value that the board does not define stops the command before anything is added.
      examples:
        - run: pecot add-to-project example-org/my-repo/123
          note: Add the Issue to the board with the Status ready.
        - run: pecot add-to-project example-org/my-repo/123 --status backlog
          note: Add the Issue to the board with the Status backlog.
      default_notes: {}
    summary: Issue をプロジェクトのボードに足し、Status を設定します。
    arguments:
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      status: '足した Issue に設定する Status です。`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
    constraints: []
    details:
      - 'Issue を 1 件、アクティブなプロジェクトのボードに足し、続けて Status の欄を設定します。pecot の外で作った Issue に使います。'
      - 'Issue の参照は、`owner/repo/N` か、短い形の `N` です。'
      - '短い形の `N` は、pecot 全体のオプション `--repo` で渡したリポジトリの Issue を指します。'
      - '`--repo` が無いときの短い形の `N` は、git remote のリポジトリの Issue を指します。'
      - 'Issue のリポジトリは、アクティブなプロジェクトに登録されていなければなりません。'
      - '`--status` は `backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかで、Status をその値にします。'
      - '`--status` を空にすると、Status を設定せず、Issue を足すだけです。'
      - '既にボードにある Issue を、重ねて足すことはありません。'
      - '`--status` がこれらの値のどれでもないと、何も足さずに止まります。'
      - '`--status` の値をボードが定義していないと、何も足さずに止まります。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、足した Issue の結果の行（`added`）と、Status の結果の行（`set`）を出します。`--status` が有効な値でないときは、有効な値を並べた `error` の行を出します。`--status` の値をボードが定義していないときも、`error` の行を出します。値が `blocked` のときは、`hint` の行が `pecot project init` の実行を案内します。'
    environment: []
    exit_status:
      - code: 0
        when: 'Issue をボードに足しました。`--status` が空でなければ、Status も設定しました。'
      - code: 1
        when: '次のどれかです。`--status` が有効な値ではありません。`--status` の値をボードが定義していません。アクティブなプロジェクトがありません。リポジトリがプロジェクトにありません。GitHub API がエラーを返しました。プロジェクトのルートを決められません。'
      - code: 2
        when: '次のどれかです。Issue の参照の形が誤っています。リポジトリが決まらないのに短い形を渡しました。ほかのコマンドラインの誤りがあります。'
    on_error: '`--status` が有効な値でないか、ボードが定義していない値のときは、Issue を足す前に止まります。Issue を足した後で Status の設定に失敗したときは、Issue はボードに残ります。'
    effects:
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリと、Issue の node ID を読みます。'
      - target: github
        kind: write
        what: 'Issue をプロジェクトのボードに足し、Status の欄を設定します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - run: pecot add-to-project example-org/my-repo/123
        note: 'Issue をボードに足し、Status を `ready` にします。'
      - run: pecot add-to-project example-org/my-repo/123 --status backlog
        note: 'Issue をボードに足し、Status を `backlog` にします。'
    default_notes: {}
    behaviors:
      - id: PW-ADD-TO-PROJECT-01
        pattern: event
        statement: 'Issue の参照を渡して打つと、その Issue をアクティブなプロジェクトのボードに足します'
      - id: PW-ADD-TO-PROJECT-02
        pattern: event
        statement: '`--status` を省いて打つと、足した項目の Status を `ready` にします'
      - id: PW-ADD-TO-PROJECT-03
        pattern: event
        statement: '`--status` に値を渡して打つと、足した項目の Status をその値にします'
      - id: PW-ADD-TO-PROJECT-04
        pattern: event
        statement: '`--status` に空文字を渡して打つと、Status を設定せずに Issue だけをボードに足します'
      - id: PW-ADD-TO-PROJECT-05
        pattern: event
        statement: 'Issue の参照に番号だけを渡して `--repo` を付けると、そのリポジトリの Issue を足します'
      - id: PW-ADD-TO-PROJECT-06
        pattern: event
        statement: 'Issue の参照に番号だけを渡して `--repo` を省くと、git の remote のリポジトリの Issue を対象にします'
      - id: PW-ADD-TO-PROJECT-07
        pattern: event
        statement: 'Issue をボードに足すと、`added` の行を標準エラーに出します'
      - id: PW-ADD-TO-PROJECT-08
        pattern: event
        statement: 'Status を設定すると、`set` の行を標準エラーに出します'
      - id: PW-ADD-TO-PROJECT-09
        pattern: unwanted
        statement: 'もし `--status` が 7 つの有効な値のどれでもないなら、有効な値を並べた `error` の行を標準エラーに出します'
      - id: PW-ADD-TO-PROJECT-10
        pattern: unwanted
        statement: 'もし `--status` が `backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれでもないなら、Issue をボードに足しません'
      - id: PW-ADD-TO-PROJECT-11
        pattern: unwanted
        statement: 'もし `--status` が `backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれでもないなら、終了コード 1 で終わります'
      - id: PW-ADD-TO-PROJECT-12
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-ADD-TO-PROJECT-13
        pattern: unwanted
        statement: 'もし Issue の参照が不正なら、終了コード 2 で終わります'
      - id: PW-ADD-TO-PROJECT-14
        pattern: unwanted
        statement: 'もし Issue のリポジトリがプロジェクトに登録されていないなら、終了コード 1 で終わります'
      - id: PW-ADD-TO-PROJECT-15
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-ADD-TO-PROJECT-16
        pattern: unwanted
        statement: 'もし `--status` の値をボードが定義していないなら、Issue をボードに足しません'
      - id: PW-ADD-TO-PROJECT-17
        pattern: unwanted
        statement: 'もし `--status` の値をボードが定義していないなら、終了コード 1 で終わります'
      - id: PW-ADD-TO-PROJECT-18
        pattern: unwanted
        statement: 'もし `--status` が `blocked` でボードが Blocked を定義していないなら、`project init` で足し方を案内する `hint` の行を標準エラーに出します'
  PW-BOARD-SYNC:
    help:
      details:
        - Reads the whole board and moves the open Issues in Ready, Blocked, Active and In Review to the column and Status that their judgment calls for.
        - The judgment, the column move and the Status write are the same as the rest of the workflow (blocked-by, branches and PRs).
        - An Issue with a branch or a PR is never moved; when it is blocked, a warning line says so.
        - An Issue in Backlog, Pending or Archived, a PR card, a Tracker and an Epic are not moved.
        - An Issue whose judgment cannot be read (for example, develop_branch is not set) is not moved, and a warning line gives the reason.
        - Reads each Issue of Blocked, Active and In Review one by one, because the branches and PRs are not in the board list. Skips only the Ready Issues that the list shows with no prerequisites.
        - With --dry-run, prints the same sentences as dry-run lines and writes nothing to the board.
        - The config is --project, else the active project, else the only config in .pecot/config/projects. With two or more configs and no active project, stops and asks for --project.
        - Reads the GraphQL rate limit (REST, no points) before and after the run and prints the points used and the remaining points. When it cannot be read, the line is left out. When the rate limit window resets during the run, or the difference is negative, the points used line is left out.
        - On a GitHub Enterprise Server without Issue dependencies, prints one warning and moves nothing.
      examples:
        - run: pecot board sync --dry-run
          note: Show the planned moves without writing to the board.
        - run: pecot board sync --project example-config
          note: Synchronize the board of the named config, for a checkout without an active project.
      default_notes: {}
    summary: Ready・Blocked・Active・In Review の Issue を、判定に合った列と Status へ動かします。
    arguments:
      dry_run: 'ボードへ書き込まず、動かす予定だけを出すかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。'
    constraints: []
    details:
      - 'ボードの全体を読み、Ready・Blocked・Active・In Review にある open の Issue を、判定が求める列と Status へ動かします。'
      - '判定・列の移動・Status の書き込みは、ワークフローのほかの部分と同じです（blocked-by・ブランチ・PR を見ます）。'
      - 'ブランチか PR のある Issue は動かしません。その Issue が blocked のときは、`warning` の行で知らせます。'
      - 'Backlog・Pending・Archived にある Issue と、PR のカード・Tracker・Epic は動かしません。'
      - '判定を読めない Issue（`develop_branch` が未設定のときなど）は動かさず、`warning` の行に理由を出します。'
      - 'ブランチと PR はボードの一覧に載らないので、Blocked・Active・In Review の Issue は 1 件ずつ読みます。読むのを省くのは、一覧で前提が無いと分かる Ready の Issue だけです。'
      - '`--dry-run` を付けると、同じ文を `dry-run` の行として出し、ボードには何も書きません。'
      - '設定は、`--project` の設定、アクティブなプロジェクト、`.pecot/config/projects` にある唯一の設定の順で選びます。設定が 2 つ以上あってアクティブなプロジェクトが無いときは、止まって `--project` を求めます。'
      - '実行の前後に GraphQL の rate limit を読み（REST なので点数は減りません）、使った点数と残りの点数を出します。読めないときは、その行を省きます。実行中に rate limit の窓が切り替わったときと、差が負のときは、使った点数の行を省きます。'
      - 'Issue の依存関係に対応していない GitHub Enterprise Server では、`warning` を 1 回出し、何も動かしません。'
    stdin: none
    output:
      format: none
    diagnostics: '移動ごとの結果の行（`moved`）と、Status の書き込みごとの結果の行（`set`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。`warning` の行を出すのは、次のときです。ブランチか PR のある Issue が blocked のとき。判定を読めない Issue があるとき。書き込みに失敗したとき。ボードが定義していない値があるとき。GitHub Enterprise Server が Issue の依存関係に対応していないとき。`count` の行には、使った GraphQL の点数と残りを出します。rate limit を読んだ後にエラーで止まったときも出します。最後に、書き込みに失敗した Issue の数を `error` の行で出します。失敗ごとにも `error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: '次のどれかです。書き込みの失敗なしでボードを同期しました。`--dry-run` で予定を出しました。GitHub Enterprise Server が Issue の依存関係に対応していません。判定を読めない Issue があっても、終了コードは変わりません。'
      - code: 1
        when: '次のどれかです。ボードへの書き込みが 1 件以上の Issue で失敗しました（ほかの Issue をすべて同期した後で終わります）。アクティブなプロジェクトが無く、設定も 1 つに決まりません。`--project` の名前の設定がありません。設定ファイルの内容が不正です。ボードを読めません。GitHub トークンが見つかりません。'
      - code: 2
        when: 'コマンドラインの誤りがあります。'
    on_error: '既に書いた移動は残ります。書き込みの失敗は `warning` として扱い、ほかの Issue の同期を続けてから、終了コード 1 で終わります。'
    effects:
      - target: github
        kind: read
        what: 'ボードの項目を読みます。Blocked・Active・In Review の Issue と、前提のある Ready の Issue は、blocked-by・ブランチ・PR も読みます。GraphQL の rate limit も読みます。'
      - target: github
        kind: write
        what: '判定に合っていない Issue の列（pecot-workflow のフィールド）と Status を設定します。'
      - target: file
        kind: read
        what: '設定ファイルを読みます。'
    prerequisites:
      - '`.pecot/config/projects` の下に設定が要ります。アクティブな設定か、`--project` で名前を渡した設定か、唯一の設定を使います。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - run: pecot board sync --dry-run
        note: 'ボードへ書き込まず、動かす予定を出します。'
      - run: pecot board sync --project example-config
        note: '名前を渡した設定のボードを同期します。アクティブなプロジェクトの無いチェックアウトで使います。'
    default_notes: {}
    behaviors:
      - id: PW-BOARD-SYNC-01
        pattern: event
        statement: '打つと、Blocked の Issue の判定が `startable` か `stackable` なら、Ready へ動かします'
      - id: PW-BOARD-SYNC-02
        pattern: event
        statement: 'Ready の Issue に済んでいない前提があると、Blocked へ動かします'
      - id: PW-BOARD-SYNC-03
        pattern: event
