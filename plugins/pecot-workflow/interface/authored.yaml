      - id: PW-ISSUE-READ-12
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-READ-13
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-ISSUE-READ-14
        pattern: event
        statement: '前提がある Issue を読むと、Blocked by と Readiness の 2 行を出します'
      - id: PW-ISSUE-READ-15
        pattern: event
