  PW-ISSUE-UNBLOCK:
    help:
      details:
        - Removes a blocked-by (prerequisite) from an Issue.
        - issue_ref is the waiting Issue and --by is the prerequisite to remove. --by may be in another repository.
        - The command reads the blocked-by of the waiting Issue first. A prerequisite that is not there is not removed, and a stale line in the Waits for merge section is left as it is; pecot issue show warns about the difference.
        - When the section has a line for the prerequisite, the line is removed. A section that becomes empty is removed with its heading.
        - When the section cannot be read, only the blocked-by is removed and a warning says that the section was not changed, because removing is what the user wants.
        - After the writes, the readiness of the waiting Issue is read again, confirmed and used to move the column and the Status label in the same way as pecot issue block.
        - The Status label Needs Attention is set back to Todo only when a prerequisite is left or the removed prerequisite was closed. The label that a person put on for another reason is not removed by removing the last open prerequisite.
        - An Issue that has a branch or a PR is not moved.
        - With --dry-run, writes a dry-run line instead of the result lines. The reads and the checks are still made, and nothing is written.
        - Needs a GitHub Enterprise Server of version 3.19 or later, which has issue dependencies.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot issue unblock example-org/my-repo/12 --by example-org/my-repo/11
          note: Remove the wait of Issue 12 for Issue 11.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'Issue から blocked-by（前提）を外します。'
    arguments:
      by: '外す前提の Issue です。`owner/repo/N` の形で渡します。別のリポジトリの Issue も指せます。'
      dry_run: '何も書き込まずに、書く予定だけを出すかどうかです。'
      issue_ref: '待つ側の Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    constraints: []
    details:
      - 'Issue から blocked-by（前提）を外します。'
      - '`issue_ref` は待つ側の Issue で、`--by` は外す前提です。`--by` は別のリポジトリの Issue でもかまいません。'
      - 'まず、待つ側の Issue の blocked-by を読みます。付いていない前提は外しません。`Waits for merge` の節に残った古い行も、そのままにします。食い違いは `pecot issue show` が `warning` で知らせます。前提が付いていなければ、何も書かずに終了コード 0 で終わります。'
      - '節に前提の行があるときは、その行を外します。節が空になったときは、見出しごと消します。'
      - '節を読めないときは、blocked-by だけを外し、節を直していない旨を `warning` で知らせます。外すことが利用者の求めることだからです。'
      - '書き込みの後で、待つ側の Issue の判定を読み直して確かめ、`pecot issue block` と同じやり方で、列と Status の札を動かします。'
      - 'Status の札の `Needs Attention` を `Todo` に戻すのは、前提が残っているときか、外した前提が閉じていたときだけです。人がほかの理由で付けた札は、開いた最後の前提を外しても外しません。'
      - 'ブランチか PR のある Issue は動かしません。'
      - '`--dry-run` を付けると、結果の行の代わりに `dry-run` の行を出します。読み取りと確認は行い、何も書き込みません。'
      - 'Issue の依存関係を持つ GitHub Enterprise Server の 3.19 以上が要ります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        issue: '待たせていた側の Issue です。`owner/repo/N` の形です。'
        by: '前提の Issue です。`owner/repo/N` の形です。'
        change: 'blocked-by がどうなったかです。`removed`（外した）か `unchanged`（もともと blocked-by ではなかった）です。'
        moves: '待つ側の Issue の列か Status を書いたときに、その 1 件を入れる配列です。要素は `board_sync` の `moves` と同じです。書かなかったときは空です。判定を確かめられなかったときと、ボードに書けなかったときも空で、理由は `warnings` に入ります。`dry_run` のときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、結果の行を出します。blocked-by には `removed` か `unchanged` を出し、列か札を変えたときは続けて `moved` と `set` を出します。`warning` の行は、次のときに出します。`Waits for merge` の節を読めないとき。判定を出せないか、確かめられないとき。ボードに Todo の選択肢が無いとき。ボードに書けなかったとき。Todo が無いときは、`pecot project init` の実行を案内する `hint` の行が続きます。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: repo-not-in-project
        code: 1
        when: '待つ側の Issue のリポジトリがプロジェクトにありません。'
      - kind: dependency-unreadable
        code: 1
        when: 'blocked-by を全部は読めませんでした。'
      - kind: dependency-rejected
        code: 1
        when: 'GitHub Enterprise Server が Issue の依存関係に対応していません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '前提を外した後で本文の書き込みに失敗したときは、blocked-by は外れたままで、終了コード 1 で終わります。ボードに書けないときは、blocked-by と本文は残り、`warning` を出すだけです。選択肢の ID が古くて書けないときは、ID を読み直す `project activate` の案内を添えます。節かボードに関する `warning` だけのときは、終了コード 0 で終わります。'
    effects:
      - target: github
        kind: write
        what: 'blocked-by を外し、待つ側の Issue の本文を書き換え、そのボードの項目の列と Status の札を設定します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、待つ側の Issue の blocked-by と本文、読み直した判定、ボードの項目を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: "pecot issue unblock example-org/my-repo/12 --by example-org/my-repo/11"
        note: 'Issue 12 が Issue 11 を待つのをやめます。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-UNBLOCK-01
        pattern: event
        statement: 'Issue の参照と `--by` を渡すと、blocked-by から前提を外して `removed` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-02
        pattern: event
        statement: '付いていない前提を打つと、何も書き込まずに `unchanged` の行を標準エラーに出し、節に残った古い行も書き換えません'
      - id: PW-ISSUE-UNBLOCK-03
        pattern: event
        statement: '節に前提の行があるものを外すと、その行を節から消し、節が空になれば節ごと消します'
      - id: PW-ISSUE-UNBLOCK-04
        pattern: event
        statement: '前提を外した後に判定が変わると、待つ側の Issue の列を動かして `moved` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-05
        pattern: event
        statement: '札が `Needs Attention` で、残りの前提がある、または外した前提が閉じていると、札を `Todo` にして `set` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-06
        pattern: unwanted
        statement: 'もし外したのが開いた最後の前提なら、札が `Needs Attention` でも `Todo` に戻しません'
      - id: PW-ISSUE-UNBLOCK-07
        pattern: unwanted
        statement: 'もし待つ側の Issue に着手の跡があるなら、前提は外して列と札を動かしません'
      - id: PW-ISSUE-UNBLOCK-08
        pattern: event
        statement: '`--dry-run` を付けて打つと、書き込みを送らずに `dry-run` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-09
        pattern: unwanted
        statement: 'もし本文の `Waits for merge` の節が読めないなら、前提だけを外し、節を直していない旨を `warning` の行で標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-10
        pattern: unwanted
        statement: 'もし読み直した前提が書いた内容と 2 回続けて合わないなら、列と札を動かさずに `warning` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-11
        pattern: unwanted
        statement: 'もし動かす先の値がボードに無いなら、`warning` の行と、`project init` で足し方を案内する `hint` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-12
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-13
        pattern: unwanted
        statement: 'もし Issue の参照の形が誤っているなら、終了コード 2 で終わります'
      - id: PW-ISSUE-UNBLOCK-14
        pattern: unwanted
        statement: 'もしリポジトリがプロジェクトに無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-15
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-16
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、または本文の書き込みに失敗したなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-17
        pattern: event
        statement: '`--by` でプロジェクトの外のリポジトリの Issue を指すと、プロジェクトに入っているかは待つ側のリポジトリだけ確かめ、前提を外します'
      - id: PW-ISSUE-UNBLOCK-18
        pattern: event
        statement: 'MCP で呼ぶと、書いた列と札を `moves` で返し、書かなかったときは空の `moves` を返します。`dry_run` のときは `moves` を返しません'
      - id: PW-ISSUE-UNBLOCK-19
        pattern: unwanted
        statement: 'もし列を書けないなら、`warning` の行を出し、前提を外したまま終了コード 0 で終わります。選択肢の ID が古くて書けないときは、ID を読み直す `project activate` の案内を添えます'
  PW-PR-CHECK:
    help:
      details:
        - Prints the information to check before creating a PR for the repository given by --directory.
        - "Prints 11 sections in a fixed order: Git Remote, Current Branch, Push Status, Base Branch, Git Status, .gitignore, Git Exclude, Commits, Diff Summary, Worktree Info and Stash List."
        - The base branch is <remote>/ followed by the develop_branch of the active project, where <remote> is the origin remote, or the first remote when there is no origin.
        - "When the base record of a stacked start exists, the base branch is <remote>/ followed by the branch of the layer below instead. When the remote reports that branch no longer exists, it is <remote>/ followed by the develop_branch, even if a stale remote-tracking ref remains. When the remote cannot be reached, the remote-tracking ref decides."
        - "When .pecot/state/.pecot-base of the worktree of the working directory is missing, the stacked base is inferred. When the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the branch counts as stacked on it. Otherwise it counts as started from the develop_branch. A warning line cannot infer the stacked base is printed when the readiness cannot be read or is blocked, when GitHub cannot be reached, or when the remote-tracking ref is missing. The inferred base is not written."
        - "The query to the remote about the branch of the layer below times out after 10 seconds and never asks for credentials (GIT_TERMINAL_PROMPT=0 and the askpass programs are disabled). A timeout is handled the same as a remote that cannot be reached."
        - "When the branch of the layer below is on the remote but has no remote-tracking ref, compares with the develop_branch and prints a warning that tells to run git fetch. This warning is not counted in the preflight warnings."
        - "When the base record is malformed, stops with exit status 1 because the base cannot be decided."
        - Prints every section even when there are warnings.
        - Counts a warning for a branch that is not pushed or has diverged, for modified or untracked files, and for stash entries.
        - "When the base record of a stacked start exists and the branch has diverged from the remote, reads the PR of the layer below and the head of that branch on the remote, and decides whether a restack is needed in the same way as pr restack. Besides inferring a missing base record, this is the only case that reads GitHub. The fix of the Push Status warning is pr restack when a restack is needed, and pr restack --check when it cannot be decided, which includes the case where the branch of the layer below is gone from the remote and its PR is not merged."
        - "When the branch is already on the new base and only the base record is old, the fix of the Push Status warning is pr restack, which pushes the branch and rewrites the record."
        - "When the branch has diverged and needs no restack otherwise, including a branch that is not stacked, the fix of the Push Status warning is git pull --rebase, or git push --force-with-lease after rewriting pushed commits, because git rejects a push that is not a fast-forward."
        - Exits with status 2 when there is at least one warning.
        - Reads the repository and the config and changes nothing.
      examples:
        - run: pecot pr check -D .
          note: Check the current repository before creating a PR.
      default_notes: {}
    summary: PR を作る前に確かめる情報を、まとめて出します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
    constraints: []
    details:
      - '`--directory` のリポジトリについて、PR を作る前に確かめる情報を出します。'
      - '11 の節を決まった順で出します。節は、Git Remote・Current Branch・Push Status・Base Branch・Git Status・.gitignore と続きます。その後は、Git Exclude・Commits・Diff Summary・Worktree Info・Stash List です。'
      - 'base ブランチは、`<remote>/` の後にアクティブなプロジェクトの `develop_branch` を続けたものです。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - '積んで着手した記録があるときは、base ブランチは、`<remote>/` の後に下の段のブランチを続けたものです。remote がそのブランチは無いと答えれば（マージで消えた後）、手元に追跡参照が残っていても `develop_branch` の方にします。remote に届かなければ、手元の追跡参照の有無で決めます。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチに積んだものとします。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`warning: cannot infer the stacked base` の行を出します。求めた結果は書きません。'
      - '下の段のブランチについての remote への問い合わせには、10 秒の時間切れがあり、認証の入力は求めません（`GIT_TERMINAL_PROMPT=0` と askpass の無効化）。時間切れは、remote に届かないときと同じに扱います。'
      - '下の段のブランチが remote にあり、手元に追跡参照が無いときは、`develop_branch` と比べ、`git fetch` を案内する `warning` の行を出します。この行は `count: preflight warnings` の数に入りません。'
      - '積んだ base の記録の形が誤っているときは、base を決められないので、終了コード 1 で止まります。'
      - '`warning` があっても、すべての節を出します。'
      - '`warning` として数えるのは、push していないか remote とずれたブランチ、変更したファイルか追跡していないファイル、stash の項目です。'
      - '積んで着手した記録があり、ブランチが remote とずれているときは、下の段の PR と remote の先頭を読み、`pr restack` と同じに載せ直しの要否を決めます。GitHub を読むのは、このときと、記録が無く積んだ先を求めるときだけです。'
      - 'Push Status の直し方は、載せ直しが要れば `pr restack`、決められなければ `pr restack --check` です。下の段のブランチが remote から消え、PR がマージされていないときも、決められないに入ります。'
      - 'ブランチが新しい base の上に載り終えていて記録だけが古いときも、Push Status の直し方は `pr restack` です。push と記録の書き直しを `pr restack` が行うためです。'
      - 'ほかに、ブランチが remote とずれて載せ直しが要らないときは、Push Status の直し方は `git pull --rebase` です。push 済みのコミットを書き換えたなら `git push --force-with-lease` です。積んでいないブランチも同じです。git は fast-forward でない push を拒むためです。'
      - '`warning` が 1 件以上あると、終了コード 2 で終わります。'
      - 'リポジトリと設定を読むだけで、何も変えません。'
    stdin: none
    output:
      format: text
      description: '11 の節です。それぞれ `=== <title> ===` の行に内容が続き、節の間は空行で区切ります。'
    mcp_output:
      fields:
        remoteUrl: '主な git remote の URL です。'
        currentBranch: '今のブランチです。'
        pushed: '今のブランチを push 済みで、リモートのブランチと同じかどうかです。'
        pushStatus: 'Push Status の節に出す文です。'
        baseBranch: '比べる相手のリモートブランチです。`remote/branch` の形です。積んでいるときは下の段、そうでなければ develop ブランチです。'
        gitStatus: '`git status` の出力です。'
        commits: 'ベースブランチからのコミットです。Commits の節に出す文です。'
        diffSummary: 'ベースブランチとの差分の統計です。Diff Summary の節に出す文です。'
        worktree: 'worktree の情報です。`list`（`git worktree list` の出力）と `directoryName`（今のディレクトリの名前）を持ちます。リンクされた worktree かどうかを示す `isWorktree` は、判定できたときだけ入ります。'
        stashList: 'stash の一覧です。Stash List の節に出す文です。'
    diagnostics: '標準エラーに、`warning` の数の `count` の行を出し、続けて `warning` ごとに行を 1 つ出します。行の形は `<label>: <message> (fix: <hint>)` です。下の段のブランチに手元の追跡参照が無いときは、`git fetch` を案内する `warning` の行を足します。この行は数に入りません。記録が無く積んだ先を求められないときは、`warning: cannot infer the stacked base: <理由>` の行を出します。'
    environment: []
    exit_status:
      - kind: git-unresolved
        code: 1
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` が未設定です。'
      - kind: git-unresolved
        code: 1
        when: '`<remote>/<develop_branch>` がありません。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - kind: content-invalid
        code: 1
        when: '積んだ base の記録の形が誤っています。'
      - kind: preflight-failed
        code: 2
        when: '`warning` が 1 件以上あります。'
      - kind: invalid-input
        code: 2
        when: '`--directory` が無いか、ほかのコマンドラインの誤りがあります。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: 'remote・ブランチ・push の状態・status・base との log と差分・worktree の一覧・stash の一覧を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイル、`.gitignore`、`.git/info/exclude` を読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ローカルのリポジトリに `<remote>/<develop_branch>` が要ります。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
    idempotent: true
    examples:
      - run: pecot pr check -D .
        note: 'PR を作る前に、今のリポジトリを確かめます。'
    default_notes: {}
    behaviors:
      - id: PW-PR-CHECK-01
        pattern: event
        statement: '`--directory` でリポジトリを指すと、11 の節を決まった順で標準出力に出します'
      - id: PW-PR-CHECK-02
