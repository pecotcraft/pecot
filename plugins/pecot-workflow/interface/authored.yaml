        statement: nx のリポジトリで --prepare を付けて打つと、タイトルの行に scope の目安をコメントで足す
      - id: PW-PR-CREATE-05
        pattern: event
        statement: default のテンプレで --prepare を付けて打つと、末尾の Closes に着手中の Issue の番号を入れる
      - id: PW-PR-CREATE-06
        pattern: event
        statement: 着手中の Issue が Epic のときに --prepare を付けて打つと、Closes を空のままにする
      - id: PW-PR-CREATE-07
        pattern: event
        statement: 着手中の Issue が Epic のときに --prepare を付けて打つと、warning の行を標準エラーに出す
      - id: PW-PR-CREATE-08
        pattern: event
        statement: --prepare とファイルを一緒に渡すと、PR を作らずにテンプレのコピーだけを書く
      - id: PW-PR-CREATE-09
