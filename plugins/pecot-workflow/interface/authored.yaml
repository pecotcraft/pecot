  PW-ISSUE-CREATE:
    help:
      details:
        - "Has three modes: --prepare, files and -m."
        - When more than one mode is given, --prepare wins over the files and the files win over -m.
        - With --prepare, copies the template given by --template to .pecot/tmp/output/ and prints its path.
        - With --prepare and --repo, fills the repository line of the copy with the given repository.
        - With --prepare and --suffix, appends the suffix to the file name of the copy.
        - With files, creates one Issue per file in the order given.
        - With files, the front matter decides the type, repository, status, priority, size, parent Epic, order, labels and blocked_by, and the options of the same names are ignored.
        - Before the first Issue of a batch is created, checks that every file exists, that none is given twice, that every {{issue:key}} placeholder points to an earlier file, and that every front matter and body is valid.
        - Before the first Issue of a batch is created, also checks blocked_by, the order numbers and the repository link, and reads the parent Epics and the existing Issues named in blocked_by.
        - Each blocked_by entry names an earlier file of the batch by its key (the stem of the file name, or the suffix given to --prepare) or an existing Issue as owner/repo/N, with wait stack (the default) or wait merge and a reason.
        - Adds each blocked_by entry to the created Issue as blocked-by, right after the Issue is created.
        - For a wait merge entry, writes a line with the prerequisite and the reason into the Waits for merge section of the body, and nothing for a wait stack entry.
        - A task or bug with blocked_by is placed in the Blocked column and one without it in the Ready column, unless the board has no Blocked column; then it is placed in Ready with one warning.
        - After the blocked-by of a Blocked Issue that names an existing Issue are added, reads whether it can start, and moves it to the Ready column when it can. Leaves it in Blocked when the judgement cannot be read.
        - An Issue with a parent Epic and no order gets the highest order in use under that Epic plus one, in the order of the files. A branch letter such as 18a counts as its number. The title carries only the serial number.
        - With --plan and files, prints a table of the files with their numbers, blocked-by and approach (alone, stack on, wait for merge, join), and the stackable chains, without creating anything.
        - After posting, prints the stackable chains of the created Issues when every blocked-by was added.
        - The parallel field is not supported; a file that has it is rejected.
        - A {{issue:key}} placeholder in a body expands to the number of the Issue created from the earlier file with that key.
        - With -m, creates one Issue from --title, the body, --repo and --type.
        - With -m, --repo is required unless --type is epic.
        - The body must follow the template of the Issue type.
        - The status at creation can only be the default of the type, or blocked for a task or bug with blocked_by.
        - An Epic is created in aggregation_repo when no repository is given.
        - Creating an Epic in a repository other than aggregation_repo gives a warning and continues.
        - Adds each created Issue to the project board and sets its status, priority and size.
        - With a parent Epic, links each created Issue as a sub-issue of it.
        - With a parent Epic and --order, stops when another Issue of that Epic has the same order.
        - With files, stops when two files of the batch have the same order under the same parent Epic.
      examples:
        - run: pecot issue create --prepare --template task --repo example-org/my-repo
          note: Write a task template and print its path.
        - run: pecot issue create .pecot/work/12/issue-a.md .pecot/work/12/issue-b.md
          note: Create two Issues in the order given.
        - run: pecot issue create --plan .pecot/work/12/issue-a.md .pecot/work/12/issue-b.md
          note: Show the progression table and the stackable chains without creating anything.
        - run: pecot issue create -t "Add a report" -r example-org/my-repo -m "<body>"
          note: Create one Issue from the command line.
      default_notes:
        status: "Decided by the type: ready for task and bug (blocked when the file has blocked_by), backlog for epic and tracker. Any other value stops the command with exit status 1."
        repo: Required with -m and --prepare unless the type is epic. An Epic goes to aggregation_repo of the active project; when that is not set, --repo is required.
        parent_epic: An integer is resolved against aggregation_repo, or against the repository of the new Issue when aggregation_repo is not set. The form owner/repo/N is used as it is.
    summary: フロントマター付きの Markdown ファイルから Issue を作ります。
    arguments:
      files: 'フロントマター付きの Markdown ファイルのパスです。複数渡すと、まとめて投稿します。'
      label: 'ラベルです。繰り返して複数渡せます。'
      message: 'Issue の本文です。コマンドラインから直接投稿するときに渡します。'
      order: 'サブタスクの順番の番号です。`parent_epic` と一緒に使います。'
      parent_epic: '親 Epic の参照です。整数か、`owner/repo/N` の形で渡します。'
      plan: '投稿せずに、ファイルの進め方の表と積める並びを出すかどうかです。'
      prepare: 'テンプレートを作業用のディレクトリにコピーするかどうかです。'
      priority: '優先度です。`high`・`medium`・`low` のどれかを渡します。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。'
      size: 'サイズです。`xs`・`s`・`m`・`l` のどれかを渡します。'
      status: 'Status です。`backlog`・`pending`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
      suffix: '出力するファイルの名前に付ける接尾辞です。`--prepare` のときだけ使います。'
      template: 'テンプレートの種類です。`--prepare` のときに、`task`・`bug`・`epic`・`tracker`・`task-implement` のどれかを渡します。'
      title: 'Issue の題です。コマンドラインから直接投稿するとき（`-m`）は必須です。'
      type: 'Issue の種類です。`task`・`bug`・`epic`・`tracker` のどれかを渡します。'
    constraints:
      - requires: {message: [title]}
      - requires: {plan: [files]}
      - conflicts: [plan, message]
      - conflicts: [plan, prepare]
    details:
      - 'モードは、`--prepare`・ファイル・`-m` の 3 つです。'
      - '複数のモードを渡すと、`--prepare` がファイルより優先され、ファイルが `-m` より優先されます。'
      - '`--prepare` では、`--template` のテンプレートを `.pecot/tmp/output/` にコピーし、そのパスを出します。'
      - '`--prepare` に `--repo` を付けると、コピーの repository の行に、渡したリポジトリを入れます。'
      - '`--prepare` に `--suffix` を付けると、コピーのファイル名の後ろに接尾辞を付けます。'
      - 'ファイルでは、渡した順に、ファイルごとに Issue を 1 件作ります。'
      - 'ファイルでは、type・リポジトリ・status・priority・size・親 Epic・order・ラベル・`blocked_by` をフロントマターで決めます。同じ名前のオプションは無視します。'
      - '一括の最初の Issue を作る前に、次のことを確かめます。どのファイルもあること。同じファイルを重ねて渡していないこと。どの `{{issue:key}}` も先のファイルを指すこと。どのフロントマターと本文も正しいこと。'
      - '一括の最初の Issue を作る前に、`blocked_by`・order の番号・リポジトリのつながりも確かめます。親 Epic と、`blocked_by` に書いた既存の Issue も読みます。'
      - '`blocked_by` の各要素は、一括の中の先のファイルを key で指すか、既存の Issue を `owner/repo/N` で指します。key は、ファイル名の拡張子を除いた部分か、`--prepare` に渡した接尾辞です。各要素には、`wait: stack`（既定）か `wait: merge` と、reason を書きます。'
      - '`blocked_by` の各要素は、Issue を作った直後に、その Issue の blocked-by として足します。'
      - '`wait: merge` の要素では、前提と reason の行を本文の Waits for merge の節に書きます。`wait: stack` の要素では何も書きません。'
      - '`blocked_by` のある task か bug は Blocked の列に、無いものは Ready の列に置きます。ボードに Blocked の列が無いときは、`warning` を 1 回出して Ready に置きます。'
      - '既存の Issue を指す Blocked の Issue は、blocked-by を足した後で、着手できるかどうかを読みます。着手できるなら、Ready の列へ動かします。判定を読めないときは、Blocked のまま残します。'
      - '親 Epic があって order の無い Issue には、その Epic で使われている最大の order の次の番号を、ファイルの順に振ります。`18a` のような枝の文字が付いた番号は、その数字として数えます。題には、通し番号だけを入れます。'
      - '`--plan` とファイルでは、何も作らずに、ファイルの表と積める並びを出します。表には、番号・blocked-by・進め方（単独・積む・マージを待つ・合流）を載せます。'
      - '投稿の後、すべての blocked-by を足せたときは、作った Issue の積める並びを出します。'
      - '`parallel` の欄には対応していません。この欄のあるファイルは受け付けません。'
      - '本文の `{{issue:key}}` は、その key の先のファイルから作った Issue の番号に展開します。'
      - '`-m` では、`--title`・本文・`--repo`・`--type` から Issue を 1 件作ります。'
      - '`-m` では、`--type` が `epic` でなければ `--repo` が必須です。'
      - '本文は、Issue の種類のテンプレートに合っていなければなりません。'
      - '作るときの status にできるのは、type の既定の値だけです。`blocked_by` のある task か bug では、`blocked` にもできます。'
      - 'Epic は、リポジトリを渡さないと `aggregation_repo` に作ります。'
      - '`aggregation_repo` 以外のリポジトリに Epic を作ると、`warning` を出して続けます。'
      - '作った Issue は、それぞれプロジェクトのボードに足し、status・priority・size を設定します。'
      - '親 Epic があるときは、作った Issue をそれぞれ親 Epic の sub-issue としてつなぎます。'
      - '親 Epic と `--order` を渡したときは、その Epic に同じ order の Issue が既にあると止まります。'
      - 'ファイルでは、一括の中の 2 つのファイルが同じ親 Epic の下で同じ order を持つと止まります。'
    stdin: none
    output:
      format: text
      description: '`--prepare` のときは、テンプレートのコピーのパスです。`--plan` のときは、ファイルの表と積める並びです。それ以外では、作った Issue ごとに URL を 1 行ずつ、ファイルの順に出します。作った Issue に積める並びがあれば、その後に出します。'
    diagnostics: '標準エラーに、Issue ごとの結果の行を出します。行の種類は、`created` と、`added`（blocked-by・プロジェクト・親 Epic の sub-issue）です。`set`（status・priority・size）と `moved`（Blocked から Ready）もあります。`warning` の行を出すのは、次のときです。`aggregation_repo` の外に Epic を作ったとき。ボードに Blocked の列が無いとき。Issue をプロジェクトに足せなかったとき。blocked-by を足せなかったとき。Issue の blocked-by を全部は読めなかったとき。blocked-by を足せなかったときは、付け直す `pecot issue block` のコマンドを載せた `error` の行が続きます。複数のファイルの一括では、次の 2 種類の `warning` の行を、最初の `created` の行より前にすべて出します。`aggregation_repo` の外に作る Epic の行と、読めない親 Epic の行です。親 Epic の `warning` は、ファイルごとではなく、親ごとに 1 回書きます。`-m` で渡した `--status` が有効な値でないときは、有効な値を並べた `error` の行を出します。失敗ごとに `error` の行を出します。本文がテンプレートに合わないときは、1 行目にテンプレートのパスを、字下げした行に違反の種類ごとの内容を出します。形の誤った `--parent-epic` は、`error` の行ではなく、コマンドラインの解析が使い方のエラーとして知らせます。'
    environment: []
    exit_status:
      - code: 0
        when: 'テンプレートをコピーしたか、予定を出したか、すべての Issue を作りました。Issue をプロジェクトのボードに足せなかったときも 0 です。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。モードの引数がありません。`-m` に `-t` か `-r` がありません。ファイルが無いか、同じファイルを重ねて渡しました。プレースホルダが先のファイルを指していません。フロントマターを読めないか、リポジトリの形が誤っています。本文がテンプレートに合いません（3 ではなく 1 です）。`-m` で渡した `--status` が有効な値ではありません。status が type の既定の値ではありません。リポジトリがプロジェクトにつながっていません。親 Epic の別の Issue が同じ order を持っています。一括の 2 つのファイルが同じ order を持っています。`blocked_by` が、知らない key・輪・後のファイル・重複した前提のどれかを指しています。`blocked_by` に書いた Issue を読めません。`wait: merge` に reason がありません。ファイルに `parallel` があります。blocked-by を足せませんでした。親 Epic へのつなぎに失敗しました。GitHub API がエラーを返しました。'
      - code: 2
        when: '次のどれかです。`--plan` を `-m` か `--prepare` と一緒に渡したか、ファイルなしで渡しました。リポジトリが `owner/repo` の形ではありません。`epic` 以外の type の `--prepare` に `--repo` がありません。Epic の作り先を決められません。`--parent-epic` の形が誤っています。ほかのコマンドラインの誤りがあります。'
    on_error: '一括の途中で Issue の作成に失敗すると、先のファイルから作った Issue は GitHub に残り、後のファイルは処理しません。Issue が無くてもできる確認は、すべて最初の Issue を作る前に行います。そのため、誤ったファイルが 1 つあると一括の全体が止まります。フラグ `issue-create-slash-pending` を消すのは、一括のすべてのファイルを処理した後だけです。blocked-by を足せなかったときも消します。一括が途中で止まったときは残ります。`issue-pending` は、Issue を作るたびに消します。blocked-by を足せなかったときは、`warning` を書き、ほかの blocked-by と次のファイルを処理します。最後のファイルの後で、失敗した blocked-by を付け直すコマンドを書き、終了コード 1 で終わります。プロジェクトのボードに足せなかったときは、`warning` を書きます。Issue は残り、フィールドと列の設定は飛ばし、親 Epic へのつなぎは行って、次のファイルを処理します。親 Epic へのつなぎに失敗したときは、Issue はフィールドを設定した状態でボードに残ります。`error` には、次の内容の文が加わります。手で親へつなぐまで、題の order は次の採番で数えません。ファイルに `blocked_by` があるのにサーバが Issue の依存関係に対応していないときは、`error` を書き、何も作りません。Issue の作成が途中で失敗したときは、既に作った Issue どうしの blocked-by だけを足します。'
    effects:
      - target: github
        kind: write
        what: 'Issue を作り、blocked-by を足し、プロジェクトのボードに足します。フィールドを設定し、親 Epic の sub-issue としてつなぎます。前提が済んでいる Issue は、Blocked から Ready へ動かします。'
      - target: github
        kind: read
        what: '次のものを読みます。プロジェクトにつながっているリポジトリ。親 Epic の sub-issue。`blocked_by` に書いた Issue。既存の Issue を指す Issue の前提。`--plan` のときは、読むだけです。'
      - target: file
        kind: write
        what: 'テンプレートのコピーを `.pecot/tmp/output/` の下に書きます。`.pecot/state/` の下のフラグ `issue-pending` と `issue-create-slash-pending` を消します。'
      - target: file
        kind: read
        what: 'Markdown ファイル、テンプレート、アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
