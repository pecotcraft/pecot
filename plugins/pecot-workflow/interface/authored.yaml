  PW-ISSUE-COMMENT:
    help:
      details:
        - "Has two modes: a file argument and -m."
        - When both are given, the file wins over -m.
        - The templates are MCP resources (pecot-template://comment/<kind>); copy one to a file and fill it in.
        - With a file, posts its body as a comment on the Issue named by issue_ref in its front matter.
        - With -m, posts the given body as a comment on the Issue given by --issue-ref.
        - A file is validated against the template named in its front matter, and -m against the template given by -t.
        - A file that has comment_url updates that comment instead of posting a new one.
        - After posting from a file, writes the URL of the new comment back to comment_url in that file.
        - comment_url must point to a comment on the Issue named by issue_ref.
        - With a file, a repository that is not in the project gives a warning and the comment is still posted.
        - With --dry-run, validates the input and prints dry-run lines instead of posting the comment or writing comment_url back.
        - --project names the project config to use. Without it, the config that includes the repository of the Issue is used; when several do, the active one among them.
      examples:
        - run: pecot issue comment .pecot/tmp/output/comment-plan-20260101-120000.md
          note: Post the comment in the file, or update it when the file has comment_url.
        - run: pecot issue comment .pecot/tmp/output/comment-plan-20260101-120000.md --dry-run
          note: Show the planned comment without posting it or touching the file.
      default_notes:
        issue_ref: No default. Required with -m; with a file, issue_ref comes from the front matter. The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
        template: No default. Required with -m; with a file, the template comes from the front matter.
    summary: Issue にコメントを投稿します。
    arguments:
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      issue_ref: 'Issue の参照です。`owner/repo/123` の形で渡します。'
      message: 'コメントの本文です。'
      template: '`message` の本文を確かめるテンプレートの種類です。`plan`・`merge-diff`・`review-findings`・`review-resolution`・`precede-notify` のどれかを渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
