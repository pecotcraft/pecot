  PW-PR-MERGE:
    help:
      details:
        - Merges a PR with the asynchronous merge API of GitHub, for a PR in a stack and for a PR outside a stack alike.
        - A draft PR, a closed PR and a merged PR are not merged, and the command stops with exit status 2 without sending the request.
        - On a GitHub without the asynchronous merge API, a PR outside a stack is merged with the synchronous merge API and squash.
        - A PR in a stack is merged only when no PR below it in the stack is open. Otherwise the command stops with exit status 2 without sending the request, and the error line names the lowest open PR to merge first.
        - A repository without the stack API is handled as a PR outside a stack.
        - The request carries the head commit that was read, so a PR that was pushed after the read is not merged.
        - When the base branch has no merge queue, the merge method is squash. When it has a merge queue, no merge method is sent and the PR is added to the queue.
        - "After the request is accepted, reads the result every 2 seconds until it is merged, enqueued or failed, and stops with exit status 1 after 60 seconds."
        - When the same PR already has a merge request, keeps reading the result of that request.
        - When the result cannot be read, decides from the state of the PR whether it is merged or in the merge queue, and keeps reading until the 60 seconds pass.
        - Does not clean up after the merge. Run pecot session finish next.
        - "With --dry-run, reads the PR and its stack and writes a dry-run: would merge line without sending the request."
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot pr merge example-org/my-repo/123
          note: Merge a PR.
        - run: pecot pr merge example-org/my-repo/123 --dry-run
          note: Show what would be merged without merging.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: 'PR をマージします。スタックの中の PR は、最下段のものだけをマージします。'
    arguments:
      dry_run: 'マージせずに、行う内容だけを返すかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'GitHub の非同期のマージ API で PR をマージします。スタックの中の PR も、スタックの外の PR も同じです。'
      - 'ドラフトの PR、閉じている PR、マージ済みの PR はマージしません。要求を送らずに、`kind` が `pr-state` の失敗を返します。'
      - '非同期のマージ API が無い GitHub では、スタックの外の PR を、同期のマージ API で squash でマージします。'
      - 'スタックの中の PR は、それより下に開いている PR が無いときだけマージします。あるときは、要求を送らずに `kind` が `pr-state` の失敗を返し、先にマージするいちばん下の開いている PR を `detail` に入れます。'
      - 'スタックの API が無いリポジトリでは、スタックの外の PR として扱います。'
      - '要求には、読んだ head のコミットを添えます。読んだ後に push された PR は、マージしません。'
      - 'base ブランチに merge queue が無いときは、squash でマージします。あるときは、マージの方法を送らず、PR は merge queue に入ります。'
      - '要求が受け付けられた後は、結果を 2 秒おきに読みます。`merged`・`enqueued`・`failed` のどれかになるまで読み、60 秒で終わらなければ失敗を返します。'
      - '同じ PR のマージの要求が既にあるときは、その要求の結果を読み続けます。'
      - '結果を読めないときは、PR の状態から、マージ済みか merge queue の中かを決めます。どちらでもなければ、60 秒が過ぎるまで読み直します。'
      - 'マージの後の片付けはしません。続けて `session_finish` を呼びます。'
      - '`dry_run` を付けると、PR とスタックを読み、要求を送らずに、マージする PR と base を結果に入れます。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        pullRequest: 'マージした PR です。`owner/repo/N` の形です。'
        base: 'PR をマージした先の base ブランチです。'
        status: '結果です。`merged`（マージした）か `enqueued`（merge queue に入った）です。`dry_run` のときは入りません。'
        stack: 'PR が最下段だったスタックです。`number`（スタックの番号）と `size`（この PR から上の PR の数）を持ちます。スタックの外の PR では入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。マージしていません。'
    diagnostics: '標準エラーに、結果の行を出します。マージしたときは `merged`、merge queue に入ったときは `added` です。スタックの最下段の PR では、`merged` の行にスタックの番号と段の数が付きます。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: pr-state
        code: 2
        when: 'PR がドラフトか、閉じているか、マージ済みか、スタックの最下段ではありません。要求は送っていません。'
      - kind: pr-state
        code: 1
        when: 'GitHub がマージを拒みました。または、結果を読めず、PR がマージ済みでも merge queue の中でもありません。'
      - kind: invalid-input
        code: 2
        when: 'PR の参照の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。または、マージが 60 秒で終わりませんでした。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'マージが 60 秒で終わらないときは、要求は GitHub に残っています。PR の状態を確かめてから呼び直します。呼び直すと、残っている要求の結果を読み続けます。'
    effects:
      - target: github
        kind: write
        what: 'PR をマージするか、merge queue に入れます。'
      - target: github
        kind: read
        what: 'PR、PR が入っているスタック、スタックの下の段の PR、マージの結果を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: false
    examples:
      - arguments:
          pr_ref: example-org/my-repo/123
        note: 'PR をマージします。'
      - arguments:
          pr_ref: example-org/my-repo/123
          dry_run: true
        note: 'マージせずに、行う内容を返します。'
    default_notes:
      pr_ref: '短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-MERGE-01
        pattern: event
        statement: 'スタックの外の PR を渡すと、読んだ head のコミットと squash でマージを頼み、結果の `status` を `merged` にします'
      - id: PW-PR-MERGE-02
        pattern: event
        statement: 'スタックの最下段の PR を渡すと、スタックの番号と段の数を結果の `stack` に入れます'
      - id: PW-PR-MERGE-03
        pattern: state
        statement: '下の段の PR がマージ済みでスタックの並びに残っている間、その上の PR を最下段として扱います'
      - id: PW-PR-MERGE-04
        pattern: state
        statement: 'base ブランチに merge queue がある間、マージの方法を送らず、merge queue に入ると結果の `status` を `enqueued` にします'
      - id: PW-PR-MERGE-05
        pattern: unwanted
        statement: 'もしスタックの下の段に開いている PR があるなら、要求を送らずに、先にマージする PR を `detail` で示して、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-06
        pattern: unwanted
        statement: 'もし PR がドラフトなら、要求を送らずに、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-07
        pattern: unwanted
        statement: 'もし GitHub がマージを拒んだなら、GitHub の文を添えた `detail` を入れて、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-08
        pattern: unwanted
        statement: 'もしマージが 60 秒で終わらないなら、確かめる PR を `detail` で示して、`kind` が `github-api` の失敗を返します'
      - id: PW-PR-MERGE-09
        pattern: event
        statement: '同じ PR のマージの要求が既にあると、その要求の結果を読み続けます'
      - id: PW-PR-MERGE-10
        pattern: event
        statement: '結果を読めなくなると、PR の状態を読み直し、マージ済みなら `merged`、merge queue の中なら `enqueued` を結果の `status` に入れます'
      - id: PW-PR-MERGE-11
        pattern: unwanted
        statement: 'もし結果を読めないまま 60 秒が過ぎ、PR がマージ済みでも merge queue の中でもないなら、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-12
        pattern: state
        statement: 'リポジトリにスタックの API が無い間、スタックの外の PR として扱います'
      - id: PW-PR-MERGE-13
        pattern: unwanted
        statement: 'もし GitHub API がほかのエラーを返したなら、失敗を返します'
      - id: PW-PR-MERGE-14
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、PR とスタックを読み、要求を送らずに、`dryRun` を `true` にして成功を返します'
      - id: PW-PR-MERGE-15
        pattern: unwanted
        statement: 'もし PR が閉じているかマージ済みなら、要求を送らずに、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-16
        pattern: state
        statement: 'GitHub に非同期のマージ API が無い間、スタックの外の PR を、読んだ head のコミットを添えた同期のマージ API で squash でマージします'
      - id: PW-PR-MERGE-17
        pattern: unwanted
        statement: 'もしスタックの中の PR で非同期のマージ API が無いなら、同期のマージ API を呼ばずに失敗を返します'
      - id: PW-PR-MERGE-18
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-MERGE-19
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-PR-RESTACK:
    help:
      details:
        - Restacks the current branch onto the new position of the branch it was stacked on, using the base record written when the work started.
        - "With --check, only reports whether a restack is needed and changes nothing except the remote-tracking refs updated by git fetch."
        - "A branch that is not stacked (a record of a start from the develop branch, or no record and no inferred base) is never restacked."
        - "When .pecot/state/.pecot-base of the worktree of the working directory is missing, the stacked base is inferred. When the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the branch counts as stacked on it. Otherwise it counts as started from the develop_branch. A warning line cannot infer the stacked base is printed when the readiness cannot be read or is blocked, when GitHub cannot be reached, or when the remote-tracking ref is missing. The inferred base is not written."
        - "A restack is needed when the head of the layer below on the remote differs from the recorded position, or when the PR of the layer below is merged. After a merge, the branch is restacked onto the develop branch and the base record becomes a start from the develop branch."
        - "A branch that is already on the new base needs no rebase, even when its base record is old. It counts as on the new base when the new base is in its history and, if the recorded position is in its history too, the recorded position is in the history of the new base. pr restack without --check then pushes the branch and rewrites the base record. When the remote branch already has the same tree on the new base, it resets to the remote branch instead of pushing."
        - "After the rebase, stops when the remote branch has commits whose change is in the local branch neither before nor after the rebase, because the push would drop them. The branch goes back to the position before the restack."
        - "Runs git rebase --no-update-refs --onto <new base> <recorded position>. When the recorded position is not in the history of the branch, the rebase starts from the fork point with the remote-tracking ref of the layer below, or from the merge base with the new base when there is no fork point. This holds also after the layer below is merged. When the result has the same tree as the remote branch and the remote branch is already on the new base, resets to the remote branch and does not push. Otherwise pushes with --force-with-lease, expecting the fetched position, and waits up to 10 minutes including the pre-push hook. A branch that is not on the remote is not pushed."
        - "After the restack, rewrites the base record with the merge base of the branch and the new base."
        - "After a restack onto the develop branch, saves the body of the open PR of the branch again without changes, when the base of that PR is the default branch of the repository and its body names Issues with closing keywords that are not linked yet. GitHub links closing Issues only for PRs to the default branch, and does not read the body again when it moves the base of a stacked PR. A failure is a warning line with how to save the body by hand, and the exit status stays 0. Running pr restack again does not retry, because the base record is already rewritten."
        - "On conflicts, prints the conflicted files, leaves the rebase in progress, writes a progress record and exits with status 3. --continue goes on after the conflicts are resolved and staged. --abort goes back to the position before the restack. Both read only the progress record and refuse to touch a rebase that pecot did not start."
        - Only one of --check, --continue and --abort can be given.
        - "With --dry-run, fetches and decides like a restack, then prints a dry-run line of what would be done, without rebasing, pushing or writing records."
        - Changes only the branch of the current working directory. Other worktrees are not touched.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot pr restack --check
          note: Check whether the current branch needs a restack.
        - run: pecot pr restack
          note: Restack the current branch and push it.
        - run: pecot pr restack --continue
          note: Go on after resolving the conflicts and staging the files.
        - run: pecot pr restack --abort
          note: Go back to the position before the restack.
      default_notes:
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: 積んだブランチを、base にしたブランチの新しい位置へ載せ直します。
    arguments:
      check: '載せ直しが要るかだけを確かめます。'
      continue: '衝突で止まった載せ直しを、衝突を解いた後に続けます。'
      abort: '衝突で止まった載せ直しを取りやめ、載せ直しの前の位置に戻します。'
      dry_run: '載せ直し・push・記録の書き込みをせずに、する予定だけを返すかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - '今のブランチを、積んで着手したときの base の記録を使って、下の段のブランチの新しい位置へ載せ直します。'
      - '`check` を付けると、載せ直しが要るかだけを返します。変わるのは、`git fetch` が進める手元の追跡参照だけです。'
      - '積んでいないブランチ（開発ブランチからの着手の記録か、記録が無く積んだ先も求まらないもの）は、載せ直しません。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチに積んだものとします。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`cannot infer the stacked base` の文を `warnings` に入れます。求めた結果は書きません。'
      - '載せ直しが要るのは、下の段の remote の先頭が記録の位置と違うときと、下の段の PR がマージ済みのときです。マージ済みなら開発ブランチへ載せ直し、base の記録を開発ブランチからの着手に変えます。'
      - 'ブランチが新しい base の上に載り終えていれば、記録が古くても rebase をしません。載り終えているとは、新しい base がブランチの履歴にあり、記録の位置もブランチの履歴にあるなら、それが新しい base の履歴にもあることです。push と記録の書き直しは、`check` なしの `pr_restack` が行います。remote のブランチが同じ木で新しい base の上にあれば、push せずに remote のブランチに合わせます。'
      - 'rebase の後、remote のブランチにだけあるコミットがあれば止まります。push がそのコミットを消すためです。ブランチは載せ直しの前の位置へ戻します。'
      - '同じ変更かは、載せ直しの前と後のブランチの両方と比べます。GitHub が書き換えたコミットを、別の変更と見ないためです。'
      - '`git rebase --no-update-refs --onto <新しい base> <記録の位置>` を動かします。'
      - '記録の位置がブランチの履歴に無いときは、別の点から rebase を始めます。下の段の追跡参照からの fork-point を使い、求まらなければ新しい base との merge-base を使います。下の段がマージ済みでも同じです。'
      - '結果の木が remote のブランチと同じで、remote のブランチが新しい base の上にあれば、remote のブランチに合わせ、push しません。'
      - 'そうでなければ、fetch した位置を期待の値にした `git push --force-with-lease` で push します。pre-push のフックを含めて、10 分まで待ちます。remote に無いブランチは push しません。'
      - '載せ直しの後、base の記録の位置を、ブランチと新しい base の merge-base に書き直します。'
      - '開発ブランチへ載せ直した後、ブランチの開いている PR の本文を変えずに保存し直します。GitHub は、積んだ PR の `Closes` を Issue とリンクせず、base を付け替えても本文を読み直さないためです。'
      - '保存し直すのは、PR の base がリポの既定のブランチで、本文の `Closes` などの Issue に、まだリンクになっていないものがあるときだけです。GitHub がリンクにするのは、既定のブランチに向いた PR だけです。'
      - '保存し直しの失敗は `warnings` に入れるだけで、成功を返します。base の記録は書き直し済みなので、呼び直しても保存し直しません。`warnings` の文には、GitHub で本文を変えずに保存し直す案内を添えます。'
      - '衝突したら、衝突したファイルを `conflicts` に入れ、rebase を途中のまま残します。途中の記録を書き、`kind` が `git-conflict` の失敗を返します。'
      - '`continue` は、衝突を解いて `git add` した後に続けます。`abort` は、載せ直しの前の位置に戻します。どちらも途中の記録だけを読み、pecot が始めていない rebase は動かしません。'
      - '`check`・`continue`・`abort` は、1 つだけ渡せます。'
      - '`dry_run` を付けると、fetch と判断までを行い、する予定を結果に入れます。rebase・push・記録の書き込みは行いません。'
      - '書き換えるのは、セッションのディレクトリのブランチだけです。ほかの worktree には触れません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '`--check` のときだけ、`up to date: <branch> on <base>` か `needs restack: ...` の 1 行を出します。'
    mcp_output:
      fields:
        branch: '載せ直すブランチです。'
        base: '載せ直した後の base のブランチです。下の段の PR がマージ済みなら、開発ブランチです。'
        outcome: '起きたことです。`up-to-date`・`needs-restack`・`restacked`・`synced`・`conflict`・`aborted` のどれかです。`check` を付けたときは、載せ直すと何が起きるかです。'
        cause: '載せ直しが要る理由です。`base-moved` か `base-merged` です。`check` か `dry_run` を付けて、載せ直しが要るときだけ入ります。'
        pullRequest: '下の段の、マージ済みの PR の番号です。`cause` が `base-merged` のときだけ入ります。'
        pushed: 'ブランチを push したかどうかです。`outcome` が `restacked` のときだけ入ります。'
        conflicts: '衝突したファイルの一覧です。`outcome` が `conflict` のときだけ入ります。'
        relinked: '本文を保存し直した、開いている PR の番号です。開発ブランチへ載せ直すか合わせた後、まだリンクになっていない `Closes` があって保存し直したときだけ入ります。'
        dryRun: '`dry_run` のときだけ `true` で入ります。ブランチと記録は変えていません。'
    diagnostics: '標準エラーに、結果の行を出します。載せ直すと `updated: <branch> restacked on <base>` です。remote に合わせると `updated: <branch> synced with <remote>/<branch>` です。変えなければ `unchanged: <branch> is up to date`、取りやめると `unchanged: <branch> restack aborted` です。開発ブランチへ載せ直した後に PR の本文を保存し直すと、`updated: PR #N relinked to its closing Issues` の行を足します。PR の本文を保存し直せないと、`warning: cannot relink PR #N to its closing Issues: <理由>` の行を出します。続けて、手で保存し直す案内の行を出し、終了コードは 0 のままです。載せ直しの失敗は `error` の行で、続けて直し方の行を出します。記録が無く積んだ先を求められないときは、`warning: cannot infer the stacked base: <理由>` の行を出します。'
    environment: []
    exit_status:
      - kind: git-unresolved
        code: 1
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: git-unresolved
        code: 1
        when: '`git fetch` が失敗したか、remote に届きません。載せ直す先のブランチが手元の追跡参照に無いときも含みます。remote のブランチにだけあるコミットがあるときと、push が拒まれたか、時間切れのときも同じです。'
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` が未設定です。'
      - kind: content-invalid
        code: 1
        when: '積んだ base の記録か、途中の記録の形が誤っています。'
      - kind: pr-state
        code: 1
        when: '下の段のブランチが remote から消えていて、その PR がマージされていません。'
      - kind: github-api
        code: 1
        when: '下の段の PR を GitHub から読めません。'
      - kind: github-auth
        code: 1
        when: 'GitHub の認証に失敗しました。'
      - kind: github-not-found
        code: 1
        when: 'リポジトリが GitHub にありません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub の rate limit に当たりました。'
      - kind: preflight-failed
        code: 2
        when: '未コミットの変更があります。`check`・`continue`・`abort` では確かめません。'
      - kind: git-conflict
        code: 3
        when: '載せ直しが衝突しました。`continue` の後に、また衝突したときも含みます。'
      - kind: invalid-input
        code: 2
        when: '`check`・`continue`・`abort` を 2 つ以上渡したか、途中の載せ直しが無いのに `continue`・`abort` を渡しました。pecot の記録が無い rebase の途中のときと、ほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '衝突で止まったときは、rebase は途中のまま残り、base の記録は変わりません。push が拒否・時間切れ・取り消しで止まったときは、手元のブランチは載せ直した後のままで、base の記録は変わりません。拒まれたか取り消されたときは、同じ引数で呼び直せば続きます。時間切れのときは、手で push してから呼び直すと、remote に合わせて続きます。remote のブランチにだけあるコミットで止まったときは、ブランチを載せ直しの前の位置へ戻します。'
    effects:
      - target: git
        kind: destructive
        what: '`git fetch` で追跡参照を進め、今のブランチを rebase で書き換え、`--force-with-lease` で remote のブランチを置き換えます。remote に合わせるときは、今のブランチを remote のブランチの位置に動かします。'
      - target: github
        kind: read
        what: '下の段のブランチを head に持つ PR を読みます。'
      - target: github
        kind: write
        what: '開発ブランチへ載せ直した後、既定のブランチに向いたブランチの開いている PR を読み、本文を変えずに保存し直します。'
      - target: file
        kind: write
        what: '`.pecot/state/.pecot-base` を書き直します。衝突で止まる間は `.pecot/state/.pecot-restack` を置き、終わるか取りやめると消します。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - '積んで着手した作業ディレクトリで呼びます（`session_start` が base の記録を書きます）。'
    idempotent: true
    examples:
      - arguments:
          check: true
        note: '今のブランチに載せ直しが要るかを確かめます。'
      - arguments: {}
        note: '今のブランチを載せ直して push します。'
      - arguments:
          continue: true
        note: '衝突を解いて `git add` した後に、続けます。'
      - arguments:
          abort: true
        note: '載せ直しの前の位置に戻します。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-RESTACK-01
        pattern: event
        statement: '`check` を付けて、下の段が動いていないときに呼ぶと、結果の `outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-02
        pattern: event
        statement: '`check` を付けて、下の段の remote の先頭が記録と違うときに呼ぶと、`outcome` を `needs-restack`、`cause` を `base-moved` にします'
      - id: PW-PR-RESTACK-03
        pattern: event
        statement: '`check` を付けて、下の段の PR がマージ済みのときに呼ぶと、`outcome` を `needs-restack`、`cause` を `base-merged` にします。`pullRequest` には PR の番号を入れます'
      - id: PW-PR-RESTACK-04
        pattern: event
        statement: '載せ直しが要るときに呼ぶと、新しい base へ載せ直して `git push --force-with-lease` で push し、`outcome` を `restacked` にします'
      - id: PW-PR-RESTACK-05
        pattern: event
        statement: '載せ直した結果の木が remote のブランチと同じで、remote のブランチが新しい base に載っている状態で呼ぶと、push せずに remote のブランチへ合わせます。`outcome` は `synced` です'
      - id: PW-PR-RESTACK-06
        pattern: event
        statement: '下の段が動いていないときに呼ぶと、何も変えずに `outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-07
        pattern: unwanted
        statement: 'もし載せ直しが衝突したなら、衝突したファイルを `conflicts` に、`continue`・`abort` の案内を `detail` に入れます。途中の記録を書いて、`kind` が `git-conflict` の失敗を返します'
      - id: PW-PR-RESTACK-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、載せ直さずに、`kind` が `preflight-failed` の失敗を返します。`check` では確かめません'
      - id: PW-PR-RESTACK-09
        pattern: unwanted
        statement: 'もし下の段のブランチが remote から消えていて、その PR がマージされていないなら、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-RESTACK-10
        pattern: state
        statement: '積んでいないブランチの間、載せ直しをしません。開発ブランチからの着手の記録があれば、fetch もしません。`check` の有無によらず、`outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-11
        pattern: state
        statement: 'remote に今のブランチが無い間、載せ直すだけで push せず、`pushed` を `false` にします'
      - id: PW-PR-RESTACK-12
        pattern: event
        statement: '`abort` を付けて呼ぶと、載せ直しの前の位置に戻し、途中の記録を消して、`outcome` を `aborted` にします'
      - id: PW-PR-RESTACK-13
        pattern: event
        statement: '`continue` を付けて呼ぶと、rebase を続け、終われば push と記録の書き直しまで進みます。衝突が残っていれば、もう一度 `kind` が `git-conflict` の失敗を返します。利用者が rebase を終えていれば、残りの手順だけを進めます'
      - id: PW-PR-RESTACK-14
        pattern: unwanted
        statement: 'もし途中の記録が無いのに `continue` か `abort` を付けたなら、途中の rebase を動かさずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-15
        pattern: unwanted
        statement: 'もし `check`・`continue`・`abort` を 2 つ以上付けたなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-16
        pattern: unwanted
        statement: 'もし remote のブランチにだけあるコミットがあるなら、ブランチを載せ直しの前の位置へ戻し、push をせずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-17
        pattern: unwanted
        statement: 'もし push が拒まれたなら、base の記録を書き直さずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-18
        pattern: unwanted
        statement: 'もし `git fetch` が失敗したなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-19
        pattern: event
        statement: '載せ直しか、remote への合わせが済むと、base の記録を新しい base のブランチと位置に書き直します。開発ブランチへ載せ直したときは、積んだ先の Issue を記録から外します'
      - id: PW-PR-RESTACK-20
        pattern: unwanted
        statement: 'もし積んだ base の記録の形が誤っているなら、`kind` が `content-invalid` の失敗を返します'
      - id: PW-PR-RESTACK-21
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-PR-RESTACK-22
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、載せ直し・push・記録の書き込みをせずに、する予定を結果に入れ、`dryRun` を `true` にします'
      - id: PW-PR-RESTACK-23
        pattern: state
        statement: '新しい base の上に載り終えていて記録だけが古い間、rebase をせずに push と記録の書き直しを行い、`outcome` を `restacked` にします。remote のブランチが同じ木で新しい base の上にあれば、push せずに合わせ、`outcome` を `synced` にします'
      - id: PW-PR-RESTACK-24
        pattern: state
        statement: 'ブランチが新しい base の上に載り終えている間、`check` は `outcome` を `up-to-date` にし、base の記録を書き換えません'
      - id: PW-PR-RESTACK-25
        pattern: event
        statement: '記録の位置が履歴に無いブランチを載せ直すと、下の段からの fork-point を起点とします。求まらなければ、新しい base との merge-base です。古い下の段と base のコミットは積み直しません'
      - id: PW-PR-RESTACK-26
        pattern: unwanted
        statement: 'もし新しい base を merge で取り込んだか、下の段が記録より古い位置へ戻されたなら、載せ直し済みと見ずに、載せ直しが要ると判断します'
      - id: PW-PR-RESTACK-27
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが下の段の変更を持つ間、下の段に積んだものとして載せ直しの要否を決め、載せ直した後に base の記録を書きます'
      - id: PW-PR-RESTACK-28
        pattern: event
        statement: '積んだ先を求めて始めた載せ直しが衝突で止まると、載せ直す前の記録の位置を途中の記録に書き、`continue` はそれを使います'
      - id: PW-PR-RESTACK-29
        pattern: unwanted
        statement: 'もし記録が無く、積んだ先を求められないなら、`cannot infer the stacked base` の文を `warnings` に入れ、積んでいないものとして扱います'
      - id: PW-PR-RESTACK-30
        pattern: event
        statement: '記録の無い作業ディレクトリで呼ぶと、積んだ先を求める前に remote を fetch し、手元に無い下の段のブランチも追跡参照で見ます'
      - id: PW-PR-RESTACK-31
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-RESTACK-32
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
      - id: PW-PR-RESTACK-33
        pattern: unwanted
        statement: 'もし push が 10 分で終わらないなら、git を止めます。時間切れの旨と、手で push してから `pr_restack` を呼ぶ案内を `detail` に入れます。base の記録は書き直さず、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-34
        pattern: event
        statement: '開発ブランチへ載せ直すか合わせると、開いている PR の base が既定のブランチで、リンクになっていない `Closes` があれば、本文を変えずに保存し直します。その PR の番号を `relinked` に入れます'
      - id: PW-PR-RESTACK-35
        pattern: unwanted
        statement: 'もし PR の本文の保存し直しに失敗したなら、手で保存し直す案内を添えて `warnings` に入れ、成功を返します'
  PW-PR-SHOW:
    help:
      details:
        - Fetches one PR with a single GraphQL query.
        - Prints the title, state, draft flag, mergeability, comment count, head and base branches, closing issues, referenced issues, review states and body.
        - With --reviews, adds the review bodies and the line comments, and an issue show hint (the command name only, readable from the CLI and MCP) under each related Issue.
        - With --json, prints the PR as JSON, and with --reviews the JSON also holds the reviews and the line comments.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot pr show example-org/my-repo/123
          note: Show the PR as Markdown.
        - run: pecot pr show example-org/my-repo/123 --reviews
          note: Show the PR with its reviews and line comments.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: PR の詳細を、必要な項目だけ GraphQL で取得して出します。
    arguments:
      json: 'JSON で出力するかどうかです。結果の項目は、この値によらず同じです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      reviews: 'レビューの詳細（本文と行のコメント）を含めるかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'GraphQL のクエリ 1 回で、PR を 1 件取得します。'
      - '題・状態・ドラフトの印・マージの可否・コメントの数・head と base のブランチを返します。closing issues・参照している Issue・レビューの状態・本文も返します。'
      - '`reviews` を付けると、レビューの本文と行のコメントを足します。'
      - '`json` を付けても、結果の項目は変わりません。`reviews` も付けると、レビューと行のコメントが入ります。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '`## PR #<N> <title>` の見出しで始まる Markdown です。`--reviews` を付けると、レビューか行のコメントがあるときに、`## Reviews` の節と `## Line Comments` の節が続きます。`--json` を付けると、JSON のオブジェクトです。'
    mcp_output:
      fields:
        number: 'PR の番号です。キーは snake_case です。'
        state: 'PR の状態です。`OPEN`・`CLOSED`・`MERGED` のどれかです。'
        title: 'PR のタイトルです。'
        body: 'PR の本文です。'
        head_ref: 'head ブランチです。'
        base_ref: 'base ブランチです。'
        is_draft: 'PR が draft かどうかです。'
        mergeable: 'マージできるかどうかです。`MERGEABLE`・`CONFLICTING`・`UNKNOWN` のどれかです。'
        comments: 'コメントの数です。'
        closing_issues: 'PR が閉じる Issue の配列です。要素は `number` と `title` を持ちます。'
        referenced_issues: '本文の Refs が指す Issue のうち、`closing_issues` に無いものの配列です。要素は `number` と `title` を持ち、`title` はいつも空です。'
        reviews: 'レビューの配列です。要素は `state` と `author` を持ちます。`author` は、削除されたユーザーなら `null` です。`body` と `submitted_at` は、`reviews` を付けたときだけ入ります。'
        review_threads: '行コメントのスレッドの配列です。`reviews` を付けたときだけ入ります。要素は `is_resolved`・`path`・`line`・`comments` を持ちます。`comments` の要素は `author`・`body`・`created_at`・`url` を持ちます。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        code: 2
        when: 'PR の参照の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue を読みます。`reviews` のときは、レビューと行のコメントも読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          pr_ref: example-org/my-repo/123
        note: 'PR の詳細を返します。'
      - arguments:
          pr_ref: example-org/my-repo/123
          reviews: true
        note: 'PR の詳細を、レビューと行のコメントも付けて返します。'
    default_notes:
      pr_ref: '短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-SHOW-01
        pattern: event
        statement: 'PR の参照を渡すと、番号・題・状態・ブランチ・本文を結果に入れます'
      - id: PW-PR-SHOW-02
        pattern: event
        statement: '関連 Issue がある PR を読むと、`closing_issues` と `referenced_issues` に入れます'
      - id: PW-PR-SHOW-03
        pattern: event
        statement: 'レビューがある PR を読むと、レビューごとの author と状態を `reviews` に入れます'
      - id: PW-PR-SHOW-04
        pattern: event
        statement: '`reviews` を付けて呼ぶと、レビューの本文と行のコメントを足して返します'
      - id: PW-PR-SHOW-05
        pattern: event
        statement: '`reviews` を付けてレビューがあると、`reviews` の要素に `body` と `submitted_at` を入れます'
      - id: PW-PR-SHOW-06
        pattern: event
        statement: '`reviews` を付けて行のコメントがあると、`review_threads` に入れます'
      - id: PW-PR-SHOW-07
        pattern: event
        statement: 'CLI では、`reviews` を付けると、関連 Issue ごとに `issue show` の案内を Markdown に足します。結果の項目には入りません'
      - id: PW-PR-SHOW-08
        pattern: event
        statement: '`json` を付けて呼ぶと、同じ内容を JSON にします。結果の項目は、`json` を省いたときと同じです'
      - id: PW-PR-SHOW-09
        pattern: event
        statement: '`json` と `reviews` を一緒に付けて呼ぶと、結果にレビューと行のコメントを含めます'
      - id: PW-PR-SHOW-10
        pattern: event
        statement: '短い形 `N` の参照を渡すと、`repo` か git の remote で補って読みます'
      - id: PW-PR-SHOW-11
        pattern: unwanted
        statement: 'もし PR の参照の形が誤っているなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-SHOW-12
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-PR-SHOW-13
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-PR-SHOW-14
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-SHOW-15
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-PROJECT-ACTIVATE:
    help:
      details:
        - The project argument is required. pecot project search lists the projects of the owner and marks the initialized and the active ones.
        - A project is initialized when it has a pecot-workflow field.
        - With a project number or name, regenerates the config file of that project from GitHub and makes it the active project.
        - With a config file path or file name, syncs the project from the host, owner and number recorded in that file and makes it the active project.
        - A config file path or file name needs neither --host nor --owner.
        - The develop branch, release branch, changelog_file, packages and release type of each repository, and aggregation_repo, already in the config file are kept.
        - A repository that is no longer linked to the project is removed from the config file.
        - A newly linked repository is appended to the end of the repository list.
        - The Blocked option of the pecot-workflow field and the Todo and Needs Attention options of the Status field are written to the config file only when the board has them.
        - A board without the Blocked option is accepted; the other six options of the pecot-workflow field are required.
        - With --dry-run, reads the project and prints dry-run lines for the config file and the switch of the active project, and writes nothing.
      examples:
        - run: pecot project activate 1 --host github.com --owner example-org
          note: Activate the project by number.
        - run: pecot project activate 1 --host github.com --owner example-org --dry-run
          note: Show the planned config and switch without writing them.
      default_notes:
        owner: The authenticated user; with a config file, the owner recorded in the file and --owner is not used.
        host: Required with a project number or name; with a config file, the host recorded in the file.
    summary: 初期化済みのプロジェクトをアクティブにします。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      project: 'プロジェクトの番号か名前です。設定ファイルのパスかファイル名でも渡せます。候補は `project_search` で一覧します。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - '`project` は必須です。所有者のプロジェクトは `project_search` で一覧でき、初期化済みのものとアクティブなものが分かります。'
      - '初期化済みのプロジェクトとは、pecot-workflow のフィールドを持つプロジェクトです。'
      - '`project` にプロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイルを GitHub から作り直し、アクティブなプロジェクトにします。'
      - '`project` に設定ファイルのパスかファイル名を渡すと、ファイルに記録したホスト・所有者・番号でプロジェクトを同期し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すときは、`host` と `owner` のどちらも要りません。'
      - '設定ファイルに既にある次の値は残します。リポジトリごとの開発ブランチ・リリースブランチ・`changelog_file`・packages・リリースの種類と、`aggregation_repo` です。'
      - 'プロジェクトとのつながりが外れたリポジトリは、設定ファイルから消します。'
      - '新しくつないだリポジトリは、リポジトリの一覧の末尾に足します。'
      - '次の選択肢は、ボードにあるときだけ設定ファイルに書きます。pecot-workflow のフィールドの Blocked と、Status のフィールドの Todo・Needs Attention です。'
      - 'Blocked の選択肢の無いボードも受け付けます。pecot-workflow のフィールドのほかの 6 つの選択肢は必須です。'
      - '`dry_run` を付けると、プロジェクトを読み、書く予定の設定ファイルとアクティブにする予定の設定を結果に入れて、何も書きません。'
      - '`host` が、渡した設定ファイルのホストと違うときは、`warnings` に入れて、設定ファイルのホストを使います。'
    stdin: none
    output:
      format: text
      description: '標準出力には何も書きません。'
    mcp_output:
      fields:
        project: 'アクティブにした設定の名前です。`dry_run` のときは、アクティブにする予定の名前です。'
        configPath: 'プロジェクトの設定ファイルのパスです。'
        change: '設定ファイルがどうなったかです。`create`・`update`・`unchanged` のどれかです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。`--host` が渡した設定ファイルのホストと違うときは、`warning` の行を出します。このときは、設定ファイルのホストを使います。'
    environment: []
    exit_status:
      - kind: invalid-input
        code: 1
        when: 'プロジェクトの番号か名前を渡したのに、`host` がありません。'
      - kind: project-not-found
        code: 1
        when: 'プロジェクトが見つかりません。'
      - kind: not-initialized
        code: 1
        when: 'プロジェクトが初期化されていません。'
      - kind: config-invalid
        code: 1
        when: '設定ファイルを読み込めません。'
      - kind: invalid-input
        code: 2
        when: '`project` が無いか、知らない引数など、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクトと、そのフィールドと、つながっているリポジトリを読みます。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下の設定ファイルを作るか更新し、アクティブなプロジェクトを設定します。`dry_run` のときは書きません。'
      - target: file
        kind: read
        what: '設定ファイルと、アクティブなプロジェクトの設定を読みます。'
    prerequisites:
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          project: '1'
          host: github.com
          owner: example-org
        note: '番号でプロジェクトをアクティブにします。'
      - arguments:
          project: '1'
          host: github.com
          owner: example-org
          dry_run: true
        note: '設定ファイルとアクティブな設定は書かず、する予定を返します。'
    default_notes:
      owner: '省くと、認証したユーザーです。設定ファイルを渡したときは、ファイルに記録した所有者を使い、`owner` は使いません。'
      host: 'プロジェクトの番号か名前を渡すときは必須です。設定ファイルを渡したときは、ファイルに記録したホストを使います。'
    behaviors:
      - id: PW-PROJECT-ACTIVATE-04
        pattern: event
        statement: '`project` にプロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイルを作ります'
      - id: PW-PROJECT-ACTIVATE-05
        pattern: event
        statement: '`project` にプロジェクトの番号か名前を渡すと、そのプロジェクトをアクティブにします'
      - id: PW-PROJECT-ACTIVATE-06
        pattern: event
        statement: '`project` に設定ファイルのパスかファイル名を渡すと、`host` を渡さなくても設定ファイルの `host` で同期します'
      - id: PW-PROJECT-ACTIVATE-07
        pattern: event
        statement: '`owner` を省くと、認証したユーザーのプロジェクトを対象にします'
      - id: PW-PROJECT-ACTIVATE-08
        pattern: event
        statement: '既存の設定ファイルがあるプロジェクトを同期すると、リポジトリごとの `branches`・`changelog_file`・`packages`・`release_type` を引き継ぎます'
      - id: PW-PROJECT-ACTIVATE-09
        pattern: event
        statement: '既存の設定ファイルがあるプロジェクトを同期すると、`aggregation_repo` を引き継ぎます'
      - id: PW-PROJECT-ACTIVATE-10
        pattern: event
        statement: 'リンクを外したリポジトリがあるプロジェクトを同期すると、そのリポジトリを設定ファイルから消します'
      - id: PW-PROJECT-ACTIVATE-11
        pattern: event
        statement: '新しくリンクしたリポジトリがあるプロジェクトを同期すると、そのリポジトリを設定ファイルの末尾に足します'
      - id: PW-PROJECT-ACTIVATE-12
        pattern: unwanted
        statement: 'もし `host` が要る場面で渡していないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-13
        pattern: unwanted
        statement: 'もし指定したプロジェクトが無いなら、`kind` が `project-not-found` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-14
        pattern: unwanted
        statement: 'もし指定したプロジェクトが初期化されていないなら、`kind` が `not-initialized` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-15
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-PROJECT-ACTIVATE-16
        pattern: unwanted
        statement: 'もし渡した設定ファイルを読めないなら、`kind` が `config-invalid` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-17
        pattern: unwanted
        statement: 'もし `host` が渡した設定ファイルの `host` と違うなら、`warnings` に 1 つ入れます'
      - id: PW-PROJECT-ACTIVATE-18
        pattern: unwanted
        statement: 'もし `host` が渡した設定ファイルの `host` と違うなら、設定ファイルの `host` で同期します'
      - id: PW-PROJECT-ACTIVATE-19
        pattern: unwanted
        statement: 'もし進行の欄に Blocked が無いなら、止めずに同期し、設定ファイルに `blocked` のキーを書きません'
      - id: PW-PROJECT-ACTIVATE-20
        pattern: event
        statement: 'Blocked か Needs Attention がボードにあると、同期でその id を設定ファイルに書きます'
      - id: PW-PROJECT-ACTIVATE-21
        pattern: unwanted
        statement: 'もし Status のフィールドが無いなら、設定ファイルに `fields.status` を書きません'
      - id: PW-PROJECT-ACTIVATE-22
        pattern: unwanted
        statement: 'もし進行の欄に必須の値（Blocked を除く 6 つ）が欠けているなら、`kind` が `not-initialized` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-23
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、設定ファイルを書かずアクティブなプロジェクトも切り替えず、する予定を結果に入れ、`dryRun` を `true` にして成功を返します'
      - id: PW-PROJECT-ACTIVATE-24
        pattern: event
        statement: '`project` に設定ファイルのパスかファイル名を渡すと、その設定ファイルの `workflow_suffix` の進行の欄で同期します'
      - id: PW-PROJECT-ACTIVATE-25
        pattern: event
        statement: '同期した中身が既存の設定ファイルと同じだと、ファイルを書き換えずに `change` を `unchanged` にし、そのプロジェクトをアクティブにします'
  PW-PROJECT-CREATE:
    help:
      details:
        - Creates a GitHub Projects V2 project for the owner.
        - Adds the pecot-workflow, pecot-priority and pecot-size fields to the project.
        - The pecot-workflow field is created with seven options, including Blocked.
        - Adds the Needs Attention option to the Status field of the project.
        - When an option cannot be added, a warning line is written and the command continues.
        - Writes the config file and makes the project active.
        - Stops without creating anything when the owner is not found.
        - Stops without creating anything when a project with the same title already exists.
        - With --dry-run, checks whether the project already exists and prints a dry-run line for creating it, and creates nothing.
      examples:
        - run: pecot project create example-org "Example Project" --suffix example
          note: Create a project and activate it.
        - run: pecot project create example-org "Example Project" --suffix example --dry-run
          note: Show the planned project without creating it.
      default_notes: {}
    summary: 新しいプロジェクトを作ります。既にあるプロジェクトにフィールドを足すときは、`project init` を使います。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      suffix: 'ワークフローのフィールドに付ける接尾辞です。'
      title: 'プロジェクトの題です。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - '所有者の GitHub Projects V2 のプロジェクトを作ります。'
      - 'プロジェクトに、pecot-workflow・pecot-priority・pecot-size のフィールドを足します。'
      - 'pecot-workflow のフィールドは、Blocked を含む 7 つの選択肢で作ります。'
      - 'プロジェクトの Status のフィールドに、Needs Attention の選択肢を足します。'
      - '選択肢を足せないときは、`warnings` に入れて続けます。'
      - '設定ファイルを書き、プロジェクトをアクティブにします。'
      - '所有者が見つからないときは、何も作らずに失敗を返します。'
      - '同じ題のプロジェクトが既にあるときは、何も作らずに失敗を返します。'
      - '`dry_run` を付けると、プロジェクトが既にあるかを読み、作る予定の `title` と `owner` を結果に入れて、何も作りません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        number: '作ったプロジェクトの番号です。`dry_run` のときは入りません。'
        url: '作ったプロジェクトの URL です。`dry_run` のときは入りません。'
        title: 'プロジェクトのタイトルです。'
        owner: 'プロジェクトのオーナーです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も作っていません。'
    diagnostics: '標準エラーに、次のものの結果の行を出します。作ったプロジェクト、作ったフィールドそれぞれ、足した Needs Attention の選択肢、設定ファイル、アクティブなプロジェクトです。選択肢を足せないときは、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: github-not-found
        code: 1
        when: '所有者が見つかりません。'
      - kind: already-exists
        code: 1
        when: '同じ題のプロジェクトがあります。'
      - kind: not-initialized
        code: 1
        when: '設定ファイルを作るときに、プロジェクトが pecot-workflow に準拠していません。'
      - kind: project-not-found
        code: 1
        when: '作った直後のプロジェクトを、所有者のプロジェクトの一覧で見つけられません。'
      - kind: invalid-input
        code: 2
        when: '必須の `owner`・`title`・`suffix` のどれかが無いか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'プロジェクトを作った後の手順で失敗すると、プロジェクトと、そこまでに作ったフィールドは GitHub に残ります。設定ファイルの生成に失敗すると、プロジェクトと 3 つのフィールドは残り、設定ファイルは書きません。これらの失敗の結果にも、作ったプロジェクトの `number` と `url` が入ります。'
    effects:
      - target: github
        kind: write
        what: 'プロジェクトと 3 つのフィールドを作り、Status のフィールドに Needs Attention の選択肢を足します。`dry_run` のときは書きません。'
      - target: github
        kind: read
        what: '所有者、既にあるプロジェクト、フィールド、つながっているリポジトリを読みます。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下に設定ファイルを書き、アクティブなプロジェクトを設定します。`dry_run` のときは書きません。'
    prerequisites:
      - 'ホストの GitHub トークンと、所有者のプロジェクトを作る権限が要ります。'
    idempotent: false
    examples:
      - arguments:
          owner: example-org
          title: Example Project
          suffix: example
        note: 'プロジェクトを作り、アクティブにします。'
      - arguments:
          owner: example-org
          title: Example Project
          suffix: example
          dry_run: true
        note: 'プロジェクトを作らずに、する予定を返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-CREATE-01
