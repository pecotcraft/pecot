      - id: PW-REVIEW-FINISH-16
        pattern: optional
        statement: '`dry_run` が有効なら、PR を読んでもコメントを書かず、`dryRun` を `true` にします。書くはずの本文は `body` に入れ、CLI では標準出力に出します'
      - id: PW-REVIEW-FINISH-17
        pattern: event
