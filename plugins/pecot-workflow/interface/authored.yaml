      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - kind: repo-mismatch
        when: '引数 `repo` が今の git remote と違います。`detail` が、渡した `repo` と今の git remote を並べて伝えます。'
      - kind: git-unresolved
        when: 'git のリポジトリの外で `repo` を省きました。選んだ remote のリポジトリを GitHub の `owner/repo` として読めないときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。このときの `detail` は `the repository is ambiguous` で始まり、理由と `repo` の案内が続きます。'
      - kind: not-initialized
        when: '`worktree-config.json` か `.worktreeignore` がありません。'
      - kind: config-invalid
        when: '`worktree-config.json` の内容が不正です。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: repo-not-in-project
        when: 'remote のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が含まないときも含みます。'
      - kind: repo-setting-missing
        when: '`develop_branch` が未設定で、`base` もありません。'
      - kind: other
        when: 'worktree を作れません。次のどれかです。メインの worktree が見つかりません。リポジトリが `base/` の配置にありません。ブランチ `wtN` が別の upstream で既にあります。`git worktree add` が失敗しました。devcontainer の外で動かしました。'
      - kind: invalid-input
        when: '`directory` が無いか、既にあるディレクトリでないか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: '最初のエラーで止まり、失敗を返します。`git worktree add` の後で `worktree-config.json` の内容が不正だと分かったときは、worktree とブランチは残ります。リンク・コピーしたファイル・setup の実行はありません。`wtN` の記録を書けなくても、worktree はそのままです。prune した管理情報と、消した未使用のブランチは、元に戻しません。飛ばしたリンク・コピーできなかったファイル・失敗した setup のコマンド・書けなかった `wtN` の記録は、`warnings` に入れて成功を返します。'
    effects:
      - target: git
        kind: write
        what: 'worktree とブランチ `wtN` を作り、upstream を設定します。worktree の git の管理ディレクトリに、`wtN` を記録します。'
      - target: git
        kind: destructive
        what: '古い worktree の管理情報を prune します。'
      - target: git
        kind: destructive
        what: '期待する upstream と合っていて、worktree の無い既存のローカルブランチ `wtN` を消します。'
      - target: file
        kind: read
        what: '`worktree-config.json`、`.worktreeignore`、アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'シンボリックリンクを作ります。git が無視しているファイルをコピーし、新しい worktree に `.pecot/.gitignore` を書きます。'
      - target: file
        kind: destructive
        what: '既にあるシンボリックリンクは置き換えます。'
      - target: file
        kind: destructive
        what: '新しい worktree のリンクのパスに既にある、実体のファイルかディレクトリを消します。'
      - target: process
        kind: destructive
        what: 'setup のコマンドをシェルを通して動かします。`.pecot/.gitignore` を書くスクリプトも動かします。'
    prerequisites:
