        view: '`Lanes` のビューです。`created`（作ったか）・`name`・`url`・`manual_steps`（画面で作る手順）を持ちます。`url` は、作れずに画面で作るときは入りません。`manual_steps` は、GitHub が作成を断ったときだけ入ります。`pecot-lane` を作らなかったときは入りません。'
    diagnostics: '標準エラーに、次のものの結果の行を出します。作ったプロジェクト、作ったフィールドそれぞれ、足した Needs Attention の選択肢、作ったビュー、設定ファイル、アクティブなプロジェクトです。`lanes` が無いときは、`pecot-lane` の `skipped` の行と、`lanes` の渡し方を案内する `warning` の行を出します。選択肢を足せないときと、ビューを作れないときは、`warning` の行を出します。'
