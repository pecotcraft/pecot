  PW-PR-CREATE:
    summary: PR（プルリクエスト）を作ります。
    arguments:
      base: 'base ブランチです。`message` では必須です。'
      draft: 'ドラフトの PR として作るかどうかです。'
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      head: 'head ブランチです。fork のブランチは `owner:branch` の形で渡します。'
      message: 'PR の本文です。ファイルを使わずに直接渡します。'
      no_issue_ref: '関連する Issue の自動の設定を飛ばすかどうかです。ブランチ名から番号を取り出さず、本文へ足さず、検証もしません。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。`message` と一緒に使います。'
      screenshot: 'Summary の画像を省く理由です。`message` と一緒に使います。'
      template: 'PR のテンプレートの種類です。`default` か `release` を渡します。'
      title: 'PR の題です。`message` では必須です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints:
      - requires: {message: [title, base]}
      - conflicts: [file, screenshot]
    details:
      - 'モードは、`file`・`message` の 2 つです。'
      - '両方を渡すと、`file` が `message` より優先されます。'
      - '`template` は、`default` か `release` です。'
      - 'テンプレートは MCP の resource（`pecot-template://pr/create` と `pecot-template://pr/release`）です。ファイルに写して書き込みます。'
      - '`file` と `default` のテンプレートで、フロントマターの base が空なら、投稿のときに base を決めます。スタックしたブランチは親ブランチ、そうでなければリポジトリの `develop_branch` です。'
      - 'スタックして着手した記録 `.pecot/state/.pecot-base` があると、base は `develop_branch` ではなく、記録の base（親ブランチ）です。今のブランチの `default` のテンプレートだけが対象です。`head` の引数・フロントマターの `head`・`release` のテンプレートでは、記録を読みません。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、スタック先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチにスタックしたものとします。変更を持つとは、同じコミットか、そのブランチをスタックし直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`cannot infer the stacked base` の文を `warnings` に入れます。求めた結果は書きません。'
      - 'スタック先を求められないとき、投稿は失敗を返し、PR を作りません。開発ブランチ向けの PR に、親ブランチの差分が入りうるためです。'
      - '親 PR が開いているときは、その base で PR を作ります。渡した base が `develop_branch` なら、`kind` が `content-invalid` の失敗を返します。'
      - '親 PR がマージ済みのときは、`develop_branch` を base にして PR を作ります。'
      - '親 PR は、開いている・マージ済み・閉じた、の順に選びます。'
      - '親 PR が無く、マージもされていないときは、PR を作りません。base ブランチに開いた PR が無いと書いた `detail` を入れて、`kind` が `pr-state` の失敗を返します。'
      - '記録の形が誤っているときは、base を決められないので、`kind` が `content-invalid` の失敗を返します。'
      - '記録のコミットが head の履歴に無いときは、`file` と `message` の投稿では PR を作らず、失敗を返します。このとき、親 PR と remote の先頭を読み、`pr_restack` と同じ判断でスタックし直し済みかを決めます。スタックし直し済みと決まったときだけ、`detail` の 2 行目で `pr_restack` で記録を書き直すことを案内します。最後の行で、記録を書いたブランチで呼ぶか、`head` を渡して記録なしで作るかを案内します。'
      - 'スタックした base の PR を作った後、親 PR のスタックに登録します。スタックが無ければ、2 つの PR で新しく作ります。親 PR がスタックの一番上に無いときは、追加を呼ばず、そのことを `warnings` に入れます。スタックの API が無いリポジトリと接続の失敗では、URL を添えて `warnings` に入れ、PR は残します。'
      - 'PR を作った後、head ブランチが指す Issue を待っている Issue を読み、判定に従って列を動かします。読むのは、選んだプロジェクトのボードの項目だけで、ボードに載っていない Issue は飛ばします。判定に作った PR が出ていないときは、約 1.5 秒待ってから 1 回だけ読み直します。着手の跡がある Issue は動かしません。'
      - '接続の失敗を含め、この処理の失敗は `warnings` に入れるだけで、成功と失敗を変えません。状態を確かめられないときは、`could not confirm that GitHub reflects PR #<N> ...` の文を入れます。その文には、後から `pecot-board-sync` のワークフローで列を直せると添えます。head の番号の Issue が PR のリポジトリに無いときは、何も入れずに飛ばします。リリースの PR では行いません。'
      - '番号の空いた `Closes #` の行は、head ブランチ名の末尾の番号で埋めます。テンプレートが `release` のときと、`no_issue_ref` を付けたときは埋めません。古い版の `.pecot/state/.pecot-active` が残っていても読まないので、`.pecot/state/` の無い clone でも同じ `Closes` が入ります。'
      - '`file` では、リポジトリ・base・題・head・draft をフロントマターで決めます。同じ名前の引数は無視します。'
      - '`message` では、リポジトリは `repo` です。`repo` を省くと、プロジェクトの設定にあるリポジトリを指す remote のリポジトリです。remote は `origin` を先に見て、次に `git remote` の順で見ます。'
      - '本文が head ブランチ名の末尾の番号 N に触れていないと、本文に `Closes #N` を足します。テンプレートが `release` のときと、`no_issue_ref` を付けたときは足しません。'
      - '`file` では、その Issue が Epic か種別を読めないとき、`Closes` を足さずに番号の空いた `Closes #` の行を消します。種別を読めないときは、`warnings` に入れます。'
      - '題・本文・base を確かめ、次のどれかが誤っていると、`kind` が `content-invalid` の失敗を返します。Issue の参照、必須の節、見出しの要約、記法、Summary のスクリーンショット、base ブランチです。'
      - 'リリースの種類が nx のリポジトリでは、題の scope が、変更した nx のプロジェクトの scope と違うときも、同じ失敗を返します。'
      - 'スタックした base の scope は、親 PR がマージ済みなら、記録のコミットから head までの差分で求めます。開いている間は、親ブランチとの差分で求めます。'
      - 'セッションのディレクトリを `pr_check` と同じように確かめます。引っかかりが見つかると、それぞれを `warnings` に入れ、`kind` が `preflight-failed` の失敗を返します。スタックしたブランチが remote とずれたときの Push Status の直し方も、`pr_check` と同じに決めます。'
      - 'PR を作った後、head ブランチが指す Issue を In Review にします。テンプレートが `release` のときは行いません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '作った PR の URL です。'
    mcp_output:
      fields:
        url: '作った PR の URL です。'
        number: '作った PR の番号です。応答に番号が無いときは入りません。'
        head: 'PR の head ブランチです。fork のブランチは `owner:branch` の形です。'
        base: 'PR の base ブランチです。'
        title: 'PR のタイトルです。'
        inReview: 'Status を In Review にした Issue の番号です。設定しなかったときは入りません。'
        stack: 'スタック PR の、親 PR とスタックへの登録です。スタックしない PR では入りません。`lower`（親 PR の番号）を必ず持ちます。`registered`（スタックに登録したか）も必ず持ちます。`number`（スタックの番号）は、登録したときだけ入ります。'
        moves: 'この PR を待っていた Issue のうち、列か Status を書いたものの配列です。要素は `issue`・`reason` を必ず持ち、列を動かしたときは `from`・`to`、Status を書いたときは `label` も持ちます。'
    diagnostics: '標準エラーに、PR の結果の行（`created`）と、ボードの status の結果の行（`set`）を出します。スタックした base のときは、スタックの結果の行（`added: PR #N to stack #S`）も出します。待っていた Issue を動かしたときは、`moved:` の行も出します。検証の失敗ごとに、`error` の行を 1 つ出します。事前の確認が `warning` を見つけたときは、`error` の行に続けて、`warning` ごとの行を出します。ボードの status を設定できないときと、Issue の種類を読めないときは、`warning` の行を出します。スタックに登録できないときは、`warning: could not register stack: <理由>` の行を出します。親 PR がスタックの一番上に無いときは、`warning: could not register stack: PR #<親> is not the top ...` の行を出します。待っている Issue を読めないか動かせないときも、`warning` の行を出します。確かめられないときは、`warning: could not confirm that GitHub reflects PR #<N> ...` の行を出します。親 PR が無いときは、`error: base branch <base> has no open PR` の行と直し方の行を出します。記録が無くスタック先を求められないときは、`error: cannot infer the stacked base: <理由>` の行と直し方の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        when: '`template` が `default` でも `release` でもありません。モードの引数が無いとき、`message` に `title` か `base` が無いとき、ファイルと一緒に `screenshot` を渡したときも含みます。'
      - kind: content-invalid
        when: 'フロントマターを読めないか、正しいリポジトリがありません。'
      - kind: invalid-input
        when: 'リポジトリが `owner/repo` の形ではありません。'
      - kind: git-unresolved
        when: 'リポジトリか head ブランチを決められません。'
      - kind: content-invalid
        when: 'スタックした base の記録の形が誤っていて、base を決められません。'
      - kind: git-unresolved
        when: 'スタックした base の記録のコミットが head の履歴にありません。`file` と `message` の投稿のときです。'
      - kind: git-unresolved
        when: '記録が無く、スタック先を求められません。`file` と `message` の投稿のときです。'
      - kind: repo-setting-missing
        when: '`develop_branch` か `release_branch` が未設定です。'
      - kind: preflight-failed
        when: '事前の確認が致命的な場合に当たりました。git のリポジトリでない、git remote が無い、今のブランチが無い、のどれかです。'
      - kind: other
        when: 'テンプレートが見つかりません。'
      - kind: preflight-failed
        when: '事前の確認が `warning` を見つけました。push していない、コミットしていない変更がある、stash がある、のどれかです。'
      - kind: pr-state
        when: '親 PR が開いておらず、マージもされていないので、スタックした base の PR を作れません。'
      - kind: invalid-input
        when: '引数の誤りがあります。'
      - kind: content-invalid
        when: '本文が規則に反しています。次のどれかです。Issue の参照 `#N` がありません。必須の節がありません。見出しの要約の規則に反します。使えない記法があります。Summary に画像もスクリーンショットの理由もありません。base ブランチが誤っています。nx のリポジトリでは、題の scope が誤っているときも含みます。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '検証に失敗したときと、事前の確認が引っかかりを見つけたときは、PR を作りません。PR を作った後でボードの status を設定できないときは、PR は残り、`warnings` に入れます。ボードの status だけを設定できなかったときは、成功を返します。'
    effects:
