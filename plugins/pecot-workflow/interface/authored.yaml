  PW-BOARD-SHOW:
    summary: プロジェクトの情報のダッシュボードを出します。
    arguments:
      json: 'JSON で出力するかどうかです。結果の項目は、この値によらず同じです。'
      repo: '対象のリポジトリです。`owner/repo` の形で明示して渡します。'
    constraints: []
    details:
      - 'アクティブなプロジェクト、登録したリポジトリ、ボードの状態を返します。'
      - 'ボードの状態は、Backlog・Pending・Blocked・Ready・Active・In Review にある open の項目が対象です。'
      - '登録したリポジトリの要素には、リリースの種類と Dependabot alert の状態を載せます。'
      - 'alert を読めないリポジトリは、理由を入れるだけで、失敗にはしません。'
      - '`repo` を渡すと、ボードの項目を 1 つのリポジトリに絞ります。'
      - 'Ready と Blocked にある open の Issue の blocked-by を読み、それぞれを `startable`・`stackable`・`blocked` のどれかに判定します。Active と In Review の Issue は読みません。'
      - '札が `Needs Attention` で着手の跡の無い Issue は、コメントも読みます。自動処理が書いた札かを決め、board-sync の action と同じ規則で数えるためです。'
      - '判定は返すだけです。Issue の列と Status は、判定に合っていなくても変えません。'
      - '前提を読めない Issue は、判定を `unknown` にします。'
      - 'Issue の依存関係に対応していない GitHub Enterprise Server では、`readiness` の無いボードを返します。'
      - 'board-sync の action が列か Status を動かすはずの Ready か Blocked の Issue があると、`warnings` に 1 つ入れます。件数を載せ、`pecot-board-sync` のワークフローを手で動かすよう案内します。件数の数え方は、board-sync の action と同じ規則です。前提の無い Blocked の Issue は、ブランチと PR を読んでいなくても数えます。そのため、列か Status が合っていないおそれがあると伝えます。'
      - '進行の欄がまだ旧い名前（`pecot-workflow-<suffix>`）なら、同じようにボードを読みます。旧い名前を載せて `project_init` を案内する警告を、`warnings` に 1 つ入れます。'
      - 'Item の値に `pecot-priority`・`pecot-size` が残っていれば、残ったフィールドの名前を同じ警告に足します。値の入った Item が無いボードと、値が 10 個を超える Item だけのボードでは、残っていても気づけません。'
    stdin: none
    output:
      format: text
      description: 'Overview・Registered repositories・Board status の節がある Markdown です。Ready と Blocked の表には、Readiness の列があります。`json` を付けると、`project`・`repositories`・`board` を持つ JSON のオブジェクトです。`repositories` の各要素は `dependabot_alerts` を、`board` の各項目は `readiness` を持ちます。'
    mcp_output:
      fields:
        project: 'アクティブなプロジェクトの概要です。`name`・`host`・`owner`・`number`・`aggregation_repo` を持ちます。ロードマップのリポジトリが未設定なら、`aggregation_repo` は `null` です。キーは snake_case です。'
        repositories: '登録したリポジトリの配列です。登録順に並びます。キーは snake_case です。要素は `full_name`・`owner`・`name`・`develop_branch`・`release_branch`・`dependabot_alerts` を持ちます。ブランチが未設定なら `null` です。`dependabot_alerts` は、読めなかったときは理由の `error` だけを持ちます。読めたときは `enabled`・`open_count`・`max_severity`・`alerts_url` を持ちます。要素は、`release_type`（`single`・`multi`・`nx`）と `packages`（`name` と `changelog` の配列。無ければ空）も持ちます。package の無いリポジトリに CHANGELOG の設定があるときだけ、`changelog_file` も持ちます。'
        board: 'ボードの状態です。`items` の配列を持ち、Backlog・Pending・Blocked・Ready・Active・In Review にある開いた項目が入ります。キーは snake_case です。要素は `id`・`workflow`（列。無ければ `null`）・`title`・`updatedAt`・`content`・`readiness` を持ちます。`content` は `number`・`state`・`url`・`labels`・`repository` を持ちます。`readiness` は、Ready と Blocked の Issue だけが `kind`・`stackOn`・`reason`・`text` を持ち、ほかの項目は `null` です。サーバが Issue の依存を扱えないときは、`readiness` ごと入りません。要素は `lane`（`pecot-lane` の値。無ければ `null`）も持ちます。'
        lanes: '`pecot-lane` の値ごとの Issue の数です。要素は `name`・`count`・`startable` を持ちます。選択肢の順に並び、値の無い組は `name` が `null` で末尾に来ます。ボードに `pecot-lane` が無ければ空の配列です。'
        mismatches: 'Ready か Blocked の Issue のうち、列と Status のどちらかが判定と食い違う疑いのあるものの件数です。'
    diagnostics: 'GitHub Enterprise Server が Issue の依存関係に対応していないときは、標準エラーに `warning` の行を 1 つ出します。Ready か Blocked の Issue の列か Status が判定に合っていないおそれがあるときも、`warning` の行を 1 つ出します。進行の欄が旧い名前のときと、`pecot-priority`・`pecot-size` が残っているときも、合わせて `warning` の行を 1 つ出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: other
        when: '予期しないエラーが起きました。'
      - kind: invalid-input
        when: '`repo` が `owner/repo` の形でないか、ほかの引数の誤りがあります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
