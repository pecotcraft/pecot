      - id: PW-WORKTREE-INIT-04
        pattern: event
        statement: 'アクティブなプロジェクトが無いか `aggregation_repo` が無いと、共有する 3 つのリンクをこのリポジトリに向けます'
      - id: PW-WORKTREE-INIT-05
        pattern: event
