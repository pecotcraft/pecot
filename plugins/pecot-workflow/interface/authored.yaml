  PW-PR-CREATE:
    help:
      details:
        - "Has three modes: --prepare, a file argument and -m."
        - When more than one mode is given, --prepare wins over the file and the file wins over -m.
        - --template is default or release.
        - With --prepare, copies the template to .pecot/tmp/output/ and prints its path.
        - With --prepare and the default template, sets base in the copy to the develop_branch of the repository.
        - "When the base record .pecot/state/.pecot-base of a stacked start exists, the default template of the current branch uses the base branch it names (the branch of the layer below) instead of develop_branch. The record is not read with --head, a head in the front matter, or the release template."
        - With --prepare and such a record, sets base in the copy to the base of the record without any network call.
        - "When the PR of the layer below is open, creates the PR on that base, and stops with exit status 3 if the base given is develop_branch."
        - "When the PR of the layer below is merged, creates the PR on develop_branch."
        - "When the layer below has no open PR and is not merged, creates nothing and stops with exit status 2 with an error line that says the base branch has no open PR."
        - "When the record is malformed, stops with exit status 1 because the base cannot be decided."
        - After the PR on a stacked base is created, registers it in the stack of the layer below, or starts a stack of the two PRs when none exists. When the repository has no stack API, prints a warning and keeps the PR.
        - "After the PR is created, reads the Issues that wait for the Issue named by the head branch, and moves their board column by the readiness judgement. Issues with a trace of work are not moved. A failure of this step only prints a warning. Dry runs and release PRs skip it."
        - With --prepare in an nx repository, adds the expected title scope as a comment on the title line.
        - "With --prepare and the default template, fills the trailing Closes # with the number of the active task, or else the number that ends the branch name."
        - "The Closes # of the copy is left empty when that Issue is an Epic."
        - With a file, the repository, base, title, head and draft come from its front matter and the options of the same names are ignored.
        - With -m, the repository is --repo, or the only repository of the active project when --repo is omitted.
        - "Unless the template is release or --no-issue-ref is given, appends Closes #N to the body when it does not mention the number N that ends the head branch name."
        - With a file, Closes is not appended when that Issue is an Epic.
        - Checks the title, body and base, and stops with exit status 3 when the Issue reference, a required section, the heading summaries, the notation, the Summary screenshot or the base branch is wrong.
        - In a repository whose release type is nx, also stops with exit status 3 when the title scope differs from the scope of the changed nx projects.
        - Unless --dry-run is given, runs the same checks as pr preflight on the current directory and stops with exit status 2 when they find a warning.
        - "With --dry-run, validates and writes dry-run: would lines without creating the PR."
        - After the PR is created, sets the Issue named by the head branch to In Review unless the template is release.
        - Removes the flag pr-create-slash-pending after the PR is created.
      examples:
        - run: pecot pr create --prepare
          note: Write a PR template and print its path.
        - run: pecot pr create .pecot/tmp/output/pr-create-20260101-120000.md --dry-run
          note: Validate the file without creating the PR.
        - run: 'pecot pr create -m "<body>" -t "feat: add a report" -b develop -r example-org/my-repo'
          note: Create a PR from the command line.
      default_notes:
        head: The current branch. The related Issue is the number that ends the head branch name.
        repo: With -m, the only repository of the active project when there is exactly one. With a file, the repository in the front matter.
    summary: PR（プルリクエスト）を作ります。
    arguments:
      base: 'base ブランチです。`-m` では必須です。'
      draft: 'ドラフトの PR として作るかどうかです。'
      dry_run: '検証だけを行うかどうかです。事前の確認を飛ばし、PR は作りません。'
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      head: 'head ブランチです。'
      message: 'PR の本文です。コマンドラインから直接渡します。'
      no_issue_ref: '関連する Issue の自動の設定を飛ばすかどうかです。ブランチ名から番号を取り出さず、本文へ足さず、検証もしません。'
      prepare: 'テンプレートを作業用のディレクトリにコピーするかどうかです。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。`-m` と一緒に使います。'
      screenshot: 'Summary の画像を省く理由です。`-m` と一緒に使います。'
      template: 'PR のテンプレートの種類です。`default` か `release` を渡します。'
      title: 'PR の題です。`-m` では必須です。'
    constraints:
      - requires: {message: [title, base]}
      - conflicts: [file, screenshot]
    details:
      - 'モードは、`--prepare`・ファイルの引数・`-m` の 3 つです。'
      - '複数のモードを渡すと、`--prepare` がファイルより優先され、ファイルが `-m` より優先されます。'
      - '`--template` は、`default` か `release` です。'
      - '`--prepare` では、テンプレートを `.pecot/tmp/output/` にコピーし、そのパスを出します。'
      - '`--prepare` と `default` のテンプレートでは、コピーの base をリポジトリの `develop_branch` にします。'
      - '積んで着手した記録 `.pecot/state/.pecot-base` があると、base は `develop_branch` ではなく、記録の base（下の段のブランチ）です。今のブランチの `default` のテンプレートだけが対象です。`--head`・フロントマターの `head`・`release` のテンプレートでは、記録を読みません。'
      - '記録があるときの `--prepare` は、通信せずに、コピーの base を記録の base にします。'
      - '下の段の PR が開いているときは、その base で PR を作ります。渡した base が `develop_branch` なら、終了コード 3 で止まります。'
      - '下の段の PR がマージ済みのときは、`develop_branch` を base にして PR を作ります。'
      - '下の段の PR が無く、マージもされていないときは、PR を作りません。base ブランチに開いた PR が無いと書いた `error` の行を出し、終了コード 2 で止まります。'
      - '記録の形が誤っているときは、base を決められないので、終了コード 1 で止まります。'
      - '積んだ base の PR を作った後、下の段のスタックに登録します。スタックが無ければ、2 つの PR で新しく作ります。スタックの API が無いリポジトリでは、`warning` の行を出し、PR は残します。'
      - 'PR を作った後、head ブランチが指す Issue を待っている Issue を読み、判定に従って列を動かします。着手の跡がある Issue は動かしません。この処理の失敗は `warning` の行にとどめます。`--dry-run` とリリースの PR では行いません。'
      - 'nx のリポジトリの `--prepare` では、期待する題の scope を、題の行にコメントとして足します。'
      - '`--prepare` と `default` のテンプレートでは、末尾の `Closes #` に、着手中のタスクの番号を入れます。着手中のタスクが無ければ、ブランチ名の末尾の番号を入れます。'
      - 'その Issue が Epic のときは、コピーの `Closes #` を空のままにします。'
      - 'ファイルでは、リポジトリ・base・題・head・draft をフロントマターで決めます。同じ名前のオプションは無視します。'
      - '`-m` では、リポジトリは `--repo` です。`--repo` を省くと、アクティブなプロジェクトの唯一のリポジトリです。'
      - '本文が head ブランチ名の末尾の番号 N に触れていないと、本文に `Closes #N` を足します。テンプレートが `release` のときと、`--no-issue-ref` を付けたときは足しません。'
      - 'ファイルでは、その Issue が Epic のときは `Closes` を足しません。'
      - '題・本文・base を確かめ、次のどれかが誤っていると終了コード 3 で止まります。Issue の参照、必須の節、見出しの要約、記法、Summary のスクリーンショット、base ブランチです。'
      - 'リリースの種類が nx のリポジトリでは、題の scope が、変更した nx のプロジェクトの scope と違うときも、終了コード 3 で止まります。'
      - '`--dry-run` を付けなければ、今のディレクトリを `pr preflight` と同じように確かめ、`warning` が見つかると終了コード 2 で止まります。'
      - '`--dry-run` を付けると、検証して `dry-run: would` の行を書き、PR は作りません。'
      - 'PR を作った後、head ブランチが指す Issue を In Review にします。テンプレートが `release` のときは行いません。'
      - 'PR を作った後、フラグ `pr-create-slash-pending` を消します。'
    stdin: none
    output:
      format: text
      description: '`--prepare` のときは、テンプレートのコピーのパスです。それ以外では、作った PR の URL です。`--dry-run` のときは、何も出しません。'
    diagnostics: '標準エラーに、PR の結果の行（`created`）と、ボードの status の結果の行（`set`）を出します。積んだ base のときは、スタックの結果の行（`added: PR #N to stack #S`）も出します。待っていた Issue を動かしたときは、`moved:` の行も出します。`--prepare` のときは、base・題の scope の目安・`Closes` の `set` の行を出します。`--dry-run` のときは、PR と status の `dry-run: would` の行を出します。検証の失敗ごとに、`error` の行を 1 つ出します。事前の確認が `warning` を見つけたときは、`error` の行に続けて、`warning` ごとの行を出します。ボードの status を設定できないときと、Issue の種類を読めないときは、`warning` の行を出します。スタックに登録できないときは、`warning: could not register stack: <理由>` の行を出します。待っている Issue を読めないか動かせないときも、`warning` の行を出します。下の段の PR が無いときは、`error: base branch <base> has no open PR` の行と直し方の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'テンプレートをコピーしたか、PR を作ったか、`--dry-run` の検証を通りました。ボードの status を設定できなかったときも 0 です。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。`--template` が `default` でも `release` でもありません。モードの引数がありません。`-m` に `-t` か `-b` がありません。ファイルと一緒に `--screenshot` を渡しました。フロントマターを読めないか、正しいリポジトリがありません。リポジトリを決められないか、`owner/repo` の形ではありません。head ブランチを決められません。積んだ base の記録の形が誤っていて、base を決められません。`develop_branch` か `release_branch` が未設定です。事前の確認が致命的な場合に当たりました（git のリポジトリでない、git remote が無い、今のブランチが無い）。GitHub API がエラーを返しました。'
      - code: 2
        when: '事前の確認が `warning` を見つけたか（push していない、コミットしていない変更がある、stash がある）。または、下の段の PR が開いておらず、マージもされていないので、積んだ base の PR を作れません。ほかのコマンドラインの誤りがあります。'
      - code: 3
        when: '次のどれかです。Issue の参照 `#N` がありません。必須の節がありません。見出しの要約の規則に反しています。使えない記法があります。Summary に画像もスクリーンショットの理由もありません。base ブランチが誤っています。nx のリポジトリでは、題の scope が誤っているときも 3 です。'
    on_error: '検証に失敗したときと、事前の確認が `warning` を見つけたときは、PR を作りません。PR を作った後でボードの status を設定できないときは、PR は残り、`warning` を書きます。`--prepare` が書いたテンプレートのコピーは、`.pecot/tmp/output/` に残ります。'
    effects:
      - target: github
        kind: write
        what: 'PR を作り、関連する Issue のボードの status を In Review にします。積んだ base の PR は、スタックに登録します。この PR を待っていた Issue の列を動かします。'
      - target: github
        kind: read
        what: '関連する Issue の種類と、そのボードの項目を読みます。積んだ base では、下の段の PR とスタックも読みます。待っている Issue とボードも読みます。'
      - target: git
        kind: read
        what: 'ブランチ・remote・status・stash・push の状態を読みます。nx のリポジトリでは、base との差分も読みます。'
      - target: process
        kind: read
        what: 'リリースの種類が nx のリポジトリでは、`nx graph` を動かしてプロジェクトの一覧を取ります。'
      - target: file
        kind: write
        what: 'テンプレートのコピーを `.pecot/tmp/output/` の下に書きます。`.pecot/state/` の下のフラグ `pr-create-slash-pending` を消します。'
      - target: file
        kind: read
        what: 'PR のファイル、テンプレート、アクティブな設定ファイル、`.pecot/state/.pecot-active` を読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
      - 'head ブランチを push 済みにし、作業ツリーの変更を無くしておきます。'
    idempotent: false
    examples:
      - run: pecot pr create --prepare
        note: 'PR のテンプレートを書き、そのパスを出します。'
      - run: pecot pr create .pecot/tmp/output/pr-create-20260101-120000.md --dry-run
