  PW-RELEASE-CREATE:
    constraints: []
    details:
      - Creates a GitHub release and its tag through the GitHub API, so no git tag or git push is needed.
      - "The release notes are the section of the given version in the CHANGELOG, from the line after its ## [X.Y.Z] heading to the next ## heading."
      - The CHANGELOG is the changelog_file of the repository in the config file.
      - Without changelog_file, the CHANGELOG is CHANGELOG.md and then AIST-CHANGELOG.md at the git root, and with --package, the changelog of that package.
      - When the tag does not exist yet, the tag is created at the head of the release_branch of the repository in the config file.
      - The tag is v<version> and the release name is the same.
      - With --package, the tag is <package>-v<version> and the release name is <package> v<version>.
      - The version must be in X.Y.Z form without a leading v.
      - A repository with packages configured needs --package.
      - A repository without packages does not accept --package.
      - The repository is taken from the global pecot --repo, and without it from the origin remote.
      - The command needs the working directory to be inside a git repository.
      - A mismatch between --repo and the current git remote is a warning, and --repo is used.
      - With --dry-run, the release is not created and no GitHub client is made.
    stdin: none
    output:
      format: text
      description: The URL of the created release. With --dry-run, the release notes instead.
    diagnostics: A result line on stderr for the created release, or a plan line with --dry-run. A warning line when --repo differs from the git remote. An error line on a failure, except when the GitHub token cannot be found, where a traceback is printed.
    environment: []
    exit_status:
      - code: 0
        when: The release was created, or the plan was printed with --dry-run.
      - code: 1
        when: The version is not in X.Y.Z form, the root directory of the git repository cannot be found, there is no active project, the --package rules are broken, the CHANGELOG or the version in it is not found, release_branch is not set, the GitHub API returned an error, the origin remote cannot be read without --repo, the repository is ambiguous outside git without --repo, the GitHub token cannot be found (a traceback is printed), or the project root cannot be determined.
      - code: 2
        when: The version argument is missing, or another command line error occurs.
    on_error: Nothing is created on GitHub when a step fails.
    effects:
      - target: github
        kind: write
        what: Creates the release and the tag.
      - target: file
        kind: read
        what: Reads the active config file and the CHANGELOG.
      - target: git
        kind: read
        what: Reads the root directory of the git repository and the origin remote URL.
    prerequisites:
      - An active project exists (pecot project activate).
      - The working directory is inside a git repository.
      - The release_branch of the repository is set in the config file (pecot project set-repo).
      - The CHANGELOG has a section for the version.
      - A GitHub token is available for the host, with permission to create releases.
    idempotent: false
    examples:
      - run: pecot release create 0.6.1
        note: Create the release v0.6.1 from the CHANGELOG.
      - run: pecot release create 0.6.1 --dry-run
        note: Print the plan and the release notes without creating anything.
      - run: pecot release create 0.6.1 --package pecot-workflow
        note: Create the release pecot-workflow-v0.6.1 in a monorepo.
    default_notes:
      package: None; required when the repository has packages configured in the config file.
    behaviors:
      - id: PW-RELEASE-CREATE-01
        pattern: event
        statement: 版を渡して打つと、CHANGELOG のその版の節をリリースノートにして GitHub のリリースを作る
      - id: PW-RELEASE-CREATE-02
        pattern: event
