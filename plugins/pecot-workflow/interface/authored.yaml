  PW-SECURITY-SYNC:
    help:
      details:
        - Finds the open Tracker issue labeled security-alert whose body has the Tracker marker.
        - Rewrites the list between list-begin and list-end in the body of the Tracker with the open alerts.
        - Reads the open Dependabot alerts, the open code scanning alerts of the default branch and the open secret scanning alerts.
        - Each kind has its own heading and table in the Tracker body.
        - Priority comes from the alert severity.
        - A secret scanning alert is always high.
        - The Priority of a new Tracker is the highest Priority among its rows.
        - The rows of code scanning and secret scanning alerts show masked as the title.
        - A Dependabot row shows the advisory summary, and Dependabot alerts of one advisory share a row.
        - Text in the Tracker body outside the list markers stays as it is.
        - A kind whose feature is disabled shows disabled under its heading and adds no rows.
        - A repository without a code scanning analysis counts as having no code scanning alerts.
        - A kind whose list cannot be fetched keeps its previous rows and shows unavailable when it had none.
        - When a kind cannot be fetched, the command ends with exit status 1 after the other kinds were applied.
        - A 403 for Dependabot alerts or a 404 for secret scanning that cannot be confirmed as disabled counts as a failure to fetch.
        - When no Tracker is open and there are rows to list, creates a Tracker, adds it to the project board, and sets Status to Backlog and Priority to the highest row.
        - When no Tracker is open and there is no row to list, creates nothing.
        - Never closes the Tracker.
        - When every alert is gone, each kind shows none, and a person closes the Tracker and moves it to Archived.
        - On an existing Tracker, sets Status and Priority only while they are empty, so a change made by a person stays.
        - A field that the active project does not define is not set.
        - When several Trackers are open, uses the lowest number and leaves the others open.
        - A closed Tracker is not reused.
      examples:
        - run: pecot security sync --dry-run
          note: Show the planned Tracker changes without writing to GitHub.
        - run: pecot security sync
          note: Rewrite the Tracker list, creating the Tracker when needed.
      default_notes: {}
    summary: open のセキュリティ alert の一覧を、open の Tracker に書き直します。
    arguments:
      dry_run: '何も変えずに、Tracker を変える予定だけを出すかどうかです。'
    constraints: []
    details:
      - 'ラベルが `security-alert` で、本文に Tracker の印がある open の Tracker の Issue を探します。'
      - 'Tracker の本文の `list-begin` と `list-end` の間にある一覧を、open の alert で書き直します。'
      - 'open の Dependabot alert、既定ブランチの open の code scanning alert、open の secret scanning alert を読みます。'
      - 'Tracker の本文では、種類ごとに見出しと表を分けます。'
      - 'Priority は、alert の severity から決めます。'
      - 'secret scanning alert は、必ず high です。'
      - '新しい Tracker の Priority は、行の Priority のうち最も高いものです。'
      - 'code scanning alert と secret scanning alert の行では、題を `masked` と出します。'
      - 'Dependabot の行には advisory の要約を出します。同じ advisory の Dependabot alert は、1 つの行にまとめます。'
      - 'Tracker の本文のうち、一覧の印の外にある文はそのまま残します。'
      - '機能が無効の種類は、見出しの下に `disabled` と出し、行を足しません。'
      - 'code scanning の解析が無いリポジトリは、code scanning alert が無いものとして数えます。'
      - '一覧を取れない種類は、前の行を残します。前の行が無かったときは、`unavailable` と出します。'
      - '取れない種類があるときは、ほかの種類を反映した後で、終了コード 1 で終わります。'
      - 'Dependabot alert の 403 と、secret scanning の 404 は、無効だと確かめられなければ、取れなかったものとして数えます。'
      - 'open の Tracker が無く、載せる行があるときは、Tracker を作ってプロジェクトのボードに足します。Status を Backlog、Priority を最も高い行の値にします。'
      - 'open の Tracker が無く、載せる行も無いときは、何も作りません。'
      - 'Tracker を閉じることはありません。'
      - 'alert がすべて無くなると、どの種類も `none` と出します。Tracker を閉じて Archived へ動かすのは、人です。'
      - '既にある Tracker には、Status と Priority が空の間だけ値を入れます。人が変えた値は残ります。'
      - 'アクティブなプロジェクトが定義していないフィールドは設定しません。'
      - 'open の Tracker が複数あるときは、番号が最小のものを使い、ほかは open のまま残します。'
      - '閉じた Tracker は使い回しません。'
    stdin: none
    output:
      format: none
    diagnostics: '変更ごとに結果の行（`created`・`added`・`removed`・`updated`・`unchanged`・`skipped`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。open の Tracker が複数あるときは、`warning` の行を出します。失敗ごとに `error` の行を出します。一覧を取れなかった種類ごとの行も含みます。'
    environment: []
    exit_status:
      - code: 0
        when: 'Tracker を同期したか、`--dry-run` で予定を出しました。どの種類も、取れたか無効でした。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。git remote からリポジトリを読めません。Issue の一覧を取れません。ある種類の一覧を取れません。Tracker の本文にある `list-begin` と `list-end` の印が、ちょうど 1 組ではありません。Tracker の作成・書き直し・ボードへの配置のどれかに失敗しました。GitHub トークンが見つかりません。取れない種類があるときは、`--dry-run` でも終了コードは 1 です。'
      - code: 2
        when: 'コマンドラインの誤りがあります。'
    on_error: '作った Tracker は、ボードへの配置に失敗しても GitHub に open のまま残り、次の実行でボードに置きます。本文の書き直しに失敗したときは、本文は元のままで、次の実行でやり直します。済んだ変更は巻き戻しません。'
