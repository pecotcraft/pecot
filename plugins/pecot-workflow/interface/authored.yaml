  PW-ISSUE-QUICK:
    constraints: []
    details:
      - Creates an Issue from a free-format message in one step, without template validation.
      - The title is the first 50 characters of the message with each run of whitespace turned into one space, prefixed by the type.
      - Adds the Issue to the project board and sets status, priority and size by type.
      - For task and bug the values are active, medium and s; for epic and tracker they are backlog and medium, with no size.
      - With a parent Epic, links the Issue as a sub-issue of it.
      - Giving a parent Epic to an Epic gives a warning.
      - Unless --no-branch is given, creates a linked branch named feat/<YYYYMMDD-HHMMSS>/<N> from the develop_branch of the repository.
      - After the branch is created, or with --no-branch, writes the work target to .pecot/state/.pecot-active and creates .pecot/work/<N>/.
      - For a type other than epic and tracker, creates the flag .pecot/state/.pecot-quick-mode.
      - With a parent Epic and --order, stops when another Issue of that Epic has the same order.
    stdin: none
    output:
      format: text
      description: The URL of the created Issue.
    diagnostics: "Result lines on stderr: created (the Issue, then the branch), added (to the project, then to the parent Epic as a sub-issue), set (status, priority and size, then the work target). Warning lines when adding to the project fails, when the branch cannot be created, and when a parent Epic is given to an Epic. An error line for each failure. A malformed --parent-epic is reported by the command line parser as a usage error, not as an error line."
    environment: []
    exit_status:
      - code: 0
        when: The Issue was created. Failing to add it to the board, or failing to create the branch through the API, still gives 0.
      - code: 1
        when: The message is empty, the repository is not in owner/repo form, there is no active project, the repository is not linked to the project, another Issue of the parent Epic has the same order, linking to the parent Epic failed, develop_branch is not set for the repository, or the GitHub API returned an error.
      - code: 2
        when: --parent-epic is malformed, -m or -r is missing, or another command line error occurs.
    on_error: When develop_branch is not set, the Issue stays on the board with its fields and sub-issue link already set; the URL is not printed and neither .pecot-active nor .pecot-quick-mode is written. When the branch cannot be created through the API, a warning is written and .pecot-active is not written. When adding to the project board fails, the Issue stays, a warning is written and nothing more is done. When linking to the parent Epic fails, the Issue stays on the board with its fields set.
    effects:
      - target: github
        kind: write
        what: Creates an Issue, adds it to the project board, sets its fields, links it to the parent Epic and creates a linked branch.
      - target: github
        kind: read
        what: Reads the repositories linked to the project, the sub-issues of the parent Epic and the head of the develop branch.
      - target: file
        kind: write
        what: Writes .pecot/state/.pecot-active and .pecot/state/.pecot-quick-mode, creates .pecot/work/<N>/, and removes the flags issue-pending and issue-create-slash-pending.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: false
    examples:
      - run: "pecot issue quick -r example-org/my-repo -m \"Add an API endpoint\""
        note: Create a task, its branch and the work target.
      - run: "pecot issue quick -r example-org/my-repo -m \"Update the docs\" --no-branch"
        note: Create a task without a branch.
    default_notes:
      type: task. The status, priority and size set on the board are decided by the type.
    behaviors:
      - id: PW-ISSUE-QUICK-01
        pattern: event
        statement: メッセージとリポジトリを渡すと、Issue を 1 件作る
      - id: PW-ISSUE-QUICK-02
        pattern: event
        statement: メッセージを渡すと、先頭 50 文字をタイトルにする
      - id: PW-ISSUE-QUICK-03
        pattern: event
        statement: Issue を作ると、プロジェクトのボードに足す
      - id: PW-ISSUE-QUICK-04
        pattern: event
        statement: ボードに足すと、type に応じた status・priority・size を設定する
      - id: PW-ISSUE-QUICK-05
        pattern: event
        statement: --parent-epic を付けて打つと、その Epic の sub-issue につなぐ
      - id: PW-ISSUE-QUICK-06
        pattern: event
        statement: Epic に --parent-epic を付けて打つと、warning の行を標準エラーに出す
      - id: PW-ISSUE-QUICK-07
        pattern: event
        statement: --no-branch を省いて打つと、develop_branch から feat/<YYYYMMDD-HHMMSS>/<N> のリンク付きブランチを作る
      - id: PW-ISSUE-QUICK-08
        pattern: event
        statement: ブランチを作ると、.pecot/state/.pecot-active に作業対象を書く
      - id: PW-ISSUE-QUICK-09
        pattern: event
        statement: ブランチを作ると、.pecot/work/<N>/ を作る
      - id: PW-ISSUE-QUICK-10
        pattern: event
        statement: --no-branch を付けて打つと、ブランチを作らずに .pecot/state/.pecot-active を書く
      - id: PW-ISSUE-QUICK-11
        pattern: event
