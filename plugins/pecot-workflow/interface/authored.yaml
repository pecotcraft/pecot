  PW-DELETE-BRANCH:
    help:
      details:
        - Deletes a remote branch through the GitHub REST API, for use where a hook blocks git push and the gh CLI.
        - The repository to delete from is the repo_ref argument (owner/repo).
        - The global pecot --repo is only checked against the current git remote and is not used as the target.
        - The default branch of the repository and the develop_branch and release_branch in the config file are protected and are never deleted.
        - Also deletes the remote branch wip/<branch> when it exists.
        - A wip/<branch> that does not exist is skipped without a message.
        - A wip/<branch> that exists but cannot be deleted gives a warning, and the command still finishes with exit status 0.
        - --dry-run reads the default branch and checks the protected branches, then writes the plan line for the branch and deletes nothing.
        - --dry-run does not plan the deletion of wip/<branch>.
      examples:
        - run: pecot delete-branch example-org/my-repo feat/my-change/123
          note: Delete the remote branch and its wip branch.
        - run: pecot delete-branch example-org/my-repo feat/my-change/123 --dry-run
          note: Show the plan without deleting.
      default_notes: {}
    summary: リモートブランチを削除します。保護するブランチは削除しません。
    arguments:
      branch: '削除するブランチの名前です。'
      dry_run: '何も削除せず、削除する予定だけを出すかどうかです。'
      repo_ref: 'リポジトリの参照です。`owner/repo` の形で渡します。'
    constraints: []
    details:
      - 'GitHub の REST API でリモートブランチを削除します。フックが `git push` と gh CLI を止める環境で使います。'
      - '削除する先のリポジトリは、引数 `repo_ref`（`owner/repo`）です。'
      - 'pecot 全体のオプション `--repo` は、今の git remote と比べるだけで、対象には使いません。'
      - 'リポジトリの既定ブランチと、設定ファイルの `develop_branch`・`release_branch` は保護していて、削除しません。'
      - 'リモートブランチ `wip/<branch>` があれば、それも削除します。'
      - '`wip/<branch>` が無いときは、何も出さずに飛ばします。'
      - '`wip/<branch>` があるのに削除できないときは、`warning` を出し、終了コード 0 で終わります。'
      - '`--dry-run` を付けると、既定ブランチを読んで保護するブランチを確かめた後、ブランチの予定の行を書きます。何も削除しません。'
      - '`--dry-run` は、`wip/<branch>` の削除を予定に入れません。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、削除したブランチごとの結果の行（`deleted`）を出します。`--dry-run` のときは、予定の行（`dry-run`）を出します。`wip/<branch>` を、無い以外の理由で削除できないときは、`warning` の行を出します。ブランチが保護されているときは、保護するブランチを並べた `error` の行を出します。ほかの失敗でも `error` の行を出します。`--repo` が git remote と違うときも含みます。'
    environment: []
    exit_status:
      - code: 0
        when: 'ブランチを削除しました。または、`--dry-run` で予定の行を書きました。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。既定ブランチを読めません。ブランチが保護されています。ブランチを削除できません。`--repo` が今の git remote と違います。git の外で `--repo` を省いたので、リポジトリが決まりません。プロジェクトのルートを決められません。'
      - code: 2
        when: '`repo_ref` が `owner/repo` の形でないか、ほかのコマンドラインの誤りがあります。'
    on_error: '`wip/<branch>` の削除に失敗しても、ブランチそのものは削除されたままです。`wip/<branch>` が無い場合を除いて `warning` を書き、終了コード 0 で終わります。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの既定ブランチを読みます。'
      - target: github
        kind: destructive
        what: 'リモートブランチを削除します。`wip/<branch>` があれば、それも削除します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、ブランチを削除する権限が要ります。'
    idempotent: false
    examples:
      - run: pecot delete-branch example-org/my-repo feat/my-change/123
        note: 'リモートブランチと、その wip ブランチを削除します。'
      - run: pecot delete-branch example-org/my-repo feat/my-change/123 --dry-run
        note: '削除せずに、予定を出します。'
    default_notes: {}
    behaviors:
      - id: PW-DELETE-BRANCH-01
        pattern: event
        statement: 'リポジトリとブランチ名を渡して打つと、そのリポジトリのリモートブランチを削除します'
