        pattern: event
        statement: '`project` で設定の名前を渡すと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-REVIEW-FINISH:
    help:
      details:
        - Finishes an automated review of a PR. Posts a comment on the PR only when the review stopped (failed, limit or setup-missing), and posts nothing when it finished.
        - Pass either --result (from the skill) or --ensure (from the cleanup step of the workflow), not both. --ensure needs --job-status, --review-outcome, --review-conclusion (may be empty) and --review-has-token.
        - With --ensure, the first matching rule decides. A review step that succeeded with an empty conclusion means the workflow file differs from the default branch, and nothing is posted. A succeeded job posts nothing, and a cancelled job is limit.
        - A failed job is failed when the last result of --execution-file is an api_error, limit when it is error_max_turns, setup-missing when the review step failed without a token, and failed otherwise.
        - When the review step failed before Claude Code ran (an empty conclusion), reads the permission of GITHUB_ACTOR, and posts nothing when it is not admin or write.
        - The comment names where the review stopped. With --since, an inline comment starting with **F-NN** made after that time means it stopped after posting inline comments.
        - The comment ends with a hidden marker of GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT. When a comment by a bot already has the same marker, nothing is posted.
        - A closed PR gets no comment. The project config is not read; the host is github.com.
        - With --dry-run, reads the PR and writes the body that would be posted to stdout, and posts nothing. The MCP result has the same body in body.
      examples:
        - run: pecot review finish example-org/my-repo/123 --ensure --job-status failure --review-outcome failure --review-conclusion failure --review-has-token true --execution-file /tmp/execution.json --since 2026-11-17T10:00:00Z
          note: Post a comment from the cleanup step when the review job failed.
        - run: pecot review finish example-org/my-repo/123 --result reviewed
          note: Finish a review that posted its findings. Nothing is posted.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: '自動レビューを終えます。レビューが止まったときだけ、止まったことを知らせるコメントを PR に 1 つ書きます。'
    arguments:
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      result: 'スキルが渡すレビューの結果です。`reviewed`・`failed`・`limit`・`setup-missing` のどれかです。'
      detail: '`setup-missing` のときの、足りない設定の名前です。'
      ensure: 'ワークフローの後始末から呼ぶかどうかです。job の終わり方から結果を決め、同じ実行のコメントがまだ無いときだけ書きます。'
      job_status: '`ensure` のときの job の終わり方です。`success`・`failure`・`cancelled` のどれかです。'
      execution_file: '`ensure` のときの、claude-code-action の出力 `execution_file` のパスです。'
      since: '`ensure` のときの、実行の開始時刻です。ISO 8601 で渡します。この時刻より後のインラインコメントから、止まった場所を決めます。空なら渡さないのと同じです。'
      review_outcome: '`ensure` のときの、自動レビューの step の `outcome` です。`success`・`failure`・`cancelled`・`skipped` のどれかです。'
      review_conclusion: '`ensure` のときの、claude-code-action の出力 `conclusion` です。Claude Code を動かさなかった run では空なので、空の文字列を受け付けます。'
      review_has_token: '`ensure` のときの、claude-code-action の出力 `github_token` があるかどうかです。`true` か `false` で渡し、トークンの値は受け取りません。'
      dry_run: 'PR を読み、書くはずのコメントを決めますが、書きません。書くはずの本文を `body` に入れます。CLI では、本文を標準出力に出します。'
    constraints:
      - conflicts: [result, ensure]
      - requires: {ensure: [job_status, review_outcome, review_conclusion, review_has_token]}
      - requires: {detail: [result]}
      - requires: {execution_file: [ensure]}
      - requires: {since: [ensure]}
      - requires: {job_status: [ensure]}
      - requires: {review_outcome: [ensure]}
      - requires: {review_conclusion: [ensure]}
      - requires: {review_has_token: [ensure]}
    details:
      - '`result` か `ensure` のどちらか 1 つを渡します。`result` はスキルが、`ensure` はワークフローの後始末の step が使います。'
      - '`ensure` の判定は、上から順に見て、最初に当たったもので決めます。'
      - '`ensure` で、自動レビューの step が `success` で `conclusion` が空なら、書きません。PR のブランチで雛形を変えたので、action がレビューを飛ばした run です。合言葉で起こし直してもこの PR では動かないことを、`skipped` の `workflow-mismatch` で知らせます。'
      - '結果が `reviewed` のときと、`ensure` で job が `success` のときは、コメントを書かずに、理由を `skipped` に入れて返します。'
      - '`ensure` で job が `cancelled` のときは、`limit` として書きます。時間の上限と、人が run を取り消したときを見分けません。'
      - '`ensure` で job が `failure` のときは、まず `execution_file` の最後の `result` の行を見ます。'
      - '`execution_file` の最後の `result` の行が `error_max_turns` なら、`limit` として書きます。'
      - '`is_error` が真で `terminal_reason` が `api_error` なら、`failed` として書きます。`result` の文か `errors` に `authentication_error` があれば、トークンを作り直す手順を添えます。'
      - '次に、自動レビューの step が `failure` で `github_token` が無ければ、`setup-missing` にします。Claude の GitHub App を入れる手順を添えます。'
      - 'ほかの `failure` は `failed` として書きます。step が `failure` で `conclusion` が空なら、`GITHUB_ACTOR` の権限を読み、`admin` か `write` でなければ書きません。'
      - '止まった場所は、`since` より後に作られ、先頭が `**F-NN**` のインラインコメントがあるかで決めます。`since` が無ければ「分からない」と書きます。'
      - '本文の末尾に、`GITHUB_RUN_ID` と `GITHUB_RUN_ATTEMPT` を入れた、画面に出ない目印の行を付けます。同じ目印を持つ bot のコメントがあれば、書きません。'
      - '閉じている PR には書きません。プロジェクトの設定は読まず、ホストは `github.com` です。'
      - '本文は、テンプレート `review-stopped` を埋めて作ります。トークンの値と secret の値を書きません。'
    stdin: none
    output:
      format: text
      description: 'コメントを書いたときは、その URL です。`--dry-run` では、書くはずの本文です。書かなかったときは何も出しません。'
    mcp_output:
      fields:
        pullRequest: '対象の PR です。`owner/repo/N` の形です。'
        result: 'コメントに書いた結果です。`failed`・`limit`・`setup-missing` のどれかです。書かなかったときは入りません。'
        location: '止まった場所です。`before-findings`（指摘を投稿する前）・`after-inline`（インラインコメントを投稿した後）・`unknown` のどれかです。書かなかったときは入りません。'
        skipped: '書かなかった理由です。`reviewed`・`job-succeeded`・`workflow-mismatch`・`closed`・`already-written`・`actor-without-write` のどれかです。書いたときは入りません。'
        commentUrl: '書いたコメントの URL です。書かなかったとき、`dry_run` のとき、GitHub が URL を返さなかったときは入りません。'
        body: '書くはずのコメントの本文です。`dry_run` で、書くと決めたときだけ入ります。CLI の `--dry-run` が標準出力に出す本文と同じです。'
        dryRun: '`dry_run` のときだけ `true` が入ります。'
    diagnostics: '標準エラーに、書いたときは `created` の行を、書かなかったときは理由を添えた `skipped` の行を出します。`--dry-run` のときは、代わりに `dry-run: would` の行を出します。権限を読めないときは `warning` の行を出して書きます。本文がテンプレートに合わないときは、`error` の行を出します。'
    environment:
      - name: GITHUB_RUN_ID
        effect: '目印に入れる実行の ID です。無いか空なら、目印を付けず、既にあるコメントも読みません。'
      - name: GITHUB_RUN_ATTEMPT
        effect: '目印に入れる試行の番号です。無いか空なら `1` にします。'
      - name: GITHUB_ACTOR
        effect: '`ensure` で、自動レビューの step が `conclusion` の空の `failure` のときに、権限を読む利用者です。無いときと空のときは、権限を読まずに書きます。名前が `[bot]` で終わるときも同じです。'
      - name: PECOT_REVIEW_TRIGGER_PHRASE
        effect: '次にすることの文に書く合言葉です。無いか空なら `@pecotbot review` を書きます。'
    exit_status:
      - kind: invalid-input
        code: 1
        when: '`result` と `ensure` の両方を渡したか、どちらも渡していません。`ensure` に `job_status` などの要る引数が無いときも含みます。`ensure` の無い補助の引数、`setup-missing` でない `detail`、ISO 8601 でない `since` も同じです。'
      - kind: invalid-input
        code: 2
        when: '`pr_ref` の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: content-invalid
        code: 3
        when: '埋めた本文がテンプレートに合いません。何も書いていません。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'コメントを書く前に止まったときは、PR に何も残りません。同じ実行の目印は、書いたコメントにだけ付くので、呼び直せば書きます。'
    effects:
      - target: github
        kind: write
        what: 'PR に、止まったことを知らせるコメントを 1 つ書きます。'
      - target: github
        kind: read
        what: 'PR の状態、PR のコメント、行のコメント、起動した人の権限を読みます。'
      - target: file
        kind: read
        what: '`execution_file` のファイルと、テンプレート `review-stopped` を読みます。'
    prerequisites:
      - '`github.com` の GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          pr_ref: example-org/my-repo/123
          ensure: true
          job_status: failure
          review_outcome: failure
          review_conclusion: failure
          review_has_token: 'true'
          execution_file: /tmp/execution.json
          since: '2026-11-17T10:00:00Z'
