  PW-SESSION-FINISH:
    summary: マージ済みの PR の後片付けをします。関連する Issue を閉じ、ブランチを削除し、ローカルを片付けます。
    arguments:
      delete_branch: 'ブランチを削除するかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'マージ済みの PR の後片付けをします。関連する Issue を閉じ、ローカルのチェックアウトを開発ブランチに戻します。`delete_branch` を付けると、リモートブランチも削除します。'
      - '関連する Issue は、PR のリポの closing issues と、head ブランチ名の末尾の番号の Issue です。base が既定ブランチでない PR では、本文の Closes・Fixes・Resolves の後に書いた、PR のリポの Issue も含めます。GitHub がキーワードを読むのは既定ブランチ宛ての PR だけなので、そこで読まない所（コードブロック・インラインコード・HTML コメントの中）は数えません。'
      - '閉じた理由を残すため、すでに閉じた Issue は閉じ直さず、`skippedIssues` に `already-closed` で入れます。状態を読めない Issue も閉じず、`warnings` に入れます。'
      - 'Epic と、sub-issue を持つ Issue は閉じず、`skippedIssues` に `epic` で入れます。'
      - 'Issue を閉じた後、その Issue を待っている Issue を読み、判定に合わせてボードの列と Status の札を動かします。着手の跡がある Issue は動かしません。判定に、閉じた Issue が済んだ前提として出ていないときは、約 1.5 秒後に 1 回だけ読み直します。それでも出なければ、後で pecot-board-sync のワークフローを手で起動するよう `warnings` で知らせ、列を動かしません。'
      - '判定が変わった Issue を、`readinessChanges` に入れます。`from` は、閉じた Issue と PR がまだ開いていたとしたときの判定です。変わった Issue が無ければ、空の配列です。'
      - '待っている Issue のうち、種類が `stack` でブランチか PR を持つものは、この PR の子ブランチの Issue です。その作業ディレクトリでブランチをスタックし直すよう `warnings` で知らせ、`restack` に入れます。そのブランチは削除しません。'
      - '選んだプロジェクトのボードに無い Issue と、`Ready`・`Blocked`・`Active`・`In Review` の外の列の Issue は、動かさず、一覧にも出しません。'
      - '`delete_branch` を付けると、リモートの head ブランチを削除します。'
      - 'ローカルのチェックアウトを切り替える先は、worktree の中では、`worktree_add` が記録した `wtN` です。記録が無ければ、worktree の親ディレクトリの名前が `wtN` か `base` のときに、その名前を使います。Claude Code が `.claude/worktrees/<name>` に作った worktree では、`worktree-<name>` を使います。どれでも決まらなければ、ローカルの片付けを飛ばします。worktree の外では、`develop_branch` です。切り替えた後、remote の `origin` から pull します。`origin` が無ければ、最初の remote を使います。その後、ローカルの head ブランチを `git branch -D` で削除します。'
      - '今のディレクトリのリポジトリが PR のリポジトリと違うときは、ローカルの片付けを飛ばします。'
      - 'ローカルの片付けの後、`.pecot/state/` の下のフラグを消します。消すのは、`.pecot-base`・`.pecot-session-title` です。古い版の `.pecot-quick-mode`・`.pecot-active` が残っていても触れません。'
      - 'フラグを消すのは、`.pecot-session-title` の番号が PR の Issue のときと、番号が無いときだけです。ほかの Issue の番号なら、次の Issue の記録なので消さず、`skipped` の行で知らせます。'
      - '2 回目の実行の後の状態は 1 回目と同じですが、結果は違います。リモートブランチは `deletedBranches` に入らず、ローカルのブランチへの `git branch -D` は `warnings` に入ります。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '判定の変わった Issue があるときだけ、`Readiness changed:` の行と、Issue ごとの `- <Issue> <前の判定> -> <後の判定>` の行を出します。無ければ何も出しません。'
    mcp_output:
      fields:
        closedIssues: 'このコマンドが閉じた Issue の番号の配列です。既定ブランチ宛ての PR では、GitHub がマージで先に閉じるので、ふつうは空です。'
        skippedIssues: 'PR が閉じる対象のうち、閉じなかった Issue の配列です。要素は `number` と `reason` を持ちます。`reason` は `epic`（保護している）・`already-closed`・`not-found`・`failed`（`warnings` を見る）のどれかです。`already-closed` には、PR のマージで GitHub が先に閉じた Issue も入ります。'
        deletedBranches: '削除したブランチの配列です。要素は `branch` と `location`（`remote` か `local`）を持ちます。'
        readinessChanges: '判定が変わった Issue の配列です。要素は `issue`（`#N` か `owner/repo#N`）・`from`・`to` を持ちます。`from` と `to` は `blocked`・`startable`・`stackable on #N` のどれかです。無ければ空の配列です。'
        restack: 'この PR の子ブランチの配列です。要素は `issue` と、Issue につながるブランチがあれば `branch` を持ちます。その作業ディレクトリでスタックし直しが要ります。無ければ空の配列です。'
        currentBranch: 'ローカルの後片付けのあとのブランチです。後片付けを飛ばしたときは入りません。'
    diagnostics: '標準エラーに、閉じる Issue の `count` の行を出し、続けて手順ごとに結果の行を 1 つ出します。結果の行は、`closed`・`skipped`・`unchanged`・`deleted`・`moved`・`set`・`updated` です。失敗した手順には、`warning` の行を出します。ローカルの片付けを飛ばしたときも、`warning` の行を出します。子ブランチがあるときと、待っている Issue の判定を確かめられないときも、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: github-not-found
        when: 'PR がありません。'
      - kind: pr-state
        when: 'PR がマージされていません。'
      - kind: invalid-input
        when: '`pr_ref` の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'マージされていない PR はそのまま残し、何も変えません。Issue を閉じられなかったときは `warnings` に入れ、ほかの Issue と後の手順を続けます。巻き戻しはしません。リモートの head ブランチの削除に失敗したときは、`warnings` に入れて後の手順を続けます。checkout に失敗したときは、pull とブランチの削除を飛ばし、フラグは消します。`warnings` に入れて飛ばした手順があっても、成功を返します。'
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue それぞれの種類と状態を読みます。'
      - target: github
        kind: destructive
        what: '関連する Issue を閉じます。'
      - target: github
        kind: destructive
        what: 'リモートの head ブランチを削除します。'
      - target: git
