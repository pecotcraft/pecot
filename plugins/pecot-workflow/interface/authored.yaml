      - 'ホストの GitHub トークンと、PR をマージする権限が要ります。'
    idempotent: false
    examples:
      - run: pecot release merge example-org/my-repo/123
        note: 'リリースの PR を、マージコミットでマージします。'
      - run: pecot release merge example-org/my-repo/123 --dry-run
        note: 'マージせずに、予定を出します。'
      - run: pecot release merge example-org/my-repo/123 --delete-branch
        note: 'リリースの PR をマージし、head ブランチを削除します。'
    default_notes: {}
    behaviors:
      - id: PW-RELEASE-MERGE-01
        pattern: event
        statement: 'PR の参照を渡して打つと、その PR を通常のマージ（マージコミット）でマージします'
      - id: PW-RELEASE-MERGE-02
        pattern: event
