      - 'プロジェクトの Status のフィールドに、Needs Attention の選択肢を足します。'
      - '選択肢を足せないときは、`warning` の行を書いて続けます。'
      - '設定ファイルを書き、プロジェクトをアクティブにします。'
      - '所有者が見つからないときは、何も作らずに止まります。'
