    stdin: none
    output:
      format: text
      description: 'Epic を集めるリポジトリを `owner/repo` の形で書いた 1 行か、`none` です。'
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: '値を出しました。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。アクティブな設定ファイルの内容が不正です。プロジェクトのルートを決められません。'
      - code: 2
        when: '知らないオプションなど、コマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
    idempotent: true
    examples:
      - run: pecot project show-aggregation-repo
        note: 'Epic を集めるリポジトリを出します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SHOW-AGGREGATION-REPO-01
        pattern: event
        statement: '値を設定していると、その値を標準出力に出します'
      - id: PW-PROJECT-SHOW-AGGREGATION-REPO-02
        pattern: event
        statement: '未設定だと、`none` を標準出力に出します'
      - id: PW-PROJECT-SHOW-AGGREGATION-REPO-03
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
  PW-PROJECT-UNSET-AGGREGATION-REPO:
    help:
      details:
        - Clears the Epic aggregation repository in the config file of the active project.
        - Clearing a value that is not set changes nothing.
      examples:
        - run: pecot project unset-aggregation-repo
          note: Clear the aggregation repository.
      default_notes: {}
