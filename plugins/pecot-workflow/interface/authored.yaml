    behaviors:
      - id: PW-BRANCH-DELETE-01
        pattern: event
        statement: 'リポジトリとブランチ名を渡して呼ぶと、そのリポジトリのリモートブランチを削除します'
      - id: PW-BRANCH-DELETE-04
