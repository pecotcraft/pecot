  PW-WORKTREE-LINK:
    help:
      details:
        - Applies the links of worktree-config.json to the worktree in -D, or to every sub-worktree with --all, and replaces a link that already exists.
        - The links are read from the main worktree of the repository.
        - Run pecot worktree init when the config file is missing.
        - Without --all, the target is the root of the worktree that contains -D, so -D may be a subdirectory. The command stops when that root is the main worktree.
        - With --all and no sub-worktree, the command only reports a count of 0.
        - A link whose target does not exist is skipped.
        - A path tracked by git, or a link that cannot be created, is an error that is shown as a warning and does not change the exit status.
        - A real file or directory at a link path is replaced only after a confirmation on stderr that is answered on stdin, or without asking with --force.
        - With --all and without --force, a real file is skipped without asking.
        - When a link path starts with .pecot/, writes .pecot/.gitignore in the worktree by running a script of the plugin before it links.
        - With --dry-run, shows for each link whether it would be created, updated or skipped, and changes nothing.
        - With --dry-run, each link is decided the same way as in the real run, so a link the run skips is planned as a skipped line with the same reason. With --all and without --force, a real file is planned as skipped.
        - A path tracked by git is planned as skipped, and the real run writes a warning line for it and counts it as an error.
        - Needs a devcontainer.
      examples:
        - run: pecot worktree link -D ../wt1/my-repo
          note: Apply the links to one sub-worktree.
        - run: pecot worktree link -D . --all --dry-run
          note: Show the links that would change in every sub-worktree.
        - run: pecot worktree link -D . --all --force
          note: Replace real files at link paths in every sub-worktree without asking.
      default_notes: {}
    summary: 既にある worktree に、シンボリックリンクを張るか張り直します。
    arguments:
      all: 'すべてのサブの worktree を対象にするかどうかです。'
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      dry_run: '何も変えずに、行う予定だけを出すかどうかです。'
      force: '実体のファイルとディレクトリを、尋ねずに上書きするかどうかです。'
    constraints: []
    details:
      - '`worktree-config.json` のリンクを、`-D` の worktree に張ります。`--all` を付けると、すべてのサブの worktree に張ります。既にあるリンクは置き換えます。'
      - 'リンクは、リポジトリのメインの worktree から読みます。'
      - '設定ファイルが無いときは、`pecot worktree init` を実行します。'
      - '`--all` が無いときの対象は、`-D` を含む worktree のルートです。そのため、`-D` はサブディレクトリでも構いません。そのルートがメインの worktree のときは、止まります。'
      - '`--all` を付けてサブの worktree が無いときは、0 の `count` を知らせるだけです。'
      - 'リンク先が無いリンクは飛ばします。'
      - 'git が追跡しているパスと、作れないリンクはエラーですが、`warning` として出し、終了コードは変わりません。'
      - 'リンクのパスにある実体のファイルかディレクトリは、標準エラーの確認へ標準入力で答えた後にだけ置き換えます。`--force` を付けると、尋ねずに置き換えます。'
      - '`--all` を付けて `--force` が無いときは、実体のファイルを尋ねずに飛ばします。'
      - 'リンクのパスが `.pecot/` で始まるときは、リンクを張る前にプラグインのスクリプトを動かし、worktree に `.pecot/.gitignore` を書きます。'
      - '`--dry-run` を付けると、リンクごとに、作る・更新する・飛ばすのどれになるかを出し、何も変えません。'
      - '`--dry-run` は、リンクごとの判断を実際の実行と同じ方法で決めます。実行が飛ばすリンクは、同じ理由を添えた `skipped` の行として予定に出ます。`--all` を付けて `--force` が無いときは、実体のファイルを飛ばす予定にします。'
      - 'git が追跡しているパスは、飛ばす予定にします。実際の実行では、`warning` の行を書き、エラーとして数えます。'
      - 'devcontainer が要ります。'
    stdin: '上書きの確認への `y` か `n` の答えです。確認を尋ねるのは、worktree が 1 つで、`--force` が無いときだけです。そのうえで、リンクのパスに、git が追跡していない実体のファイルかディレクトリがあると尋ねます。入力が終わりに達すると、コマンドを中断します。'
    output:
      format: none
    diagnostics: '標準エラーに、worktree ごとに作ったシンボリックリンクの `count` の行と、飛ばしたリンクごとの `skipped` の行を出します。`--all` で worktree が複数あるときは、合計の `count` の行を出します。作れなかったリンクごとに、`warning` の行を出します。`--dry-run` のときは、`dry-run` の行を出します。失敗したときは、`error` の行を出します。devcontainer の外のときと、設定ファイルの内容が不正なときも含みます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - code: 0
        when: 'リンクを張ったか、予定を出しました。飛ばしたリンクや作れなかったリンクがあるときも含みます。'
      - code: 1
        when: '次のどれかです。`--repo` が今の git remote と違います。git のリポジトリの外で `--repo` を省きました。設定ファイルがありません。設定ファイルの内容が不正です。devcontainer の外で動かしました。メインの worktree かプロジェクトのルートが見つかりません。`--all` なしで、`-D` がメインの worktree です。worktree の一覧を読めません。上書きの確認を中断しました。'
      - code: 2
        when: '`-D` が無いか、既にあるディレクトリでないか、ほかのコマンドラインの誤りがあります。'
    on_error: 'この実行で既に張ったリンクは残ります。作れなかったリンクは元のままで、ほかのリンクの処理は続けます。'
    effects:
      - target: git
        kind: read
        what: 'worktree の一覧を読み、リンクのパスを git が追跡しているかどうかを調べます。'
      - target: file
        kind: read
        what: '`worktree-config.json` を読みます。'
      - target: file
        kind: write
        what: 'シンボリックリンクを作り、既にあるものは置き換えます。worktree に `.pecot/.gitignore` を書きます。'
      - target: file
        kind: destructive
        what: 'リンクのパスにある実体のファイルかディレクトリを消します。消すのは、ユーザーが確認で認めたものか、`--force` で許したものです。'
      - target: process
        kind: write
        what: '`.pecot/.gitignore` を書くスクリプトを動かします。'
    prerequisites:
      - 'コマンドは、devcontainer の中で動かします。'
      - 'リポジトリは、`<プロジェクトのルート>/base/<リポジトリ>` の配置になければなりません。`worktree-config.json` も要ります（`pecot worktree init` で作ります）。'
    idempotent: true
    examples:
      - run: pecot worktree link -D ../wt1/my-repo
        note: '1 つのサブの worktree にリンクを張ります。'
      - run: pecot worktree link -D . --all --dry-run
        note: 'すべてのサブの worktree で、変わる予定のリンクを出します。'
      - run: pecot worktree link -D . --all --force
        note: 'すべてのサブの worktree で、リンクのパスにある実体のファイルを尋ねずに置き換えます。'
