    summary: 'タスクの Issue のテンプレートです。`issue_create` に渡します。'
  pecot-template://issue/bug:
    summary: 'バグの Issue のテンプレートです。`issue_create` に渡します。'
  pecot-template://issue/epic:
    summary: 'Epic の Issue のテンプレートです。`issue_create` に渡します。'
  pecot-template://issue/tracker:
    summary: 'Tracker の Issue のテンプレートです。`issue_create` に渡します。'
  pecot-template://issue/task-implement:
    summary: '実装計画の 1 つのフェーズを受け持つ、タスクの Issue のテンプレートです。`issue_create` に渡します。'
