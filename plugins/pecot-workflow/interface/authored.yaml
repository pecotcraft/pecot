  PW-RELEASE-CREATE:
    help:
      details:
        - Creates a GitHub release and its tag through the GitHub API, so no git tag or git push is needed.
        - "The release notes are the section of the given version in the CHANGELOG, from the line after its ## [X.Y.Z] heading to the next ## heading."
        - The CHANGELOG is the changelog_file of the repository in the config file.
        - Without changelog_file, the CHANGELOG is CHANGELOG.md and then AIST-CHANGELOG.md at the git root, and with --package, the changelog of that package.
        - When the tag does not exist yet, the tag is created at the head of the release_branch of the repository in the config file.
        - The tag is v<version> and the release name is the same.
        - With --package, the tag is <package>-v<version> and the release name is <package> v<version>.
        - The version must be in X.Y.Z form without a leading v.
        - A repository with packages configured needs --package.
        - A repository without packages does not accept --package.
        - The repository is taken from the global pecot --repo, and without it from the origin remote, or from the first remote when there is no origin.
        - The command needs the working directory to be inside a git repository.
        - A mismatch between --repo and the current git remote is a warning, and --repo is used.
        - With --dry-run, the release is not created and no GitHub client is made.
      examples:
        - run: pecot release create 0.6.1
          note: Create the release v0.6.1 from the CHANGELOG.
        - run: pecot release create 0.6.1 --dry-run
          note: Print the plan and the release notes without creating anything.
        - run: pecot release create 0.6.1 --package pecot-workflow
          note: Create the release pecot-workflow-v0.6.1 in a monorepo.
      default_notes:
        package: None; required when the repository has packages configured in the config file.
    summary: GitHub のリリースとタグを作ります。リリースノートは CHANGELOG から取ります。
    arguments:
      dry_run: '何も変えずに、行う予定だけを出すかどうかです。'
      package: 'monorepo のパッケージの名前です。'
      version: 'リリースする版です。`0.6.1` のように渡します。'
    constraints: []
    details:
      - 'GitHub API でリリースとタグを作ります。`git tag` と `git push` のどちらも要りません。'
      - 'リリースノートは、CHANGELOG にある渡した版の節です。`## [X.Y.Z]` の見出しの次の行から、次の `##` の見出しの前までです。'
      - 'CHANGELOG は、設定ファイルにあるリポジトリの `changelog_file` です。'
      - '`changelog_file` が無いときの CHANGELOG は、git のルートの `CHANGELOG.md` で、その次が `AIST-CHANGELOG.md` です。`--package` を付けたときは、そのパッケージの changelog です。'
      - 'タグがまだ無いときは、設定ファイルにあるリポジトリの `release_branch` の先頭にタグを作ります。'
      - 'タグは `v<version>` で、リリースの名前も同じです。'
      - '`--package` を付けると、タグは `<package>-v<version>`、リリースの名前は `<package> v<version>` です。'
      - '版は、先頭に `v` を付けない `X.Y.Z` の形でなければなりません。'
      - 'packages を設定したリポジトリでは、`--package` が必須です。'
      - 'packages の無いリポジトリでは、`--package` を受け付けません。'
      - 'リポジトリは、pecot 全体のオプション `--repo` から決めます。無ければ remote の `origin` から、`origin` も無ければ最初の remote から決めます。'
      - '作業ディレクトリは、git のリポジトリの中でなければなりません。'
      - '`--repo` が今の git remote と食い違うときは、`warning` を出して `--repo` を使います。'
      - '`--dry-run` を付けると、リリースを作らず、GitHub のクライアントも作りません。'
    stdin: none
    output:
      format: text
      description: '作ったリリースの URL です。`--dry-run` のときは、代わりにリリースノートです。'
    diagnostics: '標準エラーに、作ったリリースの結果の行を出します。`--dry-run` のときは、予定の行を出します。`--repo` が git remote と違うときは、`warning` の行を出します。失敗したときは、`error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'リリースを作りました。または、`--dry-run` で予定を出しました。'
      - code: 1
        when: '次のどれかです。版が `X.Y.Z` の形ではありません。git のリポジトリのルートが見つかりません。アクティブなプロジェクトがありません。`--package` の決まりに反しています。CHANGELOG か、その中の版が見つかりません。`release_branch` が未設定です。GitHub API がエラーを返しました。`--repo` を省いたのに git remote を読めません。git の外で `--repo` を省いたので、リポジトリが決まりません。GitHub トークンが見つかりません。プロジェクトのルートを決められません。'
      - code: 2
        when: '版の引数が無いか、ほかのコマンドラインの誤りがあります。'
    on_error: '手順のどれかで失敗したときは、GitHub に何も作りません。'
    effects:
      - target: github
        kind: write
        what: 'リリースとタグを作ります。'
      - target: file
        kind: read
