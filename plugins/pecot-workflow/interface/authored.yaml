      - id: PW-PR-CREATE-69
        pattern: unwanted
        statement: 'もし積んだ記録があり、事前の確認がブランチと remote のずれを見つけたなら、Push Status の直し方を `pr check` と同じに決めます'
      - id: PW-PR-CREATE-70
        pattern: unwanted
        statement: 'もし積んだ base の記録のコミットが head の履歴に無く、`pr restack` と同じ判断で載せ直し済みと決まったなら、止まる文で `pr restack` で記録を書き直すことを案内します。決まらなければ案内しません'
      - id: PW-PR-CREATE-71
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが下の段の変更を持つ間、下の段のブランチを base にします。下の段を載せ直して force-push した後も同じです'
      - id: PW-PR-CREATE-72
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が startable の間、`develop_branch` を base にします'
      - id: PW-PR-CREATE-73
        pattern: unwanted
        statement: 'もし記録が無く、積んだ先を求められないなら、投稿では `error: cannot infer the stacked base` の行を出して終了コード 1 で止まり、PR を作りません'
      - id: PW-PR-CREATE-74
        pattern: unwanted
        statement: 'もし記録が無く、積んだ先を求められないなら、`--dry-run` では warning の行を出し、`develop_branch` を base にします'
  PW-PR-MERGE:
    help:
      details:
        - Merges a PR with the asynchronous merge API of GitHub, for a PR in a stack and for a PR outside a stack alike.
        - A draft PR, a closed PR and a merged PR are not merged, and the command stops with exit status 2 without sending the request.
        - On a GitHub without the asynchronous merge API, a PR outside a stack is merged with the synchronous merge API and squash.
        - A PR in a stack is merged only when no PR below it in the stack is open. Otherwise the command stops with exit status 2 without sending the request, and the error line names the lowest open PR to merge first.
        - A repository without the stack API is handled as a PR outside a stack.
        - The request carries the head commit that was read, so a PR that was pushed after the read is not merged.
        - When the base branch has no merge queue, the merge method is squash. When it has a merge queue, no merge method is sent and the PR is added to the queue.
        - "After the request is accepted, reads the result every 2 seconds until it is merged, enqueued or failed, and stops with exit status 1 after 60 seconds."
        - When the same PR already has a merge request, keeps reading the result of that request.
        - When the result cannot be read, decides from the state of the PR whether it is merged or in the merge queue, and keeps reading until the 60 seconds pass.
        - Does not clean up after the merge. Run pecot session finish next.
        - "With --dry-run, reads the PR and its stack and writes a dry-run: would merge line without sending the request."
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot pr merge example-org/my-repo/123
          note: Merge a PR.
        - run: pecot pr merge example-org/my-repo/123 --dry-run
          note: Show what would be merged without merging.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'PR をマージします。スタックの中の PR は、最下段のものだけをマージします。'
    arguments:
      dry_run: 'マージせずに、行う内容だけを出すかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
    constraints: []
    details:
      - 'GitHub の非同期のマージ API で PR をマージします。スタックの中の PR も、スタックの外の PR も同じです。'
      - 'ドラフトの PR、閉じている PR、マージ済みの PR はマージしません。要求を送らずに、終了コード 2 で終わります。'
      - '非同期のマージ API が無い GitHub では、スタックの外の PR を、同期のマージ API で squash でマージします。'
      - 'スタックの中の PR は、それより下に開いている PR が無いときだけマージします。あるときは、要求を送らずに終了コード 2 で終わり、先にマージするいちばん下の開いている PR を `error` の行に出します。'
      - 'スタックの API が無いリポジトリでは、スタックの外の PR として扱います。'
      - '要求には、読んだ head のコミットを添えます。読んだ後に push された PR は、マージしません。'
      - 'base ブランチに merge queue が無いときは、squash でマージします。あるときは、マージの方法を送らず、PR は merge queue に入ります。'
      - '要求が受け付けられた後は、結果を 2 秒おきに読みます。`merged`・`enqueued`・`failed` のどれかになるまで読み、60 秒で終わらなければ終了コード 1 で終わります。'
      - '同じ PR のマージの要求が既にあるときは、その要求の結果を読み続けます。'
      - '結果を読めないときは、PR の状態から、マージ済みか merge queue の中かを決めます。どちらでもなければ、60 秒が過ぎるまで読み直します。'
      - 'マージの後の片付けはしません。続けて `pecot session finish` を打ちます。'
      - '`--dry-run` を付けると、PR とスタックを読み、要求を送らずに `dry-run: would merge` の行を出します。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        pullRequest: 'マージした PR です。`owner/repo/N` の形です。'
        base: 'PR をマージした先の base ブランチです。'
        status: '結果です。`merged`（マージした）か `enqueued`（merge queue に入った）です。`dry_run` のときは入りません。'
        stack: 'PR が最下段だったスタックです。`number`（スタックの番号）と `size`（この PR から上の PR の数）を持ちます。スタックの外の PR では入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。マージしていません。'
    diagnostics: '標準エラーに、結果の行を出します。マージしたときは `merged`、merge queue に入ったときは `added` です。スタックの最下段の PR では、`merged` の行にスタックの番号と段の数が付きます。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: pr-state
        code: 2
        when: 'PR がドラフトか、閉じているか、マージ済みか、スタックの最下段ではありません。要求は送っていません。'
      - kind: pr-state
        code: 1
        when: 'GitHub がマージを拒みました。または、結果を読めず、PR がマージ済みでも merge queue の中でもありません。'
      - kind: invalid-input
        code: 2
        when: 'PR の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。または、マージが 60 秒で終わりませんでした。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'マージが 60 秒で終わらないときは、要求は GitHub に残っています。PR の状態を確かめてから打ち直します。打ち直すと、残っている要求の結果を読み続けます。'
    effects:
      - target: github
        kind: write
        what: 'PR をマージするか、merge queue に入れます。'
      - target: github
        kind: read
        what: 'PR、PR が入っているスタック、スタックの下の段の PR、マージの結果を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: false
    examples:
      - run: pecot pr merge example-org/my-repo/123
        note: 'PR をマージします。'
      - run: pecot pr merge example-org/my-repo/123 --dry-run
        note: 'マージせずに、行う内容を出します。'
    default_notes:
      pr_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-PR-MERGE-01
        pattern: event
        statement: 'スタックの外の PR を渡すと、読んだ head のコミットと squash でマージを頼み、`merged` の行を標準エラーに出します'
      - id: PW-PR-MERGE-02
        pattern: event
        statement: 'スタックの最下段の PR を渡すと、スタックの番号と段の数を添えた `merged` の行を標準エラーに出します'
      - id: PW-PR-MERGE-03
        pattern: state
        statement: '下の段の PR がマージ済みでスタックの並びに残っている間、その上の PR を最下段として扱います'
      - id: PW-PR-MERGE-04
        pattern: state
        statement: 'base ブランチに merge queue がある間、マージの方法を送らず、merge queue に入ると `added` の行を標準エラーに出します'
      - id: PW-PR-MERGE-05
        pattern: unwanted
        statement: 'もしスタックの下の段に開いている PR があるなら、要求を送らずに、先にマージする PR を示して終了コード 2 で終わります'
      - id: PW-PR-MERGE-06
        pattern: unwanted
        statement: 'もし PR がドラフトなら、要求を送らずに終了コード 2 で終わります'
      - id: PW-PR-MERGE-07
        pattern: unwanted
        statement: 'もし GitHub がマージを拒んだなら、GitHub の文を添えた `error` の行を出して終了コード 1 で終わります'
      - id: PW-PR-MERGE-08
        pattern: unwanted
        statement: 'もしマージが 60 秒で終わらないなら、確かめる PR を示して終了コード 1 で終わります'
      - id: PW-PR-MERGE-09
        pattern: event
        statement: '同じ PR のマージの要求が既にあると、その要求の結果を読み続けます'
      - id: PW-PR-MERGE-10
        pattern: event
        statement: '結果を読めなくなると、PR の状態を読み直し、マージ済みなら `merged`、merge queue の中なら `added` の行を標準エラーに出します'
      - id: PW-PR-MERGE-11
        pattern: unwanted
        statement: 'もし結果を読めないまま 60 秒が過ぎ、PR がマージ済みでも merge queue の中でもないなら、終了コード 1 で終わります'
      - id: PW-PR-MERGE-12
        pattern: state
        statement: 'リポジトリにスタックの API が無い間、スタックの外の PR として扱います'
      - id: PW-PR-MERGE-13
        pattern: unwanted
        statement: 'もし GitHub API がほかのエラーを返したなら、終了コード 1 で終わります'
      - id: PW-PR-MERGE-14
        pattern: event
        statement: '`--dry-run` を付けて打つと、PR とスタックを読み、要求を送らずに `dry-run` の行を標準エラーに出します'
      - id: PW-PR-MERGE-15
        pattern: unwanted
        statement: 'もし PR が閉じているかマージ済みなら、要求を送らずに終了コード 2 で終わります'
      - id: PW-PR-MERGE-16
        pattern: state
        statement: 'GitHub に非同期のマージ API が無い間、スタックの外の PR を、読んだ head のコミットを添えた同期のマージ API で squash でマージします'
      - id: PW-PR-MERGE-17
        pattern: unwanted
        statement: 'もしスタックの中の PR で非同期のマージ API が無いなら、同期のマージ API を呼ばずに終了コード 1 で終わります'
  PW-PR-RESTACK:
    help:
      details:
        - Restacks the current branch onto the new position of the branch it was stacked on, using the base record written when the work started.
        - "With --check, only reports whether a restack is needed and changes nothing except the remote-tracking refs updated by git fetch."
        - "A branch that is not stacked (a record of a start from the develop branch, or no record and no inferred base) is never restacked."
        - "When .pecot/state/.pecot-base of the worktree of the working directory is missing, the stacked base is inferred. When the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the branch counts as stacked on it. Otherwise it counts as started from the develop_branch. A warning line cannot infer the stacked base is printed when the readiness cannot be read or is blocked, when GitHub cannot be reached, or when the remote-tracking ref is missing. The inferred base is not written."
        - "A restack is needed when the head of the layer below on the remote differs from the recorded position, or when the PR of the layer below is merged. After a merge, the branch is restacked onto the develop branch and the base record becomes a start from the develop branch."
        - "A branch that is already on the new base needs no rebase, even when its base record is old. It counts as on the new base when the new base is in its history and, if the recorded position is in its history too, the recorded position is in the history of the new base. pr restack without --check then pushes the branch and rewrites the base record. When the remote branch already has the same tree on the new base, it resets to the remote branch instead of pushing."
        - "After the rebase, stops when the remote branch has commits whose change is in the local branch neither before nor after the rebase, because the push would drop them. The branch goes back to the position before the restack."
        - "Runs git rebase --no-update-refs --onto <new base> <recorded position>. When the recorded position is not in the history of the branch, the rebase starts from the fork point with the remote-tracking ref of the layer below, or from the merge base with the new base when there is no fork point. This holds also after the layer below is merged. When the result has the same tree as the remote branch and the remote branch is already on the new base, resets to the remote branch and does not push. Otherwise pushes with --force-with-lease, expecting the fetched position. A branch that is not on the remote is not pushed."
        - "After the restack, rewrites the base record with the merge base of the branch and the new base."
        - "On conflicts, prints the conflicted files, leaves the rebase in progress, writes a progress record and exits with status 3. --continue goes on after the conflicts are resolved and staged. --abort goes back to the position before the restack. Both read only the progress record and refuse to touch a rebase that pecot did not start."
        - Only one of --check, --continue and --abort can be given.
        - "With --dry-run, fetches and decides like a restack, then prints a dry-run line of what would be done, without rebasing, pushing or writing records."
        - Changes only the branch of the current working directory. Other worktrees are not touched.
      examples:
        - run: pecot pr restack --check
          note: Check whether the current branch needs a restack.
        - run: pecot pr restack
          note: Restack the current branch and push it.
        - run: pecot pr restack --continue
          note: Go on after resolving the conflicts and staging the files.
        - run: pecot pr restack --abort
          note: Go back to the position before the restack.
      default_notes: {}
    summary: 積んだブランチを、base にしたブランチの新しい位置へ載せ直します。
    arguments:
      check: '載せ直しが要るかだけを確かめます。'
      continue: '衝突で止まった載せ直しを、衝突を解いた後に続けます。'
      abort: '衝突で止まった載せ直しを取りやめ、載せ直しの前の位置に戻します。'
      dry_run: '載せ直し・push・記録の書き込みをせずに、する予定だけを出すかどうかです。'
    constraints: []
    details:
      - '今のブランチを、積んで着手したときの base の記録を使って、下の段のブランチの新しい位置へ載せ直します。'
      - '`--check` を付けると、載せ直しが要るかだけを出します。変わるのは、`git fetch` が進める手元の追跡参照だけです。'
      - '積んでいないブランチ（開発ブランチからの着手の記録か、記録が無く積んだ先も求まらないもの）は、載せ直しません。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチに積んだものとします。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`warning: cannot infer the stacked base` の行を出します。求めた結果は書きません。'
      - '載せ直しが要るのは、下の段の remote の先頭が記録の位置と違うときと、下の段の PR がマージ済みのときです。マージ済みなら開発ブランチへ載せ直し、base の記録を開発ブランチからの着手に変えます。'
      - 'ブランチが新しい base の上に載り終えていれば、記録が古くても rebase をしません。載り終えているとは、新しい base がブランチの履歴にあり、記録の位置もブランチの履歴にあるなら、それが新しい base の履歴にもあることです。push と記録の書き直しは、`--check` なしの `pr restack` が行います。remote のブランチが同じ木で新しい base の上にあれば、push せずに remote のブランチに合わせます。'
      - 'rebase の後、remote のブランチにだけあるコミットがあれば止まります。push がそのコミットを消すためです。ブランチは載せ直しの前の位置へ戻します。'
      - '同じ変更かは、載せ直しの前と後のブランチの両方と比べます。GitHub が書き換えたコミットを、別の変更と見ないためです。'
      - '`git rebase --no-update-refs --onto <新しい base> <記録の位置>` を打ちます。'
      - '記録の位置がブランチの履歴に無いときは、別の点から rebase を始めます。下の段の追跡参照からの fork-point を使い、求まらなければ新しい base との merge-base を使います。下の段がマージ済みでも同じです。'
      - '結果の木が remote のブランチと同じで、remote のブランチが新しい base の上にあれば、remote のブランチに合わせ、push しません。'
      - 'そうでなければ、fetch した位置を期待の値にした `--force-with-lease` で push します。remote に無いブランチは push しません。'
      - '載せ直しの後、base の記録の位置を、ブランチと新しい base の merge-base に書き直します。'
      - '衝突したら、衝突したファイルを出し、rebase を途中のまま残します。途中の記録を書き、終了コード 3 で終わります。'
      - '`--continue` は、衝突を解いて `git add` した後に続けます。`--abort` は、載せ直しの前の位置に戻します。どちらも途中の記録だけを読み、pecot が始めていない rebase は動かしません。'
      - '`--check`・`--continue`・`--abort` は、1 つだけ渡せます。'
      - '`--dry-run` を付けると、fetch と判断までを行い、する予定を `dry-run` の行に出します。rebase・push・記録の書き込みは行いません。'
      - '書き換えるのは、今の作業ディレクトリのブランチだけです。ほかの worktree には触れません。'
    stdin: none
    output:
      format: text
      description: '`--check` のときだけ、`up to date: <branch> on <base>` か `needs restack: ...` の 1 行を出します。'
    mcp_output:
      fields:
        branch: '載せ直すブランチです。'
        base: '載せ直した後の base のブランチです。下の段の PR がマージ済みなら、開発ブランチです。'
        outcome: '起きたことです。`up-to-date`・`needs-restack`・`restacked`・`synced`・`conflict`・`aborted` のどれかです。`check` を付けたときは、載せ直すと何が起きるかです。'
        cause: '載せ直しが要る理由です。`base-moved` か `base-merged` です。`check` か `dry_run` を付けて、載せ直しが要るときだけ入ります。'
        pullRequest: '下の段の、マージ済みの PR の番号です。`cause` が `base-merged` のときだけ入ります。'
        pushed: 'ブランチを push したかどうかです。`outcome` が `restacked` のときだけ入ります。'
        conflicts: '衝突したファイルの一覧です。`outcome` が `conflict` のときだけ入ります。'
        dryRun: '`dry_run` のときだけ `true` で入ります。ブランチと記録は変えていません。'
    diagnostics: '標準エラーに、結果の行を 1 つ出します。載せ直すと `updated: <branch> restacked on <base>` です。remote に合わせると `updated: <branch> synced with <remote>/<branch>` です。変えなければ `unchanged: <branch> is up to date`、取りやめると `unchanged: <branch> restack aborted` です。失敗は `error` の行で、続けて直し方の行を出します。記録が無く積んだ先を求められないときは、`warning: cannot infer the stacked base: <理由>` の行を出します。'
    environment: []
    exit_status:
      - kind: git-unresolved
        code: 1
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: git-unresolved
        code: 1
        when: '`git fetch` が失敗したか、remote に届きません。載せ直す先のブランチが手元の追跡参照に無いときも含みます。remote のブランチにだけあるコミットがあるときと、push が拒まれたときも同じです。'
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` が未設定です。'
      - kind: content-invalid
        code: 1
        when: '積んだ base の記録か、途中の記録の形が誤っています。'
      - kind: pr-state
        code: 1
        when: '下の段のブランチが remote から消えていて、その PR がマージされていません。'
      - kind: github-api
        code: 1
        when: '下の段の PR を GitHub から読めません。'
      - kind: github-auth
        code: 1
        when: 'GitHub の認証に失敗しました。'
      - kind: github-not-found
        code: 1
        when: 'リポジトリが GitHub にありません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub の rate limit に当たりました。'
      - kind: preflight-failed
        code: 2
        when: '未コミットの変更があります。`--check`・`--continue`・`--abort` では確かめません。'
      - kind: git-conflict
        code: 3
        when: '載せ直しが衝突しました。`--continue` の後に、また衝突したときも含みます。'
      - kind: invalid-input
        code: 2
        when: '`--check`・`--continue`・`--abort` を 2 つ以上渡したか、途中の載せ直しが無いのに `--continue`・`--abort` を渡しました。pecot の記録が無い rebase の途中のときと、ほかのコマンドラインの誤りも含みます。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '衝突で止まったときは、rebase は途中のまま残り、base の記録は変わりません。push が拒まれたときは、手元のブランチは載せ直した後のままで、base の記録は変わりません。同じコマンドの打ち直しで続きます。remote のブランチにだけあるコミットで止まったときは、ブランチを載せ直しの前の位置へ戻します。'
    effects:
      - target: git
        kind: destructive
        what: '`git fetch` で追跡参照を進め、今のブランチを rebase で書き換え、`--force-with-lease` で remote のブランチを置き換えます。remote に合わせるときは、今のブランチを remote のブランチの位置に動かします。'
      - target: github
        kind: read
        what: '下の段のブランチを head に持つ PR を読みます。'
      - target: file
        kind: write
        what: '`.pecot/state/.pecot-base` を書き直します。衝突で止まる間は `.pecot/state/.pecot-restack` を置き、終わるか取りやめると消します。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - '積んで着手した作業ディレクトリで打ちます（`pecot session start` が base の記録を書きます）。'
    idempotent: true
    examples:
      - run: pecot pr restack --check
        note: '今のブランチに載せ直しが要るかを確かめます。'
      - run: pecot pr restack
        note: '今のブランチを載せ直して push します。'
      - run: pecot pr restack --continue
        note: '衝突を解いて `git add` した後に、続けます。'
      - run: pecot pr restack --abort
        note: '載せ直しの前の位置に戻します。'
    default_notes: {}
    behaviors:
      - id: PW-PR-RESTACK-01
        pattern: event
        statement: '`--check` を付けて、下の段が動いていないときに打つと、`up to date: <branch> on <base>` を標準出力に出します'
      - id: PW-PR-RESTACK-02
        pattern: event
        statement: '`--check` を付けて、下の段の remote の先頭が記録と違うときに打つと、`needs restack: <branch> on <base> (base moved)` を標準出力に出します'
      - id: PW-PR-RESTACK-03
        pattern: event
        statement: '`--check` を付けて、下の段の PR がマージ済みのときに打つと、`needs restack: <branch> onto <develop> (base #N merged)` の行を出します'
      - id: PW-PR-RESTACK-04
        pattern: event
        statement: '載せ直しが要るときに打つと、新しい base へ載せ直して `--force-with-lease` で push します。出す行は `updated: <branch> restacked on <base>` です'
      - id: PW-PR-RESTACK-05
        pattern: event
        statement: '載せ直した結果の木が remote のブランチと同じで、remote のブランチが新しい base に載っている状態で打つと、push せずに remote のブランチへ合わせます。出す行は `updated: <branch> synced with <remote>/<branch>` です'
      - id: PW-PR-RESTACK-06
        pattern: event
        statement: '下の段が動いていないときに打つと、何も変えずに `unchanged: <branch> is up to date` を出します'
      - id: PW-PR-RESTACK-07
        pattern: unwanted
        statement: 'もし載せ直しが衝突したなら、衝突したファイルと `--continue`・`--abort` の案内を出し、途中の記録を書いて、終了コード 3 で終わります'
      - id: PW-PR-RESTACK-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、載せ直さずに終了コード 2 で終わります。`--check` では確かめません'
      - id: PW-PR-RESTACK-09
        pattern: unwanted
        statement: 'もし下の段のブランチが remote から消えていて、その PR がマージされていないなら、終了コード 1 で終わります'
      - id: PW-PR-RESTACK-10
        pattern: state
        statement: '積んでいないブランチの間、載せ直しをしません。開発ブランチからの着手の記録があれば、fetch もしません。`--check` は `up to date: <branch> on <develop>` を、載せ直しは `unchanged: <branch> is up to date` を出します'
      - id: PW-PR-RESTACK-11
        pattern: state
        statement: 'remote に今のブランチが無い間、載せ直すだけで push しません'
      - id: PW-PR-RESTACK-12
        pattern: event
        statement: '`--abort` を付けて打つと、載せ直しの前の位置に戻し、途中の記録を消して、`unchanged: <branch> restack aborted` を出します'
      - id: PW-PR-RESTACK-13
        pattern: event
        statement: '`--continue` を付けて打つと、rebase を続け、終われば push と記録の書き直しまで進みます。衝突が残っていれば、もう一度終了コード 3 で終わります。利用者が rebase を終えていれば、残りの手順だけを進めます'
      - id: PW-PR-RESTACK-14
        pattern: unwanted
        statement: 'もし途中の記録が無いのに `--continue` か `--abort` を付けたなら、途中の rebase を動かさずに終了コード 2 で終わります'
      - id: PW-PR-RESTACK-15
        pattern: unwanted
        statement: 'もし `--check`・`--continue`・`--abort` を 2 つ以上付けたなら、終了コード 2 で終わります'
      - id: PW-PR-RESTACK-16
        pattern: unwanted
        statement: 'もし remote のブランチにだけあるコミットがあるなら、ブランチを載せ直しの前の位置へ戻し、push をせずに終了コード 1 で終わります'
      - id: PW-PR-RESTACK-17
        pattern: unwanted
        statement: 'もし push が拒まれたなら、base の記録を書き直さずに終了コード 1 で終わります'
      - id: PW-PR-RESTACK-18
        pattern: unwanted
        statement: 'もし `git fetch` が失敗したなら、終了コード 1 で終わります'
      - id: PW-PR-RESTACK-19
        pattern: event
        statement: '載せ直しか、remote への合わせが済むと、base の記録を新しい base のブランチと位置に書き直します。開発ブランチへ載せ直したときは、積んだ先の Issue を記録から外します'
      - id: PW-PR-RESTACK-20
        pattern: unwanted
        statement: 'もし積んだ base の記録の形が誤っているなら、終了コード 1 で終わります'
      - id: PW-PR-RESTACK-21
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PR-RESTACK-22
        pattern: event
        statement: '`--dry-run` を付けて打つと、載せ直し・push・記録の書き込みをせずに、する予定を `dry-run` の行で標準エラーに出します'
      - id: PW-PR-RESTACK-23
        pattern: state
        statement: '新しい base の上に載り終えていて記録だけが古い間、rebase をせずに push と記録の書き直しを行います。出す行は `updated: <branch> restacked on <base>` です。remote のブランチが同じ木で新しい base の上にあれば、push せずに合わせ、`updated: <branch> synced with <remote>/<branch>` を出します'
      - id: PW-PR-RESTACK-24
        pattern: state
        statement: 'ブランチが新しい base の上に載り終えている間、`--check` は `up to date: <branch> on <base>` を出し、base の記録を書き換えません'
      - id: PW-PR-RESTACK-25
        pattern: event
        statement: '記録の位置が履歴に無いブランチを載せ直すと、下の段からの fork-point を起点とします。求まらなければ、新しい base との merge-base です。古い下の段と base のコミットは積み直しません'
      - id: PW-PR-RESTACK-26
        pattern: unwanted
        statement: 'もし新しい base を merge で取り込んだか、下の段が記録より古い位置へ戻されたなら、載せ直し済みと見ずに、載せ直しが要ると判断します'
      - id: PW-PR-RESTACK-27
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが下の段の変更を持つ間、下の段に積んだものとして載せ直しの要否を決め、載せ直した後に base の記録を書きます'
      - id: PW-PR-RESTACK-28
        pattern: event
        statement: '積んだ先を求めて始めた載せ直しが衝突で止まると、載せ直す前の記録の位置を途中の記録に書き、`--continue` はそれを使います'
      - id: PW-PR-RESTACK-29
        pattern: unwanted
        statement: 'もし記録が無く、積んだ先を求められないなら、`warning: cannot infer the stacked base` の行を出し、積んでいないものとして扱います'
      - id: PW-PR-RESTACK-30
        pattern: event
        statement: '記録の無い作業ディレクトリで打つと、積んだ先を求める前に remote を fetch し、手元に無い下の段のブランチも追跡参照で見ます'
  PW-PR-SHOW:
    help:
      details:
        - Fetches one PR with a single GraphQL query.
        - Prints the title, state, draft flag, mergeability, comment count, head and base branches, closing issues, referenced issues, review states and body.
        - With --reviews, adds the review bodies and the line comments, and an issue show hint (the command name only, readable from the CLI and MCP) under each related Issue.
        - With --json, prints the PR as JSON, and with --reviews the JSON also holds the reviews and the line comments.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot pr show example-org/my-repo/123
          note: Show the PR as Markdown.
        - run: pecot pr show example-org/my-repo/123 --reviews
          note: Show the PR with its reviews and line comments.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: PR の詳細を、必要な項目だけ GraphQL で取得して出します。
    arguments:
      json: 'JSON で出力するかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      reviews: 'レビューの詳細（本文と行のコメント）を含めるかどうかです。'
    constraints: []
    details:
      - 'GraphQL のクエリ 1 回で、PR を 1 件取得します。'
      - '題・状態・ドラフトの印・マージの可否・コメントの数・head と base のブランチを出します。closing issues・参照している Issue・レビューの状態・本文も出します。'
      - '`--reviews` を付けると、レビューの本文と行のコメントを足します。関連する Issue ごとに、`issue show` の案内も足します。案内は、CLI でも MCP でも読めるように、コマンドの名前だけで書きます。'
      - '`--json` を付けると、PR を JSON で出します。`--reviews` も付けると、JSON にレビューと行のコメントも入ります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: text
      description: '`## PR #<N> <title>` の見出しで始まる Markdown です。`--reviews` を付けると、レビューか行のコメントがあるときに、`## Reviews` の節と `## Line Comments` の節が続きます。`--json` を付けると、JSON のオブジェクトです。'
    mcp_output:
      fields:
        number: 'PR の番号です。キーは `--json` と同じ snake_case で、中身も `--json` の出力と同じです。'
        state: 'PR の状態です。`OPEN`・`CLOSED`・`MERGED` のどれかです。'
        title: 'PR のタイトルです。'
        body: 'PR の本文です。'
        head_ref: 'head ブランチです。'
        base_ref: 'base ブランチです。'
        is_draft: 'PR が draft かどうかです。'
        mergeable: 'マージできるかどうかです。`MERGEABLE`・`CONFLICTING`・`UNKNOWN` のどれかです。'
        comments: 'コメントの数です。'
        closing_issues: 'PR が閉じる Issue の配列です。要素は `number` と `title` を持ちます。'
        referenced_issues: '本文の Refs が指す Issue のうち、`closing_issues` に無いものの配列です。要素は `number` と `title` を持ち、`title` はいつも空です。'
        reviews: 'レビューの配列です。要素は `state` と `author` を持ちます。`author` は、削除されたユーザーなら `null` です。`body` と `submitted_at` は、`reviews` を付けたときだけ入ります。'
        review_threads: '行コメントのスレッドの配列です。`reviews` を付けたときだけ入ります。要素は `is_resolved`・`path`・`line`・`comments` を持ちます。`comments` の要素は `author`・`body`・`created_at` を持ちます。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: invalid-input
        code: 2
        when: 'PR の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue を読みます。`--reviews` のときは、レビューと行のコメントも読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot pr show example-org/my-repo/123
        note: 'PR を Markdown で出します。'
      - run: pecot pr show example-org/my-repo/123 --reviews
        note: 'PR を、レビューと行のコメントも付けて出します。'
    default_notes:
      pr_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-PR-SHOW-01
        pattern: event
        statement: 'PR の参照を渡すと、見出し・状態・ブランチ・本文を Markdown で標準出力に出します'
      - id: PW-PR-SHOW-02
        pattern: event
        statement: '関連 Issue がある PR を読むと、closing issues と参照 Issue を出します'
      - id: PW-PR-SHOW-03
        pattern: event
        statement: 'レビューがある PR を読むと、レビューごとの author と状態を出します'
      - id: PW-PR-SHOW-04
        pattern: event
        statement: '`--reviews` を付けて打つと、レビューの本文と行のコメントを足して出します'
      - id: PW-PR-SHOW-05
        pattern: event
        statement: '`--reviews` を付けてレビューがあると、`## Reviews` の節を出します'
      - id: PW-PR-SHOW-06
        pattern: event
        statement: '`--reviews` を付けて行のコメントがあると、`## Line Comments` の節を出します'
      - id: PW-PR-SHOW-07
        pattern: event
        statement: '`--reviews` を付けて打つと、関連 Issue ごとに `issue show` の案内を足します'
      - id: PW-PR-SHOW-08
        pattern: event
        statement: '`--json` を付けて打つと、同じ内容を JSON で標準出力に出します'
      - id: PW-PR-SHOW-09
        pattern: event
        statement: '`--json` と `--reviews` を一緒に付けて打つと、JSON にレビューと行のコメントを含めます'
      - id: PW-PR-SHOW-10
        pattern: event
        statement: '短い形 `N` の参照を渡すと、`--repo` か git の remote で補って読みます'
      - id: PW-PR-SHOW-11
        pattern: unwanted
        statement: 'もし PR の参照の形が誤っているなら、終了コード 2 で終わります'
      - id: PW-PR-SHOW-12
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PR-SHOW-13
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
  PW-PROJECT-ACTIVATE:
    help:
      details:
        - Without a project argument, lists the initialized projects of the owner; --host is required.
        - A project is initialized when it has a pecot-workflow field.
        - The listing marks the active project with [ACTIVE].
        - When the owner has no initialized project, the listing is a none line.
        - With a project number or name, regenerates the config file of that project from GitHub and makes it the active project.
        - With a config file path or file name, syncs the project from the host, owner and number recorded in that file and makes it the active project.
        - A config file path or file name needs neither --host nor --owner.
        - The develop branch, release branch, changelog_file, packages and release type of each repository, and aggregation_repo, already in the config file are kept.
        - A repository that is no longer linked to the project is removed from the config file.
        - A newly linked repository is appended to the end of the repository list.
        - The Blocked option of the pecot-workflow field and the Todo and Needs Attention options of the Status field are written to the config file only when the board has them.
        - A board without the Blocked option is accepted; the other six options of the pecot-workflow field are required.
        - With --dry-run, reads the project and prints dry-run lines for the config file and the switch of the active project, and writes nothing.
      examples:
        - run: pecot project activate --host github.com --owner example-org
          note: List the initialized projects of the owner.
        - run: pecot project activate 1 --host github.com --owner example-org
          note: Activate the project by number.
        - run: pecot project activate 1 --host github.com --owner example-org --dry-run
          note: Show the planned config and switch without writing them.
      default_notes:
        owner: The authenticated user; with a config file, the owner recorded in the file and --owner is not used.
        host: Required unless a config file is given; with a config file, the host recorded in the file.
    summary: 初期化済みのプロジェクトをアクティブにします。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      project: 'プロジェクトの番号か名前です。設定ファイルのパスかファイル名でも渡せます。'
      dry_run: '何も書かずに、する予定だけを出すかどうかです。'
    constraints: []
    details:
      - 'プロジェクトの引数が無いと、所有者の初期化済みのプロジェクトを一覧します。このときは `--host` が必須です。'
      - '初期化済みのプロジェクトとは、pecot-workflow のフィールドを持つプロジェクトです。'
      - '一覧では、アクティブなプロジェクトに `[ACTIVE]` の印を付けます。'
      - '所有者に初期化済みのプロジェクトが無いときは、一覧は `none` の行になります。'
      - 'プロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイルを GitHub から作り直し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すと、ファイルに記録したホスト・所有者・番号でプロジェクトを同期し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すときは、`--host` と `--owner` のどちらも要りません。'
      - '設定ファイルに既にある次の値は残します。リポジトリごとの開発ブランチ・リリースブランチ・`changelog_file`・packages・リリースの種類と、`aggregation_repo` です。'
      - 'プロジェクトとのつながりが外れたリポジトリは、設定ファイルから消します。'
      - '新しくつないだリポジトリは、リポジトリの一覧の末尾に足します。'
      - '次の選択肢は、ボードにあるときだけ設定ファイルに書きます。pecot-workflow のフィールドの Blocked と、Status のフィールドの Todo・Needs Attention です。'
      - 'Blocked の選択肢の無いボードも受け付けます。pecot-workflow のフィールドのほかの 6 つの選択肢は必須です。'
      - '`--dry-run` を付けると、プロジェクトを読み、設定ファイルとアクティブなプロジェクトの切り替えを `dry-run` の行に出して、何も書きません。'
    stdin: none
    output:
      format: text
      description: 'プロジェクトを渡さないときだけ出します。見出しの行に続けて、初期化済みのプロジェクトを 1 行ずつ出し、アクティブなものに `[ACTIVE]` を付けます。初期化済みのプロジェクトが無ければ、`none` の行を出します。プロジェクトを渡したときは、標準出力に何も書きません。'
    mcp_output:
      fields:
        project: 'アクティブにした設定の名前です。`dry_run` のときは、アクティブにする予定の名前です。プロジェクトを指定せず、候補を返したときは入りません。'
        configPath: 'プロジェクトの設定ファイルのパスです。プロジェクトを指定せず、候補を返したときは入りません。'
        change: '設定ファイルがどうなったかです。`create`・`update`・`unchanged` のどれかです。候補を返したときは入りません。'
        candidates: '初期化済みのプロジェクトの配列です。プロジェクトを指定しなかったときだけ入り、何もアクティブにしません。要素は `active`（今のアクティブなプロジェクトか）を必ず持ち、`number` と `title` も持ちます。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: 'プロジェクトを渡したときは、標準エラーに、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。`--host` が渡した設定ファイルのホストと違うときは、`warning` の行を出します。このときは、設定ファイルのホストを使います。'
    environment: []
    exit_status:
      - kind: invalid-input
        code: 1
        when: '必須の `--host` がありません。'
      - kind: project-not-found
        code: 1
        when: 'プロジェクトが見つかりません。'
      - kind: not-initialized
        code: 1
        when: 'プロジェクトが初期化されていません。'
      - kind: config-invalid
        code: 1
        when: '設定ファイルを読み込めません。'
      - kind: invalid-input
        code: 2
        when: '知らないオプションなど、コマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクトと、そのフィールドと、つながっているリポジトリを読みます。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下の設定ファイルを作るか更新し、アクティブなプロジェクトを設定します。`--dry-run` のときは書きません。'
      - target: file
        kind: read
        what: '設定ファイルと、アクティブなプロジェクトの設定を読みます。'
    prerequisites:
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot project activate --host github.com --owner example-org
        note: '所有者の初期化済みのプロジェクトを一覧します。'
      - run: pecot project activate 1 --host github.com --owner example-org
        note: '番号でプロジェクトをアクティブにします。'
      - run: pecot project activate 1 --host github.com --owner example-org --dry-run
        note: '設定ファイルとアクティブな設定は書かず、する予定を出します。'
    default_notes:
      owner: '省くと、認証したユーザーです。設定ファイルを渡したときは、ファイルに記録した所有者を使い、`--owner` は使いません。'
      host: '設定ファイルを渡したときだけ省けます。省くと、ファイルに記録したホストを使います。'
    behaviors:
      - id: PW-PROJECT-ACTIVATE-01
        pattern: event
        statement: '`--host` を付けてプロジェクトを渡さずに打つと、初期化済みのプロジェクトを標準出力に一覧します'
      - id: PW-PROJECT-ACTIVATE-02
