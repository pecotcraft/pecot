      - id: PW-ISSUE-DEPENDENCY-CHECK-02
        pattern: state
        statement: '前提の PR を読んでいないか、PR の base を辿れない間、`expected_status` を返さず、読む PR を `warning` の行で案内します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-03
        pattern: event
        statement: '前提の PR を `reads` で受けると、スタックできるなら `Ready`、できないなら `Blocked` を `expected_status` に返します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-04
        pattern: unwanted
        statement: 'もし前提がすでにあるか、自分自身か輪になるか、前提の数が上限を超えるなら、項目を返します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-05
        pattern: unwanted
        statement: 'もし決まりを確かめるのに要る読み取りが `reads` に無いか、続きのページがあるなら、読むツールを項目で案内します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-06
        pattern: event
        statement: '`method` が `remove` の値を受けると、`problems` と、書いた後に動かす列と、直した本文を返します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-07
        pattern: unwanted
        statement: 'もし `remove` で前提に無い Issue を指すか、`wait`・`reason` を渡すなら、項目を返します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-08
        pattern: unwanted
        statement: 'もし `type` が `blocking` か、`reason` が待ち方に合わないなら、項目を返します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-09
        pattern: unwanted
        statement: 'もし待つ側のリポがプロジェクトに無いなら、`not-in-project` の項目を返します'
      - id: PW-ISSUE-DEPENDENCY-CHECK-10
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
  PW-PR-CHECK:
    summary: PR を作る前に確かめる情報を、まとめて出します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。相対パスは、セッションのディレクトリから見たものです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - '`directory` のリポジトリについて、PR を作る前に確かめる情報を返します。'
      - '結果には、remote・今のブランチ・Push Status・base ブランチ・`git status`・コミット・差分の統計・worktree・stash の一覧を入れます。'
      - 'base ブランチは、`<remote>/` の後に、選んだプロジェクトの `develop_branch` を続けたものです。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - 'スタックして着手した記録があるときは、base ブランチは、`<remote>/` の後に親ブランチを続けたものです。remote がそのブランチは無いと答えれば（マージで消えた後）、手元に追跡参照が残っていても `develop_branch` の方にします。remote に届かなければ、手元の追跡参照の有無で決めます。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、スタック先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチにスタックしたものとします。変更を持つとは、同じコミットか、そのブランチをスタックし直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`cannot infer the stacked base` の文を `warnings` に入れます。求めた結果は書きません。'
      - '親ブランチについての remote への問い合わせには、10 秒の時間切れがあり、認証の入力は求めません（`GIT_TERMINAL_PROMPT=0` と askpass の無効化）。時間切れは、remote に届かないときと同じに扱います。'
      - '親ブランチが remote にあり、手元に追跡参照が無いときは、`develop_branch` と比べ、`git fetch` を案内する文を `warnings` に入れます。この文は、確かめた結果の数に入りません。'
      - 'スタックした base の記録の形が誤っているときは、base を決められないので、`kind` が `content-invalid` の失敗を返します。'
      - '確かめた結果に引っかかりがあっても、すべての項目を返します。'
      - '引っかかりとして数えるのは、push していないか remote とずれたブランチ、変更したファイルか追跡していないファイル、stash の項目です。'
      - 'スタックして着手した記録があり、ブランチが remote とずれているときは、親 PR と remote の先頭を読み、`pr_restack` と同じにスタックし直しの要否を決めます。GitHub を読むのは、このときと、記録が無くスタック先を求めるときだけです。'
      - 'Push Status の直し方は、スタックし直しが要れば `pr_restack`、決められなければ `check` を付けた `pr_restack` です。親ブランチが remote から消え、PR がマージされていないときも、決められないに入ります。'
      - 'ブランチが新しい base の上に載り終えていて記録だけが古いときも、Push Status の直し方は `pr_restack` です。push と記録の書き直しを `pr_restack` が行うためです。'
      - 'ほかに、ブランチが remote とずれてスタックし直しが要らないときは、Push Status の直し方は `git pull --rebase` です。push 済みのコミットを書き換えたなら `git push --force-with-lease` です。スタックしていないブランチも同じです。git は fast-forward でない push を拒むためです。'
      - '引っかかりが 1 件以上あると、それぞれを `warnings` に入れ、`kind` が `preflight-failed` の失敗を返します。失敗の結果にも、集めた項目が入ります。'
      - 'リポジトリと設定を読むだけで、何も変えません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '11 の節です。それぞれ `=== <title> ===` の行に内容が続き、節の間は空行で区切ります。'
    mcp_output:
      fields:
        remoteUrl: '主な git remote の URL です。'
        currentBranch: '今のブランチです。'
        pushed: '今のブランチを push 済みで、リモートのブランチと同じかどうかです。'
        pushStatus: 'Push Status の状態を書いた文です。'
        baseBranch: '比べる相手のリモートブランチです。`remote/branch` の形です。スタックしているときは親ブランチ、そうでなければ develop ブランチです。'
        gitStatus: '`git status` の出力です。'
        commits: 'ベースブランチからのコミットを、1 行に 1 件ずつ並べた文です。'
        diffSummary: 'ベースブランチとの差分の統計を書いた文です。'
        worktree: 'worktree の情報です。`list`（`git worktree list` の出力）と `directoryName`（今のディレクトリの名前）を持ちます。リンクされた worktree かどうかを示す `isWorktree` は、判定できたときだけ入ります。'
        stashList: 'stash の一覧を書いた文です。'
    diagnostics: '標準エラーに、`warning` の数の `count` の行を出し、続けて `warning` ごとに行を 1 つ出します。行の形は `<label>: <message> (fix: <hint>)` です。親ブランチに手元の追跡参照が無いときは、`git fetch` を案内する `warning` の行を足します。この行は数に入りません。記録が無くスタック先を求められないときは、`warning: cannot infer the stacked base: <理由>` の行を出します。'
    environment: []
    exit_status:
      - kind: git-unresolved
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        when: '`develop_branch` が未設定です。'
      - kind: git-unresolved
        when: '`<remote>/<develop_branch>` がありません。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - kind: content-invalid
        when: 'スタックした base の記録の形が誤っています。'
      - kind: preflight-failed
        when: '`warning` が 1 件以上あります。'
      - kind: invalid-input
        when: '`directory` が無いか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: 'remote・ブランチ・push の状態・status・base との log と差分・worktree の一覧・stash の一覧を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイル、`.gitignore`、`.git/info/exclude` を読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ローカルのリポジトリに `<remote>/<develop_branch>` が要ります。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
    idempotent: true
    examples:
      - arguments:
          directory: .
        note: 'PR を作る前に、セッションのディレクトリのリポジトリを確かめます。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
