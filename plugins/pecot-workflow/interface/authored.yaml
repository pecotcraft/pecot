  PW-PROJECT-INFO:
    help:
      details:
        - Shows the active project, its registered repositories and the board status.
        - The board status covers the open items in Backlog, Pending, Blocked, Ready, Active and In Review.
        - Each registered repository line carries the release type and the Dependabot alert status.
        - A repository whose alerts cannot be read shows the reason and does not stop the command.
        - Narrows the board items to one repository when --repo or the global pecot --repo is given.
        - Deletes Archived items from the board except the 20 most recently updated.
        - An Archived item that cannot be deleted is skipped and the command continues.
        - Reads the blocked-by of the open Issues in Ready and Blocked, and judges each as startable, stackable or blocked. Issues in Active and In Review are not read.
        - Only shows the judgment. It never changes the column or the Status of an Issue, even when they do not match the judgment.
        - An Issue whose prerequisites cannot be read is shown as unknown.
        - On a GitHub Enterprise Server without Issue dependencies, prints the board without the Readiness column.
        - When pecot board sync would move the column or the Status of a Ready or Blocked Issue, writes one warning line with the count and points to pecot board sync. The count uses the same rule as pecot board sync. A Blocked Issue without prerequisites is counted even though its branches and PRs are not read, so the line says the column or Status may not match.
      examples:
        - run: pecot project info
          note: Show the dashboard as Markdown.
        - run: pecot project info --json --repo example-org/my-repo
          note: Show the dashboard as JSON, narrowed to one repository.
      default_notes:
        repo: The value of the global pecot --repo option; without it, no narrowing.
    summary: プロジェクトの情報のダッシュボードを出します。
    arguments:
      json: 'JSON で出力するかどうかです。'
      repo: '対象のリポジトリです。`owner/repo` の形で明示して渡します。'
