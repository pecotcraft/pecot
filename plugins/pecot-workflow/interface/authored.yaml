    on_error: '最初のエラーで止まります。`git worktree add` の後で `worktree-config.json` の内容が不正だと分かったときは、worktree とブランチは残ります。リンク・コピーしたファイル・setup の実行はありません。`wtN` の記録を書けなくても、worktree はそのままです。prune した管理情報と、消した未使用のブランチは、元に戻しません。飛ばしたリンク・コピーできなかったファイル・失敗した setup のコマンド・書けなかった `wtN` の記録があっても、終了コード 0 で終わります。'
