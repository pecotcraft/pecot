  PW-SESSION-SHOW:
    help:
      details:
        - Shows the current branch, the repository of the origin remote (or of the first remote when there is no origin) and the work Issue of the session.
        - The branch and the repository of the origin remote, or of the first remote when there is no origin, are read in --directory.
        - "The work Issue is owner/repo#N: owner/repo is the repository of that remote, and N is the number at the end of the branch name after the last slash. There is no work Issue when the remote cannot be read or its URL has another form, when the last part of the branch name is not only digits, when the number is 0, and on a detached HEAD."
        - A leftover .pecot/state/.pecot-active is not read.
        - The Active Issue line shows owner/repo#N, or none when there is no work Issue.
        - When there is a work Issue, an Active Issue section follows with the number, the title and the state of the Issue read from GitHub.
        - The body of the Issue follows in the section when it is not empty. The MCP result has the body in activeIssue.body.
        - When the Issue cannot be read from GitHub, a warning line is written and the section is left out.
        - When the Active Issue section is shown and .pecot/state/.pecot-base of the worktree of --directory names an Issue the work stacks on, a Stack section follows with a base line of the branch, the Issue and its PR (the open PR that is not from a fork, else the latest one, else no PR, or PR unknown when it cannot be read).
        - "The Stack section has a needs restack line (yes or no) after the base line: yes when the head of the base branch on the remote differs from the recorded position or when its PR is merged, unless the branch is already on the new base (decided in the same way as pr restack). The line is decided without git fetch, by asking the remote, and is left out when the remote cannot be reached or the base branch is gone without a merged PR."
        - When the readiness of the active Issue is blocked, the Stack section also has a readiness line.
        - "When open PRs of the same repository have the current branch as their base, the Stack section lists each as a stacked above line, even in a working directory that is not stacked."
        - "The record in .pecot/state/.pecot-base of the top level of the git repository of --directory is read; the record of the project root is not used for another worktree or clone. When the record is missing, the stacked base is inferred: when the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the Stack section shows that base. The readiness read for this is reused for the readiness line."
        - The Stack section uses the config and the client of the Active Issue section and is left out when that section is.
        - The command is a diagnostic, so a value that cannot be read is shown as unknown or none, or left out, and does not fail the command.
        - Nothing is written.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot session show -D .
          note: Show the branch, the repository and the work Issue of the current repository.
      default_notes:
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: セッションのブランチ、リポジトリ、作業中の Issue を出します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - '今のブランチ、remote の `origin`（無ければ最初の remote）のリポジトリ、セッションの作業中の Issue を返します。'
      - 'ブランチと、remote の `origin`（無ければ最初の remote）のリポジトリは、`directory` で読みます。'
      - '作業中の Issue は `owner/repo#N` です。`owner/repo` はその remote のリポジトリで、`N` はブランチ名の最後のスラッシュより後ろにある末尾の番号です。remote を読めないか URL の形が合わないとき、ブランチ名の最後の区切りが数字だけでないとき、番号が 0 のとき、detached HEAD のときは、作業中の Issue はありません。'
      - '古い版の `.pecot/state/.pecot-active` が残っていても読みません。'
      - '作業中の Issue は、`activeIssue` の `reference` に入れます。作業中の Issue が無ければ、`activeIssue` を入れません。'
      - '作業中の Issue があるときは、GitHub から読んだ Issue の題・状態を `activeIssue` に入れます。'
      - 'Issue の本文は、`activeIssue` の `body` に入れます。本文が無ければ空の文字列です。CLI では、本文が空でなければ、Markdown の Active Issue の節に本文を続けます。'
      - 'Issue を GitHub から読めないときは、`warnings` に入れ、`activeIssue` に題・状態・本文を入れません。'
      - '作業中の Issue を読めて、プロジェクトのルートの `.pecot/state/.pecot-base` が積んだ先の Issue を指すときは、`stack` を入れます。`stack` には、ブランチ・Issue・その PR を入れます。PR は、fork からではない open の PR です。それが無ければ最新の PR です。PR が無いか読めないときは、`pullRequest` を入れません。'
      - '`stack` の `needsRestack` は、載せ直しが要るかです。下の段の remote の先頭が記録の位置と違うときと、下の段の PR がマージ済みのときが `true` です。ただし、ブランチが新しい base の上に載り終えていれば `false` です（`pr_restack` と同じ判断です）。'
      - '`needsRestack` は、`git fetch` をせずに remote へ尋ねて決めます。remote に届かないときは、入れません。下の段のブランチが消えていて PR がマージされていないときも、入れません。'
      - 'アクティブな Issue の着手の判定が `blocked` のときは、`stack` に `readiness` も入れます。'
      - '今のブランチを base にした、同じリポジトリの open の PR があれば、PR ごとの項目を `stackedAbove` に入れます。積んで着手していない作業ディレクトリでも入れます。'
      - '`.pecot/state/.pecot-base` の記録は、`directory` の git リポジトリの toplevel のものを読みます。プロジェクトのルートの記録を、別の worktree や clone の作業には使いません。'
      - '記録が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、その base を `stack` に入れます。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。求めるときに読んだ判定は、`readiness` にも使います。'
      - '`stack` は、作業中の Issue の題と状態と同じ設定とクライアントで読みます。`activeIssue` に題と状態が入らないときは、`stack` も入れません。'
      - 'このツールは診断用です。読めない値は省き、失敗を返しません。'
      - '何も書き込みません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: 'Session status の見出しがある Markdown です。Branch・Repository・Active Issue の行を出します。作業中の Issue を読めたときは Active Issue の節を、作業を積んでいるときは Stack の節を出します。'
    mcp_output:
      fields:
        branch: '今のブランチです。読めないときは入りません。'
        repository: 'git remote のリポジトリです。`owner/repo` の形です。読めないときは入りません。'
        activeIssue: 'セッションの作業中の Issue です。無いときは入りません。`reference`（`owner/repo/N`。`issue_ref` にそのまま渡せる形）を持ちます。`title`・`state`（`OPEN` か `CLOSED`）・`body`（Issue の本文。本文が無ければ空文字）は、GitHub から読めたときだけ入ります。'
        stack: '作業を積んでいる先です。積んでいないときは入りません。`branch`（積んでいる先の base ブランチ）と `stackedOn`（積んでいる Issue。`owner/repo/N`）を持ちます。`pullRequest`（`number` と `state`）は、base ブランチの PR があり、読めたときだけ入ります。`needsRestack` は、載せ直しが要るかで、決められたときだけ入ります。`readiness` は、作業中の Issue が blocked のときだけ入ります。'
