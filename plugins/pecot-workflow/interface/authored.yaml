      - id: PW-RELEASE-MERGE-21
        pattern: unwanted
        statement: 'もし `release_branch` を設定していないなら、`kind` が `repo-setting-missing` の失敗を返します'
      - id: PW-RELEASE-MERGE-22
        pattern: unwanted
        statement: 'もし PR の base ブランチが `release_branch` でないなら、`kind` が `pr-state` の失敗を返します'
      - id: PW-RELEASE-MERGE-23
        pattern: unwanted
        statement: 'もしマージで GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-RELEASE-MERGE-24
        pattern: unwanted
        statement: 'もし `repo` を省いて git の外で呼んだなら、`the repository is ambiguous` で始まる `detail` を入れます'
      - id: PW-RELEASE-MERGE-25
        pattern: unwanted
