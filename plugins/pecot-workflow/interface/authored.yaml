      - kind: other
        code: 1
        when: 'テンプレートが見つかりません。'
      - kind: preflight-failed
        code: 2
        when: '事前の確認が `warning` を見つけました。push していない、コミットしていない変更がある、stash がある、のどれかです。'
      - kind: pr-state
        code: 2
        when: '下の段の PR が開いておらず、マージもされていないので、積んだ base の PR を作れません。'
      - kind: invalid-input
        code: 2
        when: 'コマンドラインの誤りがあります。'
      - kind: content-invalid
        code: 3
        when: '本文が規則に反しています。次のどれかです。Issue の参照 `#N` がありません。必須の節がありません。見出しの要約の規則に反します。使えない記法があります。Summary に画像もスクリーンショットの理由もありません。base ブランチが誤っています。nx のリポジトリでは、題の scope が誤っているときも含みます。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '検証に失敗したときと、事前の確認が `warning` を見つけたときは、PR を作りません。PR を作った後でボードの status を設定できないときは、PR は残り、`warning` を書きます。`--prepare` が書いたテンプレートのコピーは、`.pecot/tmp/output/` に残ります。ボードの status だけを設定できなかったときの終了コードは 0 です。'
    effects:
      - target: github
        kind: write
        what: 'PR を作り、関連する Issue のボードの status を In Review にします。積んだ base の PR は、スタックに登録します。この PR を待っていた Issue の列を動かします。'
      - target: github
        kind: read
        what: '関連する Issue の種類と、そのボードの項目を読みます。積んだ base では、下の段の PR とスタックも読みます。待っている Issue とボードも読みます。'
      - target: git
        kind: read
        what: 'ブランチ・remote・status・stash・push の状態を読みます。nx のリポジトリでは、base との差分も読みます。'
      - target: process
        kind: read
        what: 'リリースの種類が nx のリポジトリでは、`nx graph` を動かしてプロジェクトの一覧を取ります。'
      - target: file
        kind: write
        what: 'テンプレートのコピーを `.pecot/tmp/output/` の下に書きます。'
      - target: file
        kind: read
        what: 'PR のファイル、テンプレート、アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
      - 'head ブランチを push 済みにし、作業ツリーの変更を無くしておきます。'
    idempotent: false
    examples:
      - run: pecot pr create --prepare
        note: 'PR のテンプレートを書き、そのパスを出します。'
      - run: pecot pr create .pecot/tmp/output/pr-create-20260101-120000.md --dry-run
