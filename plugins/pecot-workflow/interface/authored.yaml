  PW-PROJECT-CREATE:
    help:
      details:
        - Creates a GitHub Projects V2 project for the owner.
        - Adds the pecot-workflow, pecot-priority and pecot-size fields to the project.
        - The pecot-workflow field is created with seven options, including Blocked.
        - Adds the Needs Attention option to the Status field of the project.
        - When an option cannot be added, a warning line is written and the command continues.
        - Writes the config file and makes the project active.
        - Stops without creating anything when the owner is not found.
        - Stops without creating anything when a project with the same title already exists.
      examples:
        - run: pecot project create example-org "Example Project" --suffix example
          note: Create a project and activate it.
      default_notes: {}
    summary: 新しいプロジェクトを作ります。既にあるプロジェクトにフィールドを足すときは、`project init` を使います。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      suffix: 'ワークフローのフィールドに付ける接尾辞です。'
      title: 'プロジェクトの題です。'
    constraints: []
    details:
      - '所有者の GitHub Projects V2 のプロジェクトを作ります。'
