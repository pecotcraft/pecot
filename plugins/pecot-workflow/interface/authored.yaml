  PW-WORKTREE-REMOVE:
    help:
      details:
        - Finds the worktree by the given name among the worktrees of the repository in -D other than the main worktree, and removes it with git worktree remove.
        - Looks for the worktree in 3 steps and takes the first match. First the worktree whose name that pecot worktree add recorded is the given name, then the worktree at <project root>/<name>/<repo>, then the worktree whose checked out branch is the given name.
        - Does not read the record of a worktree whose directory is missing.
        - The main worktree is never found by name.
        - Deletes the local branch of the same name unless --keep-branch is given.
        - A branch of another name that the removed worktree had checked out remains.
        - When git branch -D fails, a warning with the reason is written instead of the deleted line, the branch remains and the command still finishes with exit status 0.
        - Removes <project root>/<name> afterwards when that directory is empty.
        - A set directory that cannot be removed is a warning.
        - Without --force, git refuses to remove a worktree that has changes.
        - A name that matches no worktree in any of the 3 steps stops the command.
        - Needs a devcontainer.
        - Does not read the worktree config files or the active project.
      examples:
        - run: pecot worktree remove wt1 -D .
          note: Remove the worktree wt1 and its branch.
        - run: pecot worktree remove wt1 -D . --keep-branch --force
          note: Remove the worktree even with changes and keep the branch.
      default_notes: {}
    summary: worktree を削除します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      force: '変更があっても削除するかどうかです。'
      keep_branch: 'ブランチを残すかどうかです。'
      name: '削除する worktree の名前です。記録した `wtN`、`wtN` のディレクトリ、ブランチ名のどれかを渡します。'
    constraints: []
    details:
      - '`-D` のリポジトリの worktree のうち、メインの worktree を除いたものから、渡した名前の worktree を探します。見つけた worktree は、`git worktree remove` で削除します。'
      - 'worktree は 3 段階で探し、最初に当たったものを使います。1 段階目は、`pecot worktree add` が記録した名前が、渡した名前と同じ worktree です。2 段階目は、`<プロジェクトのルート>/<name>/<repo>` にある worktree です。3 段階目は、チェックアウトしているブランチが渡した名前の worktree です。'
      - 'ディレクトリの無い worktree の記録は読みません。'
      - 'メインの worktree が名前で見つかることはありません。'
      - '`--keep-branch` を付けなければ、同じ名前のローカルブランチを削除します。'
      - '削除した worktree がチェックアウトしていた別の名前のブランチは残ります。'
      - '`git branch -D` が失敗すると、`deleted` の行の代わりに、理由を添えた `warning` を書きます。ブランチは残り、終了コード 0 で終わります。'
      - 'その後、`<プロジェクトのルート>/<name>` のディレクトリが空なら削除します。'
      - 'セットのディレクトリを削除できないときは、`warning` として扱います。'
      - '`--force` が無いと、git は変更のある worktree の削除を拒みます。'
      - '3 段階のどれでも worktree に当たらない名前を渡すと、止まります。'
      - 'devcontainer が要ります。'
      - 'worktree の設定ファイルとアクティブなプロジェクトは読みません。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、`removed` の行と `deleted` の行を出します。ブランチを削除できないときは、`deleted` の行の代わりに `warning` の行を出します。セットのディレクトリを削除できないときも、`warning` の行を出します。失敗したときは、`error` の行を出します。devcontainer の外のときも含みます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - code: 0
        when: 'worktree を削除しました。ブランチを削除できなかったときも含みます。'
      - code: 1
        when: '次のどれかです。`--repo` が今の git remote と違います。git のリポジトリの外で `--repo` を省きました。渡した名前に当たる worktree がありません。`git worktree remove` が失敗しました。devcontainer の外で動かしました。'
      - code: 2
        when: '次のどれかです。名前か `-D` がありません。`-D` が既にあるディレクトリではありません。ほかのコマンドラインの誤りがあります。'
    on_error: '最初のエラーで止まります。`git worktree remove` が失敗したときは、worktree とブランチは残ります。worktree を削除した後でブランチの削除に失敗したときは、`warning` を書き、ブランチを残します。'
    effects:
      - target: git
        kind: read
        what: 'worktree の一覧と、`pecot worktree add` がそれぞれの worktree に記録した `wtN` を読みます。'
      - target: git
        kind: destructive
        what: 'worktree を削除します。`--force` のときは、コミットしていない変更ごと削除します。ローカルブランチを `git branch -D` で削除します。'
      - target: file
        kind: destructive
        what: '空になったセットのディレクトリ `<プロジェクトのルート>/<name>` を削除します。'
    prerequisites:
      - 'コマンドは、devcontainer の中で動かします。'
    idempotent: false
    examples:
      - run: pecot worktree remove wt1 -D .
        note: 'worktree `wt1` と、そのブランチを削除します。'
      - run: pecot worktree remove wt1 -D . --keep-branch --force
        note: '変更があっても worktree を削除し、ブランチは残します。'
    default_notes: {}
    behaviors:
      - id: PW-WORKTREE-REMOVE-01
        pattern: event
        statement: '`worktree add` が記録した名前を渡して打つと、checkout しているブランチによらず、その worktree を削除します'
      - id: PW-WORKTREE-REMOVE-02
        pattern: event
        statement: '`--keep-branch` を省いて worktree を削除すると、同じ名前のローカルブランチを削除します'
      - id: PW-WORKTREE-REMOVE-03
        pattern: event
        statement: '`--keep-branch` を付けて打つと、ブランチを残します'
      - id: PW-WORKTREE-REMOVE-04
        pattern: event
        statement: '`--force` を付けて打つと、変更のある worktree も削除します'
      - id: PW-WORKTREE-REMOVE-05
        pattern: event
        statement: '削除した後にプロジェクトのルートの下の同名のディレクトリが空だと、そのディレクトリを削除します'
      - id: PW-WORKTREE-REMOVE-06
        pattern: event
        statement: 'worktree を削除すると、`removed` の行を標準エラーに出します'
      - id: PW-WORKTREE-REMOVE-07
