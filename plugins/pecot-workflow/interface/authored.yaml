        pattern: unwanted
        statement: 'もし `--repo` を省いて git の外で打ったなら、終了コード 1 で終わります'
  PW-DEPENDABOT-SYNC:
    help:
      details:
        - Finds the open Tracker issue labeled dependabot-pr whose body has the Tracker marker.
        - Rewrites the table between list-begin and list-end in the body of the Tracker.
        - Lists the open Dependabot PRs that wait for a human decision.
        - A PR with no waiting reason is not listed.
        - A PR is eligible for auto-merge when its first commit is authored by dependabot[bot] with a valid signature and the largest known update type is minor or patch.
        - A dependency whose update type is unknown is ignored while another dependency has a known type, and the PR counts as unknown only when no dependency has a known type.
        - A PR whose update type is major or unknown is listed.
        - An eligible PR is listed when its checks failed.
        - An eligible PR with auto-merge on is listed when its checks have not finished 24 hours after the last push.
        - An eligible PR is listed when it conflicts for more than 30 minutes, counted from the later of the last push and the latest commit of the base branch.
        - An eligible PR is listed when it was dequeued after the last push and has neither auto-merge nor a merge queue entry.
        - An eligible PR with neither auto-merge nor a merge queue entry is listed 30 minutes after the last push.
        - The last push is the last force push, or the creation of the PR when there is none.
        - Each table row has the PR title, a link to the PR and the state of the checks (passed, failed, pending or none).
        - The waiting reasons appear only in the result lines.
        - Text in the Tracker body outside the list markers stays as it is.
        - When no Tracker is open and there are PRs to list, creates a Tracker, adds it to the project board, and sets Status to Backlog and Priority to medium.
        - When no Tracker is open and no PR is listed, creates nothing.
        - When the list is empty and a Tracker is open, sets the list to none and closes the Tracker as completed.
        - On an open Tracker that is not closed, sets Status and Priority only while they are empty, so a change made by a person stays.
        - A field that the active project does not define is not set.
        - When several Trackers are open, uses the lowest number and leaves the others open.
        - A closed Tracker is not reused.
      examples:
        - run: pecot dependabot sync --dry-run
          note: Show the planned Tracker changes without writing to GitHub.
        - run: pecot dependabot sync
          note: Rewrite the Tracker list, creating or closing the Tracker when needed.
      default_notes: {}
    summary: 人の判断を待つ Dependabot の PR の一覧を、open の Tracker に書き直します。
    arguments:
      dry_run: '何も変えずに、Tracker を変える予定だけを出すかどうかです。'
    constraints: []
    details:
      - 'ラベルが `dependabot-pr` で、本文に Tracker の印がある open の Tracker の Issue を探します。'
      - 'Tracker の本文の `list-begin` と `list-end` の間にある表を書き直します。'
      - '表には、人の判断を待つ open の Dependabot の PR を載せます。'
      - '判断を待つ理由の無い PR は載せません。'
      - 'PR が自動マージの対象になるのは、次の 2 つがそろうときです。最初のコミットの作者が `dependabot[bot]` で、署名が有効なこと。分かっている update type のうち最大のものが minor か patch であること。'
      - 'update type が不明の依存は、ほかの依存の type が分かっている間は無視します。PR を不明として数えるのは、どの依存の type も分からないときだけです。'
      - 'update type が major か不明の PR は載せます。'
      - '対象の PR は、検証が失敗していると載せます。'
      - '自動マージを入れた対象の PR は、最後の push から 24 時間たっても検証が終わらないと載せます。'
      - '対象の PR は、30 分を超えて競合していると載せます。最後の push と base ブランチの最新のコミットのうち、遅い方から数えます。'
      - '対象の PR は、最後の push の後で merge queue から外され、自動マージも merge queue の登録も無いと載せます。'
      - '自動マージも merge queue の登録も無い対象の PR は、最後の push から 30 分たつと載せます。'
      - '最後の push は、最後の force push です。force push が無ければ、PR の作成です。'
      - '表の各行は、PR の題、PR へのリンク、検証の状態（passed・failed・pending・none）です。'
      - '判断を待つ理由は、結果の行だけに出ます。'
      - 'Tracker の本文のうち、一覧の印の外にある文はそのまま残します。'
      - 'open の Tracker が無く、載せる PR があるときは、Tracker を作ってプロジェクトのボードに足します。Status を Backlog、Priority を medium にします。'
      - 'open の Tracker が無く、載せる PR も無いときは、何も作りません。'
      - '一覧が空で open の Tracker があるときは、一覧を none にし、Tracker を completed として閉じます。'
      - '閉じない open の Tracker には、Status と Priority が空の間だけ値を入れます。人が変えた値は残ります。'
      - 'アクティブなプロジェクトが定義していないフィールドは設定しません。'
      - 'open の Tracker が複数あるときは、番号が最小のものを使い、ほかは open のまま残します。'
      - '閉じた Tracker は使い回しません。'
    stdin: none
    output:
      format: none
    diagnostics: '`count` の行で、open の Dependabot の PR の数、判断を待つ PR の数、判断を待つ PR のうち検証の結果が無いものの数を出します。変更ごとに結果の行（`created`・`added`・`removed`・`updated`・`unchanged`・`closed`・`skipped`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。open の Tracker が複数あるときは、`warning` の行を出します。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'Tracker を同期しました。または、`--dry-run` で予定を出しました。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。git remote からリポジトリを読めません。PR か Issue の一覧を取れません。Tracker の本文にある `list-begin` と `list-end` の印が、ちょうど 1 組ではありません。Tracker の作成・書き直し・クローズ・ボードへの配置のどれかに失敗しました。GitHub トークンが見つかりません。'
      - code: 2
        when: 'コマンドラインの誤りがあります。'
    on_error: '作った Tracker は、ボードへの配置に失敗しても GitHub に open のまま残り、次の実行でボードに置きます。本文の書き直しに失敗したときは、本文は元のままで、Tracker は open のままです。クローズに失敗したときは、一覧は none のまま、Tracker は open のままで、次の実行で閉じます。済んだ変更は巻き戻しません。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの open の Dependabot の PR と、`dependabot-pr` のラベルが付いた Issue の一覧を読みます。'
      - target: github
        kind: write
        what: 'Tracker の Issue を作り、本文を書き直し、閉じます。プロジェクトのボードに足し、Status と Priority を設定します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、Issue とプロジェクトを編集する権限が要ります。'
      - '対象のリポジトリは `--repo` です。無ければ、作業ディレクトリの remote の `origin` です。`origin` も無ければ、最初の remote です。'
    idempotent: true
    examples:
      - run: pecot dependabot sync --dry-run
        note: 'GitHub へ書き込まず、Tracker を変える予定を出します。'
      - run: pecot dependabot sync
        note: 'Tracker の一覧を書き直します。必要なら、Tracker を作るか閉じます。'
    default_notes: {}
    behaviors:
      - id: PW-DEPENDABOT-SYNC-01
