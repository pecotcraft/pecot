      - id: PW-DEPENDABOT-SYNC-13
        pattern: event
        statement: '自動マージと queue と push 後の dequeue の記録が無い対象の PR の最後の push から 30 分を超えると、その PR を表に載せます'
      - id: PW-DEPENDABOT-SYNC-14
