  PW-UPDATE-ISSUE-STATUS:
    help:
      details:
        - Sets the Status of an Issue that is already on the project board of the active project.
        - The Issue reference is owner/repo/N or the short form N.
        - The short form N refers to the Issue of the repository given by the global pecot --repo.
        - Without --repo, the short form N refers to the Issue of the repository of the git remote.
        - The status is backlog, pending, blocked, ready, active, in_review or archived.
        - The status is checked before the config file is read.
        - The repository of the Issue must be registered in the active project, and the Issue must be on the board.
        - Unlike add-to-project, which only warns, a status that the board does not define stops the command with exit status 1.
      examples:
        - run: pecot update-issue-status example-org/my-repo/123 in_review
          note: Move the Issue to In Review.
      default_notes: {}
    summary: Issue の番号で、プロジェクトのボード上の Issue の Status を更新します。ふだんは、pecot のコマンドが自分で Status を設定します。
    arguments:
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      status: '設定する Status です。`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
    constraints: []
    details:
      - 'アクティブなプロジェクトのボードに既にある Issue の、Status を設定します。'
      - 'Issue の参照は、`owner/repo/N` か、短い形の `N` です。'
      - '短い形の `N` は、pecot 全体のオプション `--repo` で渡したリポジトリの Issue を指します。'
      - '`--repo` が無いときの短い形の `N` は、git remote のリポジトリの Issue を指します。'
      - 'status は、`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかです。'
      - 'status は、設定ファイルを読む前に確かめます。'
      - 'Issue のリポジトリはアクティブなプロジェクトに登録されていて、Issue はボードに載っていなければなりません。'
      - 'ボードが定義していない status を渡すと、終了コード 1 で止まります。`warning` を出すだけの `add-to-project` とは違います。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、Status の結果の行（`set`）を出します。status が有効な値でないときは、有効な値を並べた `error` の行を出します。ボードが Blocked を定義していないときは、`hint` の行が `pecot project init` の実行を案内します。'
    environment: []
    exit_status:
      - code: 0
        when: 'Status を設定しました。'
      - code: 1
        when: '次のどれかです。status が有効な値ではありません。アクティブなプロジェクトがありません。リポジトリがプロジェクトにありません。Issue がボードにありません。ボードがその status を定義していません。GitHub API がエラーを返しました。プロジェクトのルートを決められません。'
      - code: 2
        when: '次のどれかです。Issue の参照の形が誤っています。リポジトリが決まらないのに短い形を渡しました。ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリと、Issue のボードの項目を読みます。'
      - target: github
        kind: write
        what: 'ボードの項目の Status の欄を設定します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - run: pecot update-issue-status example-org/my-repo/123 in_review
        note: 'Issue を In Review へ動かします。'
    default_notes: {}
    behaviors:
      - id: PW-UPDATE-ISSUE-STATUS-01
        pattern: event
        statement: 'Issue の参照と Status を渡して打つと、ボード上のその Issue の Status を渡した値にします'
      - id: PW-UPDATE-ISSUE-STATUS-02
        pattern: event
        statement: 'Issue の参照に番号だけを渡して `--repo` を付けると、そのリポジトリの Issue の Status を設定します'
      - id: PW-UPDATE-ISSUE-STATUS-03
        pattern: event
        statement: 'Issue の参照に番号だけを渡して `--repo` を省くと、git の remote のリポジトリの Issue を対象にします'
      - id: PW-UPDATE-ISSUE-STATUS-04
        pattern: event
        statement: 'Status を設定すると、`set` の行を標準エラーに出します'
      - id: PW-UPDATE-ISSUE-STATUS-05
        pattern: unwanted
        statement: 'もし Status が 7 つの有効な値のどれでもないなら、有効な値を並べた `error` の行を標準エラーに出します'
      - id: PW-UPDATE-ISSUE-STATUS-06
        pattern: unwanted
        statement: 'もし Status が `backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれでもないなら、終了コード 1 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-07
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-08
        pattern: unwanted
        statement: 'もし Issue の参照が不正なら、終了コード 2 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-09
        pattern: unwanted
        statement: 'もし Issue のリポジトリがプロジェクトに登録されていないなら、終了コード 1 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-10
        pattern: unwanted
        statement: 'もし Issue がボードに無いなら、`add-to-project` を案内する `error` の行を標準エラーに出します'
      - id: PW-UPDATE-ISSUE-STATUS-11
        pattern: unwanted
        statement: 'もし Issue がボードに無いなら、終了コード 1 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-12
        pattern: unwanted
        statement: 'もしボードが Status を定義していないなら、終了コード 1 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-13
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-UPDATE-ISSUE-STATUS-14
        pattern: unwanted
        statement: 'もし Status が `blocked` でボードが Blocked を定義していないなら、`project init` で足し方を案内する `hint` の行を標準エラーに出します'
  PW-WORKTREE-ADD:
    help:
      details:
        - Creates a worktree of the repository in -D under <project root>/<wtN>/<repository directory name>, on a new branch named wtN.
        - The project root is the parent of base/ in the layout <project root>/base/<repository>.
        - A repository outside that layout stops the command.
        - Joins the lowest numbered wtN set that has no worktree of this repository yet, and starts the set max(N)+1 when every set already has one.
        - wt1 to wt9 are the limit.
        - Skips every wtN that a worktree of this repository already uses, including a worktree made with --path, which is found by its record or by a checked out branch wtN.
        - Records wtN in the git administrative directory of the new worktree, which pecot pr cleanup reads to return to wtN.
        - Creates the branch from <remote>/<base> with that branch as its upstream, where <remote> is the origin remote; when there is no origin, the first remote in git remote order that points to a repository registered in the active project, or the first remote when none does, and <base> is --base or the develop_branch of the repository in the active project.
        - When the branch wtN already exists, stops unless its upstream is <remote>/<base> or --allow-existing-branch is given.
        - A matching branch that no worktree uses is deleted and created again.
        - Runs git worktree prune on the main worktree before it creates the worktree, also with --dry-run.
        - Needs .pecot/config/worktree-config.json and .pecot/config/.worktreeignore in the main worktree, which pecot worktree init creates.
        - The repository must be registered in the active project.
        - Creates the symlinks of worktree-config.json, then copies the git-ignored files of the main worktree that .worktreeignore does not exclude and that are not under a created symlink, then runs the setup command in the new worktree.
        - With --path, the worktree is created at that path, and the copied files go to that path.
        - With --path, the symlinks and .pecot/.gitignore are created in the worktree at that path.
        - When a link path starts with .pecot/, writes .pecot/.gitignore in the new worktree by running a script of the plugin before it links.
        - The setup command is --setup, or setup_command of worktree-config.json, and runs through the shell with a closed stdin and the timeout setup_command_timeout.
        - A failed or timed out setup command is a warning and does not change the exit status.
        - A link whose target does not exist, whose path is tracked by git or that cannot be created is skipped with a warning, and does not change the exit status.
        - Needs a devcontainer.
        - The command stops before it runs when none of the checks passes.
      examples:
        - run: pecot worktree add -D .
          note: Create the next worktree of the repository in the current directory.
        - run: pecot worktree add -D . --dry-run
          note: Show the worktree that would be created.
        - run: pecot worktree add -D . --base develop --setup "pnpm install"
          note: Branch from develop and run a setup command after creation.
      default_notes:
        base: The develop_branch of the repository in the active project.
        path: <project root>/<wtN>/<repository directory name>.
        setup: The setup_command of worktree-config.json; without it, no command runs.
    summary: 新しい worktree を作ります。
    arguments:
      allow_existing_branch: '既にあるブランチを、upstream が `develop_branch` と違っても使い回してよいかどうかです。'
      base: '分岐元のブランチです。'
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      dry_run: '何も変えずに、行う予定だけを出すかどうかです。'
      no_copy: '追跡していないファイルのコピーを飛ばすかどうかです。'
      no_link: 'シンボリックリンクの作成を飛ばすかどうかです。'
      path: 'worktree を作る場所です。'
      setup: '作った後で動かすコマンドです。'
    constraints: []
    details:
      - '`-D` のリポジトリの worktree を、`<プロジェクトのルート>/<wtN>/<リポジトリのディレクトリ名>` に作ります。ブランチは、`wtN` という名前の新しいブランチです。'
      - 'プロジェクトのルートは、`<プロジェクトのルート>/base/<リポジトリ>` の配置での `base/` の親です。'
      - 'この配置の外のリポジトリでは、止まります。'
      - 'このリポジトリの worktree がまだ無い `wtN` のセットのうち、番号が最小のものに加わります。どのセットにも既にあるときは、最大の N に 1 を足したセットを始めます。'
      - '上限は、`wt1` から `wt9` までです。'
      - 'このリポジトリの worktree が既に使っている `wtN` は、すべて飛ばします。`--path` で作った worktree も含みます。その worktree は、記録か、チェックアウトしているブランチ `wtN` で見つけます。'
      - '新しい worktree の git の管理ディレクトリに、`wtN` を記録します。`pecot pr cleanup` が、`wtN` へ戻るためにこの記録を読みます。'
      - 'ブランチは `<remote>/<base>` から作り、そのブランチを upstream にします。`<base>` は、`--base` か、アクティブなプロジェクトにあるリポジトリの `develop_branch` です。`<remote>` は、remote の `origin` です。`origin` が無ければ、`git remote` の順で、アクティブなプロジェクトに登録したリポジトリを指す最初の remote です。そういう remote も無ければ、最初の remote です。'
      - 'ブランチ `wtN` が既にあるときは、止まります。upstream が `<remote>/<base>` のときと、`--allow-existing-branch` を付けたときは別です。'
      - 'upstream が合っていて、どの worktree も使っていないブランチは、消して作り直します。'
      - 'worktree を作る前に、メインの worktree で `git worktree prune` を動かします。`--dry-run` のときも動かします。'
      - 'メインの worktree に、`.pecot/config/worktree-config.json` と `.pecot/config/.worktreeignore` が要ります。どちらも `pecot worktree init` が作ります。'
      - 'リポジトリは、アクティブなプロジェクトに登録されていなければなりません。'
      - '`worktree-config.json` のシンボリックリンクを作ってから、メインの worktree で git が無視しているファイルをコピーします。`.worktreeignore` が除くファイルと、作ったシンボリックリンクの下のファイルはコピーしません。コピーの後、新しい worktree で setup のコマンドを動かします。'
      - '`--path` を付けると、そのパスに worktree を作り、ファイルもそのパスへコピーします。'
      - '`--path` を付けると、シンボリックリンクと `.pecot/.gitignore` も、そのパスの worktree に作ります。'
      - 'リンクのパスが `.pecot/` で始まるときは、リンクを作る前にプラグインのスクリプトを動かし、新しい worktree に `.pecot/.gitignore` を書きます。'
      - 'setup のコマンドは、`--setup` か、`worktree-config.json` の `setup_command` です。シェルを通して動かし、標準入力は閉じ、`setup_command_timeout` で時間切れにします。'
      - 'setup のコマンドが失敗するか時間切れになっても `warning` として扱い、終了コードは変わりません。'
      - '次のリンクは、`warning` を出して飛ばします。リンク先が無いもの、パスを git が追跡しているもの、作れないものです。終了コードは変わりません。'
      - 'devcontainer が要ります。'
      - 'devcontainer の確認がどれも通らないときは、コマンドは動く前に止まります。'
    stdin: none
    output:
      format: text
      description: '作った worktree のパスの 1 行です。`--dry-run` のときは、予定のパスです。'
    diagnostics: '標準エラーに、`created` の行（`--dry-run` のときは `dry-run` の行）を出します。シンボリックリンクとコピーしたファイルの `count` の行も出します。`warning` の行を出すのは、次のものです。飛ばしたリンクそれぞれ、コピーできなかったファイルそれぞれ、失敗した setup のコマンド、書けなかった `wtN` の記録です。失敗したときは、`error` の行を出します。devcontainer の外のときも含みます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - code: 0
        when: 'worktree を作りました。または、`--dry-run` で予定を出しました。次のものがあっても変わりません。飛ばしたリンク、コピーできなかったファイル、失敗した setup のコマンド、書けなかった `wtN` の記録です。'
      - code: 1
        when: '次のどれかです。`--repo` が今の git remote と違います。git のリポジトリの外で `--repo` を省きました。メインの worktree が見つかりません。リポジトリが `base/` の配置にありません。`worktree-config.json` か `.worktreeignore` が無いか、`worktree-config.json` の内容が不正です。選んだ remote のリポジトリを、GitHub の `owner/repo` として読めません。アクティブなプロジェクトがありません。リポジトリがそのプロジェクトに登録されていません。`develop_branch` が未設定で、`--base` もありません。`wt1` から `wt9` までのセットがすべて使われています。ブランチ `wtN` が別の upstream で既にあります。`git worktree add` が失敗しました。devcontainer の外で動かしました。'
      - code: 2
        when: '`-D` が無いか、既にあるディレクトリでないか、ほかのコマンドラインの誤りがあります。'
    on_error: '最初のエラーで止まります。`git worktree add` の後で `worktree-config.json` の内容が不正だと分かったときは、worktree とブランチは残ります。リンク・コピーしたファイル・setup の実行はありません。`wtN` の記録を書けなくても、worktree はそのままです。prune した管理情報と、消した未使用のブランチは、元に戻しません。'
    effects:
      - target: git
        kind: write
        what: '古い worktree の管理情報を prune します（`--dry-run` のときも行います）。worktree とブランチ `wtN` を作り、upstream を設定します。worktree の git の管理ディレクトリに、`wtN` を記録します。'
      - target: git
        kind: destructive
        what: '期待する upstream と合っていて、worktree の無い既存のローカルブランチ `wtN` を消します。'
      - target: file
        kind: read
        what: '`worktree-config.json`、`.worktreeignore`、アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'シンボリックリンクを作り、既にあるシンボリックリンクは置き換えます。git が無視しているファイルをコピーし、新しい worktree に `.pecot/.gitignore` を書きます。'
      - target: file
        kind: destructive
        what: '新しい worktree のリンクのパスに既にある、実体のファイルかディレクトリを消します。'
      - target: process
        kind: write
        what: 'setup のコマンドをシェルを通して動かします。`.pecot/.gitignore` を書くスクリプトも動かします。'
    prerequisites:
      - 'コマンドは、devcontainer の中で動かします。'
      - 'リポジトリは、`<プロジェクトのルート>/base/<リポジトリ>` の配置になければなりません。worktree の設定ファイルも要ります（`pecot worktree init` で作ります）。'
      - 'アクティブなプロジェクトが要り、リポジトリがそこに登録されていなければなりません。'
      - 'ローカルのリポジトリに `<remote>/<base>` が要ります。`<remote>` は、remote の `origin` です。`origin` が無ければ、`git remote` の順で、アクティブなプロジェクトに登録したリポジトリを指す最初の remote です。そういう remote も無ければ、最初の remote です。'
    idempotent: false
    examples:
