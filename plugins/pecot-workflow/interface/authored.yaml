        statement: 'もし輪になるかを確かめられないなら、前提を付けずに、`kind` が `dependency-unreadable` の失敗を返します'
      - id: PW-ISSUE-BLOCK-12
        pattern: unwanted
        statement: 'もし `wait` が `merge` で `reason` が無いなら、要求を送らずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-ISSUE-BLOCK-13
        pattern: unwanted
        statement: 'もし `wait` が `stack` で `reason` を渡したなら、要求を送らずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-ISSUE-BLOCK-14
