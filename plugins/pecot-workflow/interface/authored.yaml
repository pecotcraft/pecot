  PW-ISSUE-REOPEN:
    help:
      details:
        - Reopens a closed Issue and sets its status on the project board.
        - Sets the status given by --status, and ready when it is not given.
        - Waits 3 seconds after setting the status and reopens the Issue a second time, because board automation can close it again.
        - With --comment, posts the given reason as a comment after the Issue is reopened.
        - Each run with --comment posts another comment.
        - An Issue that is not on the board is reopened with a warning and its status is not changed.
        - "When the board item is archived, unarchives it before setting the status, and writes the line updated: Issue <ref> unarchived on the board."
        - "When the built-in Status of the board item is Done, clears it before reopening the Issue, so that the board automation does not close the Issue again, and writes the line removed: Issue <ref> Status Done on the board."
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
        - With --dry-run, reads the Issue and the board item and prints dry-run lines for reopening, unarchiving, clearing the Status Done, setting the status and posting the comment, and writes nothing.
      examples:
        - run: pecot issue reopen example-org/my-repo/12 --status active --comment "The fix did not hold."
          note: Reopen an Issue as active and leave the reason.
        - run: pecot issue reopen example-org/my-repo/12 --dry-run
          note: Show what would change without reopening the Issue.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 閉じた Issue を開き直し、ボードの status も設定します。
    arguments:
      comment: '開き直す理由です。コメントとして投稿します。'
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      status: '開き直した後の status です。`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
      dry_run: '何も書かずに、する予定だけを出すかどうかです。'
    constraints: []
    details:
      - '閉じた Issue を開き直し、プロジェクトのボードの status を設定します。'
      - '`--status` の値を設定します。渡さなければ `ready` にします。'
      - 'status を設定してから 3 秒待ち、Issue をもう一度開き直します。ボードの自動化が Issue を閉じ直すことがあるためです。'
      - '`--comment` を付けると、Issue を開き直した後で、渡した理由をコメントとして投稿します。'
      - '`--comment` を付けて実行するたびに、コメントが 1 件増えます。'
      - 'ボードに無い Issue は、`warning` を出して開き直し、status は変えません。'
      - 'ボードの項目がアーカイブ済みのときは、status を設定する前にアーカイブを解き、`updated: Issue <ref> unarchived on the board` の行を出します。'
      - '組み込みの `Status` が `Done` の項目は、Issue を開き直す前に値を消し、`removed: Issue <ref> Status Done on the board` の行を出します。'
      - '`Done` が残ると、ボードの自動化（Auto-close issue）が Issue を閉じ直すことがあります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      - '`--dry-run` を付けると、Issue とボードの項目を読みます。開き直し・アーカイブの解除・`Done` の消去・status の設定・コメントの投稿を `dry-run` の行に出し、何も書きません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        issue: '再び開いた Issue です。`owner/repo/N` の形です。'
        status: 'ボードに設定した Status です。Issue がボードに無いときと、Status が設定されていないときは入りません。'
        unarchived: 'ボードの項目の Archived を解いたかどうかです。'
        doneCleared: 'ボードの項目の組み込みの `Status` の `Done` を消したかどうかです。'
        commented: '理由をコメントに投稿したかどうかです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、結果の行を出します。`updated`（アーカイブの解除）、`removed`（`Status` の `Done` の消去）、`set`（status）、`reopened`（Issue）、`created`（コメント）です。Issue がボードに無いときと、status がプロジェクトに設定されていないとき、`Status` の `Done` を消せないときは、`warning` の行を出します。値が `blocked` のときは、`hint` の行が `pecot project init` の実行を案内します。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - kind: invalid-input
        code: 1
        when: 'status が有効な値ではありません。'
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: repo-not-in-project
        code: 1
        when: 'リポジトリがプロジェクトにありません。'
      - kind: other
        code: 1
        when: '2 回目に開き直した後も、Issue が open ではありません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'コメントの投稿に失敗したときは、Issue は新しい status で open のまま残り、終了コード 1 で終わります。2 回目に開き直した後も Issue が open でないときは、status は変わったまま残り、終了コード 1 で終わります。`Status` の `Done` を消した後で Issue を開き直せないときは、閉じた Issue と空の `Status` が残り、終了コード 1 で終わります。もう一度打てば開き直します。'
    effects:
      - target: github
        kind: write
        what: 'Issue を開き直し、コメントを投稿します。ボードの項目は、アーカイブを解き、組み込みの `Status` の `Done` を消し、status のフィールドを設定します。`--dry-run` のときは書きません。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリと、Issue のボードの項目を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: "pecot issue reopen example-org/my-repo/12 --status active --comment \"The fix did not hold.\""
        note: 'Issue を `active` で開き直し、理由を残します。'
      - run: pecot issue reopen example-org/my-repo/12 --dry-run
        note: 'Issue を開き直さずに、する予定を出します。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-REOPEN-01
        pattern: event
        statement: '閉じた Issue の参照を渡すと、その Issue を reopen します'
      - id: PW-ISSUE-REOPEN-02
