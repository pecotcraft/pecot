      - id: PW-RELEASE-CHECK-12
        pattern: unwanted
        statement: 'もし Dependabot alert の状態を読めないなら、残りの確認を続けます'
      - id: PW-RELEASE-CHECK-13
        pattern: unwanted
        statement: 'もし open の code scanning alert があるなら、`kind` が `preflight-failed` の失敗を返します'
      - id: PW-RELEASE-CHECK-14
        pattern: unwanted
        statement: 'もし open の secret scanning alert があるなら、`kind` が `preflight-failed` の失敗を返します'
      - id: PW-RELEASE-CHECK-15
        pattern: unwanted
        statement: 'もし code scanning か secret scanning の状態を判定できないなら、`kind` が `preflight-failed` の失敗を返します'
      - id: PW-RELEASE-CHECK-16
        pattern: unwanted
        statement: 'もし alert の確認が 1 つ失敗したなら、残りの確認も行います'
      - id: PW-RELEASE-CHECK-17
