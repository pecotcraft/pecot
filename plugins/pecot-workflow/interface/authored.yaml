  PW-RELEASE-MERGE:
    summary: リリースの PR を、通常のマージでマージします。
    arguments:
      admin: '管理者の権限でマージするかどうかです。マージできるかどうかの確認を飛ばします。'
      delete_branch: 'マージの後でブランチを削除するかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/123` の形で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    constraints: []
    details:
      - 'PR を通常のマージ（マージコミット）でマージします。merge-base を保つために、squash と rebase は使いません。'
      - '対象の PR は、引数 `pr_ref`（`owner/repo/N`）です。'
      - '短い形の `N` は、`repo` を渡しても受け付けません。'
      - '引数 `repo` は、今の git remote と比べるだけで、対象には使いません。'
      - '`repo` が今の git remote と食い違うときは、失敗を返します。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`warnings` に入れて続け、無ければ失敗を返します。'
      - 'マージするのは、base ブランチが設定ファイルにあるリポジトリの `release_branch` と同じ PR だけです。'
      - '既にマージ済みか閉じている PR は、マージしません。'
      - 'マージの衝突がある PR は、`admin` を付けなければマージしません。'
      - '`admin` で飛ばすのは、衝突の確認だけです。マージを許すかどうかは、GitHub API が決めます。'
      - '`delete_branch` を付けると、マージの後で PR の head ブランチをリモートから削除します。'
      - 'head ブランチの削除に失敗しても、`warnings` で知らせ、成功を返します。'
      - 'リポジトリの既定ブランチを `release_branch` にしているときは、GitHub が Issue を閉じることがあります。閉じるのは、PR がクローズのキーワードで参照している Issue です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        pullRequest: 'マージしたリリースの PR です。`owner/repo/N` の形です。'
        head: 'PR の head ブランチです。'
        base: 'PR の base ブランチです。リリースブランチです。'
        deletedBranch: 'リモートの head ブランチを削除したかどうかです。`delete_branch` を付けなかったとき、削除に失敗したときは `false` です。'
    diagnostics: '標準エラーに、マージの結果の行と、削除したブランチの結果の行を出します。ブランチの削除に失敗したときは、`warning` の行を出します。失敗したときは、`error` の行を出します。`repo` が git remote と違うときも含みます。remote の URL から `owner/repo` を読めず `repo` があるときは、`warning: using repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `repo` の案内の行を続けます。'
    environment: []
    exit_status:
      - kind: repo-mismatch
        when: '`repo` が今の git remote と違います。'
      - kind: git-unresolved
        when: 'git の外で `repo` を省いたので、リポジトリが決まりません。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: github-not-found
        when: 'PR が見つかりません。'
      - kind: pr-state
        when: 'PR をマージできる状態ではありません。次のどれかです。既にマージ済みか、閉じています。衝突があるのに `admin` を付けていません。base ブランチが `release_branch` ではありません。'
      - kind: repo-setting-missing
        when: '`release_branch` が未設定です。'
      - kind: github-api
        when: 'PR を読めないか、GitHub API がマージを拒みました。'
      - kind: invalid-input
        when: '`pr_ref` が無いか、`owner/repo/N` の形ではありません。ほかの引数の誤りも含みます。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'マージに成功した後で head ブランチの削除に失敗したときは、PR はマージされたままで、head ブランチはリモートに残ります。'
    effects:
      - target: github
        kind: read
        what: 'PR の状態、マージできるかどうかの状態、base ブランチ、head ブランチを読みます。'
      - target: github
        kind: destructive
        what: 'マージの方法 `merge` で PR をマージします。'
      - target: github
        kind: destructive
        what: '`delete_branch` を付けたときに、PR の head ブランチをリモートから削除します。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
