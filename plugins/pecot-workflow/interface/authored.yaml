  PW-SESSION-START:
    summary: Issue に紐づいたブランチを作ります。
    arguments:
      base: '分岐元のブランチです。'
      branch: '作るブランチの名前です。'
      checkout: '互換のために残した引数で、何も変わりません。'
      issue_ref: 'Issue の参照です。`owner/repo/123` の形で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'GitHub の GraphQL API（`createLinkedBranch`）で、Issue に紐づいたブランチを作ります。ブランチは、Issue の Development の欄に出ます。'
      - '`issue_ref` は、フル形式の `owner/repo/N` でなければなりません。'
      - 'ブランチの名前は、Issue の番号を後ろに付けた `<branch>/<N>` です。'
      - 'ブランチを作る前に、`issue_show` と同じ方法で Issue の着手の判定を読みます。'
      - '判定が `stackable` のときは、スタック先の PR のブランチの先頭から分岐し、スタック先の Issue の番号を `stackedOn` に入れます。'
      - '判定が `startable` のときと、判定の無い Issue（Epic か Tracker）のときは、`base` の先頭から分岐します。`base` が無ければ、設定ファイルにあるそのリポジトリの `develop_branch` の先頭から分岐します。'
      - '`develop_branch` と `base` が要るのは、判定が決まった後で、ブランチをスタックしないときだけです。'
      - '判定が `blocked` のときは、ブランチを作りません。`kind` が `not-ready` の失敗を返し、`detail` に理由・済んでいない前提・直し方を入れます。`develop_branch` が未設定でも同じです。'
      - '直し方は、済んでいない前提ごとの unblock の案内と、スタック不可の前提ごとの、スタックに切り替える案内です。どの案内にも、その Issue の参照を添えます。'
      - '判定が決まった後でスタック先の PR のブランチが無くなったときは、ブランチと Issue の名前を `detail` に入れて失敗を返します。'
      - '`base` を判定が選んだ分岐元と比べるのは、判定が `stackable` のときだけです。違う `base` を渡すと、失敗を返します。'
      - 'ブランチを作る前に、前にマージされた PR の手元の後片付けの取りこぼしを確かめます。取りこぼしがあるときだけ、`warnings` と `leftovers` に入れます。取りこぼしがあっても止めません。'
      - '今のブランチの名前が `/<N>` で終わり、Issue のリポにあるそのブランチの PR がマージ済みで、開いた PR が無いときは、手元の片付けが残っています。`warnings` に、呼ぶ `session_finish` を添えます。'
      - '今のブランチの PR を読めなかったときは、`warnings` に入れます。'
      - 'GitHub Enterprise Server が Issue の依存関係に対応していないときは、判定を読まず、`warnings` で知らせます。ブランチは、前提の無い Issue と同じように分岐します。'
      - 'ブランチを作った後、ボード上の Issue の Status を `active` にします。'
      - 'Status の設定に失敗しても、成功を返します。'
      - 'その後、Issue のセッション名を `.pecot/state/.pecot-session-title` に記録し、`.pecot/work/<N>/` を作ります。作業ディレクトリがすでにあっても、`workDirectory` に入れます。'
      - '作業中の Issue はファイルに記録しません。git remote とブランチ名の末尾の番号から求めるので、`.pecot/state/.pecot-active` は書きません。'
      - '作業対象の記録に失敗しても、成功を返します。'
      - '作業対象を記録したときは、選んだ分岐元を `.pecot/state/.pecot-base` に `<branch> <sha>` の形で書きます。ブランチをスタックしたときは、スタック先の Issue の `owner/repo#N` を続けて書きます。'
      - '`.pecot/state/.pecot-base` は、作業対象を記録する前に消します。前の Issue の記録を残さないためです。'
      - 'セッションのディレクトリの git remote のリポジトリは、Issue のリポジトリでなければなりません。この確かめを外す入力はありません。ただし、remote の URL から `owner/repo` を読めないときは、確かめません。'
      - 'リポジトリは、選んだプロジェクトに登録されていなければなりません。'
      - '`checkout` は互換のために残したもので、何も変わりません。'
      - '引数 `repo` は、今の git remote のリポジトリと一致していなければなりません。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`warnings` に入れて続け、無ければ失敗を返します。'
      - 'このツールは、対象を `repo` から決めません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        branch: '作ったブランチの名前です。Issue の番号が付きます。'
        repository: 'ブランチを作ったリポジトリです。`owner/repo` の形です。'
        base: 'ブランチの起点にした base ブランチです。'
        stackedOn: 'このブランチのスタック先の Issue の番号です。スタックしないときは入りません。'
        issue: '作業中の Issue です。`owner/repo/N` の形です。'
        workDirectory: '作業ディレクトリの絶対パスです。作れなかったときは入りません。'
        leftovers: '手元の後片付けの残っている、前にマージされた PR の配列です。要素は `pullRequest` を持ち、その値は PR の `owner/repo/N` です。`session_finish` の手元の片付けが残っています。取りこぼしが無ければ入りません。'
    diagnostics: '標準エラーに、作ったブランチ（`created`）・Status（`set`）・作業ディレクトリ（`created`）の結果の行を出します。Status・作業対象・作業ディレクトリ・`.pecot-base` を設定できなかったときは、`warning` の行を出します。Issue の依存関係に対応していない GitHub Enterprise Server で判定を確かめなかったときも、`warning` の行を出します。前の PR の手元の後片付けの取りこぼしがあるときと、取りこぼしを確かめられなかったときも、`warning` の行を出します。Issue が blocked のときは、`error` の行に続けて、済んでいない前提ごとの行と直すコマンドを出します。2 行目からは、空白 2 つで字下げします。`base` が判定の選んだ分岐元と違うときは、`error` の行を出します。スタック先のブランチが無くなったときは、ブランチと Issue を添えた `error` の行を出します。前提を読めないか判定できないときも、`error` の行を出します。`develop_branch` が原因のときは、続けて設定の仕方を出します。remote の URL から `owner/repo` を読めず `repo` があるときは、`warning: using repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `repo` の案内の行を続けます。'
    environment: []
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        when: '`develop_branch` が未設定で、`base` もありません。'
      - kind: repo-not-in-project
        when: 'リポジトリがプロジェクトにありません。'
      - kind: git-unresolved
        when: 'スタック先のブランチが無くなりました。git の外で `repo` を省いたときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: repo-mismatch
        when: '`repo` が今の git remote と違います。'
      - kind: dependency-unreadable
        when: 'Issue の前提を読めないか、着手の判定ができません。'
      - kind: invalid-input
        when: '`issue_ref` がフル形式ではありません。`stackable` の Issue で、`base` が選ばれた分岐元と違うときと、ほかの引数の誤りも含みます。'
      - kind: repo-mismatch
        when: 'セッションのディレクトリのリポジトリが Issue のリポジトリと違います。通す入力はありません。'
      - kind: not-ready
        when: 'Issue が前提で blocked です。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'ブランチを作った後で Status の設定か作業対象の記録に失敗したときは、ブランチは Issue に紐づいたまま残り、成功を返します。作業対象を記録できなかったときは、`.pecot-base` を書きません。前の Issue の記録も残りません。`.pecot-base` を消せないか書けないときは、`warnings` で知らせます。Issue が blocked のとき、判定を読めないとき、スタック先のブランチが無くなったときは、何も作らず、何も書きません。'
    effects:
      - target: github
        kind: read
        what: '次のものを読みます。プロジェクトにつながっているリポジトリ。Issue の前提と、そのブランチの PR。Issue の node ID と題。分岐元のブランチの先頭のコミット。'
      - target: github
        kind: write
        what: '紐づいたブランチを作ります。'
      - target: github
        kind: destructive
        what: 'ボード上の Issue の Status を `active` にします。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
      - target: file
        kind: write
        what: '`.pecot/work/<N>/` を作ります。'
      - target: file
        kind: destructive
        what: '`.pecot/state/.pecot-session-title`・`.pecot/state/.pecot-base` を書きます。`.pecot/state/.pecot-active` は書きません。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
      - 'セッションのディレクトリは、Issue のリポジトリのチェックアウトでなければなりません。'
    idempotent: false
    examples:
      - arguments:
          issue_ref: example-org/my-repo/123
          branch: feat/my-change
        note: '開発ブランチから、ブランチ `feat/my-change/123` を作ります。'
      - arguments:
          issue_ref: example-org/my-repo/123
          branch: fix/my-bug
          base: main
        note: '`main` から、ブランチ `fix/my-bug/123` を作ります。'
    default_notes:
      base: '省くと、着手の判定が `stackable` のときは、スタック先の PR のブランチです。それ以外では設定ファイルにあるリポジトリの `develop_branch` で、それも無ければ失敗を返します。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-SESSION-START-01
