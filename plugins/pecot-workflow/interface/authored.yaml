  PW-ISSUE-QUICK:
    help:
      details:
        - Creates an Issue from a free-format message in one step, without template validation.
        - The title is the first 50 characters of the message with each run of whitespace turned into one space, prefixed by the type.
        - Adds the Issue to the project board and sets status, priority and size by type.
        - For task and bug the values are active, medium and s; for epic and tracker they are backlog and medium, with no size.
        - With a parent Epic, links the Issue as a sub-issue of it.
        - Giving a parent Epic to an Epic gives a warning.
        - Unless --no-branch is given, creates a linked branch named feat/<YYYYMMDD-HHMMSS>/<N> from the develop_branch of the repository.
        - After the branch is created, or with --no-branch, writes the work target to .pecot/state/.pecot-active and creates .pecot/work/<N>/.
        - For a type other than epic and tracker, creates the flag .pecot/state/.pecot-quick-mode.
        - With a parent Epic and --order, stops when another Issue of that Epic has the same order.
      examples:
        - run: pecot issue quick -r example-org/my-repo -m "Add an API endpoint"
          note: Create a task, its branch and the work target.
        - run: pecot issue quick -r example-org/my-repo -m "Update the docs" --no-branch
          note: Create a task without a branch.
      default_notes:
        type: task. The status, priority and size set on the board are decided by the type.
    summary: 自由な形式のメッセージから、Issue をすぐに作ります。
    arguments:
      message: 'Issue のメッセージです。形式は自由です。'
      no_branch: 'ブランチの作成を飛ばすかどうかです。'
      order: 'サブタスクの順番の番号です。`parent_epic` と一緒に使います。'
      parent_epic: '親 Epic の参照です。整数か、`owner/repo/N` の形で渡します。整数は、`aggregation_repo` の Issue として解決します。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。'
      type: 'Issue の種類です。`task`・`bug`・`epic`・`tracker` のどれかを渡します。'
    constraints: []
    details:
      - '自由な形式のメッセージから、テンプレートの検証なしで、1 回で Issue を作ります。'
      - '題は、メッセージの先頭の 50 文字です。連続した空白は 1 つの空白にまとめ、前に type を付けます。'
      - 'Issue をプロジェクトのボードに足し、status・priority・size を type に応じて設定します。'
      - '`task` と `bug` の値は `active`・`medium`・`s` です。`epic` と `tracker` の値は `backlog`・`medium` で、size はありません。'
      - '親 Epic があるときは、Issue を親 Epic の sub-issue としてつなぎます。'
      - 'Epic に親 Epic を渡すと、`warning` を出します。'
      - '`--no-branch` を付けなければ、リポジトリの `develop_branch` から、紐づいたブランチ `feat/<YYYYMMDD-HHMMSS>/<N>` を作ります。'
      - 'ブランチを作った後か、`--no-branch` のときに、作業対象を `.pecot/state/.pecot-active` に書き、`.pecot/work/<N>/` を作ります。'
      - '`epic` と `tracker` 以外の type では、フラグ `.pecot/state/.pecot-quick-mode` を作ります。'
      - '親 Epic と `--order` を渡したときは、その Epic に同じ order の Issue が既にあると止まります。'
    stdin: none
    output:
      format: text
      description: '作った Issue の URL です。'
    diagnostics: '標準エラーに、結果の行を出します。`created`（Issue、次にブランチ）、`added`（プロジェクト、次に親 Epic の sub-issue）、`set`（status・priority・size、次に作業対象）です。プロジェクトに足せなかったとき、ブランチを作れなかったとき、Epic に親 Epic を渡したときは、`warning` の行を出します。失敗ごとに `error` の行を出します。形の誤った `--parent-epic` は、`error` の行ではなく、コマンドラインの解析が使い方のエラーとして知らせます。'
    environment: []
    exit_status:
      - code: 0
        when: 'Issue を作りました。ボードに足せなかったときと、API でブランチを作れなかったときも 0 です。'
      - code: 1
        when: '次のどれかです。メッセージが空です。リポジトリが `owner/repo` の形ではありません。アクティブなプロジェクトがありません。リポジトリがプロジェクトにつながっていません。親 Epic の別の Issue が同じ order を持っています。親 Epic へのつなぎに失敗しました。リポジトリの `develop_branch` が未設定です。GitHub API がエラーを返しました。'
      - code: 2
        when: '次のどれかです。`--parent-epic` の形が誤っています。`-m` か `-r` がありません。ほかのコマンドラインの誤りがあります。'
    on_error: '`develop_branch` が未設定のときは、Issue はフィールドと sub-issue のつなぎを設定した状態でボードに残ります。URL は出さず、`.pecot-active` と `.pecot-quick-mode` のどちらも書きません。API でブランチを作れなかったときは、`warning` を書き、`.pecot-active` を書きません。プロジェクトのボードに足せなかったときは、Issue は残り、`warning` を書いて、その先は何もしません。親 Epic へのつなぎに失敗したときは、Issue はフィールドを設定した状態でボードに残ります。'
    effects:
      - target: github
        kind: write
        what: 'Issue を作り、プロジェクトのボードに足し、フィールドを設定します。親 Epic につなぎ、紐づいたブランチを作ります。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、親 Epic の sub-issue、開発ブランチの先頭を読みます。'
      - target: file
        kind: write
        what: '`.pecot/state/.pecot-active` と `.pecot/state/.pecot-quick-mode` を書き、`.pecot/work/<N>/` を作ります。`.pecot/state/.pecot-base` と、フラグ `issue-pending`・`issue-create-slash-pending` を消します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: false
    examples:
      - run: "pecot issue quick -r example-org/my-repo -m \"Add an API endpoint\""
        note: 'task と、そのブランチと、作業対象を作ります。'
      - run: "pecot issue quick -r example-org/my-repo -m \"Update the docs\" --no-branch"
        note: 'ブランチなしで task を作ります。'
    default_notes:
      type: '省くと、`task` です。ボードに設定する status・priority・size は、type で決まります。'
