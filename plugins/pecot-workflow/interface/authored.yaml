      repo: '`-m` と `--prepare` では、type が `epic` のときだけ省けます。省くと、Epic をアクティブなプロジェクトの `aggregation_repo` に作ります。`aggregation_repo` が未設定なら、省けません。'
      parent_epic: '整数は、`aggregation_repo` の Issue として解決します。`aggregation_repo` が未設定なら、新しい Issue のリポジトリで解決します。`owner/repo/N` の形は、そのまま使います。'
