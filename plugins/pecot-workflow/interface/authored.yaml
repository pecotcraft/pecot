      - id: PW-BRANCH-DELETE-20
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-BRANCH-DELETE-21
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-ISSUE-BLOCK:
    help:
      details:
        - Adds a blocked-by (prerequisite) to an Issue, or changes the wait kind and reason of an existing one.
        - issue_ref is the waiting Issue and --by is the Issue to wait for. --by may be in another repository.
        - "--wait is stack (default) or merge. With --wait merge, --reason is required, and the Waits for merge section of the body of the waiting Issue gets a line for the prerequisite and the reason. With stack, the line is removed from the section."
        - --reason with --wait stack is a usage error.
        - Only the line of the prerequisite in the Waits for merge section is written. The rest of the section and the other sections of the body are not changed.
        - The command reads the blocked-by of the waiting Issue first. A prerequisite that is already there with the same kind and reason is left as it is. One with another kind or reason only has the section rewritten. A request to add or remove is never sent for a pair that is already in that state.
        - A cycle is searched only when a new blocked-by is added. The search follows the blocked-by of --by step by step, up to 200 Issues. When it cannot be sure, the command stops, because GitHub accepts cycles of three or more Issues.
        - The writes are made in the order blocked-by, body, then board. When the body write fails, the blocked-by stays and running the same command again fixes the body.
        - After the writes, the readiness of the waiting Issue is read again. When the blocked-by and the section read back differ from what was written, it is read once more. When they still differ, the column and the Status label are not moved.
        - The column and the Status label are moved by the readiness that was read back, in the same way as the board repair of the readiness feature. An Issue that has a branch or a PR is not moved and gets a warning about the difference.
        - With --dry-run, writes dry-run lines instead of the result lines. The reads, the cycle search and the checks are still made, and nothing is written.
        - Needs a GitHub Enterprise Server of version 3.19 or later, which has issue dependencies.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
        - --project names the project config to use. Without it, the config that includes the repository of the Issue is used; when several do, the active one among them.
      examples:
        - run: pecot issue block example-org/my-repo/12 --by example-org/my-repo/11 --wait merge --reason "The check script is on main."
          note: Make Issue 12 wait for the merge of Issue 11.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'Issue に blocked-by（前提）を付けるか、付いている前提の待ち方と理由を変えます。'
    arguments:
      by: '待つ相手の Issue です。`owner/repo/N` の形で渡します。別のリポジトリの Issue も指せます。'
      dry_run: '何も書き込まずに、書く予定だけを返すかどうかです。'
      issue_ref: '待つ側の Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
      reason: '前提のマージを待つ理由です。`wait` が `merge` のときは必須で、`stack` のときは渡せません。'
      wait: '待ち方です。`stack`（相手のブランチの上に積みます。省くとこちら）か `merge`（相手がマージされるまで待ちます）を渡します。'
    constraints: []
    details:
      - 'Issue に blocked-by（前提）を付けるか、付いている前提の待ち方と理由を変えます。'
      - '`issue_ref` は待つ側の Issue で、`by` は待つ相手の Issue です。`by` は別のリポジトリの Issue でもかまいません。'
      - '`wait` は `stack`（省くとこちら）か `merge` です。`merge` のときは `reason` が必須で、待つ側の Issue の本文の `Waits for merge` の節に、前提と理由の行を足します。`stack` のときは、その行を節から外します。'
      - '`wait` が `stack` のときに `reason` を渡すと、使い方の誤りです。'
      - '書き込むのは、`Waits for merge` の節にある前提の行だけです。節のほかの部分と、本文のほかの節は変えません。'
      - 'まず、待つ側の Issue の blocked-by を読みます。既に付いていて種類と理由が同じ前提は、そのままにします。種類か理由が違う前提は、節だけを書き換えます。既にその状態の組には、追加と削除は求めません。何も変えないときは、成功を返します。'
      - '輪の探索は、新しく blocked-by を足すときだけ行います。`by` の blocked-by を 1 段ずつたどり、200 件の Issue まで調べます。確かめきれないときは、失敗を返します。GitHub は 3 件以上の Issue でできる輪を受け付けてしまうためです。'
      - '書き込みは、blocked-by、本文、ボードの順に行います。本文の書き込みに失敗しても、blocked-by は残ります。同じ引数で呼び直せば、本文が直ります。'
      - '書き込みの後で、待つ側の Issue の判定を読み直します。読み直した blocked-by と節が書いた内容と違うときは、もう一度読みます。それでも違うときは、列と Status の札を動かしません。'
      - '列と Status の札は、読み直した判定で動かします。やり方は、判定の機能のボードの修復と同じです。ブランチか PR のある Issue は動かさず、判定との食い違いを `warnings` で知らせます。'
      - '`dry_run` を付けると、書く予定を結果に入れます。読み取り、輪の探索、確認は行い、何も書き込みません。'
      - 'Issue の依存関係を持つ GitHub Enterprise Server の 3.19 以上が要ります。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、Issue のリポジトリを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        issue: '待たせる側の Issue です。`owner/repo/N` の形です。'
        by: '前提の Issue です。`owner/repo/N` の形です。'
        wait: '実行後の blocked-by の待ち方です。`stack`（前提のブランチに積む）か `merge`（前提のマージを待つ）です。'
        change: 'blocked-by がどうなったかです。`added`（新しく足した）・`updated`（待ち方か理由を変えた）・`unchanged`（変更なし）のどれかです。'
        moves: '待つ側の Issue の列か Status を書いたときに、その 1 件を入れる配列です。要素は `board_sync` の `moves` と同じです。書かなかったときは空です。判定を確かめられなかったときと、ボードに書けなかったときも空で、理由は `warnings` に入ります。`dry_run` のときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、結果の行を出します。blocked-by には `added`・`unchanged`・`updated` のどれかを出し、列か札を変えたときは続けて `moved` と `set` を出します。`updated` の行の末尾には、`(wait: merge)` か `(wait: stack)` が付きます。`warning` の行は、次のときに出します。Issue に着手の跡があるとき。判定を出せないか、確かめられないとき。ボードに Blocked の選択肢が無いとき。ボードに書けなかったとき。Blocked が無いときは、`pecot project init` の実行を案内する `hint` の行が続きます。失敗ごとに `error` の行を出します。輪のときは、たどった Issue を `#A -> #B -> #A` の形で出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: repo-not-in-project
        code: 1
        when: '待つ側の Issue のリポジトリがプロジェクトにありません。'
      - kind: dependency-rejected
        code: 1
        when: 'Issue が既に 50 件の blocked-by を持っています。GitHub Enterprise Server が Issue の依存関係に対応していないときも含みます。'
      - kind: dependency-unreadable
        code: 1
        when: '輪を除けると確かめられませんでした。blocked-by を読めないときも含みます。'
      - kind: dependency-rejected
        code: 2
        when: '`by` が輪（Issue 自身を含みます）になります。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っています。`wait` が `merge` で `reason` が無いとき、`wait` が `stack` で `reason` を渡したとき、ほかの引数の誤りも含みます。'
      - kind: content-invalid
        code: 3
        when: '本文の `Waits for merge` の節を読めません。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '前提を付けた後で本文の書き込みに失敗したときは、blocked-by は残り、失敗を返します。ボードに書けないときは、blocked-by と本文は残り、`warnings` に入れるだけです。選択肢の ID が古くて書けないときは、ID を読み直す `project_activate` の案内を添えます。ボードに関する警告だけのときは、成功を返します。'
    effects:
      - target: github
        kind: write
        what: 'blocked-by を付け、待つ側の Issue の本文を書き換え、そのボードの項目の列と Status の札を設定します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、待つ側の Issue の blocked-by と本文、輪の探索、読み直した判定、ボードの項目を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
