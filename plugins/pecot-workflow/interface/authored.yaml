      - id: PW-BRANCH-DELETE-04
        pattern: event
        statement: 'ブランチを削除すると、結果の `deleted` を `true` にします'
      - id: PW-BRANCH-DELETE-06
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、`deleted` を `false`、`dryRun` を `true` にして成功を返します'
      - id: PW-BRANCH-DELETE-10
        pattern: unwanted
