        projectNumber: 'アクティブなプロジェクトの番号です。'
        change: '設定がどうなったかです。`create`（リポジトリを足した）か `update`（項目を変えた）です。'
        configPath: 'プロジェクトの設定ファイルのパスです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、プロジェクトへのつなぎの結果の行（`added`、既につながっていれば `unchanged`）を出します。設定ファイルの結果の行（`added` か `updated`）も出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        code: 1
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 1
