    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` が未設定で、`--base` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: 'リポジトリがプロジェクトにありません。'
      - kind: git-unresolved
        code: 1
        when: '積む先のブランチが無くなりました。git の外で `--repo` を省いたときも含みます。`--repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: repo-mismatch
        code: 1
        when: '`--repo` が今の git remote と違います。'
      - kind: dependency-unreadable
        code: 1
        when: 'Issue の前提を読めないか、着手の判定ができません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照がフル形式ではありません。`stackable` の Issue で、`--base` が選ばれた分岐元と違うときと、ほかのコマンドラインの誤りも含みます。'
      - kind: repo-mismatch
        code: 2
        when: '作業ディレクトリのリポジトリが Issue のリポジトリと違います。通す入力はありません。'
      - kind: not-ready
        code: 2
        when: 'Issue が前提で blocked です。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'ブランチを作った後で Status の設定か作業対象の記録に失敗したときは、ブランチは Issue に紐づいたまま残り、終了コード 0 で終わります。作業対象を記録できなかったときは、`.pecot-base` を書きません。前の Issue の記録も残りません。`.pecot-base` を消せないか書けないときは、`warning` の行で知らせます。Issue が blocked のとき、判定を読めないとき、積む先のブランチが無くなったときは、何も作らず、何も書きません。'
    effects:
      - target: github
        kind: read
        what: '次のものを読みます。プロジェクトにつながっているリポジトリ。Issue の前提と、そのブランチの PR。Issue の node ID と題。分岐元のブランチの先頭のコミット。'
      - target: github
        kind: write
        what: '紐づいたブランチを作り、ボード上の Issue の Status を `active` にします。`--dry-run` のときは書きません。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: '`.pecot/state/.pecot-session-title`・`.pecot/state/.pecot-base` を書きます。`.pecot/work/<N>/` も作ります。`.pecot/state/.pecot-active` は書きません。`--dry-run` のときは書きません。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
      - '作業ディレクトリは、Issue のリポジトリのチェックアウトでなければなりません。'
    idempotent: false
    examples:
      - run: pecot session start example-org/my-repo/123 feat/my-change
        note: '開発ブランチから、ブランチ `feat/my-change/123` を作ります。'
      - run: pecot session start example-org/my-repo/123 fix/my-bug --base main
        note: '`main` から、ブランチ `fix/my-bug/123` を作ります。'
      - run: pecot session start example-org/my-repo/123 feat/my-change --dry-run
        note: 'ブランチと Status は作らず、する予定を出します。'
    default_notes:
      base: '省くと、着手の判定が `stackable` のときは、積む先の PR のブランチです。それ以外では設定ファイルにあるリポジトリの `develop_branch` で、それも無ければ終了コード 1 で止まります。'
    behaviors:
      - id: PW-SESSION-START-01
        pattern: event
        statement: 'Issue の参照とブランチ名を渡して打つと、Issue に紐づいたブランチを `ブランチ名/Issue 番号` の名前で作ります'
      - id: PW-SESSION-START-02
        pattern: event
        statement: '`--base` を付けて打つと、そのブランチの先頭からブランチを作ります'
      - id: PW-SESSION-START-03
        pattern: event
        statement: '`--base` を省いて打つと、設定ファイルの `develop_branch` の先頭からブランチを作ります'
      - id: PW-SESSION-START-06
        pattern: event
        statement: '`--checkout` か `--no-checkout` を付けて打つと、付けないときと同じ結果になります'
      - id: PW-SESSION-START-07
        pattern: event
        statement: 'ブランチを作ると、ボード上の Issue の Status を `active` にします'
      - id: PW-SESSION-START-08
        pattern: event
        statement: 'ブランチを作ると、その Issue のセッション名を `.pecot-session-title` に記録して `.pecot/work/<N>/` を作り、`.pecot-active` は書きません'
      - id: PW-SESSION-START-09
        pattern: event
        statement: 'ブランチを作ると、`created` の行を標準エラーに出します'
      - id: PW-SESSION-START-10
        pattern: event
        statement: 'Status を `active` にすると、`set` の行を標準エラーに出します'
      - id: PW-SESSION-START-11
        pattern: event
        statement: '作業ディレクトリを作ると、すでにあっても、作業ディレクトリの `created` の行を標準エラーに出します'
      - id: PW-SESSION-START-16
        pattern: unwanted
        statement: 'もしボード上の Issue の Status を `active` にできなかったなら、`warning` の行を標準エラーに出します。選択肢の ID が古くて書けないときは、ID を読み直す `project activate` の案内を添えます'
      - id: PW-SESSION-START-17
        pattern: unwanted
        statement: 'もし作業対象を記録できなかったなら、`warning` の行を標準エラーに出します'
      - id: PW-SESSION-START-18
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-SESSION-START-19
        pattern: unwanted
        statement: 'もし Issue の参照がフル形式でないなら、終了コード 2 で終わります'
      - id: PW-SESSION-START-20
        pattern: unwanted
        statement: 'もし作業ディレクトリの git remote のリポジトリが Issue のリポジトリと違うなら、終了コード 2 で終わります'
      - id: PW-SESSION-START-22
        pattern: unwanted
        statement: 'もし `--base` を省いて `develop_branch` も設定していないなら、終了コード 1 で終わります'
      - id: PW-SESSION-START-23
        pattern: unwanted
        statement: 'もし Issue のリポジトリがプロジェクトに登録されていないなら、終了コード 1 で終わります'
      - id: PW-SESSION-START-24
        pattern: unwanted
        statement: 'もしブランチの作成までの GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-SESSION-START-25
        pattern: unwanted
        statement: 'もし `--repo` が今の git remote のリポジトリと食い違うなら、終了コード 1 で終わります'
      - id: PW-SESSION-START-26
        pattern: unwanted
        statement: 'もし `--repo` を省いて git の外で打ったなら、`the repository is ambiguous` の行を標準エラーに出します'
      - id: PW-SESSION-START-27
        pattern: unwanted
        statement: 'もし `--repo` を省いて git の外で打ったなら、終了コード 1 で終わります'
      - id: PW-SESSION-START-28
        pattern: state
        statement: '着手の判定が `stackable` の間、積む先の PR のブランチの先頭からブランチを作ります'
      - id: PW-SESSION-START-29
        pattern: state
        statement: '着手の判定が `stackable` の間、`created` の行に積んだ先の Issue を付けます'
      - id: PW-SESSION-START-30
        pattern: event
        statement: 'ブランチを作ると、選んだ base を `.pecot-base` に記録します'
      - id: PW-SESSION-START-31
        pattern: unwanted
        statement: 'もし着手の判定が `blocked` なら、ブランチを作らず、理由と直し方の行を標準エラーに出します'
      - id: PW-SESSION-START-32
        pattern: unwanted
        statement: 'もし着手の判定が `blocked` なら、終了コード 2 で終わります'
      - id: PW-SESSION-START-33
        pattern: unwanted
        statement: 'もし `stackable` の判定で、`--base` の値と積む先が違うなら、ブランチを作らず終了コード 2 で終わります'
      - id: PW-SESSION-START-34
        pattern: unwanted
        statement: 'もし前提を読めないか判定できないなら、ブランチを作らず終了コード 1 で終わります'
      - id: PW-SESSION-START-35
        pattern: unwanted
        statement: 'もし積む先のブランチが判定の後に無くなったなら、積む先が見つからない旨の `error` の行を出して終了コード 1 で終わります'
      - id: PW-SESSION-START-36
        pattern: event
        statement: '`--dry-run` を付けて打つと、ブランチを作らず Status と作業対象を書かず、する操作を `dry-run` の行で標準エラーに出し、終了コード 0 で終わります'
      - id: PW-SESSION-START-37
        pattern: unwanted
        statement: 'もし廃止した入力（`allow_cross_repo`・`force_overwrite_active`）を渡したなら、未知の入力として終了コード 2 で終わり、ブランチを作りません'
      - id: PW-SESSION-START-38
        pattern: event
        statement: '`--repo` を渡して remote の URL から `owner/repo` を読めないと、`warning` の行を出して続けます（MCP は `warnings` に入れます）'
      - id: PW-SESSION-START-39
        pattern: unwanted
        statement: 'もし `--repo` を省いて remote の URL から `owner/repo` を読めないなら、`the repository is ambiguous` と理由を出し、終了コード 1 で終わります'
      - id: PW-SESSION-START-40
        pattern: event
        statement: '`--repo` を渡して remote の URL から `owner/repo` を読めないと、Issue のリポジトリと作業ディレクトリの remote を比べずにブランチを作ります'
  PW-TRACKER-SYNC:
    help:
      details:
        - 'The source chooses what the Tracker lists: dependabot lists the Dependabot PRs waiting for a human decision, and security lists the open security alerts.'
        - With dependabot, finds the open Tracker issue labeled dependabot-pr whose body has the Tracker marker.
        - With dependabot, rewrites the table between list-begin and list-end in the body of the Tracker.
        - With dependabot, lists the open Dependabot PRs that wait for a human decision.
        - With dependabot, a PR with no waiting reason is not listed.
        - 'With dependabot, a PR is eligible for auto-merge when its first commit is authored by dependabot[bot] with a valid signature and the largest known update type is minor or patch.'
        - With dependabot, a dependency whose update type is unknown is ignored while another dependency has a known type, and the PR counts as unknown only when no dependency has a known type.
        - With dependabot, a PR whose update type is major or unknown is listed.
        - With dependabot, an eligible PR is listed when its checks failed.
        - With dependabot, an eligible PR with auto-merge on is listed when its checks have not finished 24 hours after the last push.
        - With dependabot, an eligible PR is listed when it conflicts for more than 30 minutes, counted from the later of the last push and the latest commit of the base branch.
        - With dependabot, an eligible PR is listed when it was dequeued after the last push and has neither auto-merge nor a merge queue entry.
        - With dependabot, an eligible PR with neither auto-merge nor a merge queue entry is listed 30 minutes after the last push.
        - With dependabot, the last push is the last force push, or the creation of the PR when there is none.
        - With dependabot, each table row has the PR title, a link to the PR and the state of the checks (passed, failed, pending or none).
        - With dependabot, the waiting reasons appear only in the result lines.
        - With dependabot, when no Tracker is open and there are PRs to list, creates a Tracker, adds it to the project board, and sets Status to Backlog and Priority to medium.
        - With dependabot, when no Tracker is open and no PR is listed, creates nothing.
        - With dependabot, when the list is empty and a Tracker is open, sets the list to none and closes the Tracker as completed.
        - With dependabot, on an open Tracker that is not closed, sets Status and Priority only while they are empty, so a change made by a person stays.
        - With security, finds the open Tracker issue labeled security-alert whose body has the Tracker marker.
        - With security, rewrites the list between list-begin and list-end in the body of the Tracker with the open alerts.
        - With security, reads the open Dependabot alerts, the open code scanning alerts of the default branch and the open secret scanning alerts.
        - With security, each kind has its own heading and table in the Tracker body.
        - With security, Priority comes from the alert severity.
        - With security, a secret scanning alert is always high.
        - With security, the Priority of a new Tracker is the highest Priority among its rows.
        - With security, the rows of code scanning and secret scanning alerts show masked as the title.
        - With security, a Dependabot row shows the advisory summary, and Dependabot alerts of one advisory share a row.
        - With security, a kind whose feature is disabled shows disabled under its heading and adds no rows.
        - With security, a repository without a code scanning analysis counts as having no code scanning alerts.
        - With security, a kind whose list cannot be fetched keeps its previous rows and shows unavailable when it had none.
        - With security, when a kind cannot be fetched, the command ends with exit status 1 after the other kinds were applied.
        - With security, a 403 for Dependabot alerts or a 404 for secret scanning that cannot be confirmed as disabled counts as a failure to fetch.
        - With security, when no Tracker is open and there are rows to list, creates a Tracker, adds it to the project board, and sets Status to Backlog and Priority to the highest row.
        - With security, when no Tracker is open and there is no row to list, creates nothing.
        - With security, never closes the Tracker.
        - With security, when every alert is gone, each kind shows none, and a person closes the Tracker and moves it to Archived.
        - With security, on an existing Tracker, sets Status and Priority only while they are empty, so a change made by a person stays.
        - Text in the Tracker body outside the list markers stays as it is.
        - A field that the active project does not define is not set.
        - When several Trackers are open, uses the lowest number and leaves the others open.
        - A closed Tracker is not reused.
      examples:
        - run: pecot tracker sync dependabot --dry-run
          note: Show the planned Tracker changes without writing to GitHub.
        - run: pecot tracker sync dependabot
          note: Rewrite the Tracker list, creating or closing the Tracker when needed.
        - run: pecot tracker sync security --dry-run
          note: Show the planned Tracker changes without writing to GitHub.
        - run: pecot tracker sync security
          note: Rewrite the Tracker list, creating the Tracker when needed.
      default_notes: {}
    summary: '`source` に選んだものの一覧を、open の Tracker に書き直します。`dependabot` は人の判断を待つ Dependabot の PR、`security` は open のセキュリティ alert です。'
    arguments:
      source: 'Tracker に載せるものです。`dependabot` は人の判断を待つ Dependabot の PR、`security` は open のセキュリティ alert です。どちらかを必ず渡します。'
      dry_run: '何も変えずに、Tracker を変える予定だけを出すかどうかです。'
    constraints: []
    details:
      - '`source` で、Tracker に載せるものを選びます。`dependabot` は人の判断を待つ Dependabot の PR、`security` は open のセキュリティ alert です。'
      - '`dependabot` では、ラベルが `dependabot-pr` で、本文に Tracker の印がある open の Tracker の Issue を探します。'
      - '`dependabot` では、Tracker の本文の `list-begin` と `list-end` の間にある表を書き直します。'
      - '`dependabot` では、表には、人の判断を待つ open の Dependabot の PR を載せます。'
      - '`dependabot` では、判断を待つ理由の無い PR は載せません。'
      - '`dependabot` では、PR が自動マージの対象になるのは、次の 2 つがそろうときです。最初のコミットの作者が `dependabot[bot]` で、署名が有効なこと。分かっている update type のうち最大のものが minor か patch であること。'
      - '`dependabot` では、update type が不明の依存は、ほかの依存の type が分かっている間は無視します。PR を不明として数えるのは、どの依存の type も分からないときだけです。'
      - '`dependabot` では、update type が major か不明の PR は載せます。'
      - '`dependabot` では、対象の PR は、検証が失敗していると載せます。'
      - '`dependabot` では、自動マージを入れた対象の PR は、最後の push から 24 時間たっても検証が終わらないと載せます。'
      - '`dependabot` では、対象の PR は、30 分を超えて競合していると載せます。最後の push と base ブランチの最新のコミットのうち、遅い方から数えます。'
      - '`dependabot` では、対象の PR は、最後の push の後で merge queue から外され、自動マージも merge queue の登録も無いと載せます。'
      - '`dependabot` では、自動マージも merge queue の登録も無い対象の PR は、最後の push から 30 分たつと載せます。'
      - '`dependabot` では、最後の push は、最後の force push です。force push が無ければ、PR の作成です。'
      - '`dependabot` では、表の各行は、PR の題、PR へのリンク、検証の状態（passed・failed・pending・none）です。'
      - '`dependabot` では、判断を待つ理由は、結果の行だけに出ます。'
      - '`dependabot` では、open の Tracker が無く、載せる PR があるときは、Tracker を作ってプロジェクトのボードに足します。Status を Backlog、Priority を medium にします。'
      - '`dependabot` では、open の Tracker が無く、載せる PR も無いときは、何も作りません。'
      - '`dependabot` では、一覧が空で open の Tracker があるときは、一覧を none にし、Tracker を completed として閉じます。'
      - '`dependabot` では、閉じない open の Tracker には、Status と Priority が空の間だけ値を入れます。人が変えた値は残ります。'
      - '`security` では、ラベルが `security-alert` で、本文に Tracker の印がある open の Tracker の Issue を探します。'
      - '`security` では、Tracker の本文の `list-begin` と `list-end` の間にある一覧を、open の alert で書き直します。'
      - '`security` では、open の Dependabot alert と secret scanning alert を読みます。code scanning alert は、既定ブランチの open のものを読みます。'
      - '`security` では、Tracker の本文の見出しと表を、alert の種類ごとに分けます。'
      - '`security` では、Priority は、alert の severity から決めます。'
      - '`security` では、secret scanning alert は、必ず high です。'
      - '`security` では、新しい Tracker の Priority は、行の Priority のうち最も高いものです。'
      - '`security` では、code scanning alert と secret scanning alert の行では、題を `masked` と出します。'
      - '`security` では、Dependabot の行には advisory の要約を出します。同じ advisory の Dependabot alert は、1 つの行にまとめます。'
      - '`security` では、機能が無効の種類は、見出しの下に `disabled` と出し、行を足しません。'
      - '`security` では、code scanning の解析が無いリポジトリは、code scanning alert が無いものとして数えます。'
      - '`security` では、一覧を取れない種類は、前の行を残します。前の行が無かったときは、`unavailable` と出します。'
      - '`security` では、取れない種類があるときは、ほかの種類を反映した後で、終了コード 1 で終わります。'
      - '`security` では、Dependabot alert の 403 と secret scanning の 404 を、無効だと確かめられなければ、取れなかったものとして数えます。'
      - '`security` では、open の Tracker が無く、載せる行があるときは、Tracker を作ってプロジェクトのボードに足します。Status を Backlog、Priority を最も高い行の値にします。'
      - '`security` では、open の Tracker が無く、載せる行も無いときは、何も作りません。'
      - '`security` では、Tracker を閉じることはありません。'
      - '`security` では、alert がすべて無くなると、どの種類も `none` と出します。Tracker を閉じて Archived へ動かすのは、人です。'
      - '`security` では、既にある Tracker には、Status と Priority が空の間だけ値を入れます。人が変えた値は残ります。'
      - 'Tracker の本文のうち、一覧の印の外にある文はそのまま残します。'
      - 'アクティブなプロジェクトが定義していないフィールドは設定しません。'
      - 'open の Tracker が複数あるときは、番号が最小のものを使い、ほかは open のまま残します。'
      - '閉じた Tracker は使い回しません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        source: '同期した種類です。`dependabot` か `security` です。'
        tracker: '使ったか作った Tracker の番号です。Tracker が無いときと、作る前の `dry_run` のときは入りません。'
        created: 'Tracker を新しく作ったかどうかです。`dry_run` のときは、作る予定かどうかです。'
        added: 'Tracker の一覧に足した行の配列です。`dry_run` のときは、足す予定の行です。要素は `kind` と `number` を持ちます。`kind` は `pull-request`・`dependabot`・`code-scanning`・`secret-scanning` のどれかです。'
        removed: 'Tracker の一覧から外した行の配列です。`dry_run` のときは、外す予定の行です。要素の形は `added` と同じです。'
        closed: '一覧が空になって Tracker を閉じたかどうかです。`dry_run` のときは、閉じる予定かどうかです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も変えていません。'
    diagnostics: '`dependabot` では、`count` の行で、open の Dependabot の PR の数、判断を待つ PR の数、判断を待つ PR のうち検証の結果が無いものの数を出します。変更ごとに結果の行（`created`・`added`・`removed`・`updated`・`unchanged`・`closed`・`skipped`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。open の Tracker が複数あるときは、`warning` の行を出します。失敗ごとに `error` の行を出します。`security` では、変更ごとに結果の行（`created`・`added`・`removed`・`updated`・`unchanged`・`skipped`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。open の Tracker が複数あるときは、`warning` の行を出します。失敗ごとに `error` の行を出します。一覧を取れなかった種類ごとの行も含みます。'
