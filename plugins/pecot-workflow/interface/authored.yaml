  PW-WORKTREE-INIT:
    constraints: []
    details:
      - Writes the default templates into the main worktree of the repository in -D, as .pecot/config/worktree-config.json and .pecot/config/.worktreeignore.
      - worktree-config.json has the links CLAUDE.local.md, .env and .claude/settings.local.json, which point to the aggregation_repo of the active project, or to this repository when there is none or the active project cannot be read.
      - worktree-config.json also has the links of hooks-config.json, projects/.active and .pecot/work, which point to this repository.
      - .worktreeignore lists the patterns that worktree add does not copy, in the gitignore syntax.
      - Stops without writing when either file already exists.
      - Needs a devcontainer.
    stdin: none
    output:
      format: none
    diagnostics: A created line for each of the two files on stderr. An error line for a failure. Outside a devcontainer, a traceback instead of an error line.
    environment:
      - name: REMOTE_CONTAINERS
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: CODESPACES
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: DEVCONTAINER
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
    exit_status:
      - code: 0
        when: Both files were created.
      - code: 1
        when: --repo differs from the current git remote, --repo is omitted outside a git repository, the main worktree cannot be found, one of the two files already exists, a file cannot be written (a traceback is printed), or the command runs outside a devcontainer (a traceback is printed).
      - code: 2
        when: -D is missing or is not an existing directory, or another command line error occurs.
    on_error: When .worktreeignore cannot be written after worktree-config.json was written, worktree-config.json stays. Nothing is written when a file already exists.
    effects:
      - target: git
        kind: read
        what: Reads the worktree list to find the main worktree.
      - target: file
        kind: read
        what: Reads the active config file.
      - target: file
        kind: write
        what: Creates worktree-config.json and .worktreeignore, and the .pecot/config directory when it is missing.
    prerequisites:
      - The command runs in a devcontainer.
    idempotent: false
    examples:
      - run: pecot worktree init -D .
        note: Write the worktree config files of the repository in the current directory.
    default_notes: {}
    behaviors:
      - id: PW-WORKTREE-INIT-01
        pattern: event
        statement: 設定ファイルの無いリポジトリを -D に渡して打つと、メインの worktree に worktree-config.json を書く
      - id: PW-WORKTREE-INIT-02
        pattern: event
        statement: 設定ファイルの無いリポジトリを -D に渡して打つと、メインの worktree に .worktreeignore を書く
      - id: PW-WORKTREE-INIT-03
        pattern: event
        statement: アクティブなプロジェクトに aggregation_repo があると、共有する 3 つのリンクをそのリポジトリに向ける
      - id: PW-WORKTREE-INIT-04
        pattern: event
        statement: aggregation_repo が無いか、アクティブなプロジェクトを読めないと、共有する 3 つのリンクをこのリポジトリに向ける
      - id: PW-WORKTREE-INIT-05
        pattern: event
        statement: ファイルを書くと、ファイルごとに created の行を標準エラーに出す
      - id: PW-WORKTREE-INIT-06
        pattern: unwanted
        statement: もし worktree-config.json か .worktreeignore が既にあるなら、何も書かない
      - id: PW-WORKTREE-INIT-07
        pattern: unwanted
        statement: もし worktree-config.json か .worktreeignore が既にあるなら、既存のファイルのパスを error の行に出す
      - id: PW-WORKTREE-INIT-08
        pattern: unwanted
        statement: もし worktree-config.json か .worktreeignore が既にあるなら、終了コード 1 で終わる
      - id: PW-WORKTREE-INIT-09
        pattern: unwanted
        statement: もしメインの worktree を見つけられないなら、終了コード 1 で終わる
      - id: PW-WORKTREE-INIT-10
        pattern: unwanted
        statement: もし --repo が今の git の remote と食い違うなら、何も書かない
      - id: PW-WORKTREE-INIT-11
        pattern: unwanted
        statement: もし --repo が今の git の remote と食い違うなら、終了コード 1 で終わる
      - id: PW-WORKTREE-INIT-12
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、the repository is ambiguous の行を標準エラーに出す
      - id: PW-WORKTREE-INIT-13
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、終了コード 1 で終わる
      - id: PW-WORKTREE-INIT-14
