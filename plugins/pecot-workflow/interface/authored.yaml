  PW-PR-PREFLIGHT:
    constraints: []
    details:
      - Prints the information to check before creating a PR for the repository given by --directory.
      - "Prints 11 sections in a fixed order: Git Remote, Current Branch, Push Status, Base Branch, Git Status, .gitignore, Git Exclude, Commits, Diff Summary, Worktree Info and Stash List."
      - The base branch is origin/ followed by the develop_branch of the active project.
      - Prints every section even when there are warnings.
      - Counts a warning for a branch that is not pushed or has diverged, for modified or untracked files, and for stash entries.
      - Exits with status 2 when there is at least one warning.
      - Reads the repository and the config and changes nothing.
    stdin: none
    output:
      format: text
      description: 11 sections, each a === <title> === line followed by its content, separated by blank lines.
    diagnostics: "A count line for the warnings, then one warning line on stderr for each, in the form <label>: <message> (fix: <hint>)."
    environment: []
    exit_status:
      - code: 0
        when: The sections were printed and there is no warning.
      - code: 1
        when: The directory is not a git repository, there is no origin remote, the current branch or the repository cannot be determined, there is no active project, develop_branch is not set, or origin/<develop_branch> does not exist.
      - code: 2
        when: There is at least one warning, --directory is missing, or another command line error occurs.
    on_error: default
    effects:
      - target: git
        kind: read
        what: Reads the remote, the branch, the push state, the status, the log and diff against the base, the worktree list and the stash list.
      - target: file
        kind: read
        what: Reads the active config file, .gitignore and .git/info/exclude.
    prerequisites:
      - An active project exists (pecot project activate).
      - origin/<develop_branch> exists in the local repository.
    idempotent: true
    examples:
      - run: pecot pr preflight -D .
        note: Check the current repository before creating a PR.
    default_notes: {}
    behaviors:
      - id: PW-PR-PREFLIGHT-01
        pattern: event
        statement: --directory でリポジトリを指すと、11 の節を決まった順で標準出力に出す
      - id: PW-PR-PREFLIGHT-02
        pattern: event
        statement: warning があるときに打つと、11 の節を全部出す
      - id: PW-PR-PREFLIGHT-03
        pattern: event
        statement: 打つと、Base Branch の節に origin/<develop_branch> を出す
      - id: PW-PR-PREFLIGHT-04
        pattern: event
        statement: "打つと、count: preflight warnings の行を標準エラーに出す"
      - id: PW-PR-PREFLIGHT-05
        pattern: event
        statement: warning があるときに打つと、warning ごとに warning の行を標準エラーに出す
      - id: PW-PR-PREFLIGHT-06
        pattern: ubiquitous
        statement: 常に、リポジトリとファイルを書き換えない
      - id: PW-PR-PREFLIGHT-07
        pattern: unwanted
        statement: もしブランチが push されていないか remote とずれているなら、Push Status の warning を数える
      - id: PW-PR-PREFLIGHT-08
        pattern: unwanted
        statement: もし未コミットの変更があるなら、Git Status の warning を数える
      - id: PW-PR-PREFLIGHT-09
        pattern: unwanted
        statement: もし stash に項目があるなら、Stash List の warning を数える
      - id: PW-PR-PREFLIGHT-10
        pattern: unwanted
        statement: もし warning が 1 件以上あるなら、終了コード 2 で終わる
      - id: PW-PR-PREFLIGHT-11
        pattern: unwanted
        statement: もし git のリポジトリでないなら、終了コード 1 で終わる
      - id: PW-PR-PREFLIGHT-12
        pattern: unwanted
        statement: もし origin の remote が無いなら、終了コード 1 で終わる
      - id: PW-PR-PREFLIGHT-13
        pattern: unwanted
        statement: もし現在のブランチか remote のリポジトリを決められないなら、終了コード 1 で終わる
      - id: PW-PR-PREFLIGHT-14
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-PR-PREFLIGHT-15
        pattern: unwanted
        statement: もし develop_branch が設定に無いなら、終了コード 1 で終わる
      - id: PW-PR-PREFLIGHT-16
        pattern: unwanted
        statement: もし origin/<develop_branch> が無いなら、終了コード 1 で終わる
      - id: PW-PR-PREFLIGHT-17
        pattern: unwanted
