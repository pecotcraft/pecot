      - id: PW-ISSUE-QUICK-21
        pattern: unwanted
        statement: もし親 Epic へのつなぎに失敗したなら、作った Issue の URL を標準出力に出す
      - id: PW-ISSUE-QUICK-22
        pattern: unwanted
        statement: もし親 Epic へのつなぎに失敗したなら、終了コード 1 で終わる
      - id: PW-ISSUE-QUICK-23
        pattern: unwanted
        statement: もし develop_branch が設定に無いなら、終了コード 1 で終わる
      - id: PW-ISSUE-QUICK-24
        pattern: unwanted
