  PW-RELEASE-CREATE:
    help:
      details:
        - Creates a GitHub release and its tag through the GitHub API, so no git tag or git push is needed.
        - "The release notes are the section of the given version in the CHANGELOG, from the line after its ## [X.Y.Z] heading to the next ## heading."
        - The CHANGELOG is the changelog_file of the repository in the config file.
        - Without changelog_file, the CHANGELOG is CHANGELOG.md and then AIST-CHANGELOG.md at the git root, and with --package, the changelog of that package.
        - When the tag does not exist yet, the tag is created at the head of the release_branch of the repository in the config file.
        - The tag is v<version> and the release name is the same.
        - With --package, the tag is <package>-v<version> and the release name is <package> v<version>.
        - The version must be in X.Y.Z form without a leading v.
        - A repository with packages configured needs --package.
        - A repository without packages does not accept --package.
        - The repository is taken from the global pecot --repo, and without it from the origin remote, or from the first remote when there is no origin.
        - The command needs the working directory to be inside a git repository.
        - A mismatch between --repo and the current git remote is a warning, and --repo is used.
        - "When the owner/repo cannot be read from the URL of the remote, --repo is not compared with it: with --repo the command prints a warning and uses --repo, and without --repo it stops."
        - With --dry-run, the release is not created and no GitHub client is made.
      examples:
        - run: pecot release create 0.6.1
          note: Create the release v0.6.1 from the CHANGELOG.
        - run: pecot release create 0.6.1 --dry-run
          note: Print the plan and the release notes without creating anything.
        - run: pecot release create 0.6.1 --package pecot-workflow
          note: Create the release pecot-workflow-v0.6.1 in a monorepo.
      default_notes:
        package: None; required when the repository has packages configured in the config file.
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: GitHub のリリースとタグを作ります。リリースノートは CHANGELOG から取ります。
    arguments:
      dry_run: '何も変えずに、行う予定だけを返すかどうかです。'
      package: 'monorepo のパッケージの名前です。'
      version: 'リリースする版です。`0.6.1` のように渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    constraints: []
    details:
      - 'GitHub API でリリースとタグを作ります。`git tag` と `git push` のどちらもしません。'
      - 'リリースノートは、CHANGELOG にある渡した版の節です。`## [X.Y.Z]` の見出しの次の行から、次の `##` の見出しの前までです。'
      - 'CHANGELOG は、設定ファイルにあるリポジトリの `changelog_file` です。'
      - '`changelog_file` が無いときの CHANGELOG は、git のルートの `CHANGELOG.md` で、その次が `AIST-CHANGELOG.md` です。`package` を渡したときは、そのパッケージの changelog です。'
      - 'タグがまだ無いときは、設定ファイルにあるリポジトリの `release_branch` の先頭にタグを作ります。'
      - 'タグは `v<version>` で、リリースの名前も同じです。'
      - '`package` を渡すと、タグは `<package>-v<version>`、リリースの名前は `<package> v<version>` です。'
      - '`version` は、先頭に `v` を付けない `X.Y.Z` の形でなければなりません。'
      - 'packages を設定したリポジトリでは、`package` が必須です。'
      - 'packages の無いリポジトリでは、`package` を受け付けません。'
      - 'リポジトリは、引数 `repo` から決めます。無ければ remote の `origin` から、`origin` も無ければ最初の remote から決めます。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。'
      - '`repo` が今の git remote と食い違うときは、`warnings` に入れて `repo` を使います。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`warnings` に入れて `repo` を使い、無ければ失敗を返します。'
      - '`dry_run` を付けると、リリースを作らず、GitHub のクライアントも作りません。'
    stdin: none
    output:
      format: text
      description: '作ったリリースの URL です。`--dry-run` のときは、代わりにリリースノートです。'
    mcp_output:
      fields:
        tag: 'リリースのタグです。'
        url: '作ったリリースの URL です。`dry_run` のときは入りません。'
        releaseNotes: 'CHANGELOG から取ったリリースノートです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も作っていません。'
    diagnostics: '標準エラーに、作ったリリースの結果の行を出します。`--dry-run` のときは、予定の行を出します。`--repo` が git remote と違うときは、`warning` の行を出します。失敗したときは、`error` の行を出します。remote の URL から `owner/repo` を読めず `--repo` があるときは、`warning: using --repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`--repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `--repo` の案内の行を続けます。'
    environment: []
    exit_status:
      - kind: invalid-input
        code: 1
        when: '`version` が `X.Y.Z` の形ではありません。`package` の決まりに反するときも含みます。'
      - kind: git-unresolved
        code: 1
        when: 'git のリポジトリのルートが見つかりません。`repo` を省いたのに git remote を読めないときと、git の外で `repo` を省いたときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: preflight-failed
        code: 1
        when: 'CHANGELOG か、その中の版が見つかりません。'
      - kind: repo-setting-missing
        code: 1
        when: '`release_branch` が未設定です。'
      - kind: invalid-input
        code: 2
        when: '`version` が無いか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '手順のどれかで失敗したときは、GitHub に何も作りません。'
    effects:
      - target: github
        kind: write
        what: 'リリースとタグを作ります。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルと CHANGELOG を読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
      - target: git
        kind: read
        what: 'git のリポジトリのルートと、remote の `origin` の URL を読みます。`origin` が無ければ、最初の remote の URL を読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。'
      - '設定ファイルに、リポジトリの `release_branch` が要ります（`project_link` で設定します）。'
      - 'CHANGELOG に、その版の節が要ります。'
      - 'ホストの GitHub トークンと、リリースを作る権限が要ります。'
    idempotent: false
    examples:
      - arguments:
          version: 0.6.1
        note: 'CHANGELOG から、リリース `v0.6.1` を作ります。'
      - arguments:
          version: 0.6.1
          dry_run: true
        note: '何も作らずに、予定とリリースノートを返します。'
      - arguments:
          version: 0.6.1
          package: pecot-workflow
        note: 'monorepo で、リリース `pecot-workflow-v0.6.1` を作ります。'
    default_notes:
      package: '省くと、値はありません。設定ファイルでリポジトリに packages を設定しているときは必須です。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
