      - id: PW-BRANCH-DELETE-20
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-BRANCH-DELETE-21
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-ISSUE-CHECK:
    summary: '公式の MCP の `issue_write` に渡す値を、書く前に pecot の決まりに照らします。GitHub を読み書きしません。'
    arguments:
      method: '`create` か `update` です。公式の `issue_write` の `method` と同じです。`create` では、一括で作る Issue を書く順に渡せます。`update` では、Issue を 1 つ渡します。'
      issues: 'Issue ごとの値の配列です。`issue_write` の引数に、pecot の `kind`・`template`・`key`・`blocked_by`・`project_fields` を足した形です。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、作り先のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブなプロジェクトを使います。'
      reads: '決まりを確かめるのに要る、公式の MCP の読み取りの結果です。親 Epic の sub-issue・前提の Issue・前提を閉じる PR・ボードの欄とカードなどを、結果のまま渡します。'
    constraints: []
    details:
      - '値を受けて、決まりに外れた所を `problems` に返します。GitHub を読み書きせず、何も作りません。'
      - '`problems` が空なら、値をそのまま `issue_write` に渡せます。'
      - '同梱のテンプレート（`pecot-template://issue/<名前>`）を指すと、本文をテンプレートの見出しと書き方に照らします。差し替えたテンプレートを指すときは、本文に決まりを当てません。'
      - '題の接頭辞と番号、ボードの欄と置く列、前提の待ち方は、テンプレートによらずいつも見ます。'
      - '決まりを確かめるのに要る読み取りが `reads` に無いと、`code` が `read-required` の項目で、読むツールと `method` を案内します。'
      - '`create` では、Issue ごとの進め方を `plan` に、スタックできる並びを `stackableChains` に入れます。'
    stdin: none
    output:
      format: text
      description: '外れた所が無ければ `ok` の 1 行です。あれば、外れた所ごとに `<Issue>: <引数>: <内容>` の行を出します。'
    mcp_output:
      fields:
        problems: '決まりに外れた所の配列です。要素は `field`・`code`・`message` を必ず持ちます。`issue` は一括のキーか `owner/repo/N` で、対象が 1 つのときは入りません。受け付ける値が決まっているときは `candidates` に入れます。空なら、値をそのまま書けます。'
        plan: '`create` のときだけ入る、Issue ごとの進め方の表です。渡した順に並びます。要素は `key`・`blockedBy`・`approach` を必ず持ちます。`approach` は `alone`・`wait-merge`・`stack`・`join` のどれかです。`order` は、親 Epic があるときだけ入ります。`stackOn` は、`approach` が `stack` のときだけ入ります。'
        stackableChains: 'スタックできる並びの配列です。1 つの並びは、親から子の順に並べた文字列の配列です。一括の Issue はキー、既存の Issue は `#N` か `owner/repo#N` で書きます。スタックできる並びが無いときは入りません。'
    diagnostics: '決まりに外れはしないが、注意の要る値に `warning` の行を出します。前提の PR を読んでおらず、スタックできるかを決められないときも出します。'
    environment: []
    exit_status:
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: invalid-input
        when: '引数の形が誤っています。`method` が `create`・`update` でないときや、`issues` が空のときを含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルと、同梱のテンプレートを読みます。'
    prerequisites:
      - '作り先のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。無いときは、失敗にせず `not-in-project` の項目を返します。'
    idempotent: true
    examples:
      - arguments:
          method: create
          issues:
            - kind: task
              template: pecot-template://issue/task
              owner: acme
              repo: demo
              title: '[Task] #12-1: 一覧の画面を作る'
              body: '## Summary — 一覧の画面を作る'
              parent_owner: acme
              parent_repo: demo
              parent_issue_number: 12
              project_fields:
                - name: pecot-status
                  value: Ready
        note: '値を確かめ、外れた所を `problems` に、進め方を `plan` に返します。何も作りません。'
    default_notes: {}
    behaviors:
      - id: PW-ISSUE-CHECK-01
        pattern: event
        statement: '`issue_write` に渡す値を受けると、GitHub を読み書きせずに、決まりに外れた所を `problems` に返します'
      - id: PW-ISSUE-CHECK-02
        pattern: event
        statement: '`method` に `create` を渡すと、Issue ごとの番号・前提・進め方を `plan` に、スタックできる並びを `stackableChains` に入れます'
      - id: PW-ISSUE-CHECK-03
        pattern: unwanted
        statement: 'もし題の接頭辞か番号が決まりに外れるなら、直した題を `candidates` に添えた項目を返します'
      - id: PW-ISSUE-CHECK-04
        pattern: unwanted
        statement: 'もし決まりを確かめるのに要る読み取りが `reads` に無いなら、`code` が `read-required` の項目で、読むツールを案内します'
      - id: PW-ISSUE-CHECK-05
        pattern: event
        statement: '同梱のテンプレートを指すと、本文をテンプレートの見出しと書き方に照らし、テンプレートの種別と `kind` も照らします'
      - id: PW-ISSUE-CHECK-06
        pattern: state
        statement: '差し替えたテンプレートを指す間、本文にテンプレートの決まりを当てません'
      - id: PW-ISSUE-CHECK-07
        pattern: event
        statement: 'テンプレートを指さないと、題と本文の 1 行目が同じことと、本文の末尾の行を確かめます'
      - id: PW-ISSUE-CHECK-08
        pattern: event
        statement: '`method` に `create` を渡すと、置く列とボードの欄の値をボードの読み取りに照らし、置く列と選択肢を `candidates` に添えます'
      - id: PW-ISSUE-CHECK-09
        pattern: unwanted
        statement: 'もし `method` が `update` で置く列を書くなら、列は決まりで動くとして項目を返します'
      - id: PW-ISSUE-CHECK-10
        pattern: event
        statement: '前提を渡すと、待ち方・理由・`Waits for merge` の節を確かめ、置く列が `Ready` か `Blocked` かを決めます'
      - id: PW-ISSUE-CHECK-11
        pattern: state
        statement: '前提の PR を読んでいない間、`Ready` と `Blocked` のどちらも受け、読む PR を `warning` の行で案内します'
      - id: PW-ISSUE-CHECK-12
