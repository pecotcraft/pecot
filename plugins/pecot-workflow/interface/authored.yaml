        pattern: unwanted
        statement: もし -m か -r を省いたなら、使い方のエラーを出して終了コード 2 で終わる
  PW-ISSUE-READ:
    constraints: []
    details:
      - Fetches one Issue with a single GraphQL query.
      - Prints the title, state, parent Issue, linked branches, linked PRs, sub-issues, body and comments.
      - Shows at most --comment-limit comments, from 0 to 20; 0 hides them.
      - With --json, prints the same data as JSON.
      - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
    stdin: none
    output:
      format: text
      description: "Markdown that starts with a ## #<N> <title> heading, followed by the state, the parent, the linked branches, the linked PRs, the sub-issues, the body and the comments. With --json, a JSON object with the same data."
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: The Issue was printed.
      - code: 1
        when: There is no active project, or the GitHub API returned an error.
      - code: 2
        when: The Issue reference is malformed, --comment-limit is outside 0 to 20, or another command line error occurs.
    on_error: default
    effects:
      - target: github
        kind: read
        what: Reads the Issue, its parent, sub-issues, linked branches, linked PRs and comments.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: true
    examples:
      - run: pecot issue read example-org/my-repo/12
        note: Show the Issue as Markdown.
      - run: pecot issue read example-org/my-repo/12 --json -c 0
        note: Show the Issue as JSON without comments.
    default_notes:
      issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    behaviors:
      - id: PW-ISSUE-READ-01
        pattern: event
        statement: Issue の参照を渡すと、見出し・状態・本文を Markdown で標準出力に出す
      - id: PW-ISSUE-READ-02
        pattern: event
        statement: 親 Issue がある Issue を読むと、親 Issue を出す
      - id: PW-ISSUE-READ-03
        pattern: event
        statement: リンクされたブランチがある Issue を読むと、そのブランチを出す
      - id: PW-ISSUE-READ-04
        pattern: event
        statement: リンクされた PR がある Issue を読むと、その PR を出す
      - id: PW-ISSUE-READ-05
        pattern: event
        statement: sub-issue がある Issue を読むと、sub-issue を出す
      - id: PW-ISSUE-READ-06
        pattern: event
        statement: コメントがある Issue を読むと、--comment-limit 件までのコメントを出す
      - id: PW-ISSUE-READ-07
        pattern: event
        statement: --comment-limit 0 を付けて打つと、コメントを出さない
      - id: PW-ISSUE-READ-08
        pattern: event
        statement: --json を付けて打つと、同じ内容を JSON で標準出力に出す
      - id: PW-ISSUE-READ-09
        pattern: event
        statement: 短い形 N の参照を渡すと、--repo か git の remote で補って読む
      - id: PW-ISSUE-READ-10
        pattern: unwanted
        statement: もし Issue の参照の形が誤っているなら、終了コード 2 で終わる
      - id: PW-ISSUE-READ-11
        pattern: unwanted
        statement: もし --comment-limit が 0 から 20 の外なら、終了コード 2 で終わる
      - id: PW-ISSUE-READ-12
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-ISSUE-READ-13
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
  PW-ISSUE-REOPEN:
    constraints: []
    details:
      - Reopens a closed Issue and sets its status on the project board.
      - Sets the status given by --status, and ready when it is not given.
      - Waits 3 seconds after setting the status and reopens the Issue a second time, because board automation can close it again.
      - With --comment, posts the given reason as a comment after the Issue is reopened.
      - Each run with --comment posts another comment.
      - An Issue that is not on the board is reopened with a warning and its status is not changed.
      - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
    stdin: none
    output:
      format: none
    diagnostics: "Result lines on stderr: set (the status), reopened (the Issue) and created (the comment). Warning lines when the Issue is not on the board and when the status is not configured in the project. An error line for each failure."
    environment: []
    exit_status:
      - code: 0
        when: The Issue was reopened.
      - code: 1
        when: The status is not one of the valid values, there is no active project, the repository is not in the project, the Issue is not open after the second reopen, posting the comment failed, or the GitHub API returned an error.
      - code: 2
        when: The Issue reference is malformed, or another command line error occurs.
    on_error: When posting the comment fails, the Issue stays open with the new status and the command exits with 1. When the Issue is not open after the second reopen, the status stays changed and the command exits with 1.
    effects:
      - target: github
        kind: write
        what: Reopens the Issue, sets the status field of its board item and posts the comment.
      - target: github
        kind: read
        what: Reads the repositories linked to the project and the board item of the Issue.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: true
    examples:
      - run: "pecot issue reopen example-org/my-repo/12 --status active --comment \"The fix did not hold.\""
        note: Reopen an Issue as active and leave the reason.
    default_notes:
      issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    behaviors:
      - id: PW-ISSUE-REOPEN-01
        pattern: event
        statement: 閉じた Issue の参照を渡すと、その Issue を reopen する
      - id: PW-ISSUE-REOPEN-02
        pattern: event
        statement: Issue を reopen すると、ボードの status を --status の値にする
      - id: PW-ISSUE-REOPEN-03
        pattern: event
        statement: --status を省いて打つと、ボードの status を ready にする
      - id: PW-ISSUE-REOPEN-04
        pattern: event
        statement: status を設定すると、3 秒待ってからもう一度 reopen する
      - id: PW-ISSUE-REOPEN-05
        pattern: event
        statement: --comment を付けて打つと、reopen の後に理由をコメントに投稿する
      - id: PW-ISSUE-REOPEN-06
        pattern: event
        statement: --comment を付けて 2 回打つと、そのたびにコメントを投稿する
      - id: PW-ISSUE-REOPEN-07
        pattern: event
        statement: status を設定すると、set の行を標準エラーに出す
      - id: PW-ISSUE-REOPEN-08
        pattern: event
        statement: Issue を reopen すると、reopened の行を標準エラーに出す
      - id: PW-ISSUE-REOPEN-09
        pattern: event
        statement: コメントを投稿すると、created の行を標準エラーに出す
      - id: PW-ISSUE-REOPEN-10
        pattern: unwanted
        statement: もし Issue がボードに無いなら、warning の行を標準エラーに出す
      - id: PW-ISSUE-REOPEN-11
        pattern: unwanted
        statement: もし Issue がボードに無いなら、status を変えずに reopen だけを行う
      - id: PW-ISSUE-REOPEN-12
        pattern: unwanted
        statement: もし status がプロジェクトに設定されていないなら、warning の行を標準エラーに出す
      - id: PW-ISSUE-REOPEN-13
        pattern: unwanted
        statement: もし 2 回目の reopen の後も Issue が open でないなら、終了コード 1 で終わる
      - id: PW-ISSUE-REOPEN-14
        pattern: unwanted
        statement: もしコメントの投稿に失敗したなら、終了コード 1 で終わる
      - id: PW-ISSUE-REOPEN-15
        pattern: unwanted
        statement: もし --status が有効な値でないなら、終了コード 1 で終わる
      - id: PW-ISSUE-REOPEN-16
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-ISSUE-REOPEN-17
        pattern: unwanted
        statement: もしリポジトリがプロジェクトに無いなら、終了コード 1 で終わる
      - id: PW-ISSUE-REOPEN-18
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-ISSUE-REOPEN-19
        pattern: unwanted
        statement: もし Issue の参照の形が誤っているなら、終了コード 2 で終わる
  PW-PR-CLEANUP:
    constraints: []
    details:
      - "Cleans up after a merged PR: closes the related Issues, optionally deletes the remote branches and returns the local checkout to the development branch."
      - The related Issues are the closing issues of the PR, the Issues named after Closes, Fixes or Resolves in its body, and the Issue whose number ends the head branch name.
      - Does not close an Epic or an Issue that has sub-issues, and writes a skipped line for it.
      - With --delete-branch, deletes the remote head branch and then wip/<head>.
      - Switches the local checkout to the worktree name inside a worktree, or to develop_branch otherwise, pulls it from origin and deletes the local head branch with git branch -D.
      - Skips the local cleanup when the repository of the current directory differs from the one of the PR.
      - After the local cleanup, removes the flags .pecot-active, .pecot-session-title, .pecot-quick-mode and .wip-branch-linked and the flag merge-slash-pending under .pecot/state/.
      - With --skip-local-cleanup, does not clean up locally and leaves those flags in place.
      - "With --dry-run, writes dry-run: would lines instead of the result lines and changes nothing."
      - "A second run leaves the same state as the first but writes different lines: the remote branch is reported as unchanged and git branch -D on the local branch gives a warning."
      - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
    stdin: none
    output:
      format: none
    diagnostics: "A count line for the Issues to close, then one result line per step on stderr: closed, skipped, unchanged, deleted, set and updated. With --dry-run, dry-run: would lines take the place of the result lines. Warning lines for steps that failed and for local cleanup that was skipped."
    environment: []
    exit_status:
      - code: 0
        when: The cleanup finished. A step that failed with a warning still gives 0.
      - code: 1
        when: There is no active project, the PR cannot be fetched or does not exist, or the PR is not merged.
      - code: 2
        when: The PR reference is malformed, or another command line error occurs.
    on_error: A PR that is not merged is left as it is and nothing is changed. A failure to close an Issue is a warning and the other Issues and the later steps still run; nothing is rolled back. When deleting the remote head branch fails, deleting wip/<head> is skipped. When the checkout fails, the pull and the branch deletion are skipped and the flags are still removed.
    effects:
      - target: github
        kind: read
        what: Reads the PR and the kind of each related Issue.
      - target: github
        kind: write
        what: Closes the related Issues.
      - target: github
        kind: destructive
        what: Deletes the remote head branch and wip/<head>.
      - target: git
        kind: destructive
        what: Checks out the development branch or the worktree branch, pulls it, and deletes the local head branch with git branch -D.
      - target: file
        kind: write
        what: Removes the flags under .pecot/state/.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
      - The PR is already merged.
    idempotent: true
    examples:
      - run: pecot pr cleanup example-org/my-repo/123 --delete-branch
        note: Clean up after a merged PR and delete its remote branch.
      - run: pecot pr cleanup example-org/my-repo/123 --dry-run
        note: Show what would be done without changing anything.
    default_notes:
      pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    behaviors:
      - id: PW-PR-CLEANUP-01
        pattern: event
        statement: マージ済みの PR の参照を渡すと、closing issues・本文の Closes / Fixes / Resolves・head ブランチ名の末尾の番号の Issue を close する
      - id: PW-PR-CLEANUP-02
        pattern: event
        statement: Epic か sub-issue を持つ Issue があると、その Issue を close しない
      - id: PW-PR-CLEANUP-03
        pattern: event
        statement: Epic か sub-issue を持つ Issue があると、skipped の行を標準エラーに出す
      - id: PW-PR-CLEANUP-04
        pattern: event
        statement: --delete-branch を付けて打つと、リモートの head ブランチを削除する
      - id: PW-PR-CLEANUP-05
        pattern: event
        statement: リモートの head ブランチを削除すると、続けて wip/<head> を削除する
      - id: PW-PR-CLEANUP-06
        pattern: event
        statement: カレントのリポジトリが PR のリポジトリと同じだと、worktree の中なら worktree 名の、そうでなければ develop_branch のブランチに切り替える
      - id: PW-PR-CLEANUP-07
        pattern: event
        statement: ブランチを切り替えると、origin の develop_branch を pull する
      - id: PW-PR-CLEANUP-08
        pattern: event
        statement: pull すると、ローカルの head ブランチを git branch -D で削除する
      - id: PW-PR-CLEANUP-09
        pattern: event
        statement: ローカルの片付けを終えると、フラグのファイルと merge-slash-pending を消す
      - id: PW-PR-CLEANUP-10
        pattern: event
        statement: --skip-local-cleanup を付けて打つと、ローカルの片付けをしない
      - id: PW-PR-CLEANUP-11
        pattern: event
        statement: --skip-local-cleanup を付けて打つと、フラグのファイルと merge-slash-pending を消さない
      - id: PW-PR-CLEANUP-12
        pattern: event
        statement: "--dry-run を付けて打つと、何も変えずに dry-run: would の行を標準エラーに出す"
      - id: PW-PR-CLEANUP-13
        pattern: event
        statement: 実行すると、close する Issue の件数を count の行で標準エラーに出す
      - id: PW-PR-CLEANUP-14
        pattern: event
        statement: Issue を close すると、closed の行を標準エラーに出す
      - id: PW-PR-CLEANUP-15
