      - id: PW-RELEASE-CHECK-31
        pattern: unwanted
        statement: 'もし `<release_branch>` に無いコミットが `<develop_branch>` に無いなら、`kind` が `preflight-failed` の失敗を返します'
      - id: PW-RELEASE-CHECK-32
        pattern: unwanted
