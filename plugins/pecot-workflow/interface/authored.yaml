  PW-WORKTREE-REMOVE:
    constraints: []
    details:
      - Finds the worktree whose branch is the given name in the worktree list of the repository in -D, and removes it with git worktree remove.
      - Deletes the local branch of the same name unless --keep-branch is given.
      - When git branch -D fails, the deleted line is still written and the branch remains.
      - Removes <project root>/<name> afterwards when that directory is empty.
      - A set directory that cannot be removed is a warning.
      - Without --force, git refuses to remove a worktree that has changes.
      - A name that is not a branch name of a listed worktree stops the command.
      - A worktree with a detached HEAD cannot be found by name.
      - Needs a devcontainer.
      - Does not read the worktree config files or the active project.
    stdin: none
    output:
      format: none
    diagnostics: A removed line and a deleted line on stderr, the deleted line also when the branch could not be deleted. A warning line when the set directory cannot be removed. An error line for a failure. Outside a devcontainer, a traceback instead of an error line.
    environment:
      - name: REMOTE_CONTAINERS
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: CODESPACES
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: DEVCONTAINER
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
    exit_status:
      - code: 0
        when: The worktree was removed.
      - code: 1
        when: --repo differs from the current git remote, --repo is omitted outside a git repository, no worktree has the given branch name, git worktree remove failed, or the command runs outside a devcontainer (a traceback is printed).
      - code: 2
        when: The name or -D is missing, -D is not an existing directory, or another command line error occurs.
    on_error: Stops at the first error. When git worktree remove failed, the worktree and the branch stay. After the worktree was removed, a failure to delete the branch still writes the deleted line and leaves the branch.
    effects:
      - target: git
        kind: read
        what: Reads the worktree list.
      - target: git
        kind: destructive
        what: Removes the worktree, including uncommitted changes with --force, and deletes the local branch with git branch -D.
      - target: file
        kind: destructive
        what: Removes the empty set directory <project root>/<name>.
    prerequisites:
      - The command runs in a devcontainer.
    idempotent: false
    examples:
      - run: pecot worktree remove wt1 -D .
        note: Remove the worktree wt1 and its branch.
      - run: pecot worktree remove wt1 -D . --keep-branch --force
        note: Remove the worktree even with changes and keep the branch.
    default_notes: {}
    behaviors:
      - id: PW-WORKTREE-REMOVE-01
        pattern: event
        statement: worktree のブランチ名を渡して打つと、その worktree を削除する
      - id: PW-WORKTREE-REMOVE-02
        pattern: event
        statement: --keep-branch を省いて worktree を削除すると、同じ名前のローカルブランチを削除する
      - id: PW-WORKTREE-REMOVE-03
        pattern: event
        statement: --keep-branch を付けて打つと、ブランチを残す
      - id: PW-WORKTREE-REMOVE-04
        pattern: event
        statement: --force を付けて打つと、変更のある worktree も削除する
      - id: PW-WORKTREE-REMOVE-05
        pattern: event
        statement: 削除した後にプロジェクトのルートの下の同名のディレクトリが空だと、そのディレクトリを削除する
      - id: PW-WORKTREE-REMOVE-06
        pattern: event
        statement: worktree を削除すると、removed の行を標準エラーに出す
      - id: PW-WORKTREE-REMOVE-07
        pattern: event
        statement: --keep-branch を省いて worktree を削除すると、deleted の行を標準エラーに出す
      - id: PW-WORKTREE-REMOVE-08
        pattern: unwanted
        statement: もし空のセットのディレクトリを削除できないなら、warning の行を標準エラーに出す
      - id: PW-WORKTREE-REMOVE-09
        pattern: unwanted
        statement: もし git branch -D に失敗したなら、deleted の行を標準エラーに出す
      - id: PW-WORKTREE-REMOVE-10
        pattern: unwanted
        statement: もし git branch -D に失敗したなら、ブランチを残す
      - id: PW-WORKTREE-REMOVE-11
        pattern: unwanted
        statement: もし渡した名前をブランチ名に持つ worktree が無いなら、worktree not found の error の行を標準エラーに出す
      - id: PW-WORKTREE-REMOVE-12
        pattern: unwanted
        statement: もし渡した名前をブランチ名に持つ worktree が無いなら、終了コード 1 で終わる
      - id: PW-WORKTREE-REMOVE-13
        pattern: unwanted
        statement: もし --force を付けずに変更のある worktree を削除しようとしたなら、worktree とブランチを残す
      - id: PW-WORKTREE-REMOVE-14
        pattern: unwanted
        statement: もし --force を付けずに変更のある worktree を削除しようとしたなら、終了コード 1 で終わる
      - id: PW-WORKTREE-REMOVE-15
        pattern: unwanted
        statement: もし git worktree remove に失敗したなら、error の行を標準エラーに出す
