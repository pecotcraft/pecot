  PW-SECURITY-SYNC:
    constraints: []
    details:
      - Finds the open Tracker issue labeled security-alert whose body has the Tracker marker.
      - Rewrites the list between list-begin and list-end in the body of the Tracker with the open alerts.
      - Reads the open Dependabot alerts, the open code scanning alerts of the default branch and the open secret scanning alerts.
      - Each kind has its own heading and table in the Tracker body.
      - Priority comes from the alert severity.
      - A secret scanning alert is always high.
      - The Priority of a new Tracker is the highest Priority among its rows.
      - The rows of code scanning and secret scanning alerts show masked as the title.
      - A Dependabot row shows the advisory summary, and Dependabot alerts of one advisory share a row.
      - Text in the Tracker body outside the list markers stays as it is.
      - A kind whose feature is disabled shows disabled under its heading and adds no rows.
      - A repository without a code scanning analysis counts as having no code scanning alerts.
      - A kind whose list cannot be fetched keeps its previous rows and shows unavailable when it had none.
      - When a kind cannot be fetched, the command ends with exit status 1 after the other kinds were applied.
      - A 403 for Dependabot alerts or a 404 for secret scanning that cannot be confirmed as disabled counts as a failure to fetch.
      - When no Tracker is open and there are rows to list, creates a Tracker, adds it to the project board, and sets Status to Backlog and Priority to the highest row.
      - When no Tracker is open and there is no row to list, creates nothing.
      - Never closes the Tracker.
      - When every alert is gone, each kind shows none, and a person closes the Tracker and moves it to Archived.
      - On an existing Tracker, sets Status and Priority only while they are empty, so a change made by a person stays.
      - A field that the active project does not define is not set.
      - When several Trackers are open, uses the lowest number and leaves the others open.
      - A closed Tracker is not reused.
    stdin: none
    output:
      format: none
    diagnostics: A result line for each change (created, added, removed, updated, unchanged, skipped), or a dry-run line with --dry-run. A warning line when several Trackers are open. An error line for each failure, including each kind whose list could not be fetched, except when the GitHub token cannot be found, where a traceback is printed.
    environment: []
    exit_status:
      - code: 0
        when: The Tracker was synchronized, or --dry-run printed the plan, and every kind was fetched or is disabled.
      - code: 1
        when: There is no active project, the repository cannot be read from the origin remote, the issues cannot be listed, the list of a kind cannot be fetched, the Tracker body does not have exactly one pair of list-begin and list-end markers, creating, updating or placing the Tracker on the board failed, or the GitHub token cannot be found (a traceback is printed). The exit status is 1 for a kind that cannot be fetched also with --dry-run.
      - code: 2
        when: A command line error occurs.
    on_error: A Tracker that was created stays open on GitHub even when placing it on the board failed, and the next run places it on the board. A failed body update leaves the body as it was, and the next run retries it. Changes already made are not rolled back.
    effects:
      - target: github
        kind: read
        what: Lists the open Dependabot, code scanning and secret scanning alerts of the repository, the secret scanning and Dependabot settings when a list is refused, and the issues that carry the security-alert label.
      - target: github
        kind: write
        what: Creates the Tracker issue, rewrites its body, adds it to the project board and sets its Status and Priority.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host, with permission to read the security alerts and to edit issues and the project.
      - The repository is the origin remote of the working directory, or --repo is given.
    idempotent: true
    examples:
      - run: pecot security sync --dry-run
        note: Show the planned Tracker changes without writing to GitHub.
      - run: pecot security sync
        note: Rewrite the Tracker list, creating the Tracker when needed.
    default_notes: {}
    behaviors:
      - id: PW-SECURITY-SYNC-01
        pattern: event
        statement: open の Tracker が無く、載せる alert があると、label が security-alert の Tracker の Issue を作る
      - id: PW-SECURITY-SYNC-02
        pattern: event
        statement: Tracker の Issue を作ると、ボードに足す
      - id: PW-SECURITY-SYNC-03
        pattern: event
        statement: Tracker の Issue を作ると、Status を Backlog にする
      - id: PW-SECURITY-SYNC-04
        pattern: event
        statement: Tracker の Issue を作ると、Priority を行の最大にする
      - id: PW-SECURITY-SYNC-05
        pattern: event
        statement: open の Tracker が無く、載せる alert も無いと、Tracker の Issue を作らない
      - id: PW-SECURITY-SYNC-06
        pattern: event
        statement: open の Tracker が無く、載せる alert も無いと、skipped の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-07
        pattern: event
        statement: open の Tracker があると、list-begin と list-end の間を、Dependabot・code scanning・secret scanning の見出しと表に書き直す
      - id: PW-SECURITY-SYNC-08
        pattern: event
        statement: 表に alert を足すと、added の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-09
        pattern: event
        statement: 表から alert を外すと、removed の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-10
        pattern: event
        statement: 行の足し外しが無く本文だけが変わると、本文を書き直す
      - id: PW-SECURITY-SYNC-11
        pattern: event
        statement: 行の足し外しが無く本文だけが変わると、updated の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-12
        pattern: event
        statement: 書き直した本文が今の本文と同じだと、本文を書き直さない
      - id: PW-SECURITY-SYNC-13
        pattern: event
        statement: 書き直した本文が今の本文と同じだと、unchanged の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-14
        pattern: event
        statement: open の alert がすべて無くなると、各種類の見出しの下に none を書く
      - id: PW-SECURITY-SYNC-15
        pattern: event
        statement: open の alert がすべて無くなると、Tracker を閉じない
      - id: PW-SECURITY-SYNC-16
        pattern: event
        statement: code scanning と secret scanning の行を書くと、title を masked にする
      - id: PW-SECURITY-SYNC-17
        pattern: event
        statement: 機能が無効の種類があると、その見出しの下に disabled を書く
      - id: PW-SECURITY-SYNC-18
        pattern: event
        statement: 機能が無効の種類があると、skipped の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-19
        pattern: event
        statement: code scanning の解析が無いリポジトリだと、code scanning の alert を 0 件として扱う
      - id: PW-SECURITY-SYNC-20
        pattern: event
        statement: 既存の Tracker の Status か Priority が空だと、空の欄だけに Backlog か行の最大の Priority を入れる
      - id: PW-SECURITY-SYNC-21
        pattern: event
        statement: open の Tracker が複数あると、番号が最小のものを使う
      - id: PW-SECURITY-SYNC-22
        pattern: event
        statement: open の Tracker が複数あると、使わないものを閉じない
      - id: PW-SECURITY-SYNC-23
        pattern: event
        statement: open の Tracker が複数あると、warning の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-24
        pattern: event
        statement: --dry-run を付けて打つと、GitHub への書き込みをしない
      - id: PW-SECURITY-SYNC-25
        pattern: event
        statement: --dry-run を付けて打つと、予定の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-26
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-SECURITY-SYNC-27
        pattern: unwanted
        statement: もし --repo を省いて origin remote のリポジトリを読めないなら、終了コード 1 で終わる
      - id: PW-SECURITY-SYNC-28
        pattern: unwanted
        statement: もし GitHub のトークンが見つからないなら、traceback を標準エラーに出す
      - id: PW-SECURITY-SYNC-29
        pattern: unwanted
        statement: もし GitHub のトークンが見つからないなら、終了コード 1 で終わる
      - id: PW-SECURITY-SYNC-30
        pattern: unwanted
        statement: もしある種類の alert の一覧を取れないなら、その種類の前の行を残す
      - id: PW-SECURITY-SYNC-31
        pattern: unwanted
        statement: もしある種類の alert の一覧を取れず、前の行も無いなら、見出しの下に unavailable を書く
      - id: PW-SECURITY-SYNC-32
        pattern: unwanted
        statement: もしある種類の alert の一覧を取れないなら、その種類を触らない旨の error の行を標準エラーに出す
      - id: PW-SECURITY-SYNC-33
        pattern: unwanted
        statement: もしある種類の alert の一覧を取れないなら、ほかの種類を書き直す
      - id: PW-SECURITY-SYNC-34
        pattern: unwanted
        statement: もしある種類の alert の一覧を取れないなら、ほかの種類を書き直した後に終了コード 1 で終わる
      - id: PW-SECURITY-SYNC-35
        pattern: unwanted
        statement: もし Dependabot alert が有効なのに一覧を 403 で取れないなら、その種類を取れなかったものとして扱う
      - id: PW-SECURITY-SYNC-36
        pattern: unwanted
        statement: もし secret scanning の一覧を 404 で取れず、無効とも確かめられないなら、その種類を取れなかったものとして扱う
      - id: PW-SECURITY-SYNC-37
        pattern: unwanted
        statement: もし Issue の一覧を取れないなら、何も書かない
      - id: PW-SECURITY-SYNC-38
        pattern: unwanted
        statement: もし Issue の一覧を取れないなら、終了コード 1 で終わる
      - id: PW-SECURITY-SYNC-39
