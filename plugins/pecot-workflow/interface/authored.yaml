  PW-PR-CREATE:
    constraints:
      - requires: {message: [title, base]}
      - conflicts: [file, screenshot]
    details:
      - "Has three modes: --prepare, a file argument and -m."
      - When more than one mode is given, --prepare wins over the file and the file wins over -m.
      - --template is default or release.
      - With --prepare, copies the template to .pecot/tmp/output/ and prints its path.
      - With --prepare and the default template, sets base in the copy to the develop_branch of the repository.
      - With --prepare in an nx repository, adds the expected title scope as a comment on the title line.
      - "With --prepare and the default template, fills the trailing Closes # with the number of the active task, or else the number that ends the branch name."
      - "The Closes # of the copy is left empty when that Issue is an Epic."
      - With a file, the repository, base, title, head and draft come from its front matter and the options of the same names are ignored.
      - With -m, the repository is --repo, or the only repository of the active project when --repo is omitted.
      - "Unless the template is release or --no-issue-ref is given, appends Closes #N to the body when it does not mention the number N that ends the head branch name."
      - With a file, Closes is not appended when that Issue is an Epic.
      - Checks the title, body and base, and stops with exit status 3 when the Issue reference, a required section, the heading summaries, the notation, the Summary screenshot or the base branch is wrong.
      - In a repository whose release type is nx, also stops with exit status 3 when the title scope differs from the scope of the changed nx projects.
      - Unless --dry-run is given, runs the same checks as pr preflight on the current directory and stops with exit status 2 when they find a warning.
      - "With --dry-run, validates and writes dry-run: would lines without creating the PR."
      - After the PR is created, sets the Issue named by the head branch to In Review unless the template is release.
      - Removes the flag pr-create-slash-pending after the PR is created.
    stdin: none
    output:
      format: text
      description: With --prepare, the path of the template copy. Otherwise the URL of the created PR. Nothing with --dry-run.
    diagnostics: "A result line on stderr for the PR (created) and for the board status (set). With --prepare, set lines for base, the title scope hint and Closes. With --dry-run, dry-run: would lines for the PR and the status. One error line for each validation failure. When the early check finds warnings, an error line followed by one warning line for each. Warning lines when the board status cannot be set and when the Issue kind cannot be read."
    environment: []
    exit_status:
      - code: 0
        when: The template was copied, the PR was created, or the --dry-run validation passed. Failing to set the board status still gives 0.
      - code: 1
        when: There is no active project, --template is not default or release, no mode argument is given, -t or -b is missing with -m, --screenshot is given with a file, the front matter cannot be read or has no valid repository, the repository cannot be decided or is not in owner/repo form, the head branch cannot be decided, develop_branch or release_branch is not set, the early check finds a fatal case (not a git repository, no origin, no current branch), or the GitHub API returned an error.
      - code: 2
        when: The early check finds a warning (not pushed, uncommitted changes or a stash), or another command line error occurs.
      - code: 3
        when: "The Issue reference #N is missing, a required section is missing, a heading summary rule is broken, an unusable notation is used, the Summary has no image and no screenshot reason, or the base branch is wrong. In an nx repository, a wrong title scope also gives 3."
    on_error: No PR is created when validation fails or the early check finds a warning. When the PR is created but the board status cannot be set, the PR stays and a warning is written. A template copy written by --prepare stays in .pecot/tmp/output/.
    effects:
      - target: github
        kind: write
        what: Creates the PR and sets the board status of the related Issue to In Review.
      - target: github
        kind: read
        what: Reads the kind of the related Issue and its board item.
      - target: git
        kind: read
        what: Reads the branch, remote, status, stash and push state, and with an nx repository the diff against the base.
      - target: process
        kind: read
        what: In a repository whose release type is nx, runs nx graph to list the projects.
      - target: file
        kind: write
        what: Writes the template copy under .pecot/tmp/output/ and removes the flag pr-create-slash-pending under .pecot/state/.
      - target: file
        kind: read
        what: Reads the PR file, the templates, the active config file and .pecot/state/.pecot-active.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
      - The head branch is pushed and the working tree is clean.
    idempotent: false
    examples:
      - run: pecot pr create --prepare
        note: Write a PR template and print its path.
      - run: pecot pr create .pecot/tmp/output/pr-create-20260101-120000.md --dry-run
        note: Validate the file without creating the PR.
      - run: "pecot pr create -m \"<body>\" -t \"feat: add a report\" -b develop -r example-org/my-repo"
        note: Create a PR from the command line.
    default_notes:
      head: The current branch. The related Issue is the number that ends the head branch name.
      repo: With -m, the only repository of the active project when there is exactly one. With a file, the repository in the front matter.
    behaviors:
      - id: PW-PR-CREATE-01
        pattern: event
        statement: --prepare を付けて打つと、テンプレのコピーを .pecot/tmp/output/ に書く
      - id: PW-PR-CREATE-02
