      details:
        - Prints the information to check before creating a PR for the repository given by --directory.
        - "Prints 11 sections in a fixed order: Git Remote, Current Branch, Push Status, Base Branch, Git Status, .gitignore, Git Exclude, Commits, Diff Summary, Worktree Info and Stash List."
        - The base branch is <remote>/ followed by the develop_branch of the active project, where <remote> is the origin remote, or the first remote when there is no origin.
        - "When the base record of a stacked start exists, the base branch is <remote>/ followed by the branch of the layer below instead. When that branch no longer exists, it is <remote>/ followed by the develop_branch."
        - Prints every section even when there are warnings.
        - Counts a warning for a branch that is not pushed or has diverged, for modified or untracked files, and for stash entries.
        - Exits with status 2 when there is at least one warning.
        - Reads the repository and the config and changes nothing.
      examples:
        - run: pecot pr preflight -D .
          note: Check the current repository before creating a PR.
      default_notes: {}
    summary: PR を作る前に確かめる情報を、まとめて出します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
    constraints: []
    details:
      - '`--directory` のリポジトリについて、PR を作る前に確かめる情報を出します。'
      - '11 の節を決まった順で出します。節は、Git Remote・Current Branch・Push Status・Base Branch・Git Status・.gitignore と続きます。その後は、Git Exclude・Commits・Diff Summary・Worktree Info・Stash List です。'
      - 'base ブランチは、`<remote>/` の後にアクティブなプロジェクトの `develop_branch` を続けたものです。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - '積んで着手した記録があるときは、base ブランチは、`<remote>/` の後に下の段のブランチを続けたものです。そのブランチが無ければ（マージで消えた後）、`develop_branch` の方にします。'
      - '`warning` があっても、すべての節を出します。'
      - '`warning` として数えるのは、push していないか remote とずれたブランチ、変更したファイルか追跡していないファイル、stash の項目です。'
      - '`warning` が 1 件以上あると、終了コード 2 で終わります。'
      - 'リポジトリと設定を読むだけで、何も変えません。'
    stdin: none
    output:
      format: text
      description: '11 の節です。それぞれ `=== <title> ===` の行に内容が続き、節の間は空行で区切ります。'
    diagnostics: '標準エラーに、`warning` の数の `count` の行を出し、続けて `warning` ごとに行を 1 つ出します。行の形は `<label>: <message> (fix: <hint>)` です。'
    environment: []
    exit_status:
      - code: 0
        when: '節を出し、`warning` はありませんでした。'
      - code: 1
        when: '次のどれかです。ディレクトリが git のリポジトリではありません。git remote がありません。今のブランチかリポジトリを決められません。アクティブなプロジェクトがありません。`develop_branch` が未設定です。`<remote>/<develop_branch>` がありません。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - code: 2
        when: '次のどれかです。`warning` が 1 件以上あります。`--directory` がありません。ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: 'remote・ブランチ・push の状態・status・base との log と差分・worktree の一覧・stash の一覧を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイル、`.gitignore`、`.git/info/exclude` を読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ローカルのリポジトリに `<remote>/<develop_branch>` が要ります。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
    idempotent: true
    examples:
      - run: pecot pr preflight -D .
        note: 'PR を作る前に、今のリポジトリを確かめます。'
    default_notes: {}
    behaviors:
      - id: PW-PR-PREFLIGHT-01
        pattern: event
        statement: '`--directory` でリポジトリを指すと、11 の節を決まった順で標準出力に出します'
      - id: PW-PR-PREFLIGHT-02
        pattern: event
        statement: '`warning` があるときに打つと、11 の節を全部出します'
      - id: PW-PR-PREFLIGHT-03
        pattern: event
        statement: '打つと、Base Branch の節に `<remote>/<develop_branch>` を出します（`<remote>` は `origin`、無ければ最初の remote）'
      - id: PW-PR-PREFLIGHT-04
        pattern: event
        statement: '打つと、`count: preflight warnings` の行を標準エラーに出します'
      - id: PW-PR-PREFLIGHT-05
        pattern: event
        statement: '`warning` があるときに打つと、`warning` ごとに `warning` の行を標準エラーに出します'
      - id: PW-PR-PREFLIGHT-06
        pattern: ubiquitous
        statement: '常に、リポジトリとファイルを書き換えません'
      - id: PW-PR-PREFLIGHT-07
        pattern: unwanted
        statement: 'もしブランチが push されていないか remote とずれているなら、Push Status の `warning` を数えます'
      - id: PW-PR-PREFLIGHT-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、Git Status の `warning` を数えます'
      - id: PW-PR-PREFLIGHT-09
        pattern: unwanted
        statement: 'もし stash に項目があるなら、Stash List の `warning` を数えます'
      - id: PW-PR-PREFLIGHT-10
        pattern: unwanted
        statement: 'もし `warning` が 1 件以上あるなら、終了コード 2 で終わります'
      - id: PW-PR-PREFLIGHT-11
        pattern: unwanted
        statement: 'もし git のリポジトリでないなら、終了コード 1 で終わります'
      - id: PW-PR-PREFLIGHT-12
        pattern: unwanted
        statement: 'もし git の remote が無いなら、終了コード 1 で終わります'
      - id: PW-PR-PREFLIGHT-13
        pattern: unwanted
        statement: 'もし現在のブランチか remote のリポジトリを決められないなら、終了コード 1 で終わります'
      - id: PW-PR-PREFLIGHT-14
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PR-PREFLIGHT-15
        pattern: unwanted
        statement: 'もし `develop_branch` が設定に無いなら、終了コード 1 で終わります'
      - id: PW-PR-PREFLIGHT-16
        pattern: unwanted
        statement: 'もし `<remote>/<develop_branch>` が無いなら、終了コード 1 で終わります'
      - id: PW-PR-PREFLIGHT-17
        pattern: unwanted
        statement: 'もし `--directory` を渡していないなら、使い方のエラーを出して終了コード 2 で終わります'
      - id: PW-PR-PREFLIGHT-18
        pattern: event
        statement: '積んだ base の記録があるときに打つと、Base Branch の節に `<remote>/<下の段のブランチ>` を出します。そのブランチが無ければ `<remote>/<develop_branch>` を出します'
  PW-PR-READ:
    help:
      details:
        - Fetches one PR with a single GraphQL query.
        - Prints the title, state, draft flag, mergeability, comment count, head and base branches, closing issues, referenced issues, review states and body.
        - With --reviews, adds the review bodies and the line comments, and a pecot issue read hint under each related Issue.
        - With --json, prints the PR as JSON, and with --reviews the JSON also holds the reviews and the line comments.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot pr read example-org/my-repo/123
          note: Show the PR as Markdown.
        - run: pecot pr read example-org/my-repo/123 --reviews
          note: Show the PR with its reviews and line comments.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: PR の詳細を、必要な項目だけ GraphQL で取得して出します。
    arguments:
      json: 'JSON で出力するかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      reviews: 'レビューの詳細（本文と行のコメント）を含めるかどうかです。'
    constraints: []
    details:
      - 'GraphQL のクエリ 1 回で、PR を 1 件取得します。'
      - '題・状態・ドラフトの印・マージの可否・コメントの数・head と base のブランチを出します。closing issues・参照している Issue・レビューの状態・本文も出します。'
      - '`--reviews` を付けると、レビューの本文と行のコメントを足します。関連する Issue ごとに、`pecot issue read` の案内も足します。'
      - '`--json` を付けると、PR を JSON で出します。`--reviews` も付けると、JSON にレビューと行のコメントも入ります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: text
      description: '`## PR #<N> <title>` の見出しで始まる Markdown です。`--reviews` を付けると、レビューか行のコメントがあるときに、`## Reviews` の節と `## Line Comments` の節が続きます。`--json` を付けると、JSON のオブジェクトです。'
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: 'PR を出しました。'
      - code: 1
        when: 'アクティブなプロジェクトが無いか、GitHub API がエラーを返しました。'
      - code: 2
        when: 'PR の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue を読みます。`--reviews` のときは、レビューと行のコメントも読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot pr read example-org/my-repo/123
        note: 'PR を Markdown で出します。'
      - run: pecot pr read example-org/my-repo/123 --reviews
        note: 'PR を、レビューと行のコメントも付けて出します。'
    default_notes:
      pr_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-PR-READ-01
        pattern: event
        statement: 'PR の参照を渡すと、見出し・状態・ブランチ・本文を Markdown で標準出力に出します'
      - id: PW-PR-READ-02
        pattern: event
        statement: '関連 Issue がある PR を読むと、closing issues と参照 Issue を出します'
      - id: PW-PR-READ-03
        pattern: event
        statement: 'レビューがある PR を読むと、レビューごとの author と状態を出します'
      - id: PW-PR-READ-04
        pattern: event
        statement: '`--reviews` を付けて打つと、レビューの本文と行のコメントを足して出します'
      - id: PW-PR-READ-05
        pattern: event
        statement: '`--reviews` を付けてレビューがあると、`## Reviews` の節を出します'
      - id: PW-PR-READ-06
        pattern: event
        statement: '`--reviews` を付けて行のコメントがあると、`## Line Comments` の節を出します'
      - id: PW-PR-READ-07
        pattern: event
        statement: '`--reviews` を付けて打つと、関連 Issue ごとに `pecot issue read` の案内を足します'
      - id: PW-PR-READ-08
        pattern: event
        statement: '`--json` を付けて打つと、同じ内容を JSON で標準出力に出します'
      - id: PW-PR-READ-09
        pattern: event
        statement: '`--json` と `--reviews` を一緒に付けて打つと、JSON にレビューと行のコメントを含めます'
      - id: PW-PR-READ-10
        pattern: event
        statement: '短い形 `N` の参照を渡すと、`--repo` か git の remote で補って読みます'
      - id: PW-PR-READ-11
        pattern: unwanted
        statement: 'もし PR の参照の形が誤っているなら、終了コード 2 で終わります'
      - id: PW-PR-READ-12
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PR-READ-13
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
  PW-PROJECT-ACTIVATE:
    help:
      details:
        - Without a project argument, lists the initialized projects of the owner; --host is required.
        - A project is initialized when it has a pecot-workflow field.
        - The listing marks the active project with [ACTIVE].
        - When the owner has no initialized project, the listing is a none line.
        - With a project number or name, regenerates the config file of that project from GitHub and makes it the active project.
        - With a config file path or file name, syncs the project from the host, owner and number recorded in that file and makes it the active project.
        - A config file path or file name needs neither --host nor --owner.
        - The develop branch, release branch, changelog_file, packages and release type of each repository, and aggregation_repo, already in the config file are kept.
        - A repository that is no longer linked to the project is removed from the config file.
        - A newly linked repository is appended to the end of the repository list.
        - The Blocked option of the pecot-workflow field and the Todo and Needs Attention options of the Status field are written to the config file only when the board has them.
        - A board without the Blocked option is accepted; the other six options of the pecot-workflow field are required.
      examples:
        - run: pecot project activate --host github.com --owner example-org
          note: List the initialized projects of the owner.
        - run: pecot project activate 1 --host github.com --owner example-org
          note: Activate the project by number.
      default_notes:
        owner: The authenticated user; with a config file, the owner recorded in the file and --owner is not used.
        host: Required unless a config file is given; with a config file, the host recorded in the file.
    summary: 初期化済みのプロジェクトをアクティブにします。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      project: 'プロジェクトの番号か名前です。設定ファイルのパスかファイル名でも渡せます。'
    constraints: []
    details:
      - 'プロジェクトの引数が無いと、所有者の初期化済みのプロジェクトを一覧します。このときは `--host` が必須です。'
      - '初期化済みのプロジェクトとは、pecot-workflow のフィールドを持つプロジェクトです。'
      - '一覧では、アクティブなプロジェクトに `[ACTIVE]` の印を付けます。'
      - '所有者に初期化済みのプロジェクトが無いときは、一覧は `none` の行になります。'
      - 'プロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイルを GitHub から作り直し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すと、ファイルに記録したホスト・所有者・番号でプロジェクトを同期し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すときは、`--host` と `--owner` のどちらも要りません。'
      - '設定ファイルに既にある次の値は残します。リポジトリごとの開発ブランチ・リリースブランチ・`changelog_file`・packages・リリースの種類と、`aggregation_repo` です。'
      - 'プロジェクトとのつながりが外れたリポジトリは、設定ファイルから消します。'
      - '新しくつないだリポジトリは、リポジトリの一覧の末尾に足します。'
      - '次の選択肢は、ボードにあるときだけ設定ファイルに書きます。pecot-workflow のフィールドの Blocked と、Status のフィールドの Todo・Needs Attention です。'
      - 'Blocked の選択肢の無いボードも受け付けます。pecot-workflow のフィールドのほかの 6 つの選択肢は必須です。'
    stdin: none
    output:
      format: text
      description: 'プロジェクトを渡さないときだけ出します。見出しの行に続けて、初期化済みのプロジェクトを 1 行ずつ出し、アクティブなものに `[ACTIVE]` を付けます。初期化済みのプロジェクトが無ければ、`none` の行を出します。プロジェクトを渡したときは、標準出力に何も書きません。'
    diagnostics: 'プロジェクトを渡したときは、標準エラーに、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。`--host` が渡した設定ファイルのホストと違うときは、`warning` の行を出します。このときは、設定ファイルのホストを使います。'
    environment: []
    exit_status:
      - code: 0
        when: 'プロジェクトを一覧したか、プロジェクトをアクティブにしました。'
      - code: 1
        when: '次のどれかです。必須の `--host` がありません。プロジェクトが見つからないか、初期化されていません。設定ファイルを読み込めません。GitHub API がエラーを返しました。プロジェクトのルートを決められません。'
      - code: 2
        when: '知らないオプションなど、コマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクトと、そのフィールドと、つながっているリポジトリを読みます。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下の設定ファイルを作るか更新し、アクティブなプロジェクトを設定します。'
      - target: file
        kind: read
        what: '設定ファイルと、アクティブなプロジェクトの設定を読みます。'
    prerequisites:
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot project activate --host github.com --owner example-org
        note: '所有者の初期化済みのプロジェクトを一覧します。'
      - run: pecot project activate 1 --host github.com --owner example-org
        note: '番号でプロジェクトをアクティブにします。'
    default_notes:
      owner: '省くと、認証したユーザーです。設定ファイルを渡したときは、ファイルに記録した所有者を使い、`--owner` は使いません。'
      host: '設定ファイルを渡したときだけ省けます。省くと、ファイルに記録したホストを使います。'
    behaviors:
      - id: PW-PROJECT-ACTIVATE-01
        pattern: event
        statement: '`--host` を付けてプロジェクトを渡さずに打つと、初期化済みのプロジェクトを標準出力に一覧します'
      - id: PW-PROJECT-ACTIVATE-02
        pattern: event
        statement: '一覧にアクティブなプロジェクトがあると、その行に `[ACTIVE]` を付けます'
      - id: PW-PROJECT-ACTIVATE-03
        pattern: event
        statement: '初期化済みのプロジェクトが 1 つも無い所有者を一覧すると、`none` の行を標準出力に出します'
      - id: PW-PROJECT-ACTIVATE-04
        pattern: event
        statement: 'プロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイルを作ります'
      - id: PW-PROJECT-ACTIVATE-05
        pattern: event
        statement: 'プロジェクトの番号か名前を渡すと、そのプロジェクトをアクティブにします'
      - id: PW-PROJECT-ACTIVATE-06
        pattern: event
        statement: '設定ファイルのパスかファイル名を渡すと、`--host` を渡さなくても設定ファイルの `host` で同期します'
      - id: PW-PROJECT-ACTIVATE-07
        pattern: event
        statement: '`--owner` を省くと、認証したユーザーのプロジェクトを対象にします'
      - id: PW-PROJECT-ACTIVATE-08
        pattern: event
        statement: '既存の設定ファイルがあるプロジェクトを同期すると、リポジトリごとの `branches`・`changelog_file`・`packages`・`release_type` を引き継ぎます'
      - id: PW-PROJECT-ACTIVATE-09
        pattern: event
        statement: '既存の設定ファイルがあるプロジェクトを同期すると、`aggregation_repo` を引き継ぎます'
      - id: PW-PROJECT-ACTIVATE-10
