      - id: PW-WORKTREE-ADD-15
        pattern: event
        statement: worktree を作ると、worktree のパスを標準出力に出す
      - id: PW-WORKTREE-ADD-16
        pattern: event
        statement: --dry-run を付けて打つと、dry-run の予定の行を標準エラーに出す
      - id: PW-WORKTREE-ADD-17
        pattern: event
        statement: --dry-run を付けて打つと、予定の worktree のパスを標準出力に出す
      - id: PW-WORKTREE-ADD-18
        pattern: event
        statement: シンボリックリンクを作ると、作った数を symlinks created の count の行で標準エラーに出す
      - id: PW-WORKTREE-ADD-19
        pattern: event
        statement: 作らなかったリンクか作れなかったリンクがあると、その数を count の行で標準エラーに出す
      - id: PW-WORKTREE-ADD-20
        pattern: event
        statement: 未追跡のファイルをコピーすると、コピーした数を files copied の count の行で標準エラーに出す
      - id: PW-WORKTREE-ADD-21
        pattern: unwanted
        statement: もしコピーに失敗したファイルがあるなら、そのファイルごとに warning の行を標準エラーに出す
      - id: PW-WORKTREE-ADD-22
        pattern: unwanted
        statement: もしリンク先が無いか、リンクのパスを git が追跡しているか、リンクを作れないなら、そのリンクを作らない
      - id: PW-WORKTREE-ADD-23
        pattern: unwanted
        statement: もしリンク先が無いか、リンクのパスを git が追跡しているか、リンクを作れないなら、warning の行を標準エラーに出す
      - id: PW-WORKTREE-ADD-24
        pattern: unwanted
        statement: もし setup のコマンドが失敗したか時間切れになったなら、warning の行を標準エラーに出す
      - id: PW-WORKTREE-ADD-25
        pattern: unwanted
        statement: もし setup のコマンドが失敗したか時間切れになったなら、終了コード 0 のまま終わる
      - id: PW-WORKTREE-ADD-26
        pattern: unwanted
        statement: もし --repo が今の git の remote と食い違うなら、何も作らない
      - id: PW-WORKTREE-ADD-27
        pattern: unwanted
        statement: もし --repo が今の git の remote と食い違うなら、終了コード 1 で終わる
      - id: PW-WORKTREE-ADD-28
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、the repository is ambiguous の行を標準エラーに出す
      - id: PW-WORKTREE-ADD-29
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、終了コード 1 で終わる
      - id: PW-WORKTREE-ADD-30
        pattern: unwanted
        statement: もし devcontainer の外で打ったなら、error の行ではなく traceback を標準エラーに出す
      - id: PW-WORKTREE-ADD-31
