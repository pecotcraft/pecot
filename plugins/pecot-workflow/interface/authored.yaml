      - id: PW-RELEASE-CHECK-09
        pattern: event
        statement: '確認が通ると、`version`・`tag`・`releaseNotes` を結果に入れます。CLI では、`version`・`tag` の行とリリースノートを標準出力に出します'
      - id: PW-RELEASE-CHECK-10
