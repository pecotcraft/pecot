  PW-ISSUE-BLOCK:
    help:
      details:
        - Adds a blocked-by (prerequisite) to an Issue, or changes the wait kind and reason of an existing one.
        - issue_ref is the waiting Issue and --by is the Issue to wait for. --by may be in another repository.
        - "--wait is stack (default) or merge. With --wait merge, --reason is required, and the Waits for merge section of the body of the waiting Issue gets a line for the prerequisite and the reason. With stack, the line is removed from the section."
        - --reason with --wait stack is a usage error.
        - Only the line of the prerequisite in the Waits for merge section is written. The rest of the section and the other sections of the body are not changed.
        - The command reads the blocked-by of the waiting Issue first. A prerequisite that is already there with the same kind and reason is left as it is. One with another kind or reason only has the section rewritten. A request to add or remove is never sent for a pair that is already in that state.
        - A cycle is searched only when a new blocked-by is added. The search follows the blocked-by of --by step by step, up to 200 Issues. When it cannot be sure, the command stops, because GitHub accepts cycles of three or more Issues.
        - The writes are made in the order blocked-by, body, then board. When the body write fails, the blocked-by stays and running the same command again fixes the body.
        - After the writes, the readiness of the waiting Issue is read again. When the blocked-by and the section read back differ from what was written, it is read once more. When they still differ, the column and the Status label are not moved.
        - The column and the Status label are moved by the readiness that was read back, in the same way as the board repair of the readiness feature. An Issue that has a branch or a PR is not moved and gets a warning about the difference.
        - With --dry-run, writes dry-run lines instead of the result lines. The reads, the cycle search and the checks are still made, and nothing is written.
        - Needs a GitHub Enterprise Server of version 3.19 or later, which has issue dependencies.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot issue block example-org/my-repo/12 --by example-org/my-repo/11 --wait merge --reason "The check script is on main."
          note: Make Issue 12 wait for the merge of Issue 11.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'Issue に blocked-by（前提）を付けるか、付いている前提の待ち方と理由を変えます。'
    arguments:
      by: '待つ相手の Issue です。`owner/repo/N` の形で渡します。別のリポジトリの Issue も指せます。'
      dry_run: '何も書き込まずに、書く予定だけを出すかどうかです。'
      issue_ref: '待つ側の Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      reason: '前提のマージを待つ理由です。`--wait merge` のときは必須で、`--wait stack` のときは渡せません。'
      wait: '待ち方です。`stack`（相手のブランチの上に積みます。省くとこちら）か `merge`（相手がマージされるまで待ちます）を渡します。'
    constraints: []
    details:
      - 'Issue に blocked-by（前提）を付けるか、付いている前提の待ち方と理由を変えます。'
      - '`issue_ref` は待つ側の Issue で、`--by` は待つ相手の Issue です。`--by` は別のリポジトリの Issue でもかまいません。'
      - '`--wait` は `stack`（省くとこちら）か `merge` です。`--wait merge` のときは `--reason` が必須で、待つ側の Issue の本文の `Waits for merge` の節に、前提と理由の行を足します。`stack` のときは、その行を節から外します。'
      - '`--wait stack` で `--reason` を渡すと、使い方の誤りです。'
      - '書き込むのは、`Waits for merge` の節にある前提の行だけです。節のほかの部分と、本文のほかの節は変えません。'
      - 'まず、待つ側の Issue の blocked-by を読みます。既に付いていて種類と理由が同じ前提は、そのままにします。種類か理由が違う前提は、節だけを書き換えます。既にその状態の組には、追加と削除は求めません。'
      - '輪の探索は、新しく blocked-by を足すときだけ行います。`--by` の blocked-by を 1 段ずつたどり、200 件の Issue まで調べます。確かめきれないときは、止まります。GitHub は 3 件以上の Issue でできる輪を受け付けてしまうためです。'
      - '書き込みは、blocked-by、本文、ボードの順に行います。本文の書き込みに失敗しても、blocked-by は残ります。同じコマンドをもう一度打てば、本文が直ります。'
      - '書き込みの後で、待つ側の Issue の判定を読み直します。読み直した blocked-by と節が書いた内容と違うときは、もう一度読みます。それでも違うときは、列と Status の札を動かしません。'
      - '列と Status の札は、読み直した判定で動かします。やり方は、判定の機能のボードの修復と同じです。ブランチか PR のある Issue は動かさず、判定との食い違いを `warning` の行で知らせます。'
      - '`--dry-run` を付けると、結果の行の代わりに `dry-run` の行を出します。読み取り、輪の探索、確認は行い、何も書き込みません。'
      - 'Issue の依存関係を持つ GitHub Enterprise Server の 3.19 以上が要ります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、結果の行を出します。blocked-by には `added`・`unchanged`・`updated` のどれかを出し、列か札を変えたときは続けて `moved` と `set` を出します。`updated` の行の末尾には、`(wait: merge)` か `(wait: stack)` が付きます。`warning` の行は、次のときに出します。Issue に着手の跡があるとき。判定を出せないか、確かめられないとき。ボードに Blocked の選択肢が無いとき。ボードに書けなかったとき。Blocked が無いときは、`pecot project init` の実行を案内する `hint` の行が続きます。失敗ごとに `error` の行を出します。輪のときは、たどった Issue を `#A -> #B -> #A` の形で出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'blocked-by を付けたか変えました。または、何も変える必要がありませんでした。ボードに関する `warning` が出ても、終了コードは 0 です。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。待つ側の Issue のリポジトリがプロジェクトにありません。Issue が既に 50 件の blocked-by を持っています。輪を除けると確かめられませんでした。GitHub Enterprise Server が Issue の依存関係に対応していません。GitHub API がエラーを返しました。'
      - code: 2
        when: '次のどれかです。Issue の参照の形が誤っています。`--by` が輪（Issue 自身を含みます）になります。`--wait merge` で `--reason` がありません。`--wait stack` で `--reason` を渡しました。ほかのコマンドラインの誤りがあります。'
      - code: 3
        when: '本文の `Waits for merge` の節を読めません。'
    on_error: '前提を付けた後で本文の書き込みに失敗したときは、blocked-by は残り、終了コード 1 で終わります。ボードに書けないときは、blocked-by と本文は残り、`warning` を出すだけです。'
    effects:
      - target: github
        kind: write
        what: 'blocked-by を付け、待つ側の Issue の本文を書き換え、そのボードの項目の列と Status の札を設定します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、待つ側の Issue の blocked-by と本文、輪の探索、読み直した判定、ボードの項目を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: "pecot issue block example-org/my-repo/12 --by example-org/my-repo/11 --wait merge --reason \"The check script is on main.\""
        note: 'Issue 12 が、Issue 11 のマージを待つようにします。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
