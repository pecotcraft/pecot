        url: '作ったリリースの URL です。`dry_run` のときは入りません。'
        releaseNotes: 'CHANGELOG から取ったリリースノートです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も作っていません。'
    diagnostics: '標準エラーに、作ったリリースの結果の行を出します。`--dry-run` のときは、予定の行を出します。`--repo` が git remote と違うときは、`warning` の行を出します。失敗したときは、`error` の行を出します。remote の URL から `owner/repo` を読めず `--repo` があるときは、`warning: using --repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`--repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `--repo` の案内の行を続けます。'
