  PW-SESSION-STATUS:
    constraints: []
    details:
      - Shows the current branch, the origin repository, the Issue inferred from the branch name and the session flag state.
      - The Issue is inferred from the number at the end of the branch name after the last slash.
      - The branch and the origin repository are read in --directory.
      - The flag file .pecot-active is read from .pecot/state/ of the project root, which is resolved from the working directory of the command, not from --directory.
      - The flag table has one row per flag with the flag name, set or unset, and the content of the file.
      - When .pecot-active holds an Issue reference, an Active Issue section follows with the number, the title and the state of the Issue.
      - The body of the Issue follows in the section when it is not empty.
      - The command is a diagnostic, so a value that cannot be read is shown as unknown or none, or left out, and does not fail the command.
      - Nothing is written.
    stdin: none
    output:
      format: text
      description: Markdown with a Session status heading, the Branch, Repository and Inferred Issue lines, the flag table, and an Active Issue section when the active Issue could be read.
    diagnostics: A warning line on stderr when .pecot-active holds an Issue reference and the active Issue cannot be read, including when there is no active project. A traceback when the project root cannot be determined, or when .pecot-active holds an Issue reference and the active config file is broken.
    environment: []
    exit_status:
      - code: 0
        when: The status was printed, including when the branch, the repository or the active Issue could not be read.
      - code: 1
        when: The project root cannot be determined (a traceback is printed), or .pecot-active holds an Issue reference and the active config file is broken (a traceback is printed).
      - code: 2
        when: --directory is missing or is not an existing directory, or another command line error occurs.
    on_error: default
    effects:
      - target: git
        kind: read
        what: Reads the current branch and the origin remote URL of the directory.
      - target: file
        kind: read
        what: Reads .pecot-active under .pecot/state/ and the active config file.
      - target: github
        kind: read
        what: Reads the title, the state and the body of the Issue held in .pecot-active.
    prerequisites: []
    idempotent: true
    examples:
      - run: pecot session status -D .
        note: Show the session state of the current repository.
    default_notes: {}
    behaviors:
      - id: PW-SESSION-STATUS-01
        pattern: event
        statement: --directory を渡して打つと、ブランチ・リポジトリ・推定した Issue・フラグの表を Markdown で標準出力に出す
      - id: PW-SESSION-STATUS-02
        pattern: event
        statement: ブランチ名の末尾が番号だと、その番号を Inferred Issue の行に出す
      - id: PW-SESSION-STATUS-03
        pattern: event
        statement: .pecot-active があると、フラグの表にその行を set と内容で出す
      - id: PW-SESSION-STATUS-04
        pattern: event
        statement: .pecot-active が無いと、フラグの表にその行を unset で出す
      - id: PW-SESSION-STATUS-05
        pattern: event
        statement: .pecot-active に Issue の参照があると、GitHub から読んだ Issue の番号・題名・状態を Active Issue の節に出す
      - id: PW-SESSION-STATUS-06
        pattern: event
        statement: 読んだ Issue に本文があると、本文を Active Issue の節に続けて出す
      - id: PW-SESSION-STATUS-07
        pattern: unwanted
        statement: もしブランチ名を読めないなら、Branch の行に unknown を出す
      - id: PW-SESSION-STATUS-08
        pattern: unwanted
        statement: もしブランチ名を読めないなら、処理を続ける
      - id: PW-SESSION-STATUS-09
        pattern: unwanted
        statement: もし origin のリポジトリを読めないなら、Repository の行に unknown を出す
      - id: PW-SESSION-STATUS-10
        pattern: unwanted
        statement: もし origin のリポジトリを読めないなら、処理を続ける
      - id: PW-SESSION-STATUS-11
        pattern: unwanted
        statement: もしブランチ名の末尾が番号でないなら、Inferred Issue の行に none を出す
      - id: PW-SESSION-STATUS-12
        pattern: unwanted
        statement: もしブランチ名の末尾が番号でないなら、処理を続ける
      - id: PW-SESSION-STATUS-13
        pattern: unwanted
        statement: もし .pecot-active の内容が Issue の参照として読めないなら、Active Issue の節を出さない
      - id: PW-SESSION-STATUS-14
        pattern: unwanted
        statement: もし .pecot-active の内容が Issue の参照として読めないなら、処理を続ける
      - id: PW-SESSION-STATUS-15
        pattern: unwanted
        statement: もし .pecot-active に Issue の参照があるのにアクティブなプロジェクトが無いなら、Active Issue の節を出さない
      - id: PW-SESSION-STATUS-16
        pattern: unwanted
        statement: もし .pecot-active に Issue の参照があるのにアクティブなプロジェクトが無いなら、warning の行を標準エラーに出す
      - id: PW-SESSION-STATUS-17
        pattern: unwanted
        statement: もし .pecot-active に Issue の参照があるのに Issue を GitHub から読めないなら、Active Issue の節を出さない
      - id: PW-SESSION-STATUS-18
        pattern: unwanted
        statement: もし .pecot-active に Issue の参照があるのに Issue を GitHub から読めないなら、warning の行を標準エラーに出す
      - id: PW-SESSION-STATUS-19
        pattern: unwanted
        statement: もし --directory を省いたなら、終了コード 2 で終わる
      - id: PW-SESSION-STATUS-20
        pattern: unwanted
        statement: もし --directory が存在するディレクトリでないなら、終了コード 2 で終わる
      - id: PW-SESSION-STATUS-21
        pattern: unwanted
        statement: もし .pecot-active に Issue の参照があり、アクティブな設定ファイルの形式が不正なら、traceback を標準エラーに出す
      - id: PW-SESSION-STATUS-22
        pattern: unwanted
        statement: もし .pecot-active に Issue の参照があり、アクティブな設定ファイルの形式が不正なら、終了コード 1 で終わる
  PW-UPDATE-ISSUE-STATUS:
    constraints: []
    details:
      - Sets the Status of an Issue that is already on the project board of the active project.
      - The Issue reference is owner/repo/N or the short form N.
      - The short form N refers to the Issue of the repository given by the global pecot --repo.
      - Without --repo, the short form N refers to the Issue of the repository of the git remote.
      - The status is backlog, pending, ready, active, in_review or archived.
      - The status is checked before the config file is read.
      - The repository of the Issue must be registered in the active project, and the Issue must be on the board.
      - Unlike add-to-project, which only warns, a status that the board does not define stops the command with exit status 1.
    stdin: none
    output:
      format: none
    diagnostics: A result line on stderr for the Status (set), and an error line with the valid values when the status is invalid.
    environment: []
    exit_status:
      - code: 0
        when: The Status was set.
      - code: 1
        when: The status is not one of the valid values, there is no active project, the repository is not in the project, the Issue is not on the board, the board does not define the status, the GitHub API returned an error, or the project root cannot be determined.
      - code: 2
        when: The Issue reference is malformed, or the short form is given without a repository, or another command line error occurs.
    on_error: default
    effects:
      - target: github
        kind: read
        what: Reads the repositories linked to the project and the board item of the Issue.
      - target: github
        kind: write
        what: Sets the Status field of the board item.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host, with permission to edit the project.
    idempotent: true
    examples:
      - run: pecot update-issue-status example-org/my-repo/123 in_review
        note: Move the Issue to In Review.
    default_notes: {}
    behaviors:
      - id: PW-UPDATE-ISSUE-STATUS-01
        pattern: event
        statement: Issue の参照と Status を渡して打つと、ボード上のその Issue の Status を渡した値にする
      - id: PW-UPDATE-ISSUE-STATUS-02
        pattern: event
        statement: Issue の参照に番号だけを渡して --repo を付けると、そのリポジトリの Issue の Status を設定する
      - id: PW-UPDATE-ISSUE-STATUS-03
        pattern: event
        statement: Issue の参照に番号だけを渡して --repo を省くと、git の remote のリポジトリの Issue を対象にする
      - id: PW-UPDATE-ISSUE-STATUS-04
        pattern: event
        statement: Status を設定すると、set の行を標準エラーに出す
      - id: PW-UPDATE-ISSUE-STATUS-05
        pattern: unwanted
        statement: もし Status が backlog・pending・ready・active・in_review・archived のどれでもないなら、有効な値を並べた error の行を標準エラーに出す
      - id: PW-UPDATE-ISSUE-STATUS-06
        pattern: unwanted
        statement: もし Status が backlog・pending・ready・active・in_review・archived のどれでもないなら、終了コード 1 で終わる
      - id: PW-UPDATE-ISSUE-STATUS-07
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-UPDATE-ISSUE-STATUS-08
        pattern: unwanted
        statement: もし Issue の参照が不正なら、終了コード 2 で終わる
      - id: PW-UPDATE-ISSUE-STATUS-09
        pattern: unwanted
        statement: もし Issue のリポジトリがプロジェクトに登録されていないなら、終了コード 1 で終わる
      - id: PW-UPDATE-ISSUE-STATUS-10
        pattern: unwanted
        statement: もし Issue がボードに無いなら、add-to-project を案内する error の行を標準エラーに出す
      - id: PW-UPDATE-ISSUE-STATUS-11
        pattern: unwanted
        statement: もし Issue がボードに無いなら、終了コード 1 で終わる
      - id: PW-UPDATE-ISSUE-STATUS-12
        pattern: unwanted
        statement: もしボードが Status を定義していないなら、終了コード 1 で終わる
      - id: PW-UPDATE-ISSUE-STATUS-13
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
  PW-WORKTREE-ADD:
    constraints: []
    details:
      - Creates a worktree of the repository in -D under <project root>/<wtN>/<repository directory name>, on a new branch named wtN.
      - The project root is the parent of base/ in the layout <project root>/base/<repository>.
      - A repository outside that layout stops the command.
      - Joins the lowest numbered wtN set that has no worktree of this repository yet, and starts the set max(N)+1 when every set already has one.
      - wt1 to wt9 are the limit.
      - Creates the branch from origin/<base> with that branch as its upstream, where <base> is --base or the develop_branch of the repository in the active project.
      - When the branch wtN already exists, stops unless its upstream is origin/<base> or --allow-existing-branch is given.
      - A matching branch that no worktree uses is deleted and created again.
      - Runs git worktree prune on the main worktree before it creates the worktree, also with --dry-run.
      - Needs .pecot/config/worktree-config.json and .pecot/config/.worktreeignore in the main worktree, which pecot worktree init creates.
      - The repository must be registered in the active project.
      - Creates the symlinks of worktree-config.json, then copies the git-ignored files of the main worktree that .worktreeignore does not exclude and that are not under a created symlink, then runs the setup command in the new worktree.
      - With --path, the worktree is created at that path, and the copied files go to that path.
      - With --path, the symlinks and .pecot/.gitignore are created in the worktree at that path.
      - When a link path starts with .pecot/, writes .pecot/.gitignore in the new worktree by running a script of the plugin before it links.
      - The setup command is --setup, or setup_command of worktree-config.json, and runs through the shell with a closed stdin and the timeout setup_command_timeout.
      - A failed or timed out setup command is a warning and does not change the exit status.
      - A link whose target does not exist, whose path is tracked by git or that cannot be created is skipped with a warning, and does not change the exit status.
      - Needs a devcontainer.
      - The command stops before it runs when none of the checks passes.
    stdin: none
    output:
      format: text
      description: The path of the created worktree on one line. With --dry-run, the planned path.
    diagnostics: A created line (a dry-run line with --dry-run) and count lines for the symlinks and the copied files on stderr. A warning line for each link that was skipped, each file that could not be copied and a failed setup command. An error line for a failure. Outside a devcontainer, a traceback instead of an error line.
    environment:
      - name: REMOTE_CONTAINERS
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: CODESPACES
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: DEVCONTAINER
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
    exit_status:
      - code: 0
        when: The worktree was created, or --dry-run printed the plan. Skipped links, files that could not be copied and a failed setup command do not change it.
      - code: 1
        when: --repo differs from the current git remote, --repo is omitted outside a git repository, the main worktree cannot be found, the repository is not in the base/ layout, worktree-config.json or .worktreeignore is missing or worktree-config.json is invalid, the origin remote cannot be read, there is no active project, the repository is not registered in it, develop_branch is not set and --base is omitted, every set from wt1 to wt9 is in use, the branch wtN exists with another upstream, git worktree add failed, or the command runs outside a devcontainer (a traceback is printed).
      - code: 2
        when: -D is missing or is not an existing directory, or another command line error occurs.
    on_error: Stops at the first error. When worktree-config.json is found invalid after git worktree add, the worktree and its branch stay without links, copied files or the setup run. Pruned metadata and a deleted unused branch stay as they are.
    effects:
      - target: git
        kind: write
        what: Prunes stale worktree metadata also with --dry-run, creates the worktree and the branch wtN, and sets the upstream.
      - target: git
        kind: destructive
        what: Deletes an existing local branch wtN that matches the expected upstream and has no worktree.
      - target: file
        kind: read
        what: Reads worktree-config.json, .worktreeignore and the active config file.
      - target: file
        kind: write
        what: Creates the symlinks, replaces an existing symlink, copies the git-ignored files, and writes .pecot/.gitignore in the new worktree.
      - target: file
        kind: destructive
        what: Deletes an existing real file or directory at a link path in the new worktree.
      - target: process
        kind: write
        what: Runs the setup command through the shell and the script that writes .pecot/.gitignore.
    prerequisites:
      - The command runs in a devcontainer.
      - The repository is in the layout <project root>/base/<repository>, and its worktree config files exist (pecot worktree init).
      - An active project exists, and the repository is registered in it.
    idempotent: false
    examples:
      - run: pecot worktree add -D .
        note: Create the next worktree of the repository in the current directory.
      - run: pecot worktree add -D . --dry-run
        note: Show the worktree that would be created.
      - run: pecot worktree add -D . --base develop --setup "pnpm install"
        note: Branch from develop and run a setup command after creation.
    default_notes:
      base: The develop_branch of the repository in the active project.
      path: <project root>/<wtN>/<repository directory name>.
      setup: The setup_command of worktree-config.json; without it, no command runs.
    behaviors:
      - id: PW-WORKTREE-ADD-01
        pattern: event
        statement: リポジトリを -D に渡して打つと、プロジェクトのルートの下の wtN にそのリポジトリの worktree を作る
      - id: PW-WORKTREE-ADD-02
        pattern: event
        statement: worktree を作ると、wtN と同じ名前のブランチを origin/<ベース> を upstream にして作る
      - id: PW-WORKTREE-ADD-03
        pattern: event
        statement: リポジトリの worktree がまだ無い wtN があると、その中で番号が最小のセットに worktree を作る
      - id: PW-WORKTREE-ADD-04
        pattern: event
        statement: すべての wtN にリポジトリの worktree が既にあると、最大の番号の次のセットに worktree を作る
      - id: PW-WORKTREE-ADD-05
        pattern: event
        statement: --base を付けて打つと、そのブランチをベースにする
      - id: PW-WORKTREE-ADD-06
        pattern: event
        statement: --base を省いて打つと、アクティブなプロジェクトの設定の develop_branch をベースにする
      - id: PW-WORKTREE-ADD-07
        pattern: event
        statement: --path を付けて打つと、その場所に worktree を作る
      - id: PW-WORKTREE-ADD-08
        pattern: event
        statement: --no-link を付けて打つと、シンボリックリンクを作らない
      - id: PW-WORKTREE-ADD-09
        pattern: event
        statement: --no-copy を付けて打つと、未追跡のファイルをコピーしない
      - id: PW-WORKTREE-ADD-10
        pattern: event
        statement: --setup を付けて打つと、worktree の中でそのコマンドを実行する
      - id: PW-WORKTREE-ADD-11
        pattern: event
        statement: --setup を省いて worktree-config.json に setup_command があると、worktree の中でそのコマンドを実行する
      - id: PW-WORKTREE-ADD-12
        pattern: event
        statement: --allow-existing-branch を付けて打つと、upstream の違う既存のブランチを再利用する
      - id: PW-WORKTREE-ADD-13
        pattern: event
        statement: --dry-run を付けて打つと、何も作らない
      - id: PW-WORKTREE-ADD-14
        pattern: event
