      - id: PW-DEPENDABOT-SYNC-11
        pattern: event
        statement: 自動マージの対象の PR が競合したまま、最後の push と base の最新コミットの遅い方から 30 分を超えると、その PR を表に載せる
      - id: PW-DEPENDABOT-SYNC-12
        pattern: event
