  PW-ISSUE-COMMENT:
    help:
      details:
        - "Has three modes: --prepare, a file argument and -m."
        - When more than one mode is given, --prepare wins over the file and the file wins over -m.
        - With --prepare, copies the template of the given kind to .pecot/tmp/output/ and prints its path.
        - With --prepare and --issue, fills issue_ref in the front matter of the copy with the given reference.
        - With a file, posts its body as a comment on the Issue named by issue_ref in its front matter.
        - With -m, posts the given body as a comment on the Issue given by --issue.
        - A file is validated against the template named in its front matter, and -m against the template given by -t.
        - A file that has comment_url updates that comment instead of posting a new one.
        - After posting from a file, writes the URL of the new comment back to comment_url in that file.
        - comment_url must point to a comment on the Issue named by issue_ref.
        - With a file, a repository that is not in the project gives a warning and the comment is still posted.
      examples:
        - run: pecot issue comment --prepare -t plan -i example-org/my-repo/12
          note: Write a plan template for Issue 12 and print its path.
        - run: pecot issue comment .pecot/tmp/output/comment-plan-20260101-120000.md
          note: Post the comment in the file, or update it when the file has comment_url.
      default_notes:
        issue: No default. Required with -m; with --prepare, issue_ref in the copy stays empty when omitted; with a file, issue_ref comes from the front matter. The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
        template: No default. Required with --prepare and -m; with a file, the template comes from the front matter.
    summary: Issue にコメントを投稿します。
    arguments:
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      issue: 'Issue の参照です。`owner/repo/123` の形で渡します。'
      message: 'コメントの本文です。'
      prepare: 'テンプレートを作業用のディレクトリにコピーするかどうかです。'
      template: 'テンプレートの種類です。`plan`・`merge-diff`・`review-findings`・`review-resolution`・`precede-notify` のどれかを渡します。'
    constraints:
      - requires: {message: [issue, template]}
      - requires: {prepare: [template]}
    details:
      - 'モードは、`--prepare`・ファイルの引数・`-m` の 3 つです。'
      - '複数のモードを渡すと、`--prepare` がファイルより優先され、ファイルが `-m` より優先されます。'
      - '`--prepare` では、渡した種類のテンプレートを `.pecot/tmp/output/` にコピーし、そのパスを出します。'
      - '`--prepare` に `--issue` を付けると、コピーのフロントマターの `issue_ref` に、渡した参照を入れます。'
      - 'ファイルでは、フロントマターの `issue_ref` の Issue に、ファイルの本文をコメントとして投稿します。'
      - '`-m` では、渡した本文を `--issue` の Issue にコメントとして投稿します。'
      - 'ファイルはフロントマターに書いたテンプレートで、`-m` は `-t` で渡したテンプレートで、本文を検証します。'
      - '`comment_url` のあるファイルは、新しいコメントを投稿せず、そのコメントを書き換えます。'
      - 'ファイルから投稿した後、新しいコメントの URL をそのファイルの `comment_url` に書き戻します。'
      - '`comment_url` は、`issue_ref` の Issue のコメントを指していなければなりません。'
      - 'ファイルでは、リポジトリがプロジェクトに無いと `warning` を出しますが、コメントは投稿します。'
    stdin: none
    output:
      format: text
      description: '`--prepare` のときは、テンプレートのコピーのパスです。それ以外では、投稿したか書き換えたコメントの URL です。'
    diagnostics: '標準エラーに、コメントの結果の行（`created` か `updated`）を出します。ファイルのリポジトリがプロジェクトに無いときと、`comment_url` を書き戻せないときは、`warning` の行を出します。本文がテンプレートに合わないときは、`error` の行を 1 つ出します。その 1 行目はテンプレートのパスです。続けて、字下げした行で次の違反を出します。足りない節、見出しの要約の規則の違反、使えない記法、折りたたみの規則の違反、テンプレートに無い見出しです。'
    environment: []
    exit_status:
      - code: 0
        when: 'テンプレートをコピーしました。または、コメントを投稿したか書き換えました。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。モードの引数がありません。`--prepare` か `-m` に `-t` がありません。`-m` に `--issue` がありません。フロントマターを読めないか、フロントマターに `template` がありません。`comment_url` の形が誤っているか、別のホストか別の Issue を指しています。GitHub API がエラーを返しました。'
      - code: 2
        when: 'Issue の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - code: 3
        when: '本文がテンプレートに合いません。'
    on_error: '本文がテンプレートに合わないときは、何も投稿しません。コメントを投稿した後で `comment_url` を書き戻せないときは、コメントは GitHub に残り、ファイルは元のままです。`--prepare` が書いたテンプレートのコピーは、`.pecot/tmp/output/` に残ります。'
    effects:
      - target: github
        kind: write
        what: 'Issue にコメントを投稿します。または、`comment_url` のコメントを書き換えます。'
      - target: github
        kind: read
        what: 'ファイルのときに、リポジトリがプロジェクトにつながっているかどうかを確かめます。'
      - target: file
        kind: write
