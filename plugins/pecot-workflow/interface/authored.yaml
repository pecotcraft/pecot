      - id: PW-PR-CHECK-05
        pattern: event
        statement: '`warning` があるときに打つと、`warning` ごとに `warning` の行を標準エラーに出します'
      - id: PW-PR-CHECK-06
        pattern: ubiquitous
        statement: '常に、リポジトリとファイルを書き換えません'
      - id: PW-PR-CHECK-07
        pattern: unwanted
        statement: 'もしブランチが push されていないか remote とずれているなら、Push Status の `warning` を数えます'
      - id: PW-PR-CHECK-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、Git Status の `warning` を数えます'
      - id: PW-PR-CHECK-09
        pattern: unwanted
        statement: 'もし stash に項目があるなら、Stash List の `warning` を数えます'
      - id: PW-PR-CHECK-10
        pattern: unwanted
        statement: 'もし `warning` が 1 件以上あるなら、終了コード 2 で終わります'
      - id: PW-PR-CHECK-11
        pattern: unwanted
        statement: 'もし git のリポジトリでないなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-12
        pattern: unwanted
        statement: 'もし git の remote が無いなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-13
        pattern: unwanted
        statement: 'もし現在のブランチか remote のリポジトリを決められないなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-14
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-15
        pattern: unwanted
        statement: 'もし `develop_branch` が設定に無いなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-16
        pattern: unwanted
        statement: 'もし `<remote>/<develop_branch>` が無いなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-17
        pattern: unwanted
        statement: 'もし `--directory` を渡していないなら、使い方のエラーを出して終了コード 2 で終わります'
      - id: PW-PR-CHECK-18
        pattern: event
        statement: '積んだ base の記録があるときに打つと、Base Branch の節に `<remote>/<下の段のブランチ>` を出します。そのブランチが remote から消えていれば、手元に追跡参照が残っていても `<remote>/<develop_branch>` を出します'
      - id: PW-PR-CHECK-19
        pattern: unwanted
        statement: 'もし積んだ base の記録の形が誤っているなら、終了コード 1 で終わります'
      - id: PW-PR-CHECK-20
        pattern: event
        statement: '下の段のブランチが remote にあり、手元に追跡参照が無いときに打つと、開発ブランチと比べ、`git fetch` を案内する `warning` の行を出します'
      - id: PW-PR-CHECK-21
        pattern: unwanted
        statement: 'もし積んだ記録があってブランチが remote とずれ、下の段が動いたかマージされているなら、Push Status の直し方に `pr restack` を出します'
      - id: PW-PR-CHECK-22
        pattern: unwanted
        statement: 'もしブランチが remote とずれて、載せ直しも記録の書き直しも要らないなら、直し方に `git pull --rebase` と `git push --force-with-lease` を出します'
      - id: PW-PR-CHECK-23
        pattern: unwanted
        statement: 'もし積んだブランチが remote とずれ、載せ直しが要るかを決められないなら、Push Status の直し方に `pr restack --check` を出します。下の段の PR か remote の先頭を読めないときと、下の段のブランチが消えて PR が未マージのときです'
      - id: PW-PR-CHECK-24
        pattern: unwanted
        statement: 'もし積んだブランチが remote とずれ、新しい base の上に載り終えていて記録だけが古いなら、Push Status の直し方に `pr restack` を出します'
      - id: PW-PR-CHECK-25
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが下の段の変更を持つ間、下の段の追跡参照と比べます'
      - id: PW-PR-CHECK-26
        pattern: unwanted
        statement: 'もし記録が無く、積んだ先を求められないなら、`warning: cannot infer the stacked base: <理由>` の行を出し、`develop_branch` の追跡参照と比べます'
  PW-PR-CREATE:
    help:
      details:
        - "Has three modes: --prepare, a file argument and -m."
        - When more than one mode is given, --prepare wins over the file and the file wins over -m.
        - --template is default or release.
        - With --prepare, copies the template to .pecot/tmp/output/ and prints its path.
        - With --prepare and the default template, sets base in the copy to the develop_branch of the repository.
        - "When the base record .pecot/state/.pecot-base of a stacked start exists, the default template of the current branch uses the base branch it names (the branch of the layer below) instead of develop_branch. The record is not read with --head, a head in the front matter, or the release template."
        - "When .pecot/state/.pecot-base of the worktree of the working directory is missing, the stacked base is inferred. When the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the branch counts as stacked on it. Otherwise it counts as started from the develop_branch. A warning line cannot infer the stacked base is printed when the readiness cannot be read or is blocked, when GitHub cannot be reached, or when the remote-tracking ref is missing. The inferred base is not written."
        - With --prepare and such a record, sets base in the copy to the base of the record without any network call. Without a record, reads the readiness of the work Issue to infer the base. When the base cannot be inferred, posting stops with an error and no PR is created, since a PR to the develop_branch can include the changes of the layer below; --dry-run and --prepare print the warning and go on.
        - "When the PR of the layer below is open, creates the PR on that base, and stops with exit status 3 if the base given is develop_branch."
        - "When the PR of the layer below is merged, creates the PR on develop_branch."
        - "The PR of the layer below is chosen in the order open, merged, closed. When the layer below has no open PR and is not merged, creates nothing and stops with exit status 2 with an error line that says the base branch has no open PR."
        - "When the record is malformed, stops with exit status 1 because the base cannot be decided."
        - "When the commit of the base record is not in the history of the head, a file or -m creates nothing and stops with exit status 1. Then reads the PR of the layer below and the head of that branch on the remote, and decides in the same way as pr restack whether the branch is already restacked. Only when it is, the second error line tells to rewrite the record with pr restack. The last line tells to run the command on the branch that wrote the record, or to pass --head to create the PR without the record. --prepare does not check this."
        - After the PR on a stacked base is created, registers it in the stack of the layer below, or starts a stack of the two PRs when none exists. When the PR of the layer below is not the top of its stack, does not call the add API and prints a warning that says so. When the repository has no stack API or the connection fails, prints a warning with the URL and keeps the PR.
        - "After the PR is created, reads the Issues that wait for the Issue named by the head branch, and moves their board column by the readiness judgement. Only the board items of the active project are read, and an Issue that is not on the board is skipped. When the judgement does not show the created PR, reads once more after about 1.5 seconds. Issues with a trace of work are not moved. A failure of this step, including a connection failure, only prints a warning and does not change the exit status. When the state cannot be confirmed, the warning reads: warning: could not confirm that GitHub reflects PR #<N> in the readiness of <Issue>; its column was not moved; run pecot board sync later to move it. When the Issue of the head number is not in the repository of the PR, the step prints nothing and is skipped. Dry runs and release PRs skip it."
        - With --prepare in an nx repository, adds the expected title scope as a comment on the title line.
        - "With --prepare and the default template, fills the trailing Closes # with the number of the work Issue, found from the git remote and the number that ends the current branch name. A leftover .pecot/state/.pecot-active is not read, so a clone without .pecot/state/ gets the same Closes."
        - "The Closes # of the copy is left empty when that Issue is an Epic."
        - With a file, the repository, base, title, head and draft come from its front matter and the options of the same names are ignored.
        - With -m, the repository is --repo, or the only repository of the active project when --repo is omitted.
        - "Unless the template is release or --no-issue-ref is given, appends Closes #N to the body when it does not mention the number N that ends the head branch name."
        - With a file, Closes is not appended when that Issue is an Epic.
        - Checks the title, body and base, and stops with exit status 3 when the Issue reference, a required section, the heading summaries, the notation, the Summary screenshot or the base branch is wrong.
        - In a repository whose release type is nx, also stops with exit status 3 when the title scope differs from the scope of the changed nx projects.
        - "For a stacked base, the changed files of the scope come from the diff between the commit of the base record and the head when the PR of the layer below is merged, and from the diff against the branch of the layer below while that PR is open. The scope hint of --prepare comes from the commit of the record."
        - Unless --dry-run is given, runs the same checks as pr check on the current directory and stops with exit status 2 when they find a warning. The fix of the Push Status warning on a stacked branch that has diverged is decided as in pr check.
        - "With --dry-run, validates and writes dry-run: would lines without creating the PR."
        - "With --dry-run and an open PR of the layer below, also writes the line dry-run: would add the new PR to the stack of PR #<below>."
        - After the PR is created, sets the Issue named by the head branch to In Review unless the template is release.
      examples:
        - run: pecot pr create --prepare
          note: Write a PR template and print its path.
        - run: pecot pr create .pecot/tmp/output/pr-create-20260101-120000.md --dry-run
          note: Validate the file without creating the PR.
        - run: 'pecot pr create -m "<body>" -t "feat: add a report" -b develop -r example-org/my-repo'
          note: Create a PR from the command line.
      default_notes:
        head: The current branch. The related Issue is the number that ends the head branch name.
        repo: With -m, the only repository of the active project when there is exactly one. With a file, the repository in the front matter.
    summary: PR（プルリクエスト）を作ります。
    arguments:
      base: 'base ブランチです。`-m` では必須です。'
      draft: 'ドラフトの PR として作るかどうかです。'
      dry_run: '検証だけを行うかどうかです。事前の確認を飛ばし、PR は作りません。'
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      head: 'head ブランチです。'
      message: 'PR の本文です。コマンドラインから直接渡します。'
      no_issue_ref: '関連する Issue の自動の設定を飛ばすかどうかです。ブランチ名から番号を取り出さず、本文へ足さず、検証もしません。'
      prepare: 'テンプレートを作業用のディレクトリにコピーするかどうかです。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。`-m` と一緒に使います。'
      screenshot: 'Summary の画像を省く理由です。`-m` と一緒に使います。'
      template: 'PR のテンプレートの種類です。`default` か `release` を渡します。'
      title: 'PR の題です。`-m` では必須です。'
    constraints:
      - requires: {message: [title, base]}
      - conflicts: [file, screenshot]
    details:
      - 'モードは、`--prepare`・ファイルの引数・`-m` の 3 つです。'
      - '複数のモードを渡すと、`--prepare` がファイルより優先され、ファイルが `-m` より優先されます。'
      - '`--template` は、`default` か `release` です。'
      - '`--prepare` では、テンプレートを `.pecot/tmp/output/` にコピーし、そのパスを出します。'
      - '`--prepare` と `default` のテンプレートでは、コピーの base をリポジトリの `develop_branch` にします。'
      - '積んで着手した記録 `.pecot/state/.pecot-base` があると、base は `develop_branch` ではなく、記録の base（下の段のブランチ）です。今のブランチの `default` のテンプレートだけが対象です。`--head`・フロントマターの `head`・`release` のテンプレートでは、記録を読みません。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチに積んだものとします。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`warning: cannot infer the stacked base` の行を出します。求めた結果は書きません。'
      - '記録があるときの `--prepare` は、通信せずに、コピーの base を記録の base にします。記録が無ければ、作業中の Issue の判定を読んで base を求めます。'
      - '積んだ先を求められないとき、投稿は `error` の行を出して止まり、PR を作りません。開発ブランチ向けの PR に、下の段の差分が入りうるためです。`--dry-run` と `--prepare` は `warning` の行を出して続けます。'
      - '下の段の PR が開いているときは、その base で PR を作ります。渡した base が `develop_branch` なら、終了コード 3 で止まります。'
      - '下の段の PR がマージ済みのときは、`develop_branch` を base にして PR を作ります。'
      - '下の段の PR は、開いている・マージ済み・閉じた、の順に選びます。'
      - '下の段の PR が無く、マージもされていないときは、PR を作りません。base ブランチに開いた PR が無いと書いた `error` の行を出し、終了コード 2 で止まります。'
      - '記録の形が誤っているときは、base を決められないので、終了コード 1 で止まります。'
      - '記録のコミットが head の履歴に無いときは、ファイルと `-m` の投稿では PR を作らず、終了コード 1 で止まります。このとき、下の段の PR と remote の先頭を読み、`pr restack` と同じ判断で載せ直し済みかを決めます。載せ直し済みと決まったときだけ、`error` の 2 行目で `pr restack` で記録を書き直すことを案内します。最後の行で、記録を書いたブランチで打つか、`--head` を渡して記録なしで作るかを案内します。`--prepare` では確かめません。'
      - '積んだ base の PR を作った後、下の段のスタックに登録します。スタックが無ければ、2 つの PR で新しく作ります。下の段の PR がスタックの一番上に無いときは、追加を呼ばず、そのことを書いた `warning` の行を出します。スタックの API が無いリポジトリと接続の失敗では、URL を添えた `warning` の行を出し、PR は残します。'
      - 'PR を作った後、head ブランチが指す Issue を待っている Issue を読み、判定に従って列を動かします。読むのは、アクティブなプロジェクトのボードの項目だけで、ボードに載っていない Issue は飛ばします。判定に作った PR が出ていないときは、約 1.5 秒待ってから 1 回だけ読み直します。着手の跡がある Issue は動かしません。接続の失敗を含め、この処理の失敗は `warning` の行にとどめ、終了コードを変えません。状態を確かめられないときは、`warning: could not confirm that GitHub reflects PR #<N> ...` の行を出します。後から `pecot board sync` で列を直せると添えます。head の番号の Issue が PR のリポジトリに無いときは、何も出さずに飛ばします。`--dry-run` とリリースの PR では行いません。'
      - 'nx のリポジトリの `--prepare` では、期待する題の scope を、題の行にコメントとして足します。'
      - '`--prepare` と `default` のテンプレートでは、末尾の `Closes #` に、作業中の Issue の番号を入れます。作業中の Issue は、git remote と今のブランチ名の末尾の番号から求めます。古い版の `.pecot/state/.pecot-active` が残っていても読まないので、`.pecot/state/` の無い clone でも同じ `Closes` が入ります。'
      - 'その Issue が Epic のときは、コピーの `Closes #` を空のままにします。'
      - 'ファイルでは、リポジトリ・base・題・head・draft をフロントマターで決めます。同じ名前のオプションは無視します。'
      - '`-m` では、リポジトリは `--repo` です。`--repo` を省くと、アクティブなプロジェクトの唯一のリポジトリです。'
      - '本文が head ブランチ名の末尾の番号 N に触れていないと、本文に `Closes #N` を足します。テンプレートが `release` のときと、`--no-issue-ref` を付けたときは足しません。'
      - 'ファイルでは、その Issue が Epic のときは `Closes` を足しません。'
      - '題・本文・base を確かめ、次のどれかが誤っていると終了コード 3 で止まります。Issue の参照、必須の節、見出しの要約、記法、Summary のスクリーンショット、base ブランチです。'
      - 'リリースの種類が nx のリポジトリでは、題の scope が、変更した nx のプロジェクトの scope と違うときも、終了コード 3 で止まります。'
      - '積んだ base の scope は、下の段の PR がマージ済みなら、記録のコミットから head までの差分で求めます。開いている間は、下の段のブランチとの差分で求めます。`--prepare` の目安は、記録のコミットから求めます。'
      - '`--dry-run` を付けなければ、今のディレクトリを `pr check` と同じように確かめ、`warning` が見つかると終了コード 2 で止まります。積んだブランチが remote とずれたときの Push Status の直し方も、`pr check` と同じに決めます。'
      - '`--dry-run` を付けると、検証して `dry-run: would` の行を書き、PR は作りません。'
      - '`--dry-run` で下の段の PR が開いているときは、スタックへの登録の予定も書きます。行は `dry-run: would add the new PR to the stack of PR #<下>` です。'
      - 'PR を作った後、head ブランチが指す Issue を In Review にします。テンプレートが `release` のときは行いません。'
    stdin: none
    output:
      format: text
      description: '`--prepare` のときは、テンプレートのコピーのパスです。それ以外では、作った PR の URL です。`--dry-run` のときは、何も出しません。'
    mcp_output:
      fields:
        url: '作った PR の URL です。`dry_run` のときと `prepare` のときは入りません。'
        number: '作った PR の番号です。`dry_run` のとき、`prepare` のとき、応答に番号が無いときは入りません。'
        head: 'PR の head ブランチです。`prepare` のときは入りません。'
        base: 'PR の base ブランチです。`prepare` のときは、下書きに入れた base です。入れなかったときは入りません。'
        title: 'PR のタイトルです。`prepare` のときは入りません。'
        inReview: 'Status を In Review にした Issue の番号です。設定しなかったときは入りません。'
        stack: 'PR の積み方です。積まない PR では入りません。`lower`（下の段の PR の番号）を必ず持ちます。`registered`（スタックに登録したか）と `number`（スタックの番号。登録したときだけ）は、`dry_run` のときは入りません。'
        moves: 'この PR を待っていた Issue のうち、列か Status を書いたものの配列です。`dry_run` のときと `prepare` のときは入りません。要素は `issue`・`reason` を必ず持ち、`from`・`to`・`label` は `board_sync` の `moves` と同じです。'
        file: '書き出した下書きのファイルの絶対パスです。`prepare` のときだけ入ります。'
        dryRun: '`dry_run` のときだけ `true` で入ります。PR は作っていません。'
    diagnostics: '標準エラーに、PR の結果の行（`created`）と、ボードの status の結果の行（`set`）を出します。積んだ base のときは、スタックの結果の行（`added: PR #N to stack #S`）も出します。待っていた Issue を動かしたときは、`moved:` の行も出します。`--prepare` のときは、base・題の scope の目安・`Closes` の `set` の行を出します。`--dry-run` のときは、PR と status の `dry-run: would` の行を出し、下の段の PR が開いていれば、登録の予定の行も出します。行は `dry-run: would add the new PR to the stack of PR #<下>` です。検証の失敗ごとに、`error` の行を 1 つ出します。事前の確認が `warning` を見つけたときは、`error` の行に続けて、`warning` ごとの行を出します。ボードの status を設定できないときと、Issue の種類を読めないときは、`warning` の行を出します。スタックに登録できないときは、`warning: could not register stack: <理由>` の行を出します。下の段の PR がスタックの一番上に無いときは、`warning: could not register stack: PR #<下> is not the top ...` の行を出します。待っている Issue を読めないか動かせないときも、`warning` の行を出します。確かめられないときは、`warning: could not confirm that GitHub reflects PR #<N> ...` の行を出します。下の段の PR が無いときは、`error: base branch <base> has no open PR` の行と直し方の行を出します。記録が無く積んだ先を求められないとき、投稿では `error: cannot infer the stacked base: <理由>` の行と直し方の行を出します。`--dry-run` と `--prepare` では、同じ理由の `warning` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: invalid-input
        code: 1
        when: '`--template` が `default` でも `release` でもありません。モードの引数が無いとき、`-m` に `-t` か `-b` が無いとき、ファイルと一緒に `--screenshot` を渡したときも含みます。'
