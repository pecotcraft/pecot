      - id: PW-PR-SHOW-14
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-SHOW-15
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-PROJECT-ACTIVATE:
    summary: 初期化済みのプロジェクトをアクティブにします。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      project: 'プロジェクトの番号か名前です。設定ファイルのパスかファイル名でも渡せます。候補は `project_search` で一覧します。'
    constraints: []
    details:
      - '`project` は必須です。所有者のプロジェクトは `project_search` で一覧でき、初期化済みのものとアクティブなものが分かります。'
      - '初期化済みのプロジェクトとは、`pecot-status` のフィールドか、旧い名前の `pecot-workflow-<suffix>` のフィールドを持つプロジェクトです。'
      - '`project` にプロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイル `<host>_<owner>_<番号>.json` を GitHub から作り直し、アクティブなプロジェクトにします。'
      - '`project` に設定ファイルのパスかファイル名を渡すと、ファイルに記録したホスト・所有者・番号でプロジェクトを同期し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すときは、`host` と `owner` のどちらも要りません。'
      - '設定ファイルに既にある次の値は残します。リポジトリごとの開発ブランチ・リリースブランチ・`changelog_file`・packages・リリースの種類と、`aggregation_repo` です。'
      - 'プロジェクトとのつながりが外れたリポジトリは、設定ファイルから消します。'
      - '新しくつないだリポジトリは、リポジトリの一覧の末尾に足します。'
      - '同じプロジェクトを指す、別の名前の設定ファイルがあれば、新しい名前に移し、アクティブなプロジェクトも新しい名前にします。`project` の入力と Actions の変数 `PECOT_REVIEW_PROJECT` には、新しい名前を使います。移す元が 2 つ以上あるときは、何も移さずに失敗を返します。'
      - '次の選択肢は、ボードにあるときだけ設定ファイルに書きます。pecot-status のフィールドの Blocked と、Status のフィールドの Todo・In Progress・Needs Attention です。'
      - 'Blocked の選択肢の無いボードも受け付けます。pecot-status のフィールドのほかの 6 つの選択肢は必須です。'
      - '`host` が、渡した設定ファイルのホストと違うときは、`warnings` に入れて、設定ファイルのホストを使います。'
    stdin: none
    output:
      format: text
      description: '標準出力には何も書きません。'
    mcp_output:
      fields:
        project: 'アクティブにした設定の名前です。'
        configPath: 'プロジェクトの設定ファイルのパスです。'
        change: '設定ファイルがどうなったかです。`create`・`update`・`unchanged` のどれかです。'
        config_moved: '新しい名前に移した設定ファイルの `from`・`to` のファイル名です。移していなければ `null` です。'
    diagnostics: '標準エラーに、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。設定ファイルを移したときは、`moved` の行と、新しい名前を使うよう案内する `warning` の行を出します。`host` が渡した設定ファイルのホストと違うときは、`warning` の行を出します。このときは、設定ファイルのホストを使います。'
    environment: []
    exit_status:
      - kind: invalid-input
        when: 'プロジェクトの番号か名前を渡したのに、`host` がありません。'
      - kind: project-not-found
        when: 'プロジェクトが見つかりません。'
      - kind: not-initialized
        when: 'プロジェクトが初期化されていません。'
      - kind: config-invalid
        when: '設定ファイルを読み込めません。同じプロジェクトを指す、別の名前の設定ファイルが 2 つ以上あるときも含みます。'
      - kind: invalid-input
        when: '`project` が無いか、知らない引数など、ほかの引数の誤りがあります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
