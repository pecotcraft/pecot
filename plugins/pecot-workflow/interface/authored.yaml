  PW-PR-READ:
    constraints: []
    details:
      - Fetches one PR with a single GraphQL query.
      - Prints the title, state, draft flag, mergeability, comment count, head and base branches, closing issues, referenced issues, review states and body.
      - With --reviews, adds the review bodies and the line comments, and a pecot issue read hint under each related Issue.
      - With --json, prints the PR as JSON, and with --reviews the JSON also holds the reviews and the line comments.
      - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
    stdin: none
    output:
      format: text
      description: "Markdown that starts with a ## PR #<N> <title> heading. With --reviews, a ## Reviews section and a ## Line Comments section follow when there are reviews or line comments. With --json, a JSON object."
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: The PR was printed.
      - code: 1
        when: There is no active project, or the GitHub API returned an error.
      - code: 2
        when: The PR reference is malformed, or another command line error occurs.
    on_error: default
    effects:
      - target: github
        kind: read
        what: Reads the PR, its related Issues and, with --reviews, its reviews and line comments.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: true
    examples:
      - run: pecot pr read example-org/my-repo/123
        note: Show the PR as Markdown.
      - run: pecot pr read example-org/my-repo/123 --reviews
        note: Show the PR with its reviews and line comments.
    default_notes:
      pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    behaviors:
      - id: PW-PR-READ-01
        pattern: event
        statement: PR の参照を渡すと、見出し・状態・ブランチ・本文を Markdown で標準出力に出す
      - id: PW-PR-READ-02
        pattern: event
        statement: 関連 Issue がある PR を読むと、closing issues と参照 Issue を出す
      - id: PW-PR-READ-03
        pattern: event
        statement: レビューがある PR を読むと、レビューごとの author と状態を出す
      - id: PW-PR-READ-04
        pattern: event
        statement: --reviews を付けて打つと、レビューの本文と行のコメントを足して出す
      - id: PW-PR-READ-05
        pattern: event
        statement: --reviews を付けてレビューがあると、## Reviews の節を出す
      - id: PW-PR-READ-06
        pattern: event
        statement: --reviews を付けて行のコメントがあると、## Line Comments の節を出す
      - id: PW-PR-READ-07
        pattern: event
        statement: --reviews を付けて打つと、関連 Issue ごとに pecot issue read の案内を足す
      - id: PW-PR-READ-08
        pattern: event
        statement: --json を付けて打つと、同じ内容を JSON で標準出力に出す
      - id: PW-PR-READ-09
        pattern: event
        statement: --json と --reviews を一緒に付けて打つと、JSON にレビューと行のコメントを含める
      - id: PW-PR-READ-10
        pattern: event
        statement: 短い形 N の参照を渡すと、--repo か git の remote で補って読む
      - id: PW-PR-READ-11
        pattern: unwanted
        statement: もし PR の参照の形が誤っているなら、終了コード 2 で終わる
      - id: PW-PR-READ-12
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-PR-READ-13
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
  PW-PROJECT-ACTIVATE:
    constraints: []
    details:
      - Without a project argument, lists the initialized projects of the owner; --host is required.
      - A project is initialized when it has a pecot-workflow field.
      - The listing marks the active project with [ACTIVE].
      - When the owner has no initialized project, the listing is a none line.
      - With a project number or name, regenerates the config file of that project from GitHub and makes it the active project.
      - With a config file path or file name, syncs the project from the host, owner and number recorded in that file and makes it the active project.
      - A config file path or file name needs neither --host nor --owner.
      - The develop branch, release branch, changelog_file, packages and release type of each repository, and aggregation_repo, already in the config file are kept.
      - A repository that is no longer linked to the project is removed from the config file.
      - A newly linked repository is appended to the end of the repository list.
    stdin: none
    output:
      format: text
      description: Only when no project is given, a header line followed by one line per initialized project, with [ACTIVE] on the active one, or a none line when there is no initialized project. Nothing is written to stdout when a project is given.
    diagnostics: With a project given, result lines on stderr for the config file (created or updated) and for the active project (set). A warning line when --host differs from the host of the given config file. In that case the host of the config file is used.
    environment: []
    exit_status:
      - code: 0
        when: The projects were listed, or the project was activated.
      - code: 1
        when: --host is required but missing, the project is not found or not initialized, the config file cannot be loaded, the GitHub API returned an error, or the project root cannot be determined.
      - code: 2
        when: The command line is invalid, such as an unknown option.
    on_error: default
    effects:
      - target: github
        kind: read
        what: Reads the projects of the owner, their fields and linked repositories.
      - target: file
        kind: write
        what: Creates or updates the config file under .pecot/config/projects/ and sets the active project.
      - target: file
        kind: read
        what: Reads the config files and the active project setting.
    prerequisites:
      - A GitHub token is available for the host.
    idempotent: true
    examples:
      - run: pecot project activate --host github.com --owner example-org
        note: List the initialized projects of the owner.
      - run: pecot project activate 1 --host github.com --owner example-org
        note: Activate the project by number.
    default_notes:
      owner: The authenticated user; with a config file, the owner recorded in the file and --owner is not used.
      host: Required unless a config file is given; with a config file, the host recorded in the file.
    behaviors:
      - id: PW-PROJECT-ACTIVATE-01
        pattern: event
        statement: --host を付けてプロジェクトを渡さずに打つと、初期化済みのプロジェクトを標準出力に一覧する
      - id: PW-PROJECT-ACTIVATE-02
        pattern: event
        statement: 一覧にアクティブなプロジェクトがあると、その行に [ACTIVE] を付ける
      - id: PW-PROJECT-ACTIVATE-03
        pattern: event
        statement: 初期化済みのプロジェクトが 1 つも無い所有者を一覧すると、none の行を標準出力に出す
      - id: PW-PROJECT-ACTIVATE-04
        pattern: event
        statement: プロジェクトの番号か名前を渡すと、そのプロジェクトの設定ファイルを作る
      - id: PW-PROJECT-ACTIVATE-05
        pattern: event
        statement: プロジェクトの番号か名前を渡すと、そのプロジェクトをアクティブにする
      - id: PW-PROJECT-ACTIVATE-06
        pattern: event
        statement: 設定ファイルのパスかファイル名を渡すと、--host を渡さなくても設定ファイルの host で同期する
      - id: PW-PROJECT-ACTIVATE-07
        pattern: event
        statement: --owner を省くと、認証したユーザーのプロジェクトを対象にする
      - id: PW-PROJECT-ACTIVATE-08
        pattern: event
        statement: 既存の設定ファイルがあるプロジェクトを同期すると、リポジトリごとの branches・changelog_file・packages・release_type を引き継ぐ
      - id: PW-PROJECT-ACTIVATE-09
        pattern: event
        statement: 既存の設定ファイルがあるプロジェクトを同期すると、aggregation_repo を引き継ぐ
      - id: PW-PROJECT-ACTIVATE-10
        pattern: event
        statement: リンクを外したリポジトリがあるプロジェクトを同期すると、そのリポジトリを設定ファイルから消す
      - id: PW-PROJECT-ACTIVATE-11
        pattern: event
        statement: 新しくリンクしたリポジトリがあるプロジェクトを同期すると、そのリポジトリを設定ファイルの末尾に足す
      - id: PW-PROJECT-ACTIVATE-12
        pattern: unwanted
        statement: もし --host が要る場面で渡していないなら、終了コード 1 で終わる
      - id: PW-PROJECT-ACTIVATE-13
        pattern: unwanted
        statement: もし指定したプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-PROJECT-ACTIVATE-14
        pattern: unwanted
        statement: もし指定したプロジェクトが初期化されていないなら、終了コード 1 で終わる
      - id: PW-PROJECT-ACTIVATE-15
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-PROJECT-ACTIVATE-16
        pattern: unwanted
        statement: もし渡した設定ファイルを読めないなら、終了コード 1 で終わる
      - id: PW-PROJECT-ACTIVATE-17
        pattern: unwanted
        statement: もし --host が渡した設定ファイルの host と違うなら、warning の行を標準エラーに出す
      - id: PW-PROJECT-ACTIVATE-18
        pattern: unwanted
        statement: もし --host が渡した設定ファイルの host と違うなら、設定ファイルの host で同期する
  PW-PROJECT-CREATE:
    constraints: []
    details:
      - Creates a GitHub Projects V2 project for the owner.
      - Adds the pecot-workflow, pecot-priority and pecot-size fields to the project.
      - Writes the config file and makes the project active.
      - Stops without creating anything when the owner is not found.
      - Stops without creating anything when a project with the same title already exists.
    stdin: none
    output:
      format: none
    diagnostics: Result lines on stderr for the created project, each created field, the config file and the active project.
    environment: []
    exit_status:
      - code: 0
        when: The project was created, initialized and activated.
      - code: 1
        when: The owner is not found, a project with the same title exists, the GitHub API returned an error, the project does not conform to pecot-workflow when the config file is generated, or the project root cannot be determined.
      - code: 2
        when: A required argument or --suffix is missing, or another command line error occurs.
    on_error: When a step after the project is created fails, the project and the fields created so far remain on GitHub. When generating the config file fails, the project and its three fields remain and no config file is written.
    effects:
      - target: github
        kind: write
        what: Creates a project and its three fields.
      - target: github
        kind: read
        what: Reads the owner, the existing projects, the fields and the linked repositories.
      - target: file
        kind: write
        what: Writes the config file under .pecot/config/projects/ and sets the active project.
    prerequisites:
      - A GitHub token is available for the host, with permission to create projects for the owner.
    idempotent: false
    examples:
      - run: pecot project create example-org "Example Project" --suffix example
        note: Create a project and activate it.
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-CREATE-01
        pattern: event
        statement: 新しいタイトルを渡すと、GitHub にプロジェクトを作る
      - id: PW-PROJECT-CREATE-02
        pattern: event
        statement: プロジェクトを作ると、続けて pecot-workflow の 3 つのフィールドを足す
      - id: PW-PROJECT-CREATE-03
        pattern: event
        statement: フィールドを足すと、設定ファイルを作る
      - id: PW-PROJECT-CREATE-04
        pattern: event
        statement: 設定ファイルを作ると、そのプロジェクトをアクティブにする
      - id: PW-PROJECT-CREATE-05
        pattern: event
        statement: プロジェクトを作ると、created の行を標準エラーに出す
      - id: PW-PROJECT-CREATE-06
        pattern: unwanted
        statement: もし同じタイトルのプロジェクトが既にあるなら、終了コード 1 で終わる
      - id: PW-PROJECT-CREATE-07
        pattern: unwanted
        statement: もし所有者が見つからないなら、終了コード 1 で終わる
      - id: PW-PROJECT-CREATE-08
        pattern: unwanted
        statement: もしプロジェクトの作成で GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-PROJECT-CREATE-09
        pattern: unwanted
        statement: もし作ったプロジェクトが pecot-workflow に準拠しないなら、終了コード 1 で終わる
  PW-PROJECT-INFO:
    constraints: []
    details:
      - Shows the active project, its registered repositories and the board status.
      - The board status covers the open items in Backlog, Pending, Ready, Active and In Review.
      - Each registered repository line carries the release type and the Dependabot alert status.
      - A repository whose alerts cannot be read shows the reason and does not stop the command.
      - Narrows the board items to one repository when --repo or the global pecot --repo is given.
      - Deletes Archived items from the board except the 20 most recently updated.
      - An Archived item that cannot be deleted is skipped and the command continues.
    stdin: none
    output:
      format: text
      description: Markdown with Overview, Registered repositories and Board status sections. With --json, a JSON object with project, repositories (each with dependabot_alerts) and board.
    diagnostics: A result line on stderr for the deleted Archived items, and a warning line when some of them could not be deleted.
    environment: []
    exit_status:
      - code: 0
        when: The dashboard was printed.
      - code: 1
        when: There is no active project, the active config file is broken, the GitHub API returned an error, an unexpected error occurred, or the project root cannot be determined.
      - code: 2
        when: --repo is not in owner/repo form, or another command line error occurs.
    on_error: Archived items already deleted from the board stay deleted.
    effects:
      - target: github
        kind: read
        what: Reads the board items and the Dependabot alert status of each registered repository.
      - target: github
        kind: destructive
        what: Deletes the Archived items beyond the 20 most recently updated from the project board.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host.
    idempotent: true
    examples:
      - run: pecot project info
        note: Show the dashboard as Markdown.
      - run: pecot project info --json --repo example-org/my-repo
        note: Show the dashboard as JSON, narrowed to one repository.
    default_notes:
      repo: The value of the global pecot --repo option; without it, no narrowing.
    behaviors:
      - id: PW-PROJECT-INFO-01
        pattern: event
        statement: 引数なしで打つと、概要・登録リポジトリ・ボードの状態を Markdown で標準出力に出す
      - id: PW-PROJECT-INFO-02
        pattern: event
        statement: --json を付けて打つと、同じ内容を JSON で標準出力に出す
      - id: PW-PROJECT-INFO-03
        pattern: event
        statement: --repo を付けて打つと、ボードの項目をそのリポジトリに絞る
      - id: PW-PROJECT-INFO-04
        pattern: event
        statement: 更新の新しい 20 件を超える Archived の項目があると、超えた分をボードから削除する
      - id: PW-PROJECT-INFO-05
        pattern: event
        statement: aggregation_repo を設定していると、概要に Roadmap repo として出す
      - id: PW-PROJECT-INFO-06
        pattern: event
        statement: Dependabot alert を取れたリポジトリがあると、その行に open の件数か disabled を出す
      - id: PW-PROJECT-INFO-07
        pattern: event
        statement: Archived の項目を削除すると、deleted の行を標準エラーに出す
      - id: PW-PROJECT-INFO-08
        pattern: unwanted
        statement: もし登録したリポジトリの Dependabot alert を取れないなら、その行に失敗の理由を出す
      - id: PW-PROJECT-INFO-09
        pattern: unwanted
        statement: もし Archived の項目を削除できなかったなら、warning の行を標準エラーに出す
      - id: PW-PROJECT-INFO-10
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-PROJECT-INFO-11
        pattern: unwanted
        statement: もしボードの取得で GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-PROJECT-INFO-12
        pattern: unwanted
        statement: もし予期しないエラーが起きたなら、終了コード 1 で終わる
  PW-PROJECT-INIT:
    constraints: []
    details:
      - Adds the pecot-workflow-<suffix>, pecot-priority and pecot-size fields to an existing project.
      - A field that already exists is skipped.
      - The other fields are still created.
    stdin: none
    output:
      format: none
    diagnostics: A result line on stderr for each field, created or skipped.
    environment: []
    exit_status:
      - code: 0
        when: Every field was created or already existed.
      - code: 1
        when: The project is not found, its fields cannot be read, the GitHub API returned an error, or the project root cannot be determined.
      - code: 2
        when: A required argument or --suffix is missing, or another command line error occurs.
    on_error: Fields created before the failing one remain on the project.
    effects:
      - target: github
        kind: read
        what: Reads the projects of the owner and the fields of the target project.
      - target: github
        kind: write
        what: Creates the missing fields on the project.
    prerequisites:
      - A GitHub token is available for the host, with permission to edit the project.
    idempotent: true
    examples:
      - run: pecot project init example-org "Example Project" --suffix example
        note: Add the pecot-workflow fields to an existing project.
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-INIT-01
        pattern: event
        statement: フィールドの無いプロジェクトに打つと、pecot-workflow の 3 つのフィールドを作る
      - id: PW-PROJECT-INIT-02
        pattern: event
        statement: フィールドを作ると、created の行を標準エラーに出す
      - id: PW-PROJECT-INIT-03
        pattern: event
        statement: 既にあるフィールドがあると、そのフィールドは作らずに skipped の行を標準エラーに出す
      - id: PW-PROJECT-INIT-04
        pattern: unwanted
        statement: もし指定したタイトルのプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-PROJECT-INIT-05
        pattern: unwanted
        statement: もしフィールドの作成で GitHub API がエラーを返したなら、終了コード 1 で終わる
  PW-PROJECT-LIST:
    constraints: []
    details:
      - Lists the config files under .pecot/config/projects/ in file name order.
      - Marks the active project with [ACTIVE].
    stdin: none
    output:
      format: text
      description: A header line followed by one line per config file name, or "none" when there is no config file.
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: The list was printed.
      - code: 1
        when: The project root cannot be determined.
      - code: 2
        when: The command line is invalid, such as an unknown option.
    on_error: default
    effects:
      - target: file
        kind: read
        what: Reads the config files under .pecot/config/projects/ and the active project setting.
    prerequisites: []
    idempotent: true
    examples:
      - run: pecot project list
        note: List the config files and the active project.
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-LIST-01
        pattern: event
        statement: 設定ファイルがあると、ファイル名の順に 1 行ずつ標準出力に出す
      - id: PW-PROJECT-LIST-02
        pattern: event
        statement: アクティブなプロジェクトの設定ファイルがあると、その行の末尾に [ACTIVE] を付ける
      - id: PW-PROJECT-LIST-03
        pattern: event
        statement: 設定ファイルが 1 つも無いと、none の行を標準出力に出す
  PW-PROJECT-SEARCH:
    constraints: []
    details:
      - Lists the GitHub Projects V2 projects of a user or an organization.
      - A title longer than 38 characters is cut to 35 characters followed by "...".
    stdin: none
    output:
      format: text
      description: A header line, a blank line, a column header line, a separator line of 80 hyphens, and one line per project with its number, title and URL.
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: The projects were printed.
      - code: 1
        when: The owner has no project, the GitHub API returned an error, or the project root cannot be determined.
      - code: 2
        when: The owner argument is missing, or another command line error occurs.
    on_error: default
    effects:
      - target: github
        kind: read
        what: Reads the projects of the owner.
    prerequisites:
      - A GitHub token is available for the host.
    idempotent: true
    examples:
      - run: pecot project search example-org
        note: List the projects of an organization.
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SEARCH-01
        pattern: event
        statement: プロジェクトを持つ所有者を渡すと、番号・タイトル・URL の表を標準出力に出す
      - id: PW-PROJECT-SEARCH-02
        pattern: event
        statement: タイトルが 38 文字を超えると、35 文字に切り詰めて末尾に ... を付ける
      - id: PW-PROJECT-SEARCH-03
        pattern: unwanted
        statement: もしプロジェクトが 1 件も無いなら、終了コード 1 で終わる
      - id: PW-PROJECT-SEARCH-04
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
  PW-PROJECT-SET-AGGREGATION-REPO:
    constraints: []
    details:
      - Stores the Epic aggregation repository in the config file of the active project.
      - pecot issue create --type epic uses the stored repository as the destination.
      - Overwriting a different value always writes a warning line.
      - --yes only omits the confirmation hint from the warning line.
      - Giving the value already stored changes nothing.
    stdin: none
    output:
      format: none
    diagnostics: A result line on stderr (set, or unchanged), and a warning line when a different value is overwritten.
    environment: []
    exit_status:
      - code: 0
        when: The value was set or was already set.
      - code: 1
        when: The value is not in owner/repo form, there is no active project, the active config file is broken, or the project root cannot be determined.
      - code: 2
        when: The value argument is missing, or another command line error occurs.
    on_error: default
    effects:
      - target: file
        kind: read
        what: Reads the active config file.
      - target: file
        kind: write
        what: Writes aggregation_repo to the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
    idempotent: true
    examples:
      - run: pecot project set-aggregation-repo example-org/roadmap
        note: Set the aggregation repository.
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SET-AGGREGATION-REPO-01
        pattern: event
        statement: 未設定の状態で値を渡すと、設定ファイルに書く
      - id: PW-PROJECT-SET-AGGREGATION-REPO-02
        pattern: event
        statement: 未設定の状態で値を渡すと、set の行を標準エラーに出す
      - id: PW-PROJECT-SET-AGGREGATION-REPO-03
        pattern: event
        statement: 既にある値と同じ値を渡すと、unchanged の行を標準エラーに出す
      - id: PW-PROJECT-SET-AGGREGATION-REPO-04
        pattern: unwanted
        statement: もし既にある値と違う値を渡したなら、上書きの warning の行を標準エラーに出す
      - id: PW-PROJECT-SET-AGGREGATION-REPO-05
        pattern: event
        statement: --yes を付けて上書きすると、warning の行から確認の案内を省く
      - id: PW-PROJECT-SET-AGGREGATION-REPO-06
        pattern: unwanted
        statement: もし値が owner/repo の形でないなら、終了コード 1 で終わる
      - id: PW-PROJECT-SET-AGGREGATION-REPO-07
        pattern: unwanted
