  PW-ISSUE-CHECK:
    help:
      details:
        - Checks the Markdown files that pecot issue create would post, in the order given, and creates nothing.
        - Runs every check that issue create runs before the first Issue of a batch is created, including the reads of the parent Epics and the existing Issues named in blocked_by.
        - Prints a table of the files with their order numbers, blocked-by and approach (alone, stack on, wait for merge, join), and the stackable chains.
        - A file is named by its key, the stem of the file name.
        - --project names the project config to use. Without it, the config that includes the repository of the files is used; when several do, the active one among them.
      examples:
        - run: pecot issue check .pecot/work/12/issue-a.md .pecot/work/12/issue-b.md
          note: Show the progression table and the stackable chains without creating anything.
      default_notes: {}
    summary: '`issue_create` に渡すファイルを確かめ、番号・前提・進め方の表を返します。何も作りません。'
    arguments:
      files: 'フロントマター付きの Markdown ファイルのパスの配列です。複数渡すと、まとめて確かめます。投稿する順に渡します。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、ファイルの作り先のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブなプロジェクトを使います。'
    constraints: []
    details:
      - '`issue_create` に渡すファイルを、渡した順に確かめます。何も作りません。'
      - '一括の最初の Issue を作る前に `issue_create` が行う確認を、すべて行います。親 Epic と、`blocked_by` に書いた既存の Issue も読みます。'
