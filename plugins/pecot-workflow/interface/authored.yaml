format: 1
plugin: pecot-workflow
environment:
  - name: PECOT_GITHUB_API_URL
    effect: Sends GitHub API requests to this URL instead of the real host. Only an http://127.0.0.1 or http://localhost URL is accepted; any other value stops the command with exit status 1 before the subcommand runs. The exceptions are --version and the top-level --help, which finish first with exit status 0. An empty value is ignored.
  - name: PECOT_SESSION_PROJECT_DIR
    effect: When the working directory is inside <value>/.pecot/work (with no nested git repository in between), <value> becomes the project root instead of the git toplevel. CLAUDE_PROJECT_DIR takes precedence.
  - name: CLAUDE_PROJECT_DIR
    effect: Used as the project root when set, ahead of PECOT_SESSION_PROJECT_DIR and the git toplevel. The config files, the active project setting and the work directories are looked up under it.
  - name: CLAUDE_PLUGIN_ROOT
    effect: Locates the plugin directory. The version shown by --version is read from .claude-plugin/plugin.json under it, and the scripts that worktree commands run are looked up under it.
  - name: PECOT_GITHUB_*_TOKEN
    effect: Supplies the GitHub token for a host. The variable name is the env_var of that host in .pecot/config/hosts.json. Without an entry, the name is PECOT_GITHUB_COM_TOKEN for github.com, and PECOT_GITHUB_<HOST>_TOKEN for any other host, where <HOST> is the host name in upper case with each . replaced by _. The variable is read from the environment, after .pecot/config/.env is loaded; a line in that file does not overwrite an existing environment variable. When no token is found, GITHUB_COM_TOKEN is used for github.com, and then the token from gh auth token. When the token is rejected with 401, the command retries once with the token from gh auth token and writes a warning line; this also applies to the token from GITHUB_COM_TOKEN.
  - name: GITHUB_COM_TOKEN
    effect: Supplies the GitHub token for github.com when the variable named for that host is unset (PECOT_GITHUB_COM_TOKEN without an entry in .pecot/config/hosts.json). The variable is read from the environment, after the .env file in the project root is loaded; a line in that file does not overwrite an existing environment variable, and it is loaded after .pecot/config/.env.
entries:
  PW-ADD-TO-PROJECT:
    constraints: []
    details:
      - Adds one Issue to the project board of the active project and then sets its Status field.
      - The Issue reference is owner/repo/N or the short form N.
      - The short form N refers to the Issue of the repository given by the global pecot --repo.
      - Without --repo, the short form N refers to the Issue of the repository of the git remote.
      - The repository of the Issue must be registered in the active project.
      - --status takes backlog, pending, ready, active, in_review or archived, and the Status is set to that value.
      - An empty --status skips the Status update and only adds the Issue.
      - An Issue that is already on the board is not added twice.
      - A --status value that the board does not define is not an error.
      - The Issue stays on the board with the Status it was given on adding, and the command finishes with exit status 0.
    stdin: none
    output:
      format: none
    diagnostics: A result line on stderr for the added Issue (added) and for the Status (set), and a warning line when the Status is not found in the project.
    environment: []
    exit_status:
      - code: 0
        when: The Issue was added to the board, including when the Status was not set because the board does not define the --status value.
      - code: 1
        when: There is no active project, the repository is not in the project, the GitHub API returned an error, or the project root cannot be determined.
      - code: 2
        when: The Issue reference is malformed, or the short form is given without a repository, or another command line error occurs.
    on_error: When setting the Status fails after the Issue was added, the Issue stays on the board.
    effects:
      - target: github
        kind: read
        what: Reads the repositories linked to the project and the node ID of the Issue.
      - target: github
        kind: write
        what: Adds the Issue to the project board and sets its Status field.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host, with permission to edit the project.
    idempotent: true
    examples:
      - run: pecot add-to-project example-org/my-repo/123
        note: Add the Issue to the board with the Status ready.
      - run: pecot add-to-project example-org/my-repo/123 --status backlog
        note: Add the Issue to the board with the Status backlog.
    default_notes: {}
    behaviors:
      - id: PW-ADD-TO-PROJECT-01
        pattern: event
        statement: Issue の参照を渡して打つと、その Issue をアクティブなプロジェクトのボードに足す
      - id: PW-ADD-TO-PROJECT-02
        pattern: event
        statement: --status を省いて打つと、足した項目の Status を ready にする
      - id: PW-ADD-TO-PROJECT-03
        pattern: event
        statement: --status に値を渡して打つと、足した項目の Status をその値にする
      - id: PW-ADD-TO-PROJECT-04
        pattern: event
        statement: --status に空文字を渡して打つと、Status を設定せずに Issue だけをボードに足す
      - id: PW-ADD-TO-PROJECT-05
        pattern: event
        statement: Issue の参照に番号だけを渡して --repo を付けると、そのリポジトリの Issue を足す
      - id: PW-ADD-TO-PROJECT-06
        pattern: event
        statement: Issue の参照に番号だけを渡して --repo を省くと、git の remote のリポジトリの Issue を対象にする
      - id: PW-ADD-TO-PROJECT-07
        pattern: event
        statement: Issue をボードに足すと、added の行を標準エラーに出す
      - id: PW-ADD-TO-PROJECT-08
        pattern: event
        statement: Status を設定すると、set の行を標準エラーに出す
      - id: PW-ADD-TO-PROJECT-09
        pattern: unwanted
        statement: もし --status の値をボードが定義していないなら、Status を設定しない
      - id: PW-ADD-TO-PROJECT-10
        pattern: unwanted
        statement: もし --status の値をボードが定義していないなら、warning の行を標準エラーに出す
      - id: PW-ADD-TO-PROJECT-11
        pattern: unwanted
        statement: もし --status の値をボードが定義していないなら、終了コード 0 で終わる
      - id: PW-ADD-TO-PROJECT-12
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-ADD-TO-PROJECT-13
        pattern: unwanted
        statement: もし Issue の参照が不正なら、終了コード 2 で終わる
      - id: PW-ADD-TO-PROJECT-14
        pattern: unwanted
        statement: もし Issue のリポジトリがプロジェクトに登録されていないなら、終了コード 1 で終わる
      - id: PW-ADD-TO-PROJECT-15
        pattern: unwanted
        statement: もし GitHub API がエラーを返したなら、終了コード 1 で終わる
  PW-CREATE-BRANCH:
    constraints: []
    details:
      - Creates a branch linked to an Issue through the GitHub GraphQL API (createLinkedBranch), so the branch shows in the Development section of the Issue.
      - The Issue reference must be the full form owner/repo/N.
      - The branch is named <branch_name>/<N>, with the Issue number appended.
      - The branch starts from the head of --base, or from the develop_branch of the repository in the config file without --base.
      - After the branch is created, the Status of the Issue on the board is set to active.
      - A failure to set the Status does not stop the command.
      - After that, the Issue is recorded as the work target in .pecot/state/.pecot-active and .pecot/state/.pecot-session-title, and .pecot/work/<N>/ is created.
      - A failure to record the work target does not stop the command.
      - The repository of the working directory git remote must be the repository of the Issue.
      - --allow-cross-repo skips the check of the repository of the working directory.
      - When .pecot-active holds another Issue that is OPEN, the command stops.
      - --force-overwrite-active skips the check of .pecot-active.
      - When .pecot-active holds a malformed value, a CLOSED Issue or an Issue in another state, a warning line is written and the file is overwritten.
      - The repository must be registered in the active project.
      - --checkout and --no-checkout are kept for compatibility and have no effect.
      - The global pecot --repo must match the repository of the current git remote.
      - This command does not take its target from --repo.
    stdin: none
    output:
      format: none
    diagnostics: Result lines on stderr for the created branch (created), the Status (set) and the work target (set), and warning lines when the Status or the work target could not be set or .pecot-active is overwritten.
    environment: []
    exit_status:
      - code: 0
        when: The branch was created, including when setting the Status or recording the work target failed.
      - code: 1
        when: There is no active project, develop_branch is not set and --base is not given, the repository is not in the project, the GitHub API returned an error, --repo differs from the current git remote, the repository is ambiguous outside git without --repo, or the project root cannot be determined.
      - code: 2
        when: The Issue reference is not the full form, the repository of the working directory differs from the repository of the Issue, .pecot-active holds another OPEN Issue, or another command line error occurs.
    on_error: When the branch was created and setting the Status or recording the work target fails, the branch stays linked to the Issue and the command still finishes with exit status 0. When .pecot-active was written and .pecot-session-title could not be, the first file stays written.
    effects:
      - target: github
        kind: read
        what: Reads the repositories linked to the project, the node ID and title of the Issue, the head commit of the base branch, and the state of the Issue held in .pecot-active.
      - target: github
        kind: write
        what: Creates the linked branch and sets the Status of the Issue on the board to active.
      - target: file
        kind: read
        what: Reads the active config file and .pecot/state/.pecot-active.
      - target: file
        kind: write
        what: Writes .pecot/state/.pecot-active and .pecot/state/.pecot-session-title, and creates .pecot/work/<N>/.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host, with permission to edit the project.
      - The working directory is a checkout of the repository of the Issue, unless --allow-cross-repo is given.
    idempotent: false
    examples:
      - run: pecot create-branch example-org/my-repo/123 feat/my-change
        note: Create the branch feat/my-change/123 from the develop branch.
      - run: pecot create-branch example-org/my-repo/123 fix/my-bug --base main
        note: Create the branch fix/my-bug/123 from main.
      - run: pecot create-branch example-org/my-repo/123 feat/my-change --allow-cross-repo
        note: Create the branch from a directory that is not a checkout of the repository.
    default_notes:
      base: The develop_branch of the repository in the config file; without it, the command stops with exit status 1.
    behaviors:
      - id: PW-CREATE-BRANCH-01
        pattern: event
        statement: Issue の参照とブランチ名を渡して打つと、Issue に紐づいたブランチを ブランチ名/Issue 番号 の名前で作る
      - id: PW-CREATE-BRANCH-02
        pattern: event
        statement: --base を付けて打つと、そのブランチの先頭からブランチを作る
      - id: PW-CREATE-BRANCH-03
        pattern: event
        statement: --base を省いて打つと、設定ファイルの develop_branch の先頭からブランチを作る
      - id: PW-CREATE-BRANCH-04
        pattern: event
        statement: --allow-cross-repo を付けて打つと、作業ディレクトリのリポジトリと Issue のリポジトリを比べずにブランチを作る
      - id: PW-CREATE-BRANCH-05
        pattern: event
        statement: --force-overwrite-active を付けて打つと、.pecot-active の内容を確かめずに上書きする
      - id: PW-CREATE-BRANCH-06
        pattern: event
        statement: --checkout か --no-checkout を付けて打つと、付けないときと同じ結果になる
      - id: PW-CREATE-BRANCH-07
        pattern: event
        statement: ブランチを作ると、ボード上の Issue の Status を active にする
      - id: PW-CREATE-BRANCH-08
        pattern: event
        statement: ブランチを作ると、その Issue を作業対象として .pecot-active と .pecot-session-title に記録する
      - id: PW-CREATE-BRANCH-09
        pattern: event
        statement: ブランチを作ると、created の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-10
        pattern: event
        statement: Status を active にすると、set の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-11
        pattern: event
        statement: 作業対象を記録すると、set の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-12
        pattern: unwanted
        statement: もし .pecot-active の内容が不正な形なら、warning の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-13
        pattern: unwanted
        statement: もし .pecot-active の内容が不正な形なら、.pecot-active を上書きする
      - id: PW-CREATE-BRANCH-14
        pattern: unwanted
        statement: もし .pecot-active の Issue が CLOSED なら、warning の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-15
        pattern: unwanted
        statement: もし .pecot-active の Issue が CLOSED なら、.pecot-active を上書きする
      - id: PW-CREATE-BRANCH-16
        pattern: unwanted
        statement: もしボード上の Issue の Status を active にできなかったなら、warning の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-17
        pattern: unwanted
        statement: もし作業対象を記録できなかったなら、warning の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-18
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-CREATE-BRANCH-19
        pattern: unwanted
        statement: もし Issue の参照がフル形式でないなら、終了コード 2 で終わる
      - id: PW-CREATE-BRANCH-20
        pattern: unwanted
        statement: もし作業ディレクトリの git remote のリポジトリが Issue のリポジトリと違うなら、終了コード 2 で終わる
      - id: PW-CREATE-BRANCH-21
        pattern: unwanted
        statement: もし .pecot-active に別の OPEN な Issue が残っているなら、終了コード 2 で終わる
      - id: PW-CREATE-BRANCH-22
        pattern: unwanted
        statement: もし --base を省いて develop_branch も設定していないなら、終了コード 1 で終わる
      - id: PW-CREATE-BRANCH-23
        pattern: unwanted
        statement: もし Issue のリポジトリがプロジェクトに登録されていないなら、終了コード 1 で終わる
      - id: PW-CREATE-BRANCH-24
        pattern: unwanted
        statement: もしブランチの作成までの GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-CREATE-BRANCH-25
        pattern: unwanted
        statement: もし --repo が今の git remote のリポジトリと食い違うなら、終了コード 1 で終わる
      - id: PW-CREATE-BRANCH-26
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、the repository is ambiguous の行を標準エラーに出す
      - id: PW-CREATE-BRANCH-27
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、終了コード 1 で終わる
  PW-DELETE-BRANCH:
    constraints: []
    details:
      - Deletes a remote branch through the GitHub REST API, for use where a hook blocks git push and the gh CLI.
      - The repository to delete from is the repo_ref argument (owner/repo).
      - The global pecot --repo is only checked against the current git remote and is not used as the target.
      - The default branch of the repository and the develop_branch and release_branch in the config file are protected and are never deleted.
      - Also deletes the remote branch wip/<branch> when it exists.
      - A wip/<branch> that cannot be deleted is skipped without a message.
      - --dry-run reads the default branch and checks the protected branches, then writes the plan line for the branch and deletes nothing.
      - --dry-run does not plan the deletion of wip/<branch>.
    stdin: none
    output:
      format: none
    diagnostics: A result line on stderr for each deleted branch (deleted), the plan line with --dry-run (dry-run), an error line that lists the protected branches when the branch is protected, and an error line for any other failure, including when --repo differs from the git remote.
    environment: []
    exit_status:
      - code: 0
        when: The branch was deleted, or the plan line was written with --dry-run.
      - code: 1
        when: There is no active project, the default branch cannot be read, the branch is protected, the branch cannot be deleted, --repo differs from the current git remote, the repository is ambiguous outside git without --repo, or the project root cannot be determined.
      - code: 2
        when: repo_ref is not in owner/repo form, or another command line error occurs.
    on_error: When deleting wip/<branch> fails, the branch itself stays deleted and the command still finishes with exit status 0.
    effects:
      - target: github
        kind: read
        what: Reads the default branch of the repository.
      - target: github
        kind: destructive
        what: Deletes the remote branch, and wip/<branch> when it exists.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host, with permission to delete branches.
    idempotent: false
    examples:
      - run: pecot delete-branch example-org/my-repo feat/my-change/123
        note: Delete the remote branch and its wip branch.
      - run: pecot delete-branch example-org/my-repo feat/my-change/123 --dry-run
        note: Show the plan without deleting.
    default_notes: {}
    behaviors:
      - id: PW-DELETE-BRANCH-01
        pattern: event
        statement: リポジトリとブランチ名を渡して打つと、そのリポジトリのリモートブランチを削除する
      - id: PW-DELETE-BRANCH-02
        pattern: event
        statement: wip/ブランチ名 のリモートブランチがあると、それも削除する
      - id: PW-DELETE-BRANCH-03
        pattern: event
        statement: --dry-run を付けて打つと、何も削除しない
      - id: PW-DELETE-BRANCH-04
        pattern: event
        statement: ブランチを削除すると、deleted の行を標準エラーに出す
      - id: PW-DELETE-BRANCH-05
        pattern: event
        statement: wip/ブランチ名 を削除すると、deleted の行を標準エラーに出す
      - id: PW-DELETE-BRANCH-06
        pattern: event
        statement: --dry-run を付けて打つと、dry-run の行を標準エラーに出す
      - id: PW-DELETE-BRANCH-07
        pattern: unwanted
        statement: もし wip/ブランチ名 を削除できなかったなら、何も出さない
      - id: PW-DELETE-BRANCH-08
        pattern: unwanted
        statement: もし wip/ブランチ名 を削除できなかったなら、そのブランチを残す
      - id: PW-DELETE-BRANCH-09
        pattern: unwanted
        statement: もし wip/ブランチ名 を削除できなかったなら、終了コード 0 で終わる
      - id: PW-DELETE-BRANCH-10
        pattern: unwanted
        statement: もし削除するブランチが既定ブランチ・develop_branch・release_branch のどれかなら、保護するブランチを並べた error の行を標準エラーに出す
      - id: PW-DELETE-BRANCH-11
        pattern: unwanted
        statement: もし削除するブランチが既定ブランチ・develop_branch・release_branch のどれかなら、終了コード 1 で終わる
      - id: PW-DELETE-BRANCH-12
        pattern: unwanted
        statement: もし repo_ref が owner/repo の形でないなら、終了コード 2 で終わる
      - id: PW-DELETE-BRANCH-13
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-DELETE-BRANCH-14
        pattern: unwanted
        statement: もしリポジトリの既定ブランチを読めないなら、終了コード 1 で終わる
      - id: PW-DELETE-BRANCH-15
        pattern: unwanted
        statement: もしブランチの削除で GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-DELETE-BRANCH-16
        pattern: unwanted
        statement: もし --repo が今の git remote のリポジトリと食い違うなら、終了コード 1 で終わる
      - id: PW-DELETE-BRANCH-17
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、the repository is ambiguous の行を標準エラーに出す
      - id: PW-DELETE-BRANCH-18
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、終了コード 1 で終わる
  PW-DEPENDABOT-SYNC:
    constraints: []
    details:
      - Finds the open Tracker issue labeled dependabot-pr whose body has the Tracker marker.
      - Rewrites the table between list-begin and list-end in the body of the Tracker.
      - Lists the open Dependabot PRs that wait for a human decision.
      - A PR with no waiting reason is not listed.
      - A PR is eligible for auto-merge when its first commit is authored by dependabot[bot] with a valid signature and the largest known update type is minor or patch.
      - A dependency whose update type is unknown is ignored while another dependency has a known type, and the PR counts as unknown only when no dependency has a known type.
      - A PR whose update type is major or unknown is listed.
      - An eligible PR is listed when its checks failed.
      - An eligible PR with auto-merge on is listed when its checks have not finished 24 hours after the last push.
      - An eligible PR is listed when it conflicts for more than 30 minutes, counted from the later of the last push and the latest commit of the base branch.
      - An eligible PR is listed when it was dequeued after the last push and has neither auto-merge nor a merge queue entry.
      - An eligible PR with neither auto-merge nor a merge queue entry is listed 30 minutes after the last push.
      - The last push is the last force push, or the creation of the PR when there is none.
      - Each table row has the PR title, a link to the PR and the state of the checks (passed, failed, pending or none).
      - The waiting reasons appear only in the result lines.
      - Text in the Tracker body outside the list markers stays as it is.
      - When no Tracker is open and there are PRs to list, creates a Tracker, adds it to the project board, and sets Status to Backlog and Priority to medium.
      - When no Tracker is open and no PR is listed, creates nothing.
      - When the list is empty and a Tracker is open, sets the list to none and closes the Tracker as completed.
      - On an open Tracker that is not closed, sets Status and Priority only while they are empty, so a change made by a person stays.
      - A field that the active project does not define is not set.
      - When several Trackers are open, uses the lowest number and leaves the others open.
      - A closed Tracker is not reused.
    stdin: none
    output:
      format: none
    diagnostics: Count lines for the open Dependabot PRs, the PRs awaiting a decision and the PRs awaiting a decision without check results. A result line for each change (created, added, removed, updated, unchanged, closed, skipped), or a dry-run line with --dry-run. A warning line when several Trackers are open. An error line for each failure, except when the GitHub token cannot be found, where a traceback is printed.
    environment: []
    exit_status:
      - code: 0
        when: The Tracker was synchronized, or --dry-run printed the plan.
      - code: 1
        when: There is no active project, the repository cannot be read from the origin remote, the PRs or issues cannot be listed, the Tracker body does not have exactly one pair of list-begin and list-end markers, creating, updating, closing or placing the Tracker on the board failed, or the GitHub token cannot be found (a traceback is printed).
      - code: 2
        when: A command line error occurs.
    on_error: A Tracker that was created stays open on GitHub even when placing it on the board failed, and the next run places it on the board. A failed body update leaves the body as it was and the Tracker open. A failed close leaves the list set to none and the Tracker open, and the next run closes it. Changes already made are not rolled back.
    effects:
      - target: github
        kind: read
        what: Lists the open Dependabot PRs of the repository and the issues that carry the dependabot-pr label.
      - target: github
        kind: write
        what: Creates the Tracker issue, rewrites its body, closes it, adds it to the project board and sets its Status and Priority.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - A GitHub token is available for the host, with permission to edit issues and the project.
      - The repository is the origin remote of the working directory, or --repo is given.
    idempotent: true
    examples:
      - run: pecot dependabot sync --dry-run
        note: Show the planned Tracker changes without writing to GitHub.
      - run: pecot dependabot sync
        note: Rewrite the Tracker list, creating or closing the Tracker when needed.
    default_notes: {}
    behaviors:
      - id: PW-DEPENDABOT-SYNC-01
        pattern: event
