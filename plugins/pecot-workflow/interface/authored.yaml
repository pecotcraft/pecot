  PW-WORKTREE-INIT:
    help:
      details:
        - Writes the default templates into the main worktree of the repository in -D, as .pecot/config/worktree-config.json and .pecot/config/.worktreeignore.
        - worktree-config.json has the links CLAUDE.local.md, .env and .claude/settings.local.json, which point to the aggregation_repo of the active project, or to this repository when there is no active project or it has no aggregation_repo.
        - An active config file that cannot be read or is malformed stops the command before anything is written.
        - worktree-config.json also has the links of hooks-config.json, projects/.active and .pecot/work, which point to this repository.
        - .worktreeignore lists the patterns that worktree add does not copy, in the gitignore syntax.
        - Stops without writing when either file already exists.
        - Needs a devcontainer.
      examples:
        - run: pecot worktree init -D .
          note: Write the worktree config files of the repository in the current directory.
      default_notes: {}
    summary: メインの worktree に、worktree の設定ファイルを作ります。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
    constraints: []
    details:
      - '`-D` のリポジトリのメインの worktree に、既定のテンプレートを書きます。書く先は、`.pecot/config/worktree-config.json` と `.pecot/config/.worktreeignore` です。'
      - '`worktree-config.json` には、`CLAUDE.local.md`・`.env`・`.claude/settings.local.json` のリンクがあります。リンク先は、アクティブなプロジェクトの `aggregation_repo` です。アクティブなプロジェクトが無いか、`aggregation_repo` が無いときは、このリポジトリです。'
      - 'アクティブな設定ファイルを読めないか、形が誤っているときは、何も書かずに止まります。'
      - '`worktree-config.json` には、`hooks-config.json`・`projects/.active`・`.pecot/work` のリンクもあります。リンク先は、このリポジトリです。'
      - '`.worktreeignore` には、`worktree add` がコピーしないパターンを、gitignore の書き方で並べます。'
      - 'どちらかのファイルが既にあるときは、何も書かずに止まります。'
      - 'devcontainer が要ります。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、2 つのファイルそれぞれの `created` の行を出します。失敗したときは、`error` の行を出します。devcontainer の外のときも含みます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - code: 0
        when: '2 つのファイルを作りました。'
      - code: 1
        when: '次のどれかです。`--repo` が今の git remote と違います。git のリポジトリの外で `--repo` を省きました。メインの worktree が見つかりません。2 つのファイルのどちらかが既にあります。アクティブな設定ファイルを読めないか、形が誤っています。ファイルを書けません（トレースバックを出します）。devcontainer の外で動かしました。'
      - code: 2
        when: '`-D` が無いか、既にあるディレクトリでないか、ほかのコマンドラインの誤りがあります。'
    on_error: '`worktree-config.json` を書いた後で `.worktreeignore` を書けなかったときは、`worktree-config.json` は残ります。ファイルが既にあるときと、アクティブな設定ファイルを読めないときは、何も書きません。'
    effects:
