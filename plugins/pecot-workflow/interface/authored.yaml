      - target: file
        kind: destructive
        what: 'アクティブな設定ファイルから `aggregation_repo` を消します。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          key: aggregation_repo
        note: 'Epic を集めるリポジトリの設定を消します。'
    default_notes: {}
    behaviors:
