        statement: 'もし `--repo` を省いて git の外で打ったなら、`the repository is ambiguous` の行を標準エラーに出します'
      - id: PW-WORKTREE-REMOVE-20
        pattern: unwanted
        statement: 'もし `--repo` を省いて git の外で打ったなら、終了コード 1 で終わります'
      - id: PW-WORKTREE-REMOVE-21
        pattern: unwanted
        statement: 'もし devcontainer の外で打ったなら、`error` の行を標準エラーに出します'
      - id: PW-WORKTREE-REMOVE-22
        pattern: unwanted
        statement: 'もし devcontainer の外で打ったなら、終了コード 1 で終わります'
      - id: PW-WORKTREE-REMOVE-23
        pattern: unwanted
        statement: 'もし `git branch -D` に失敗したなら、終了コード 0 で終わります'
      - id: PW-WORKTREE-REMOVE-24
        pattern: event
        statement: '記録の無い worktree の、プロジェクトのルートから見た置き場所 `<名前>/<repo>` の名前を渡して打つと、checkout しているブランチによらず、その worktree を削除します'
      - id: PW-WORKTREE-REMOVE-25
        pattern: event
        statement: '記録と置き場所のどちらでも見つからない名前を渡して打つと、その名前のブランチを checkout している worktree を削除します'
      - id: PW-WORKTREE-REMOVE-26
        pattern: event
        statement: '`--dry-run` を付けて打つと、worktree とブランチを消さず、消す操作を `dry-run` の行で標準エラーに出し、終了コード 0 で終わります'
      - id: PW-WORKTREE-REMOVE-27
        pattern: unwanted
        statement: 'もし `--force` を付けずに変更のある worktree を削除しようとしたなら、git の文に続けて、`--force` を案内する `hint` の行を標準エラーに出します。MCP では `force: true` を案内します'
      - id: PW-WORKTREE-REMOVE-28
        pattern: event
        statement: '`--repo` を渡して remote の URL から `owner/repo` を読めないと、`warning` の行を出して続けます（MCP は `warnings` に入れます）'
      - id: PW-WORKTREE-REMOVE-29
        pattern: unwanted
        statement: 'もし `--repo` を省いて remote の URL から `owner/repo` を読めないなら、`the repository is ambiguous` と理由を出し、終了コード 1 で終わります'
common_behaviors:
  - id: PW-COMMON-01
    pattern: event
    statement: '`--help` を付けて打つと、使い方を標準出力に出します'
  - id: PW-COMMON-02
    pattern: event
    statement: '`--help` を付けて打つと、終了コード 0 で終わります'
  - id: PW-COMMON-03
    pattern: event
    statement: '`--version` か `-v` を付けて打つと、版を標準出力に出します'
  - id: PW-COMMON-04
    pattern: event
    statement: '`--version` か `-v` を付けて打つと、終了コード 0 で終わります'
  - id: PW-COMMON-05
    pattern: event
    statement: '`--show-repo` を付けて打つと、解決したリポジトリを標準出力に出します'
  - id: PW-COMMON-06
    pattern: event
    statement: '対象を引数・`-D`・`--issue` のどれでも決めないコマンドに `--repo` を渡すと、渡したリポジトリを対象にします'
  - id: PW-COMMON-07
    pattern: event
    statement: '対象を引数・`-D`・`--issue` のどれでも決めないコマンドで `--repo` を省くと、カレントの git の `origin` remote のリポジトリを対象にします'
  - id: PW-COMMON-08
    pattern: event
    statement: '対象を引数・`-D`・`--issue` のどれでも決めないコマンドで `--repo` を省いて `origin` remote が無いと、最初の remote のリポジトリを対象にします'
  - id: PW-COMMON-09
    pattern: unwanted
    statement: 'もし知らないオプションを渡したなら、終了コード 2 で終わります'
  - id: PW-COMMON-10
    pattern: unwanted
    statement: 'もし `--repo` が `owner/repo` の形でないなら、終了コード 2 で終わります'
  - id: PW-COMMON-11
    pattern: unwanted
    statement: 'もし `--show-repo` でリポジトリを解決できないなら、終了コード 2 で終わります'
  - id: PW-COMMON-12
    pattern: unwanted
    statement: 'もし `PECOT_GITHUB_API_URL` がループバックの http の URL でないなら、サブコマンドを動かしません'
  - id: PW-COMMON-13
    pattern: unwanted
    statement: 'もし `PECOT_GITHUB_API_URL` がループバックの http の URL でないなら、終了コード 1 で終わります'
  - id: PW-COMMON-14
    pattern: unwanted
    statement: 'もしプロジェクトのルートを決められないなら、終了コード 1 で終わります'
  - id: PW-COMMON-15
    pattern: unwanted
    statement: 'もし読み込む設定ファイルの形式が不正なら、終了コード 1 で終わります'
  - id: PW-COMMON-16
    pattern: unwanted
    statement: 'もしコマンドが捕まえなかった pecot の独自の例外が起きたなら、`error` の行を標準エラーに出します'
  - id: PW-COMMON-17
    pattern: unwanted
    statement: 'もしコマンドが捕まえなかった pecot の独自の例外が起きたなら、終了コード 1 で終わります（リポジトリが曖昧なときの終了コード 2 も、ここを通ると 1 になります）'
  - id: PW-COMMON-18
    pattern: unwanted
    statement: 'もし MCP のツールが失敗したなら、`isError` を `true` にし、`kind`・`detail` と、止まる前に進んだ項目を最上位に入れて返します'
  - id: PW-COMMON-19
    pattern: event
    statement: 'MCP のツールが warning を出すと、`warning: ` の前置きを除いた文を `warnings` に入れて返します'
  - id: PW-COMMON-20
    pattern: event
    statement: 'MCP のツールがファイルやディレクトリを作ると、その絶対パスを、ツールごとの項目（`file`・`path`・`configPath` など）に入れて返します'
  - id: PW-COMMON-21
    pattern: unwanted
    statement: 'もし `--show-repo` で git remote の URL から `owner/repo` を読めないなら、その理由の `error` の行を出し、終了コード 2 で終わります'
  - id: PW-COMMON-22
    pattern: unwanted
    statement: 'もし `--repo` を省いて短い形 `N` を渡し、remote の URL から `owner/repo` を読めないなら、短い形の案内と理由を出し、終了コード 2 で終わります'
  - id: PW-COMMON-23
    pattern: ubiquitous
    statement: '常に、git remote の URL から、次の 2 つの形で `owner/repo` を読みます。1 つはスキーム付きの `<scheme>://[user@]host[:port]/owner/repo[.git][/]` です。`<scheme>` は `http`・`https`・`ssh`・`git`・`ftp`・`ftps` のどれかです。もう 1 つは scp 形式の `[user@]host:[/]owner/repo[.git][/]` です'
