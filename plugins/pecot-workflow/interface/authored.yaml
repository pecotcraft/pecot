  - id: PW-COMMON-23
    pattern: ubiquitous
    statement: '常に、git remote の URL から、次の 2 つの形で `owner/repo` を読みます。1 つはスキーム付きの `<scheme>://[user@]host[:port]/owner/repo[.git][/]` です。`<scheme>` は `http`・`https`・`ssh`・`git`・`ftp`・`ftps` のどれかです。もう 1 つは scp 形式の `[user@]host:[/]owner/repo[.git][/]` です'
  - id: PW-COMMON-24
    pattern: state
    statement: 'MCP のツールが子プロセス（fetch・ls-remote・push・`git pull`・`gh auth token`・`setup_command`・`nx graph`）を待つ間、ping へすぐ答えます'
  - id: PW-COMMON-25
    pattern: event
    statement: '子プロセスを待つ MCP のツールが取り消されると、子プロセスをその子ごと止め、コマンドの続きを動かしません'
  - id: PW-COMMON-26
    pattern: unwanted
    statement: 'もし MCP のツールの失敗の文が 2 つ以上あるなら、どの文にも `error: ` の前置きを付けずに、改行でつないで `detail` に入れます'
  - id: PW-COMMON-27
    pattern: unwanted
    statement: 'もし MCP のツールが失敗の `detail` で次に呼ぶツールを案内するなら、CLI のコマンドでなく、ツール名と入力名で `call <ツール>` と書きます'
  - id: PW-COMMON-28
    pattern: unwanted
    statement: 'もし MCP のツールが使い方の誤りで失敗したなら、CLI の Usage の行と枠を付けずに、誤りの文だけを `detail` に入れます'
common_mcp_output:
  fields:
    kind: '失敗の種別です。失敗のときだけ入ります。'
    detail: '失敗の全文です。エラーの文と、それに続く案内の行が入ります。案内は、ツール名と入力名で書いてあります。失敗のときだけ入ります。'
    log: '子プロセスの出力です。失敗のときだけ入り、出力を取れなかったときは入りません。'
    warnings: '警告の文の配列です。先頭の `warning: ` は外してあります。文の続きの行は、空白 2 つで字下げしてあります。警告が無いときは入りません。'
