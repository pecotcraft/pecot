  PW-CREATE-BRANCH:
    help:
      details:
        - Creates a branch linked to an Issue through the GitHub GraphQL API (createLinkedBranch), so the branch shows in the Development section of the Issue.
        - The Issue reference must be the full form owner/repo/N.
        - The branch is named <branch_name>/<N>, with the Issue number appended.
        - Before the branch is created, the readiness of the Issue is read in the same way as pecot issue read.
        - "When the readiness is stackable, the branch starts from the head of the branch of the PR it stacks on, and the created line ends with (stacked on #N)."
        - When the readiness is startable, or the Issue has no readiness (an Epic or a Tracker), the branch starts from the head of --base, or from the develop_branch of the repository in the config file without --base.
        - develop_branch and --base are required only after the readiness is decided, and only when the branch is not stacked.
        - When the readiness is blocked, no branch is created; the command writes the reason, the unfinished prerequisites and how to fix it, and stops, even when develop_branch is not set.
        - The fix is one unblock line for each unfinished prerequisite, and one line to stack on it for each prerequisite that waits for merge, each with the reference of that Issue.
        - When the branch of the PR to stack on is gone after the readiness is decided, the command writes an error line with the name of the branch and the Issue, and stops.
        - --base is compared with the base chosen by readiness only when the readiness is stackable, and a different --base stops the command.
        - When the GitHub Enterprise Server does not support issue dependencies, the readiness is not read, a warning line says so, and the branch starts as for an Issue without prerequisites.
        - After the branch is created, the Status of the Issue on the board is set to active.
        - A failure to set the Status does not stop the command.
        - After that, the Issue is recorded as the work target in .pecot/state/.pecot-active and .pecot/state/.pecot-session-title, and .pecot/work/<N>/ is created.
        - A failure to record the work target does not stop the command.
        - When the work target is recorded, the chosen base is written to .pecot/state/.pecot-base as <branch> <sha>, followed by owner/repo#N of the Issue it stacks on when the branch is stacked.
        - .pecot/state/.pecot-base is removed before the work target is recorded, so that it never keeps the record of the previous Issue.
        - The repository of the working directory git remote must be the repository of the Issue.
        - --allow-cross-repo skips the check of the repository of the working directory.
        - When .pecot-active holds another Issue that is OPEN, the command stops.
        - --force-overwrite-active skips the check of .pecot-active.
        - When .pecot-active holds a malformed value, a CLOSED Issue or an Issue in another state, a warning line is written and the file is overwritten.
        - The repository must be registered in the active project.
        - --checkout and --no-checkout are kept for compatibility and have no effect.
        - The global pecot --repo must match the repository of the current git remote.
        - This command does not take its target from --repo.
      examples:
        - run: pecot create-branch example-org/my-repo/123 feat/my-change
          note: Create the branch feat/my-change/123 from the develop branch.
        - run: pecot create-branch example-org/my-repo/123 fix/my-bug --base main
          note: Create the branch fix/my-bug/123 from main.
        - run: pecot create-branch example-org/my-repo/123 feat/my-change --allow-cross-repo
          note: Create the branch from a directory that is not a checkout of the repository.
      default_notes:
        base: The branch of the PR the Issue stacks on when its readiness is stackable; otherwise the develop_branch of the repository in the config file, and without it the command stops with exit status 1.
    summary: Issue に紐づいたブランチを作ります。
    arguments:
      allow_cross_repo: '作業ディレクトリのリポジトリが Issue のリポジトリと違ってもよいかどうかです。スクリプトと、作業ディレクトリの外からの実行で使います。'
      base: '分岐元のブランチです。'
      branch_name: '作るブランチの名前です。'
      checkout: '互換のために残した引数で、何も変わりません。'
      force_overwrite_active: '`.pecot-active` の上書きを止める確認を外すかどうかです。残っている内容が古いと分かっているときに使います。'
      issue_ref: 'Issue の参照です。`owner/repo/123` の形で渡します。'
    constraints: []
    details:
      - 'GitHub の GraphQL API（`createLinkedBranch`）で、Issue に紐づいたブランチを作ります。ブランチは、Issue の Development の欄に出ます。'
      - 'Issue の参照は、フル形式の `owner/repo/N` でなければなりません。'
      - 'ブランチの名前は、Issue の番号を後ろに付けた `<branch_name>/<N>` です。'
      - 'ブランチを作る前に、`pecot issue read` と同じ方法で Issue の着手の判定を読みます。'
      - '判定が `stackable` のときは、積む先の PR のブランチの先頭から分岐し、`created` の行の末尾に `(stacked on #N)` を付けます。'
      - '判定が `startable` のときと、判定の無い Issue（Epic か Tracker）のときは、`--base` の先頭から分岐します。`--base` が無ければ、設定ファイルにあるそのリポジトリの `develop_branch` の先頭から分岐します。'
      - '`develop_branch` と `--base` が要るのは、判定が決まった後で、ブランチを積まないときだけです。'
      - '判定が `blocked` のときは、ブランチを作りません。理由・済んでいない前提・直し方を書いて止まります。`develop_branch` が未設定でも同じです。'
      - '直し方は、済んでいない前提ごとの unblock の行と、マージを待つ前提ごとの積む行です。どの行にも、その Issue の参照を添えます。'
      - '判定が決まった後で積む先の PR のブランチが無くなったときは、ブランチと Issue の名前を添えた `error` の行を書いて止まります。'
      - '`--base` を判定が選んだ分岐元と比べるのは、判定が `stackable` のときだけです。違う `--base` を渡すと止まります。'
      - 'GitHub Enterprise Server が Issue の依存関係に対応していないときは、判定を読まず、`warning` の行で知らせます。ブランチは、前提の無い Issue と同じように分岐します。'
      - 'ブランチを作った後、ボード上の Issue の Status を `active` にします。'
      - 'Status の設定に失敗しても、コマンドは止まりません。'
      - 'その後、Issue を作業対象として `.pecot/state/.pecot-active` と `.pecot/state/.pecot-session-title` に記録します。`.pecot/work/<N>/` も作ります。'
      - '作業対象の記録に失敗しても、コマンドは止まりません。'
      - '作業対象を記録したときは、選んだ分岐元を `.pecot/state/.pecot-base` に `<branch> <sha>` の形で書きます。ブランチを積んだときは、積んだ先の Issue の `owner/repo#N` を続けて書きます。'
      - '`.pecot/state/.pecot-base` は、作業対象を記録する前に消します。前の Issue の記録を残さないためです。'
      - '作業ディレクトリの git remote のリポジトリは、Issue のリポジトリでなければなりません。'
      - '`--allow-cross-repo` を付けると、作業ディレクトリのリポジトリを確かめません。'
      - '`.pecot-active` に別の OPEN の Issue が残っているときは、止まります。'
      - '`--force-overwrite-active` を付けると、`.pecot-active` を確かめません。'
      - '`.pecot-active` の内容が、不正な形の値・CLOSED の Issue・ほかの状態の Issue のどれかのときは、`warning` の行を書いてファイルを上書きします。'
      - 'リポジトリは、アクティブなプロジェクトに登録されていなければなりません。'
      - '`--checkout` と `--no-checkout` は互換のために残したもので、何も変わりません。'
      - 'pecot 全体のオプション `--repo` は、今の git remote のリポジトリと一致していなければなりません。'
      - 'このコマンドは、対象を `--repo` から決めません。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、作ったブランチ（`created`）・Status（`set`）・作業対象（`set`）の結果の行を出します。Status・作業対象・`.pecot-base` を設定できなかったときと、`.pecot-active` を上書きしたときは、`warning` の行を出します。Issue の依存関係に対応していない GitHub Enterprise Server で判定を確かめなかったときも、`warning` の行を出します。Issue が blocked のときは、`error` の行に続けて、済んでいない前提ごとの行と直すコマンドを出します。2 行目からは、空白 2 つで字下げします。`--base` が判定の選んだ分岐元と違うときは、`error` の行を出します。積む先のブランチが無くなったときは、ブランチと Issue を添えた `error` の行を出します。前提を読めないか判定できないときも、`error` の行を出します。`develop_branch` が原因のときは、続けて設定の仕方を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'ブランチを作りました。Status の設定か作業対象の記録に失敗したときも含みます。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。`develop_branch` が未設定で、`--base` もありません。リポジトリがプロジェクトにありません。GitHub API がエラーを返しました。積む先のブランチが無くなりました。`--repo` が今の git remote と違います。git の外で `--repo` を省いたので、リポジトリが決まりません。プロジェクトのルートを決められません。Issue の前提を読めないか、着手の判定ができません。'
      - code: 2
        when: '次のどれかです。Issue の参照がフル形式ではありません。作業ディレクトリのリポジトリが Issue のリポジトリと違います。`.pecot-active` に別の OPEN の Issue が残っています。Issue が前提で blocked です。`stackable` の Issue で、`--base` が選ばれた分岐元と違います。ほかのコマンドラインの誤りがあります。'
    on_error: 'ブランチを作った後で Status の設定か作業対象の記録に失敗したときは、ブランチは Issue に紐づいたまま残り、終了コード 0 で終わります。`.pecot-active` を書いた後で `.pecot-session-title` を書けなかったときは、先のファイルは書かれたまま残ります。作業対象を記録できなかったときは、`.pecot-base` を書きません。前の Issue の記録も残りません。`.pecot-base` を消せないか書けないときは、`warning` の行で知らせます。Issue が blocked のとき、判定を読めないとき、積む先のブランチが無くなったときは、何も作らず、何も書きません。'
    effects:
      - target: github
        kind: read
        what: '次のものを読みます。プロジェクトにつながっているリポジトリ。Issue の前提と、そのブランチの PR。Issue の node ID と題。分岐元のブランチの先頭のコミット。`.pecot-active` に残っている Issue の状態。'
      - target: github
        kind: write
        what: '紐づいたブランチを作り、ボード上の Issue の Status を `active` にします。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルと `.pecot/state/.pecot-active` を読みます。'
      - target: file
        kind: write
        what: '`.pecot/state/.pecot-active`・`.pecot/state/.pecot-session-title`・`.pecot/state/.pecot-base` を書きます。`.pecot/work/<N>/` も作ります。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
      - '作業ディレクトリは、Issue のリポジトリのチェックアウトでなければなりません。`--allow-cross-repo` を付けたときは別です。'
    idempotent: false
    examples:
      - run: pecot create-branch example-org/my-repo/123 feat/my-change
        note: '開発ブランチから、ブランチ `feat/my-change/123` を作ります。'
      - run: pecot create-branch example-org/my-repo/123 fix/my-bug --base main
