      - id: PW-PROJECT-UNSET-05
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
  PW-RELEASE-CHECK:
    summary: リリースの前の確認をします。nx のリポジトリでは、alert だけを確かめます。
    arguments:
      package: 'monorepo のパッケージの名前です。'
      version: 'リリースする版です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    constraints: []
    details:
      - 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を確かめます。'
      - '3 種類は、先の確認が失敗しても、必ずすべて確かめます。'
      - 'open の Dependabot alert は `warnings` に入れて知らせ、確認は止めません。'
      - 'Dependabot の知らせには、alert ごとの `#<number>`・パッケージ・severity と、alert のページの URL を並べます。'
      - 'open の code scanning alert か secret scanning alert があると、失敗を返します。'
      - '機能が無効のリポジトリは、飛ばした確認を `skipped` に入れて通ります。'
      - '権限が無いなどで code scanning か secret scanning の状態を判定できないと、失敗を返します。'
      - 'リリースの種類が nx のリポジトリでは、alert だけを確かめます。`version` と `package` は受け付けません。'
      - '`version` を渡すと、alert を調べる前に `X.Y.Z` の形かを確かめます。形が誤っていれば、alert を調べずに止まります。'
      - 'nx でないリポジトリでは、alert のほかに次のことを確かめます。CHANGELOG があること。タグがローカルとリモートのどちらにも無いこと。`<develop_branch>` に、`<release_branch>` に無いコミットがあること。タグの確認に使う `<remote>` は `origin` で、`origin` が無ければ最初の remote です。'
      - '`version` が無いときの版は、CHANGELOG の最初の `## [X.Y.Z]` の見出しです。Unreleased の見出しは飛ばします。'
      - 'CHANGELOG は、設定ファイルにあるリポジトリの `changelog_file` です。'
      - '`changelog_file` が無いときの CHANGELOG は、git のルートの `CHANGELOG.md` で、その次が `AIST-CHANGELOG.md` です。`package` を渡したときは、そのパッケージの changelog です。'
      - 'タグは `v<version>` です。'
      - '`package` を渡すと、タグは `<package>-v<version>` です。'
      - 'packages を設定したリポジトリでは、`package` が必須です。'
      - 'packages の無いリポジトリでは、`package` を受け付けません。'
      - 'リポジトリは、引数 `repo` から決めます。無ければ remote の `origin` から、`origin` も無ければ最初の remote から決めます。'
      - '`repo` が git remote と違っても、git のコマンドは `origin` を使います。`origin` が無ければ、最初の remote を使います。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。'
      - '`repo` が今の git remote と食い違うときは、`warnings` に入れて `repo` を使います。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`warnings` に入れて `repo` を使い、無ければ失敗を返します。'
      - 'コミットの数は、GitHub の compare API の `ahead_by` で数えます。呼ぶ先は `GET /repos/{owner}/{repo}/compare/{release_branch}...{develop_branch}` です。`git fetch` はせず、手元の ref も動かしません。リモートにだけあるコミットも数えます。'
    stdin: none
    output:
      format: text
      description: '版の行、タグの行、空行、その版のリリースノートです。リリースの種類が nx のリポジトリでは、標準出力に何も書きません。'
    mcp_output:
      fields:
        version: 'リリースする版です。リリースの種類が `nx` のときは入りません。`nx` ではアラートだけを確かめます。'
        tag: '作るタグです。リリースの種類が `nx` のときは入りません。'
        releaseNotes: 'CHANGELOG から取ったリリースノートです。リリースの種類が `nx` のときは入りません。'
        commitCount: 'リリースブランチから develop ブランチまでのコミットの数です。リリースの種類が `nx` のときは入りません。'
        skipped: '機能が無効なので飛ばした確認の文の配列です。例は `Dependabot alerts (feature disabled)` です。飛ばした確認が無ければ空です。'
        dependabotAlerts: 'Dependabot アラートの状態です。読めなかったときは入りません。リリースは止めません。`enabled`・`openCount`・`alertsUrl` を必ず持ち、`maxSeverity` は、開いたアラートがあるときだけ入ります。'
    diagnostics: 'alert の種類ごとに、`count` の行、`skipped` の行、`warning` の行のどれかを出します。code scanning と secret scanning には、`error` の行も出します。リリースするコミットの `count` の行を出します。`repo` が git remote と違うときは、`warning` の行を出します。失敗したときは、`error` の行を出します。コミットの数を数えられなかったときは、`error: could not count the commits from <release> to <develop>: ...` の行を出します。remote の URL から `owner/repo` を読めず `repo` があるときは、`warning: using repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `repo` の案内の行を続けます。'
    environment: []
    exit_status:
      - kind: git-unresolved
        when: 'git のリポジトリのルートが見つかりません。`repo` を省いたのに git remote を読めないときと、git の外で `repo` を省いたときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        when: '`package` の決まりに反しています。nx のリポジトリに版か `package` を渡したときと、版が `X.Y.Z` の形でないときも含みます。'
      - kind: repo-setting-missing
        when: '`develop_branch` か `release_branch` が未設定です。'
      - kind: preflight-failed
        when: 'リリースの確認に通りません。次のどれかです。alert の確認が失敗しました。CHANGELOG かその中の版が見つかりません。タグが既にあります。リリースするものがありません。git のコマンドが失敗しました。'
      - kind: invalid-input
        when: '知らない引数など、引数の誤りがあります。'
      - kind: github-auth
        when: 'コミットの数を数えるとき、GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'コミットの数を数えるとき、GitHub にブランチかリポジトリが見つかりません。'
      - kind: github-rate-limit
        when: 'コミットの数を数えるとき、GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'コミットの数を数えるとき、GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。GitHub へ届かず、コミットの数を数えられないときも含みます。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'GitHub と作業ツリーのどちらにも、何も作りません。手元の ref も動かしません。alert の確認で失敗したときも、結果に `skipped` と `dependabotAlerts` が入ります。open の alert か読めない alert が Dependabot だけのときは、`warnings` に入れて成功を返します。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を読みます。GitHub の compare API で、リリースブランチから開発ブランチまでのコミットの数（`ahead_by`）も読みます。'
      - target: git
        kind: read
        what: 'git のルート、`<remote>` の URL、ローカルのタグ、`git ls-remote` で見たリモートのタグを読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルと CHANGELOG を読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。GitHub のリポジトリに、開発ブランチとリリースブランチが要ります。remote の `origin`（無ければ最初の remote）は、タグの確認に使います。'
      - '設定ファイルに、リポジトリの `develop_branch` と `release_branch` が要ります（`project_link` で設定します）。リリースの種類が nx のときは要りません。'
      - 'ホストの GitHub トークンと、alert を読む権限が要ります。'
