  PW-WORKTREE-REMOVE:
    summary: worktree を削除します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      force: '変更があっても削除するかどうかです。'
      keep_branch: 'ブランチを残すかどうかです。'
      name: '削除する worktree の名前です。記録した `wtN`、`wtN` のディレクトリ、ブランチ名のどれかを渡します。'
    constraints: []
    details:
      - '`directory` のリポジトリの worktree のうち、メインの worktree を除いたものから、`name` の worktree を探します。見つけた worktree は、`git worktree remove` で削除します。'
      - 'worktree は 3 段階で探し、最初に当たったものを使います。1 段階目は、`worktree_add` が記録した名前が `name` と同じ worktree です。2 段階目は、`<プロジェクトのルート>/<name>/<repo>` にある worktree です。3 段階目は、チェックアウトしているブランチが `name` の worktree です。'
      - 'ディレクトリの無い worktree の記録は読みません。'
      - 'メインの worktree が名前で見つかることはありません。'
      - '`keep_branch` を付けなければ、同じ名前のローカルブランチを削除します。'
      - '削除した worktree がチェックアウトしていた別の名前のブランチは残ります。'
      - '`git branch -D` が失敗すると、理由を `warnings` に入れ、`deletedBranch` を `false` にします。ブランチは残り、成功を返します。'
      - 'その後、`<プロジェクトのルート>/<name>` のディレクトリが空なら削除します。'
      - 'セットのディレクトリを削除できないときは、`warnings` に入れます。'
      - '`force` が無いと、git は変更のある worktree の削除を拒みます。'
      - '3 段階のどれでも worktree に当たらない名前を渡すと、失敗を返します。'
      - 'devcontainer が要ります。'
      - 'worktree の設定ファイルとアクティブなプロジェクトは読みません。'
      - 'remote の URL から `owner/repo` を読めないときは、引数 `repo` と比べません。`repo` があれば、`repo` を使い、`warnings` に `using repo <owner/repo>` で始まる文を入れます。文の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。無ければ失敗を返し、`detail` が `the repository is ambiguous` で始まります。理由と `repo` の案内が続きます。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        name: '削除した worktree の名前です。渡したままの名前です。'
        deletedBranch: 'ローカルブランチを削除したかどうかです。残したとき、削除に失敗したときは `false` です。'
    diagnostics: default
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - kind: repo-mismatch
        when: '引数 `repo` が今の git remote と違います。`detail` が、渡した `repo` と今の git remote を並べて伝えます。'
      - kind: git-unresolved
        when: 'git のリポジトリの外で `repo` を省きました。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。このときの `detail` は `the repository is ambiguous` で始まり、理由と `repo` の案内が続きます。'
      - kind: other
        when: '渡した名前に当たる worktree がありません。`git worktree remove` が失敗したときと、devcontainer の外で動かしたときも含みます。'
      - kind: invalid-input
        when: '`name` か `directory` がありません。`directory` が既にあるディレクトリでないときと、ほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: '最初のエラーで止まり、失敗を返します。`git worktree remove` が失敗したときは、worktree とブランチは残ります。worktree を削除した後でブランチの削除に失敗したときは、理由を `warnings` に入れ、ブランチを残して成功を返します。'
    effects:
      - target: git
        kind: read
        what: 'worktree の一覧と、`worktree_add` がそれぞれの worktree に記録した `wtN` を読みます。'
      - target: git
        kind: destructive
        what: 'worktree を削除します。`force` のときは、コミットしていない変更ごと削除します。ローカルブランチを `git branch -D` で削除します。'
      - target: file
        kind: destructive
        what: '空になったセットのディレクトリ `<プロジェクトのルート>/<name>` を削除します。'
    prerequisites:
      - 'devcontainer の中で動かします。'
    idempotent: false
    examples:
      - arguments:
          name: wt1
          directory: .
        note: 'worktree `wt1` と、そのブランチを削除します。'
      - arguments:
          name: wt1
          directory: .
          keep_branch: true
          force: true
        note: '変更があっても worktree を削除し、ブランチは残します。'
    default_notes: {}
    behaviors:
      - id: PW-WORKTREE-REMOVE-01
        pattern: event
        statement: '`worktree_add` が記録した名前を渡して呼ぶと、checkout しているブランチによらず、その worktree を削除します'
      - id: PW-WORKTREE-REMOVE-02
        pattern: event
        statement: '`keep_branch` を省いて worktree を削除すると、同じ名前のローカルブランチを削除します'
      - id: PW-WORKTREE-REMOVE-03
        pattern: event
        statement: '`keep_branch` を付けて呼ぶと、ブランチを残します'
      - id: PW-WORKTREE-REMOVE-04
        pattern: event
        statement: '`force` を付けて呼ぶと、変更のある worktree も削除します'
      - id: PW-WORKTREE-REMOVE-05
        pattern: event
        statement: '削除した後にプロジェクトのルートの下の同名のディレクトリが空だと、そのディレクトリを削除します'
      - id: PW-WORKTREE-REMOVE-06
        pattern: event
        statement: 'worktree を削除すると、結果の `name` に渡した名前を入れます'
      - id: PW-WORKTREE-REMOVE-07
        pattern: event
        statement: 'ローカルブランチを削除すると、結果の `deletedBranch` を `true` にします'
      - id: PW-WORKTREE-REMOVE-08
        pattern: unwanted
        statement: 'もし空のセットのディレクトリを削除できないなら、`warnings` に 1 つ入れます'
      - id: PW-WORKTREE-REMOVE-09
        pattern: unwanted
        statement: 'もし `git branch -D` に失敗したなら、理由を `warnings` に入れ、`deletedBranch` を `false` にします'
      - id: PW-WORKTREE-REMOVE-10
        pattern: unwanted
        statement: 'もし `git branch -D` に失敗したなら、ブランチを残します'
      - id: PW-WORKTREE-REMOVE-11
        pattern: unwanted
        statement: 'もし渡した名前の worktree が無いなら、`worktree not found` の文を `detail` に入れます'
      - id: PW-WORKTREE-REMOVE-12
        pattern: unwanted
        statement: 'もし渡した名前の worktree が無いなら、失敗を返します'
      - id: PW-WORKTREE-REMOVE-13
        pattern: unwanted
        statement: 'もし `force` を付けずに変更のある worktree を削除しようとしたなら、worktree とブランチを残します'
      - id: PW-WORKTREE-REMOVE-14
        pattern: unwanted
        statement: 'もし `force` を付けずに変更のある worktree を削除しようとしたなら、失敗を返します'
      - id: PW-WORKTREE-REMOVE-15
        pattern: unwanted
        statement: 'もし `git worktree remove` に失敗したなら、git の文を `detail` に入れます'
      - id: PW-WORKTREE-REMOVE-16
        pattern: unwanted
        statement: 'もし `git worktree remove` に失敗したなら、失敗を返します'
      - id: PW-WORKTREE-REMOVE-17
        pattern: unwanted
        statement: 'もし引数 `repo` が今の git の remote と食い違うなら、何も削除しません'
      - id: PW-WORKTREE-REMOVE-18
        pattern: unwanted
        statement: 'もし引数 `repo` が今の git の remote と食い違うなら、`kind` が `repo-mismatch` の失敗を返します'
      - id: PW-WORKTREE-REMOVE-19
        pattern: unwanted
        statement: 'もし `repo` を省いて git の外で呼んだなら、`the repository is ambiguous` の文を `detail` に入れます'
      - id: PW-WORKTREE-REMOVE-20
        pattern: unwanted
        statement: 'もし `repo` を省いて git の外で呼んだなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-WORKTREE-REMOVE-21
        pattern: unwanted
        statement: 'もし devcontainer の外で呼んだなら、理由を `detail` に入れます'
      - id: PW-WORKTREE-REMOVE-22
        pattern: unwanted
        statement: 'もし devcontainer の外で呼んだなら、失敗を返します'
      - id: PW-WORKTREE-REMOVE-23
        pattern: unwanted
        statement: 'もし `git branch -D` に失敗したなら、成功を返します'
      - id: PW-WORKTREE-REMOVE-24
        pattern: event
        statement: '記録の無い worktree の、プロジェクトのルートから見た置き場所 `<名前>/<repo>` の名前を渡して呼ぶと、checkout しているブランチによらず、その worktree を削除します'
      - id: PW-WORKTREE-REMOVE-25
        pattern: event
        statement: '記録と置き場所のどちらでも見つからない名前を渡して呼ぶと、その名前のブランチを checkout している worktree を削除します'
      - id: PW-WORKTREE-REMOVE-27
        pattern: unwanted
        statement: 'もし `force` を付けずに変更のある worktree を削除しようとしたなら、git の文に続けて、`force: true` を付ける案内を `detail` に入れます'
      - id: PW-WORKTREE-REMOVE-28
        pattern: event
        statement: '引数 `repo` を渡して remote の URL から `owner/repo` を読めないと、`warnings` に 1 つ入れて続けます'
      - id: PW-WORKTREE-REMOVE-29
        pattern: unwanted
        statement: 'もし `repo` を省いて remote の URL から `owner/repo` を読めないなら、`the repository is ambiguous` と理由を `detail` に入れて、失敗を返します'
common_behaviors:
  - id: PW-COMMON-06
    pattern: event
    statement: '対象を決める入力を持たないツールに `repo` を渡すと、渡したリポジトリを対象にします'
  - id: PW-COMMON-07
    pattern: event
    statement: '対象を決める入力を持たないツールで `repo` を省くと、カレントの git の `origin` remote のリポジトリを対象にします'
  - id: PW-COMMON-08
    pattern: event
    statement: '対象を決める入力を持たないツールで `repo` を省いて `origin` remote が無いと、最初の remote のリポジトリを対象にします'
  - id: PW-COMMON-10
    pattern: unwanted
    statement: 'もし `repo` が `owner/repo` の形でないなら、`owner/repo` の形を求める文を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
  - id: PW-COMMON-14
    pattern: unwanted
    statement: 'もしプロジェクトのルートを決められないなら、その理由を `detail` に入れて失敗を返します'
  - id: PW-COMMON-15
    pattern: unwanted
    statement: 'もし読み込む設定ファイルの形式が不正なら、その理由を `detail` に入れて失敗を返します'
  - id: PW-COMMON-16
    pattern: unwanted
    statement: 'もしツールが捕まえなかった pecot の独自の例外が起きたなら、その文を `detail` に入れて失敗を返します。文の続きの行は、空白 2 つで字下げします'
  - id: PW-COMMON-17
    pattern: unwanted
    statement: 'もしツールが捕まえなかった pecot の独自の例外が起きたなら、リポジトリが曖昧なときも、`kind` が `other` の失敗を返します'
  - id: PW-COMMON-18
    pattern: unwanted
    statement: 'もし MCP のツールが失敗したなら、`isError` を `true` にし、`kind`・`detail` と、止まる前に進んだ項目を最上位に入れて返します'
  - id: PW-COMMON-19
    pattern: event
    statement: 'MCP のツールが warning を出すと、`warning: ` の前置きを除いた文を `warnings` に入れて返します。文の続きの行は、空白 2 つで字下げします'
  - id: PW-COMMON-20
    pattern: event
    statement: 'MCP のツールがファイルやディレクトリを作ると、その絶対パスを、ツールごとの項目（`file`・`path`・`configPath` など）に入れて返します'
  - id: PW-COMMON-21
    pattern: unwanted
    statement: 'もし `repo` を省き、git remote の URL から `owner/repo` を読めないなら、その理由を `detail` に入れて失敗を返します'
  - id: PW-COMMON-22
    pattern: unwanted
    statement: 'もし `repo` の無い短い形 `N` で `owner/repo` を remote の URL から読めないなら、`kind` が `invalid-input` の失敗を返します。`detail` には、短い形の案内と読めない理由を入れます'
  - id: PW-COMMON-23
    pattern: ubiquitous
    statement: '常に、git remote の URL から、次の 2 つの形で `owner/repo` を読みます。1 つはスキーム付きの `<scheme>://[user@]host[:port]/owner/repo[.git][/]` です。`<scheme>` は `http`・`https`・`ssh`・`git`・`ftp`・`ftps` のどれかです。もう 1 つは scp 形式の `[user@]host:[/]owner/repo[.git][/]` です'
  - id: PW-COMMON-24
    pattern: state
    statement: 'MCP のツールが子プロセス（fetch・ls-remote・push・`git pull`・`gh auth token`・`setup_command`・`nx graph`）を待つ間、ping へすぐ答えます'
  - id: PW-COMMON-25
    pattern: event
    statement: '子プロセスを待つ MCP のツールが取り消されると、子プロセスをその子ごと止め、ツールの続きを動かしません'
  - id: PW-COMMON-26
    pattern: unwanted
    statement: 'もし MCP のツールの失敗の文が 2 つ以上あるなら、どの文にも `error: ` の前置きを付けずに、改行でつないで `detail` に入れます'
  - id: PW-COMMON-27
    pattern: unwanted
    statement: 'もし MCP のツールが失敗の `detail` で次に呼ぶツールを案内するなら、ツール名と入力名で `call <ツール>` と書きます'
  - id: PW-COMMON-28
    pattern: unwanted
    statement: 'もし MCP のツールが使い方の誤りで失敗したなら、誤りの文だけを `detail` に入れます'
  - id: PW-COMMON-29
    pattern: event
    statement: 'MCP のツールが成功して結果の行を出すと、片付けの行を除いた最初の結果の行（dry-run の行を含む）を、`content` の最初の text にします'
  - id: PW-COMMON-30
    pattern: event
    statement: 'MCP のツールが結果の行を出さずに成功すると、標準出力の最初の空でない行を、`content` の最初の text にします'
  - id: PW-COMMON-31
    pattern: ubiquitous
    statement: '常に、応答の `structuredContent` と同じ内容の JSON を、`content` の text にも載せます'
common_mcp_output:
  fields:
    kind: '失敗の種別です。失敗のときだけ入ります。'
    detail: '失敗の全文です。エラーの文と、それに続く案内の行が入ります。案内は、ツール名と入力名で書いてあります。失敗のときだけ入ります。'
    log: '子プロセスの出力です。失敗のときだけ入り、出力を取れなかったときは入りません。'
    warnings: '警告の文の配列です。先頭の `warning: ` は外してあります。文の続きの行は、空白 2 つで字下げしてあります。警告が無いときは入りません。'
