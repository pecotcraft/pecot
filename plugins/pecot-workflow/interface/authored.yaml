    details:
      - 'アクティブなプロジェクト、登録したリポジトリ、ボードの状態を出します。'
      - 'ボードの状態は、Backlog・Pending・Blocked・Ready・Active・In Review にある open の項目が対象です。'
      - '登録したリポジトリの行には、リリースの種類と Dependabot alert の状態を載せます。'
      - 'alert を読めないリポジトリは、理由を出すだけで、コマンドは止まりません。'
      - '`--repo` か、pecot 全体のオプション `--repo` を渡すと、ボードの項目を 1 つのリポジトリに絞ります。'
      - 'Archived の項目は、更新の新しい 20 件を残して、ボードから削除します。'
      - '削除できない Archived の項目は飛ばして続けます。'
      - 'Ready と Blocked にある open の Issue の blocked-by を読み、それぞれを `startable`・`stackable`・`blocked` のどれかに判定します。Active と In Review の Issue は読みません。'
      - '判定は出すだけです。Issue の列と Status は、判定に合っていなくても変えません。'
      - '前提を読めない Issue は、`unknown` と出します。'
      - 'Issue の依存関係に対応していない GitHub Enterprise Server では、Readiness の列の無いボードを出します。'
      - '`pecot board sync` が列か Status を動かすはずの Ready か Blocked の Issue があると、`warning` の行を 1 つ書きます。行には件数を載せ、`pecot board sync` を案内します。件数の数え方は、`pecot board sync` と同じ規則です。前提の無い Blocked の Issue は、ブランチと PR を読んでいなくても数えます。そのため、行は、列か Status が合っていないおそれがあると伝えます。'
    stdin: none
    output:
      format: text
      description: 'Overview・Registered repositories・Board status の節がある Markdown です。Ready と Blocked の表には、Readiness の列があります。積める Issue があるときは、Stackable chains の節が続きます。`--json` を付けると、`project`・`repositories`・`board` を持つ JSON のオブジェクトです。`repositories` の各要素は `dependabot_alerts` を、`board` の各項目は `readiness` を持ちます。'
    diagnostics: '標準エラーに、削除した Archived の項目の結果の行を出します。削除できなかった Archived の項目には、`warning` の行を出します。GitHub Enterprise Server が Issue の依存関係に対応していないときは、`warning` の行を 1 つ出します。Ready か Blocked の Issue の列か Status が判定に合っていないおそれがあるときも、`warning` の行を 1 つ出します。'
    environment: []
    exit_status:
