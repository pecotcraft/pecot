  PW-RELEASE-MERGE:
    help:
      details:
        - Merges the PR with a regular merge (a merge commit), never a squash or a rebase, so that the merge-base is kept.
        - The PR is the pr_ref argument (owner/repo/N).
        - The short form N is rejected even when --repo is given.
        - The global pecot --repo is only compared with the current git remote and is not used as the target.
        - A mismatch between --repo and the current git remote stops the command.
        - Only a PR whose base branch equals the release_branch of the repository in the config file is merged.
        - A PR that is already merged or closed is not merged.
        - A PR with merge conflicts is not merged unless --admin is given.
        - With --admin, only the conflict check is skipped, and the GitHub API still decides whether the merge is allowed.
        - With --delete-branch, the head branch of the PR is deleted from the remote after the merge.
        - A failure to delete the head branch is a warning and does not change the exit status.
        - With --dry-run, nothing is merged or deleted, and --delete-branch has no effect.
        - When the release_branch is the default branch of the repository, GitHub may close the Issues that the PR refers to with a closing keyword.
      examples:
        - run: pecot release merge example-org/my-repo/123
          note: Merge the release PR with a merge commit.
        - run: pecot release merge example-org/my-repo/123 --dry-run
          note: Print the plan without merging.
        - run: pecot release merge example-org/my-repo/123 --delete-branch
          note: Merge the release PR and delete its head branch.
      default_notes: {}
    summary: リリースの PR を、通常のマージでマージします。
    arguments:
      admin: '管理者の権限でマージするかどうかです。マージできるかどうかの確認を飛ばします。'
      delete_branch: 'マージの後でブランチを削除するかどうかです。'
      dry_run: 'マージせずに、行う予定だけを出すかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/123` の形で渡します。'
    constraints: []
    details:
      - 'PR を通常のマージ（マージコミット）でマージします。merge-base を保つために、squash と rebase は使いません。'
      - '対象の PR は、引数 `pr_ref`（`owner/repo/N`）です。'
      - '短い形の `N` は、`--repo` を渡しても受け付けません。'
      - 'pecot 全体のオプション `--repo` は、今の git remote と比べるだけで、対象には使いません。'
      - '`--repo` が今の git remote と食い違うときは、止まります。'
      - 'マージするのは、base ブランチが設定ファイルにあるリポジトリの `release_branch` と同じ PR だけです。'
      - '既にマージ済みか閉じている PR は、マージしません。'
      - 'マージの衝突がある PR は、`--admin` を付けなければマージしません。'
      - '`--admin` で飛ばすのは、衝突の確認だけです。マージを許すかどうかは、GitHub API が決めます。'
      - '`--delete-branch` を付けると、マージの後で PR の head ブランチをリモートから削除します。'
      - 'head ブランチの削除に失敗しても `warning` として扱い、終了コードは変わりません。'
      - '`--dry-run` を付けると、何もマージせず、何も削除しません。`--delete-branch` を付けても何も変わりません。'
      - 'リポジトリの既定ブランチを `release_branch` にしているときは、GitHub が Issue を閉じることがあります。閉じるのは、PR がクローズのキーワードで参照している Issue です。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、マージの結果の行と、削除したブランチの結果の行を出します。`--dry-run` のときは、予定の行を出します。ブランチの削除に失敗したときは、`warning` の行を出します。失敗したときは、`error` の行を出します。`--repo` が git remote と違うときも含みます。'
    environment: []
    exit_status:
      - code: 0
        when: 'PR をマージしました。または、`--dry-run` で予定を出しました。'
      - code: 1
        when: '次のどれかです。`--repo` が今の git remote と違います。アクティブなプロジェクトがありません。PR が見つからないか、読めません。PR が既にマージ済みか、閉じています。PR に衝突があり、`--admin` がありません。`release_branch` が未設定です。PR の base ブランチが `release_branch` ではありません。GitHub API がマージを拒みました。git の外で `--repo` を省いたので、リポジトリが決まりません。プロジェクトのルートを決められません。'
      - code: 2
        when: '次のどれかです。PR の参照が `owner/repo/N` の形ではありません。PR の参照がありません。ほかのコマンドラインの誤りがあります。'
    on_error: 'マージに成功した後で head ブランチの削除に失敗したときは、PR はマージされたままで、head ブランチはリモートに残ります。'
