      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。'
    constraints: []
    details:
      - 'アクティブなプロジェクトの設定ファイルから、Epic を集めるリポジトリを消します。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、`kind` が `invalid-input` の失敗を返します。'
      - '未設定の値を消しても、何も変えずに、`change` を `unchanged` にして成功を返します。'
      - '消した後で `issue_create` に `type` の `epic` を渡すときは、引数 `repo` で作り先を渡します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        key: '消したキーです。今は `aggregation_repo` だけです。'
        previous: '実行前のキーの値です。未設定だったときは入りません。'
        change: '設定がどうなったかです。`delete`（キーを消した）か `unchanged`（もともと未設定だった）です。'
        configPath: 'アクティブなプロジェクトの設定ファイルの絶対パスです。`change` がどれでも入ります。'
    diagnostics: '標準エラーに、結果の行（`removed`、未設定だったときは `unchanged`）を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        when: '`key` がありません。`key` が `aggregation_repo` でないときと、知らない引数などほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
