  PW-PROJECT-CREATE:
    summary: 新しいプロジェクトを作ります。既にあるプロジェクトにフィールドを足すときは、`project_init` を使います。
    arguments:
      host: 'GitHub のホストです。'
      lanes: '`pecot-lane` のフィールドの値の配列です。値は、プラグイン・チーム・サービスのような作業の領域です。1 つ以上渡します。'
      owner: 'プロジェクトの所有者です。'
