  PW-SESSION-RESTORE:
    help:
      details:
        - Restores the work target that was lost from the session, which is the Issue the branch is working on.
        - Writes .pecot-active, holding owner/repo/N, under .pecot/state/ of the project root.
        - Writes .pecot-session-title, holding the session name, under .pecot/state/ of the project root.
        - An existing work target is overwritten.
        - Creates the work directory .pecot/work/N/ under the project root.
        - When the work directory cannot be created, the command goes on without it.
        - "The session name is #<number> followed by the Issue title, cut to 40 characters."
        - A leading [Task], [Bug] or [Epic] is removed from the Issue title.
        - "Without a title, the session name is #<number>."
        - The Issue title is read from GitHub.
        - When the active config file is missing or the Issue cannot be read, the command goes on with an empty title and no warning.
        - With --issue, the branch and the git remote are not read.
        - The reference of --issue must be the full form owner/repo/N.
        - Without --issue, the Issue number is the number at the end of the current branch name after the last slash.
        - Without --issue, the repository is the origin remote, or the first remote when there is no origin, and both are read in --directory.
        - The project root, and so the files above, are resolved from the working directory of the command, not from --directory.
      examples:
        - run: pecot session restore -D .
          note: Restore the work target from the branch name.
        - run: pecot session restore --issue example-org/my-repo/123 -D .
          note: Restore the work target of a given Issue.
      default_notes:
        issue: Inferred from the end of the current branch name and the origin remote, or the first remote when there is no origin, of --directory.
    summary: 失われたセッションのフラグ（`.pecot-active` など）を、ブランチの情報から復元します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      issue: 'Issue の参照です。`owner/repo/番号` の形で渡します。'
    constraints: []
    details:
      - 'セッションから失われた作業対象を復元します。作業対象は、ブランチで作業している Issue です。'
      - 'プロジェクトのルートの `.pecot/state/` の下に、`owner/repo/N` を入れた `.pecot-active` を書きます。'
      - 'プロジェクトのルートの `.pecot/state/` の下に、セッション名を入れた `.pecot-session-title` を書きます。'
      - '既にある作業対象は上書きします。'
      - 'プロジェクトのルートの下に、作業ディレクトリ `.pecot/work/N/` を作ります。'
      - '作業ディレクトリを作れないときは、作らないまま続けます。'
      - 'セッション名は、`#<番号>` に Issue の題を続けて、40 文字に切り詰めたものです。'
      - 'Issue の題の先頭の `[Task]`・`[Bug]`・`[Epic]` は取り除きます。'
      - '題が無いときのセッション名は、`#<番号>` です。'
      - 'Issue の題は、GitHub から読みます。'
      - 'アクティブな設定ファイルが無いときと、Issue を読めないときは、題を空にして続けます。`warning` は出しません。'
      - '`--issue` を付けると、ブランチと git remote を読みません。'
      - '`--issue` の参照は、フル形式の `owner/repo/N` でなければなりません。'
      - '`--issue` が無いときの Issue の番号は、今のブランチ名の最後のスラッシュより後ろにある、末尾の番号です。'
      - '`--issue` が無いときのリポジトリは、remote の `origin` です。`origin` が無ければ、最初の remote です。ブランチと remote は、`--directory` で読みます。'
      - 'プロジェクトのルートと上のファイルの場所は、`--directory` ではなく、コマンドの作業ディレクトリから決めます。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、記録した作業対象の `set` の行を出します。作業ディレクトリを作ったときは、行にそのディレクトリも載せます。失敗したときは、`error` の行を出します。アクティブな設定ファイルの内容が不正なときも含みます。ブランチ名から Issue の番号を推定できないときは、`error` の行に続けて、`--issue` を渡す案内を出します。'
    environment: []
    exit_status:
      - code: 0
        when: '作業対象を記録しました。'
      - code: 1
        when: '次のどれかです。`--issue` が無く、ブランチ名を読めません。`--issue` が無く、ブランチ名から Issue の番号を推定できません。`--issue` が無く、remote の `origin`（無ければ最初の remote）のリポジトリを読めません。作業対象を書けません。プロジェクトのルートを決められないときも含みます。アクティブな設定ファイルの内容が不正です（`error` の行を出します）。'
      - code: 2
        when: '次のどれかです。`--issue` が `owner/repo/N` の形ではありません。`--directory` がありません。`--directory` が、無いパス・ファイル・読めないディレクトリのどれかです。ほかのコマンドラインの誤りがあります。'
    on_error: '`.pecot-active` を書いた後で `.pecot-session-title` を書けなかったときは、`.pecot-active` は書かれたまま残ります。'
    effects:
      - target: file
        kind: write
        what: '`.pecot/state/` の下に `.pecot-active` と `.pecot-session-title` を書き、同じ場所の `.pecot-base` を消します。`.pecot/work/N/` も作ります。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: git
        kind: read
        what: 'ディレクトリの今のブランチと、remote の `origin` の URL を読みます。`origin` が無ければ、最初の remote の URL を読みます。'
      - target: github
        kind: read
        what: 'Issue の題を読みます。'
    prerequisites:
      - 'ディレクトリは、ブランチ名が Issue の番号で終わる git のリポジトリでなければなりません。`--issue` を付けたときは別です。'
    idempotent: true
    examples:
      - run: pecot session restore -D .
        note: 'ブランチ名から作業対象を復元します。'
      - run: pecot session restore --issue example-org/my-repo/123 -D .
        note: '渡した Issue の作業対象を復元します。'
    default_notes:
      issue: '省くと、`--directory` の今のブランチ名の末尾と、remote の `origin`（無ければ最初の remote）から推定します。'
    behaviors:
      - id: PW-SESSION-RESTORE-01
        pattern: event
        statement: '`--issue` に `owner/repo/N` を渡して打つと、その Issue を作業対象として記録します'
      - id: PW-SESSION-RESTORE-02
        pattern: event
        statement: '`--issue` を省いて打つと、ブランチ名の末尾の番号と `origin`（無ければ最初の remote）のリポジトリから作業対象の Issue を決めて記録します'
      - id: PW-SESSION-RESTORE-03
        pattern: event
        statement: '作業対象を記録すると、`.pecot-active` に `owner/repo/N` を書きます'
      - id: PW-SESSION-RESTORE-04
        pattern: event
        statement: '作業対象を記録すると、`.pecot-session-title` にセッション名を書きます'
      - id: PW-SESSION-RESTORE-05
        pattern: event
        statement: 'Issue の題名を GitHub から読めると、セッション名に番号と題名を入れます'
      - id: PW-SESSION-RESTORE-06
        pattern: event
        statement: '作業対象を記録すると、作業ディレクトリ `.pecot/work/N/` を作ります'
      - id: PW-SESSION-RESTORE-07
        pattern: event
        statement: '作業対象が既に記録されていると、新しい作業対象で上書きします'
      - id: PW-SESSION-RESTORE-08
        pattern: event
        statement: '作業対象を記録すると、`set` の行を標準エラーに出します'
      - id: PW-SESSION-RESTORE-09
        pattern: unwanted
        statement: 'もし Issue の題名を読めないなら、題名を入れずにセッション名を書きます'
      - id: PW-SESSION-RESTORE-10
        pattern: unwanted
        statement: 'もし Issue の題名を読めないなら、処理を続けます'
      - id: PW-SESSION-RESTORE-11
        pattern: unwanted
        statement: 'もし `--issue` が `owner/repo/N` の形でないなら、終了コード 2 で終わります'
      - id: PW-SESSION-RESTORE-12
        pattern: unwanted
        statement: 'もし `--directory` を省いたなら、終了コード 2 で終わります'
      - id: PW-SESSION-RESTORE-13
        pattern: unwanted
        statement: 'もし `--directory` が無いパス・ファイル・読めないディレクトリなら、終了コード 2 で終わります'
      - id: PW-SESSION-RESTORE-14
        pattern: unwanted
        statement: 'もし `--issue` を省いてブランチ名を読めないなら、終了コード 1 で終わります'
      - id: PW-SESSION-RESTORE-15
        pattern: unwanted
        statement: 'もし `--issue` を省いてブランチ名の末尾が番号でないなら、`--issue` を使う案内を添えた `error` の行を標準エラーに出します'
      - id: PW-SESSION-RESTORE-16
        pattern: unwanted
        statement: 'もし `--issue` を省いてブランチ名の末尾が番号でないなら、終了コード 1 で終わります'
      - id: PW-SESSION-RESTORE-17
        pattern: unwanted
        statement: 'もし `--issue` を省いて `origin`（無ければ最初の remote）のリポジトリを読めないなら、終了コード 1 で終わります'
      - id: PW-SESSION-RESTORE-18
        pattern: unwanted
        statement: 'もし作業対象のファイルを書けないなら、`error` の行を標準エラーに出します'
      - id: PW-SESSION-RESTORE-19
