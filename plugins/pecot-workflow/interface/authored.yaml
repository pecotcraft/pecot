  PW-PROJECT-INIT:
    help:
      details:
        - Adds the pecot-workflow-<suffix>, pecot-priority and pecot-size fields to an existing project.
        - A field that already exists is skipped.
        - The other fields are still created.
        - Adds the Blocked option to a pecot-workflow-<suffix> field that already exists, placed right after Backlog (right before Ready when there is no Backlog, at the end when there is neither).
        - Adds the Needs Attention option at the end of the Status field. When the project has no Status field, nothing is added.
        - Names are compared without regard to case, and an option that already exists is left as it is.
        - The whole option list is sent again with the existing options keeping their id, name, color and description, so the values on the cards stay.
        - When an option cannot be added, a warning line is written and the command continues; the option is not sent again without its id.
        - Before writing anything, checks that an existing pecot-workflow-<suffix> field has the six required options (Backlog, Pending, Ready, Active, In Review, Archived); if one is missing, writes nothing and stops.
        - After that, regenerates the config file from GitHub for the --suffix field and makes the project active, unless a config file exists and its content already equals the one generated from the board.
      examples:
        - run: pecot project init example-org "Example Project" --suffix example
          note: Add the pecot-workflow fields to an existing project, and the Blocked and Needs Attention options to the fields that already exist.
      default_notes: {}
    summary: 既にあるプロジェクトに pecot-workflow のフィールドを足します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。
    arguments:
      host: 'GitHub のホストです。'
      name: 'プロジェクトの題です。'
      owner: 'プロジェクトの所有者です。'
      suffix: 'ワークフローのフィールドに付ける接尾辞です。'
    constraints: []
    details:
      - '既にあるプロジェクトに、`pecot-workflow-<suffix>`・`pecot-priority`・`pecot-size` のフィールドを足します。'
      - '既にあるフィールドは飛ばします。'
      - 'そのときも、ほかのフィールドは作ります。'
      - '既にある `pecot-workflow-<suffix>` のフィールドには、Blocked の選択肢を Backlog の直後に足します。Backlog が無ければ Ready の直前、どちらも無ければ末尾に足します。'
      - 'Status のフィールドの末尾に、Needs Attention の選択肢を足します。プロジェクトに Status のフィールドが無いときは、何も足しません。'
      - '名前は、大文字と小文字を区別せずに比べます。既にある選択肢は、そのまま残します。'
      - '選択肢の一覧は、全体を送り直します。既にある選択肢は id・name・color・description を保つので、カードの値は残ります。'
      - '選択肢を足せないときは、`warning` の行を書いて続けます。その選択肢を、id なしで送り直すことはありません。'
      - '何かを書く前に、既にある `pecot-workflow-<suffix>` のフィールドが必須の 6 つの選択肢を持つことを確かめます。6 つは Backlog・Pending・Ready・Active・In Review・Archived です。1 つでも欠けていれば、何も書かずに止まります。'
      - 'その後、`--suffix` のフィールドの設定ファイルを GitHub から作り直し、プロジェクトをアクティブにします。設定ファイルがあり、内容がボードから作るものと既に同じときは行いません。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、フィールドごとの結果の行（`created` か `skipped`）と、選択肢ごとの結果の行（`added` か `unchanged`）を出します。Status のフィールドが見つからないときは、`skipped` の行を出します。選択肢を足せないときは、`warning` の行を出します。設定ファイルを書いたときは、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'どのフィールドも、作ったか、既にありました。足せなかった選択肢があっても、終了コードは変わりません。'
      - code: 1
        when: '次のどれかです。プロジェクトが見つかりません。プロジェクトのフィールドを読めません。既にある `pecot-workflow-<suffix>` のフィールドに、必須の選択肢がありません。GitHub API が、選択肢を足せない失敗のほかのエラーを返しました。プロジェクトのルートを決められません。'
      - code: 2
        when: '必須の引数か `--suffix` が無いか、ほかのコマンドラインの誤りがあります。'
    on_error: '失敗した手順より前に作ったフィールドと足した選択肢は、プロジェクトに残ります。'
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクト、対象のプロジェクトのフィールド、つながっているリポジトリを読みます。'
      - target: github
        kind: write
        what: 'プロジェクトに足りないフィールドを作ります。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下に設定ファイルを書き、アクティブなプロジェクトを設定します。既にある設定ファイルが、ボードから作るものと同じときは書きません。'
    prerequisites:
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - run: pecot project init example-org "Example Project" --suffix example
        note: '既にあるプロジェクトに pecot-workflow のフィールドを足します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-INIT-01
        pattern: event
        statement: 'フィールドの無いプロジェクトに打つと、pecot-workflow の 3 つのフィールドを作ります'
      - id: PW-PROJECT-INIT-02
        pattern: event
        statement: 'フィールドを作ると、`created` の行を標準エラーに出します'
      - id: PW-PROJECT-INIT-03
        pattern: event
        statement: '既にあるフィールドがあると、そのフィールドは作らずに `skipped` の行を標準エラーに出します'
      - id: PW-PROJECT-INIT-04
        pattern: unwanted
        statement: 'もし指定したタイトルのプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PROJECT-INIT-05
        pattern: unwanted
        statement: 'もしフィールドの作成で GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-PROJECT-INIT-06
        pattern: event
        statement: '既にあるフィールドに Blocked か Needs Attention が無いと、その選択肢を足して `added` の行を標準エラーに出します'
      - id: PW-PROJECT-INIT-07
        pattern: event
        statement: '選択肢を足すと、既存の選択肢を `id`・`name`・`color`・`description` のまま送り、Blocked は Backlog の直後、Needs Attention は末尾に置きます'
      - id: PW-PROJECT-INIT-08
        pattern: event
        statement: '設定ファイルが無いか、ボードから作る内容と違うと、設定ファイルを同期して Blocked と Needs Attention の id を書きます'
      - id: PW-PROJECT-INIT-09
        pattern: unwanted
        statement: 'もし足す選択肢が既にあるなら、書き込まずに `unchanged` の行を標準エラーに出します'
      - id: PW-PROJECT-INIT-10
        pattern: unwanted
        statement: 'もし Status のフィールドが無いなら、何も足さずに `skipped` の行を標準エラーに出します'
      - id: PW-PROJECT-INIT-11
        pattern: unwanted
        statement: 'もし選択肢を足せなかったなら、`warning` の行を標準エラーに出して続け、終了コード 0 で終わります'
      - id: PW-PROJECT-INIT-12
        pattern: unwanted
        statement: 'もし設定ファイルがあり、内容がボードから作る内容と同じなら、設定ファイルとアクティブのどちらも書き換えません'
      - id: PW-PROJECT-INIT-13
        pattern: unwanted
        statement: 'もし既にある進行の欄に必須の値が欠けているなら、何も書かずに `missing options` の行を出して、終了コード 1 で終わります'
      - id: PW-PROJECT-INIT-14
        pattern: event
        statement: 'suffix の違う進行の欄が複数あるボードに打つと、`--suffix` の欄で設定ファイルを同期します'
      - id: PW-PROJECT-INIT-15
        pattern: unwanted
        statement: 'もし設定ファイルの同期で GitHub API がエラーを返したなら、`could not sync project config` の行を出して、終了コード 1 で終わります'
  PW-PROJECT-LIST:
    help:
      details:
        - Lists the config files under .pecot/config/projects/ in file name order.
        - Marks the active project with [ACTIVE].
      examples:
        - run: pecot project list
          note: List the config files and the active project.
      default_notes: {}
    summary: 使えるプロジェクトを一覧します。
    constraints: []
    details:
      - '`.pecot/config/projects/` の下の設定ファイルを、ファイル名の順に一覧します。'
      - 'アクティブなプロジェクトに `[ACTIVE]` の印を付けます。'
    stdin: none
    output:
      format: text
      description: '見出しの行に続けて、設定ファイルの名前を 1 行ずつ出します。設定ファイルが無ければ、`none` を出します。'
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: '一覧を出しました。'
      - code: 1
        when: 'プロジェクトのルートを決められません。'
      - code: 2
        when: '知らないオプションなど、コマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: '`.pecot/config/projects/` の下の設定ファイルと、アクティブなプロジェクトの設定を読みます。'
    prerequisites: []
    idempotent: true
    examples:
      - run: pecot project list
        note: '設定ファイルとアクティブなプロジェクトを一覧します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-LIST-01
        pattern: event
        statement: '設定ファイルがあると、ファイル名の順に 1 行ずつ標準出力に出します'
      - id: PW-PROJECT-LIST-02
        pattern: event
        statement: 'アクティブなプロジェクトの設定ファイルがあると、その行の末尾に `[ACTIVE]` を付けます'
      - id: PW-PROJECT-LIST-03
        pattern: event
        statement: '設定ファイルが 1 つも無いと、`none` の行を標準出力に出します'
  PW-PROJECT-SEARCH:
    help:
      details:
        - Lists the GitHub Projects V2 projects of a user or an organization.
        - A title longer than 38 characters is cut to 35 characters followed by "...".
      examples:
        - run: pecot project search example-org
          note: List the projects of an organization.
      default_notes: {}
    summary: GitHub API でプロジェクトを探します。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
    constraints: []
    details:
      - 'ユーザーか organization の、GitHub Projects V2 のプロジェクトを一覧します。'
      - '38 文字を超える題は、35 文字に切り詰めて `...` を付けます。'
    stdin: none
    output:
      format: text
      description: '見出しの行、空行、列の見出しの行、ハイフン 80 個の区切りの行を出します。続けて、プロジェクトごとに番号・題・URL の行を 1 つ出します。'
    diagnostics: default
    environment: []
    exit_status:
      - code: 0
        when: 'プロジェクトを出しました。'
      - code: 1
        when: '次のどれかです。所有者にプロジェクトがありません。GitHub API がエラーを返しました。プロジェクトのルートを決められません。'
      - code: 2
        when: '所有者の引数が無いか、ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクトを読みます。'
    prerequisites:
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot project search example-org
        note: 'organization のプロジェクトを一覧します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SEARCH-01
        pattern: event
        statement: 'プロジェクトを持つ所有者を渡すと、番号・タイトル・URL の表を標準出力に出します'
      - id: PW-PROJECT-SEARCH-02
        pattern: event
        statement: 'タイトルが 38 文字を超えると、35 文字に切り詰めて末尾に `...` を付けます'
      - id: PW-PROJECT-SEARCH-03
        pattern: unwanted
        statement: 'もしプロジェクトが 1 件も無いなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SEARCH-04
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
  PW-PROJECT-SET-AGGREGATION-REPO:
    help:
      details:
        - Stores the Epic aggregation repository in the config file of the active project.
        - pecot issue create --type epic uses the stored repository as the destination.
        - Overwriting a different value always writes a warning line.
        - --yes only omits the confirmation hint from the warning line.
        - Giving the value already stored changes nothing.
      examples:
        - run: pecot project set-aggregation-repo example-org/roadmap
          note: Set the aggregation repository.
      default_notes: {}
    summary: Epic を集めるリポジトリ（`aggregation_repo`）を設定します。
    arguments:
      value: 'Epic を集めるリポジトリです。`owner/repo` の形で渡します。'
      yes: '既にある値を、確認なしで上書きするかどうかです。`warning` は標準エラーに出ます。'
    constraints: []
    details:
      - 'Epic を集めるリポジトリを、アクティブなプロジェクトの設定ファイルに保存します。'
      - '`pecot issue create --type epic` は、保存したリポジトリを作り先に使います。'
      - '違う値を上書きするときは、必ず `warning` の行を書きます。'
      - '`--yes` は、`warning` の行から確認の案内を省くだけです。'
      - '既に保存してある値と同じ値を渡すと、何も変えません。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、結果の行（`set` か `unchanged`）を出します。違う値を上書きしたときは、`warning` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: '値を設定したか、既に設定してありました。'
      - code: 1
        when: '次のどれかです。値が `owner/repo` の形ではありません。アクティブなプロジェクトがありません。アクティブな設定ファイルの内容が不正です。プロジェクトのルートを決められません。'
      - code: 2
        when: '値の引数が無いか、ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'アクティブな設定ファイルに `aggregation_repo` を書きます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
    idempotent: true
    examples:
      - run: pecot project set-aggregation-repo example-org/roadmap
        note: 'Epic を集めるリポジトリを設定します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SET-AGGREGATION-REPO-01
        pattern: event
        statement: '未設定の状態で値を渡すと、設定ファイルに書きます'
      - id: PW-PROJECT-SET-AGGREGATION-REPO-02
        pattern: event
        statement: '未設定の状態で値を渡すと、`set` の行を標準エラーに出します'
      - id: PW-PROJECT-SET-AGGREGATION-REPO-03
        pattern: event
        statement: '既にある値と同じ値を渡すと、`unchanged` の行を標準エラーに出します'
      - id: PW-PROJECT-SET-AGGREGATION-REPO-04
        pattern: unwanted
        statement: 'もし既にある値と違う値を渡したなら、上書きの `warning` の行を標準エラーに出します'
      - id: PW-PROJECT-SET-AGGREGATION-REPO-05
        pattern: event
        statement: '`--yes` を付けて上書きすると、`warning` の行から確認の案内を省きます'
      - id: PW-PROJECT-SET-AGGREGATION-REPO-06
        pattern: unwanted
        statement: 'もし値が `owner/repo` の形でないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-AGGREGATION-REPO-07
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
  PW-PROJECT-SET-REPO:
    help:
      details:
        - Links the repository to the GitHub project and adds it to the config file of the active project.
        - The config file is written only after the link succeeded.
        - For a repository already registered, updates only the settings given on the command line.
        - Giving --package replaces the packages of a registered repository and also clears its changelog_file, even when --changelog-file is not given.
        - Giving --clear-packages removes the packages of a registered repository.
        - The repository owner must match the project owner.
      examples:
        - run: pecot project set-repo example-org/my-repo
          note: Register a repository.
        - run: pecot project set-repo example-org/my-repo --package pecot:plugins/pecot-workflow/CHANGELOG.md
          note: Register a monorepo package.
      default_notes:
        release_type: Inferred from the packages when omitted (multi with packages, single without).
    summary: プロジェクトの設定に、リポジトリを足すか更新します。
    arguments:
      changelog_file: 'CHANGELOG のファイル名です。'
      clear_packages: '既にある packages の設定を消すかどうかです。消した後の CHANGELOG は、`--changelog-file` の値か、既定の `CHANGELOG.md` に戻ります。'
      develop_branch: '開発ブランチの名前です。'
      owner_repo: 'リポジトリの名前です。`owner/repo` の形で渡します。'
      package: 'monorepo のパッケージです。`NAME:PATH` の形で登録します。繰り返して複数渡せます。例は `--package pecot:plugins/pecot-workflow/CHANGELOG.md` です。'
      release_branch: 'リリースブランチの名前です。'
      release_type: 'リリースの方法の宣言です。w-release スキルが、この値で手順を選びます。`single`（CHANGELOG が 1 つ）・`multi`（packages）・`nx`（Nx Release）のどれかを渡します。'
    constraints:
      - conflicts: [package, changelog_file]
      - conflicts: [package, clear_packages]
    details:
      - 'リポジトリを GitHub のプロジェクトにつなぎ、アクティブなプロジェクトの設定ファイルに足します。'
      - '設定ファイルを書くのは、つなぐのに成功した後だけです。'
      - '登録済みのリポジトリでは、コマンドラインで渡した設定だけを更新します。'
      - '`--package` を渡すと、登録済みのリポジトリの packages を置き換えます。`--changelog-file` を渡していなくても、`changelog_file` を消します。'
      - '`--clear-packages` を渡すと、登録済みのリポジトリの packages を消します。'
      - 'リポジトリの所有者は、プロジェクトの所有者と一致していなければなりません。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、プロジェクトへのつなぎの結果の行（`added`、既につながっていれば `unchanged`）を出します。設定ファイルの結果の行（`added` か `updated`）も出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'リポジトリを登録したか、更新しました。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。アクティブな設定ファイルの内容が不正です。リポジトリが `owner/repo` の形でないか、所有者がプロジェクトの所有者と違います。つなぐのに失敗しました。`--package` を `--changelog-file` か `--clear-packages` と一緒に渡したか、`--package` の形が誤っています。packages を持つリポジトリに `--changelog-file` を渡しました。`--release-type` が `single`・`multi`・`nx` のどれでもありません。プロジェクトのルートを決められません。'
      - code: 2
        when: 'リポジトリの引数が無いか、ほかのコマンドラインの誤りがあります。'
    on_error: 'リポジトリをつなぐのに失敗したときは、設定ファイルを書きません。'
    effects:
      - target: github
        kind: write
        what: '新しいリポジトリをプロジェクトにつなぎます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'アクティブな設定ファイルに、リポジトリを足すか更新します。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot project set-repo example-org/my-repo
        note: 'リポジトリを登録します。'
      - run: pecot project set-repo example-org/my-repo --package pecot:plugins/pecot-workflow/CHANGELOG.md
        note: 'monorepo のパッケージを登録します。'
    default_notes:
      release_type: '省くと、packages から推定します。packages があれば `multi`、無ければ `single` です。'
    behaviors:
      - id: PW-PROJECT-SET-REPO-01
        pattern: event
        statement: '未登録のリポジトリを渡すと、プロジェクトにリンクします'
      - id: PW-PROJECT-SET-REPO-02
        pattern: event
        statement: 'リンクに成功すると、設定ファイルにリポジトリを足します'
      - id: PW-PROJECT-SET-REPO-03
        pattern: event
        statement: '登録済みのリポジトリを渡すと、渡したオプションの値だけを更新します'
      - id: PW-PROJECT-SET-REPO-04
        pattern: event
        statement: '登録済みのリポジトリに `--package` を渡すと、`packages` を置き換えます'
      - id: PW-PROJECT-SET-REPO-05
        pattern: event
        statement: '登録済みのリポジトリに `--package` を渡すと、`changelog_file` を消します'
      - id: PW-PROJECT-SET-REPO-06
        pattern: event
        statement: '登録済みのリポジトリに `--clear-packages` を付けると、`packages` を消します'
      - id: PW-PROJECT-SET-REPO-07
        pattern: unwanted
        statement: 'もしリンクに失敗したなら、設定ファイルを書き換えません'
      - id: PW-PROJECT-SET-REPO-08
        pattern: unwanted
        statement: 'もしリンクに失敗したなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-09
        pattern: unwanted
        statement: 'もし `--package` と `--changelog-file` を一緒に渡したなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-10
        pattern: unwanted
        statement: 'もし `--package` と `--clear-packages` を一緒に渡したなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-11
        pattern: unwanted
        statement: 'もし `--package` が `NAME:PATH` の形でないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-12
        pattern: unwanted
        statement: 'もし `--package` の `NAME` が重なるなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-13
        pattern: unwanted
        statement: 'もしリポジトリの所有者がプロジェクトの所有者と違うなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-14
        pattern: unwanted
        statement: 'もしリポジトリが `owner/repo` の形でないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-15
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-16
        pattern: unwanted
        statement: 'もし `--release-type` が `single`・`multi`・`nx` のどれでもないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-SET-REPO-17
        pattern: unwanted
        statement: 'もし `packages` を持つリポジトリに `--changelog-file` を渡したなら、終了コード 1 で終わります'
  PW-PROJECT-SHOW-AGGREGATION-REPO:
    help:
