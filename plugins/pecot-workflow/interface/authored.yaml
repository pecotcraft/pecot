      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '手順のどれかで失敗したときは、GitHub に何も作りません。'
    effects:
      - target: github
        kind: write
        what: 'リリースとタグを作ります。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルと CHANGELOG を読みます。'
      - target: git
        kind: read
        what: 'git のリポジトリのルートと、remote の `origin` の URL を読みます。`origin` が無ければ、最初の remote の URL を読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
