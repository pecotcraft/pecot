      - kind: github-not-found
        code: 1
        when: 'PR が見つかりません。'
      - kind: pr-state
        code: 1
        when: 'PR をマージできる状態ではありません。次のどれかです。既にマージ済みか、閉じています。衝突があるのに `--admin` を付けていません。base ブランチが `release_branch` ではありません。'
      - kind: repo-setting-missing
        code: 1
        when: '`release_branch` が未設定です。'
      - kind: github-api
