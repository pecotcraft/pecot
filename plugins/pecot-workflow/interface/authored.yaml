      - id: PW-ISSUE-REOPEN-26
        pattern: event
        statement: 'ボードの項目の組み込みの `Status` が `Done` の Issue を開き直すと、開き直す前に `Status` の値を消し、結果の `doneCleared` を `true` にします'
      - id: PW-ISSUE-REOPEN-27
        pattern: unwanted
        statement: 'もし `Status` の `Done` を消せないなら、ボードの自動化が閉じ直しうることを `warnings` で伝え、reopen とコメントの投稿を続けます'
      - id: PW-ISSUE-REOPEN-28
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-ISSUE-REOPEN-29
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-ISSUE-SHOW:
    help:
      details:
        - Fetches one Issue with a single GraphQL query.
        - Prints the title, state, parent Issue, linked branches, linked PRs, sub-issues, body and comments.
        - For an Issue with blocked-by, also prints a Blocked by line with each prerequisite and a Readiness line with the judgment.
        - When the blocked-by cannot be read, prints a warning and the rest of the Issue as before.
        - Shows at most --comment-limit comments, from 0 to 20; 0 hides them.
        - With --json, prints the same data as JSON.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
        - --project names the project config to use. Without it, the config that includes the repository of the Issue is used; when several do, the active one among them.
      examples:
        - run: pecot issue show example-org/my-repo/12
          note: Show the Issue as Markdown.
        - run: pecot issue show example-org/my-repo/12 --json -c 0
          note: Show the Issue as JSON without comments.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: Issue の詳細を、必要な項目だけ GraphQL で取得して出します。
    arguments:
      comment_limit: '返すコメントの数です。0 から 20 で渡します。0 にすると、コメントを返しません。'
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      json: 'JSON で出力するかどうかです。結果の項目は、この値によらず同じです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
    constraints: []
    details:
      - 'GraphQL のクエリ 1 回で、Issue を 1 件取得します。'
      - '題・状態・親 Issue・紐づいたブランチ・紐づいた PR・sub-issue・本文・コメントを返します。'
      - 'blocked-by のある Issue では、前提を並べた `blockedBy` と、判定の `readiness` も返します。'
      - 'blocked-by を読めないときは、`warnings` に入れ、Issue の残りを今までどおり返します。'
      - 'コメントは、多くても `comment_limit` 件まで返します。値は 0 から 20 で、0 にするとコメントを返しません。'
      - '`json` を付けても、結果の項目は変わりません。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、Issue のリポジトリを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '`## #<N> <title>` の見出しで始まる Markdown です。続けて、状態、親、Blocked by と Readiness の行、紐づいたブランチ、紐づいた PR、sub-issue、本文、コメントを出します。`--json` を付けると、同じデータに `blockedBy` と `readiness` を足した JSON のオブジェクトです。'
    mcp_output:
      fields:
        number: 'Issue の番号です。キーは snake_case です。'
        state: 'Issue の状態です。`OPEN` か `CLOSED` です。'
        title: 'Issue のタイトルです。'
        body: 'Issue の本文です。'
        comments: 'コメントです。`total_count`（全コメントの数）と `nodes`（新しいほうから `comment_limit` 件）を持ちます。`nodes` の要素は `author`・`created_at`・`body` を持ちます。削除されたユーザーの `author` は `ghost` です。'
        parent: '親の Issue です。`number`・`title`・`state`・`owner`・`repo` を持ちます。親が無いときは `null` です。'
        sub_issues: 'sub-issue の配列です。要素は `number`・`state`・`title` を持ちます。'
        linked_branches: 'Issue に紐づいたブランチ名の配列です。'
        linked_prs: 'Issue に紐づいた PR の配列です。要素は `number`・`title`・`state` を持ちます。'
        owner: 'Issue があるリポジトリのオーナーです。'
        repo: 'Issue があるリポジトリの名前です。'
        blockedBy: '前提（blocked-by）の配列です。読めなかったときは `null` です。要素は `number`・`repository`・`state`・`wait`・`reason` を持ちます。`wait` は `stack` か `merge`、`reason` は Waits for merge の節に書いた理由（無ければ `null`）です。'
        readiness: 'Readiness の判定です。判定できなかったときは `null` です。`kind`（`startable`・`stackable`・`blocked`）・`stackOn`・`reason`・`text` を持ちます。`stackOn` は積む前提で、`stackable` 以外は `null` です。`reason` は `blocked` の理由の符号で、`blocked` 以外は `null` です。'
    diagnostics: '本文の Waits for merge の節が blocked-by と食い違うか、形が誤っているときは、`warning` の行を出します。blocked-by を読めないときも、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っています。`comment_limit` が 0 から 20 の外のときと、ほかの引数の誤りも含みます。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'Issue と、その親・sub-issue・紐づいたブランチ・紐づいた PR・コメントを読みます。blocked-by と、それぞれの前提の状態も読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          issue_ref: example-org/my-repo/12
        note: 'Issue の詳細を返します。'
      - arguments:
          issue_ref: example-org/my-repo/12
          json: true
          comment_limit: 0
        note: 'Issue の詳細を、コメントなしで返します。'
    default_notes:
