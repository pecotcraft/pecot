  PW-ISSUE-READ:
    help:
      details:
        - Fetches one Issue with a single GraphQL query.
        - Prints the title, state, parent Issue, linked branches, linked PRs, sub-issues, body and comments.
        - For an Issue with blocked-by, also prints a Blocked by line with each prerequisite and a Readiness line with the judgment.
        - When the blocked-by cannot be read, prints a warning and the rest of the Issue as before.
        - Shows at most --comment-limit comments, from 0 to 20; 0 hides them.
        - With --json, prints the same data as JSON.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot issue read example-org/my-repo/12
          note: Show the Issue as Markdown.
        - run: pecot issue read example-org/my-repo/12 --json -c 0
          note: Show the Issue as JSON without comments.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: Issue の詳細を、必要な項目だけ GraphQL で取得して出します。
    arguments:
      comment_limit: '出すコメントの数です。0 から 20 で渡します。0 にすると、コメントを出しません。'
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      json: 'JSON で出力するかどうかです。'
    constraints: []
    details:
      - 'GraphQL のクエリ 1 回で、Issue を 1 件取得します。'
      - '題・状態・親 Issue・紐づいたブランチ・紐づいた PR・sub-issue・本文・コメントを出します。'
      - 'blocked-by のある Issue では、前提を並べた Blocked by の行と、判定を書いた Readiness の行も出します。'
      - 'blocked-by を読めないときは、`warning` を出し、Issue の残りを今までどおり出します。'
      - 'コメントは、多くても `--comment-limit` 件まで出します。値は 0 から 20 で、0 にするとコメントを出しません。'
      - '`--json` を付けると、同じデータを JSON で出します。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: text
      description: '`## #<N> <title>` の見出しで始まる Markdown です。続けて、状態、親、Blocked by と Readiness の行、紐づいたブランチ、紐づいた PR、sub-issue、本文、コメントを出します。`--json` を付けると、同じデータに `blockedBy` と `readiness` を足した JSON のオブジェクトです。'
    diagnostics: '本文の Waits for merge の節が blocked-by と食い違うか、形が誤っているときは、`warning` の行を出します。blocked-by を読めないときも、`warning` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'Issue を出しました。'
      - code: 1
        when: 'アクティブなプロジェクトが無いか、GitHub API がエラーを返しました。'
      - code: 2
        when: '次のどれかです。Issue の参照の形が誤っています。`--comment-limit` が 0 から 20 の外です。ほかのコマンドラインの誤りがあります。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'Issue と、その親・sub-issue・紐づいたブランチ・紐づいた PR・コメントを読みます。blocked-by と、それぞれの前提の状態も読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: pecot issue read example-org/my-repo/12
        note: 'Issue を Markdown で出します。'
      - run: pecot issue read example-org/my-repo/12 --json -c 0
        note: 'Issue を、コメントなしの JSON で出します。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-READ-01
        pattern: event
        statement: 'Issue の参照を渡すと、見出し・状態・本文を Markdown で標準出力に出します'
      - id: PW-ISSUE-READ-02
        pattern: event
        statement: '親 Issue がある Issue を読むと、親 Issue を出します'
      - id: PW-ISSUE-READ-03
        pattern: event
        statement: 'リンクされたブランチがある Issue を読むと、そのブランチを出します'
      - id: PW-ISSUE-READ-04
        pattern: event
        statement: 'リンクされた PR がある Issue を読むと、その PR を出します'
