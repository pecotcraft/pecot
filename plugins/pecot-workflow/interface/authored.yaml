      - target: git
        kind: read
        what: 'git のリポジトリのルートと、remote の `origin` の URL を読みます。`origin` が無ければ、最初の remote の URL を読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - '作業ディレクトリは、git のリポジトリの中でなければなりません。'
      - '設定ファイルに、リポジトリの `release_branch` が要ります（`pecot project set-repo` で設定します）。'
      - 'CHANGELOG に、その版の節が要ります。'
      - 'ホストの GitHub トークンと、リリースを作る権限が要ります。'
    idempotent: false
    examples:
      - run: pecot release create 0.6.1
        note: 'CHANGELOG から、リリース `v0.6.1` を作ります。'
      - run: pecot release create 0.6.1 --dry-run
        note: '何も作らずに、予定とリリースノートを出します。'
      - run: pecot release create 0.6.1 --package pecot-workflow
        note: 'monorepo で、リリース `pecot-workflow-v0.6.1` を作ります。'
    default_notes:
      package: '省くと、値はありません。設定ファイルでリポジトリに packages を設定しているときは必須です。'
    behaviors:
      - id: PW-RELEASE-CREATE-01
