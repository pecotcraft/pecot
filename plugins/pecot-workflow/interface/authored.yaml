    summary: 'PR に投稿する、レビューの指摘のコメントのテンプレートです。`issue_comment` に渡します。'
  pecot-template://comment/review-resolution:
    summary: 'レビューの指摘への対応を伝えるコメントのテンプレートです。`issue_comment` に渡します。'
  pecot-template://comment/precede-notify:
    summary: '前提がマージされたことを、待っている Issue に伝えるコメントのテンプレートです。`issue_comment` に渡します。'
