      - id: PW-ISSUE-READ-19
        pattern: unwanted
        statement: 'もし済んでいない前提があり、リポに `develop_branch` が無いなら、Blocked by の行と `unknown` の判定を出し、`warning` の行を出します'
      - id: PW-ISSUE-READ-20
        pattern: unwanted
        statement: 'もし前提の積む先の PR を読めないなら、`warning` の行を出し、Blocked by の行と `unknown` の判定を出します'
      - id: PW-ISSUE-READ-21
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、`warning` の行を出し、Blocked by と Readiness の行を省きます'
      - id: PW-ISSUE-READ-22
        pattern: event
        statement: '前提が 0 件の Issue を読むと、前提を個別に読まず、判定を `startable` にします'
  PW-ISSUE-REOPEN:
    help:
      details:
        - Reopens a closed Issue and sets its status on the project board.
        - Sets the status given by --status, and ready when it is not given.
        - Waits 3 seconds after setting the status and reopens the Issue a second time, because board automation can close it again.
        - With --comment, posts the given reason as a comment after the Issue is reopened.
        - Each run with --comment posts another comment.
        - An Issue that is not on the board is reopened with a warning and its status is not changed.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot issue reopen example-org/my-repo/12 --status active --comment "The fix did not hold."
          note: Reopen an Issue as active and leave the reason.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 閉じた Issue を開き直し、ボードの status も設定します。
    arguments:
      comment: '開き直す理由です。コメントとして投稿します。'
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      status: '開き直した後の status です。`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
    constraints: []
    details:
      - '閉じた Issue を開き直し、プロジェクトのボードの status を設定します。'
      - '`--status` の値を設定します。渡さなければ `ready` にします。'
      - 'status を設定してから 3 秒待ち、Issue をもう一度開き直します。ボードの自動化が Issue を閉じ直すことがあるためです。'
      - '`--comment` を付けると、Issue を開き直した後で、渡した理由をコメントとして投稿します。'
      - '`--comment` を付けて実行するたびに、コメントが 1 件増えます。'
      - 'ボードに無い Issue は、`warning` を出して開き直し、status は変えません。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、結果の行を出します。`set`（status）、`reopened`（Issue）、`created`（コメント）です。Issue がボードに無いときと、status がプロジェクトに設定されていないときは、`warning` の行を出します。値が `blocked` のときは、`hint` の行が `pecot project init` の実行を案内します。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'Issue を開き直しました。'
      - code: 1
        when: '次のどれかです。status が有効な値ではありません。アクティブなプロジェクトがありません。リポジトリがプロジェクトにありません。2 回目に開き直した後も、Issue が open ではありません。コメントの投稿に失敗しました。GitHub API がエラーを返しました。'
      - code: 2
        when: 'Issue の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
    on_error: 'コメントの投稿に失敗したときは、Issue は新しい status で open のまま残り、終了コード 1 で終わります。2 回目に開き直した後も Issue が open でないときは、status は変わったまま残り、終了コード 1 で終わります。'
    effects:
      - target: github
        kind: write
        what: 'Issue を開き直し、ボードの項目の status のフィールドを設定し、コメントを投稿します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリと、Issue のボードの項目を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: "pecot issue reopen example-org/my-repo/12 --status active --comment \"The fix did not hold.\""
        note: 'Issue を `active` で開き直し、理由を残します。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-REOPEN-01
        pattern: event
        statement: '閉じた Issue の参照を渡すと、その Issue を reopen します'
      - id: PW-ISSUE-REOPEN-02
