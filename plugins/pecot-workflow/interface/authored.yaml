        statement: 'もし親 PR が開いておらず、マージもされていないなら、PR を作りません。`detail` を `base branch <base> has no open PR` で始め、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-CREATE-58
        pattern: unwanted
        statement: 'もし親 PR が開いているのに base が開発ブランチなら、`kind` が `content-invalid` の失敗を返します'
      - id: PW-PR-CREATE-59
        pattern: unwanted
        statement: 'もしスタックした base の記録の形が誤っているなら、`kind` が `content-invalid` の失敗を返します'
      - id: PW-PR-CREATE-60
        pattern: unwanted
        statement: 'もしスタックに登録できないなら、`could not register stack: <理由>` の文を `warnings` に入れ、PR は残します'
      - id: PW-PR-CREATE-61
        pattern: unwanted
        statement: 'もし待っている Issue を読めないか動かせないなら、接続の失敗でも `warnings` に入れ、成功と失敗は変えません。選択肢の ID が古くて動かせないときは、ID を読み直す `project_activate` の案内を、In Review の書き込みと合わせて 1 回だけ添えます'
      - id: PW-PR-CREATE-62
        pattern: event
        statement: 'スタックした base の記録があるときに題の scope を確かめると、親 PR がマージ済みなら記録のコミットから head までの差分で、開いている間は親ブランチとの差分で求めます'
      - id: PW-PR-CREATE-65
        pattern: unwanted
        statement: 'もしスタックした base の記録のコミットが head の履歴に無いなら、PR を作らずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-CREATE-64
        pattern: unwanted
        statement: 'もし head の番号の Issue が PR のリポジトリに無いなら、待っている Issue の確認を、何も返さずに飛ばします'
      - id: PW-PR-CREATE-67
        pattern: unwanted
        statement: 'もし古い版の `.pecot-active` が残っているなら、その内容を読まずに、ブランチ名から求めた番号を `Closes` に入れます'
      - id: PW-PR-CREATE-68
        pattern: unwanted
        statement: 'もし `.pecot/state/` の無い clone で紐づいたブランチにいるなら、`file` でも `Closes` にブランチ名の番号を入れます'
      - id: PW-PR-CREATE-69
        pattern: unwanted
        statement: 'もしスタックの記録があり、事前の確認がブランチと remote のずれを見つけたなら、Push Status の直し方を `pr_check` と同じに決めます'
      - id: PW-PR-CREATE-70
        pattern: unwanted
        statement: 'もしスタックした base の記録のコミットが head の履歴に無く、`pr_restack` と同じ判断でスタックし直し済みと決まったなら、記録の書き直しを `detail` で案内します。案内するのは `pr_restack` です。決まらなければ案内しません'
      - id: PW-PR-CREATE-71
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが親ブランチの変更を持つ間、親ブランチを base にします。親ブランチをスタックし直して force-push した後も同じです'
      - id: PW-PR-CREATE-72
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が startable の間、`develop_branch` を base にします'
      - id: PW-PR-CREATE-73
        pattern: unwanted
        statement: 'もし記録が無く、スタック先を求められないなら、投稿では `detail` を `cannot infer the stacked base` で始めて失敗を返し、PR を作りません'
      - id: PW-PR-CREATE-75
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-CREATE-76
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
      - id: PW-PR-CREATE-77
        pattern: event
        statement: '`message` で `repo` を省いて呼ぶと、origin のリポが設定に無くても、設定にあるリポを指す別の remote のリポに PR を作ります'
      - id: PW-PR-CREATE-80
        pattern: event
        statement: '`owner:branch` の head を渡すと、そのブランチが owner の fork を指す remote に push 済みのとき、その head で PR を作ります'
      - id: PW-PR-CREATE-81
        pattern: unwanted
        statement: 'もし `owner:branch` の head のブランチが fork に無いか、fork とずれているなら、remote とブランチ名を示した直し方を `warnings` に入れます。PR を作らずに、`kind` が `preflight-failed` の失敗を返します'
      - id: PW-PR-CREATE-82
        pattern: unwanted
        statement: 'もし設定のホストに、`owner:branch` の owner の fork を指す remote が無いなら、`git remote add` の直し方を `warnings` に入れます。`kind` が `preflight-failed` の失敗を返します'
      - id: PW-PR-CREATE-83
        pattern: unwanted
        statement: 'もし head の owner かブランチ名が空なら、PR を作らずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-CREATE-84
        pattern: event
        statement: '`owner:branch` の head を渡すと、ブランチ名の末尾の番号の `Closes` を本文に足します'
      - id: PW-PR-CREATE-85
        pattern: event
        statement: '`head` で今と別のブランチを指すと、PR を作る前に、そのブランチの push を確かめます'
      - id: PW-PR-CREATE-86
        pattern: event
        statement: 'head の owner に作り先のリポの owner を書くと、作り先のリポを指す remote で push を確かめます'
      - id: PW-PR-CREATE-87
        pattern: unwanted
        statement: 'もしファイルで作るとき末尾の番号の Issue の種別を読めないなら、`Closes` を足さず、番号の空いた `Closes #` の行を消し、`warnings` に入れます'
  PW-PR-MERGE:
    summary: 'PR をマージします。スタックの中の PR は、一番下のものだけをマージします。'
    arguments:
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'GitHub の非同期のマージ API で PR をマージします。スタックの中の PR も、スタックの外の PR も同じです。'
      - 'ドラフトの PR、閉じている PR、マージ済みの PR はマージしません。要求を送らずに、`kind` が `pr-state` の失敗を返します。'
      - '非同期のマージ API が無い GitHub では、スタックの外の PR を、同期のマージ API で squash でマージします。'
      - 'スタックの中の PR は、それより下に開いている PR が無いときだけマージします。あるときは、要求を送らずに `kind` が `pr-state` の失敗を返し、先にマージするいちばん下の開いている PR を `detail` に入れます。'
      - 'スタックの API が無いリポジトリでは、スタックの外の PR として扱います。'
      - '要求には、読んだ head のコミットを添えます。読んだ後に push された PR は、マージしません。'
      - 'base ブランチに merge queue が無いときは、squash でマージします。あるときは、マージの方法を送らず、PR は merge queue に入ります。'
      - '要求が受け付けられた後は、結果を 2 秒おきに読みます。`merged`・`enqueued`・`failed` のどれかになるまで読み、60 秒で終わらなければ失敗を返します。'
      - '同じ PR のマージの要求が既にあるときは、その要求の結果を読み続けます。'
      - '結果を読めないときは、PR の状態から、マージ済みか merge queue の中かを決めます。どちらでもなければ、60 秒が過ぎるまで読み直します。'
      - 'マージの後の片付けはしません。続けて `session_finish` を呼びます。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        pullRequest: 'マージした PR です。`owner/repo/N` の形です。'
        base: 'PR をマージした先の base ブランチです。'
        status: '結果です。`merged`（マージした）か `enqueued`（merge queue に入った）です。'
        stack: 'PR が一番下だったスタックです。`number`（スタックの番号）と `size`（この PR から上の PR の数）を持ちます。スタックの外の PR では入りません。'
    diagnostics: '標準エラーに、結果の行を出します。マージしたときは `merged`、merge queue に入ったときは `added` です。スタックの一番下の PR では、`merged` の行にスタックの番号と PR の数が付きます。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: pr-state
        when: 'PR がドラフトか、閉じているか、マージ済みか、スタックの一番下ではありません。要求は送っていません。'
      - kind: pr-state
        when: 'GitHub がマージを拒みました。または、結果を読めず、PR がマージ済みでも merge queue の中でもありません。'
      - kind: invalid-input
        when: 'PR の参照の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。または、マージが 60 秒で終わりませんでした。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'マージが 60 秒で終わらないときは、要求は GitHub に残っています。PR の状態を確かめてから呼び直します。呼び直すと、残っている要求の結果を読み続けます。'
    effects:
      - target: github
        kind: destructive
        what: 'PR をマージするか、merge queue に入れます。'
      - target: github
        kind: read
        what: 'PR、PR が入っているスタック、スタックでこの PR より下の PR、マージの結果を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: false
    examples:
      - arguments:
          pr_ref: example-org/my-repo/123
        note: 'PR をマージします。'
    default_notes:
      pr_ref: '短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-MERGE-01
        pattern: event
        statement: 'スタックの外の PR を渡すと、読んだ head のコミットと squash でマージを頼み、結果の `status` を `merged` にします'
      - id: PW-PR-MERGE-02
        pattern: event
        statement: 'スタックの一番下の PR を渡すと、スタックの番号と PR の数を結果の `stack` に入れます'
      - id: PW-PR-MERGE-03
        pattern: state
        statement: '親 PR がマージ済みでスタックの並びに残っている間、その子 PR を一番下として扱います'
      - id: PW-PR-MERGE-04
        pattern: state
        statement: 'base ブランチに merge queue がある間、マージの方法を送らず、merge queue に入ると結果の `status` を `enqueued` にします'
      - id: PW-PR-MERGE-05
        pattern: unwanted
        statement: 'もしスタックでこの PR より下に開いている PR があるなら、要求を送らずに、先にマージする PR を `detail` で示して、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-06
        pattern: unwanted
        statement: 'もし PR がドラフトなら、要求を送らずに、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-07
        pattern: unwanted
        statement: 'もし GitHub がマージを拒んだなら、GitHub の文を添えた `detail` を入れて、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-08
        pattern: unwanted
        statement: 'もしマージが 60 秒で終わらないなら、確かめる PR を `detail` で示して、`kind` が `github-api` の失敗を返します'
      - id: PW-PR-MERGE-09
        pattern: event
        statement: '同じ PR のマージの要求が既にあると、その要求の結果を読み続けます'
      - id: PW-PR-MERGE-10
        pattern: event
        statement: '結果を読めなくなると、PR の状態を読み直し、マージ済みなら `merged`、merge queue の中なら `enqueued` を結果の `status` に入れます'
      - id: PW-PR-MERGE-11
        pattern: unwanted
        statement: 'もし結果を読めないまま 60 秒が過ぎ、PR がマージ済みでも merge queue の中でもないなら、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-12
        pattern: state
        statement: 'リポジトリにスタックの API が無い間、スタックの外の PR として扱います'
      - id: PW-PR-MERGE-13
        pattern: unwanted
        statement: 'もし GitHub API がほかのエラーを返したなら、失敗を返します'
      - id: PW-PR-MERGE-15
        pattern: unwanted
        statement: 'もし PR が閉じているかマージ済みなら、要求を送らずに、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-MERGE-16
        pattern: state
        statement: 'GitHub に非同期のマージ API が無い間、スタックの外の PR を、読んだ head のコミットを添えた同期のマージ API で squash でマージします'
      - id: PW-PR-MERGE-17
        pattern: unwanted
        statement: 'もしスタックの中の PR で非同期のマージ API が無いなら、同期のマージ API を呼ばずに失敗を返します'
      - id: PW-PR-MERGE-18
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-MERGE-19
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-PR-RESTACK:
    summary: スタックしたブランチを、base にしたブランチの新しい位置へスタックし直します。
    arguments:
      check: 'スタックし直しが要るかだけを確かめます。'
      continue: '衝突で止まったスタックし直しを、衝突を解いた後に続けます。'
      abort: '衝突で止まったスタックし直しを取りやめ、スタックし直す前の位置に戻します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - '今のブランチを、スタックして着手したときの base の記録を使って、親ブランチの新しい位置へスタックし直します。'
      - '`check` を付けると、スタックし直しが要るかだけを返します。変わるのは、`git fetch` が進める手元の追跡参照だけです。'
      - 'スタックしていないブランチ（開発ブランチからの着手の記録か、記録が無くスタック先も求まらないもの）は、スタックし直しません。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、スタック先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチにスタックしたものとします。変更を持つとは、同じコミットか、そのブランチをスタックし直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`cannot infer the stacked base` の文を `warnings` に入れます。求めた結果は書きません。'
      - 'スタックし直しが要るのは、親ブランチの remote の先頭が記録の位置と違うときと、親 PR がマージ済みのときです。マージ済みなら開発ブランチへスタックし直し、base の記録を開発ブランチからの着手に変えます。'
      - 'ブランチが新しい base の上に載り終えていれば、記録が古くても rebase をしません。載り終えているとは、新しい base がブランチの履歴にあり、記録の位置もブランチの履歴にあるなら、それが新しい base の履歴にもあることです。push と記録の書き直しは、`check` なしの `pr_restack` が行います。remote のブランチが同じ木で新しい base の上にあれば、push せずに remote のブランチに合わせます。'
      - 'rebase の後、remote のブランチにだけあるコミットがあれば止まります。push がそのコミットを消すためです。ブランチはスタックし直す前の位置へ戻します。'
      - '同じ変更かは、スタックし直す前と後のブランチの両方と比べます。GitHub が書き換えたコミットを、別の変更と見ないためです。'
      - '`git rebase --no-update-refs --onto <新しい base> <記録の位置>` を動かします。'
      - '記録の位置がブランチの履歴に無いときは、別の点から rebase を始めます。親ブランチの追跡参照からの fork-point を使い、求まらなければ新しい base との merge-base を使います。親 PR がマージ済みでも同じです。'
      - '結果の木が remote のブランチと同じで、remote のブランチが新しい base の上にあれば、remote のブランチに合わせ、push しません。'
      - 'そうでなければ、fetch した位置を期待の値にした `git push --force-with-lease` で push します。pre-push のフックを含めて、10 分まで待ちます。remote に無いブランチは push しません。'
      - 'スタックし直した後、base の記録の位置を、ブランチと新しい base の merge-base に書き直します。'
      - '開発ブランチへスタックし直した後、ブランチの開いている PR の本文を変えずに保存し直します。GitHub は、スタック PR の `Closes` を Issue とリンクせず、base を付け替えても本文を読み直さないためです。'
      - '保存し直すのは、PR の base がリポの既定のブランチで、本文の `Closes` などの Issue に、まだリンクになっていないものがあるときだけです。GitHub がリンクにするのは、既定のブランチに向いた PR だけです。'
      - '保存し直しの失敗は `warnings` に入れるだけで、成功を返します。base の記録は書き直し済みなので、呼び直しても保存し直しません。`warnings` の文には、GitHub で本文を変えずに保存し直す案内を添えます。'
      - '衝突したら、衝突したファイルを `conflicts` に入れ、rebase を途中のまま残します。途中の記録を書き、`kind` が `git-conflict` の失敗を返します。'
      - '`continue` は、衝突を解いて `git add` した後に続けます。`abort` は、スタックし直す前の位置に戻します。どちらも途中の記録だけを読み、pecot が始めていない rebase は動かしません。'
      - '`check`・`continue`・`abort` は、1 つだけ渡せます。'
      - '書き換えるのは、セッションのディレクトリのブランチだけです。ほかの worktree には触れません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '`check` のときだけ、`up to date: <branch> on <base>` か `needs restack: ...` の 1 行を出します。'
    mcp_output:
      fields:
        branch: 'スタックし直すブランチです。'
        base: 'スタックし直した後の base のブランチです。親 PR がマージ済みなら、開発ブランチです。'
        outcome: '起きたことです。`up-to-date`・`needs-restack`・`restacked`・`synced`・`conflict`・`aborted` のどれかです。`check` を付けたときは、スタックし直すと何が起きるかです。'
        cause: 'スタックし直しが要る理由です。`base-moved` か `base-merged` です。`check` を付けて、スタックし直しが要るときだけ入ります。'
        pullRequest: 'マージ済みの親 PR の番号です。`cause` が `base-merged` のときだけ入ります。'
        pushed: 'ブランチを push したかどうかです。`outcome` が `restacked` のときだけ入ります。'
        conflicts: '衝突したファイルの一覧です。`outcome` が `conflict` のときだけ入ります。'
        relinked: '本文を保存し直した、開いている PR の番号です。開発ブランチへスタックし直すか合わせた後、まだリンクになっていない `Closes` があって保存し直したときだけ入ります。'
    diagnostics: '標準エラーに、結果の行を出します。スタックし直すと `updated: <branch> restacked on <base>` です。remote に合わせると `updated: <branch> synced with <remote>/<branch>` です。変えなければ `unchanged: <branch> is up to date`、取りやめると `unchanged: <branch> restack aborted` です。開発ブランチへスタックし直した後に PR の本文を保存し直すと、`updated: PR #N relinked to its closing Issues` の行を足します。PR の本文を保存し直せないと、`warning: cannot relink PR #N to its closing Issues: <理由>` の行を出します。続けて、手で保存し直す案内の行を出し、終了コードは 0 のままです。スタックし直しの失敗は `error` の行で、続けて直し方の行を出します。記録が無くスタック先を求められないときは、`warning: cannot infer the stacked base: <理由>` の行を出します。'
    environment: []
    exit_status:
      - kind: git-unresolved
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: git-unresolved
        when: '`git fetch` が失敗したか、remote に届きません。スタックし直す先のブランチが手元の追跡参照に無いときも含みます。remote のブランチにだけあるコミットがあるときと、push が拒まれたか、時間切れのときも同じです。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        when: '`develop_branch` が未設定です。'
      - kind: content-invalid
        when: 'スタックした base の記録か、途中の記録の形が誤っています。'
      - kind: pr-state
        when: '親ブランチが remote から消えていて、その PR がマージされていません。'
      - kind: github-api
        when: '親 PR を GitHub から読めません。'
      - kind: github-auth
        when: 'GitHub の認証に失敗しました。'
      - kind: github-not-found
        when: 'リポジトリが GitHub にありません。'
      - kind: github-rate-limit
        when: 'GitHub の rate limit に当たりました。'
      - kind: preflight-failed
        when: '未コミットの変更があります。`check`・`continue`・`abort` では確かめません。'
      - kind: git-conflict
        when: 'スタックし直しが衝突しました。`continue` の後に、また衝突したときも含みます。'
      - kind: invalid-input
        when: '`check`・`continue`・`abort` を 2 つ以上渡したか、途中のスタックし直しが無いのに `continue`・`abort` を渡しました。pecot の記録が無い rebase の途中のときと、ほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '衝突で止まったときは、rebase は途中のまま残り、base の記録は変わりません。push が拒否・時間切れ・取り消しで止まったときは、手元のブランチはスタックし直した後のままで、base の記録は変わりません。拒まれたか取り消されたときは、同じ引数で呼び直せば続きます。時間切れのときは、手で push してから呼び直すと、remote に合わせて続きます。remote のブランチにだけあるコミットで止まったときは、ブランチをスタックし直す前の位置へ戻します。'
    effects:
      - target: git
        kind: destructive
        what: '`git fetch` で追跡参照を進め、今のブランチを rebase で書き換え、`--force-with-lease` で remote のブランチを置き換えます。remote に合わせるときは、今のブランチを remote のブランチの位置に動かします。'
      - target: github
        kind: read
        what: '親ブランチを head に持つ PR を読みます。'
      - target: github
        kind: destructive
        what: '開発ブランチへスタックし直した後、既定のブランチに向いたブランチの開いている PR を読み、本文を変えずに保存し直します。'
      - target: file
        kind: destructive
        what: '`.pecot/state/.pecot-base` を書き直します。衝突で止まる間は `.pecot/state/.pecot-restack` を置き、終わるか取りやめると消します。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'スタックして着手した作業ディレクトリで呼びます（`session_start` が base の記録を書きます）。'
    idempotent: true
    examples:
      - arguments:
          check: true
        note: '今のブランチにスタックし直しが要るかを確かめます。'
      - arguments: {}
        note: '今のブランチをスタックし直して push します。'
      - arguments:
          continue: true
        note: '衝突を解いて `git add` した後に、続けます。'
      - arguments:
          abort: true
        note: 'スタックし直す前の位置に戻します。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-RESTACK-01
        pattern: event
        statement: '`check` を付けて、親ブランチが動いていないときに呼ぶと、結果の `outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-02
        pattern: event
        statement: '`check` を付けて、親ブランチの remote の先頭が記録と違うときに呼ぶと、`outcome` を `needs-restack`、`cause` を `base-moved` にします'
      - id: PW-PR-RESTACK-03
        pattern: event
        statement: '`check` を付けて、親 PR がマージ済みのときに呼ぶと、`outcome` を `needs-restack`、`cause` を `base-merged` にします。`pullRequest` には PR の番号を入れます'
      - id: PW-PR-RESTACK-04
        pattern: event
        statement: 'スタックし直しが要るときに呼ぶと、新しい base へスタックし直して `git push --force-with-lease` で push し、`outcome` を `restacked` にします'
      - id: PW-PR-RESTACK-05
        pattern: event
        statement: 'スタックし直した結果の木が remote のブランチと同じで、remote のブランチが新しい base に載っている状態で呼ぶと、push せずに remote のブランチへ合わせます。`outcome` は `synced` です'
      - id: PW-PR-RESTACK-06
        pattern: event
        statement: '親ブランチが動いていないときに呼ぶと、何も変えずに `outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-07
        pattern: unwanted
        statement: 'もしスタックし直しが衝突したなら、衝突したファイルを `conflicts` に、`continue`・`abort` の案内を `detail` に入れます。途中の記録を書いて、`kind` が `git-conflict` の失敗を返します'
      - id: PW-PR-RESTACK-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、スタックし直さずに、`kind` が `preflight-failed` の失敗を返します。`check` では確かめません'
      - id: PW-PR-RESTACK-09
        pattern: unwanted
        statement: 'もし親ブランチが remote から消えていて、その PR がマージされていないなら、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-RESTACK-10
        pattern: state
        statement: 'スタックしていないブランチの間、スタックし直しをしません。開発ブランチからの着手の記録があれば、fetch もしません。`check` の有無によらず、`outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-11
        pattern: state
        statement: 'remote に今のブランチが無い間、スタックし直すだけで push せず、`pushed` を `false` にします'
      - id: PW-PR-RESTACK-12
        pattern: event
        statement: '`abort` を付けて呼ぶと、スタックし直す前の位置に戻し、途中の記録を消して、`outcome` を `aborted` にします'
      - id: PW-PR-RESTACK-13
        pattern: event
        statement: '`continue` を付けて呼ぶと、rebase を続け、終われば push と記録の書き直しまで進みます。衝突が残っていれば、もう一度 `kind` が `git-conflict` の失敗を返します。利用者が rebase を終えていれば、残りの手順だけを進めます'
      - id: PW-PR-RESTACK-14
        pattern: unwanted
        statement: 'もし途中の記録が無いのに `continue` か `abort` を付けたなら、途中の rebase を動かさずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-15
        pattern: unwanted
        statement: 'もし `check`・`continue`・`abort` を 2 つ以上付けたなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-16
        pattern: unwanted
        statement: 'もし remote のブランチにだけあるコミットがあるなら、ブランチをスタックし直す前の位置へ戻し、push をせずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-17
        pattern: unwanted
        statement: 'もし push が拒まれたなら、base の記録を書き直さずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-18
        pattern: unwanted
        statement: 'もし `git fetch` が失敗したなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-19
        pattern: event
        statement: 'スタックし直しか、remote への合わせが済むと、base の記録を新しい base のブランチと位置に書き直します。開発ブランチへスタックし直したときは、スタック先の Issue を記録から外します'
      - id: PW-PR-RESTACK-20
        pattern: unwanted
        statement: 'もしスタックした base の記録の形が誤っているなら、`kind` が `content-invalid` の失敗を返します'
      - id: PW-PR-RESTACK-21
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-PR-RESTACK-23
        pattern: state
        statement: '新しい base の上に載り終えていて記録だけが古い間、rebase をせずに push と記録の書き直しを行い、`outcome` を `restacked` にします。remote のブランチが同じ木で新しい base の上にあれば、push せずに合わせ、`outcome` を `synced` にします'
      - id: PW-PR-RESTACK-24
        pattern: state
        statement: 'ブランチが新しい base の上に載り終えている間、`check` は `outcome` を `up-to-date` にし、base の記録を書き換えません'
      - id: PW-PR-RESTACK-25
        pattern: event
        statement: '記録の位置が履歴に無いブランチをスタックし直すと、親ブランチからの fork-point を起点とします。求まらなければ、新しい base との merge-base です。古い親ブランチと base のコミットは当て直しません'
      - id: PW-PR-RESTACK-26
        pattern: unwanted
        statement: 'もし新しい base を merge で取り込んだか、親ブランチが記録より古い位置へ戻されたなら、スタックし直し済みと見ずに、スタックし直しが要ると判断します'
      - id: PW-PR-RESTACK-27
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが親ブランチの変更を持つ間、親ブランチにスタックしたものとしてスタックし直しの要否を決めます。スタックし直した後に、base の記録を書きます'
      - id: PW-PR-RESTACK-28
        pattern: event
        statement: 'スタック先を求めて始めたスタックし直しが衝突で止まると、スタックし直す前の記録の位置を途中の記録に書き、`continue` はそれを使います'
      - id: PW-PR-RESTACK-29
        pattern: unwanted
        statement: 'もし記録が無く、スタック先を求められないなら、`cannot infer the stacked base` の文を `warnings` に入れ、スタックしていないものとして扱います'
      - id: PW-PR-RESTACK-30
        pattern: event
        statement: '記録の無い作業ディレクトリで呼ぶと、スタック先を求める前に remote を fetch し、手元に無い親ブランチも追跡参照で見ます'
      - id: PW-PR-RESTACK-31
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-RESTACK-32
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
      - id: PW-PR-RESTACK-33
        pattern: unwanted
        statement: 'もし push が 10 分で終わらないなら、git を止めます。時間切れの旨と、手で push してから `pr_restack` を呼ぶ案内を `detail` に入れます。base の記録は書き直さず、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-34
        pattern: event
        statement: '開発ブランチへスタックし直すか合わせると、開いている PR の base が既定のブランチで、リンクになっていない `Closes` があれば、本文を変えずに保存し直します。その PR の番号を `relinked` に入れます'
      - id: PW-PR-RESTACK-35
        pattern: unwanted
        statement: 'もし PR の本文の保存し直しに失敗したなら、手で保存し直す案内を添えて `warnings` に入れ、成功を返します'
  PW-PR-SHOW:
    summary: PR の詳細を、必要な項目だけ GraphQL で取得して出します。
    arguments:
      json: 'JSON で出力するかどうかです。結果の項目は、この値によらず同じです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      reviews: 'レビューの詳細（本文と行のコメント）を含めるかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - 'GraphQL のクエリ 1 回で、PR を 1 件取得します。'
      - '題・状態・ドラフトの印・マージの可否・コメントの数・head と base のブランチを返します。closing issues・参照している Issue・レビューの状態・本文も返します。'
      - '`reviews` を付けると、レビューの本文と行のコメントを足します。'
      - '`json` を付けても、結果の項目は変わりません。`reviews` も付けると、レビューと行のコメントが入ります。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '`## PR #<N> <title>` の見出しで始まる Markdown です。`reviews` を付けると、レビューか行のコメントがあるときに、`## Reviews` の節と `## Line Comments` の節が続きます。`json` を付けると、JSON のオブジェクトです。'
    mcp_output:
      fields:
        number: 'PR の番号です。キーは snake_case です。'
        state: 'PR の状態です。`OPEN`・`CLOSED`・`MERGED` のどれかです。'
        title: 'PR のタイトルです。'
        body: 'PR の本文です。'
        head_ref: 'head ブランチです。'
        base_ref: 'base ブランチです。'
        is_draft: 'PR が draft かどうかです。'
        mergeable: 'マージできるかどうかです。`MERGEABLE`・`CONFLICTING`・`UNKNOWN` のどれかです。'
        comments: 'コメントの数です。'
        closing_issues: 'PR が閉じる Issue の配列です。要素は `number` と `title` を持ちます。'
        referenced_issues: '本文の Refs が指す Issue のうち、`closing_issues` に無いものの配列です。要素は `number` と `title` を持ち、`title` はいつも空です。'
        reviews: 'レビューの配列です。要素は `state` と `author` を持ちます。`author` は、削除されたユーザーなら `null` です。`body` と `submitted_at` は、`reviews` を付けたときだけ入ります。'
        review_threads: '行コメントのスレッドの配列です。`reviews` を付けたときだけ入ります。要素は `is_resolved`・`path`・`line`・`comments` を持ちます。`comments` の要素は `author`・`body`・`created_at`・`url` を持ちます。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        when: 'PR の参照の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue を読みます。`reviews` のときは、レビューと行のコメントも読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          pr_ref: example-org/my-repo/123
        note: 'PR の詳細を返します。'
      - arguments:
          pr_ref: example-org/my-repo/123
          reviews: true
        note: 'PR の詳細を、レビューと行のコメントも付けて返します。'
    default_notes:
      pr_ref: '短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-SHOW-01
        pattern: event
        statement: 'PR の参照を渡すと、番号・題・状態・ブランチ・本文を結果に入れます'
      - id: PW-PR-SHOW-02
        pattern: event
        statement: '関連 Issue がある PR を読むと、`closing_issues` と `referenced_issues` に入れます'
      - id: PW-PR-SHOW-03
        pattern: event
