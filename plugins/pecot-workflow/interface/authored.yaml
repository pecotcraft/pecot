        deleted: 'リモートブランチを削除したかどうかです。`dry_run` のときは、いつも `false` です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も削除していません。'
    diagnostics: '標準エラーに、削除したブランチごとの結果の行（`deleted`）を出します。`--dry-run` のときは、予定の行（`dry-run`）を出します。ブランチが保護されているときは、保護するブランチを並べた `error` の行を出します。ほかの失敗でも `error` の行を出します。'
    environment: []
    exit_status:
