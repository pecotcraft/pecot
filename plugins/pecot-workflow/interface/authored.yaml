  PW-WORKTREE-LINK:
    summary: 既にある worktree に、シンボリックリンクを張るか張り直します。
    arguments:
      all: 'すべてのサブの worktree を対象にするかどうかです。'
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      force: '実体のファイルとディレクトリを、尋ねずに上書きするかどうかです。'
    constraints: []
    details:
      - '`worktree-config.json` のリンクを、`directory` の worktree に張ります。`all` を付けると、すべてのサブの worktree に張ります。既にあるリンクは置き換えます。'
      - 'リンクは、リポジトリのメインの worktree から読みます。'
      - '設定ファイルが無いときは、`worktree_init` で作ります。'
      - '`all` が無いときの対象は、`directory` を含む worktree のルートです。そのため、`directory` はサブディレクトリでも構いません。そのルートがメインの worktree のときは、失敗を返します。'
      - '`all` を付けてサブの worktree が無いときは、`links` を空の配列にして成功を返します。'
      - 'リンク先が無いリンクは飛ばします。'
      - 'git が追跡しているパスと、作れないリンクはエラーです。`links` の `change` を `error` にして `warnings` に入れ、成功を返します。'
      - 'リンクのパスにある実体のファイルかディレクトリは、上書きの確認に答えた後にだけ置き換えます。MCP のツールには確認に答える手段が無いので、`kind` が `aborted` の失敗を返します。`force` を付けると、尋ねずに置き換えます。'
      - '`all` を付けて `force` が無いときは、実体のファイルを尋ねずに飛ばします。'
      - 'リンクのパスが `.pecot/` で始まるときは、リンクを張る前にプラグインのスクリプトを動かし、worktree に `.pecot/.gitignore` を書きます。'
      - 'devcontainer が要ります。'
      - 'remote の URL から `owner/repo` を読めないときは、引数 `repo` と比べません。`repo` があれば、`warnings` に入れて `repo` を使い、無ければ失敗を返します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        links: '各対象 worktree にある、設定の link ごとの結果の配列です。サブ worktree が無ければ空です。要素は `path`（symlink の絶対パス）・`destination`（向き先の絶対パス）・`change` を持ちます。`change` は `create`（新しい symlink）・`update`（既存を置き換えた）・`skip`（そのまま）・`error`（作れなかった）のどれかです。`reason` は、`skip` と `error` のときだけ入ります。'
    diagnostics: '標準エラーに、worktree ごとに作ったシンボリックリンクの `count` の行と、飛ばしたリンクごとの `skipped` の行を出します。`all` で worktree が複数あるときは、合計の `count` の行を出します。作れなかったリンクごとに、`warning` の行を出します。失敗したときは、`error` の行を出します。devcontainer の外のときと、設定ファイルの内容が不正なときも含みます。remote の URL から `owner/repo` を読めず `repo` があるときは、`warning: using repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `repo` の案内の行を続けます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - kind: repo-mismatch
        when: '引数 `repo` が今の git remote と違います。'
      - kind: git-unresolved
        when: 'git のリポジトリの外で `repo` を省きました。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: not-initialized
        when: '設定ファイルがありません。'
      - kind: config-invalid
        when: '設定ファイルの内容が不正です。'
      - kind: invalid-input
        when: '`all` なしで、`directory` がメインの worktree です。'
      - kind: aborted
        when: '上書きの確認を中断しました。MCP のツールでは、`force` なしで確認が要るときです。'
      - kind: other
        when: 'メインの worktree かプロジェクトのルートが見つかりません。devcontainer の外で動かしたときと、worktree の一覧を読めないときも含みます。'
      - kind: invalid-input
