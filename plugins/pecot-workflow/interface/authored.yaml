        statement: '`--comment` を付けて打つと、reopen の後に理由をコメントに投稿します'
      - id: PW-ISSUE-REOPEN-06
        pattern: event
        statement: '`--comment` を付けて 2 回打つと、そのたびにコメントを投稿します'
      - id: PW-ISSUE-REOPEN-07
        pattern: event
        statement: 'status を設定すると、`set` の行を標準エラーに出します'
      - id: PW-ISSUE-REOPEN-08
        pattern: event
        statement: 'Issue を reopen すると、`reopened` の行を標準エラーに出します'
      - id: PW-ISSUE-REOPEN-09
        pattern: event
        statement: 'コメントを投稿すると、`created` の行を標準エラーに出します'
      - id: PW-ISSUE-REOPEN-10
        pattern: unwanted
        statement: 'もし Issue がボードに無いなら、`warning` の行を標準エラーに出します'
      - id: PW-ISSUE-REOPEN-11
        pattern: unwanted
        statement: 'もし Issue がボードに無いなら、status を変えずに reopen だけを行います'
      - id: PW-ISSUE-REOPEN-12
        pattern: unwanted
        statement: 'もし status がプロジェクトに設定されていないなら、`warning` の行を標準エラーに出します'
      - id: PW-ISSUE-REOPEN-13
        pattern: unwanted
        statement: 'もし 2 回目の reopen の後も Issue が open でないなら、終了コード 1 で終わります'
      - id: PW-ISSUE-REOPEN-14
        pattern: unwanted
        statement: 'もしコメントの投稿に失敗したなら、終了コード 1 で終わります'
      - id: PW-ISSUE-REOPEN-15
        pattern: unwanted
        statement: 'もし `--status` が有効な値でないなら、終了コード 1 で終わります'
      - id: PW-ISSUE-REOPEN-16
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-REOPEN-17
        pattern: unwanted
        statement: 'もしリポジトリがプロジェクトに無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-REOPEN-18
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-ISSUE-REOPEN-19
        pattern: unwanted
        statement: 'もし Issue の参照の形が誤っているなら、終了コード 2 で終わります'
      - id: PW-ISSUE-REOPEN-20
        pattern: unwanted
        statement: 'もし status が `blocked` でボードが Blocked を定義していないなら、`project init` で足し方を案内する `hint` の行を標準エラーに出します'
  PW-ISSUE-UNBLOCK:
    help:
      details:
        - Removes a blocked-by (prerequisite) from an Issue.
        - issue_ref is the waiting Issue and --by is the prerequisite to remove. --by may be in another repository.
        - The command reads the blocked-by of the waiting Issue first. A prerequisite that is not there is not removed, and a stale line in the Waits for merge section is left as it is; pecot issue read warns about the difference.
        - When the section has a line for the prerequisite, the line is removed. A section that becomes empty is removed with its heading.
        - When the section cannot be read, only the blocked-by is removed and a warning says that the section was not changed, because removing is what the user wants.
        - After the writes, the readiness of the waiting Issue is read again, confirmed and used to move the column and the Status label in the same way as pecot issue block.
        - The Status label Needs Attention is set back to Todo only when a prerequisite is left or the removed prerequisite was closed. The label that a person put on for another reason is not removed by removing the last open prerequisite.
        - An Issue that has a branch or a PR is not moved.
        - With --dry-run, writes a dry-run line instead of the result lines. The reads and the checks are still made, and nothing is written.
        - Needs a GitHub Enterprise Server of version 3.19 or later, which has issue dependencies.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot issue unblock example-org/my-repo/12 --by example-org/my-repo/11
          note: Remove the wait of Issue 12 for Issue 11.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'Issue から blocked-by（前提）を外します。'
    arguments:
      by: '外す前提の Issue です。`owner/repo/N` の形で渡します。別のリポジトリの Issue も指せます。'
      dry_run: '何も書き込まずに、書く予定だけを出すかどうかです。'
      issue_ref: '待つ側の Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    constraints: []
    details:
      - 'Issue から blocked-by（前提）を外します。'
      - '`issue_ref` は待つ側の Issue で、`--by` は外す前提です。`--by` は別のリポジトリの Issue でもかまいません。'
      - 'まず、待つ側の Issue の blocked-by を読みます。付いていない前提は外しません。`Waits for merge` の節に残った古い行も、そのままにします。食い違いは `pecot issue read` が `warning` で知らせます。'
      - '節に前提の行があるときは、その行を外します。節が空になったときは、見出しごと消します。'
      - '節を読めないときは、blocked-by だけを外し、節を直していない旨を `warning` で知らせます。外すことが利用者の求めることだからです。'
      - '書き込みの後で、待つ側の Issue の判定を読み直して確かめ、`pecot issue block` と同じやり方で、列と Status の札を動かします。'
      - 'Status の札の `Needs Attention` を `Todo` に戻すのは、前提が残っているときか、外した前提が閉じていたときだけです。人がほかの理由で付けた札は、開いた最後の前提を外しても外しません。'
      - 'ブランチか PR のある Issue は動かしません。'
      - '`--dry-run` を付けると、結果の行の代わりに `dry-run` の行を出します。読み取りと確認は行い、何も書き込みません。'
      - 'Issue の依存関係を持つ GitHub Enterprise Server の 3.19 以上が要ります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、結果の行を出します。blocked-by には `removed` か `unchanged` を出し、列か札を変えたときは続けて `moved` と `set` を出します。`warning` の行は、次のときに出します。`Waits for merge` の節を読めないとき。判定を出せないか、確かめられないとき。ボードに Todo の選択肢が無いとき。ボードに書けなかったとき。Todo が無いときは、`pecot project init` の実行を案内する `hint` の行が続きます。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: 'blocked-by を外しました。または、もともと付いていませんでした。節かボードに関する `warning` が出ても、終了コードは 0 です。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。待つ側の Issue のリポジトリがプロジェクトにありません。blocked-by を全部は読めませんでした。GitHub Enterprise Server が Issue の依存関係に対応していません。GitHub API がエラーを返しました。'
      - code: 2
        when: 'Issue の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
    on_error: '前提を外した後で本文の書き込みに失敗したときは、blocked-by は外れたままで、終了コード 1 で終わります。ボードに書けないときは、blocked-by と本文は残り、`warning` を出すだけです。'
    effects:
      - target: github
        kind: write
        what: 'blocked-by を外し、待つ側の Issue の本文を書き換え、そのボードの項目の列と Status の札を設定します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、待つ側の Issue の blocked-by と本文、読み直した判定、ボードの項目を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: "pecot issue unblock example-org/my-repo/12 --by example-org/my-repo/11"
        note: 'Issue 12 が Issue 11 を待つのをやめます。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-UNBLOCK-01
        pattern: event
        statement: 'Issue の参照と `--by` を渡すと、blocked-by から前提を外して `removed` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-02
        pattern: event
        statement: '付いていない前提を打つと、何も書き込まずに `unchanged` の行を標準エラーに出し、節に残った古い行も書き換えません'
      - id: PW-ISSUE-UNBLOCK-03
        pattern: event
        statement: '節に前提の行があるものを外すと、その行を節から消し、節が空になれば節ごと消します'
      - id: PW-ISSUE-UNBLOCK-04
        pattern: event
        statement: '前提を外した後に判定が変わると、待つ側の Issue の列を動かして `moved` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-05
        pattern: event
        statement: '札が `Needs Attention` で、残りの前提がある、または外した前提が閉じていると、札を `Todo` にして `set` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-06
        pattern: unwanted
        statement: 'もし外したのが開いた最後の前提なら、札が `Needs Attention` でも `Todo` に戻しません'
      - id: PW-ISSUE-UNBLOCK-07
        pattern: unwanted
        statement: 'もし待つ側の Issue に着手の跡があるなら、前提は外して列と札を動かしません'
      - id: PW-ISSUE-UNBLOCK-08
        pattern: event
        statement: '`--dry-run` を付けて打つと、書き込みを送らずに `dry-run` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-09
        pattern: unwanted
        statement: 'もし本文の `Waits for merge` の節が読めないなら、前提だけを外し、節を直していない旨を `warning` の行で標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-10
        pattern: unwanted
        statement: 'もし読み直した前提が書いた内容と 2 回続けて合わないなら、列と札を動かさずに `warning` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-11
        pattern: unwanted
        statement: 'もし動かす先の値がボードに無いなら、`warning` の行と、`project init` で足し方を案内する `hint` の行を標準エラーに出します'
      - id: PW-ISSUE-UNBLOCK-12
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-13
        pattern: unwanted
        statement: 'もし Issue の参照の形が誤っているなら、終了コード 2 で終わります'
      - id: PW-ISSUE-UNBLOCK-14
        pattern: unwanted
        statement: 'もしリポジトリがプロジェクトに無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-15
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-16
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、または本文の書き込みに失敗したなら、終了コード 1 で終わります'
      - id: PW-ISSUE-UNBLOCK-17
        pattern: event
        statement: '`--by` でプロジェクトの外のリポジトリの Issue を指すと、プロジェクトに入っているかは待つ側のリポジトリだけ確かめ、前提を外します'
  PW-PR-CLEANUP:
    help:
      details:
        - "Cleans up after a merged PR: closes the related Issues, optionally deletes the remote branches and returns the local checkout to the development branch."
        - The related Issues are the closing issues of the PR, the Issues named after Closes, Fixes or Resolves in its body, and the Issue whose number ends the head branch name.
        - Does not close an Epic or an Issue that has sub-issues, and writes a skipped line for it.
        - With --delete-branch, deletes the remote head branch and then wip/<head>.
        - A wip/<head> that does not exist is skipped without a message.
        - A wip/<head> that exists but cannot be deleted gives a warning, and the command still finishes with exit status 0.
        - Switches the local checkout to the wtN that pecot worktree add recorded inside a worktree (or, without a record, the name of the parent directory of the worktree when it is wtN or base), or to develop_branch otherwise, pulls it from the origin remote, or from the first remote when there is no origin, and deletes the local head branch with git branch -D.
        - Skips the local cleanup when the repository of the current directory differs from the one of the PR.
        - After the local cleanup, removes the flags .pecot-active, .pecot-base, .pecot-session-title, .pecot-quick-mode and .wip-branch-linked and the flag merge-slash-pending under .pecot/state/.
        - With --skip-local-cleanup, does not clean up locally and leaves those flags in place.
        - "With --dry-run, writes dry-run: would lines instead of the result lines and changes nothing."
        - "A second run leaves the same state as the first but writes different lines: the remote branch is reported as unchanged and git branch -D on the local branch gives a warning."
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot pr cleanup example-org/my-repo/123 --delete-branch
          note: Clean up after a merged PR and delete its remote branch.
        - run: pecot pr cleanup example-org/my-repo/123 --dry-run
          note: Show what would be done without changing anything.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: マージ済みの PR の後片付けをします。関連する Issue を閉じ、ブランチを削除し、ローカルを片付けます。
    arguments:
      delete_branch: 'ブランチを削除するかどうかです。'
      dry_run: '実際には片付けず、予定だけを出すかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      skip_local_cleanup: 'ローカルのブランチの切り替えと削除を飛ばすかどうかです。'
    constraints: []
    details:
      - 'マージ済みの PR の後片付けをします。関連する Issue を閉じ、ローカルのチェックアウトを開発ブランチに戻します。オプションを付けると、リモートブランチも削除します。'
      - '関連する Issue は、次の 3 つです。PR の closing issues。本文の Closes・Fixes・Resolves の後に書いた Issue。head ブランチ名の末尾の番号の Issue。'
      - 'Epic と、sub-issue を持つ Issue は閉じず、`skipped` の行を書きます。'
      - '`--delete-branch` を付けると、リモートの head ブランチを削除し、続けて `wip/<head>` を削除します。'
      - '`wip/<head>` が無いときは、何も出さずに飛ばします。'
      - '`wip/<head>` があるのに削除できないときは、`warning` を出し、終了コード 0 で終わります。'
      - 'ローカルのチェックアウトを切り替える先は、worktree の中では、`pecot worktree add` が記録した `wtN` です。記録が無ければ、worktree の親ディレクトリの名前が `wtN` か `base` のときに、その名前を使います。worktree の外では、`develop_branch` です。切り替えた後、remote の `origin` から pull します。`origin` が無ければ、最初の remote を使います。その後、ローカルの head ブランチを `git branch -D` で削除します。'
      - '今のディレクトリのリポジトリが PR のリポジトリと違うときは、ローカルの片付けを飛ばします。'
      - 'ローカルの片付けの後、`.pecot/state/` の下のフラグを消します。消すのは、`.pecot-active`・`.pecot-base`・`.pecot-session-title`・`.pecot-quick-mode`・`.wip-branch-linked` です。フラグ `merge-slash-pending` も消します。'
      - '`--skip-local-cleanup` を付けると、ローカルを片付けず、これらのフラグも残します。'
      - '`--dry-run` を付けると、結果の行の代わりに `dry-run: would` の行を書き、何も変えません。'
      - '2 回目の実行の後の状態は 1 回目と同じですが、書く行は違います。リモートブランチは `unchanged` として知らせ、ローカルのブランチへの `git branch -D` は `warning` になります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    diagnostics: '標準エラーに、閉じる Issue の `count` の行を出し、続けて手順ごとに結果の行を 1 つ出します。結果の行は、`closed`・`skipped`・`unchanged`・`deleted`・`set`・`updated` です。`--dry-run` のときは、結果の行の代わりに `dry-run: would` の行を出します。失敗した手順には、`warning` の行を出します。`wip/<head>` があるのに削除できないときも含みます。ローカルの片付けを飛ばしたときも、`warning` の行を出します。'
    environment: []
    exit_status:
      - code: 0
        when: '後片付けが終わりました。`warning` を出して失敗した手順があっても 0 です。'
      - code: 1
        when: '次のどれかです。アクティブなプロジェクトがありません。PR を取得できないか、PR がありません。PR がマージされていません。'
      - code: 2
        when: 'PR の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
    on_error: 'マージされていない PR はそのまま残し、何も変えません。Issue を閉じられなかったときは `warning` として扱い、ほかの Issue と後の手順を続けます。巻き戻しはしません。リモートの head ブランチの削除に失敗したときは、`wip/<head>` の削除を飛ばします。`wip/<head>` があるのに削除できないときは、`warning` を書いて後の手順を続けます。checkout に失敗したときは、pull とブランチの削除を飛ばし、フラグは消します。'
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue それぞれの種類を読みます。'
      - target: github
        kind: write
        what: '関連する Issue を閉じます。'
      - target: github
        kind: destructive
        what: 'リモートの head ブランチと `wip/<head>` を削除します。'
      - target: git
        kind: destructive
        what: '開発ブランチか、記録した `wtN`（記録が無ければ親ディレクトリの名前）のブランチを checkout して pull します。ローカルの head ブランチを `git branch -D` で削除します。'
      - target: file
        kind: write
        what: '`.pecot/state/` の下のフラグを消します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
      - 'PR は、マージ済みでなければなりません。'
    idempotent: true
    examples:
      - run: pecot pr cleanup example-org/my-repo/123 --delete-branch
        note: 'マージ済みの PR の後片付けをし、リモートブランチも削除します。'
      - run: pecot pr cleanup example-org/my-repo/123 --dry-run
        note: '何も変えずに、行う予定を出します。'
    default_notes:
      pr_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-PR-CLEANUP-01
        pattern: event
        statement: 'マージ済みの PR の参照を渡すと、closing issues・本文の Closes / Fixes / Resolves・head ブランチ名の末尾の番号の Issue を close します'
      - id: PW-PR-CLEANUP-02
        pattern: event
        statement: 'Epic か sub-issue を持つ Issue があると、その Issue を close しません'
      - id: PW-PR-CLEANUP-03
