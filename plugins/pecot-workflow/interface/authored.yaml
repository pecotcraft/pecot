    on_error: 'プロジェクトを作った後の手順で失敗すると、プロジェクトと、そこまでに作ったフィールドは GitHub に残ります。設定ファイルの生成に失敗すると、プロジェクトと 3 つのフィールドは残り、設定ファイルは書きません。'
    effects:
