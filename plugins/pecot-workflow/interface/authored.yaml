  PW-BRANCH-DELETE:
    help:
      details:
        - Deletes a remote branch through the GitHub REST API, for use where a hook blocks git push and the gh CLI.
        - The repository to delete from is the repo argument (owner/repo).
        - The global pecot --repo is not used. The command only needs the working directory to be inside a git repository with a remote.
        - The default branch of the repository and the develop_branch and release_branch in the config file are protected and are never deleted.
        - --dry-run reads the default branch and checks the protected branches, then writes the plan line for the branch and deletes nothing.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot branch delete example-org/my-repo feat/my-change/123
          note: Delete the remote branch.
        - run: pecot branch delete example-org/my-repo feat/my-change/123 --dry-run
          note: Show the plan without deleting.
      default_notes:
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: リモートブランチを削除します。保護するブランチは削除しません。
