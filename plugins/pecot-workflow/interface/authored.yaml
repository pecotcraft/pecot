  PW-ISSUE-UNBLOCK:
    help:
      details:
        - Removes a blocked-by (prerequisite) from an Issue.
        - issue_ref is the waiting Issue and --by is the prerequisite to remove. --by may be in another repository.
        - The command reads the blocked-by of the waiting Issue first. A prerequisite that is not there is not removed, and a stale line in the Waits for merge section is left as it is; pecot issue show warns about the difference.
        - When the section has a line for the prerequisite, the line is removed. A section that becomes empty is removed with its heading.
        - When the section cannot be read, only the blocked-by is removed and a warning says that the section was not changed, because removing is what the user wants.
        - After the writes, the readiness of the waiting Issue is read again, confirmed and used to move the column and the Status label in the same way as pecot issue block.
        - The Status label Needs Attention is set back to Todo only when a prerequisite is left or the removed prerequisite was closed. The label that a person put on for another reason is not removed by removing the last open prerequisite.
        - An Issue that has a branch or a PR is not moved.
        - With --dry-run, writes a dry-run line instead of the result lines. The reads and the checks are still made, and nothing is written.
        - Needs a GitHub Enterprise Server of version 3.19 or later, which has issue dependencies.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
        - --project names the project config to use. Without it, the config that includes the repository of the Issue is used; when several do, the active one among them.
      examples:
        - run: pecot issue unblock example-org/my-repo/12 --by example-org/my-repo/11
          note: Remove the wait of Issue 12 for Issue 11.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'Issue から blocked-by（前提）を外します。'
    arguments:
      by: '外す前提の Issue です。`owner/repo/N` の形で渡します。別のリポジトリの Issue も指せます。'
      dry_run: '何も書き込まずに、書く予定だけを返すかどうかです。'
      issue_ref: '待つ側の Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
    constraints: []
    details:
      - 'Issue から blocked-by（前提）を外します。'
      - '`issue_ref` は待つ側の Issue で、`by` は外す前提です。`by` は別のリポジトリの Issue でもかまいません。'
      - 'まず、待つ側の Issue の blocked-by を読みます。付いていない前提は外しません。`Waits for merge` の節に残った古い行も、そのままにします。食い違いは `issue_show` が `warnings` で知らせます。前提が付いていなければ、何も書かずに成功を返します。'
      - '節に前提の行があるときは、その行を外します。節が空になったときは、見出しごと消します。'
      - '節を読めないときは、blocked-by だけを外し、節を直していない旨を `warnings` で知らせます。外すことが利用者の求めることだからです。'
      - '書き込みの後で、待つ側の Issue の判定を読み直して確かめ、`issue_block` と同じやり方で、列と Status の札を動かします。'
      - 'Status の札の `Needs Attention` を `Todo` に戻すのは、前提が残っているときか、外した前提が閉じていたときだけです。人がほかの理由で付けた札は、開いた最後の前提を外しても外しません。'
      - 'ブランチか PR のある Issue は動かしません。'
      - '`dry_run` を付けると、読み取りと確認は行い、何も書き込みません。結果の `dryRun` を `true` にします。'
      - 'Issue の依存関係を持つ GitHub Enterprise Server の 3.19 以上が要ります。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、Issue のリポジトリを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        issue: '待たせていた側の Issue です。`owner/repo/N` の形です。'
        by: '前提の Issue です。`owner/repo/N` の形です。'
        change: 'blocked-by がどうなったかです。`removed`（外した）か `unchanged`（もともと blocked-by ではなかった）です。'
        moves: '待つ側の Issue の列か Status を書いたときに、その 1 件を入れる配列です。要素は `board_sync` の `moves` と同じです。書かなかったときは空です。判定を確かめられなかったときと、ボードに書けなかったときも空で、理由は `warnings` に入ります。`dry_run` のときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、結果の行を出します。blocked-by には `removed` か `unchanged` を出し、列か札を変えたときは続けて `moved` と `set` を出します。`warning` の行は、次のときに出します。`Waits for merge` の節を読めないとき。判定を出せないか、確かめられないとき。ボードに Todo の選択肢が無いとき。ボードに書けなかったとき。Todo が無いときは、`pecot project init` の実行を案内する `hint` の行が続きます。失敗ごとに `error` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: repo-not-in-project
        code: 1
        when: '待つ側の Issue のリポジトリがプロジェクトにありません。'
      - kind: dependency-unreadable
        code: 1
        when: 'blocked-by を全部は読めませんでした。'
      - kind: dependency-rejected
        code: 1
        when: 'GitHub Enterprise Server が Issue の依存関係に対応していません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っているか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '前提を外した後で本文の書き込みに失敗したときは、blocked-by は外れたままで、失敗を返します。ボードに書けないときは、blocked-by と本文は残り、`warnings` に入れるだけです。選択肢の ID が古くて書けないときは、ID を読み直す `project_activate` の案内を添えます。節かボードに関する `warnings` だけのときは、成功を返します。'
    effects:
      - target: github
        kind: write
        what: 'blocked-by を外し、待つ側の Issue の本文を書き換え、そのボードの項目の列と Status の札を設定します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、待つ側の Issue の blocked-by と本文、読み直した判定、ボードの項目を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          issue_ref: example-org/my-repo/12
          by: example-org/my-repo/11
        note: 'Issue 12 が Issue 11 を待つのをやめます。'
    default_notes:
      issue_ref: '短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-UNBLOCK-01
        pattern: event
        statement: 'Issue の参照と `by` を渡すと、blocked-by から前提を外し、結果の `change` を `removed` にします'
      - id: PW-ISSUE-UNBLOCK-02
        pattern: event
        statement: '付いていない前提を渡すと、何も書き込まずに `change` を `unchanged` にし、節に残った古い行も書き換えません'
      - id: PW-ISSUE-UNBLOCK-03
        pattern: event
        statement: '節に前提の行があるものを外すと、その行を節から消し、節が空になれば節ごと消します'
      - id: PW-ISSUE-UNBLOCK-04
        pattern: event
        statement: '前提を外した後に判定が変わると、待つ側の Issue の列を動かして、その動きを `moves` に入れます'
      - id: PW-ISSUE-UNBLOCK-05
        pattern: event
        statement: '札が `Needs Attention` で、残りの前提がある、または外した前提が閉じていると、札を `Todo` へ戻して `moves` に入れます'
      - id: PW-ISSUE-UNBLOCK-06
        pattern: unwanted
        statement: 'もし外したのが開いた最後の前提なら、札が `Needs Attention` でも `Todo` に戻しません'
      - id: PW-ISSUE-UNBLOCK-07
        pattern: unwanted
        statement: 'もし待つ側の Issue に着手の跡があるなら、前提は外して列と札を動かしません'
      - id: PW-ISSUE-UNBLOCK-08
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、書き込みを送らずに、`dryRun` を `true` にして成功を返します'
      - id: PW-ISSUE-UNBLOCK-09
        pattern: unwanted
        statement: 'もし本文の `Waits for merge` の節が読めないなら、前提だけを外し、節を直していない旨を `warnings` に入れます'
      - id: PW-ISSUE-UNBLOCK-10
        pattern: unwanted
        statement: 'もし読み直した前提が書いた内容と 2 回続けて合わないなら、列と札を動かさず、その旨を `warnings` で知らせます'
      - id: PW-ISSUE-UNBLOCK-11
        pattern: unwanted
        statement: 'もし動かす先の値がボードに無いなら、`project_init` で足し方を案内する文を `warnings` に入れます'
      - id: PW-ISSUE-UNBLOCK-12
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、`kind` が `dependency-rejected` の失敗を返します'
      - id: PW-ISSUE-UNBLOCK-13
        pattern: unwanted
        statement: 'もし Issue の参照の形が誤っているなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-ISSUE-UNBLOCK-14
        pattern: unwanted
        statement: 'もしリポジトリがプロジェクトに無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-ISSUE-UNBLOCK-15
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-ISSUE-UNBLOCK-16
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、または本文の書き込みに失敗したなら、失敗を返します'
      - id: PW-ISSUE-UNBLOCK-17
        pattern: event
        statement: '`by` でプロジェクトの外のリポジトリの Issue を指すと、プロジェクトに入っているかは待つ側のリポジトリだけ確かめ、前提を外します'
      - id: PW-ISSUE-UNBLOCK-18
        pattern: event
        statement: '呼ぶと、書いた列と札を `moves` で返し、書かなかったときは空の `moves` を返します。`dry_run` のときは `moves` を返しません'
      - id: PW-ISSUE-UNBLOCK-19
        pattern: unwanted
        statement: 'もし列を書けないなら、`warnings` に入れ、前提を外したまま成功を返します。選択肢の ID が古くて書けないときは、ID を読み直す `project_activate` の案内を添えます'
      - id: PW-ISSUE-UNBLOCK-20
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-ISSUE-UNBLOCK-21
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-PR-CHECK:
    help:
      details:
        - Prints the information to check before creating a PR for the repository given by --directory.
        - "Prints 11 sections in a fixed order: Git Remote, Current Branch, Push Status, Base Branch, Git Status, .gitignore, Git Exclude, Commits, Diff Summary, Worktree Info and Stash List."
        - The base branch is <remote>/ followed by the develop_branch of the selected project, where <remote> is the origin remote, or the first remote when there is no origin.
        - "When the base record of a stacked start exists, the base branch is <remote>/ followed by the branch of the layer below instead. When the remote reports that branch no longer exists, it is <remote>/ followed by the develop_branch, even if a stale remote-tracking ref remains. When the remote cannot be reached, the remote-tracking ref decides."
        - "When .pecot/state/.pecot-base of the worktree of the working directory is missing, the stacked base is inferred. When the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the branch counts as stacked on it. Otherwise it counts as started from the develop_branch. A warning line cannot infer the stacked base is printed when the readiness cannot be read or is blocked, when GitHub cannot be reached, or when the remote-tracking ref is missing. The inferred base is not written."
        - "The query to the remote about the branch of the layer below times out after 10 seconds and never asks for credentials (GIT_TERMINAL_PROMPT=0 and the askpass programs are disabled). A timeout is handled the same as a remote that cannot be reached."
        - "When the branch of the layer below is on the remote but has no remote-tracking ref, compares with the develop_branch and prints a warning that tells to run git fetch. This warning is not counted in the preflight warnings."
        - "When the base record is malformed, stops with exit status 1 because the base cannot be decided."
        - Prints every section even when there are warnings.
        - Counts a warning for a branch that is not pushed or has diverged, for modified or untracked files, and for stash entries.
        - "When the base record of a stacked start exists and the branch has diverged from the remote, reads the PR of the layer below and the head of that branch on the remote, and decides whether a restack is needed in the same way as pr restack. Besides inferring a missing base record, this is the only case that reads GitHub. The fix of the Push Status warning is pr restack when a restack is needed, and pr restack --check when it cannot be decided, which includes the case where the branch of the layer below is gone from the remote and its PR is not merged."
        - "When the branch is already on the new base and only the base record is old, the fix of the Push Status warning is pr restack, which pushes the branch and rewrites the record."
        - "When the branch has diverged and needs no restack otherwise, including a branch that is not stacked, the fix of the Push Status warning is git pull --rebase, or git push --force-with-lease after rewriting pushed commits, because git rejects a push that is not a fast-forward."
        - Exits with status 2 when there is at least one warning.
        - Reads the repository and the config and changes nothing.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot pr check -D .
          note: Check the current repository before creating a PR.
      default_notes:
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: PR を作る前に確かめる情報を、まとめて出します。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。相対パスは、セッションのディレクトリから見たものです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - '`directory` のリポジトリについて、PR を作る前に確かめる情報を返します。'
      - '結果には、remote・今のブランチ・Push Status・base ブランチ・`git status`・コミット・差分の統計・worktree・stash の一覧を入れます。'
      - 'base ブランチは、`<remote>/` の後に、選んだプロジェクトの `develop_branch` を続けたものです。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - '積んで着手した記録があるときは、base ブランチは、`<remote>/` の後に下の段のブランチを続けたものです。remote がそのブランチは無いと答えれば（マージで消えた後）、手元に追跡参照が残っていても `develop_branch` の方にします。remote に届かなければ、手元の追跡参照の有無で決めます。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチに積んだものとします。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`cannot infer the stacked base` の文を `warnings` に入れます。求めた結果は書きません。'
      - '下の段のブランチについての remote への問い合わせには、10 秒の時間切れがあり、認証の入力は求めません（`GIT_TERMINAL_PROMPT=0` と askpass の無効化）。時間切れは、remote に届かないときと同じに扱います。'
      - '下の段のブランチが remote にあり、手元に追跡参照が無いときは、`develop_branch` と比べ、`git fetch` を案内する文を `warnings` に入れます。この文は、確かめた結果の数に入りません。'
      - '積んだ base の記録の形が誤っているときは、base を決められないので、`kind` が `content-invalid` の失敗を返します。'
      - '確かめた結果に引っかかりがあっても、すべての項目を返します。'
      - '引っかかりとして数えるのは、push していないか remote とずれたブランチ、変更したファイルか追跡していないファイル、stash の項目です。'
      - '積んで着手した記録があり、ブランチが remote とずれているときは、下の段の PR と remote の先頭を読み、`pr_restack` と同じに載せ直しの要否を決めます。GitHub を読むのは、このときと、記録が無く積んだ先を求めるときだけです。'
      - 'Push Status の直し方は、載せ直しが要れば `pr_restack`、決められなければ `check` を付けた `pr_restack` です。下の段のブランチが remote から消え、PR がマージされていないときも、決められないに入ります。'
      - 'ブランチが新しい base の上に載り終えていて記録だけが古いときも、Push Status の直し方は `pr_restack` です。push と記録の書き直しを `pr_restack` が行うためです。'
      - 'ほかに、ブランチが remote とずれて載せ直しが要らないときは、Push Status の直し方は `git pull --rebase` です。push 済みのコミットを書き換えたなら `git push --force-with-lease` です。積んでいないブランチも同じです。git は fast-forward でない push を拒むためです。'
      - '引っかかりが 1 件以上あると、それぞれを `warnings` に入れ、`kind` が `preflight-failed` の失敗を返します。失敗の結果にも、集めた項目が入ります。'
      - 'リポジトリと設定を読むだけで、何も変えません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '11 の節です。それぞれ `=== <title> ===` の行に内容が続き、節の間は空行で区切ります。'
    mcp_output:
      fields:
        remoteUrl: '主な git remote の URL です。'
        currentBranch: '今のブランチです。'
        pushed: '今のブランチを push 済みで、リモートのブランチと同じかどうかです。'
        pushStatus: 'Push Status の状態を書いた文です。'
        baseBranch: '比べる相手のリモートブランチです。`remote/branch` の形です。積んでいるときは下の段、そうでなければ develop ブランチです。'
        gitStatus: '`git status` の出力です。'
        commits: 'ベースブランチからのコミットを、1 行に 1 件ずつ並べた文です。'
        diffSummary: 'ベースブランチとの差分の統計を書いた文です。'
        worktree: 'worktree の情報です。`list`（`git worktree list` の出力）と `directoryName`（今のディレクトリの名前）を持ちます。リンクされた worktree かどうかを示す `isWorktree` は、判定できたときだけ入ります。'
        stashList: 'stash の一覧を書いた文です。'
    diagnostics: '標準エラーに、`warning` の数の `count` の行を出し、続けて `warning` ごとに行を 1 つ出します。行の形は `<label>: <message> (fix: <hint>)` です。下の段のブランチに手元の追跡参照が無いときは、`git fetch` を案内する `warning` の行を足します。この行は数に入りません。記録が無く積んだ先を求められないときは、`warning: cannot infer the stacked base: <理由>` の行を出します。'
    environment: []
    exit_status:
      - kind: git-unresolved
        code: 1
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` が未設定です。'
      - kind: git-unresolved
        code: 1
        when: '`<remote>/<develop_branch>` がありません。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
      - kind: content-invalid
        code: 1
        when: '積んだ base の記録の形が誤っています。'
      - kind: preflight-failed
        code: 2
        when: '`warning` が 1 件以上あります。'
      - kind: invalid-input
        code: 2
        when: '`directory` が無いか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: 'remote・ブランチ・push の状態・status・base との log と差分・worktree の一覧・stash の一覧を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイル、`.gitignore`、`.git/info/exclude` を読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ローカルのリポジトリに `<remote>/<develop_branch>` が要ります。`<remote>` は remote の `origin` で、`origin` が無ければ最初の remote です。'
    idempotent: true
    examples:
      - arguments:
          directory: .
        note: 'PR を作る前に、セッションのディレクトリのリポジトリを確かめます。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-CHECK-01
        pattern: event
        statement: '`directory` でリポジトリを指すと、remote・ブランチ・base・status・コミット・差分・worktree・stash を結果に入れます'
      - id: PW-PR-CHECK-02
        pattern: event
        statement: '引っかかりがあるときに呼ぶと、失敗の結果にも、集めた項目を全部入れます'
      - id: PW-PR-CHECK-03
        pattern: event
        statement: '呼ぶと、`baseBranch` に `<remote>/<develop_branch>` を入れます（`<remote>` は `origin`、無ければ最初の remote）'
      - id: PW-PR-CHECK-04
        pattern: event
        statement: '呼ぶと、引っかかりを数えます'
      - id: PW-PR-CHECK-05
        pattern: event
        statement: '引っかかりがあるときに呼ぶと、1 件ごとに `<label>: <message> (fix: <hint>)` の文を `warnings` に入れます'
      - id: PW-PR-CHECK-06
        pattern: ubiquitous
        statement: '常に、リポジトリとファイルを書き換えません'
      - id: PW-PR-CHECK-07
        pattern: unwanted
        statement: 'もしブランチが push されていないか remote とずれているなら、Push Status の引っかかりを数えます'
      - id: PW-PR-CHECK-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、Git Status の引っかかりを数えます'
      - id: PW-PR-CHECK-09
        pattern: unwanted
        statement: 'もし stash に項目があるなら、Stash List の引っかかりを数えます'
      - id: PW-PR-CHECK-10
        pattern: unwanted
        statement: 'もし引っかかりが 1 件以上あるなら、`kind` が `preflight-failed` の失敗を返します'
      - id: PW-PR-CHECK-11
        pattern: unwanted
        statement: 'もし git のリポジトリでないなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-CHECK-12
        pattern: unwanted
        statement: 'もし git の remote が無いなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-CHECK-13
        pattern: unwanted
        statement: 'もし現在のブランチか remote のリポジトリを決められないなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-CHECK-14
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-PR-CHECK-15
        pattern: unwanted
        statement: 'もし `develop_branch` が設定に無いなら、`kind` が `repo-setting-missing` の失敗を返します'
      - id: PW-PR-CHECK-16
        pattern: unwanted
        statement: 'もし `<remote>/<develop_branch>` が無いなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-CHECK-17
        pattern: unwanted
        statement: 'もし `directory` を渡していないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-CHECK-18
        pattern: event
        statement: '積んだ base の記録があるときに呼ぶと、`baseBranch` に `<remote>/<下の段のブランチ>` を入れます。そのブランチが remote から消えていれば、手元に追跡参照が残っていても `<remote>/<develop_branch>` を入れます'
      - id: PW-PR-CHECK-19
        pattern: unwanted
        statement: 'もし積んだ base の記録の形が誤っているなら、`kind` が `content-invalid` の失敗を返します'
      - id: PW-PR-CHECK-20
        pattern: event
        statement: '下の段のブランチが remote にあり、手元に追跡参照が無いときに呼ぶと、開発ブランチと比べ、`git fetch` を案内する文を `warnings` に入れます'
      - id: PW-PR-CHECK-21
        pattern: unwanted
        statement: 'もし積んだ記録があってブランチが remote とずれ、下の段が動いたかマージされているなら、Push Status の直し方に `pr_restack` を示します'
      - id: PW-PR-CHECK-22
        pattern: unwanted
        statement: 'もしブランチが remote とずれて、載せ直しも記録の書き直しも要らないなら、直し方に `git pull --rebase` と `git push --force-with-lease` を示します'
      - id: PW-PR-CHECK-23
        pattern: unwanted
        statement: 'もし積んだブランチが remote とずれ、載せ直しが要るかを決められないなら、Push Status の直し方に `check` を付けた `pr_restack` を示します。下の段の PR か remote の先頭を読めないときと、下の段のブランチが消えて PR が未マージのときです'
      - id: PW-PR-CHECK-24
        pattern: unwanted
        statement: 'もし積んだブランチが remote とずれ、新しい base の上に載り終えていて記録だけが古いなら、Push Status の直し方に `pr_restack` を示します'
      - id: PW-PR-CHECK-25
        pattern: state
        statement: '記録が無く、作業中の Issue の判定が stackable で、ブランチが下の段の変更を持つ間、下の段の追跡参照と比べます'
      - id: PW-PR-CHECK-26
        pattern: unwanted
        statement: 'もし記録が無く、積んだ先を求められないなら、`cannot infer the stacked base: <理由>` の文を `warnings` に入れ、`develop_branch` の追跡参照と比べます'
      - id: PW-PR-CHECK-27
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-CHECK-28
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-PR-CREATE:
    help:
      details:
        - "Has two modes: a file argument and -m."
        - When both are given, the file wins over -m.
        - --template is default or release.
        - The templates are MCP resources (pecot-template://pr/create and pecot-template://pr/release); copy one to a file and fill it in.
        - With a file and the default template, an empty base in the front matter becomes the branch of the layer below when the branch is stacked, and the develop_branch of the repository otherwise.
        - "When the base record .pecot/state/.pecot-base of a stacked start exists, the default template of the current branch uses the base branch it names (the branch of the layer below) instead of develop_branch. The record is not read with --head, a head in the front matter, or the release template."
        - "When .pecot/state/.pecot-base of the worktree of the working directory is missing, the stacked base is inferred. When the readiness of the work Issue is stackable and the branch has the changes of the branch it names (the same commits, or the same patches after that branch was rebased; when that branch has no commits of its own, its head being an ancestor of the branch), the branch counts as stacked on it. Otherwise it counts as started from the develop_branch. A warning line cannot infer the stacked base is printed when the readiness cannot be read or is blocked, when GitHub cannot be reached, or when the remote-tracking ref is missing. The inferred base is not written."
        - When the base cannot be inferred, posting stops with an error and no PR is created, since a PR to the develop_branch can include the changes of the layer below; --dry-run prints the warning and goes on.
        - "When the PR of the layer below is open, creates the PR on that base, and stops with exit status 3 if the base given is develop_branch."
        - "When the PR of the layer below is merged, creates the PR on develop_branch."
        - "The PR of the layer below is chosen in the order open, merged, closed. When the layer below has no open PR and is not merged, creates nothing and stops with exit status 2 with an error line that says the base branch has no open PR."
        - "When the record is malformed, stops with exit status 1 because the base cannot be decided."
        - "When the commit of the base record is not in the history of the head, a file or -m creates nothing and stops with exit status 1. Then reads the PR of the layer below and the head of that branch on the remote, and decides in the same way as pr restack whether the branch is already restacked. Only when it is, the second error line tells to rewrite the record with pr restack. The last line tells to run the command on the branch that wrote the record, or to pass --head to create the PR without the record."
        - After the PR on a stacked base is created, registers it in the stack of the layer below, or starts a stack of the two PRs when none exists. When the PR of the layer below is not the top of its stack, does not call the add API and prints a warning that says so. When the repository has no stack API or the connection fails, prints a warning with the URL and keeps the PR.
        - "After the PR is created, reads the Issues that wait for the Issue named by the head branch, and moves their board column by the readiness judgement. Only the board items of the selected project are read, and an Issue that is not on the board is skipped. When the judgement does not show the created PR, reads once more after about 1.5 seconds. Issues with a trace of work are not moved. A failure of this step, including a connection failure, only prints a warning and does not change the exit status. When the state cannot be confirmed, the warning reads: warning: could not confirm that GitHub reflects PR #<N> in the readiness of <Issue>; its column was not moved; run pecot board sync later to move it. When the Issue of the head number is not in the repository of the PR, the step prints nothing and is skipped. Dry runs and release PRs skip it."
        - "Unless the template is release or --no-issue-ref is given, fills an empty Closes # line with the number that ends the head branch name. A leftover .pecot/state/.pecot-active is not read, so a clone without .pecot/state/ gets the same Closes."
        - With a file, the repository, base, title, head and draft come from its front matter and the options of the same names are ignored.
        - With -m, the repository is --repo. When --repo is omitted, it is the repository of the git remote that points to a repository in a project config, checking origin first and then the others in git remote order.
        - "Unless the template is release or --no-issue-ref is given, appends Closes #N to the body when it does not mention the number N that ends the head branch name."
        - With a file, Closes is not appended when that Issue is an Epic or its kind cannot be read, and an empty Closes # line is removed.
        - Checks the title, body and base, and stops with exit status 3 when the Issue reference, a required section, the heading summaries, the notation, the Summary screenshot or the base branch is wrong.
        - In a repository whose release type is nx, also stops with exit status 3 when the title scope differs from the scope of the changed nx projects.
        - "For a stacked base, the changed files of the scope come from the diff between the commit of the base record and the head when the PR of the layer below is merged, and from the diff against the branch of the layer below while that PR is open."
        - Unless --dry-run is given, runs the same checks as pr check on the current directory and stops with exit status 2 when they find a warning. The Push Status check looks at the head branch. The fix of the Push Status warning on a stacked branch that has diverged is decided as in pr check.
        - "A head of the form owner:branch names a branch of a fork. Its push is checked on the git remote that points to a repository of that owner on the host of the config, and the fix names that remote and the branch. When the owner is the owner of the target repository, only the remote of the target repository is checked; a fork in the same organization is not supported."
        - "With --dry-run, validates and writes dry-run: would lines without creating the PR."
        - "With --dry-run and an open PR of the layer below, also writes the line dry-run: would add the new PR to the stack of PR #<below>."
        - After the PR is created, sets the Issue named by the head branch to In Review unless the template is release.
        - --project names the project config to use. Without it, the config that includes the repository of the target is used; when several do, the active one among them.
      examples:
        - run: pecot pr create .pecot/tmp/output/pr-create-20260101-120000.md --dry-run
          note: Validate the file without creating the PR.
        - run: 'pecot pr create -m "<body>" -t "feat: add a report" -b develop -r example-org/my-repo'
          note: Create a PR from the command line.
      default_notes:
        head: The current branch. owner:branch names a branch of a fork. The related Issue is the number that ends the branch name.
        repo: With -m, the repository of the git remote that points to a repository in a project config, checking origin first. With a file, the repository in the front matter.
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: PR（プルリクエスト）を作ります。
    arguments:
      base: 'base ブランチです。`message` では必須です。'
      draft: 'ドラフトの PR として作るかどうかです。'
      dry_run: '検証だけを行うかどうかです。事前の確認を飛ばし、PR は作りません。'
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      head: 'head ブランチです。fork のブランチは `owner:branch` の形で渡します。'
      message: 'PR の本文です。ファイルを使わずに直接渡します。'
      no_issue_ref: '関連する Issue の自動の設定を飛ばすかどうかです。ブランチ名から番号を取り出さず、本文へ足さず、検証もしません。'
      repo: 'リポジトリです。`owner/repo` の形で渡します。`message` と一緒に使います。'
      screenshot: 'Summary の画像を省く理由です。`message` と一緒に使います。'
      template: 'PR のテンプレートの種類です。`default` か `release` を渡します。'
      title: 'PR の題です。`message` では必須です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints:
      - requires: {message: [title, base]}
      - conflicts: [file, screenshot]
    details:
      - 'モードは、`file`・`message` の 2 つです。'
      - '両方を渡すと、`file` が `message` より優先されます。'
      - '`template` は、`default` か `release` です。'
      - 'テンプレートは MCP の resource（`pecot-template://pr/create` と `pecot-template://pr/release`）です。ファイルに写して書き込みます。'
      - '`file` と `default` のテンプレートで、フロントマターの base が空なら、投稿のときに base を決めます。積んだブランチは下の段のブランチ、そうでなければリポジトリの `develop_branch` です。'
      - '積んで着手した記録 `.pecot/state/.pecot-base` があると、base は `develop_branch` ではなく、記録の base（下の段のブランチ）です。今のブランチの `default` のテンプレートだけが対象です。`head` の引数・フロントマターの `head`・`release` のテンプレートでは、記録を読みません。'
      - '作業ディレクトリの worktree に `.pecot/state/.pecot-base` が無いときは、積んだ先を求めます。作業中の Issue の判定が stackable で、判定の示すブランチの変更をブランチが持てば、そのブランチに積んだものとします。変更を持つとは、同じコミットか、そのブランチを載せ直した後の同じ patch を持つことです。そのブランチが自分のコミットを持たなければ、その先頭がブランチの祖先であることです。'
      - 'そうでなければ、開発ブランチからの着手とします。判定を読めないか blocked のときと、GitHub に届かないとき、追跡参照が無いときは、`cannot infer the stacked base` の文を `warnings` に入れます。求めた結果は書きません。'
      - '積んだ先を求められないとき、投稿は失敗を返し、PR を作りません。開発ブランチ向けの PR に、下の段の差分が入りうるためです。`dry_run` は、`warnings` に入れて続けます。'
      - '下の段の PR が開いているときは、その base で PR を作ります。渡した base が `develop_branch` なら、`kind` が `content-invalid` の失敗を返します。'
      - '下の段の PR がマージ済みのときは、`develop_branch` を base にして PR を作ります。'
      - '下の段の PR は、開いている・マージ済み・閉じた、の順に選びます。'
      - '下の段の PR が無く、マージもされていないときは、PR を作りません。base ブランチに開いた PR が無いと書いた `detail` を入れて、`kind` が `pr-state` の失敗を返します。'
      - '記録の形が誤っているときは、base を決められないので、`kind` が `content-invalid` の失敗を返します。'
      - '記録のコミットが head の履歴に無いときは、`file` と `message` の投稿では PR を作らず、失敗を返します。このとき、下の段の PR と remote の先頭を読み、`pr_restack` と同じ判断で載せ直し済みかを決めます。載せ直し済みと決まったときだけ、`detail` の 2 行目で `pr_restack` で記録を書き直すことを案内します。最後の行で、記録を書いたブランチで呼ぶか、`head` を渡して記録なしで作るかを案内します。'
      - '積んだ base の PR を作った後、下の段のスタックに登録します。スタックが無ければ、2 つの PR で新しく作ります。下の段の PR がスタックの一番上に無いときは、追加を呼ばず、そのことを `warnings` に入れます。スタックの API が無いリポジトリと接続の失敗では、URL を添えて `warnings` に入れ、PR は残します。'
      - 'PR を作った後、head ブランチが指す Issue を待っている Issue を読み、判定に従って列を動かします。読むのは、選んだプロジェクトのボードの項目だけで、ボードに載っていない Issue は飛ばします。判定に作った PR が出ていないときは、約 1.5 秒待ってから 1 回だけ読み直します。着手の跡がある Issue は動かしません。'
      - '接続の失敗を含め、この処理の失敗は `warnings` に入れるだけで、成功と失敗を変えません。状態を確かめられないときは、`could not confirm that GitHub reflects PR #<N> ...` の文を入れ、後から `board_sync` で列を直せると添えます。head の番号の Issue が PR のリポジトリに無いときは、何も入れずに飛ばします。`dry_run` とリリースの PR では行いません。'
      - '番号の空いた `Closes #` の行は、head ブランチ名の末尾の番号で埋めます。テンプレートが `release` のときと、`no_issue_ref` を付けたときは埋めません。古い版の `.pecot/state/.pecot-active` が残っていても読まないので、`.pecot/state/` の無い clone でも同じ `Closes` が入ります。'
      - '`file` では、リポジトリ・base・題・head・draft をフロントマターで決めます。同じ名前の引数は無視します。'
      - '`message` では、リポジトリは `repo` です。`repo` を省くと、プロジェクトの設定にあるリポジトリを指す remote のリポジトリです。remote は `origin` を先に見て、次に `git remote` の順で見ます。'
      - '本文が head ブランチ名の末尾の番号 N に触れていないと、本文に `Closes #N` を足します。テンプレートが `release` のときと、`no_issue_ref` を付けたときは足しません。'
      - '`file` では、その Issue が Epic か種別を読めないとき、`Closes` を足さずに番号の空いた `Closes #` の行を消します。種別を読めないときは、`warnings` に入れます。'
      - '題・本文・base を確かめ、次のどれかが誤っていると、`kind` が `content-invalid` の失敗を返します。Issue の参照、必須の節、見出しの要約、記法、Summary のスクリーンショット、base ブランチです。'
      - 'リリースの種類が nx のリポジトリでは、題の scope が、変更した nx のプロジェクトの scope と違うときも、同じ失敗を返します。'
      - '積んだ base の scope は、下の段の PR がマージ済みなら、記録のコミットから head までの差分で求めます。開いている間は、下の段のブランチとの差分で求めます。'
      - '`dry_run` を付けなければ、セッションのディレクトリを `pr_check` と同じように確かめます。引っかかりが見つかると、それぞれを `warnings` に入れ、`kind` が `preflight-failed` の失敗を返します。積んだブランチが remote とずれたときの Push Status の直し方も、`pr_check` と同じに決めます。'
      - '`dry_run` を付けると、検証して、作る予定の head・base・題を結果に入れ、PR は作りません。'
      - '`dry_run` で下の段の PR が開いているときは、スタックへの登録の予定も、結果の `stack` に入れます。'
      - 'PR を作った後、head ブランチが指す Issue を In Review にします。テンプレートが `release` のときは行いません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: text
      description: '作った PR の URL です。`--dry-run` のときは、何も出しません。'
    mcp_output:
      fields:
        url: '作った PR の URL です。`dry_run` のときは入りません。'
        number: '作った PR の番号です。`dry_run` のときと、応答に番号が無いときは入りません。'
        head: 'PR の head ブランチです。fork のブランチは `owner:branch` の形です。'
        base: 'PR の base ブランチです。'
        title: 'PR のタイトルです。'
        inReview: 'Status を In Review にした Issue の番号です。設定しなかったときは入りません。'
        stack: 'PR の積み方です。積まない PR では入りません。`lower`（下の段の PR の番号）を必ず持ちます。`registered`（スタックに登録したか）と `number`（スタックの番号。登録したときだけ）は、`dry_run` のときは入りません。'
        moves: 'この PR を待っていた Issue のうち、列か Status を書いたものの配列です。`dry_run` のときは入りません。要素は `issue`・`reason` を必ず持ち、`from`・`to`・`label` は `board_sync` の `moves` と同じです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。PR は作っていません。'
    diagnostics: '標準エラーに、PR の結果の行（`created`）と、ボードの status の結果の行（`set`）を出します。積んだ base のときは、スタックの結果の行（`added: PR #N to stack #S`）も出します。待っていた Issue を動かしたときは、`moved:` の行も出します。`--dry-run` のときは、PR と status の `dry-run: would` の行を出し、下の段の PR が開いていれば、登録の予定の行も出します。行は `dry-run: would add the new PR to the stack of PR #<下>` です。検証の失敗ごとに、`error` の行を 1 つ出します。事前の確認が `warning` を見つけたときは、`error` の行に続けて、`warning` ごとの行を出します。ボードの status を設定できないときと、Issue の種類を読めないときは、`warning` の行を出します。スタックに登録できないときは、`warning: could not register stack: <理由>` の行を出します。下の段の PR がスタックの一番上に無いときは、`warning: could not register stack: PR #<下> is not the top ...` の行を出します。待っている Issue を読めないか動かせないときも、`warning` の行を出します。確かめられないときは、`warning: could not confirm that GitHub reflects PR #<N> ...` の行を出します。下の段の PR が無いときは、`error: base branch <base> has no open PR` の行と直し方の行を出します。記録が無く積んだ先を求められないとき、投稿では `error: cannot infer the stacked base: <理由>` の行と直し方の行を出します。`--dry-run` では、同じ理由の `warning` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        code: 1
        when: '`template` が `default` でも `release` でもありません。モードの引数が無いとき、`message` に `title` か `base` が無いとき、ファイルと一緒に `screenshot` を渡したときも含みます。'
      - kind: content-invalid
        code: 1
        when: 'フロントマターを読めないか、正しいリポジトリがありません。'
      - kind: invalid-input
        code: 1
        when: 'リポジトリが `owner/repo` の形ではありません。'
      - kind: git-unresolved
        code: 1
        when: 'リポジトリか head ブランチを決められません。'
      - kind: content-invalid
        code: 1
        when: '積んだ base の記録の形が誤っていて、base を決められません。'
      - kind: git-unresolved
        code: 1
        when: '積んだ base の記録のコミットが head の履歴にありません。`file` と `message` の投稿のときです。'
      - kind: git-unresolved
        code: 1
        when: '記録が無く、積んだ先を求められません。`file` と `message` の投稿のときです。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` か `release_branch` が未設定です。'
