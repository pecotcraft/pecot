    exit_status:
      - kind: repo-mismatch
        code: 1
        when: '`--repo` が今の git remote と違います。'
      - kind: git-unresolved
        code: 1
        when: 'git のリポジトリの外で `--repo` を省きました。`--repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: already-exists
