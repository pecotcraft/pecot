        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-ISSUE-REOPEN-17
        pattern: unwanted
        statement: 'もしリポジトリがプロジェクトに無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-ISSUE-REOPEN-18
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-ISSUE-REOPEN-19
        pattern: unwanted
        statement: 'もし Issue の参照の形が誤っているなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-ISSUE-REOPEN-20
        pattern: unwanted
        statement: 'もし status が `blocked` でボードが Blocked を定義していないなら、`project_init` で足し方を案内する文を `warnings` に入れます'
      - id: PW-ISSUE-REOPEN-21
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、Issue を開き直さずボードにも書かず、する操作を結果に入れ、`dryRun` を `true` にして成功を返します'
      - id: PW-ISSUE-REOPEN-22
        pattern: event
        statement: 'ボードの項目がアーカイブ済みの Issue を開き直すと、Status を設定する前にアーカイブを解き、結果の `unarchived` を `true` にします'
      - id: PW-ISSUE-REOPEN-23
        pattern: unwanted
        statement: 'もしアーカイブを解けないなら、Issue を開かずに失敗を返します。`detail` は `could not unarchive Issue <ref> on the board: ...` です'
      - id: PW-ISSUE-REOPEN-24
        pattern: unwanted
        statement: 'もし Status の書き込みに失敗したなら、書けなかった Status を `warnings` に入れ、reopen とコメントの投稿を続けます。選択肢の ID が古くて書けないときは、ID を読み直す `project_activate` の案内を添えます'
