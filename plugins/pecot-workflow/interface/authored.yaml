  PW-BOARD-SYNC:
    help:
      details:
        - Reads the whole board and moves the open Issues in Ready, Blocked, Active and In Review to the column and Status that their judgment calls for.
        - The judgment, the column move and the Status write are the same as the rest of the workflow (blocked-by, branches and PRs).
        - An Issue with a branch or a PR is never moved; when it is blocked, a warning line says so.
        - An Issue in Backlog, Pending or Archived, a PR card, a Tracker and an Epic are not moved.
        - An Issue whose judgment cannot be read (for example, develop_branch is not set) is not moved, and a warning line gives the reason.
        - Reads each Issue of Blocked, Active and In Review one by one, because the branches and PRs are not in the board list. Skips only the Ready Issues that the list shows with no prerequisites.
        - Then deletes the Archived items from the board except the 20 most recently updated. An Archived item that cannot be deleted is skipped, the command continues, and it ends with exit code 1.
        - "With --dry-run, prints the same sentences as dry-run lines and writes nothing to the board. For the Archived items it prints only the line dry-run: would delete N archived items."
        - The config is --project, else the active project, else the only config in .pecot/config/projects. With two or more configs and no active project, stops and asks for --project.
        - Reads the GraphQL rate limit (REST, no points) before and after the run and prints the points used and the remaining points. When it cannot be read, the line is left out. When the rate limit window resets during the run, or the difference is negative, the points used line is left out.
        - On a GitHub Enterprise Server without Issue dependencies, prints one warning and moves nothing.
      examples:
        - run: pecot board sync --dry-run
          note: Show the planned moves without writing to the board.
        - run: pecot board sync --project example-config
          note: Synchronize the board of the named config, for a checkout without an active project.
      default_notes: {}
    summary: Ready・Blocked・Active・In Review の Issue を、判定に合った列と Status へ動かします。
    arguments:
      dry_run: 'ボードへ書き込まず、動かす予定だけを出すかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。'
    constraints: []
    details:
      - 'ボードの全体を読み、Ready・Blocked・Active・In Review にある open の Issue を、判定が求める列と Status へ動かします。'
      - '判定・列の移動・Status の書き込みは、ワークフローのほかの部分と同じです（blocked-by・ブランチ・PR を見ます）。'
      - 'ブランチか PR のある Issue は動かしません。その Issue が blocked のときは、`warning` の行で知らせます。'
      - 'Backlog・Pending・Archived にある Issue と、PR のカード・Tracker・Epic は動かしません。'
      - '判定を読めない Issue（`develop_branch` が未設定のときなど）は動かさず、`warning` の行に理由を出します。'
      - 'ブランチと PR はボードの一覧に載らないので、Blocked・Active・In Review の Issue は 1 件ずつ読みます。読むのを省くのは、一覧で前提が無いと分かる Ready の Issue だけです。'
      - '動かした後で、Archived の項目を、更新の新しい 20 件を残して、ボードから削除します。削除できない Archived の項目は飛ばして続け、終了コード 1 で終わります。'
      - '`--dry-run` を付けると、同じ文を `dry-run` の行として出し、ボードには何も書きません。Archived の項目については、`dry-run: would delete N archived items` の行だけを出します。'
      - '設定は、`--project` の設定、アクティブなプロジェクト、`.pecot/config/projects` にある唯一の設定の順で選びます。設定が 2 つ以上あってアクティブなプロジェクトが無いときは、止まって `--project` を求めます。'
      - '実行の前後に GraphQL の rate limit を読み（REST なので点数は減りません）、使った点数と残りの点数を出します。読めないときは、その行を省きます。実行中に rate limit の窓が切り替わったときと、差が負のときは、使った点数の行を省きます。'
      - 'Issue の依存関係に対応していない GitHub Enterprise Server では、`warning` を 1 回出し、何も動かしません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        moves: '列か Status を書いた Issue の配列です。`dry_run` のときは、書く予定の Issue です。要素は `issue`・`reason` を必ず持ちます。`issue` は `#N` の形で、ホームリポジトリの外は `owner/repo#N` です。`reason` は、動かすと決めた Readiness です。`from` と `to` は列が変わったときだけ、`label` は Status を設定したときだけ入ります。'
        deletedArchived: 'ボードから削除した Archived の項目の件数です。`dry_run` のときは、削除する予定の件数です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。ボードには何も書いていません。'
    diagnostics: '移動ごとの結果の行（`moved`）と、Status の書き込みごとの結果の行（`set`）と、削除した Archived の項目の結果の行（`deleted`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。`warning` の行を出すのは、次のときです。ブランチか PR のある Issue が blocked のとき。判定を読めない Issue があるとき。書き込みに失敗したとき。Archived の項目を削除できなかったとき。ボードが定義していない値があるとき。GitHub Enterprise Server が Issue の依存関係に対応していないとき。`count` の行には、使った GraphQL の点数と残りを出します。rate limit を読んだ後にエラーで止まったときも出します。最後に、書き込みに失敗した Issue の数を `error` の行で出します。失敗ごとにも `error` の行を出します。削除できなかった Archived の項目の数も、別の `error` の行で出します。'
    environment: []
    exit_status:
      - kind: partial-failure
        code: 1
        when: 'ボードへの書き込みが 1 件以上の Issue で失敗したか、Archived の項目を 1 件以上削除できませんでした。ほかの Issue をすべて同期した後で終わります。'
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトが無く、設定も 1 つに決まりません。'
      - kind: project-not-found
        code: 1
        when: '`--project` の名前の設定がありません。'
      - kind: config-invalid
        code: 1
        when: '設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 2
        when: 'コマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '既に書いた移動と、既に削除した Archived の項目は、そのまま残ります。書き込みの失敗は `warning` として扱い、ほかの Issue の同期を続けてから、終了コード 1 で終わります。Archived の項目を削除できないときも `warning` にして続け、終了コード 1 で終わります。判定を読めない Issue があるときと、Issue の依存関係に対応していない GitHub Enterprise Server のときは、終了コード 0 で終わります。'
    effects:
      - target: github
        kind: read
        what: 'ボードの項目を読みます。Blocked・Active・In Review の Issue と、前提のある Ready の Issue は、blocked-by・ブランチ・PR も読みます。GraphQL の rate limit も読みます。'
      - target: github
        kind: write
        what: '判定に合っていない Issue の列（pecot-workflow のフィールド）と Status を設定します。'
      - target: github
        kind: destructive
        what: '更新の新しい 20 件を超えた Archived の項目を、プロジェクトのボードから削除します。`--dry-run` のときは削除しません。'
      - target: file
        kind: read
        what: '設定ファイルを読みます。'
    prerequisites:
      - '`.pecot/config/projects` の下に設定が要ります。アクティブな設定か、`--project` で名前を渡した設定か、唯一の設定を使います。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - run: pecot board sync --dry-run
        note: 'ボードへ書き込まず、動かす予定を出します。'
      - run: pecot board sync --project example-config
        note: '名前を渡した設定のボードを同期します。アクティブなプロジェクトの無いチェックアウトで使います。'
    default_notes: {}
    behaviors:
      - id: PW-BOARD-SYNC-01
        pattern: event
        statement: '打つと、Blocked の Issue の判定が `startable` か `stackable` なら、Ready へ動かします'
      - id: PW-BOARD-SYNC-02
        pattern: event
        statement: 'Ready の Issue に済んでいない前提があると、Blocked へ動かします'
      - id: PW-BOARD-SYNC-03
        pattern: event
        statement: '着手の跡の無い Issue が Active か In Review にあると、判定に合った列（Ready か Blocked）へ戻します'
      - id: PW-BOARD-SYNC-04
        pattern: unwanted
        statement: 'もし着手の跡（ブランチか PR）のある Issue が `blocked` なら、列と札を変えず、`warning` の行を標準エラーに出します'
      - id: PW-BOARD-SYNC-05
        pattern: unwanted
        statement: 'もし前提の無い Blocked の Issue に着手の跡があるなら、Ready へ動かしません'
      - id: PW-BOARD-SYNC-06
        pattern: state
        statement: 'Backlog・Pending・Archived の間、その Issue の前提を読まず、列と札を動かしません'
      - id: PW-BOARD-SYNC-07
        pattern: event
        statement: '前提がマージされずに閉じると、待っていた Issue の札を Needs Attention にします'
      - id: PW-BOARD-SYNC-08
        pattern: event
        statement: '札が Needs Attention の Issue の前提がすべて済むと、札を Todo に戻します'
      - id: PW-BOARD-SYNC-09
        pattern: event
        statement: '`--dry-run` を付けて打つと、動かす予定を `dry-run` の行で標準エラーに出し、ボードに書きません'
      - id: PW-BOARD-SYNC-10
        pattern: unwanted
        statement: 'もし書き込みに失敗した Issue があるなら、`warning` の行を出してほかの Issue を続け、最後に `error` の行を出して終了コード 1 で終わります。選択肢の ID が古くて書けないときは、ID を読み直す `project activate` の案内を、1 回の実行で 1 回だけ添えます'
      - id: PW-BOARD-SYNC-11
        pattern: event
        statement: '一覧で前提が 0 件の Ready の Issue があると、前提を個別に読みません。Blocked・Active・In Review の Issue は、前提の件数によらず個別に読みます'
      - id: PW-BOARD-SYNC-12
        pattern: unwanted
        statement: 'もし動かす先の値がボードに無いなら、その Issue を動かさず、`warning` の行を 1 回出します'
      - id: PW-BOARD-SYNC-13
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、`warning` の行を 1 回出し、何も動かさず、終了コード 0 で終わります'
      - id: PW-BOARD-SYNC-14
        pattern: event
        statement: '打つと、実行の前後の GraphQL の点数から、使用量と残りを `count` の行で標準エラーに出します。差が負か、点数の窓が途中で切り替わったときは、使用量の行を省きます'
      - id: PW-BOARD-SYNC-15
        pattern: unwanted
        statement: 'もし点数を読めないなら、その行を出さずに続けます'
      - id: PW-BOARD-SYNC-16
        pattern: unwanted
        statement: 'もしボードの取得で GitHub API がエラーを返したなら、点数の行を出して、終了コード 1 で終わります'
      - id: PW-BOARD-SYNC-17
        pattern: state
        statement: 'アクティブなプロジェクトが無く、設定がちょうど 1 つの間、その設定を使います'
      - id: PW-BOARD-SYNC-18
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無く、設定が 2 つ以上あるなら、`--project` を求める `error` の行を出して、終了コード 1 で終わります'
      - id: PW-BOARD-SYNC-19
        pattern: event
        statement: '`--project` に設定の名前を渡して打つと、アクティブな設定ではなく、その設定を使います'
      - id: PW-BOARD-SYNC-20
        pattern: unwanted
        statement: 'もし `--project` の設定が無いなら、使える設定の名前を添えた `error` の行を出して、終了コード 1 で終わります'
      - id: PW-BOARD-SYNC-21
        pattern: unwanted
        statement: 'もし設定が 1 つも無いなら、終了コード 1 で終わります'
      - id: PW-BOARD-SYNC-22
        pattern: event
        statement: '一覧の新しいクエリがスキーマの失敗になると、古いクエリで読み直し、前提を読まずに終了コード 0 で終わります'
      - id: PW-BOARD-SYNC-23
        pattern: unwanted
        statement: 'もし判定を読めない Issue があるなら、理由を添えた `warning` の行を出し、その Issue を動かしません'
      - id: PW-BOARD-SYNC-24
        pattern: event
        statement: 'Ready の Issue の前提が輪になると、Blocked へ動かします'
      - id: PW-BOARD-SYNC-25
        pattern: unwanted
        statement: 'もしカードが PR・Tracker・Epic なら、列と札を動かしません'
      - id: PW-BOARD-SYNC-26
        pattern: event
        statement: '設定で先頭にないリポジトリの Issue を動かすと、行に `owner/repo#N` の形で表します'
      - id: PW-BOARD-SYNC-27
        pattern: unwanted
        statement: 'もし設定のファイルが JSON として読めないなら、`error` の行を出して、終了コード 1 で終わります'
      - id: PW-BOARD-SYNC-28
        pattern: event
        statement: '更新の新しい 20 件を超える Archived の項目があると、超えた分だけをボードから削除し、`deleted` の行を標準エラーに出します'
      - id: PW-BOARD-SYNC-29
        pattern: event
        statement: '`--dry-run` を付けて打つと、Archived の項目を削除せず、`dry-run: would delete N archived items` の行を標準エラーに出します'
      - id: PW-BOARD-SYNC-30
        pattern: unwanted
        statement: 'もし Archived の項目を削除できなかったなら、`warning` の行を標準エラーに出して続けます'
      - id: PW-BOARD-SYNC-31
        pattern: unwanted
        statement: 'もし Archived の項目を削除できなかったなら、終了コード 1 で終わります。最後に `error: could not delete N archived items from the board` の行を出します'
  PW-BRANCH-DELETE:
    help:
      details:
        - Deletes a remote branch through the GitHub REST API, for use where a hook blocks git push and the gh CLI.
        - The repository to delete from is the repo argument (owner/repo).
        - The global pecot --repo is not used. The command only needs the working directory to be inside a git repository with a remote.
        - The default branch of the repository and the develop_branch and release_branch in the config file are protected and are never deleted.
        - --dry-run reads the default branch and checks the protected branches, then writes the plan line for the branch and deletes nothing.
      examples:
        - run: pecot branch delete example-org/my-repo feat/my-change/123
          note: Delete the remote branch.
        - run: pecot branch delete example-org/my-repo feat/my-change/123 --dry-run
          note: Show the plan without deleting.
      default_notes: {}
    summary: リモートブランチを削除します。保護するブランチは削除しません。
    arguments:
      branch: '削除するブランチの名前です。'
      dry_run: '何も削除せず、削除する予定だけを出すかどうかです。'
      repo: 'リポジトリの参照です。`owner/repo` の形で渡します。'
    constraints: []
    details:
      - 'GitHub の REST API でリモートブランチを削除します。フックが `git push` と gh CLI を止める環境で使います。'
      - '削除する先のリポジトリは、引数 `repo`（`owner/repo`）です。'
      - 'pecot 全体のオプション `--repo` は使いません。作業ディレクトリが、remote を持つ git のリポジトリの中にあれば足ります。'
      - 'リポジトリの既定ブランチと、設定ファイルの `develop_branch`・`release_branch` は保護していて、削除しません。'
      - '`--dry-run` を付けると、既定ブランチを読んで保護するブランチを確かめた後、ブランチの予定の行を書きます。何も削除しません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        branch: '削除対象のリモートブランチの名前です。'
        repository: 'ブランチがあるリポジトリです。`owner/repo` の形です。'
        deleted: 'リモートブランチを削除したかどうかです。`dry_run` のときは、いつも `false` です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も削除していません。'
    diagnostics: '標準エラーに、削除したブランチごとの結果の行（`deleted`）を出します。`--dry-run` のときは、予定の行（`dry-run`）を出します。ブランチが保護されているときは、保護するブランチを並べた `error` の行を出します。ほかの失敗でも `error` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: guard-blocked
        code: 1
        when: 'ブランチが保護されています。'
      - kind: git-unresolved
        code: 1
        when: 'git の外か、remote の無い git のリポジトリで打ちました。'
      - kind: invalid-input
        code: 2
        when: '`repo` が `owner/repo` の形でないか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: 'リポジトリの既定ブランチを読みます。'
      - target: github
        kind: destructive
        what: 'リモートブランチを削除します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、ブランチを削除する権限が要ります。'
    idempotent: false
    examples:
      - run: pecot branch delete example-org/my-repo feat/my-change/123
        note: 'リモートブランチを削除します。'
      - run: pecot branch delete example-org/my-repo feat/my-change/123 --dry-run
        note: '削除せずに、予定を出します。'
    default_notes: {}
    behaviors:
      - id: PW-BRANCH-DELETE-01
        pattern: event
        statement: 'リポジトリとブランチ名を渡して打つと、そのリポジトリのリモートブランチを削除します'
      - id: PW-BRANCH-DELETE-03
        pattern: event
        statement: '`--dry-run` を付けて打つと、何も削除しません'
      - id: PW-BRANCH-DELETE-04
        pattern: event
        statement: 'ブランチを削除すると、`deleted` の行を標準エラーに出します'
      - id: PW-BRANCH-DELETE-06
        pattern: event
        statement: '`--dry-run` を付けて打つと、`dry-run` の行を標準エラーに出します'
      - id: PW-BRANCH-DELETE-10
        pattern: unwanted
        statement: 'もし削除するブランチが既定ブランチ・`develop_branch`・`release_branch` のどれかなら、保護するブランチを並べた `error` の行を標準エラーに出します'
      - id: PW-BRANCH-DELETE-11
        pattern: unwanted
        statement: 'もし削除するブランチが既定ブランチ・`develop_branch`・`release_branch` のどれかなら、終了コード 1 で終わります'
      - id: PW-BRANCH-DELETE-12
        pattern: unwanted
        statement: 'もし `repo` が `owner/repo` の形でないなら、終了コード 2 で終わります'
      - id: PW-BRANCH-DELETE-13
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-BRANCH-DELETE-14
        pattern: unwanted
        statement: 'もしリポジトリの既定ブランチを読めないなら、終了コード 1 で終わります'
      - id: PW-BRANCH-DELETE-15
        pattern: unwanted
        statement: 'もしブランチの削除で GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-BRANCH-DELETE-17
        pattern: unwanted
        statement: 'もし remote を持つ git のリポジトリの外で打ったなら、`the repository is ambiguous` の行と、打つ場所の案内の行を標準エラーに出します'
      - id: PW-BRANCH-DELETE-18
        pattern: unwanted
        statement: 'もし git の外か remote の無い git のリポジトリで打ったなら、終了コード 1 で終わります'
      - id: PW-BRANCH-DELETE-19
        pattern: event
        statement: '`origin` の URL が GitHub の形でない作業ディレクトリで打つと、引数のリポジトリのリモートブランチを削除します'
  PW-ISSUE-BLOCK:
    help:
      details:
        - Adds a blocked-by (prerequisite) to an Issue, or changes the wait kind and reason of an existing one.
        - issue_ref is the waiting Issue and --by is the Issue to wait for. --by may be in another repository.
        - "--wait is stack (default) or merge. With --wait merge, --reason is required, and the Waits for merge section of the body of the waiting Issue gets a line for the prerequisite and the reason. With stack, the line is removed from the section."
        - --reason with --wait stack is a usage error.
        - Only the line of the prerequisite in the Waits for merge section is written. The rest of the section and the other sections of the body are not changed.
        - The command reads the blocked-by of the waiting Issue first. A prerequisite that is already there with the same kind and reason is left as it is. One with another kind or reason only has the section rewritten. A request to add or remove is never sent for a pair that is already in that state.
        - A cycle is searched only when a new blocked-by is added. The search follows the blocked-by of --by step by step, up to 200 Issues. When it cannot be sure, the command stops, because GitHub accepts cycles of three or more Issues.
        - The writes are made in the order blocked-by, body, then board. When the body write fails, the blocked-by stays and running the same command again fixes the body.
        - After the writes, the readiness of the waiting Issue is read again. When the blocked-by and the section read back differ from what was written, it is read once more. When they still differ, the column and the Status label are not moved.
        - The column and the Status label are moved by the readiness that was read back, in the same way as the board repair of the readiness feature. An Issue that has a branch or a PR is not moved and gets a warning about the difference.
        - With --dry-run, writes dry-run lines instead of the result lines. The reads, the cycle search and the checks are still made, and nothing is written.
        - Needs a GitHub Enterprise Server of version 3.19 or later, which has issue dependencies.
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot issue block example-org/my-repo/12 --by example-org/my-repo/11 --wait merge --reason "The check script is on main."
          note: Make Issue 12 wait for the merge of Issue 11.
      default_notes:
        issue_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: 'Issue に blocked-by（前提）を付けるか、付いている前提の待ち方と理由を変えます。'
    arguments:
      by: '待つ相手の Issue です。`owner/repo/N` の形で渡します。別のリポジトリの Issue も指せます。'
      dry_run: '何も書き込まずに、書く予定だけを出すかどうかです。'
      issue_ref: '待つ側の Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      reason: '前提のマージを待つ理由です。`--wait merge` のときは必須で、`--wait stack` のときは渡せません。'
      wait: '待ち方です。`stack`（相手のブランチの上に積みます。省くとこちら）か `merge`（相手がマージされるまで待ちます）を渡します。'
    constraints: []
    details:
      - 'Issue に blocked-by（前提）を付けるか、付いている前提の待ち方と理由を変えます。'
      - '`issue_ref` は待つ側の Issue で、`--by` は待つ相手の Issue です。`--by` は別のリポジトリの Issue でもかまいません。'
      - '`--wait` は `stack`（省くとこちら）か `merge` です。`--wait merge` のときは `--reason` が必須で、待つ側の Issue の本文の `Waits for merge` の節に、前提と理由の行を足します。`stack` のときは、その行を節から外します。'
      - '`--wait stack` で `--reason` を渡すと、使い方の誤りです。'
      - '書き込むのは、`Waits for merge` の節にある前提の行だけです。節のほかの部分と、本文のほかの節は変えません。'
      - 'まず、待つ側の Issue の blocked-by を読みます。既に付いていて種類と理由が同じ前提は、そのままにします。種類か理由が違う前提は、節だけを書き換えます。既にその状態の組には、追加と削除は求めません。何も変えないときの終了コードは 0 です。'
      - '輪の探索は、新しく blocked-by を足すときだけ行います。`--by` の blocked-by を 1 段ずつたどり、200 件の Issue まで調べます。確かめきれないときは、止まります。GitHub は 3 件以上の Issue でできる輪を受け付けてしまうためです。'
      - '書き込みは、blocked-by、本文、ボードの順に行います。本文の書き込みに失敗しても、blocked-by は残ります。同じコマンドをもう一度打てば、本文が直ります。'
      - '書き込みの後で、待つ側の Issue の判定を読み直します。読み直した blocked-by と節が書いた内容と違うときは、もう一度読みます。それでも違うときは、列と Status の札を動かしません。'
      - '列と Status の札は、読み直した判定で動かします。やり方は、判定の機能のボードの修復と同じです。ブランチか PR のある Issue は動かさず、判定との食い違いを `warning` の行で知らせます。'
      - '`--dry-run` を付けると、結果の行の代わりに `dry-run` の行を出します。読み取り、輪の探索、確認は行い、何も書き込みません。'
      - 'Issue の依存関係を持つ GitHub Enterprise Server の 3.19 以上が要ります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        issue: '待たせる側の Issue です。`owner/repo/N` の形です。'
        by: '前提の Issue です。`owner/repo/N` の形です。'
        wait: '実行後の blocked-by の待ち方です。`stack`（前提のブランチに積む）か `merge`（前提のマージを待つ）です。'
        change: 'blocked-by がどうなったかです。`added`（新しく足した）・`updated`（待ち方か理由を変えた）・`unchanged`（変更なし）のどれかです。'
        moves: '待つ側の Issue の列か Status を書いたときに、その 1 件を入れる配列です。要素は `board_sync` の `moves` と同じです。書かなかったときは空です。判定を確かめられなかったときと、ボードに書けなかったときも空で、理由は `warnings` に入ります。`dry_run` のときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、結果の行を出します。blocked-by には `added`・`unchanged`・`updated` のどれかを出し、列か札を変えたときは続けて `moved` と `set` を出します。`updated` の行の末尾には、`(wait: merge)` か `(wait: stack)` が付きます。`warning` の行は、次のときに出します。Issue に着手の跡があるとき。判定を出せないか、確かめられないとき。ボードに Blocked の選択肢が無いとき。ボードに書けなかったとき。Blocked が無いときは、`pecot project init` の実行を案内する `hint` の行が続きます。失敗ごとに `error` の行を出します。輪のときは、たどった Issue を `#A -> #B -> #A` の形で出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: repo-not-in-project
        code: 1
        when: '待つ側の Issue のリポジトリがプロジェクトにありません。'
      - kind: dependency-rejected
        code: 1
        when: 'Issue が既に 50 件の blocked-by を持っています。GitHub Enterprise Server が Issue の依存関係に対応していないときも含みます。'
      - kind: dependency-unreadable
        code: 1
        when: '輪を除けると確かめられませんでした。blocked-by を読めないときも含みます。'
      - kind: dependency-rejected
        code: 2
        when: '`--by` が輪（Issue 自身を含みます）になります。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っています。`--wait merge` で `--reason` が無いとき、`--wait stack` で `--reason` を渡したとき、ほかのコマンドラインの誤りも含みます。'
      - kind: content-invalid
        code: 3
        when: '本文の `Waits for merge` の節を読めません。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '前提を付けた後で本文の書き込みに失敗したときは、blocked-by は残り、終了コード 1 で終わります。ボードに書けないときは、blocked-by と本文は残り、`warning` を出すだけです。選択肢の ID が古くて書けないときは、ID を読み直す `project activate` の案内を添えます。ボードに関する `warning` だけのときは、終了コード 0 で終わります。'
    effects:
      - target: github
        kind: write
        what: 'blocked-by を付け、待つ側の Issue の本文を書き換え、そのボードの項目の列と Status の札を設定します。'
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリ、待つ側の Issue の blocked-by と本文、輪の探索、読み直した判定、ボードの項目を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - run: "pecot issue block example-org/my-repo/12 --by example-org/my-repo/11 --wait merge --reason \"The check script is on main.\""
        note: 'Issue 12 が、Issue 11 のマージを待つようにします。'
    default_notes:
      issue_ref: '短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    behaviors:
      - id: PW-ISSUE-BLOCK-01
        pattern: event
        statement: 'Issue の参照と `--by` を渡すと、blocked-by に前提を付けて `added` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-02
        pattern: event
        statement: '`--wait merge` と `--reason` を付けて打つと、本文の `Waits for merge` の節に前提と理由の行を足します'
      - id: PW-ISSUE-BLOCK-03
        pattern: event
        statement: '付いている前提を `--wait stack` で打つと、節の行を外して `updated` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-04
        pattern: event
        statement: '既に付いていて種類と理由が同じ前提を打つと、何も書き込まずに `unchanged` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-05
        pattern: event
        statement: '付いている前提の理由を変えて打つと、節の行の理由だけを置き換えて `updated` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-06
        pattern: event
        statement: '前提を書いた後に判定が変わると、待つ側の Issue の列と札を動かして `moved` と `set` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-07
        pattern: unwanted
        statement: 'もし待つ側の Issue に着手の跡があるなら、前提は付けて列と札を動かさず、判定との食い違いを `warning` の行で標準エラーに出します'
      - id: PW-ISSUE-BLOCK-08
        pattern: event
        statement: '`--dry-run` を付けて打つと、書き込みを送らずに `dry-run` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-09
        pattern: ubiquitous
        statement: '常に、本文の節の中の前提の行以外を書き換えません'
      - id: PW-ISSUE-BLOCK-10
        pattern: unwanted
        statement: 'もし前提を付けると輪になる、または `--by` が待つ側と同じ Issue なら、書き込みを送らずに終了コード 2 で終わります'
      - id: PW-ISSUE-BLOCK-11
        pattern: unwanted
        statement: 'もし輪になるかを確かめられないなら、前提を付けずに終了コード 1 で終わります'
      - id: PW-ISSUE-BLOCK-12
        pattern: unwanted
        statement: 'もし `--wait merge` で `--reason` が無いなら、要求を送らずに終了コード 2 で終わります'
      - id: PW-ISSUE-BLOCK-13
        pattern: unwanted
        statement: 'もし `--wait stack` で `--reason` を渡したなら、要求を送らずに終了コード 2 で終わります'
      - id: PW-ISSUE-BLOCK-14
        pattern: unwanted
        statement: 'もし待つ側の Issue が既に 50 件の前提を持つなら、前提を付けずに終了コード 1 で終わります'
      - id: PW-ISSUE-BLOCK-15
        pattern: unwanted
        statement: 'もし本文の `Waits for merge` の節が読めないなら、書き込みを送らずに終了コード 3 で終わります'
      - id: PW-ISSUE-BLOCK-16
        pattern: unwanted
        statement: 'もし読み直した前提と節が書いた内容と 2 回続けて合わないなら、列と札を動かさずに `warning` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-17
        pattern: unwanted
        statement: 'もし動かす先の値がボードに無いなら、`warning` の行と、`project init` で足し方を案内する `hint` の行を標準エラーに出します'
      - id: PW-ISSUE-BLOCK-18
        pattern: unwanted
        statement: 'もし GitHub Enterprise Server が Issue の依存関係に対応しないなら、終了コード 1 で終わります'
      - id: PW-ISSUE-BLOCK-19
        pattern: unwanted
        statement: 'もし Issue の参照の形が誤っているなら、終了コード 2 で終わります'
      - id: PW-ISSUE-BLOCK-20
        pattern: unwanted
        statement: 'もしリポジトリがプロジェクトに無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-BLOCK-21
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-ISSUE-BLOCK-22
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、または本文の書き込みに失敗したなら、終了コード 1 で終わります'
      - id: PW-ISSUE-BLOCK-23
        pattern: event
        statement: '`--by` でプロジェクトの外のリポジトリの Issue を指すと、プロジェクトに入っているかは待つ側のリポジトリだけ確かめ、前提を付けます'
      - id: PW-ISSUE-BLOCK-24
        pattern: event
        statement: 'MCP で呼ぶと、書いた列と札を `moves` で返し、書かなかったときは空の `moves` を返します。`dry_run` のときは `moves` を返しません'
      - id: PW-ISSUE-BLOCK-25
        pattern: unwanted
        statement: 'もし列を書けないなら、`warning` の行を出し、前提を付けたまま終了コード 0 で終わります。選択肢の ID が古くて書けないときは、ID を読み直す `project activate` の案内を添えます'
  PW-ISSUE-COMMENT:
    help:
      details:
        - "Has three modes: --prepare, a file argument and -m."
        - When more than one mode is given, --prepare wins over the file and the file wins over -m.
        - With --prepare, copies the template of the given kind to .pecot/tmp/output/ and prints its path.
        - With --prepare and --issue-ref, fills issue_ref in the front matter of the copy with the given reference.
        - With a file, posts its body as a comment on the Issue named by issue_ref in its front matter.
        - With -m, posts the given body as a comment on the Issue given by --issue-ref.
        - A file is validated against the template named in its front matter, and -m against the template given by -t.
        - A file that has comment_url updates that comment instead of posting a new one.
        - After posting from a file, writes the URL of the new comment back to comment_url in that file.
        - comment_url must point to a comment on the Issue named by issue_ref.
        - With a file, a repository that is not in the project gives a warning and the comment is still posted.
        - With --dry-run, validates the input and prints dry-run lines instead of posting the comment, writing comment_url back or copying the template.
      examples:
        - run: pecot issue comment --prepare -t plan -i example-org/my-repo/12
          note: Write a plan template for Issue 12 and print its path.
        - run: pecot issue comment .pecot/tmp/output/comment-plan-20260101-120000.md
          note: Post the comment in the file, or update it when the file has comment_url.
        - run: pecot issue comment .pecot/tmp/output/comment-plan-20260101-120000.md --dry-run
          note: Show the planned comment without posting it or touching the file.
      default_notes:
        issue_ref: No default. Required with -m; with --prepare, issue_ref in the copy stays empty when omitted; with a file, issue_ref comes from the front matter. The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
        template: No default. Required with --prepare and -m; with a file, the template comes from the front matter.
    summary: Issue にコメントを投稿します。
    arguments:
      file: 'フロントマター付きの Markdown ファイルのパスです。'
      issue_ref: 'Issue の参照です。`owner/repo/123` の形で渡します。'
      message: 'コメントの本文です。'
      prepare: 'テンプレートを作業用のディレクトリにコピーするかどうかです。'
      template: 'テンプレートの種類です。`plan`・`merge-diff`・`review-findings`・`review-resolution`・`precede-notify` のどれかを渡します。'
      dry_run: '何も書かずに、する予定だけを出すかどうかです。'
    constraints:
      - requires: {message: [issue_ref, template]}
      - requires: {prepare: [template]}
    details:
      - 'モードは、`--prepare`・ファイルの引数・`-m` の 3 つです。'
      - '複数のモードを渡すと、`--prepare` がファイルより優先され、ファイルが `-m` より優先されます。'
      - '`--prepare` では、渡した種類のテンプレートを `.pecot/tmp/output/` にコピーし、そのパスを出します。'
      - '`--prepare` に `--issue-ref` を付けると、コピーのフロントマターの `issue_ref` に、渡した参照を入れます。'
      - 'ファイルでは、フロントマターの `issue_ref` の Issue に、ファイルの本文をコメントとして投稿します。'
      - '`-m` では、渡した本文を `--issue-ref` の Issue にコメントとして投稿します。'
      - 'ファイルはフロントマターに書いたテンプレートで、`-m` は `-t` で渡したテンプレートで、本文を検証します。'
      - '`comment_url` のあるファイルは、新しいコメントを投稿せず、そのコメントを書き換えます。'
      - 'ファイルから投稿した後、新しいコメントの URL をそのファイルの `comment_url` に書き戻します。'
      - '`comment_url` は、`issue_ref` の Issue のコメントを指していなければなりません。'
      - 'ファイルでは、リポジトリがプロジェクトに無いと `warning` を出しますが、コメントは投稿します。'
      - '`--dry-run` を付けると、入力を検証し、コメントの投稿・`comment_url` の書き戻し・テンプレートのコピーの代わりに、`dry-run` の行を出します。'
    stdin: none
    output:
      format: text
      description: '`--prepare` のときは、テンプレートのコピーのパスです。それ以外では、投稿したか書き換えたコメントの URL です。'
    mcp_output:
      fields:
        issue: 'コメントした Issue です。`owner/repo/N` の形です。`prepare` のときは入りません。'
        commentUrl: '作ったか更新したコメントの URL です。`dry_run` のとき、`prepare` のとき、GitHub が URL を返さなかったときは入りません。'
        change: 'コメントをどう書いたかです。`created`（新しく作った）と `updated`（更新した）の 2 値です。`prepare` のときは入りません。`dry_run` のときは、書く予定の側です。'
        file: '`prepare` のときは、コピーしたテンプレートのファイルの絶対パスです。ファイルから新しく投稿して `comment_url` を書き戻したときは、そのファイルの絶対パスです。書き戻せなかったとき、`comment_url` を持つファイルで更新したとき、`dry_run` のとき、`message` で投稿したときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。投稿もファイルの書き込みもしていません。'
    diagnostics: '標準エラーに、コメントの結果の行（`created` か `updated`）を出します。ファイルのリポジトリがプロジェクトに無いときと、`comment_url` を書き戻せないときは、`warning` の行を出します。本文がテンプレートに合わないときは、`error` の行を 1 つ出します。その 1 行目はテンプレートのパスです。続けて、字下げした行で次の違反を出します。足りない節、見出しの要約の規則の違反、使えない記法、折りたたみの規則の違反、テンプレートに無い見出しです。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: invalid-input
        code: 1
        when: 'モードの引数がありません。`--prepare` か `-m` に `-t` が無いとき、`-m` に `--issue-ref` が無いときも含みます。'
      - kind: content-invalid
        code: 1
        when: 'フロントマターを読めないか、フロントマターに `template` がありません。'
      - kind: invalid-input
        code: 1
        when: '`comment_url` の形が誤っているか、別のホストか別の Issue を指しています。'
      - kind: other
        code: 1
        when: 'テンプレートが見つかりません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - kind: content-invalid
        code: 3
        when: '本文がテンプレートに合いません。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '本文がテンプレートに合わないときは、何も投稿しません。コメントを投稿した後で `comment_url` を書き戻せないときは、コメントは GitHub に残り、ファイルは元のままです。`--prepare` が書いたテンプレートのコピーは、`.pecot/tmp/output/` に残ります。'
    effects:
      - target: github
        kind: write
        what: 'Issue にコメントを投稿します。または、`comment_url` のコメントを書き換えます。`--dry-run` のときは書きません。'
      - target: github
        kind: read
        what: 'ファイルのときに、リポジトリがプロジェクトにつながっているかどうかを確かめます。'
      - target: file
        kind: write
        what: 'テンプレートのコピーを `.pecot/tmp/output/` の下に書きます。投稿したファイルには、`comment_url` を書き戻します。`--dry-run` のときは書きません。'
      - target: file
        kind: read
        what: 'コメントのファイル、テンプレート、アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: false
