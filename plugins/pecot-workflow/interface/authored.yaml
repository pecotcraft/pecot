      - id: PW-RELEASE-MERGE-22
        pattern: unwanted
        statement: もし PR の base ブランチが release_branch でないなら、終了コード 1 で終わる
      - id: PW-RELEASE-MERGE-23
        pattern: unwanted
        statement: もしマージで GitHub API がエラーを返したなら、終了コード 1 で終わる
      - id: PW-RELEASE-MERGE-24
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、the repository is ambiguous の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-25
        pattern: unwanted
        statement: もし --repo を省いて git の外で打ったなら、終了コード 1 で終わる
  PW-RELEASE-PREFLIGHT:
    constraints: []
    details:
      - Checks the open Dependabot, code scanning and secret scanning alerts of the repository.
      - All three kinds are always checked, even when an earlier one fails.
      - An open Dependabot alert is a warning and does not stop the command.
      - "The Dependabot warning lists each alert as #<number> with its package and severity, and the URL of the alert page."
      - An open code scanning or secret scanning alert fails the command.
      - A repository with the feature disabled passes with a skipped line.
      - A state of code scanning or secret scanning that cannot be determined, such as a missing permission, fails the command.
      - For a repository whose release type is nx, only the alerts are checked, and the version argument and --package are rejected.
      - Otherwise checks that the CHANGELOG exists, that the version is in X.Y.Z form, that the tag exists neither locally nor on origin, and that origin/<develop_branch> has commits that origin/<release_branch> does not have.
      - "Without a version argument, the version is the first ## [X.Y.Z] heading of the CHANGELOG, and the Unreleased heading is skipped."
      - The CHANGELOG is the changelog_file of the repository in the config file.
      - Without changelog_file, the CHANGELOG is CHANGELOG.md and then AIST-CHANGELOG.md at the git root, and with --package, the changelog of that package.
      - The tag is v<version>.
      - With --package, the tag is <package>-v<version>.
      - A repository with packages configured needs --package.
      - A repository without packages does not accept --package.
      - The repository is taken from the global pecot --repo, and without it from the origin remote.
      - The command needs the working directory to be inside a git repository.
      - A mismatch between --repo and the current git remote is a warning, and --repo is used.
    stdin: none
    output:
      format: text
      description: The version line, the tag line, a blank line and the release notes of the version. Nothing is written to stdout for a repository whose release type is nx.
    diagnostics: Per alert kind, a count line, a skipped line or a warning line, and an error line for code scanning and secret scanning. A count line for the commits to release. A warning line when --repo differs from the git remote. An error line on a failure, except when the version is not in X.Y.Z form, where a traceback is printed.
    environment: []
    exit_status:
      - code: 0
        when: Every check passed, including the case where only Dependabot alerts are open or could not be read.
      - code: 1
        when: The root directory of the git repository cannot be found, there is no active project, the --package rules are broken, an nx repository is given a version or --package, an alert check fails, develop_branch or release_branch is not set, the CHANGELOG or the version in it is not found, the tag already exists, there is nothing to release, a git command fails, the version is not in X.Y.Z form (a traceback is printed), the origin remote cannot be read without --repo, the repository is ambiguous outside git without --repo, or the project root cannot be determined.
      - code: 2
        when: A command line error occurs, such as an unknown option.
    on_error: Nothing is created on GitHub or in the working tree. git fetch may already have updated origin/<release_branch> and origin/<develop_branch>.
    effects:
      - target: github
        kind: read
        what: Reads the open Dependabot, code scanning and secret scanning alerts of the repository.
      - target: git
        kind: read
        what: Reads the git root, the origin remote URL, the local tags, the remote tags with git ls-remote and the commit count between the two branches.
      - target: git
        kind: write
        what: Fetches the release branch and the develop branch from origin, which updates the remote-tracking refs.
      - target: file
        kind: read
        what: Reads the active config file and the CHANGELOG.
    prerequisites:
      - An active project exists (pecot project activate).
      - The working directory is inside a git repository whose origin remote has the develop and release branches.
      - The develop_branch and release_branch of the repository are set in the config file (pecot project set-repo), unless the release type is nx.
      - A GitHub token is available for the host, with permission to read the alerts.
    idempotent: true
    examples:
      - run: pecot release preflight
        note: Check the release with the version detected from the CHANGELOG.
      - run: pecot release preflight 0.6.1
        note: Check the release of a given version.
      - run: pecot release preflight 0.6.1 --package pecot-workflow
        note: Check the release of one package in a monorepo.
    default_notes:
      version: "The first ## [X.Y.Z] heading of the CHANGELOG; the Unreleased heading is skipped."
      package: None; required when the repository has packages configured in the config file.
    behaviors:
      - id: PW-RELEASE-PREFLIGHT-01
        pattern: event
        statement: 版を省いて打つと、CHANGELOG の最初の版を対象にチェックする
      - id: PW-RELEASE-PREFLIGHT-02
        pattern: event
        statement: 版を渡して打つと、その版を対象にチェックする
      - id: PW-RELEASE-PREFLIGHT-03
        pattern: event
        statement: --package を付けて打つと、パッケージ名を接頭辞にしたタグ名でチェックする
      - id: PW-RELEASE-PREFLIGHT-04
        pattern: event
        statement: 打つと、Dependabot・code scanning・secret scanning の open の alert を調べる
      - id: PW-RELEASE-PREFLIGHT-05
        pattern: event
        statement: 打つと、alert の結果の行を標準エラーに出す
      - id: PW-RELEASE-PREFLIGHT-06
        pattern: event
        statement: open の Dependabot alert があると、件数と最も重い severity を添えた warning の行を標準エラーに出す
      - id: PW-RELEASE-PREFLIGHT-07
        pattern: event
        statement: release_type が nx のリポジトリに打つと、alert だけを調べる
      - id: PW-RELEASE-PREFLIGHT-08
        pattern: event
        statement: --repo が今の git remote のリポジトリと食い違うと、warning の行を標準エラーに出す
      - id: PW-RELEASE-PREFLIGHT-09
        pattern: event
        statement: チェックが通ると、version・tag の行とリリースノートを標準出力に出す
      - id: PW-RELEASE-PREFLIGHT-10
