        what: '`worktree-config.json` と `.worktreeignore` を作ります。`.pecot/config` のディレクトリが無ければ、それも作ります。`--dry-run` のときは書きません。'
    prerequisites:
      - 'コマンドは、devcontainer の中で動かします。'
    idempotent: false
    examples:
      - run: pecot worktree init -D .
        note: '今のディレクトリのリポジトリに、worktree の設定ファイルを書きます。'
