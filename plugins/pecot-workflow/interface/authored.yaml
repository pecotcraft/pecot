        pattern: unwanted
        statement: もし Tracker の作成かボードへの追加に失敗したなら、終了コード 1 で終わる
  PW-SESSION-RESTORE:
    constraints: []
    details:
      - Restores the work target that was lost from the session, which is the Issue the branch is working on.
      - Writes .pecot-active, holding owner/repo/N, under .pecot/state/ of the project root.
      - Writes .pecot-session-title, holding the session name, under .pecot/state/ of the project root.
      - An existing work target is overwritten.
      - Creates the work directory .pecot/work/N/ under the project root.
      - When the work directory cannot be created, the command goes on without it.
      - "The session name is #<number> followed by the Issue title, cut to 40 characters."
      - A leading [Task], [Bug] or [Epic] is removed from the Issue title.
      - "Without a title, the session name is #<number>."
      - The Issue title is read from GitHub.
      - When the active config file is missing or the Issue cannot be read, the command goes on with an empty title and no warning.
      - With --issue, the branch and the origin remote are not read.
      - The reference of --issue must be the full form owner/repo/N.
      - Without --issue, the Issue number is the number at the end of the current branch name after the last slash.
      - Without --issue, the repository is the origin remote, and both are read in --directory.
      - The project root, and so the files above, are resolved from the working directory of the command, not from --directory.
    stdin: none
    output:
      format: none
    diagnostics: A set line on stderr for the recorded work target, with the work directory when it was created. An error line on a failure, except that a broken active config file prints a traceback. When the Issue number cannot be inferred from the branch name, the error line is followed by a hint to pass --issue.
    environment: []
    exit_status:
      - code: 0
        when: The work target was recorded.
      - code: 1
        when: Without --issue, the branch name cannot be read, the Issue number cannot be inferred from the branch name or the origin repository cannot be read; the work target cannot be written, including when the project root cannot be determined; or the active config file is broken (a traceback is printed).
      - code: 2
        when: --issue is not in owner/repo/N form, --directory is missing or is not an existing directory, or another command line error occurs.
    on_error: When writing .pecot-session-title fails after .pecot-active was written, .pecot-active stays written.
    effects:
      - target: file
        kind: write
        what: Writes .pecot-active and .pecot-session-title under .pecot/state/, and creates .pecot/work/N/.
      - target: file
        kind: read
        what: Reads the active config file.
      - target: git
        kind: read
        what: Reads the current branch and the origin remote URL of the directory.
      - target: github
        kind: read
        what: Reads the title of the Issue.
    prerequisites:
      - The directory is a git repository whose branch name ends with the Issue number, unless --issue is given.
    idempotent: true
    examples:
      - run: pecot session restore -D .
        note: Restore the work target from the branch name.
      - run: pecot session restore --issue example-org/my-repo/123 -D .
        note: Restore the work target of a given Issue.
    default_notes:
      issue: Inferred from the end of the current branch name and the origin remote of --directory.
    behaviors:
      - id: PW-SESSION-RESTORE-01
        pattern: event
        statement: --issue に owner/repo/N を渡して打つと、その Issue を作業対象として記録する
      - id: PW-SESSION-RESTORE-02
        pattern: event
        statement: --issue を省いて打つと、ブランチ名の末尾の番号と origin のリポジトリから作業対象の Issue を決めて記録する
      - id: PW-SESSION-RESTORE-03
        pattern: event
        statement: 作業対象を記録すると、.pecot-active に owner/repo/N を書く
      - id: PW-SESSION-RESTORE-04
