      - id: PW-BRANCH-DELETE-18
        pattern: unwanted
        statement: 'もしセッションのディレクトリが git の外か remote の無い git のリポジトリなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-BRANCH-DELETE-19
