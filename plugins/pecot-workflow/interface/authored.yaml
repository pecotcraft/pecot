        statement: '設定ファイルを作ると、そのプロジェクトをアクティブにします'
      - id: PW-PROJECT-CREATE-05
        pattern: event
        statement: 'プロジェクトを作ると、結果の `number` と `url` に、作ったプロジェクトの番号と URL を入れます'
      - id: PW-PROJECT-CREATE-06
        pattern: unwanted
        statement: 'もし同じタイトルのプロジェクトが既にあるなら、`kind` が `already-exists` の失敗を返します'
      - id: PW-PROJECT-CREATE-07
        pattern: unwanted
        statement: 'もし所有者が見つからないなら、`kind` が `github-not-found` の失敗を返します'
      - id: PW-PROJECT-CREATE-08
        pattern: unwanted
        statement: 'もしプロジェクトの作成で GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-PROJECT-CREATE-09
        pattern: unwanted
        statement: 'もし作ったプロジェクトが pecot-workflow に準拠しないなら、`kind` が `not-initialized` の失敗を返します'
      - id: PW-PROJECT-CREATE-10
        pattern: unwanted
        statement: 'もし Status に Needs Attention を足せなかったなら、`warnings` に入れて設定ファイルを作ります'
      - id: PW-PROJECT-CREATE-11
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、プロジェクトを作らず、作る予定を結果に入れ、`dryRun` を `true` にして成功を返します'
  PW-PROJECT-GET:
    help:
      details:
        - Prints the Epic aggregation repository stored in the active config file, or "none" when it is not set.
        - The key is aggregation_repo, the only key of the project config for now; any other key is a usage error.
      examples:
        - run: pecot project get aggregation_repo
          note: Print the aggregation repository.
      default_notes: {}
    summary: 設定のキーの値を出します。キーは Epic を集めるリポジトリ（`aggregation_repo`）です。
    arguments:
      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。'
    constraints: []
    details:
      - 'アクティブな設定ファイルに保存してある、Epic を集めるリポジトリを `value` に入れて返します。未設定のときは、`value` を入れません。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、`kind` が `invalid-input` の失敗を返します。'
    stdin: none
    output:
      format: text
      description: 'Epic を集めるリポジトリを `owner/repo` の形で書いた 1 行か、`none` です。'
    mcp_output:
      fields:
        key: '読んだ設定のキーです。今は `aggregation_repo` だけです。'
        value: 'キーの値です。未設定のときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        code: 1
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 2
        when: '`key` がありません。`key` が `aggregation_repo` でないときと、知らない引数などほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          key: aggregation_repo
        note: 'Epic を集めるリポジトリを返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-GET-01
        pattern: event
        statement: '値を設定していると、その値を結果の `value` に入れます'
      - id: PW-PROJECT-GET-02
        pattern: event
        statement: '未設定だと、結果に `value` を入れずに成功を返します'
      - id: PW-PROJECT-GET-03
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-PROJECT-GET-04
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
  PW-PROJECT-INIT:
    help:
      details:
        - Adds the pecot-workflow-<suffix>, pecot-priority and pecot-size fields to an existing project.
        - A field that already exists is skipped.
        - The other fields are still created.
        - Adds the Blocked option to a pecot-workflow-<suffix> field that already exists, placed right after Backlog (right before Ready when there is no Backlog, at the end when there is neither).
        - Adds the Needs Attention option at the end of the Status field. When the project has no Status field, nothing is added.
        - Names are compared without regard to case, and an option that already exists is left as it is.
        - The whole option list is sent again with the existing options keeping their id, name, color and description, so the values on the cards stay.
        - When an option cannot be added, a warning line is written and the command continues; the option is not sent again without its id.
        - Before writing anything, checks that an existing pecot-workflow-<suffix> field has the six required options (Backlog, Pending, Ready, Active, In Review, Archived); if one is missing, writes nothing and stops.
        - After that, regenerates the config file from GitHub for the --suffix field and makes the project active, unless a config file exists and its content already equals the one generated from the board.
        - With --dry-run, reads the project and prints dry-run lines for creating the fields, adding the options, writing the config file and switching the active project, and writes nothing.
      examples:
        - run: pecot project init example-org "Example Project" --suffix example
          note: Add the pecot-workflow fields to an existing project, and the Blocked and Needs Attention options to the fields that already exist.
        - run: pecot project init example-org "Example Project" --suffix example --dry-run
          note: Show what would be created and written without changing anything.
      default_notes: {}
    summary: 既にあるプロジェクトに pecot-workflow のフィールドを足します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。
    arguments:
      host: 'GitHub のホストです。'
      name: 'プロジェクトの題です。'
      owner: 'プロジェクトの所有者です。'
      suffix: 'ワークフローのフィールドに付ける接尾辞です。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - '既にあるプロジェクトに、`pecot-workflow-<suffix>`・`pecot-priority`・`pecot-size` のフィールドを足します。'
      - '既にあるフィールドは飛ばします。'
      - 'そのときも、ほかのフィールドは作ります。'
      - '既にある `pecot-workflow-<suffix>` のフィールドには、Blocked の選択肢を Backlog の直後に足します。Backlog が無ければ Ready の直前、どちらも無ければ末尾に足します。'
      - 'Status のフィールドの末尾に、Needs Attention の選択肢を足します。プロジェクトに Status のフィールドが無いときは、何も足しません。'
      - '名前は、大文字と小文字を区別せずに比べます。既にある選択肢は、そのまま残します。'
      - '選択肢の一覧は、全体を送り直します。既にある選択肢は id・name・color・description を保つので、カードの値は残ります。'
      - '選択肢を足せないときは、`warnings` に入れて続けます。その選択肢を、id なしで送り直すことはありません。'
      - '何かを書く前に、既にある `pecot-workflow-<suffix>` のフィールドが必須の 6 つの選択肢を持つことを確かめます。6 つは Backlog・Pending・Ready・Active・In Review・Archived です。1 つでも欠けていれば、何も書かずに失敗を返します。'
      - 'その後、`suffix` のフィールドの設定ファイルを GitHub から作り直し、プロジェクトをアクティブにします。設定ファイルがあり、内容がボードから作るものと既に同じときは行いません。'
      - '`dry_run` を付けると、プロジェクトを読み、作る予定のフィールドと足す予定の選択肢を `fields` に入れて、何も書きません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        fields: 'プロジェクトのフィールドの配列です。workflow・priority・size のフィールドと、選択肢を調べたときの Status フィールドを含みます。要素は `name`・`change`・`addedOptions` を持ちます。`change` は `create`（作った）・`update`（選択肢を足した）・`unchanged`（何もしない）・`skip`（フィールドが見つからない）のどれかです。`addedOptions` は足した選択肢の名前の配列で、無ければ空です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も作らず、何も変えていません。'
    diagnostics: '標準エラーに、フィールドごとの結果の行（`created` か `skipped`）と、選択肢ごとの結果の行（`added` か `unchanged`）を出します。Status のフィールドが見つからないときは、`skipped` の行を出します。選択肢を足せないときは、`warning` の行を出します。設定ファイルを書いたときは、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。'
    environment: []
    exit_status:
      - kind: project-not-found
        code: 1
        when: 'プロジェクトが見つかりません。'
      - kind: not-initialized
        code: 1
        when: 'プロジェクトのフィールドを読めません。既にある `pecot-workflow-<suffix>` のフィールドに必須の選択肢が無いときも含みます。'
      - kind: invalid-input
        code: 2
        when: '必須の `owner`・`name`・`suffix` のどれかが無いか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '失敗した手順より前に作ったフィールドと足した選択肢は、プロジェクトに残ります。この失敗の結果にも、そこまでの `fields` が入ります。選択肢を足せなかったときは、`warnings` で知らせて成功を返します。'
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクト、対象のプロジェクトのフィールド、つながっているリポジトリを読みます。'
      - target: github
        kind: write
        what: 'プロジェクトに足りないフィールドを作ります。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。`dry_run` のときは書きません。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下に設定ファイルを書き、アクティブなプロジェクトを設定します。既にある設定ファイルが、ボードから作るものと同じときは書きません。`dry_run` のときは書きません。'
    prerequisites:
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - arguments:
          owner: example-org
          name: Example Project
          suffix: example
        note: '既にあるプロジェクトに pecot-workflow のフィールドを足します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。'
      - arguments:
          owner: example-org
          name: Example Project
          suffix: example
          dry_run: true
        note: 'フィールドと設定ファイルは書かず、する予定を返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-INIT-01
        pattern: event
        statement: 'フィールドの無いプロジェクトを渡すと、pecot-workflow の 3 つのフィールドを作ります'
      - id: PW-PROJECT-INIT-02
        pattern: event
        statement: 'フィールドを作ると、`fields` のそのフィールドの `change` を `create` にします'
      - id: PW-PROJECT-INIT-03
        pattern: event
        statement: '既にあるフィールドがあると、そのフィールドは作らずに、`fields` のその `change` を `unchanged` にします'
      - id: PW-PROJECT-INIT-04
        pattern: unwanted
        statement: 'もし指定したタイトルのプロジェクトが無いなら、`kind` が `project-not-found` の失敗を返します'
      - id: PW-PROJECT-INIT-05
        pattern: unwanted
        statement: 'もしフィールドの作成で GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-PROJECT-INIT-06
        pattern: event
        statement: '既にあるフィールドに Blocked か Needs Attention が無いと、その選択肢を足します。`fields` のその `change` は `update` で、`addedOptions` に名前が入ります'
      - id: PW-PROJECT-INIT-07
        pattern: event
        statement: '選択肢を足すと、既存の選択肢を `id`・`name`・`color`・`description` のまま送り、Blocked は Backlog の直後、Needs Attention は末尾に置きます'
      - id: PW-PROJECT-INIT-08
        pattern: event
        statement: '設定ファイルが無いか、ボードから作る内容と違うと、設定ファイルを同期して Blocked と Needs Attention の id を書きます'
      - id: PW-PROJECT-INIT-09
        pattern: unwanted
        statement: 'もし足す選択肢が既にあるなら、書き込まずに、`fields` のそのフィールドの `change` を `unchanged` にします'
      - id: PW-PROJECT-INIT-10
        pattern: unwanted
        statement: 'もし Status のフィールドが無いなら、何も足さずに、`fields` の Status の `change` を `skip` にします'
      - id: PW-PROJECT-INIT-11
        pattern: unwanted
        statement: 'もし選択肢を足せなかったなら、`warnings` に入れて続け、成功を返します'
      - id: PW-PROJECT-INIT-12
        pattern: unwanted
        statement: 'もし設定ファイルがあり、内容がボードから作る内容と同じなら、設定ファイルとアクティブのどちらも書き換えません'
      - id: PW-PROJECT-INIT-13
        pattern: unwanted
        statement: 'もし既にある進行の欄に必須の値が欠けているなら、何も書かずに、欠けた値を `detail` に入れて `kind` が `not-initialized` の失敗を返します'
      - id: PW-PROJECT-INIT-14
        pattern: event
        statement: 'suffix の違う進行の欄が複数あるボードを渡すと、`suffix` の欄で設定ファイルを同期します'
      - id: PW-PROJECT-INIT-15
        pattern: unwanted
        statement: 'もし設定ファイルの同期で GitHub API がエラーを返したなら、`could not sync project config` で始まる `detail` を入れて失敗を返します'
      - id: PW-PROJECT-INIT-16
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、フィールドを作らず設定ファイルも書かず、する予定を `fields` に入れ、`dryRun` を `true` にして成功を返します'
      - id: PW-PROJECT-INIT-17
        pattern: event
        statement: '`dry_run` で、作るフィールドか足す選択肢があると、設定ファイルの書き込みの予定を調べません'
  PW-PROJECT-LINK:
    help:
      details:
        - Links the repository to the GitHub project and adds it to the config file of the active project.
        - The config file is written only after the link succeeded.
        - For a repository already registered, updates only the settings given on the command line.
        - Giving --package replaces the packages of a registered repository and also clears its changelog_file, even when --changelog-file is not given.
        - Giving --clear-packages removes the packages of a registered repository.
        - The repository owner must match the project owner.
        - With --dry-run, reads whether the repository is linked and prints dry-run lines for linking it and writing the config file, and writes nothing.
      examples:
        - run: pecot project link example-org/my-repo
          note: Register a repository.
        - run: pecot project link example-org/my-repo --package pecot:plugins/pecot-workflow/CHANGELOG.md
          note: Register a monorepo package.
        - run: pecot project link example-org/my-repo --dry-run
          note: Show the planned link without writing it.
      default_notes:
        release_type: Inferred from the packages when omitted (multi with packages, single without).
    summary: プロジェクトの設定に、リポジトリを足すか更新します。
    arguments:
      changelog_file: 'CHANGELOG のファイル名です。'
      clear_packages: '既にある packages の設定を消すかどうかです。消した後の CHANGELOG は、`changelog_file` の値か、既定の `CHANGELOG.md` に戻ります。'
      develop_branch: '開発ブランチの名前です。'
      repo: 'リポジトリの名前です。`owner/repo` の形で渡します。'
      package: 'monorepo のパッケージです。`NAME:PATH` の形で登録します。配列で複数渡せます。要素の例は `pecot:plugins/pecot-workflow/CHANGELOG.md` です。'
      release_branch: 'リリースブランチの名前です。'
      release_type: 'リリースの方法の宣言です。w-release スキルが、この値で手順を選びます。`single`（CHANGELOG が 1 つ）・`multi`（packages）・`nx`（Nx Release）のどれかを渡します。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints:
      - conflicts: [package, changelog_file]
      - conflicts: [package, clear_packages]
    details:
      - 'リポジトリを GitHub のプロジェクトにつなぎ、アクティブなプロジェクトの設定ファイルに足します。'
      - '設定ファイルを書くのは、つなぐのに成功した後だけです。'
      - '登録済みのリポジトリでは、渡した引数の設定だけを更新します。'
      - '`package` を渡すと、登録済みのリポジトリの packages を置き換えます。`changelog_file` を渡していなくても、設定の `changelog_file` を消します。'
      - '`clear_packages` を渡すと、登録済みのリポジトリの packages を消します。'
      - 'リポジトリの所有者は、プロジェクトの所有者と一致していなければなりません。'
      - '`dry_run` を付けると、リポジトリがつながっているかを読み、設定がどうなる予定かを `change` に入れて、何も書きません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        repository: '設定に足した（変えた）リポジトリです。`owner/repo` の形です。'
        projectNumber: 'アクティブなプロジェクトの番号です。'
        change: '設定がどうなったかです。`create`（リポジトリを足した）か `update`（項目を変えた）です。'
        configPath: 'プロジェクトの設定ファイルのパスです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、プロジェクトへのつなぎの結果の行（`added`、既につながっていれば `unchanged`）を出します。設定ファイルの結果の行（`added` か `updated`）も出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        code: 1
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 1
        when: 'リポジトリが `owner/repo` の形でないか、所有者がプロジェクトの所有者と違います。'
      - kind: invalid-input
        code: 1
        when: '`package` を `changelog_file` か `clear_packages` と一緒に渡したか、`package` の形が誤っています。packages を持つリポジトリに `changelog_file` を渡したときと、`release_type` が `single`・`multi`・`nx` のどれでもないときも含みます。'
      - kind: github-api
        code: 1
        when: 'リポジトリとプロジェクトをつなぐ処理が失敗しました。'
      - kind: invalid-input
        code: 2
        when: '`repo` が無いか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'リポジトリをつなぐのに失敗したときは、設定ファイルを書きません。'
    effects:
      - target: github
        kind: write
        what: '新しいリポジトリをプロジェクトにつなぎます。`dry_run` のときは書きません。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'アクティブな設定ファイルに、リポジトリを足すか更新します。`dry_run` のときは書きません。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          repo: example-org/my-repo
        note: 'リポジトリを登録します。'
      - arguments:
          repo: example-org/my-repo
          package:
            - pecot:plugins/pecot-workflow/CHANGELOG.md
        note: 'monorepo のパッケージを登録します。'
      - arguments:
          repo: example-org/my-repo
          dry_run: true
        note: 'リポジトリをつながず、設定ファイルも書かずに、する予定を返します。'
    default_notes:
      release_type: '省くと、packages から推定します。packages があれば `multi`、無ければ `single` です。'
    behaviors:
      - id: PW-PROJECT-LINK-01
        pattern: event
        statement: '未登録のリポジトリを渡すと、プロジェクトにリンクします'
      - id: PW-PROJECT-LINK-02
        pattern: event
        statement: 'リンクに成功すると、設定ファイルにリポジトリを足します'
      - id: PW-PROJECT-LINK-03
        pattern: event
        statement: '登録済みのリポジトリを渡すと、渡した引数の値だけを更新します'
      - id: PW-PROJECT-LINK-04
        pattern: event
        statement: '登録済みのリポジトリに `package` を渡すと、`packages` を置き換えます'
      - id: PW-PROJECT-LINK-05
        pattern: event
        statement: '登録済みのリポジトリに `package` を渡すと、設定の `changelog_file` を消します'
      - id: PW-PROJECT-LINK-06
        pattern: event
        statement: '登録済みのリポジトリに `clear_packages` を付けると、`packages` を消します'
      - id: PW-PROJECT-LINK-07
        pattern: unwanted
        statement: 'もしリンクに失敗したなら、設定ファイルを書き換えません'
      - id: PW-PROJECT-LINK-08
        pattern: unwanted
        statement: 'もしリンクに失敗したなら、`kind` が `github-api` の失敗を返します'
      - id: PW-PROJECT-LINK-09
        pattern: unwanted
        statement: 'もし `package` と `changelog_file` を一緒に渡したなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-10
        pattern: unwanted
        statement: 'もし `package` と `clear_packages` を一緒に渡したなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-11
        pattern: unwanted
        statement: 'もし `package` の要素が `NAME:PATH` の形でないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-12
        pattern: unwanted
        statement: 'もし `package` の要素の `NAME` が重なるなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-13
        pattern: unwanted
        statement: 'もしリポジトリの所有者がプロジェクトの所有者と違うなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-14
        pattern: unwanted
        statement: 'もしリポジトリが `owner/repo` の形でないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-15
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-PROJECT-LINK-16
        pattern: unwanted
        statement: 'もし `release_type` が `single`・`multi`・`nx` のどれでもないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-17
        pattern: unwanted
        statement: 'もし `packages` を持つリポジトリに `changelog_file` を渡したなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-LINK-18
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、リポジトリをつながず設定ファイルも書かず、する予定を結果に入れ、`dryRun` を `true` にして成功を返します'
  PW-PROJECT-LIST:
    help:
      details:
        - Lists the config files under .pecot/config/projects/ in file name order.
        - Marks the active project with [ACTIVE].
      examples:
        - run: pecot project list
          note: List the config files and the active project.
      default_notes: {}
    summary: 使えるプロジェクトを一覧します。
    constraints: []
    details:
      - '`.pecot/config/projects/` の下の設定ファイルを、ファイル名の順で `projects` に並べて返します。'
      - 'アクティブなプロジェクトの要素は、`active` を `true` にします。'
    stdin: none
    output:
      format: text
      description: '見出しの行に続けて、設定ファイルの名前を 1 行ずつ出します。設定ファイルが無ければ、`none` を出します。'
    mcp_output:
      fields:
        projects: 'projects ディレクトリにあるプロジェクトの設定の配列です。1 つも無ければ空です。要素は `name`（`.json` を除いたファイル名）と `active`（アクティブな設定か）を持ちます。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        code: 2
        when: '知らない引数など、引数の誤りがあります。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: '`.pecot/config/projects/` の下の設定ファイルと、アクティブなプロジェクトの設定を読みます。'
    prerequisites: []
    idempotent: true
    examples:
      - arguments: {}
        note: '設定ファイルとアクティブなプロジェクトを返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-LIST-01
        pattern: event
        statement: '設定ファイルがあると、ファイル名の順で `projects` に並べます'
      - id: PW-PROJECT-LIST-02
        pattern: event
        statement: 'アクティブなプロジェクトの設定ファイルがあると、その要素の `active` を `true` にします'
      - id: PW-PROJECT-LIST-03
        pattern: event
        statement: '設定ファイルが 1 つも無いと、`projects` を空の配列にして返します'
  PW-PROJECT-SEARCH:
    help:
      details:
        - Lists the GitHub Projects V2 projects of a user or an organization.
        - A title longer than 38 characters is cut to 35 characters followed by "...".
        - Marks an initialized project (one with a pecot-workflow field) with [INITIALIZED] and the active project with [ACTIVE].
        - Reads the fields of each project to tell whether it is initialized. A project whose fields cannot be read gives a warning and no [INITIALIZED] mark.
      examples:
        - run: pecot project search example-org
          note: List the projects of an organization.
      default_notes: {}
    summary: GitHub API でプロジェクトを探し、初期化済みのものとアクティブなものを示します。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
    constraints: []
    details:
      - 'ユーザーか organization の、GitHub Projects V2 のプロジェクトを `projects` に入れて返します。'
      - '`projects` の `title` は、GitHub が返した題のままです。CLI の表では、38 文字を超える題を 35 文字に切り詰めて `...` を付けます。'
      - '初期化済みのプロジェクト（pecot-workflow のフィールドを持つもの）は `initialized` を、アクティブなプロジェクトは `active` を `true` にします。CLI の表では、`[INITIALIZED]` と `[ACTIVE]` を付けます。'
      - '初期化済みかどうかは、プロジェクトごとにフィールドを読んで決めます。フィールドを読めないプロジェクトは、`warnings` に入れ、`initialized` を入れません。'
    stdin: none
    output:
      format: text
      description: '見出しの行、空行、列の見出しの行、ハイフン 80 個の区切りの行を出します。続けて、プロジェクトごとに番号・題・URL の行を 1 つ出します。初期化済みのプロジェクトの行の末尾には `[INITIALIZED]` を、アクティブなプロジェクトの行の末尾には `[ACTIVE]` を付けます。'
    mcp_output:
      fields:
        owner: '検索したプロジェクトのオーナーです。'
        host: '検索した GitHub のホストです。'
        projects: 'オーナーのプロジェクトの配列です。要素は `number`・`title`・`url` を持ちます。GitHub が返さなかった項目は入りません。`initialized` は初期化済みか、`active` はアクティブなプロジェクトかです。どちらも番号の無い要素には入りません。`initialized` は、フィールドを読めなかった要素にも入りません。'
    diagnostics: 'フィールドを読めないプロジェクトごとに、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: project-not-found
        code: 1
        when: '所有者にプロジェクトがありません。'
      - kind: invalid-input
        code: 2
        when: '`owner` が無いか、ほかの引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクトと、プロジェクトごとのフィールドを読みます。'
      - target: file
        kind: read
        what: 'アクティブなプロジェクトの設定を読みます。'
    prerequisites:
      - 'ホストの GitHub トークンが要ります。'
    idempotent: true
    examples:
      - arguments:
          owner: example-org
        note: 'organization のプロジェクトを返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SEARCH-01
        pattern: event
        statement: 'プロジェクトを持つ所有者を渡すと、プロジェクトごとの番号・タイトル・URL を `projects` に入れて返します'
      - id: PW-PROJECT-SEARCH-02
        pattern: event
        statement: 'タイトルが 38 文字を超えると、CLI の表では 35 文字に切り詰めて末尾に `...` を付けます。`projects` の `title` は切り詰めません'
      - id: PW-PROJECT-SEARCH-03
        pattern: unwanted
        statement: 'もしプロジェクトが 1 件も無いなら、`kind` が `project-not-found` の失敗を返します'
      - id: PW-PROJECT-SEARCH-04
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-PROJECT-SEARCH-05
        pattern: event
        statement: 'pecot-workflow のフィールドを持つプロジェクトを一覧すると、その要素の `initialized` を `true` にします'
      - id: PW-PROJECT-SEARCH-06
        pattern: event
        statement: 'アクティブなプロジェクトを一覧すると、その要素の `active` を `true` にします'
      - id: PW-PROJECT-SEARCH-07
        pattern: unwanted
        statement: 'もしプロジェクトのフィールドを読めないなら、`warnings` に入れ、その要素に `initialized` を入れずに続けます'
  PW-PROJECT-SET:
    help:
      details:
        - Stores the Epic aggregation repository in the config file of the active project.
        - The key is aggregation_repo, the only key of the project config for now; any other key is a usage error.
        - pecot issue create --type epic uses the stored repository as the destination.
        - Overwriting a different value always writes a warning line.
        - --yes only omits the confirmation hint from the warning line.
        - Giving the value already stored changes nothing.
        - With --dry-run, prints a dry-run line with the previous value instead of writing the key, and gives no overwrite warning.
      examples:
        - run: pecot project set aggregation_repo example-org/roadmap
          note: Set the aggregation repository.
        - run: pecot project set aggregation_repo example-org/roadmap --dry-run
          note: Show the planned value without writing the config file.
      default_notes: {}
    summary: 設定のキーに値を入れます。キーは Epic を集めるリポジトリ（`aggregation_repo`）です。
    arguments:
      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。'
      value: 'Epic を集めるリポジトリです。`owner/repo` の形で渡します。'
      yes: '既にある値を、確認なしで上書きするかどうかです。上書きの知らせは、`warnings` に入ります。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - 'Epic を集めるリポジトリを、アクティブなプロジェクトの設定ファイルに保存します。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、`kind` が `invalid-input` の失敗を返します。'
      - '`issue_create` は、`type` が `epic` のとき、保存したリポジトリを作り先に使います。'
      - '違う値を上書きするときは、必ず `warnings` に 1 つ入れます。'
      - '`yes` は、その知らせから確認の案内を省くだけです。'
      - '既に保存してある値と同じ値を渡すと、何も変えずに、`change` を `unchanged` にして成功を返します。'
      - '`dry_run` を付けると、キーを書かずに、書く予定の値と前の値を `value` と `previous` に入れて返します。上書きの知らせは `warnings` に入れません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        key: '設定したキーです。今は `aggregation_repo` だけです。'
        value: '実行後のキーの値です。`dry_run` のときは、実行したあとになる値です。'
        previous: '実行前のキーの値です。未設定だったときは入りません。'
        change: '設定がどうなったかです。`create`（未設定だった）・`update`（値を置き換えた）・`unchanged`（既に同じ値だった）のどれかです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
        configPath: 'アクティブなプロジェクトの設定ファイルの絶対パスです。`change` がどれでも、`dry_run` のときも入ります。'
    diagnostics: '標準エラーに、結果の行（`set` か `unchanged`）を出します。違う値を上書きしたときは、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: invalid-input
        code: 1
        when: '値が `owner/repo` の形ではありません。'
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        code: 1
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 2
        when: '`key` か `value` がありません。`key` が `aggregation_repo` でないときと、ほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'アクティブな設定ファイルに `aggregation_repo` を書きます。`dry_run` のときは書きません。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          key: aggregation_repo
          value: example-org/roadmap
        note: 'Epic を集めるリポジトリを設定します。'
      - arguments:
          key: aggregation_repo
          value: example-org/roadmap
          dry_run: true
        note: '設定ファイルを書かずに、する予定を返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-SET-01
        pattern: event
        statement: '未設定の状態で値を渡すと、設定ファイルに書きます'
      - id: PW-PROJECT-SET-02
        pattern: event
        statement: '未設定の状態で値を渡すと、結果の `change` を `create` にします'
      - id: PW-PROJECT-SET-03
        pattern: event
        statement: '既にある値と同じ値を渡すと、結果の `change` を `unchanged` にします'
      - id: PW-PROJECT-SET-04
        pattern: unwanted
        statement: 'もし既にある値と違う値を渡したなら、上書きの知らせを `warnings` に入れます'
      - id: PW-PROJECT-SET-05
        pattern: event
        statement: '`yes` を付けて上書きすると、上書きの知らせから確認の案内を省きます'
      - id: PW-PROJECT-SET-06
        pattern: unwanted
        statement: 'もし値が `owner/repo` の形でないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-SET-07
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-PROJECT-SET-08
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-SET-09
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、設定ファイルを書かず、前の値を `previous` に入れ、`dryRun` を `true` にして成功を返します'
  PW-PROJECT-UNSET:
    help:
      details:
        - Clears the Epic aggregation repository in the config file of the active project.
        - The key is aggregation_repo, the only key of the project config for now; any other key is a usage error.
        - Clearing a value that is not set changes nothing.
        - With --dry-run, prints a dry-run line with the previous value instead of removing the key.
      examples:
        - run: pecot project unset aggregation_repo
          note: Clear the aggregation repository.
        - run: pecot project unset aggregation_repo --dry-run
          note: Show the planned removal without writing the config file.
      default_notes: {}
    summary: 設定のキーの値を消します。キーは Epic を集めるリポジトリ（`aggregation_repo`）で、消した後で Epic を作るには、引数 `repo` が要ります。
    arguments:
      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - 'アクティブなプロジェクトの設定ファイルから、Epic を集めるリポジトリを消します。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、`kind` が `invalid-input` の失敗を返します。'
      - '未設定の値を消しても、何も変えずに、`change` を `unchanged` にして成功を返します。'
      - '`dry_run` を付けると、キーを消さずに、消す予定の前の値を `previous` に入れて返します。'
      - '消した後で `issue_create` に `type` の `epic` を渡すときは、引数 `repo` で作り先を渡します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        key: '消したキーです。今は `aggregation_repo` だけです。'
        previous: '実行前のキーの値です。未設定だったときは入りません。'
        change: '設定がどうなったかです。`delete`（キーを消した）か `unchanged`（もともと未設定だった）です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
        configPath: 'アクティブなプロジェクトの設定ファイルの絶対パスです。`change` がどれでも、`dry_run` のときも入ります。'
    diagnostics: '標準エラーに、結果の行（`removed`、未設定だったときは `unchanged`）を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        code: 1
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 2
        when: '`key` がありません。`key` が `aggregation_repo` でないときと、知らない引数などほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: 'アクティブな設定ファイルから `aggregation_repo` を消します。`dry_run` のときは書きません。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          key: aggregation_repo
        note: 'Epic を集めるリポジトリの設定を消します。'
      - arguments:
          key: aggregation_repo
          dry_run: true
        note: '設定ファイルを書かずに、消す予定を返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-UNSET-01
        pattern: event
        statement: '値を設定していると、設定ファイルから消します'
      - id: PW-PROJECT-UNSET-02
        pattern: event
        statement: '値を設定していると、結果の `change` を `delete` にし、消した値を `previous` に入れます'
      - id: PW-PROJECT-UNSET-03
        pattern: event
        statement: '未設定だと、結果の `change` を `unchanged` にします'
      - id: PW-PROJECT-UNSET-04
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-PROJECT-UNSET-05
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-UNSET-06
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、値を消さず、前の値を `previous` に入れ、`dryRun` を `true` にして成功を返します'
  PW-RELEASE-CHECK:
    help:
      details:
        - Checks the open Dependabot, code scanning and secret scanning alerts of the repository.
        - All three kinds are always checked, even when an earlier one fails.
        - An open Dependabot alert is a warning and does not stop the command.
        - "The Dependabot warning lists each alert as #<number> with its package and severity, and the URL of the alert page."
        - An open code scanning or secret scanning alert fails the command.
        - A repository with the feature disabled passes with a skipped line.
        - A state of code scanning or secret scanning that cannot be determined, such as a missing permission, fails the command.
        - For a repository whose release type is nx, only the alerts are checked, and the version argument and --package are rejected.
        - Otherwise checks that the CHANGELOG exists, that the version is in X.Y.Z form, that the tag exists neither locally nor on the remote, and that <develop_branch> has commits that <release_branch> does not have, where <remote> of the tag check is origin, or the first remote when there is no origin.
        - "Without a version argument, the version is the first ## [X.Y.Z] heading of the CHANGELOG, and the Unreleased heading is skipped."
        - The CHANGELOG is the changelog_file of the repository in the config file.
        - Without changelog_file, the CHANGELOG is CHANGELOG.md and then AIST-CHANGELOG.md at the git root, and with --package, the changelog of that package.
        - The tag is v<version>.
        - With --package, the tag is <package>-v<version>.
        - A repository with packages configured needs --package.
        - A repository without packages does not accept --package.
        - The repository is taken from the global pecot --repo, and without it from the origin remote, or from the first remote when there is no origin.
        - With a --repo that differs from the git remote, the git commands still use origin, or the first remote when there is no origin.
        - The command needs the working directory to be inside a git repository.
        - A mismatch between --repo and the current git remote is a warning, and --repo is used.
        - "When the owner/repo cannot be read from the URL of the remote, --repo is not compared with it: with --repo the command prints a warning and uses --repo, and without --repo it stops."
        - Counts the commits with the GitHub compare API, from the ahead_by of its response. It runs no git fetch and moves no local ref, and it counts a commit that exists only on the remote.
      examples:
        - run: pecot release check
          note: Check the release with the version detected from the CHANGELOG.
        - run: pecot release check 0.6.1
          note: Check the release of a given version.
        - run: pecot release check 0.6.1 --package pecot-workflow
          note: Check the release of one package in a monorepo.
      default_notes:
        version: "The first ## [X.Y.Z] heading of the CHANGELOG; the Unreleased heading is skipped."
        package: None; required when the repository has packages configured in the config file.
        project: None; the config that includes the target repository, and the active one among them when there are several.
    summary: リリースの前の確認をします。nx のリポジトリでは、alert だけを確かめます。
    arguments:
      package: 'monorepo のパッケージの名前です。'
      version: 'リリースする版です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    constraints: []
    details:
      - 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を確かめます。'
      - '3 種類は、先の確認が失敗しても、必ずすべて確かめます。'
      - 'open の Dependabot alert は `warnings` に入れて知らせ、確認は止めません。'
      - 'Dependabot の知らせには、alert ごとの `#<number>`・パッケージ・severity と、alert のページの URL を並べます。'
      - 'open の code scanning alert か secret scanning alert があると、失敗を返します。'
      - '機能が無効のリポジトリは、飛ばした確認を `skipped` に入れて通ります。'
      - '権限が無いなどで code scanning か secret scanning の状態を判定できないと、失敗を返します。'
      - 'リリースの種類が nx のリポジトリでは、alert だけを確かめます。`version` と `package` は受け付けません。'
      - 'それ以外では、次のことを確かめます。CHANGELOG があること。版が `X.Y.Z` の形であること。タグがローカルとリモートのどちらにも無いこと。`<develop_branch>` に、`<release_branch>` に無いコミットがあること。タグの確認に使う `<remote>` は `origin` で、`origin` が無ければ最初の remote です。'
      - '`version` が無いときの版は、CHANGELOG の最初の `## [X.Y.Z]` の見出しです。Unreleased の見出しは飛ばします。'
      - 'CHANGELOG は、設定ファイルにあるリポジトリの `changelog_file` です。'
      - '`changelog_file` が無いときの CHANGELOG は、git のルートの `CHANGELOG.md` で、その次が `AIST-CHANGELOG.md` です。`package` を渡したときは、そのパッケージの changelog です。'
      - 'タグは `v<version>` です。'
      - '`package` を渡すと、タグは `<package>-v<version>` です。'
      - 'packages を設定したリポジトリでは、`package` が必須です。'
      - 'packages の無いリポジトリでは、`package` を受け付けません。'
      - 'リポジトリは、引数 `repo` から決めます。無ければ remote の `origin` から、`origin` も無ければ最初の remote から決めます。'
      - '`repo` が git remote と違っても、git のコマンドは `origin` を使います。`origin` が無ければ、最初の remote を使います。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。CLI では、作業ディレクトリです。'
      - '`repo` が今の git remote と食い違うときは、`warnings` に入れて `repo` を使います。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`warnings` に入れて `repo` を使い、無ければ失敗を返します。'
      - 'コミットの数は、GitHub の compare API の `ahead_by` で数えます。呼ぶ先は `GET /repos/{owner}/{repo}/compare/{release_branch}...{develop_branch}` です。`git fetch` はせず、手元の ref も動かしません。リモートにだけあるコミットも数えます。'
    stdin: none
    output:
      format: text
      description: '版の行、タグの行、空行、その版のリリースノートです。リリースの種類が nx のリポジトリでは、標準出力に何も書きません。'
    mcp_output:
      fields:
        version: 'リリースする版です。リリースの種類が `nx` のときは入りません。`nx` ではアラートだけを確かめます。'
        tag: '作るタグです。リリースの種類が `nx` のときは入りません。'
        releaseNotes: 'CHANGELOG から取ったリリースノートです。リリースの種類が `nx` のときは入りません。'
        commitCount: 'リリースブランチから develop ブランチまでのコミットの数です。リリースの種類が `nx` のときは入りません。'
        skipped: '機能が無効なので飛ばした確認の文の配列です。例は `Dependabot alerts (feature disabled)` です。飛ばした確認が無ければ空です。'
        dependabotAlerts: 'Dependabot アラートの状態です。読めなかったときは入りません。リリースは止めません。`enabled`・`openCount`・`alertsUrl` を必ず持ち、`maxSeverity` は、開いたアラートがあるときだけ入ります。'
    diagnostics: 'alert の種類ごとに、`count` の行、`skipped` の行、`warning` の行のどれかを出します。code scanning と secret scanning には、`error` の行も出します。リリースするコミットの `count` の行を出します。`--repo` が git remote と違うときは、`warning` の行を出します。失敗したときは、`error` の行を出します。コミットの数を数えられなかったときは、`error: could not count the commits from <release> to <develop>: ...` の行を出します。remote の URL から `owner/repo` を読めず `--repo` があるときは、`warning: using --repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`--repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `--repo` の案内の行を続けます。'
    environment: []
    exit_status:
      - kind: git-unresolved
        code: 1
        when: 'git のリポジトリのルートが見つかりません。`repo` を省いたのに git remote を読めないときと、git の外で `repo` を省いたときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: invalid-input
        code: 1
        when: '`package` の決まりに反しています。nx のリポジトリに版か `package` を渡したときと、版が `X.Y.Z` の形でないときも含みます。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` か `release_branch` が未設定です。'
      - kind: preflight-failed
        code: 1
        when: 'リリースの確認に通りません。次のどれかです。alert の確認が失敗しました。CHANGELOG かその中の版が見つかりません。タグが既にあります。リリースするものがありません。git のコマンドが失敗しました。'
      - kind: invalid-input
        code: 2
        when: '知らない引数など、引数の誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'コミットの数を数えるとき、GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'コミットの数を数えるとき、GitHub にブランチかリポジトリが見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'コミットの数を数えるとき、GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'コミットの数を数えるとき、GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。GitHub へ届かず、コミットの数を数えられないときも含みます。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'GitHub と作業ツリーのどちらにも、何も作りません。手元の ref も動かしません。alert の確認で失敗したときも、結果に `skipped` と `dependabotAlerts` が入ります。open の alert か読めない alert が Dependabot だけのときは、`warnings` に入れて成功を返します。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を読みます。GitHub の compare API で、リリースブランチから開発ブランチまでのコミットの数（`ahead_by`）も読みます。'
      - target: git
        kind: read
        what: 'git のルート、`<remote>` の URL、ローカルのタグ、`git ls-remote` で見たリモートのタグを読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルと CHANGELOG を読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。GitHub のリポジトリに、開発ブランチとリリースブランチが要ります。remote の `origin`（無ければ最初の remote）は、タグの確認に使います。'
      - '設定ファイルに、リポジトリの `develop_branch` と `release_branch` が要ります（`project_link` で設定します）。リリースの種類が nx のときは要りません。'
      - 'ホストの GitHub トークンと、alert を読む権限が要ります。'
    idempotent: true
    examples:
      - arguments: {}
        note: 'CHANGELOG から見つけた版で、リリースを確かめます。'
      - arguments:
          version: 0.6.1
        note: '渡した版のリリースを確かめます。'
      - arguments:
          version: 0.6.1
          package: pecot-workflow
        note: 'monorepo の 1 つのパッケージのリリースを確かめます。'
    cli_reference:
      examples:
        - run: pecot release check
          note: 'CHANGELOG から見つけた版で、リリースを確かめます。'
        - run: pecot release check 0.6.1
          note: '渡した版のリリースを確かめます。'
        - run: pecot release check 0.6.1 --package pecot-workflow
          note: 'monorepo の 1 つのパッケージのリリースを確かめます。'
    default_notes:
      version: '省くと、CHANGELOG の最初の `## [X.Y.Z]` の見出しの版です。Unreleased の見出しは飛ばします。'
      package: '省くと、値はありません。設定ファイルでリポジトリに packages を設定しているときは必須です。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-RELEASE-CHECK-01
        pattern: event
        statement: '`version` を省いて呼ぶと、CHANGELOG の最初の版を対象に確かめます'
      - id: PW-RELEASE-CHECK-02
        pattern: event
        statement: '`version` を渡して呼ぶと、その版を対象に確かめます'
      - id: PW-RELEASE-CHECK-03
        pattern: event
        statement: '`package` を渡して呼ぶと、パッケージ名を接頭辞にしたタグ名で確かめます'
      - id: PW-RELEASE-CHECK-04
        pattern: event
        statement: '呼ぶと、Dependabot・code scanning・secret scanning の open の alert を調べます'
      - id: PW-RELEASE-CHECK-05
        pattern: event
        statement: '呼ぶと、alert の結果を `skipped` と `dependabotAlerts` に入れます。CLI では、alert の結果の行を標準エラーに出します'
      - id: PW-RELEASE-CHECK-06
        pattern: event
        statement: 'open の Dependabot alert があると、件数と最も重い severity を添えた知らせを `warnings` に入れます'
      - id: PW-RELEASE-CHECK-07
        pattern: event
        statement: '`release_type` が `nx` のリポジトリで呼ぶと、alert だけを調べます'
      - id: PW-RELEASE-CHECK-08
