        statement: '前提の PR を `reads` で受けると、スタックできるかで `Ready` か `Blocked` を決め、もう一方の列を項目にします'
      - id: PW-ISSUE-CHECK-13
        pattern: unwanted
        statement: 'もし `method` が `update` で `blocked_by` を渡すなら、`issue_dependency_check` を案内する項目を返します'
      - id: PW-ISSUE-CHECK-14
        pattern: unwanted
        statement: 'もし作り先がプロジェクトに無いか、作り先・`issue_number`・担当の数が決まりに外れるなら、引数ごとの項目を返します'
      - id: PW-ISSUE-CHECK-15
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
      - id: PW-ISSUE-CHECK-16
        pattern: unwanted
        statement: 'もし `method` が `update` で、本文の `Waits for merge` の節の行が `- #N: 理由` の形でないなら、行の形を添えた項目を返します'
