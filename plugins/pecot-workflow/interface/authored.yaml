  PW-BOARD-SYNC:
    help:
      details:
        - Reads the whole board and moves the open Issues in Ready, Blocked, Active and In Review to the column and Status that their judgment calls for.
        - The judgment, the column move and the Status write are the same as the rest of the workflow (blocked-by, branches and PRs).
        - An Issue with a branch or a PR is never moved; when it is blocked, a warning line says so.
        - An Issue in Backlog, Pending or Archived, a PR card, a Tracker and an Epic are not moved.
        - An Issue whose judgment cannot be read (for example, develop_branch is not set) is not moved, and a warning line gives the reason.
        - Reads each Issue of Blocked, Active and In Review one by one, because the branches and PRs are not in the board list. Skips only the Ready Issues that the list shows with no prerequisites.
        - Then deletes the Archived items from the board except the 20 most recently updated. An Archived item that cannot be deleted is skipped, the command continues, and it ends with exit code 1.
        - "With --dry-run, prints the same sentences as dry-run lines and writes nothing to the board. For the Archived items it prints only the line dry-run: would delete N archived items."
        - The config is --project, else the active project, else the only config in .pecot/config/projects. With two or more configs and no active project, stops and asks for --project.
        - Reads the GraphQL rate limit (REST, no points) before and after the run and prints the points used and the remaining points. When it cannot be read, the line is left out. When the rate limit window resets during the run, or the difference is negative, the points used line is left out.
        - On a GitHub Enterprise Server without Issue dependencies, prints one warning and moves nothing.
      examples:
        - run: pecot board sync --dry-run
          note: Show the planned moves without writing to the board.
        - run: pecot board sync --project example-config
          note: Synchronize the board of the named config, for a checkout without an active project.
      default_notes: {}
    summary: Ready・Blocked・Active・In Review の Issue を、判定に合った列と Status へ動かします。
    arguments:
      dry_run: 'ボードへ書き込まず、動かす予定だけを返すかどうかです。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。'
    constraints: []
    details:
      - 'ボードの全体を読み、Ready・Blocked・Active・In Review にある open の Issue を、判定が求める列と Status へ動かします。'
      - '判定・列の移動・Status の書き込みは、ワークフローのほかの部分と同じです（blocked-by・ブランチ・PR を見ます）。'
      - 'ブランチか PR のある Issue は動かしません。その Issue が blocked のときは、`warnings` で知らせます。'
      - 'Backlog・Pending・Archived にある Issue と、PR のカード・Tracker・Epic は動かしません。'
      - '判定を読めない Issue（`develop_branch` が未設定のときなど）は動かさず、`warnings` に理由を入れます。'
      - 'ブランチと PR はボードの一覧に載らないので、Blocked・Active・In Review の Issue は 1 件ずつ読みます。読むのを省くのは、一覧で前提が無いと分かる Ready の Issue だけです。'
      - '動かした後で、Archived の項目を、更新の新しい 20 件を残して、ボードから削除します。削除できない Archived の項目は飛ばして続け、最後に失敗を返します。'
      - '`dry_run` を付けると、動かす予定を `moves` に、削除する予定の Archived の件数を `deletedArchived` に入れ、ボードには何も書きません。'
      - '設定は、`project` の設定、アクティブなプロジェクト、`.pecot/config/projects` にある唯一の設定の順で選びます。設定が 2 つ以上あってアクティブなプロジェクトが無いときは、`project` を求める失敗を返します。'
      - 'CLI では、実行の前後に GraphQL の rate limit を読み（REST なので点数は減りません）、使った点数と残りの点数を出します。読めないときは、その行を省きます。実行中に rate limit の窓が切り替わったときと、差が負のときは、使った点数の行を省きます。'
      - 'Issue の依存関係に対応していない GitHub Enterprise Server では、`warnings` に 1 つ入れ、何も動かしません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        moves: '列か Status を書いた Issue の配列です。`dry_run` のときは、書く予定の Issue です。要素は `issue`・`reason` を必ず持ちます。`issue` は `#N` の形で、ホームリポジトリの外は `owner/repo#N` です。`reason` は、動かすと決めた Readiness です。`from` と `to` は列が変わったときだけ、`label` は Status を設定したときだけ入ります。'
        deletedArchived: 'ボードから削除した Archived の項目の件数です。`dry_run` のときは、削除する予定の件数です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。ボードには何も書いていません。'
    diagnostics: '移動ごとの結果の行（`moved`）と、Status の書き込みごとの結果の行（`set`）と、削除した Archived の項目の結果の行（`deleted`）を出します。`--dry-run` のときは、代わりに `dry-run` の行を出します。`warning` の行を出すのは、次のときです。ブランチか PR のある Issue が blocked のとき。判定を読めない Issue があるとき。書き込みに失敗したとき。Archived の項目を削除できなかったとき。ボードが定義していない値があるとき。GitHub Enterprise Server が Issue の依存関係に対応していないとき。`count` の行には、使った GraphQL の点数と残りを出します。rate limit を読んだ後にエラーで止まったときも出します。最後に、書き込みに失敗した Issue の数を `error` の行で出します。失敗ごとにも `error` の行を出します。削除できなかった Archived の項目の数も、別の `error` の行で出します。'
    environment: []
    exit_status:
      - kind: partial-failure
        code: 1
        when: 'ボードへの書き込みが 1 件以上の Issue で失敗したか、Archived の項目を 1 件以上削除できませんでした。ほかの Issue をすべて同期した後で終わります。'
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトが無く、設定も 1 つに決まりません。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: config-invalid
        code: 1
        when: '設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 2
        when: 'コマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '既に書いた移動と、既に削除した Archived の項目は、そのまま残ります。書き込みの失敗は `warnings` に入れ、ほかの Issue の同期を続けてから、`kind` が `partial-failure` の失敗を返します。Archived の項目を削除できないときも `warnings` に入れて続け、同じ失敗を返します。この失敗の結果にも、`moves` と `deletedArchived` が入ります。判定を読めない Issue があるときと、Issue の依存関係に対応していない GitHub Enterprise Server のときは、成功を返します。'
    effects:
      - target: github
        kind: read
        what: 'ボードの項目を読みます。Blocked・Active・In Review の Issue と、前提のある Ready の Issue は、blocked-by・ブランチ・PR も読みます。GraphQL の rate limit も読みます。'
      - target: github
        kind: write
        what: '判定に合っていない Issue の列（pecot-workflow のフィールド）と Status を設定します。'
      - target: github
        kind: destructive
        what: '更新の新しい 20 件を超えた Archived の項目を、プロジェクトのボードから削除します。`dry_run` のときは削除しません。'
      - target: file
        kind: read
        what: '設定ファイルを読みます。'
    prerequisites:
      - '`.pecot/config/projects` の下に設定が要ります。アクティブな設定か、`project` で名前を渡した設定か、唯一の設定を使います。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - arguments:
          dry_run: true
        note: 'ボードへ書き込まず、動かす予定を返します。'
      - arguments:
          project: example-config
        note: '名前を渡した設定のボードを同期します。アクティブなプロジェクトの無いチェックアウトで使います。'
    cli_reference:
      examples:
        - run: pecot board sync --dry-run
          note: 'ボードへ書き込まず、動かす予定を出します。'
        - run: pecot board sync --project example-config
          note: '名前を渡した設定のボードを同期します。アクティブなプロジェクトの無いチェックアウトで使います。'
    default_notes: {}
    behaviors:
      - id: PW-BOARD-SYNC-01
        pattern: event
