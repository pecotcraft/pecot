        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: git-unresolved
        code: 1
        when: 'git remote からリポジトリを読めません。'
      - kind: content-invalid
        code: 1
        when: 'Tracker の本文にある `list-begin` と `list-end` の印が、ちょうど 1 組ではありません。'
      - kind: partial-failure
        code: 1
        when: 'Tracker の作成・書き直し・クローズ・ボードへの配置のどれかに失敗しました。`security` で取れない種類があるときも含み、`--dry-run` でも 1 です。'
      - kind: invalid-input
        code: 2
        when: '`source` を省いたか、`dependabot` でも `security` でもありません。ほかのコマンドラインの誤りも含みます。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '`dependabot` では、作った Tracker は、ボードへの配置に失敗しても GitHub に open のまま残り、次の実行でボードに置きます。本文の書き直しに失敗したときは、本文は元のままで、Tracker は open のままです。クローズに失敗したときは、一覧は none のまま、Tracker は open のままで、次の実行で閉じます。済んだ変更は巻き戻しません。`security` では、作った Tracker は、ボードへの配置に失敗しても GitHub に open のまま残り、次の実行でボードに置きます。本文の書き直しに失敗したときは、本文は元のままで、次の実行でやり直します。済んだ変更は巻き戻しません。'
    effects:
      - target: github
        kind: read
        what: '`dependabot` では、リポジトリの open の Dependabot の PR と、`dependabot-pr` のラベルが付いた Issue の一覧を読みます。'
      - target: github
        kind: write
        what: '`dependabot` では、Tracker の Issue を作り、本文を書き直し、閉じます。プロジェクトのボードに足し、Status と Priority を設定します。'
      - target: github
        kind: read
        what: '`security` では、リポジトリの open の Dependabot・code scanning・secret scanning の alert の一覧を読みます。一覧を拒まれたときは、secret scanning と Dependabot の設定も読みます。`security-alert` のラベルが付いた Issue の一覧も読みます。'
      - target: github
        kind: write
        what: '`security` では、Tracker の Issue を作り、本文を書き直します。プロジェクトのボードに足し、Status と Priority を設定します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンと、Issue とプロジェクトを編集する権限が要ります。`security` では、セキュリティ alert を読む権限も要ります。'
      - '対象のリポジトリは `--repo` です。無ければ、作業ディレクトリの remote の `origin` です。`origin` も無ければ、最初の remote です。'
    idempotent: true
    examples:
      - run: pecot tracker sync dependabot --dry-run
