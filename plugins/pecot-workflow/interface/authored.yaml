  PW-PROJECT-SET-REPO:
    constraints:
      - conflicts: [package, changelog_file]
      - conflicts: [package, clear_packages]
    details:
      - Links the repository to the GitHub project and adds it to the config file of the active project.
      - The config file is written only after the link succeeded.
      - For a repository already registered, updates only the settings given on the command line.
      - Giving --package replaces the packages of a registered repository and also clears its changelog_file, even when --changelog-file is not given.
      - Giving --clear-packages removes the packages of a registered repository.
      - The repository owner must match the project owner.
    stdin: none
    output:
      format: none
    diagnostics: Result lines on stderr for the link to the project (added, or unchanged when already linked) and for the config file (added or updated).
    environment: []
