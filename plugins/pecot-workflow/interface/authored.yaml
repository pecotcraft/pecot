      title: '`create`・`update` で、PR の題です。書き込みのツールに渡すものと同じです。'
      head: '`create` で、PR にするブランチです。fork のブランチは `owner:branch` で書きます。'
      base: '`create`・`update` で、PR の base のブランチです。'
      draft: '`create` で、PR を下書きにするかどうかです。'
      body: '`create`・`update` で、PR の本文です。書き込みのツールに渡すものと同じです。'
      pullNumber: '`update`・`merge` で、PR の番号です。'
      merge_method: '`merge` で、`merge_pull_request` に渡すマージの方法です。'
      expectedHeadSha: '`merge` で、`merge_pull_request` に渡す、マージする PR の先頭のコミットです。'
      template: '本文が従うテンプレートです。同梱のものは `pecot-template://pr/<名前>` で書き、決まりを当てます。差し替えたテンプレートのパスか URL は、本文を照らさずに受けます。'
      template_text: '差し替えたテンプレートの本文です。本文をこれに照らしません。'
      screenshot: '同梱の `create` のテンプレートで、Summary に画像を入れない理由です。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
      reads: '公式の MCP の読み取りの結果です。`pull_request` には PR の `pull_request_read`（`get`）を渡します。`pull_requests` には親ブランチの `list_pull_requests` を、`issue` にはブランチの Issue の `issue_read`（`get`）を渡します。'
    constraints: []
    details:
      - '値を受けて、決まりに外れた所を `problems` に返します。GitHub を読み書きしません。読み取りが要る決まりは、`reads` の結果で照らします。'
      - '同梱のテンプレートを指すと、本文をテンプレートの見出しと書き方に照らします。テンプレートの先頭の案内のコメントと frontmatter が本文に残っていれば、それも返します。'
      - '差し替えたテンプレートを指すときと、テンプレートを省くときは、本文に見出しの決まりを当てません。'
      - '`create` では `title`・`head`・`base` が要ります。`update` では `pullNumber` と、その PR の `reads.pull_request` が要ります。`update` で省いた `title`・`base` は、`reads.pull_request` の値で照らします。'
      - '本文が Issue を閉じず（GitHub が認める 9 つの語か `owner/repo#N`）、ブランチの名前に Issue の番号があれば、`reads.issue` でその Issue を見ます。Epic でなければ、`Closes #N` を候補に `missing-closes` を返します。'
      - '番号の空いた `Closes #` の行が本文に残っていれば、`empty-closes` を返します。'
      - '同梱の `create` のテンプレートで、Summary に画像が無く `screenshot` も空なら、`screenshot` の項目を返します。'
      - 'head が今のブランチなら、作業ディレクトリの `.pecot/state/.pecot-base` を読みます。スタックの記録があれば、`reads.pull_requests` の親 PR から base を決めます。親 PR が開いていれば親ブランチ、マージ済みなら開発ブランチです。'
      - 'スタックの記録が無ければ、base は開発ブランチです。head が今のブランチでなく、記録を読めないときは、base を照らしません。'
      - 'リリース PR は、base を `release_branch` に照らし、Issue・画像・題の scope を見ません。リリース PR とは、同梱の `release` のテンプレートの PR か、開発ブランチから `release_branch` への PR です。'
      - 'nx を使うリポでは、題の scope を、変更した nx のプロジェクトの scope と比べます。nx のプロジェクトか差分を読めないときは、題の scope を照らさず、`warnings` に入れます。'
      - '`create` では、push していないか remote とずれたブランチ、変更したファイル、stash の項目を返します。スタックして remote とずれたブランチの直し方は、親 PR と remote の先頭から決めます。'
      - '`merge` では、`reads.pull_request` の PR が開いていて、下書きでなく、衝突していないことを照らします。`expectedHeadSha` が PR の先頭と違えば、`head-moved` を返します。'
      - '`merge` で base が開発ブランチでも `release_branch` でもなければ、`reads.pull_requests` を見ます。base を head に持つ開いた PR が無いことを照らします。'
      - '`merge` の方法は、リリース PR が `merge`、ほかが `squash` です。`merge_method` を省くと、GitHub は `merge` でマージします。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
      - '外れた所が無ければ、成功の結果の文は `ok` です。あれば、最初の外れた所の `<引数>: <内容>` です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        problems: '決まりに外れた所の配列です。要素は `field`・`code`・`message` を必ず持ちます。受け付ける値が決まっているときは `candidates` に入れます。空なら、値をそのまま書けます。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: git-unresolved
        when: '`create` で、作業ディレクトリが git のリポジトリでないか、remote か今のブランチを決められません。base の記録の位置が head の履歴に無いときも含みます。'
      - kind: content-invalid
        when: 'base の記録の形が誤っています。'
      - kind: repo-setting-missing
        when: '`develop_branch` が未設定です。リリース PR では `release_branch` が未設定のときです。'
      - kind: invalid-input
        when: '引数の形が誤っています。`method` が `create`・`update`・`merge` でないときを含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイル、同梱のテンプレート、`.pecot/state/.pecot-base` を読みます。'
      - target: git
        kind: read
        what: '`git status`・`git stash list`・追跡参照との差を読みます。スタックして remote とずれたときは、親ブランチの remote の先頭を問い合わせます。'
      - target: process
        kind: read
        what: 'nx を使うリポでは、`nx graph` でプロジェクトを読みます。'
    prerequisites: []
    idempotent: true
    examples:
      - arguments:
          method: create
          owner: acme
          repo: demo
          title: 'feat(demo): #12 見本の変更'
          head: feat/demo/12
          base: main
          template: pecot-template://pr/create
          body: '## Summary'
        note: '本文と base と題を照らし、外れた所を `problems` に返します。'
      - arguments:
          method: merge
          owner: acme
          repo: demo
          pullNumber: 21
          merge_method: squash
          expectedHeadSha: 0123456789abcdef0123456789abcdef01234567
        note: '`reads.pull_request` の PR をマージしてよいかを照らします。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-CHECK-01
        pattern: event
        statement: 'PR を書く値を受けると、GitHub を読み書きせずに、決まりに外れた所を `problems` に返します'
      - id: PW-PR-CHECK-02
        pattern: event
        statement: '同梱のテンプレートを指すと、本文をテンプレートの見出しと書き方に照らし、外れた所ごとに項目を返します'
      - id: PW-PR-CHECK-03
        pattern: state
        statement: '差し替えたテンプレートを指すか、テンプレートを省く間、本文にテンプレートの見出しの決まりを当てません'
      - id: PW-PR-CHECK-04
        pattern: unwanted
        statement: 'もし `create` に `title`・`head`・`base` が無いか、`update`・`merge` に `pullNumber` が無いなら、その引数の `required` の項目を返します'
      - id: PW-PR-CHECK-05
        pattern: unwanted
        statement: 'もし `update`・`merge` で `reads.pull_request` が無いなら、`read-required` の項目を返します。別の PR を読んだときは、`not-found` の項目を返します'
      - id: PW-PR-CHECK-06
        pattern: unwanted
        statement: 'もし本文が Issue を閉じず、ブランチの Issue が Epic でないなら、`Closes #N` を候補に `missing-closes` の項目を返します'
      - id: PW-PR-CHECK-07
        pattern: unwanted
        statement: 'もし本文が Issue を閉じず、`reads.issue` が無いなら、`issue_read` で読むよう `read-required` の項目で案内します'
      - id: PW-PR-CHECK-08
        pattern: state
        statement: 'ブランチの Issue が Epic の間、本文に `Closes` を求めません'
      - id: PW-PR-CHECK-09
        pattern: unwanted
        statement: 'もし同梱の `create` のテンプレートで、Summary に画像が無く `screenshot` も空なら、`screenshot` の項目を返します'
      - id: PW-PR-CHECK-10
        pattern: event
        statement: 'スタックの記録のある head の値を受けると、親 PR が開いていれば親ブランチ、マージ済みなら開発ブランチを base とし、違えば `base-mismatch` を返します'
      - id: PW-PR-CHECK-11
        pattern: unwanted
        statement: 'もし親ブランチに開いた PR もマージ済みの PR も無いなら、PR を開く案内を添えて `base-mismatch` を返します'
      - id: PW-PR-CHECK-12
        pattern: unwanted
        statement: 'もしスタックの記録のある head で `reads.pull_requests` が無いなら、`list_pull_requests` で読むよう `read-required` の項目で案内します'
      - id: PW-PR-CHECK-13
        pattern: state
        statement: 'スタックの記録が無い間、base を開発ブランチに照らします'
      - id: PW-PR-CHECK-14
        pattern: event
        statement: 'リリース PR の値を受けると、base を `release_branch` に照らし、Issue と画像の決まりを当てません'
      - id: PW-PR-CHECK-15
        pattern: unwanted
        statement: 'もし nx を使うリポで、題の scope が変更した nx のプロジェクトの scope と違うなら、期待する scope を候補に `title-scope` を返します'
      - id: PW-PR-CHECK-16
        pattern: event
        statement: '`create` で、push していないブランチ、変更したファイル、stash があると、それぞれの項目を直し方を添えて返します'
      - id: PW-PR-CHECK-17
        pattern: state
        statement: 'スタックしたブランチが remote とずれ、親ブランチが動いた間、Push Status の直し方を `pr_restack` にします'
      - id: PW-PR-CHECK-18
        pattern: unwanted
        statement: 'もし base の記録の位置が head の履歴に無いなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-CHECK-19
        pattern: unwanted
        statement: 'もし `merge` の PR がマージ済み・閉じている・下書き・衝突している、のどれかなら、`not-mergeable` の項目を返します'
      - id: PW-PR-CHECK-20
        pattern: unwanted
        statement: 'もし `merge` で `expectedHeadSha` が無いか、PR の先頭と違うなら、`required` か `head-moved` の項目を返します'
      - id: PW-PR-CHECK-21
        pattern: unwanted
        statement: 'もし `merge` で、PR の base を head に持つ開いた PR があるなら、`not-stack-bottom` の項目を返します'
      - id: PW-PR-CHECK-22
        pattern: event
        statement: '`merge` の値を受けると、リリース PR では `merge`、ほかでは `squash` を `merge_method` に求め、違えば `merge-method` を返します'
      - id: PW-PR-CHECK-23
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`repo` の `not-in-project` の項目を返します'
      - id: PW-PR-CHECK-24
        pattern: unwanted
        statement: 'もし `develop_branch` が未設定なら、`kind` が `repo-setting-missing` の失敗を返します'
      - id: PW-PR-CHECK-25
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
      - id: PW-PR-CHECK-26
        pattern: unwanted
        statement: 'もし `method` が `create`・`update`・`merge` のどれでもないなら、`kind` が `invalid-input` の失敗を返します'
  PW-PR-RESTACK:
    summary: スタックしたブランチを、base にしたブランチの新しい位置へスタックし直します。
    arguments:
      check: 'スタックし直しが要るかだけを確かめます。'
      continue: '衝突で止まったスタックし直しを、衝突を解いた後に続けます。'
      abort: '衝突で止まったスタックし直しを取りやめ、スタックし直す前の位置に戻します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
      reads: '公式の MCP の読み取りの結果です。`pull_requests` は、スタックしたブランチのときに渡します。親ブランチを head に持つ PR の `list_pull_requests`（`head` は `<owner>:<親ブランチ>`、`state` は `all`）の結果です。`pull_request` には、今のブランチの開いている PR の `pull_request_read`（`get`）の結果を渡します。'
    constraints: []
    details:
      - '今のブランチを、スタックして着手したときの base の記録を使って、親ブランチの新しい位置へスタックし直します。GitHub を読み書きしません。親 PR と今のブランチの PR は、`reads` に渡した公式の MCP の読み取りの結果から読みます。'
      - '`check` を付けると、スタックし直しが要るかだけを返します。変わるのは、`git fetch` が進める手元の追跡参照だけです。'
      - 'スタックしていないブランチ（開発ブランチからの着手の記録か、記録が無いもの）は、スタックし直しません。'
      - 'スタックしたブランチで `reads.pull_requests` が無いときは、親ブランチと読み方を `detail` に入れ、`kind` が `invalid-input` の失敗を返します。'
      - 'スタックし直しが要るのは、親ブランチの remote の先頭が記録の位置と違うときと、親 PR がマージ済みのときです。マージ済みなら開発ブランチへスタックし直し、base の記録を開発ブランチからの着手に変えます。'
      - 'ブランチが新しい base の上に載り終えていれば、記録が古くても rebase をしません。載り終えているとは、新しい base がブランチの履歴にあり、記録の位置もブランチの履歴にあるなら、それが新しい base の履歴にもあることです。push と記録の書き直しは、`check` なしの `pr_restack` が行います。remote のブランチが同じ木で新しい base の上にあれば、push せずに remote のブランチに合わせます。'
      - 'rebase の後、remote のブランチにだけあるコミットがあれば止まります。push がそのコミットを消すためです。ブランチはスタックし直す前の位置へ戻します。'
      - '同じ変更かは、スタックし直す前と後のブランチの両方と比べます。GitHub が書き換えたコミットを、別の変更と見ないためです。'
      - '`git rebase --no-update-refs --onto <新しい base> <記録の位置>` を動かします。'
      - '記録の位置がブランチの履歴に無いときは、別の点から rebase を始めます。親ブランチの追跡参照からの fork-point を使い、求まらなければ新しい base との merge-base を使います。親 PR がマージ済みでも同じです。'
      - '結果の木が remote のブランチと同じで、remote のブランチが新しい base の上にあれば、remote のブランチに合わせ、push しません。'
      - 'そうでなければ、fetch した位置を期待の値にした `git push --force-with-lease` で push します。pre-push のフックを含めて、10 分まで待ちます。remote に無いブランチは push しません。'
      - 'スタックし直した後、base の記録の位置を、ブランチと新しい base の merge-base に書き直します。'
      - '開発ブランチへスタックし直すか合わせた後に、`reads.pull_request` の PR を見ます。今のブランチの開いている PR で、本文に `Closes` などのこのリポの Issue があれば、その番号と理由を `relink` に返します。GitHub は、スタック PR の `Closes` を Issue とリンクせず、base を付け替えても本文を読み直さないためです。PR は書きません。'
      - '`relink` の `reason` には、`update_pull_request` で本文を変えずに保存し直す案内を入れます。PR の base が開発ブランチでなければ、base を開発ブランチにする案内も入れます。'
      - '開発ブランチへスタックし直すか合わせた後に `reads.pull_request` が無いときは、`relink` を返さず、渡すよう案内する文を `warnings` に入れます。'
      - '衝突したら、衝突したファイルを `conflicts` に入れ、rebase を途中のまま残します。途中の記録を書き、`kind` が `git-conflict` の失敗を返します。'
      - '`continue` は、衝突を解いて `git add` した後に続けます。`abort` は、スタックし直す前の位置に戻します。どちらも途中の記録だけを読み、pecot が始めていない rebase は動かしません。'
      - '`check`・`continue`・`abort` は、1 つだけ渡せます。'
      - '`check` を付けたときの成功の結果の文は、`up to date: <branch> on <base>` か `needs restack: ...` です。'
      - '書き換えるのは、セッションのディレクトリのブランチだけです。ほかの worktree には触れません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、対象のリポを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        branch: 'スタックし直すブランチです。'
        base: 'スタックし直した後の base のブランチです。親 PR がマージ済みなら、開発ブランチです。'
        outcome: '起きたことです。`up-to-date`・`needs-restack`・`restacked`・`synced`・`conflict`・`aborted` のどれかです。`check` を付けたときは、スタックし直すと何が起きるかです。'
        cause: 'スタックし直しが要る理由です。`base-moved` か `base-merged` です。`check` を付けて、スタックし直しが要るときだけ入ります。'
        pullRequest: 'マージ済みの親 PR の番号です。`cause` が `base-merged` のときだけ入ります。'
        pushed: 'ブランチを push したかどうかです。`outcome` が `restacked` のときだけ入ります。'
        conflicts: '衝突したファイルの一覧です。`outcome` が `conflict` のときだけ入ります。'
        relink: '`update_pull_request` で本文を保存し直す PR です。`pullRequest`（PR の番号）と `reason`（書く値と理由）を持ちます。開発ブランチへスタックし直すか合わせた後、`reads.pull_request` の開いている PR の本文がこのリポの Issue を閉じるときだけ入ります。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: git-unresolved
        when: 'ディレクトリが git のリポジトリではありません。git remote が無いときと、今のブランチかリポジトリを決められないときも含みます。'
      - kind: git-unresolved
        when: '`git fetch` が失敗したか、remote に届きません。スタックし直す先のブランチが手元の追跡参照に無いときも含みます。remote のブランチにだけあるコミットがあるときと、push が拒まれたか、時間切れのときも同じです。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        when: '`develop_branch` が未設定です。'
      - kind: content-invalid
        when: 'スタックした base の記録か、途中の記録の形が誤っています。'
      - kind: pr-state
        when: '親ブランチが remote から消えていて、その PR がマージされていません。'
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP の `list_pull_requests`・`pull_request_read` の結果の形と違います。'
      - kind: preflight-failed
        when: '未コミットの変更があります。`check`・`continue`・`abort` では確かめません。'
      - kind: git-conflict
        when: 'スタックし直しが衝突しました。`continue` の後に、また衝突したときも含みます。`detail` が、衝突を解く手順と、`continue`・`abort` の呼び出しを案内します。'
      - kind: invalid-input
        when: '`check`・`continue`・`abort` を 2 つ以上渡したか、途中のスタックし直しが無いのに `continue`・`abort` を渡しました。pecot の記録が無い rebase の途中のときと、スタックしたブランチで `reads.pull_requests` が無いとき、ほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: '衝突で止まったときは、rebase は途中のまま残り、base の記録は変わりません。push が拒否・時間切れ・取り消しで止まったときは、手元のブランチはスタックし直した後のままで、base の記録は変わりません。拒まれたか取り消されたときは、同じ引数で呼び直せば続きます。時間切れのときは、手で push してから呼び直すと、remote に合わせて続きます。remote のブランチにだけあるコミットで止まったときは、ブランチをスタックし直す前の位置へ戻します。'
    effects:
      - target: git
        kind: destructive
        what: '`git fetch` で追跡参照を進め、今のブランチを rebase で書き換え、`--force-with-lease` で remote のブランチを置き換えます。remote に合わせるときは、今のブランチを remote のブランチの位置に動かします。'
      - target: file
        kind: destructive
        what: '`.pecot/state/.pecot-base` を書き直します。衝突で止まる間は `.pecot/state/.pecot-restack` を置き、終わるか取りやめると消します。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'スタックして着手した作業ディレクトリで呼びます（`session_start` が base の記録を書きます）。'
    idempotent: true
    examples:
      - arguments:
          check: true
        note: '今のブランチにスタックし直しが要るかを確かめます。'
      - arguments: {}
        note: '今のブランチをスタックし直して push します。'
      - arguments:
          continue: true
        note: '衝突を解いて `git add` した後に、続けます。'
      - arguments:
          abort: true
        note: 'スタックし直す前の位置に戻します。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-PR-RESTACK-01
        pattern: event
        statement: '`check` を付けて、親ブランチが動いていないときに呼ぶと、結果の `outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-02
        pattern: event
        statement: '`check` を付けて、親ブランチの remote の先頭が記録と違うときに呼ぶと、`outcome` を `needs-restack`、`cause` を `base-moved` にします'
      - id: PW-PR-RESTACK-03
        pattern: event
        statement: '`check` を付けて、親 PR がマージ済みのときに呼ぶと、`outcome` を `needs-restack`、`cause` を `base-merged` にします。`pullRequest` には PR の番号を入れます'
      - id: PW-PR-RESTACK-04
        pattern: event
        statement: 'スタックし直しが要るときに呼ぶと、新しい base へスタックし直して `git push --force-with-lease` で push し、`outcome` を `restacked` にします'
      - id: PW-PR-RESTACK-05
        pattern: event
        statement: 'スタックし直した結果の木が remote のブランチと同じで、remote のブランチが新しい base に載っている状態で呼ぶと、push せずに remote のブランチへ合わせます。`outcome` は `synced` です'
      - id: PW-PR-RESTACK-06
        pattern: event
        statement: '親ブランチが動いていないときに呼ぶと、何も変えずに `outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-07
        pattern: unwanted
        statement: 'もしスタックし直しが衝突したなら、衝突したファイルを `conflicts` に、`continue`・`abort` の案内を `detail` に入れます。途中の記録を書いて、`kind` が `git-conflict` の失敗を返します'
      - id: PW-PR-RESTACK-08
        pattern: unwanted
        statement: 'もし未コミットの変更があるなら、スタックし直さずに、`kind` が `preflight-failed` の失敗を返します。`check` では確かめません'
      - id: PW-PR-RESTACK-09
        pattern: unwanted
        statement: 'もし親ブランチが remote から消えていて、その PR がマージされていないなら、`kind` が `pr-state` の失敗を返します'
      - id: PW-PR-RESTACK-10
        pattern: state
        statement: 'スタックしていないブランチの間、スタックし直しをしません。開発ブランチからの着手の記録があれば、fetch もしません。`check` の有無によらず、`outcome` を `up-to-date` にします'
      - id: PW-PR-RESTACK-11
        pattern: state
        statement: 'remote に今のブランチが無い間、スタックし直すだけで push せず、`pushed` を `false` にします'
      - id: PW-PR-RESTACK-12
        pattern: event
        statement: '`abort` を付けて呼ぶと、スタックし直す前の位置に戻し、途中の記録を消して、`outcome` を `aborted` にします'
      - id: PW-PR-RESTACK-13
        pattern: event
        statement: '`continue` を付けて呼ぶと、rebase を続け、終われば push と記録の書き直しまで進みます。衝突が残っていれば、もう一度 `kind` が `git-conflict` の失敗を返します。利用者が rebase を終えていれば、残りの手順だけを進めます'
      - id: PW-PR-RESTACK-14
        pattern: unwanted
        statement: 'もし途中の記録が無いのに `continue` か `abort` を付けたなら、途中の rebase を動かさずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-15
        pattern: unwanted
        statement: 'もし `check`・`continue`・`abort` を 2 つ以上付けたなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-16
        pattern: unwanted
        statement: 'もし remote のブランチにだけあるコミットがあるなら、ブランチをスタックし直す前の位置へ戻し、push をせずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-17
        pattern: unwanted
        statement: 'もし push が拒まれたなら、base の記録を書き直さずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-18
        pattern: unwanted
        statement: 'もし `git fetch` が失敗したなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-19
        pattern: event
        statement: 'スタックし直しか、remote への合わせが済むと、base の記録を新しい base のブランチと位置に書き直します。開発ブランチへスタックし直したときは、スタック先の Issue を記録から外します'
      - id: PW-PR-RESTACK-20
        pattern: unwanted
        statement: 'もしスタックした base の記録の形が誤っているなら、`kind` が `content-invalid` の失敗を返します'
      - id: PW-PR-RESTACK-21
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-PR-RESTACK-23
        pattern: state
        statement: '新しい base の上に載り終えていて記録だけが古い間、rebase をせずに push と記録の書き直しを行い、`outcome` を `restacked` にします。remote のブランチが同じ木で新しい base の上にあれば、push せずに合わせ、`outcome` を `synced` にします'
      - id: PW-PR-RESTACK-24
        pattern: state
        statement: 'ブランチが新しい base の上に載り終えている間、`check` は `outcome` を `up-to-date` にし、base の記録を書き換えません'
      - id: PW-PR-RESTACK-25
        pattern: event
        statement: '記録の位置が履歴に無いブランチをスタックし直すと、親ブランチからの fork-point を起点とします。求まらなければ、新しい base との merge-base です。古い親ブランチと base のコミットは当て直しません'
      - id: PW-PR-RESTACK-26
        pattern: unwanted
        statement: 'もし新しい base を merge で取り込んだか、親ブランチが記録より古い位置へ戻されたなら、スタックし直し済みと見ずに、スタックし直しが要ると判断します'
      - id: PW-PR-RESTACK-31
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-PR-RESTACK-32
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
      - id: PW-PR-RESTACK-33
        pattern: unwanted
        statement: 'もし push が 10 分で終わらないなら、git を止めます。時間切れの旨と、手で push してから `pr_restack` を呼ぶ案内を `detail` に入れます。base の記録は書き直さず、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-PR-RESTACK-34
        pattern: event
        statement: '開発ブランチへスタックし直すか合わせると、`reads.pull_request` の開いている PR を調べます。本文がこのリポの Issue を閉じる PR なら、番号と保存し直しの案内を `relink` に返します。PR は書きません'
      - id: PW-PR-RESTACK-35
        pattern: unwanted
        statement: 'もし開発ブランチへスタックし直した後に `reads.pull_request` が無いなら、`relink` を返さず、渡すよう案内する文を `warnings` に入れて成功を返します'
      - id: PW-PR-RESTACK-36
        pattern: unwanted
        statement: 'もしスタックしたブランチで `reads.pull_requests` が無いなら、スタックし直しません。親ブランチと読み方を `detail` に入れ、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PR-RESTACK-37
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
  PW-PROJECT-ACTIVATE:
    summary: 初期化済みのボードの設定ファイルを、公式の MCP で読んだ結果から書き、アクティブにします。GitHub を読み書きしません。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'ボードの所有者です。'
      owner_type: '所有者の種類です。個人は `user`、organization は `org` で、`projects_get` に渡した値と同じです。'
      project: 'ボードの番号か名前です。設定ファイルのパスかファイル名でも渡せます。所有者のボードは、公式の MCP の `projects_list`（`list_projects`）で一覧します。'
      reads: 'ボードを公式の MCP で読んだ結果です。`project` は `projects_get` の `get_project`、`projects` は `projects_list` の `list_projects` のすべてのページの結果です。`fields` と `views` は、`projects_list` の `list_project_fields` と `list_project_views` の結果です。'
    constraints: []
    details:
      - '`project` は必須です。'
      - '初期化済みのプロジェクトとは、`pecot-status` のフィールドか、旧い名前の `pecot-workflow-<suffix>` のフィールドを持つプロジェクトです。初期化されていなければ、`project_check` の `fields` を案内して止まります。'
      - '`project` にボードの番号を渡すと `reads.project` を、名前を渡すと `reads.projects` を読みます。どちらのときも、`reads.fields` が要ります。'
      - '`project` にボードの番号か名前を渡すと、そのボードの設定ファイル `<host>_<owner>_<番号>.json` を読んだ結果から作り直し、アクティブなプロジェクトにします。'
      - '`project` に設定ファイルのパスかファイル名を渡すと、ファイルに記録したホスト・所有者・番号で設定ファイルを作り直し、アクティブなプロジェクトにします。'
      - '設定ファイルのパスかファイル名を渡すときは、`host` と `owner` のどちらも要りません。'
      - '設定ファイルの `board_url` は、所有者の種類で `/users/` か `/orgs/` にします。種類は `owner_type`・`projects_get` の結果・設定ファイルの `board_url` の順に決めます。決まらなければ失敗を返します。'
      - '`reads.views` を渡すと、`board_url` を最初のビューの URL にします。'
      - '設定ファイルに既にある次の値は残します。登録したリポジトリと、その開発ブランチ・リリースブランチ・`changelog_file`・packages・リリースの種類と、`aggregation_repo` です。'
      - '同じプロジェクトを指す、別の名前の設定ファイルがあれば、新しい名前に移し、アクティブなプロジェクトも新しい名前にします。`project` の入力と Actions の変数 `PECOT_REVIEW_PROJECT` には、新しい名前を使います。移す元が 2 つ以上あるときは、何も移さずに失敗を返します。移したときは、新しい名前を使う案内を `warnings` に入れます。'
      - '次の選択肢は、ボードにあるときだけ設定ファイルに書きます。pecot-status のフィールドの Blocked と、Status のフィールドの Todo・In Progress・Needs Attention です。'
      - 'Blocked の選択肢の無いボードも受け付けます。pecot-status のフィールドのほかの 6 つの選択肢は必須です。'
      - '`host` が、渡した設定ファイルのホストと違うときは、`warnings` に入れて、設定ファイルのホストを使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        project: 'アクティブにした設定の名前です。'
        configPath: 'プロジェクトの設定ファイルのパスです。'
        change: '設定ファイルがどうなったかです。`create`・`update`・`unchanged` のどれかです。'
        config_moved: '新しい名前に移した設定ファイルの `from`・`to` のファイル名です。移していなければ `null` です。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: 'プロジェクトの番号か名前を渡したのに、`host` か `owner` がありません。'
      - kind: invalid-input
        when: '要る読み取りの結果が `reads` に無いか、`list_project_fields` の結果に次のページがあります。所有者の種類が決まらないときも含みます。'
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP の結果の形と違います。'
      - kind: project-not-found
        when: '`reads.projects` に、名前のボードがありません。'
      - kind: not-initialized
        when: 'プロジェクトが初期化されていません。'
      - kind: config-invalid
        when: '設定ファイルを読み込めません。同じプロジェクトを指す、別の名前の設定ファイルが 2 つ以上あるときも含みます。'
      - kind: invalid-input
        when: '`project` が無いか、知らない引数など、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: destructive
        what: '`.pecot/config/projects/` の下の設定ファイルを作るか更新し、アクティブなプロジェクトを設定します。'
      - target: file
        kind: read
        what: '設定ファイルと、アクティブなプロジェクトの設定を読みます。'
    prerequisites:
      - '公式の GitHub MCP で、ボードとそのフィールドを読んでおきます。'
    idempotent: true
    examples:
      - arguments:
          project: '1'
          host: github.com
          owner: example-org
          owner_type: org
        note: '番号でプロジェクトをアクティブにします。`reads` に `get_project` と `list_project_fields` の結果を渡します。'
    default_notes:
      owner: 'プロジェクトの番号か名前を渡すときは必須です。設定ファイルを渡したときは、ファイルに記録した所有者を使い、`owner` は使いません。'
      owner_type: '`projects_get` の結果か、設定ファイルの `board_url` から決めます。'
      host: 'プロジェクトの番号か名前を渡すときは必須です。設定ファイルを渡したときは、ファイルに記録したホストを使います。'
    behaviors:
      - id: PW-PROJECT-ACTIVATE-04
        pattern: event
        statement: '`project` にプロジェクトの番号か名前を渡すと、読み取りの結果からそのプロジェクトの設定ファイルを作ります'
      - id: PW-PROJECT-ACTIVATE-05
        pattern: event
        statement: '`project` にプロジェクトの番号か名前を渡すと、そのプロジェクトをアクティブにします'
      - id: PW-PROJECT-ACTIVATE-06
        pattern: event
        statement: '`project` に設定ファイルのパスかファイル名を渡すと、`host` を渡さなくても設定ファイルの `host` で同期します'
      - id: PW-PROJECT-ACTIVATE-08
        pattern: event
        statement: '既存の設定ファイルがあるプロジェクトを同期すると、リポジトリごとの `branches`・`changelog_file`・`packages`・`release_type` を引き継ぎます'
      - id: PW-PROJECT-ACTIVATE-09
        pattern: event
        statement: '既存の設定ファイルがあるプロジェクトを同期すると、`aggregation_repo` を引き継ぎます'
      - id: PW-PROJECT-ACTIVATE-12
        pattern: unwanted
        statement: 'もし `host` が要る場面で渡していないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-13
        pattern: unwanted
        statement: 'もし名前で指定したプロジェクトが `reads.projects` に無いなら、`kind` が `project-not-found` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-14
        pattern: unwanted
        statement: 'もし指定したプロジェクトが初期化されていないなら、`project_check` を案内して、`kind` が `not-initialized` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-16
        pattern: unwanted
        statement: 'もし渡した設定ファイルを読めないなら、`kind` が `config-invalid` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-17
        pattern: unwanted
        statement: 'もし `host` が渡した設定ファイルの `host` と違うなら、`warnings` に 1 つ入れます'
      - id: PW-PROJECT-ACTIVATE-18
        pattern: unwanted
        statement: 'もし `host` が渡した設定ファイルの `host` と違うなら、設定ファイルの `host` で同期します'
      - id: PW-PROJECT-ACTIVATE-19
        pattern: unwanted
        statement: 'もし進行の欄に Blocked が無いなら、止めずに同期し、設定ファイルに `blocked` のキーを書きません'
      - id: PW-PROJECT-ACTIVATE-20
        pattern: event
        statement: 'Blocked・In Progress・Needs Attention がボードにあると、同期でその id を設定ファイルに書きます'
      - id: PW-PROJECT-ACTIVATE-21
        pattern: unwanted
        statement: 'もし Status のフィールドが無いなら、設定ファイルに `fields.status` を書きません'
      - id: PW-PROJECT-ACTIVATE-22
        pattern: unwanted
        statement: 'もし進行の欄に必須の値（Blocked を除く 6 つ）が欠けているなら、`kind` が `not-initialized` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-24
        pattern: event
        statement: '`pecot-status` と旧い名前の進行の欄が両方あるボードを渡すと、`pecot-status` の欄で同期します'
      - id: PW-PROJECT-ACTIVATE-25
        pattern: event
        statement: '同期した中身が既存の設定ファイルと同じだと、ファイルを書き換えずに `change` を `unchanged` にし、そのプロジェクトをアクティブにします'
      - id: PW-PROJECT-ACTIVATE-26
        pattern: event
        statement: '同じプロジェクトを指す別の名前の設定ファイルがあると、それを新しい名前に移してアクティブにし、移した元と先を `config_moved` に入れます'
      - id: PW-PROJECT-ACTIVATE-27
        pattern: event
        statement: '旧い名前の進行の欄だけがあるボードを渡すと、初期化済みとして同期します'
      - id: PW-PROJECT-ACTIVATE-28
        pattern: event
        statement: '設定ファイルに `fields.priority`・`fields.size` が残っていると、内容がボードと同じでも設定ファイルを書き直して 2 つを消します'
      - id: PW-PROJECT-ACTIVATE-29
        pattern: event
        statement: '所有者の種類が決まると、`board_url` を個人か organization のボードの URL にし、`reads.views` があれば最初のビューを指します'
      - id: PW-PROJECT-ACTIVATE-30
        pattern: unwanted
        statement: 'もし要る読み取りの結果が `reads` に無いか、`list_project_fields` の結果に次のページがあるなら、読み方を案内して `kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-ACTIVATE-31
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
  PW-PROJECT-CHECK:
    summary: '公式の MCP の `projects_write`（`create_project`）と、github-ops の `project-fields` に渡す値を、書く前に pecot の決まりに照らします。GitHub を読み書きしません。'
    arguments:
      method: '`create` か `fields` です。`create` は `create_project` の前に、`fields` は `project-fields` の前か、ボードに足りない欄を見るときに通します。'
      owner: 'ボードの所有者（ユーザーか組織）です。'
      owner_type: '`create` のときだけ渡します。`create_project` に渡す `owner_type`（`user` か `org`）です。'
      title: '`create` のときだけ渡します。`create_project` に渡す題です。'
      project: '`fields` のときだけ渡します。ボードの番号（`project-fields` の `project`）です。'
      changes: '`fields` のときだけ渡します。`project-fields` の `changes` です。読んだ欄に順に当てて、当てた後のボードを照らします。省くと、今のボードを照らします。'
      lanes: '`fields` のときだけ渡します。`pecot-lane` の欄が持つべき値（作業の領域の英語の名前）です。ボードに lane が無いときは省きます。'
      reads: '公式の MCP の読み取りの結果です。`create` は所有者の `list_projects` の全ページを `projects` に渡します。`fields` はボードの `list_project_fields` の結果を `fields` に渡します。どちらも `projects_list` の結果です。'
    constraints: []
    details:
      - '値を受けて、決まりに外れた所を `problems` に返します。GitHub を読み書きしません。'
      - '`create` では、所有者に同じ題のボードが無いことを見ます。'
      - '`fields` では、`changes` を読んだ欄に当てた後のボードを見ます。pecot-status の欄と選択肢、Status の Needs Attention、`lanes` の値の `pecot-lane` が要ります。'
      - '足りない欄と選択肢は、作る選択肢の色・説明と、足す位置を添えて返します。'
      - '`changes` のうち github-ops が断るものと、カードの値を消すものを、`changes` の位置の項目にします。'
      - '`fields` では、当てた後のボードにある pecot の使わない欄を `deletable` に返します。消すと全カードの値が消えるので、利用者の承認の後にだけ消します。'
      - '外れた所が無ければ、成功の結果の文は `ok` です。あれば、最初の外れた所の `<引数>: <内容>` です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        problems: '決まりに外れた所の配列です。要素は `field`・`code`・`message` を必ず持ちます。受け付ける値が決まっているときは `candidates` に入れます。空なら、値をそのまま書けます。'
        deletable: '`fields` のときだけ入ります。当てた後のボードにある、pecot が使わない欄の名前です。`pecot-priority`・`pecot-size` と、pecot-status と並ぶ旧い `pecot-workflow-<suffix>` の欄です。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP の `projects_list` の結果の形と違います。'
      - kind: invalid-input
        when: '引数の形が誤っています。`method` が `create`・`fields` でないときを含みます。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects: []
    prerequisites: []
    idempotent: true
    examples:
      - arguments:
          method: create
          owner: example-org
          owner_type: org
          title: Example Project
        note: '`reads.projects` に `list_projects` の全ページを渡し、題が空いているかを返します。'
      - arguments:
          method: fields
          owner: example-org
          project: 3
          lanes: [cli, skills]
        note: '`reads.fields` に `list_project_fields` の結果を渡し、ボードに足りない欄と選択肢を返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-CHECK-01
        pattern: event
        statement: '`create` で所有者に同じ題のボードが無いと、GitHub を読み書きせずに、空の `problems` を返します'
      - id: PW-PROJECT-CHECK-02
        pattern: unwanted
        statement: 'もし `create` で所有者に同じ題のボードがあるなら、そのボードの番号を添えた `title-taken` の項目を返します'
      - id: PW-PROJECT-CHECK-03
        pattern: unwanted
        statement: 'もし `create` に `owner_type`・`title` が無いか `changes` を渡したなら、`required`・`unexpected` の項目を返します'
      - id: PW-PROJECT-CHECK-04
        pattern: unwanted
        statement: 'もし `create` で `reads.projects` が無いか最後のページに続きがあるなら、`read-required` の項目で読み方を案内します'
      - id: PW-PROJECT-CHECK-05
        pattern: event
        statement: '`fields` でボードが pecot の欄の決まりに合うと、空の `problems` と空の `deletable` を返します'
      - id: PW-PROJECT-CHECK-06
        pattern: unwanted
        statement: 'もし pecot-status の欄が無いなら、作る選択肢を並べた `missing-field` の項目を返します。旧い名前の欄だけがあるときは、rename を案内します'
      - id: PW-PROJECT-CHECK-07
        pattern: unwanted
        statement: 'もし pecot-status か Status に足りない選択肢があるなら、足す位置を添えた `missing-option` の項目を返します'
      - id: PW-PROJECT-CHECK-08
        pattern: event
        statement: '`changes` を渡すと、読んだ欄に順に当てた後のボードを決まりに照らします'
      - id: PW-PROJECT-CHECK-09
        pattern: unwanted
        statement: 'もし `changes` に github-ops が断る変更かカードの値を消す変更があるなら、`changes` の位置の項目を返します'
      - id: PW-PROJECT-CHECK-10
        pattern: unwanted
        statement: 'もし pecot-status が単一選択の欄でないなら、`field-type` の項目を返します'
      - id: PW-PROJECT-CHECK-11
        pattern: event
        statement: '`lanes` を渡すと、`pecot-lane` の欄が無いか値が足りないときに、足す値を添えた項目を返します'
      - id: PW-PROJECT-CHECK-12
        pattern: event
        statement: '`fields` で当てた後のボードに pecot の使わない欄があると、その名前を `deletable` に並べます'
      - id: PW-PROJECT-CHECK-13
        pattern: unwanted
        statement: 'もし `fields` に `project` が無いか、`create` の引数を渡したか、`reads.fields` が無いなら、その順に項目を返します'
      - id: PW-PROJECT-CHECK-14
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
  PW-PROJECT-GET:
    summary: 設定のキーの値を出します。キーを省くと、アクティブなプロジェクトと登録したリポジトリの要約を出します。
    arguments:
      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。省くと要約を返します。'
    constraints: []
    details:
      - 'アクティブな設定ファイルに保存してある、Epic を集めるリポジトリを `value` に入れて返します。未設定のときは、`value` を入れません。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、`kind` が `invalid-input` の失敗を返します。'
      - '`key` を省くと、設定の名前・host・所有者・番号・`aggregation_repo` を `project` に、リポジトリごとのブランチとリリースの方法を `repositories` に入れます。'
      - '`key` を渡したときの成功の結果の文は、Epic を集めるリポジトリの `owner/repo` です。未設定のときは `none` です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        key: '`key` を渡したときだけ入ります。読んだ設定のキーです。今は `aggregation_repo` だけです。'
        value: 'キーの値です。未設定のときと、`key` を省いたときは入りません。'
        project: '`key` を省いたときだけ入ります。設定の名前（`name`）・`host`・`owner`・`number`・`aggregation_repo`（未設定は `null`）です。'
        repositories: '`key` を省いたときだけ入ります。登録したリポジトリの配列です。要素は `full_name`・`develop_branch`・`release_branch`・`release_type`・`packages` を持ちます。ブランチの未設定は `null` で、`changelog_file` はあるときだけ入ります。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        when: '`key` が `aggregation_repo` ではありません。知らない引数などほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          key: aggregation_repo
        note: 'Epic を集めるリポジトリを返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-GET-01
        pattern: event
        statement: '値を設定していると、その値を結果の `value` に入れます'
      - id: PW-PROJECT-GET-02
        pattern: event
        statement: '未設定だと、結果に `value` を入れずに成功を返します'
      - id: PW-PROJECT-GET-03
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-PROJECT-GET-04
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-PROJECT-GET-05
        pattern: event
        statement: '`key` を省いて呼ぶと、アクティブなプロジェクトの要約を `project` に、登録したリポジトリのブランチとリリースの方法を `repositories` に入れます'
  PW-PROJECT-LINK:
    summary: プロジェクトの設定ファイルに、リポジトリを足すか更新します。GitHub のボードにはつなぎません。
    arguments:
      changelog_file: 'CHANGELOG のファイル名です。'
      clear_packages: '既にある packages の設定を消すかどうかです。消した後の CHANGELOG は、`changelog_file` の値か、既定の `CHANGELOG.md` に戻ります。'
      develop_branch: '開発ブランチの名前です。'
      repo: 'リポジトリの名前です。`owner/repo` の形で渡します。'
      package: 'monorepo のパッケージです。`NAME:PATH` の形で登録します。配列で複数渡せます。要素の例は `pecot:plugins/pecot-workflow/CHANGELOG.md` です。'
      release_branch: 'リリースブランチの名前です。'
      release_type: 'リリースの方法の宣言です。w-release スキルが、この値で手順を選びます。`single`（CHANGELOG が 1 つ）・`multi`（packages）・`nx`（Nx Release）のどれかを渡します。'
    constraints:
      - conflicts: [package, changelog_file]
      - conflicts: [package, clear_packages]
    details:
      - 'アクティブなプロジェクトの設定ファイルに、リポジトリを足します。GitHub を読み書きしません。'
      - 'リポジトリを GitHub のボードにつなぐのは、github-ops の `project-link` の操作です。'
      - '登録済みのリポジトリでは、渡した引数の設定だけを更新します。'
      - '`package` を渡すと、登録済みのリポジトリの packages を置き換えます。`changelog_file` を渡していなくても、設定の `changelog_file` を消します。'
      - '`clear_packages` を渡すと、登録済みのリポジトリの packages を消します。'
      - 'リポジトリの所有者は、プロジェクトの所有者と一致していなければなりません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        repository: '設定に足した（変えた）リポジトリです。`owner/repo` の形です。'
        projectNumber: 'アクティブなプロジェクトの番号です。'
        change: '設定がどうなったかです。`create`（リポジトリを足した）か `update`（項目を変えた）です。'
        configPath: 'プロジェクトの設定ファイルのパスです。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        when: 'リポジトリが `owner/repo` の形でないか、所有者がプロジェクトの所有者と違います。'
      - kind: invalid-input
        when: '`package` を `changelog_file` か `clear_packages` と一緒に渡したか、`package` の形が誤っています。packages を持つリポジトリに `changelog_file` を渡したときと、`release_type` が `single`・`multi`・`nx` のどれでもないときも含みます。'
      - kind: invalid-input
        when: '`repo` が無いか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: destructive
        what: 'アクティブな設定ファイルに、リポジトリを足すか更新します。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          repo: example-org/my-repo
        note: 'リポジトリを登録します。'
      - arguments:
          repo: example-org/my-repo
          package:
            - pecot:plugins/pecot-workflow/CHANGELOG.md
        note: 'monorepo のパッケージを登録します。'
    default_notes:
      release_type: '省くと、packages から推定します。packages があれば `multi`、無ければ `single` です。'
    behaviors:
      - id: PW-PROJECT-LINK-01
        pattern: event
        statement: '未登録のリポジトリを渡すと、GitHub に要求を送らずに、設定ファイルだけに足します'
      - id: PW-PROJECT-LINK-02
