  PW-RELEASE-MERGE:
    constraints: []
    details:
      - Merges the PR with a regular merge (a merge commit), never a squash or a rebase, so that the merge-base is kept.
      - The PR is the pr_ref argument (owner/repo/N).
      - The short form N is rejected even when --repo is given.
      - The global pecot --repo is only compared with the current git remote and is not used as the target.
      - A mismatch between --repo and the current git remote stops the command.
      - Only a PR whose base branch equals the release_branch of the repository in the config file is merged.
      - A PR that is already merged or closed is not merged.
      - A PR with merge conflicts is not merged unless --admin is given.
      - With --admin, only the conflict check is skipped, and the GitHub API still decides whether the merge is allowed.
      - With --delete-branch, the head branch of the PR is deleted from the remote after the merge.
      - A failure to delete the head branch is a warning and does not change the exit status.
      - With --dry-run, nothing is merged or deleted, and --delete-branch has no effect.
      - When the release_branch is the default branch of the repository, GitHub may close the Issues that the PR refers to with a closing keyword.
    stdin: none
    output:
      format: none
    diagnostics: A result line on stderr for the merge and for the deleted branch, or a plan line with --dry-run. A warning line when deleting the branch failed. An error line on a failure, including when --repo differs from the git remote.
    environment: []
    exit_status:
      - code: 0
        when: The PR was merged, or the plan was printed with --dry-run.
      - code: 1
        when: --repo differs from the current git remote, there is no active project, the PR is not found or cannot be read, the PR is already merged or closed, the PR has conflicts and --admin is not given, release_branch is not set, the base branch of the PR is not the release_branch, the GitHub API refused the merge, the repository is ambiguous outside git without --repo, or the project root cannot be determined.
      - code: 2
        when: The PR reference is not in owner/repo/N form, the PR reference is missing, or another command line error occurs.
    on_error: When the merge succeeded and deleting the head branch failed, the PR stays merged and the head branch remains on the remote.
    effects:
      - target: github
        kind: read
        what: Reads the state, the mergeable state, the base branch and the head branch of the PR.
      - target: github
        kind: write
        what: Merges the PR with the merge method merge.
      - target: github
        kind: destructive
        what: Deletes the head branch of the PR from the remote when --delete-branch is given.
      - target: file
        kind: read
        what: Reads the active config file.
    prerequisites:
      - An active project exists (pecot project activate).
      - The release_branch of the repository is set in the config file (pecot project set-repo).
      - A GitHub token is available for the host, with permission to merge the PR.
    idempotent: false
    examples:
      - run: pecot release merge example-org/my-repo/123
        note: Merge the release PR with a merge commit.
      - run: pecot release merge example-org/my-repo/123 --dry-run
        note: Print the plan without merging.
      - run: pecot release merge example-org/my-repo/123 --delete-branch
        note: Merge the release PR and delete its head branch.
    default_notes: {}
    behaviors:
      - id: PW-RELEASE-MERGE-01
        pattern: event
        statement: PR の参照を渡して打つと、その PR を通常のマージ（マージコミット）でマージする
      - id: PW-RELEASE-MERGE-02
        pattern: event
        statement: --delete-branch を付けて打つと、マージの後に PR の head ブランチをリモートから削除する
      - id: PW-RELEASE-MERGE-03
        pattern: event
        statement: --admin を付けて打つと、衝突のある PR でもマージを試みる
      - id: PW-RELEASE-MERGE-04
        pattern: event
        statement: --dry-run を付けて打つと、マージしない
      - id: PW-RELEASE-MERGE-05
        pattern: event
        statement: --dry-run を付けて打つと、予定の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-06
        pattern: event
        statement: --dry-run と --delete-branch を付けて打つと、ブランチを削除しない
      - id: PW-RELEASE-MERGE-07
        pattern: event
        statement: PR をマージすると、merged の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-08
        pattern: event
        statement: head ブランチを削除すると、deleted の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-09
        pattern: unwanted
        statement: もし head ブランチを削除できなかったなら、warning の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-10
        pattern: unwanted
        statement: もし head ブランチを削除できなかったなら、終了コード 0 で終わる
      - id: PW-RELEASE-MERGE-11
        pattern: unwanted
        statement: もし --repo が今の git remote のリポジトリと食い違うなら、error の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-12
        pattern: unwanted
        statement: もし --repo が今の git remote のリポジトリと食い違うなら、終了コード 1 で終わる
      - id: PW-RELEASE-MERGE-13
        pattern: unwanted
        statement: もしアクティブなプロジェクトが無いなら、終了コード 1 で終わる
      - id: PW-RELEASE-MERGE-14
        pattern: unwanted
        statement: もし PR の参照が owner/repo/N の形でないなら、終了コード 2 で終わる
      - id: PW-RELEASE-MERGE-15
        pattern: unwanted
        statement: もし PR が見つからないなら、終了コード 1 で終わる
      - id: PW-RELEASE-MERGE-16
        pattern: unwanted
