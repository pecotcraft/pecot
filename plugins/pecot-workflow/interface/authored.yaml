      - id: PW-DELETE-BRANCH-05
        pattern: event
        statement: '`wip/ブランチ名` を削除すると、`deleted` の行を標準エラーに出します'
      - id: PW-DELETE-BRANCH-06
        pattern: event
        statement: '`--dry-run` を付けて打つと、`dry-run` の行を標準エラーに出します'
      - id: PW-DELETE-BRANCH-07
        pattern: unwanted
        statement: 'もし `wip/ブランチ名` のリモートブランチが無いなら、何も出しません'
      - id: PW-DELETE-BRANCH-08
        pattern: unwanted
        statement: 'もし `wip/ブランチ名` があるのに削除できなかったなら、`warning` の行を標準エラーに出します'
      - id: PW-DELETE-BRANCH-09
        pattern: unwanted
        statement: 'もし `wip/ブランチ名` を削除できなかったなら、終了コード 0 で終わります'
      - id: PW-DELETE-BRANCH-10
        pattern: unwanted
        statement: 'もし削除するブランチが既定ブランチ・`develop_branch`・`release_branch` のどれかなら、保護するブランチを並べた `error` の行を標準エラーに出します'
      - id: PW-DELETE-BRANCH-11
        pattern: unwanted
        statement: 'もし削除するブランチが既定ブランチ・`develop_branch`・`release_branch` のどれかなら、終了コード 1 で終わります'
      - id: PW-DELETE-BRANCH-12
        pattern: unwanted
        statement: 'もし `repo_ref` が `owner/repo` の形でないなら、終了コード 2 で終わります'
      - id: PW-DELETE-BRANCH-13
