  PW-SESSION-FINISH:
    help:
      details:
        - "Cleans up after a merged PR: closes the related Issues, optionally deletes the remote branches and returns the local checkout to the development branch."
        - The related Issues are the closing issues of the PR in its repository and the Issue whose number ends the head branch name. When the base is not the default branch, they also include the Issues of the same repository named after Closes, Fixes or Resolves in the body outside code blocks, inline code and HTML comments, since GitHub reads those keywords only in PRs to the default branch.
        - Does not close an Issue that is already closed, so that the reason it was closed is kept, and writes an unchanged line for it. When the state of an Issue cannot be read, does not close it and writes a warning.
        - Does not close an Epic or an Issue that has sub-issues, and writes a skipped line for it.
        - "After closing the Issues, reads the Issues that wait for them and moves their board column and Status label by the readiness judgement. Issues with a trace of work are not moved. When the judgement does not show the closed Issue as done, reads once more after about 1.5 seconds, and if it still does not, prints a warning that tells to run pecot board sync later and does not move the column."
        - "Prints the Issues whose readiness changed to standard output under the line Readiness changed:, one line per Issue such as - #13 stackable on #12 -> startable. The readiness before the merge is judged by treating the closed Issues and the PR as still open. Nothing is printed when no readiness changed."
        - When a waiting Issue of the stack kind has a branch or a PR, it is a layer stacked on this PR. Prints a warning that tells to restack its branch in its working directory, and never deletes that branch.
        - An Issue that is not on the board of the active project, or that is outside the columns Ready, Blocked, Active and In Review, is neither moved nor listed.
        - With --delete-branch, deletes the remote head branch.
        - Switches the local checkout to the wtN that pecot worktree add recorded inside a worktree (or, without a record, the name of the parent directory of the worktree when it is wtN or base), or to develop_branch otherwise, pulls it from the origin remote, or from the first remote when there is no origin, and deletes the local head branch with git branch -D.
        - Skips the local cleanup when the repository of the current directory differs from the one of the PR.
        - After the local cleanup, removes the flags .pecot-base and .pecot-session-title under .pecot/state/. Leftover .pecot-quick-mode and .pecot-active from older versions are not touched.
        - With --skip-local-cleanup, does not clean up locally and leaves those flags in place.
        - "With --dry-run, writes dry-run: would lines instead of the result lines and changes nothing."
        - "A second run leaves the same state as the first but writes different lines: the remote branch is reported as unchanged and git branch -D on the local branch gives a warning."
        - The short form N of the reference is completed from the value of pecot --repo, or else from the git remote of the current directory.
      examples:
        - run: pecot session finish example-org/my-repo/123 --delete-branch
          note: Clean up after a merged PR and delete its remote branch.
        - run: pecot session finish example-org/my-repo/123 --dry-run
          note: Show what would be done without changing anything.
      default_notes:
        pr_ref: The short form N is completed from the value of pecot --repo, or else from the git remote of the current directory.
    summary: マージ済みの PR の後片付けをします。関連する Issue を閉じ、ブランチを削除し、ローカルを片付けます。
    arguments:
      delete_branch: 'ブランチを削除するかどうかです。'
      dry_run: '実際には片付けず、予定だけを出すかどうかです。'
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      skip_local_cleanup: 'ローカルのブランチの切り替えと削除を飛ばすかどうかです。'
    constraints: []
    details:
      - 'マージ済みの PR の後片付けをします。関連する Issue を閉じ、ローカルのチェックアウトを開発ブランチに戻します。オプションを付けると、リモートブランチも削除します。'
      - '関連する Issue は、PR のリポの closing issues と、head ブランチ名の末尾の番号の Issue です。base が既定ブランチでない PR では、本文の Closes・Fixes・Resolves の後に書いた、PR のリポの Issue も含めます。GitHub がキーワードを読むのは既定ブランチ宛ての PR だけなので、そこで読まない所（コードブロック・インラインコード・HTML コメントの中）は数えません。'
      - '閉じた理由を残すため、すでに閉じた Issue は閉じ直さず、`unchanged` の行を書きます。状態を読めない Issue も閉じず、`warning` の行を書きます。'
      - 'Epic と、sub-issue を持つ Issue は閉じず、`skipped` の行を書きます。'
      - 'Issue を閉じた後、その Issue を待っている Issue を読み、判定に合わせてボードの列と Status の札を動かします。着手の跡がある Issue は動かしません。判定に、閉じた Issue が済んだ前提として出ていないときは、約 1.5 秒後に 1 回だけ読み直します。それでも出なければ、後で `pecot board sync` を打つよう `warning` で知らせ、列を動かしません。'
      - '判定が変わった Issue を、標準出力の `Readiness changed:` の行の下に、1 件 1 行で出します。行は `- #13 stackable on #12 -> startable` の形です。マージ前の判定は、閉じた Issue と PR がまだ開いていたものとして出します。変わった Issue が無ければ、何も出しません。'
      - '待っている Issue のうち、種類が `stack` でブランチか PR を持つものは、この PR の上に積んだ段です。その作業ディレクトリでブランチを載せ直すよう `warning` で知らせます。そのブランチは削除しません。'
      - 'アクティブなプロジェクトのボードに無い Issue と、`Ready`・`Blocked`・`Active`・`In Review` の外の列の Issue は、動かさず、一覧にも出しません。'
      - '`--delete-branch` を付けると、リモートの head ブランチを削除します。'
      - 'ローカルのチェックアウトを切り替える先は、worktree の中では、`pecot worktree add` が記録した `wtN` です。記録が無ければ、worktree の親ディレクトリの名前が `wtN` か `base` のときに、その名前を使います。worktree の外では、`develop_branch` です。切り替えた後、remote の `origin` から pull します。`origin` が無ければ、最初の remote を使います。その後、ローカルの head ブランチを `git branch -D` で削除します。'
      - '今のディレクトリのリポジトリが PR のリポジトリと違うときは、ローカルの片付けを飛ばします。'
      - 'ローカルの片付けの後、`.pecot/state/` の下のフラグを消します。消すのは、`.pecot-base`・`.pecot-session-title` です。古い版の `.pecot-quick-mode`・`.pecot-active` が残っていても触れません。'
      - '`--skip-local-cleanup` を付けると、ローカルを片付けず、これらのフラグも残します。'
      - '`--dry-run` を付けると、結果の行の代わりに `dry-run: would` の行を書き、何も変えません。'
      - '2 回目の実行の後の状態は 1 回目と同じですが、書く行は違います。リモートブランチは `unchanged` として知らせ、ローカルのブランチへの `git branch -D` は `warning` になります。'
      - '参照の短い形の `N` は、`pecot --repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: text
      description: '判定の変わった Issue があるときだけ、`Readiness changed:` の行と、Issue ごとの `- <Issue> <前の判定> -> <後の判定>` の行を出します。無ければ何も出しません。'
    mcp_output:
      fields:
        closedIssues: 'このコマンドが閉じた Issue の番号の配列です。`dry_run` のときは、閉じる予定の番号です。既定ブランチ宛ての PR では、GitHub がマージで先に閉じるので、ふつうは空です。'
        skippedIssues: 'PR が閉じる対象のうち、閉じなかった Issue の配列です。要素は `number` と `reason` を持ちます。`reason` は `epic`（保護している）・`already-closed`・`not-found`・`failed`（`warnings` を見る）のどれかです。`already-closed` には、PR のマージで GitHub が先に閉じた Issue も入ります。'
        deletedBranches: '削除したブランチの配列です。`dry_run` のときは、削除する予定のブランチです。要素は `branch` と `location`（`remote` か `local`）を持ちます。'
        readinessChanges: '判定が変わった Issue の配列です。要素は `issue`（`#N` か `owner/repo#N`）・`from`・`to` を持ちます。`from` と `to` は `blocked`・`startable`・`stackable on #N` のどれかです。無ければ空の配列です。'
        restack: 'この PR の上に積んだ段の配列です。要素は `issue` と、Issue につながるブランチがあれば `branch` を持ちます。その作業ディレクトリで載せ直しが要ります。無ければ空の配列です。'
        currentBranch: 'ローカルの後片付けのあとのブランチです。後片付けを飛ばしたときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も変えていません。'
    diagnostics: '標準エラーに、閉じる Issue の `count` の行を出し、続けて手順ごとに結果の行を 1 つ出します。結果の行は、`closed`・`skipped`・`unchanged`・`deleted`・`moved`・`set`・`updated` です。`--dry-run` のときは、結果の行の代わりに `dry-run: would` の行を出します。失敗した手順には、`warning` の行を出します。ローカルの片付けを飛ばしたときも、`warning` の行を出します。上に積んだ段があるときと、待っている Issue の判定を確かめられないときも、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: github-not-found
        code: 1
        when: 'PR がありません。'
      - kind: pr-state
        code: 1
        when: 'PR がマージされていません。'
      - kind: invalid-input
        code: 2
        when: 'PR の参照の形が誤っているか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'マージされていない PR はそのまま残し、何も変えません。Issue を閉じられなかったときは `warning` として扱い、ほかの Issue と後の手順を続けます。巻き戻しはしません。リモートの head ブランチの削除に失敗したときは、`warning` を書いて後の手順を続けます。checkout に失敗したときは、pull とブランチの削除を飛ばし、フラグは消します。`warning` を出して飛ばした手順があっても、終了コード 0 で終わります。'
    effects:
      - target: github
        kind: read
        what: 'PR と、関連する Issue それぞれの種類と状態を読みます。'
      - target: github
        kind: write
        what: '関連する Issue を閉じます。'
      - target: github
        kind: destructive
        what: 'リモートの head ブランチを削除します。'
      - target: git
        kind: destructive
        what: '開発ブランチか、記録した `wtN`（記録が無ければ親ディレクトリの名前）のブランチを checkout して pull します。ローカルの head ブランチを `git branch -D` で削除します。'
      - target: file
        kind: write
        what: '`.pecot/state/` の下のフラグを消します。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - 'ホストの GitHub トークンが要ります。'
      - 'PR は、マージ済みでなければなりません。'
    idempotent: true
    examples:
