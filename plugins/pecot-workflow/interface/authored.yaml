        when: 'ほかの名前に当たらない失敗です。GitHub へ届かず、コミットの数を数えられないときも含みます。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'GitHub と作業ツリーのどちらにも、何も作りません。手元の ref も動かしません。open の alert か読めない alert が Dependabot だけのときは、`warning` を出して終了コード 0 で終わります。'
    effects:
      - target: github
        kind: read
        what: 'リポジトリの open の Dependabot・code scanning・secret scanning の alert を読みます。GitHub の compare API で、リリースブランチから開発ブランチまでのコミットの数（`ahead_by`）も読みます。'
      - target: git
        kind: read
        what: 'git のルート、`<remote>` の URL、ローカルのタグ、`git ls-remote` で見たリモートのタグを読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルと CHANGELOG を読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
      - '作業ディレクトリは、git のリポジトリの中でなければなりません。GitHub のリポジトリに、開発ブランチとリリースブランチが要ります。remote の `origin`（無ければ最初の remote）は、タグの確認に使います。'
