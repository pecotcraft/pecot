      - id: PW-PROJECT-ACTIVATE-24
        pattern: event
        statement: '設定ファイルのパスかファイル名を渡すと、その設定ファイルの `workflow_suffix` の進行の欄で同期します'
  PW-PROJECT-CREATE:
    help:
      details:
        - Creates a GitHub Projects V2 project for the owner.
        - Adds the pecot-workflow, pecot-priority and pecot-size fields to the project.
        - The pecot-workflow field is created with seven options, including Blocked.
        - Adds the Needs Attention option to the Status field of the project.
        - When an option cannot be added, a warning line is written and the command continues.
        - Writes the config file and makes the project active.
        - Stops without creating anything when the owner is not found.
        - Stops without creating anything when a project with the same title already exists.
        - With --dry-run, checks whether the project already exists and prints a dry-run line for creating it, and creates nothing.
      examples:
        - run: pecot project create example-org "Example Project" --suffix example
          note: Create a project and activate it.
        - run: pecot project create example-org "Example Project" --suffix example --dry-run
          note: Show the planned project without creating it.
      default_notes: {}
    summary: 新しいプロジェクトを作ります。既にあるプロジェクトにフィールドを足すときは、`project init` を使います。
    arguments:
      host: 'GitHub のホストです。'
      owner: 'プロジェクトの所有者です。'
      suffix: 'ワークフローのフィールドに付ける接尾辞です。'
      title: 'プロジェクトの題です。'
      dry_run: '何も書かずに、する予定だけを出すかどうかです。'
    constraints: []
    details:
      - '所有者の GitHub Projects V2 のプロジェクトを作ります。'
      - 'プロジェクトに、pecot-workflow・pecot-priority・pecot-size のフィールドを足します。'
      - 'pecot-workflow のフィールドは、Blocked を含む 7 つの選択肢で作ります。'
      - 'プロジェクトの Status のフィールドに、Needs Attention の選択肢を足します。'
      - '選択肢を足せないときは、`warning` の行を書いて続けます。'
      - '設定ファイルを書き、プロジェクトをアクティブにします。'
      - '所有者が見つからないときは、何も作らずに止まります。'
      - '同じ題のプロジェクトが既にあるときは、何も作らずに止まります。'
      - '`--dry-run` を付けると、プロジェクトが既にあるかを読み、作る操作を `dry-run` の行に出して、何も作りません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        number: '作ったプロジェクトの番号です。`dry_run` のときは入りません。'
        url: '作ったプロジェクトの URL です。`dry_run` のときは入りません。'
        title: 'プロジェクトのタイトルです。'
        owner: 'プロジェクトのオーナーです。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も作っていません。'
    diagnostics: '標準エラーに、次のものの結果の行を出します。作ったプロジェクト、作ったフィールドそれぞれ、足した Needs Attention の選択肢、設定ファイル、アクティブなプロジェクトです。選択肢を足せないときは、`warning` の行を出します。'
    environment: []
    exit_status:
      - kind: github-not-found
        code: 1
        when: '所有者が見つかりません。'
      - kind: already-exists
        code: 1
        when: '同じ題のプロジェクトがあります。'
      - kind: not-initialized
        code: 1
        when: '設定ファイルを作るときに、プロジェクトが pecot-workflow に準拠していません。'
      - kind: project-not-found
        code: 1
        when: '作った直後のプロジェクトを、所有者のプロジェクトの一覧で見つけられません。'
      - kind: invalid-input
        code: 2
        when: '必須の引数か `--suffix` が無いか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: 'プロジェクトを作った後の手順で失敗すると、プロジェクトと、そこまでに作ったフィールドは GitHub に残ります。設定ファイルの生成に失敗すると、プロジェクトと 3 つのフィールドは残り、設定ファイルは書きません。'
    effects:
      - target: github
        kind: write
        what: 'プロジェクトと 3 つのフィールドを作り、Status のフィールドに Needs Attention の選択肢を足します。`--dry-run` のときは書きません。'
      - target: github
        kind: read
        what: '所有者、既にあるプロジェクト、フィールド、つながっているリポジトリを読みます。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下に設定ファイルを書き、アクティブなプロジェクトを設定します。`--dry-run` のときは書きません。'
    prerequisites:
      - 'ホストの GitHub トークンと、所有者のプロジェクトを作る権限が要ります。'
    idempotent: false
    examples:
      - run: pecot project create example-org "Example Project" --suffix example
        note: 'プロジェクトを作り、アクティブにします。'
      - run: pecot project create example-org "Example Project" --suffix example --dry-run
        note: 'プロジェクトを作らずに、する予定を出します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-CREATE-01
        pattern: event
        statement: '新しいタイトルを渡すと、GitHub にプロジェクトを作ります'
      - id: PW-PROJECT-CREATE-02
        pattern: event
        statement: 'プロジェクトを作ると、続けて pecot-workflow の 3 つのフィールドを足します'
      - id: PW-PROJECT-CREATE-03
        pattern: event
        statement: 'フィールドを足すと、設定ファイルを作ります'
      - id: PW-PROJECT-CREATE-04
        pattern: event
        statement: '設定ファイルを作ると、そのプロジェクトをアクティブにします'
      - id: PW-PROJECT-CREATE-05
        pattern: event
        statement: 'プロジェクトを作ると、`created` の行を標準エラーに出します'
      - id: PW-PROJECT-CREATE-06
        pattern: unwanted
        statement: 'もし同じタイトルのプロジェクトが既にあるなら、終了コード 1 で終わります'
      - id: PW-PROJECT-CREATE-07
        pattern: unwanted
        statement: 'もし所有者が見つからないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-CREATE-08
        pattern: unwanted
        statement: 'もしプロジェクトの作成で GitHub API がエラーを返したなら、終了コード 1 で終わります'
      - id: PW-PROJECT-CREATE-09
        pattern: unwanted
        statement: 'もし作ったプロジェクトが pecot-workflow に準拠しないなら、終了コード 1 で終わります'
      - id: PW-PROJECT-CREATE-10
        pattern: unwanted
        statement: 'もし Status に Needs Attention を足せなかったなら、`warning` の行を出して設定ファイルを作ります'
      - id: PW-PROJECT-CREATE-11
        pattern: event
        statement: '`--dry-run` を付けて打つと、プロジェクトを作らず、作る操作を `dry-run` の行で標準エラーに出し、終了コード 0 で終わります'
  PW-PROJECT-GET:
    help:
      details:
        - Prints the Epic aggregation repository stored in the active config file, or "none" when it is not set.
        - The key is aggregation_repo, the only key of the project config for now; any other key is a usage error.
      examples:
        - run: pecot project get aggregation_repo
          note: Print the aggregation repository.
      default_notes: {}
    summary: 設定のキーの値を出します。キーは Epic を集めるリポジトリ（`aggregation_repo`）です。
    arguments:
      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。'
    constraints: []
    details:
      - 'アクティブな設定ファイルに保存してある、Epic を集めるリポジトリを出します。未設定のときは、`none` を出します。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、使い方の誤りとして止まります。'
    stdin: none
    output:
      format: text
      description: 'Epic を集めるリポジトリを `owner/repo` の形で書いた 1 行か、`none` です。'
    mcp_output:
      fields:
        key: '読んだ設定のキーです。今は `aggregation_repo` だけです。'
        value: 'キーの値です。未設定のときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        code: 1
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        code: 1
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        code: 2
        when: 'キーの引数がありません。キーが `aggregation_repo` でないときと、知らないオプションなどほかのコマンドラインの誤りも含みます。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`pecot project activate` で決めます）。'
    idempotent: true
    examples:
      - run: pecot project get aggregation_repo
        note: 'Epic を集めるリポジトリを出します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-GET-01
        pattern: event
        statement: '値を設定していると、その値を標準出力に出します'
      - id: PW-PROJECT-GET-02
        pattern: event
        statement: '未設定だと、`none` を標準出力に出します'
      - id: PW-PROJECT-GET-03
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、終了コード 1 で終わります'
      - id: PW-PROJECT-GET-04
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、終了コード 2 で終わります'
  PW-PROJECT-INIT:
    help:
      details:
        - Adds the pecot-workflow-<suffix>, pecot-priority and pecot-size fields to an existing project.
        - A field that already exists is skipped.
        - The other fields are still created.
        - Adds the Blocked option to a pecot-workflow-<suffix> field that already exists, placed right after Backlog (right before Ready when there is no Backlog, at the end when there is neither).
        - Adds the Needs Attention option at the end of the Status field. When the project has no Status field, nothing is added.
        - Names are compared without regard to case, and an option that already exists is left as it is.
        - The whole option list is sent again with the existing options keeping their id, name, color and description, so the values on the cards stay.
        - When an option cannot be added, a warning line is written and the command continues; the option is not sent again without its id.
        - Before writing anything, checks that an existing pecot-workflow-<suffix> field has the six required options (Backlog, Pending, Ready, Active, In Review, Archived); if one is missing, writes nothing and stops.
        - After that, regenerates the config file from GitHub for the --suffix field and makes the project active, unless a config file exists and its content already equals the one generated from the board.
        - With --dry-run, reads the project and prints dry-run lines for creating the fields, adding the options, writing the config file and switching the active project, and writes nothing.
      examples:
        - run: pecot project init example-org "Example Project" --suffix example
          note: Add the pecot-workflow fields to an existing project, and the Blocked and Needs Attention options to the fields that already exist.
        - run: pecot project init example-org "Example Project" --suffix example --dry-run
          note: Show what would be created and written without changing anything.
      default_notes: {}
    summary: 既にあるプロジェクトに pecot-workflow のフィールドを足します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。
    arguments:
      host: 'GitHub のホストです。'
      name: 'プロジェクトの題です。'
      owner: 'プロジェクトの所有者です。'
      suffix: 'ワークフローのフィールドに付ける接尾辞です。'
      dry_run: '何も書かずに、する予定だけを出すかどうかです。'
    constraints: []
    details:
      - '既にあるプロジェクトに、`pecot-workflow-<suffix>`・`pecot-priority`・`pecot-size` のフィールドを足します。'
      - '既にあるフィールドは飛ばします。'
      - 'そのときも、ほかのフィールドは作ります。'
      - '既にある `pecot-workflow-<suffix>` のフィールドには、Blocked の選択肢を Backlog の直後に足します。Backlog が無ければ Ready の直前、どちらも無ければ末尾に足します。'
      - 'Status のフィールドの末尾に、Needs Attention の選択肢を足します。プロジェクトに Status のフィールドが無いときは、何も足しません。'
      - '名前は、大文字と小文字を区別せずに比べます。既にある選択肢は、そのまま残します。'
      - '選択肢の一覧は、全体を送り直します。既にある選択肢は id・name・color・description を保つので、カードの値は残ります。'
      - '選択肢を足せないときは、`warning` の行を書いて続けます。その選択肢を、id なしで送り直すことはありません。'
      - '何かを書く前に、既にある `pecot-workflow-<suffix>` のフィールドが必須の 6 つの選択肢を持つことを確かめます。6 つは Backlog・Pending・Ready・Active・In Review・Archived です。1 つでも欠けていれば、何も書かずに止まります。'
      - 'その後、`--suffix` のフィールドの設定ファイルを GitHub から作り直し、プロジェクトをアクティブにします。設定ファイルがあり、内容がボードから作るものと既に同じときは行いません。'
      - '`--dry-run` を付けると、プロジェクトを読み、フィールドの作成・選択肢の追加・設定ファイルの書き込み・アクティブなプロジェクトの切り替えを `dry-run` の行に出して、何も書きません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        fields: 'プロジェクトのフィールドの配列です。workflow・priority・size のフィールドと、選択肢を調べたときの Status フィールドを含みます。要素は `name`・`change`・`addedOptions` を持ちます。`change` は `create`（作った）・`update`（選択肢を足した）・`unchanged`（何もしない）・`skip`（フィールドが見つからない）のどれかです。`addedOptions` は足した選択肢の名前の配列で、無ければ空です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も作らず、何も変えていません。'
    diagnostics: '標準エラーに、フィールドごとの結果の行（`created` か `skipped`）と、選択肢ごとの結果の行（`added` か `unchanged`）を出します。Status のフィールドが見つからないときは、`skipped` の行を出します。選択肢を足せないときは、`warning` の行を出します。設定ファイルを書いたときは、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。'
    environment: []
    exit_status:
      - kind: project-not-found
        code: 1
        when: 'プロジェクトが見つかりません。'
      - kind: not-initialized
        code: 1
        when: 'プロジェクトのフィールドを読めません。既にある `pecot-workflow-<suffix>` のフィールドに必須の選択肢が無いときも含みます。'
      - kind: invalid-input
        code: 2
        when: '必須の引数か `--suffix` が無いか、ほかのコマンドラインの誤りがあります。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '失敗した手順より前に作ったフィールドと足した選択肢は、プロジェクトに残ります。選択肢を足せずに `warning` を書いたときも、終了コード 0 で終わります。'
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクト、対象のプロジェクトのフィールド、つながっているリポジトリを読みます。'
      - target: github
        kind: write
        what: 'プロジェクトに足りないフィールドを作ります。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。`--dry-run` のときは書きません。'
      - target: file
        kind: write
        what: '`.pecot/config/projects/` の下に設定ファイルを書き、アクティブなプロジェクトを設定します。既にある設定ファイルが、ボードから作るものと同じときは書きません。`--dry-run` のときは書きません。'
    prerequisites:
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - run: pecot project init example-org "Example Project" --suffix example
        note: '既にあるプロジェクトに pecot-workflow のフィールドを足します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。'
      - run: pecot project init example-org "Example Project" --suffix example --dry-run
        note: 'フィールドと設定ファイルは書かず、する予定を出します。'
    default_notes: {}
    behaviors:
