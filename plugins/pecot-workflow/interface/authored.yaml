      - code: 0
        when: The repository was registered or updated.
      - code: 1
        when: There is no active project, the active config file is broken, the repository is not in owner/repo form or its owner differs from the project owner, the link failed, --package conflicts with --changelog-file or --clear-packages or is malformed, --changelog-file is given for a repository that has packages, --release-type is not single, multi or nx, or the project root cannot be determined.
      - code: 2
        when: The repository argument is missing, or another command line error occurs.
    on_error: The config file is not written when linking the repository fails.
    effects:
      - target: github
        kind: write
        what: Links a new repository to the project.
