      fields:
        project: 'アクティブなプロジェクトの概要です。`name`・`host`・`owner`・`number`・`aggregation_repo` を持ちます。ロードマップのリポジトリが未設定なら、`aggregation_repo` は `null` です。キーは `--json` と同じ snake_case で、中身も `--json` の `project` と同じです。'
        repositories: '登録したリポジトリの配列です。登録順に並びます。キーは `--json` と同じ snake_case です。要素は `full_name`・`owner`・`name`・`develop_branch`・`release_branch`・`dependabot_alerts` を持ちます。ブランチが未設定なら `null` です。`dependabot_alerts` は、読めなかったときは理由の `error` だけを持ちます。読めたときは `enabled`・`open_count`・`max_severity`・`alerts_url` を持ちます。要素は、`release_type`（`single`・`multi`・`nx`）と `packages`（`name` と `changelog` の配列。無ければ空）も持ちます。package の無いリポジトリに CHANGELOG の設定があるときだけ、`changelog_file` も持ちます。この 3 つは MCP の結果にだけ入り、`--json` には出ません。'
        board: 'ボードの状態です。`items` の配列を持ち、Backlog・Pending・Blocked・Ready・Active・In Review にある開いた項目が入ります。キーは `--json` と同じ snake_case で、中身も `--json` の `board` と同じです。要素は `id`・`workflow`（列。無ければ `null`）・`title`・`updatedAt`・`content`・`readiness` を持ちます。`content` は `number`・`state`・`url`・`labels`・`repository` を持ちます。`readiness` は、Ready と Blocked の Issue だけが `kind`・`stackOn`・`reason`・`text` を持ち、ほかの項目は `null` です。サーバが Issue の依存を扱えないときは、`readiness` ごと入りません。'
