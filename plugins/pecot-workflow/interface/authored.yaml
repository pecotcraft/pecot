        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
  PW-RELEASE-CHECK:
    summary: 'github-ops の `release-create` に渡す値を、リリースの前に pecot の決まりに照らします。GitHub API を呼ばず、手元の git と git の remote を読みます。'
    arguments:
      params: 'github-ops の `release-create` の `params` です。`tag`・`sha`・`body`・`name` を持ちます。リリースの種類が nx のリポジトリでは省きます。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
      reads: '公式の MCP の読み取りの結果です。open の alert の一覧を 3 種類と、`params` のタグの `get_release_by_tag` の結果を渡します。'
    constraints: []
    details:
      - '値を受けて、決まりに外れた所を `problems` に返します。GitHub API を呼ばず、何も書きません。'
      - '`reads` の code scanning・secret scanning に open の alert があると、`blocking-alert` の項目にします。'
      - 'open の Dependabot alert は `warnings` に入れて知らせ、リリースを止めません。alert ごとの `#<number>`・パッケージ・severity と、一覧の URL を並べます。'
      - '機能が無効のリポジトリでは、その種類の確認を飛ばして `skipped` に入れます。code scanning の解析がまだ無いときは、alert が 0 件とみなします。'
      - 'alert の一覧を渡していないか、読めなかったか、最後のページに続きがあると、`alerts-unread` の項目にします。'
      - 'リリースの種類が nx のリポジトリでは、alert だけを見ます。`params` は受け付けません。'
      - 'nx でないリポジトリでは、タグの形・CHANGELOG の節・リリースの名前・タグの有無・`sha`・前のリリースからのコミットを見ます。'
      - 'タグは `v<version>` です。packages を設定したリポジトリでは、登録したパッケージの名前を接頭辞にした `<package>-v<version>` です。'
      - '`body` は、CHANGELOG のその版の節と同じでなければなりません。前後の空白は比べません。'
      - 'CHANGELOG は、設定ファイルにあるリポジトリの `changelog_file` か、パッケージの changelog です。無いときは git のルートの `CHANGELOG.md` で、その次が `AIST-CHANGELOG.md` です。'
      - 'リリースの名前は、`name` を省くとタグです。monorepo では `<package> v<version>` です。'
      - 'タグが手元・remote・GitHub のリリースのどれかにあると、`tag-exists` の項目にします。'
      - '`sha` は、remote の `<release_branch>` の先頭でなければなりません。remote は `origin` で、`origin` が無ければ最初の remote です。'
      - '前のリリースのタグから `sha` までのコミットを、手元の git で数えます。前のタグが無いときは数えません。`git fetch` はせず、手元の ref も動かしません。'
      - 'リポジトリは、引数 `repo` から決めます。無ければ remote の `origin` から、`origin` も無ければ最初の remote から決めます。'
      - '`repo` が今の git remote と食い違うときは、`repo` を使います。`warnings` には `using repo <owner/repo> (current Git remote: <owner/repo>)` が入ります。'
      - 'remote の URL から `owner/repo` を読めないときは、`repo` と比べません。`repo` があれば、`repo` を使い、`warnings` に `using repo <owner/repo>` で始まる文を入れます。文の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。無ければ失敗を返し、`detail` が `the repository is ambiguous` で始まります。理由と `repo` の案内が続きます。'
      - '外れた所が無ければ、成功の結果の文は `ok` です。あれば、最初の外れた所の `<引数>: <内容>` です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        problems: '決まりに外れた所の配列です。要素は `field`・`code`・`message` を必ず持ちます。受け付ける値が決まっているときは `candidates` に入れます。空なら、`params` をそのまま `release-create` に渡せます。'
        skipped: '機能が無効なので飛ばした確認の文の配列です。例は `Dependabot alerts (feature disabled)` です。飛ばした確認が無ければ空です。'
        dependabotAlerts: 'Dependabot アラートの状態です。読めなかったときは入りません。`enabled`・`openCount`・`alertsUrl` を必ず持ち、`maxSeverity` は、開いたアラートがあるときだけ入ります。'
        version: '`params` のタグの版です。タグを読めないときと、リリースの種類が nx のときは入りません。'
        releaseNotes: 'CHANGELOG のその版の節で、リリースの本文にする文です。読めないときは入りません。'
        commitCount: '前のリリースのタグから `sha` までのコミットの数です。前のタグが無いときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: git-unresolved
        when: 'git のリポジトリのルートが見つからないか、remote のタグかブランチを読めません。`repo` を省いて git remote から `owner/repo` を読めないときと、git の外で `repo` を省いたときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときは、`detail` が `the repository is ambiguous` で始まります。理由と `repo` の案内が続きます。'
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: repo-setting-missing
        when: 'nx でないリポジトリで、`release_branch` が未設定です。'
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP の結果の形と違います。'
      - kind: invalid-input
        when: '引数の形が誤っています。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: 'git のルート、`<remote>` の URL、手元のタグとコミット、`git ls-remote` で見た remote のタグと `<release_branch>` の先頭を読みます。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルと CHANGELOG を読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'セッションのディレクトリは、git のリポジトリの中でなければなりません。remote の `origin`（無ければ最初の remote）は、タグとリリースブランチの確認に使います。'
      - '設定ファイルに、リポジトリの `release_branch` が要ります（`project_link` で設定します）。リリースの種類が nx のときは要りません。'
    idempotent: true
    examples:
      - arguments:
          params:
            tag: v0.6.1
            sha: 3f2c1e0
            body: '### Fixed'
        note: '`reads` に 3 種類の alert の一覧と `get_release_by_tag` の結果を渡し、`release-create` に渡す値を照らします。'
      - arguments: {}
        note: 'リリースの種類が nx のリポジトリで、`reads` の alert だけを照らします。'
    default_notes:
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-RELEASE-CHECK-01
        pattern: event
        statement: '決まりに合う `params` と読み取りの結果を渡すと、空の `problems` と、`version`・`releaseNotes`・`commitCount` を返します'
      - id: PW-RELEASE-CHECK-02
        pattern: unwanted
        statement: 'もしタグが `v<version>` の形でないなら、`tag-name` の項目に期待するタグの候補を添えます'
      - id: PW-RELEASE-CHECK-03
        pattern: event
        statement: 'packages を設定したリポジトリでは、パッケージ名を接頭辞にしたタグと、そのパッケージの CHANGELOG で照らします'
      - id: PW-RELEASE-CHECK-04
        pattern: unwanted
        statement: 'もし CHANGELOG か、その中の版の節が無いなら、`changelog-missing` の項目を返します'
      - id: PW-RELEASE-CHECK-05
        pattern: unwanted
        statement: 'もし `body` がリリースノート（`releaseNotes`）と違うなら、リリースノートを候補に添えた `body-mismatch` の項目を返します。前後の空白は比べません'
      - id: PW-RELEASE-CHECK-06
        pattern: unwanted
        statement: 'もしリリースの名前が期待する名前と違うなら、`release-name` の項目を返します。`name` を省くと、タグを名前とみなします'
      - id: PW-RELEASE-CHECK-07
        pattern: unwanted
        statement: 'もしタグが手元・remote・GitHub のリリースのどれかにあるなら、`tag-exists` の項目を返します'
      - id: PW-RELEASE-CHECK-08
        pattern: unwanted
        statement: 'もし `sha` が remote の `<release_branch>` の先頭でないか、ブランチが remote に無いなら、`sha-mismatch` の項目を返します'
      - id: PW-RELEASE-CHECK-09
        pattern: unwanted
        statement: 'もし `sha` のコミットが手元に無いなら、`not-found` の項目を返します'
      - id: PW-RELEASE-CHECK-10
        pattern: unwanted
        statement: 'もし前のリリースのタグから `sha` までにコミットが無いなら、`no-commits` の項目を返します。前のタグが無いときは `commitCount` を入れません'
      - id: PW-RELEASE-CHECK-11
        pattern: unwanted
        statement: 'もし open の code scanning か secret scanning の alert があるなら、番号と URL を添えた `blocking-alert` の項目を返します'
      - id: PW-RELEASE-CHECK-12
        pattern: event
        statement: 'open の Dependabot alert があるか一覧を読めないと、止めずに `warnings` で知らせ、状態を `dependabotAlerts` に入れます'
      - id: PW-RELEASE-CHECK-13
        pattern: state
        statement: '機能が無効の間、その種類の確認を飛ばして `skipped` に入れます'
      - id: PW-RELEASE-CHECK-14
        pattern: unwanted
        statement: 'もし alert の一覧が無いか、読めないか、最後のページに続きがあるなら、`alerts-unread` の項目を返します。code scanning の解析がまだ無いときは 0 件とみなします'
      - id: PW-RELEASE-CHECK-15
        pattern: unwanted
        statement: 'もし `reads.release` が無いか、404 でない誤りなら、`read-required` の項目で `get_release_by_tag` の読み方を案内します'
      - id: PW-RELEASE-CHECK-16
        pattern: event
        statement: 'リリースの種類が nx のリポジトリで呼ばれると、alert だけを照らします。`params` を渡すと、`unexpected` の項目を返します'
      - id: PW-RELEASE-CHECK-17
        pattern: unwanted
        statement: 'もし nx でないリポジトリで `params` を省いたなら、`required` の項目と alert の結果を返します'
      - id: PW-RELEASE-CHECK-18
        pattern: unwanted
        statement: 'もし `release_branch` を設定していないなら、設定の仕方を案内して `kind` が `repo-setting-missing` の失敗を返します'
      - id: PW-RELEASE-CHECK-19
        pattern: unwanted
        statement: 'もし `reads` の値が公式の MCP の結果の形でないなら、`kind` が `github-mcp-shape` の失敗を返します'
      - id: PW-RELEASE-CHECK-20
        pattern: unwanted
        statement: 'もし git のルートか、remote のタグか、`repo` を省いたときの remote のリポジトリを読めないなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-RELEASE-CHECK-21
        pattern: unwanted
        statement: 'もし `repo` が git remote と食い違うか remote の URL から読めないなら、`warnings` に入れて `repo` を使います。`repo` も無いときは失敗を返します'
      - id: PW-RELEASE-CHECK-22
        pattern: event
        statement: '対象のリポを含む設定が無いか、決まらないと失敗を返します。`project` で設定の名前を渡すと、その設定を使います'
      - id: PW-RELEASE-CHECK-23
        pattern: ubiquitous
        statement: '常に、リリースノートからは、版の節の本文が使わないリンクと脚注の定義を除きます。ただし、リストや引用の中の定義は残します。節の外にある、本文が使う定義は、本文の末尾に加えます'
  PW-SESSION-FINISH:
    summary: マージ済みの PR の手元の後片付けをします。待っている Issue の判定の変化と、スタックし直す Issue を返します。GitHub を読み書きしません。
    arguments:
      pr_ref: 'PR の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
      reads: '公式の MCP の読み取りの結果です。PR（`pull_request_read` の `get`）は必ず渡します。閉じる Issue の `get_blocking` と、子 PR の `list_pull_requests` も渡します。待っている Issue の判定に要る Issue・blocked-by・PR・ボードは、結果のまま渡します。'
    constraints: []
    details:
      - '`reads.pull_request` の PR がマージ済みかを見て、手元を片付けます。Issue を閉じず、ボードの列も動かしません。マージで動く `pecot-board-sync` のワークフローが行います。'
      - 'リモートの head ブランチを消しません。マージの後にブランチを消すかは、リポの設定で決まります。'
      - 'PR が閉じる Issue の 1 つ目は、本文の Closes・Fixes・Resolves の後に書いた PR のリポの Issue です。コードと HTML コメントの中は数えません。2 つ目は、head ブランチ名の末尾の番号の Issue です。'
      - '`reads.blocking` の、閉じる Issue を待っている開いた Issue ごとに、マージの前と後の判定を求めます。判定が変わった Issue を `readinessChanges` に入れます。`from` は、閉じる Issue と PR がまだ開いていたとしたときの判定です。'
      - '`restack` には 2 種類の Issue を入れます。閉じる Issue に `stack` で載って着手の跡がある Issue と、`reads.children` の開いた子 PR の Issue です。その作業ディレクトリでスタックし直すよう、`warnings` でも知らせます。'
      - '判定に要る読み取りが無い Issue は判定せず、足りない読み取りを `warnings` で案内します。`reads.blocking` か `reads.children` が無いときも、`warnings` で案内します。'
      - 'ローカルのチェックアウトを切り替える先は、worktree の中では、`worktree_add` が記録した `wtN` です。記録が無ければ、worktree の親ディレクトリの名前が `wtN` か `base` のときに、その名前を使います。Claude Code が `.claude/worktrees/<name>` に作った worktree では、`worktree-<name>` を使います。どれでも決まらなければ、ローカルの片付けを飛ばします。worktree の外では、`develop_branch` です。切り替えた後、remote の `origin` から pull します。`origin` が無ければ、最初の remote を使います。その後、ローカルの head ブランチを `git branch -D` で削除します。'
      - '今のディレクトリのリポジトリが PR のリポジトリと違うときは、ローカルの片付けを飛ばします。'
      - 'ローカルの片付けを飛ばしたときと、手順が失敗したときは、その理由を `warnings` に入れます。'
      - 'ローカルの片付けの後、`.pecot/state/` の下の `.pecot-base`・`.pecot-session-title` を消します。古い版の `.pecot-quick-mode`・`.pecot-active` が残っていても触れません。'
      - 'フラグを消すのは、`.pecot-session-title` の番号が PR の閉じる Issue のときと、番号が無いときだけです。ほかの Issue の番号なら、次の Issue の記録なので消しません。'
      - '参照の短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        deletedBranches: '削除したローカルのブランチの配列です。要素は `branch` と `location`（常に `local`）を持ちます。'
        readinessChanges: '判定が変わった Issue の配列です。要素は `issue`（`#N` か `owner/repo#N`）・`from`・`to` を持ちます。`from` と `to` は `blocked`・`startable`・`stackable on #N` のどれかです。無ければ空の配列です。'
        restack: 'マージしたブランチの上にスタックした Issue の配列です。要素は `issue` と、分かれば `branch` を持ちます。その作業ディレクトリでスタックし直しが要ります。無ければ空の配列です。'
        currentBranch: 'ローカルの後片付けのあとのブランチです。後片付けを飛ばしたときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: repo-not-in-project
        when: '対象のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が対象のリポを含まないときも含みます。'
      - kind: project-not-found
        when: '`project` の名前の設定がありません。'
      - kind: pr-state
        when: '`reads.pull_request` の PR がマージされていません。'
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: invalid-input
        when: '`pr_ref` の形が誤っているか、`reads.pull_request` が `pr_ref` の PR でないか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: 'マージされていない PR では、何も変えません。checkout に失敗したときは、pull とブランチの削除を飛ばし、フラグは消します。`warnings` に入れて飛ばした手順があっても、成功を返します。'
    effects:
      - target: git
        kind: destructive
        what: '開発ブランチか、記録した `wtN`（記録が無ければ親ディレクトリの名前か `worktree-<name>`）のブランチを checkout して pull します。ローカルの head ブランチを `git branch -D` で削除します。'
      - target: file
        kind: destructive
        what: '`.pecot/state/` の下のフラグを消します。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'PR は、マージ済みでなければなりません。'
    idempotent: true
    examples:
      - arguments:
          pr_ref: example-org/my-repo/123
          reads:
            pull_request: '<pull_request_read の get の結果>'
        note: 'マージ済みの PR の手元の後片付けをします。`reads` には、公式の MCP で読んだ PR などを渡します。'
    default_notes:
      pr_ref: '短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、今のディレクトリの git remote で補います。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-SESSION-FINISH-01
        pattern: event
        statement: 'マージ済みの PR の読み取りを受けると、手元を片付けます。GitHub を読み書きせず、Issue を閉じず、ボードの列も動かしません'
      - id: PW-SESSION-FINISH-06
        pattern: event
        statement: 'セッションのリポジトリが PR のリポジトリと同じだと、worktree の中なら worktree の `wtN` の、そうでなければ `develop_branch` のブランチに切り替えます。`wtN` は `worktree_add` の記録で決め、記録が無ければ置き場所の親ディレクトリの名前で決めます。Claude Code が作った `.claude/worktrees/<name>` の worktree では、手元の `worktree-<name>` のブランチへ切り替えます'
      - id: PW-SESSION-FINISH-07
        pattern: event
        statement: 'ブランチを切り替えると、`origin` の remote（無ければ最初の remote）から `develop_branch` を pull します'
      - id: PW-SESSION-FINISH-08
        pattern: event
        statement: 'pull すると、ローカルの head ブランチを `git branch -D` で削除し、`deletedBranches` に `local` で入れます'
      - id: PW-SESSION-FINISH-09
        pattern: event
        statement: 'ローカルの片付けを終えると、フラグのファイルを消します'
      - id: PW-SESSION-FINISH-19
        pattern: unwanted
        statement: 'もしセッションのリポジトリが PR のリポジトリと違うなら、`warnings` に 1 つ入れ、ローカルの片付けを飛ばします'
      - id: PW-SESSION-FINISH-23
        pattern: unwanted
        statement: 'もし checkout に失敗したなら、pull と `git branch -D` を飛ばします'
      - id: PW-SESSION-FINISH-24
        pattern: unwanted
        statement: 'もし PR がマージされていないなら、`kind` が `pr-state` の失敗を返し、GitHub の画面でマージするよう案内する文を `detail` に入れ、何も変えません'
      - id: PW-SESSION-FINISH-28
        pattern: unwanted
        statement: 'もし `pr_ref` の形が誤っているか、`reads.pull_request` が `pr_ref` の PR でないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-SESSION-FINISH-33
        pattern: event
        statement: '閉じる Issue を待っている Issue の判定がマージで変わると、その Issue を `readinessChanges` に入れます。変わった Issue が無ければ空の配列にします'
      - id: PW-SESSION-FINISH-35
        pattern: event
        statement: 'マージしたブランチの上にスタックした Issue があると、`restack` に入れ、`pr_restack` でのスタックし直しを `warnings` で案内します'
      - id: PW-SESSION-FINISH-43
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-SESSION-FINISH-44
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
      - id: PW-SESSION-FINISH-46
        pattern: unwanted
        statement: 'もし `.pecot-session-title` の番号が PR の閉じる Issue でないなら、`.pecot-base` と `.pecot-session-title` を消さずに残します'
      - id: PW-SESSION-FINISH-47
        pattern: unwanted
        statement: 'もし worktree の中で戻り先のブランチが決まらないなら、ブランチを切り替えず、`warnings` に入れてローカルの片付けを飛ばします'
      - id: PW-SESSION-FINISH-48
        pattern: unwanted
        statement: 'もし判定に要る読み取りが `reads` に無いなら、その Issue を判定せず、足りない読み取りを `warnings` で案内します'
  PW-SESSION-SHOW:
    summary: セッションのブランチ、リポジトリ、作業中の Issue、スタックの記録、比べる base、worktree を手元で読んで出します。GitHub を読みません。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、対象のリポを含む設定を使います。'
    constraints: []
    details:
      - '今のブランチ、remote の `origin`（無ければ最初の remote）のリポジトリ、セッションの作業中の Issue を返します。どれも `directory` で読みます。'
      - '作業中の Issue は `owner/repo/N` です。`owner/repo` はその remote のリポジトリで、`N` はブランチ名の最後のスラッシュより後ろにある末尾の番号です。remote を読めないか URL の形が合わないとき、ブランチ名の最後の区切りが数字だけでないとき、番号が 0 のとき、detached HEAD のときは、作業中の Issue はありません。'
      - 'Issue の題・本文と、今のブランチを base にした PR は返しません。公式の MCP の `issue_read` と `list_pull_requests` で読みます。'
      - '記録は、`directory` の git リポジトリの toplevel の `.pecot/state/.pecot-base` を読みます。スタック先の Issue を指すときは、`stack` にブランチ・Issue・着手したときのコミットを入れます。記録の形が誤っていれば、`warnings` に入れます。'
      - '`baseBranch` は、作業と比べる remote のブランチです。スタックして親ブランチが remote にあれば `<remote>/<親ブランチ>`、そうでなければ `<remote>/<develop_branch>` です。親ブランチが remote にあるかは、`git fetch` をせずに remote へ尋ねて決めます。届かないときは、追跡参照で決めます。'
      - '親ブランチが remote で見つかっても追跡参照が無いときは、`<remote>/<develop_branch>` と比べます。`warnings` に、`git fetch` の案内を入れます。'
      - '`baseBranch` を決められないときは入れず、`warnings` に理由を入れます。設定を選べないとき、`develop_branch` が設定に無いとき、そのブランチが手元に無いときです。'
      - '`worktree` には、`git worktree list` の出力、今のディレクトリの名前、linked worktree かどうかを入れます。'
      - 'このツールは診断用です。読めない値は省き、失敗を返しません。何も書き込みません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        branch: '今のブランチです。読めなければ入りません。'
        repository: 'git remote のリポジトリ（`owner/repo`）です。読めなければ入りません。'
        activeIssue: '作業中の Issue です。`reference`（`owner/repo/N`）を持ちます。無ければ入りません。'
        stack: '`.pecot-base` のスタックの記録です。`branch`・`stackedOn`（`owner/repo/N`）・`sha` を持ちます。スタックしていなければ入りません。'
        baseBranch: '作業と比べる remote のブランチ（`<remote>/<branch>`）です。決められなければ入りません。'
        worktree: '`list`（`git worktree list` の出力）・`directoryName`（今のディレクトリの名前）・`isWorktree` を持ちます。`isWorktree` は linked worktree かどうかで、決められなければ入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '知らない引数や、実在しない `directory` など、引数の誤りです。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: git
        kind: read
        what: '今のブランチ・remote・worktree の一覧を読み、スタックしているときは親ブランチが remote にあるかを `git ls-remote` で尋ねます。'
      - target: file
        kind: read
        what: '`.pecot/state/.pecot-base` と、プロジェクトの設定ファイルを読みます。'
    prerequisites: []
    idempotent: true
    examples:
      - arguments:
          directory: .
        note: '今のディレクトリのセッションの状態を返します。'
    default_notes:
      directory: '省くと、今のディレクトリを読みます。'
      project: '省くと、対象のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブな設定を使います。'
    behaviors:
      - id: PW-SESSION-SHOW-01
        pattern: event
        statement: '呼ぶと、GitHub を読まずに、今のブランチ・remote のリポジトリ・作業中の Issue の参照・`worktree` を返します'
      - id: PW-SESSION-SHOW-02
        pattern: state
        statement: '`.pecot-base` がスタック先の Issue を指す間、`stack` にブランチ・Issue・コミットを入れます'
      - id: PW-SESSION-SHOW-03
        pattern: event
        statement: 'スタックしていないと、`baseBranch` に `<remote>/<develop_branch>` を入れます'
      - id: PW-SESSION-SHOW-04
        pattern: event
        statement: 'スタックしていて親ブランチが remote にあると、`baseBranch` に `<remote>/<親ブランチ>` を入れます。remote に無いと答えたときは `<remote>/<develop_branch>` を入れます'
      - id: PW-SESSION-SHOW-05
        pattern: unwanted
        statement: 'もし `baseBranch` を決められないなら、`baseBranch` を入れず、`warnings` に理由を入れ、失敗を返しません'
      - id: PW-SESSION-SHOW-06
        pattern: unwanted
        statement: 'もしブランチ名が番号で終わらないなら、`activeIssue` を入れません'
  PW-SESSION-START:
    summary: '`github-ops` の `link-branch` で作ったブランチの着手を手元に記録します。GitHub を読み書きしません。'
    arguments:
      issue_ref: '作業の Issue の参照です。`owner/repo/N` の形で渡します。'
      base: '`link-branch` の結果の `base` です。ブランチを作った元のブランチです。'
      sha: '`link-branch` の結果の `sha` です。ブランチを作った元のコミットの SHA を、省かずに渡します。'
      stacked_on: '`branch_check` の結果の `stacked_on` です。スタックしたときだけ渡します。'
      title: '作業の Issue の題です。セッション名に使います。'
      reads: '公式の MCP の読み取りの結果です。`pull_requests` に、今のブランチの `list_pull_requests`（`head` に `<owner>:<今のブランチ>`、`state` に `all`）の結果を渡します。'
    constraints: []
    details:
      - '`.pecot/state/.pecot-base` に、`base`・`sha`、スタックしたときはスタック先の Issue を書きます。'
      - '作業ディレクトリ `.pecot/work/<N>/` を作り、セッション名を `.pecot/state/.pecot-session-title` に書きます。'
      - 'ブランチを作らず、チェックアウトもせず、ボードの列も動かしません。ブランチは、`branch_check` で確かめた引数で `github-ops` の `link-branch` が作ります。'
      - '前にマージされた PR の手元の後片付けの取りこぼしを確かめます。見るのは、今のディレクトリのリポが Issue のリポで、今のブランチ名が `/<N>` で終わるときです。'
      - '`reads.pull_requests` のそのブランチの PR がマージ済みで、開いた PR が無ければ、取りこぼしです。`warnings` と `leftovers` に入れ、呼ぶ `session_finish` を添えます。取りこぼしがあっても止めません。'
      - '`reads.pull_requests` が無いときは、取りこぼしを確かめず、読むツールを `warnings` で案内します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        repository: 'ブランチのリポジトリ（`owner/repo`）です。'
        base: 'ブランチを作った元のブランチです。'
        stackedOn: 'スタック先の Issue の番号です。スタックしていなければ入りません。'
        issue: '作業の Issue（`owner/repo/N`）です。'
        workDirectory: '作業ディレクトリの絶対パスです。作れなかったときは入りません。'
        leftovers: '手元の後片付けが残った、前にマージされた PR の配列です。要素は `pullRequest`（`owner/repo/N`）を持ちます。無ければ入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: invalid-input
        when: '`issue_ref` か `stacked_on` が `owner/repo/N` の形でないか、`sha` が SHA の形でないか、ほかの引数の誤りがあります。'
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: write
        what: '`.pecot/state/.pecot-base`・`.pecot/state/.pecot-session-title` を書き、`.pecot/work/<N>/` を作ります。'
      - target: git
        kind: read
        what: '今のブランチと remote を読みます。'
    prerequisites:
      - 'ブランチを `github-ops` の `link-branch` で作り、チェックアウトしておきます。'
    idempotent: true
    examples:
      - arguments:
          issue_ref: example-org/my-repo/42
          base: main
          sha: 0123456789abcdef0123456789abcdef01234567
          title: 一覧画面に状態の列を出す
        note: '`link-branch` で作ったブランチの着手を記録します。'
    default_notes:
      stacked_on: '省くと、スタックしていないものとして記録します。'
      reads: '省くと、後片付けの取りこぼしを確かめません。'
    behaviors:
      - id: PW-SESSION-START-01
        pattern: event
        statement: '`issue_ref`・`base`・`sha` を受けると、GitHub を読み書きせず、ブランチを作らずに、`.pecot-base`・作業ディレクトリ・セッション名を書きます'
      - id: PW-SESSION-START-02
        pattern: event
        statement: '`stacked_on` を受けると、`.pecot-base` にスタック先の Issue を書き、`stackedOn` にその番号を入れます'
      - id: PW-SESSION-START-03
        pattern: event
        statement: '今のブランチの PR がマージ済みで開いた PR が無いと、`warnings` と `leftovers` に入れ、呼ぶ `session_finish` を添えます'
      - id: PW-SESSION-START-04
        pattern: unwanted
        statement: 'もし `reads.pull_requests` が無いなら、取りこぼしを確かめず、読むツールを `warnings` で案内します'
      - id: PW-SESSION-START-05
        pattern: unwanted
        statement: 'もし `issue_ref`・`stacked_on` が `owner/repo/N` の形でないか、`sha` が SHA の形でないなら、何も書かずに `kind` が `invalid-input` の失敗を返します'
  PW-WORKFLOW-DOCTOR:
    summary: ワークフローの雛形と、雛形の要る設定が、導入先のリポにそろっているかを確かめます。
    arguments:
      name: '雛形の一覧の名前です。`board-sync`・`review`・`handoff`・`auto`・`github-ops` のどれかです。'
      directory: '対象の Git リポジトリの中のディレクトリです。サブディレクトリでも、リポのルートを使います。絶対パスと相対パスのどちらも渡せます。省くと、セッションのディレクトリです。'
      reads: 'github-ops の `workflow-doctor` の操作の結果を `settings` に渡します。`PECOT_RESULT` の行の JSON か、その `result` です。github-ops をまだ動かせないときは、省くか失敗の結果を渡します。'
    constraints: []
    details:
      - '`directory` のリポに、名前の雛形のワークフローのファイルと、雛形が要る GitHub の設定がそろっているかを確かめます。GitHub を読み書きせず、何も書きません。'
      - 'リポは `directory` の git remote から読みます。プロジェクトの設定とボードは読みません。'
      - '確かめた項目を、結果の `items` に 1 つずつ入れます。状態の `state` は `ok`・`missing`・`outdated`・`skipped` のどれかです。'
      - '項目は、ワークフローのファイル、その 1 行目の版の目印、雛形が要る secret と変数です。`review` では、Claude の GitHub App も項目です。`handoff`・`auto`・`github-ops` は Claude の GitHub App を使いません。'
      - '`review` と `handoff` の要る設定は同じです。変数 `PECOT_AGENT_APP_CLIENT_ID` があるときだけ、secret `PECOT_AGENT_APP_PRIVATE_KEY` が要り、その項目を入れます。secret `CLAUDE_CODE_OAUTH_TOKEN` か、`PECOT_AGENT_ANTHROPIC_*` の 4 つの変数のすべてが要ります。'
      - '`auto` では、変数 `PECOT_AGENT_APP_CLIENT_ID` と secret `PECOT_AGENT_APP_PRIVATE_KEY` の両方が、いつも要ります。それぞれを項目に入れます。モデルの認証は `review` と同じです。'
      - '`board-sync` では、token の組が 1 つ要ります。1 つは、変数 `PECOT_BOARD_SYNC_APP_CLIENT_ID` と secret `PECOT_BOARD_SYNC_APP_PRIVATE_KEY` の組です。もう 1 つは、変数 `PECOT_BOARD_SYNC_USE_PAT` と secret `PECOT_BOARD_SYNC_TOKEN` の組です。'
      - '同梱の雛形が pecot の action を使うときは、ファイルが npx の `@pecot/workflow-mcp` でなく pecot の action を呼んでいるかを項目に入れます。npx で `@pecot/workflow-mcp` を呼ぶファイルは `outdated` です。'
      - 'secret と変数の名前は、`reads.settings` から読みます。github-ops がリポと organization の単位の一覧を読み、名前だけを返します。'
      - '`reads.settings` の一覧が `complete` でないと、その一覧に名前の見つからない項目を `skipped` にします。`skipped` は足りないと数えません。'
      - '`reads.settings` が無いか失敗の結果なら、secret と変数の項目をすべて `skipped` にします。'
      - '`review` で、Claude の GitHub App が入っているかは、リポのトークンでは読めません。いつも `skipped` で入れます。'
      - '`missing` か `outdated` の項目が 1 つでもあると、失敗を返します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        repository: 'git remote のリポジトリです。`owner/repo` の形です。'
        items: '確かめた項目の一覧です。項目ごとに `name`（確かめたもの）と `state`（`ok`・`missing`・`outdated`・`skipped`）を持ちます。失敗のときも入ります。'
        ready: '`missing` と `outdated` の項目が無いかどうかです。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: repo-setting-missing
        when: '`missing` か `outdated` の項目があります。`detail` が、足りない項目の数を示します。'
      - kind: invalid-input
        when: '名前が雛形の一覧に無いか、`directory` が無いパス・ファイル・読めないディレクトリです。`reads.settings` が `workflow-doctor` の結果の形でないときと、ほかの引数の誤りも含みます。'
      - kind: git-unresolved
        when: '`directory` が Git リポジトリの外か、その git remote からリポジトリを読めません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: '`missing` か `outdated` の項目があるときは、`kind` が `repo-setting-missing` の失敗を返し、`detail` に足りない項目の数を入れます。この失敗の結果にも、`repository`・`items`・`ready` が入ります。'
    effects:
      - target: git
        kind: read
        what: '`directory` を含むリポのルートと、その remote の URL を読みます。'
      - target: file
        kind: read
        what: 'リポのルートの下のワークフローのファイルと、同梱の雛形を読みます。'
    prerequisites:
      - 'secret と変数を確かめるには、先に github-ops の `workflow-doctor` の操作を動かし、その結果を `reads.settings` に渡します。'
    idempotent: true
    examples:
      - arguments:
          name: review
        note: '自動レビューのファイルと設定を確かめます。`reads.settings` に github-ops の `workflow-doctor` の結果を渡します。'
    default_notes:
      directory: 'セッションのディレクトリです。'
    behaviors:
      - id: PW-WORKFLOW-DOCTOR-01
        pattern: event
        statement: '呼ぶと、確かめた項目を、`name` と `state` の組で結果の `items` に入れます'
      - id: PW-WORKFLOW-DOCTOR-02
        pattern: unwanted
        statement: 'もしワークフローのファイルが無いなら、その項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-03
        pattern: unwanted
        statement: 'もしファイルの版が同梱の雛形より古いなら、その項目を `outdated` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-04
        pattern: unwanted
        statement: 'もし変数 `PECOT_AGENT_APP_CLIENT_ID` を置き、秘密鍵の secret を置いていないなら、その項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-05
        pattern: unwanted
        statement: 'もしモデルの認証の secret も、4 つの変数のそろった組も無いなら、その項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-06
        pattern: event
        statement: 'ファイルと設定がそろっていると、`ready` を `true` にして成功を返します'
      - id: PW-WORKFLOW-DOCTOR-07
        pattern: event
        statement: '`review` を確かめると、Claude の GitHub App は読まずに、その項目を `skipped` で入れます'
      - id: PW-WORKFLOW-DOCTOR-08
        pattern: unwanted
        statement: 'もし `reads.settings` の secret か変数の一覧が `complete` でないなら、その一覧に名前の見つからない項目を `skipped` で入れ、足りないと数えません'
      - id: PW-WORKFLOW-DOCTOR-12
        pattern: unwanted
        statement: 'もし名前が雛形の一覧に無いなら、一覧の名前を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-13
        pattern: unwanted
        statement: 'もし Git リポジトリの外か、git remote からリポジトリを読めないなら、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-14
        pattern: event
        statement: 'リポのサブディレクトリを `directory` に渡すと、リポのルートに置いたワークフローのファイルを見ます'
      - id: PW-WORKFLOW-DOCTOR-15
        pattern: event
        statement: '`review` と `handoff` で、変数 `PECOT_AGENT_APP_CLIENT_ID` が無いと、秘密鍵の secret の項目を入れません'
      - id: PW-WORKFLOW-DOCTOR-16
        pattern: event
        statement: '`handoff`・`auto`・`github-ops` のどれかを確かめると、Claude の GitHub App の項目を入れません'
      - id: PW-WORKFLOW-DOCTOR-17
        pattern: unwanted
        statement: 'もし `auto` で、App の Client ID の変数か秘密鍵の secret が無いなら、無いものの項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-18
        pattern: unwanted
        statement: 'もし置いたファイルが npx で `@pecot/workflow-mcp` を呼ぶか、同梱の雛形の使う pecot の action を呼ばないなら、その項目を `outdated` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-19
        pattern: unwanted
        statement: 'もし `board-sync` で、App の組と PAT の組のどちらもそろっていないなら、token の組の項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-20
        pattern: unwanted
        statement: 'もし `reads.settings` が無いか失敗の結果なら、secret と変数の項目を `skipped` にし、足りないと数えません'
      - id: PW-WORKFLOW-DOCTOR-21
        pattern: unwanted
        statement: 'もし `reads.settings` が `workflow-doctor` の結果の形でないなら、渡し方を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
  PW-WORKFLOW-INSTALL:
    summary: pecot が同梱する GitHub Actions のワークフローの雛形を、リポに書き出します。
    arguments:
      name: '雛形の一覧の名前です。`board-sync`・`review`・`handoff`・`auto`・`github-ops` のどれかです。'
      check: '書き出さずに、置いたファイルの版が同梱の雛形と同じかを確かめるかどうかです。'
      force: 'ファイルが既にあるときに上書きするかどうかです。'
      directory: '対象の Git リポジトリの中のディレクトリです。サブディレクトリでも、リポのルートを使います。絶対パスと相対パスのどちらも渡せます。省くと、セッションのディレクトリです。'
      reads: '公式の MCP の読み取りの結果です。雛形が pecot の action を使うときは、`get_commit` の結果を `commit` に渡します。`owner` は `pecotcraft`、`repo` は `pecot`、`sha` は `pecot-actions/v<版>` です。`check` では要りません。'
    constraints:
      - conflicts: [check, force]
    details:
      - '名前の雛形を、`directory` のリポに書き出します。`review` の置き先は `.github/workflows/pecot-review.yml` です。'
      - '`handoff` の置き先は `.github/workflows/pecot-handoff.yml` です。PR がマージされると、GitHub Actions で、親 Epic へ merge-diff のコメントを、後続の Issue へ precede-notify のコメントを書きます。モデルの認証は `review` と同じで、Claude の GitHub App は要りません。'
      - '`auto` の置き先は `.github/workflows/pecot-auto.yml` です。起動ラベルを付けた Issue を、GitHub Actions で直し、PR まで作ります。自前の GitHub App の変数 `PECOT_AGENT_APP_CLIENT_ID` と secret `PECOT_AGENT_APP_PRIVATE_KEY` の両方が、いつも要ります。`review`・`handoff` では、変数があるときだけ secret が要ります。モデルの認証は `review` と同じで、Claude の GitHub App は要りません。'
      - '`board-sync` の置き先は `.github/workflows/pecot-board-sync.yml` です。PR と Issue が変わるとボードの列を直し、マージした PR の Issue を閉じます。GitHub App か個人のアクセストークンの、どちらかの組の変数と secret が要ります。'
      - '雛形が pecot の action をリリースのタグ（`pecot-actions/v<版>`）で指すときは、`reads.commit` の SHA に直します。`pecotcraft/pecot/actions/<処理>@<SHA> # pecot-actions/v<版>` の形で書きます。GitHub は読みません。'
      - '`reads.commit` が無ければ、`get_commit` の読み方を `detail` に入れて、何も書かずに止まります。'
      - '親のディレクトリが無ければ作ります。'
      - '書き出した後は、モデルの認証を設定し、`workflow_doctor` で確かめます。`review` では、その前に Claude の GitHub App を入れます。`auto` では、その前に自前の GitHub App の変数と secret を設定します。'
      - 'ファイルが既にあるときは、`force` が無ければ失敗を返します。'
      - '`force` では、利用者が begin と end の印の間に足した行を、結果の `removedLines` と `warnings` に入れてから上書きします。'
      - '`check` では何も書きません。ファイルの 1 行目の版が同梱の雛形と同じかを確かめ、結果の `upToDate` に入れます。ファイルが無いか古いときは、更新の呼び方を `detail` に入れて失敗を返します。'
      - '合言葉や上限など利用者が変える値は、リポの変数にあります。ファイルを上書きしても消えません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        path: 'リポのルートからのワークフローのファイルのパスです。'
        version: '同梱の雛形の版です。'
        installedVersion: '置いてあったファイルの版です。ファイルが無いか、版の目印が無いときは入りません。'
        written: 'ファイルを書いたかどうかです。`check` のときは、いつも `false` です。'
        upToDate: '`check` のときだけ入ります。置いたファイルの版が同梱の雛形と同じかどうかです。'
        removedLines: '既にあるファイルを上書きするときだけ入ります。利用者が印の間に足した行で、雛形の中身に置き換わります。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: already-exists
        when: 'ファイルが既にあり、`force` がありません。'
      - kind: not-ready
        when: '`check` で、ファイルが無いか、版が同梱の雛形より古いです。'
      - kind: invalid-input
        when: '名前が雛形の一覧に無いか、`check` を `force` と一緒に渡したか、`directory` が無いパス・ファイル・読めないディレクトリです。pecot の action を使う雛形で `reads.commit` が無いときと、ほかの引数の誤りも含みます。'
      - kind: github-mcp-shape
        when: '`reads.commit` に渡した値が、公式の GitHub MCP の `get_commit` の結果の形と違います。'
      - kind: git-unresolved
        when: '`directory` が Git リポジトリの外です。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ファイルを書けないときも含みます。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: '`check` でファイルが無いか古いときは、`kind` が `not-ready` の失敗を返し、`detail` に `workflow_install` での更新の呼び方を入れます。この失敗の結果にも、`path`・`version`・`written`・`upToDate` が入ります。ファイルが既にあって `force` が無いときは、`kind` が `already-exists` の失敗を返し、`detail` に `force` を付けた呼び方を入れます。'
    effects:
      - target: git
        kind: read
        what: '`directory` を含むリポのルートを読みます。'
      - target: file
        kind: read
        what: '同梱の雛形と、リポのルートの下に置いてあるワークフローのファイルを読みます。'
      - target: file
        kind: write
        what: 'リポのルートの下に、ワークフローのファイルを書きます。'
      - target: file
        kind: destructive
        what: '`force` のときは、既にあるファイルを上書きします。'
    prerequisites:
      - '雛形が pecot の action を使うときは、先に公式の MCP の `get_commit` でタグの commit を読みます。'
    idempotent: false
    examples:
      - arguments:
          name: review
        note: '自動レビューのワークフローを書き出します。`reads.commit` に、雛形のタグの `get_commit` の結果を渡します。'
      - arguments:
          name: review
          check: true
        note: '置いたワークフローが新しいかを確かめます。'
      - arguments:
          name: review
          force: true
        note: '置いたワークフローを、同梱の版に更新します。'
    default_notes:
      directory: 'セッションのディレクトリです。'
    behaviors:
      - id: PW-WORKFLOW-INSTALL-01
        pattern: event
        statement: '置き先にファイルが無いとき呼ぶと、雛形を書き出し、結果の `written` を `true` にします'
      - id: PW-WORKFLOW-INSTALL-02
        pattern: event
        statement: '雛形を書き出すと、結果の `path` に置き先を、`version` に同梱の雛形の版を入れます'
      - id: PW-WORKFLOW-INSTALL-04
        pattern: unwanted
        statement: 'もし置き先にファイルのあるとき `force` を付けずに呼ぶなら、何も書かずに、`kind` が `already-exists` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-05
        pattern: event
        statement: '`force` を付けて呼ぶと、既にあるファイルを雛形で上書きし、`written` を `true` にします'
      - id: PW-WORKFLOW-INSTALL-06
        pattern: event
        statement: '`force` で、利用者の足した行が印の間にあると、消える行を `removedLines` と `warnings` に入れます'
      - id: PW-WORKFLOW-INSTALL-07
        pattern: event
        statement: '置いたファイルの版が同梱の雛形と同じとき `check` を付けて呼ぶと、何も書かずに、`upToDate` を `true` にして成功を返します'
      - id: PW-WORKFLOW-INSTALL-08
        pattern: unwanted
        statement: 'もし `check` で、ファイルが無いか版が古いなら、更新の呼び方を `detail` に入れて、`kind` が `not-ready` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-09
        pattern: unwanted
        statement: 'もし名前が雛形の一覧に無いなら、一覧の名前を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-10
        pattern: unwanted
        statement: 'もし `check` を `force` と一緒に渡したなら、何も書かずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-11
        pattern: event
        statement: 'リポのサブディレクトリを `directory` に渡すと、リポのルートからの置き先に書き出します'
      - id: PW-WORKFLOW-INSTALL-12
        pattern: unwanted
        statement: 'もし `directory` が Git リポジトリの外なら、何も書かずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-15
        pattern: event
        statement: '雛形が pecot の action をタグで指すと、GitHub を読まずに、タグを `reads.commit` の SHA に直し、`<SHA> # <タグ>` の形で書き出します'
      - id: PW-WORKFLOW-INSTALL-17
        pattern: unwanted
        statement: 'もし pecot の action を使う雛形で `reads.commit` が無いなら、読み方を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-18
        pattern: unwanted
        statement: 'もし `reads.commit` の値が公式の MCP の結果の形でないなら、何も書かずに、`kind` が `github-mcp-shape` の失敗を返します'
  PW-WORKTREE-ADD:
    summary: 新しい worktree を作ります。
    arguments:
      allow_existing_branch: '既にあるブランチを、upstream が `develop_branch` と違っても使い回してよいかどうかです。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、remote のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブなプロジェクトを使います。'
      base: '分岐元のブランチです。'
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      no_copy: '追跡していないファイルのコピーを飛ばすかどうかです。'
      no_link: 'シンボリックリンクの作成を飛ばすかどうかです。'
      path: 'worktree を作る場所です。'
      setup: '作った後で動かすコマンドです。'
    constraints: []
    details:
      - '`directory` のリポジトリの worktree を、`<プロジェクトのルート>/<wtN>/<リポジトリのディレクトリ名>` に作ります。ブランチは、`wtN` という名前の新しいブランチです。'
      - 'プロジェクトのルートは、`<プロジェクトのルート>/base/<リポジトリ>` の配置での `base/` の親です。'
      - 'この配置の外のリポジトリでは、失敗を返します。'
      - 'このリポジトリの worktree がまだ無い `wtN` のセットのうち、番号が最小のものに加わります。どのセットにも既にあるときは、最大の N に 1 を足したセットを始めます。'
      - 'このリポジトリの worktree が既に使っている `wtN` は、すべて飛ばします。`path` で作った worktree も含みます。その worktree は、記録か、チェックアウトしているブランチ `wtN` で見つけます。'
      - '新しい worktree の git の管理ディレクトリに、`wtN` を記録します。`session_finish` が、`wtN` へ戻るためにこの記録を読みます。'
      - 'ブランチは `<remote>/<base>` から作り、そのブランチを upstream にします。`<base>` は、引数 `base` か、プロジェクトの設定にあるリポジトリの `develop_branch` です。`<remote>` は、プロジェクトの設定にあるリポジトリを指す remote です。`origin` を先に見て、次に `git remote` の順で見ます。'
      - 'ブランチ `wtN` が既にあるときは、失敗を返します。upstream が `<remote>/<base>` のときと、`allow_existing_branch` を付けたときは別です。'
      - 'upstream が合っていて、どの worktree も使っていないブランチは、消して作り直します。'
      - 'worktree を作る前に、メインの worktree で `git worktree prune` を動かします。'
      - 'メインの worktree に、`.pecot/config/worktree-config.json` と `.pecot/config/.worktreeignore` が要ります。どちらも `worktree_init` が作ります。'
      - 'リポジトリは、プロジェクトの設定の `repositories` か `aggregation_repo` に無ければなりません。含む設定が 2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - '`worktree-config.json` のシンボリックリンクを作ってから、メインの worktree で git が無視しているファイルをコピーします。`.worktreeignore` が除くファイルと、作ったシンボリックリンクの下のファイルはコピーしません。コピーの後、新しい worktree で setup のコマンドを動かします。'
      - '`path` を付けると、そのパスに worktree を作り、ファイルもそのパスへコピーします。'
      - '`path` を付けると、シンボリックリンクと `.pecot/.gitignore` も、そのパスの worktree に作ります。'
      - 'リンクのパスが `.pecot/` で始まるときは、リンクを作る前にプラグインのスクリプトを動かし、新しい worktree に `.pecot/.gitignore` を書きます。'
      - 'setup のコマンドは、引数 `setup` か、`worktree-config.json` の `setup_command` です。シェルを通して動かし、標準入力は閉じ、`setup_command_timeout` で時間切れにします。'
      - 'setup のコマンドが失敗するか時間切れになると、`warnings` に入れ、`setupFailed` を `true` にして成功を返します。'
      - '次のリンクは、`warnings` に入れて飛ばし、成功を返します。リンク先が無いもの、パスを git が追跡しているもの、作れないものです。'
      - 'devcontainer が要ります。'
      - 'devcontainer の確認がどれも通らないときは、何もせずに失敗を返します。'
      - 'remote の URL から `owner/repo` を読めないときは、引数 `repo` と比べません。`repo` があれば、`warnings` に `using repo <owner/repo>` で始まる文を入れます。文の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。無ければ失敗を返し、`detail` が `the repository is ambiguous` で始まります。理由と `repo` の案内が続きます。このツールは使う remote の URL も要るので、`repo` があっても、そのあと `PW-WORKTREE-ADD-39` の失敗を返します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        name: 'worktree の名前です。`wtN` の形で番号を振ります。'
        path: 'worktree の絶対パスです。'
        branch: 'worktree で checkout したブランチです。'
        base: 'ブランチの起点にした base ブランチです。'
        setupFailed: 'setup のコマンドが失敗したか、時間切れになったかです。成功したときと、実行しなかったときは `false` です。'
