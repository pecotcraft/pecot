      - id: PW-RELEASE-MERGE-19
        pattern: unwanted
        statement: もし PR に衝突があって --admin を付けていないなら、終了コード 1 で終わる
      - id: PW-RELEASE-MERGE-20
        pattern: unwanted
        statement: もし release_branch を設定していないなら、設定コマンドを案内する error の行を標準エラーに出す
      - id: PW-RELEASE-MERGE-21
        pattern: unwanted
