      - '`board_sync` が列か Status を動かすはずの Ready か Blocked の Issue があると、`warnings` に 1 つ入れます。件数を載せ、`board_sync` を案内します。件数の数え方は、`board_sync` と同じ規則です。前提の無い Blocked の Issue は、ブランチと PR を読んでいなくても数えます。そのため、列か Status が合っていないおそれがあると伝えます。'
    stdin: none
    output:
      format: text
      description: 'Overview・Registered repositories・Board status の節がある Markdown です。Ready と Blocked の表には、Readiness の列があります。積める Issue があるときは、Stackable chains の節が続きます。`--json` を付けると、`project`・`repositories`・`board` を持つ JSON のオブジェクトです。`repositories` の各要素は `dependabot_alerts` を、`board` の各項目は `readiness` を持ちます。'
    mcp_output:
      fields:
        project: 'アクティブなプロジェクトの概要です。`name`・`host`・`owner`・`number`・`aggregation_repo` を持ちます。ロードマップのリポジトリが未設定なら、`aggregation_repo` は `null` です。キーは snake_case です。'
        repositories: '登録したリポジトリの配列です。登録順に並びます。キーは snake_case です。要素は `full_name`・`owner`・`name`・`develop_branch`・`release_branch`・`dependabot_alerts` を持ちます。ブランチが未設定なら `null` です。`dependabot_alerts` は、読めなかったときは理由の `error` だけを持ちます。読めたときは `enabled`・`open_count`・`max_severity`・`alerts_url` を持ちます。要素は、`release_type`（`single`・`multi`・`nx`）と `packages`（`name` と `changelog` の配列。無ければ空）も持ちます。package の無いリポジトリに CHANGELOG の設定があるときだけ、`changelog_file` も持ちます。'
        board: 'ボードの状態です。`items` の配列を持ち、Backlog・Pending・Blocked・Ready・Active・In Review にある開いた項目が入ります。キーは snake_case です。要素は `id`・`workflow`（列。無ければ `null`）・`title`・`updatedAt`・`content`・`readiness` を持ちます。`content` は `number`・`state`・`url`・`labels`・`repository` を持ちます。`readiness` は、Ready と Blocked の Issue だけが `kind`・`stackOn`・`reason`・`text` を持ち、ほかの項目は `null` です。サーバが Issue の依存を扱えないときは、`readiness` ごと入りません。'
