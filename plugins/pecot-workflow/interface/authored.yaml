  PW-WORKTREE-INIT:
    summary: メインの worktree に、worktree の設定ファイルを作ります。
    arguments:
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
    constraints: []
    details:
      - '`directory` のリポジトリのメインの worktree に、既定のテンプレートを書きます。書く先は、`.pecot/config/worktree-config.json` と `.pecot/config/.worktreeignore` です。'
      - '`worktree-config.json` には、`CLAUDE.local.md`・`.env`・`.claude/settings.local.json` のリンクがあります。リンク先は、アクティブなプロジェクトの `aggregation_repo` です。アクティブなプロジェクトが無いか、`aggregation_repo` が無いときは、このリポジトリです。'
      - 'アクティブな設定ファイルを読めないか、形が誤っているときは、何も書かずに失敗を返します。'
      - '`worktree-config.json` には、`hooks-config.json`・`projects/.active`・`.pecot/work` のリンクもあります。リンク先は、このリポジトリです。'
      - '`.worktreeignore` には、`worktree_add` がコピーしないパターンを、gitignore の書き方で並べます。'
      - 'どちらかのファイルが既にあるときは、何も書かずに失敗を返します。'
      - 'devcontainer が要ります。'
      - 'remote の URL から `owner/repo` を読めないときは、引数 `repo` と比べません。`repo` があれば、`warnings` に入れて `repo` を使い、無ければ失敗を返します。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        configFile: 'worktree の設定ファイルの絶対パスです。'
        ignoreFile: 'worktree の ignore ファイルの絶対パスです。'
    diagnostics: '標準エラーに、2 つのファイルそれぞれの `created` の行を出します。失敗したときは、`error` の行を出します。devcontainer の外のときも含みます。remote の URL から `owner/repo` を読めず `repo` があるときは、`warning: using repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `repo` の案内の行を続けます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - kind: repo-mismatch
        when: '引数 `repo` が今の git remote と違います。'
      - kind: git-unresolved
        when: 'git のリポジトリの外で `repo` を省きました。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: already-exists
        when: '2 つのファイルのどちらかが既にあります。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルを読めないか、形が誤っています。'
      - kind: other
        when: 'メインの worktree が見つかりません。devcontainer の外で動かしたときと、ファイルを書けないときも含みます。'
      - kind: invalid-input
        when: '`directory` が無いか、既にあるディレクトリでないか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '`worktree-config.json` を書いた後で `.worktreeignore` を書けなかったときは、`worktree-config.json` は残ります。この失敗の結果にも、`configFile` が入ります。ファイルが既にあるときと、アクティブな設定ファイルを読めないときは、何も書かずに失敗を返します。'
    effects:
      - target: git
        kind: read
        what: 'メインの worktree を見つけるために、worktree の一覧を読みます。'
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
        what: '`worktree-config.json` と `.worktreeignore` を作ります。`.pecot/config` のディレクトリが無ければ、それも作ります。'
    prerequisites:
      - 'devcontainer の中で動かします。'
    idempotent: false
    examples:
      - arguments:
          directory: .
        note: 'セッションのディレクトリのリポジトリに、worktree の設定ファイルを書きます。'
    default_notes: {}
    behaviors:
      - id: PW-WORKTREE-INIT-01
        pattern: event
        statement: '設定ファイルの無いリポジトリを `directory` に渡して呼ぶと、メインの worktree に `worktree-config.json` を書きます'
      - id: PW-WORKTREE-INIT-02
