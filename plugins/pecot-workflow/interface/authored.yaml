format: 1
plugin: pecot-workflow
prose: ja
environment:
  - name: CLAUDE_PROJECT_DIR
    effect: 'あれば、プロジェクトのルートにします。git の toplevel より先に使います。設定ファイル・アクティブなプロジェクトの設定・作業ディレクトリは、この下で探します。MCP のサーバは、起動時に、次の 3 つがそろうとこのディレクトリへ移ります。サーバがプラグインのディレクトリの中で起動されたこと、`COPILOT_SESSION_CWD` が無いこと、`COPILOT_PLUGIN_ROOT` が無いことです。`COPILOT_PLUGIN_ROOT` があるときは、この値を使いません。GitHub Copilot CLI を起動したシェルから引き継いだ値だからです。'
  - name: CLAUDE_PLUGIN_ROOT
    effect: 'プラグインのディレクトリの場所です。MCP のサーバは、起動時に、作業ディレクトリがこのディレクトリか `PLUGIN_ROOT` のディレクトリの中にあるかどうかを見ます。中にあれば、ホストがサーバをセッションのディレクトリではなくプラグインのディレクトリで起動したとみなします。'
  - name: PLUGIN_ROOT
    effect: 'MCP のサーバが起動時に読みます。Agent Plugins 1.0 の仕様がサーバに約束する、プラグインのディレクトリです。作業ディレクトリがこのディレクトリか `CLAUDE_PLUGIN_ROOT` のディレクトリの中にあるかどうかを見ます。中にあれば、ホストがサーバをセッションのディレクトリではなくプラグインのディレクトリで起動したとみなします。空の値は無視します。'
  - name: COPILOT_PLUGIN_ROOT
    effect: 'MCP のサーバが起動時に読み、値があるかどうかだけを見ます。あれば、GitHub Copilot CLI がサーバを起動したとみなし、セッションのディレクトリを決めるのに `CLAUDE_PROJECT_DIR` を使いません。空の値は無視します。'
  - name: COPILOT_SESSION_CWD
    effect: 'MCP のサーバが起動時に読みます。サーバがプラグインのディレクトリ（`CLAUDE_PLUGIN_ROOT`）の中で起動されたときに、起動時に 1 回だけこのディレクトリへ移り、セッションのディレクトリとして扱います。`CLAUDE_PROJECT_DIR` より先に使います。値が既にあるディレクトリでないと、どのツールも `kind` が `session-directory-unresolved` の失敗を返します。`detail` には、変数の名前と値が出ます。この変数が無い 1.0.106 より古い GitHub Copilot CLI でも、どのツールも同じ `kind` の失敗を返します。`detail` は、アップグレードを求めます。空の値は無視します。'
  - name: CLAUDE_PLUGIN_DATA
    effect: '絶対パスのときに、データディレクトリになります。`PLUGIN_DATA`・`XDG_DATA_HOME`・`HOME` より先に使う、最初の候補です。場所を調べるだけでは、ディレクトリを作りません。'
  - name: PLUGIN_DATA
    effect: '絶対パスで、`CLAUDE_PLUGIN_DATA` が無いか使えないときに、データディレクトリになります。`XDG_DATA_HOME` と `HOME` より先に使います。'
  - name: XDG_DATA_HOME
    effect: '絶対パスで、`CLAUDE_PLUGIN_DATA` と `PLUGIN_DATA` のどちらも使えないときに、`<値>/pecot/pecot-workflow` がデータディレクトリになります。`HOME` より先に使います。'
  - name: HOME
    effect: 'データディレクトリの最後の候補です。絶対パスで、ほかの変数がどれも使えないときに、`<値>/.local/share/pecot/pecot-workflow` がデータディレクトリになります。どの変数も使えないときは、データディレクトリを決められません。'
  - name: PATH
    effect: 'git の toplevel の下に `node_modules/.bin/nx` が無いときに、nx の実行ファイルを順に探す場所です。空の要素は、今のディレクトリとして扱います。変数が無いときは、`/bin:/usr/bin` を探します。'
entries:
  PW-BOARD-CHECK:
    summary: '公式の MCP の `projects_write`（`update_project_item`）に渡す値を、書く前に pecot の決まりに照らします。GitHub を読み書きしません。'
    arguments:
      method: '`update_project_item` です。公式の `projects_write` の `method` と同じです。'
      owner: 'ボードのオーナーです。公式の `projects_write` と同じです。'
      project_number: 'ボードの番号です。公式の `projects_write` と同じです。'
      issue_number: 'カードの Issue の番号です。'
      item_owner: 'カードの Issue のリポのオーナーです。'
      item_repo: 'カードの Issue のリポの名前です。'
      updated_field: '書く欄と値です。公式の `projects_write` の `updated_field` と同じで、`id` か `name` のどちらか 1 つと `value` を持ちます。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、Issue のリポを含む設定を使います。'
      reads: '決まりを確かめるのに要る、公式の MCP の読み取りの結果です。ボードの欄とカード、Ready か Blocked に書くときは Issue・blocked-by・前提・前提を閉じる PR を、結果のまま渡します。'
    constraints: []
    details:
      - '値を受けて、決まりに外れた所を `problems` に返します。GitHub を読み書きしません。'
      - '`owner` と `project_number` が、Issue のリポを含む設定のボードかを見ます。'
      - '欄がボードにあるか、single select の欄なら値が選択肢にあるかを見ます。`name` の形は選択肢の名前か ID を、`id` の形は選択肢の ID だけを受けます。公式の `projects_write` と同じです。'
      - '進行の欄（`pecot-status`）に書けるのは、pecot の列に当たる選択肢だけです。空にはできません。'
      - 'カードがボードに無いときは、`projects_write` の `add_project_item` で先に足すよう `not-found` の項目で案内します。'
      - '`Ready` か `Blocked` に書くときは、その列に置いたとして、`issue_dependency_check` と同じ規則で前提を判定します。判定が別の列を示せば、`status-mismatch` の項目を返します。'
      - '判定が Status の札も動かすときは、`warnings` で案内します。前提の PR を読んでおらず、スタックできるかを決められないときは、読む PR を `warnings` で案内します。'
      - '外れた所が無ければ、成功の結果の文は `ok` です。あれば、最初の外れた所の `<引数>: <内容>` です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        problems: '決まりに外れた所の配列です。要素は `field`・`code`・`message` を必ず持ちます。受け付ける値が決まっているときは `candidates` に入れます。空なら、値をそのまま書けます。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: invalid-input
        when: '引数の形が誤っています。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。'
    prerequisites:
      - 'Issue のリポを `repositories` に持つプロジェクトの設定が要ります。無いときは、失敗にせず `not-in-project` の項目を返します。'
    idempotent: true
    examples:
      - arguments:
          method: update_project_item
          owner: acme
          project_number: 1
          issue_number: 7
          item_owner: acme
          item_repo: demo
          updated_field:
            name: pecot-status
            value: Ready
        note: 'Issue 7 を Ready に書いてよいかを確かめます。'
    default_notes: {}
    behaviors:
      - id: PW-BOARD-CHECK-01
        pattern: event
        statement: '書く値を受けると、GitHub を読み書きせずに、決まりに外れた所を `problems` に返します。外れた所が無ければ空の配列です'
      - id: PW-BOARD-CHECK-02
        pattern: unwanted
        statement: 'もし欄がボードに無いか、値が欄の選択肢に無いなら、`unknown-field` か `unknown-option` の項目を返し、候補を `candidates` に入れます'
      - id: PW-BOARD-CHECK-03
        pattern: event
        statement: '`Ready` か `Blocked` に書く値を受けると、前提を判定し、判定が別の列を示せば `status-mismatch` の項目を返し、その列を `candidates` に入れます'
      - id: PW-BOARD-CHECK-04
        pattern: unwanted
        statement: 'もし決まりを確かめるのに要る読み取りが `reads` に無いなら、読むツールを `read-required` の項目で案内します'
      - id: PW-BOARD-CHECK-05
        pattern: unwanted
        statement: 'もしカードがボードに無いなら、`not-found` の項目を返します'
      - id: PW-BOARD-CHECK-06
        pattern: unwanted
        statement: 'もし Issue のリポがプロジェクトに無いなら、`not-in-project` の項目を返します。`owner` か `project_number` が設定のボードと違うときは、`value` の項目を返します'
      - id: PW-BOARD-CHECK-07
        pattern: unwanted
        statement: 'もし `updated_field` に `id` と `name` の両方を渡すか、どちらも渡さないなら、項目を返します'
  PW-BOARD-SHOW:
    summary: 公式の MCP で読んだボードのカードを列ごとの表にし、前提を読んだ Ready と Blocked の Issue に着手の判定を付けます。GitHub を読み書きしません。
    arguments:
      json: 'JSON で出力するかどうかです。結果の項目は、この値によらず同じです。'
      repo: '表に出す項目のリポジトリです。`owner/repo` の形で明示して渡します。'
      reads: '公式の MCP の読み取りの結果です。`items` にボードのカードの全ページを、`fields` にボードの欄を渡します。判定する Ready と Blocked の Issue は、Issue・blocked-by・前提・前提を閉じる PR も渡します。'
    constraints: []
    details:
      - 'アクティブなプロジェクトのボードの状態を返します。GitHub を読み書きしません。'
      - 'ボードの状態は、Backlog・Pending・Blocked・Ready・Active・In Review にある open の項目が対象です。'
      - '`reads.items` は、`projects_list` の `list_project_items` の結果です。`fields` に `pecot-status`・`Status`・`pecot-lane` の欄の ID を渡して読みます。最後のページに続きがあれば、`warnings` に入れます。'
      - '`repo` を渡すと、ボードの項目を 1 つのリポジトリに絞ります。'
      - '`reads.blocked_by` を渡した Ready と Blocked の Issue だけを、`startable`・`stackable`・`blocked` のどれかに判定します。判定は `issue_dependency_check` と同じ規則です。'
      - '判定は返すだけです。Issue の列と Status は、判定に合っていなくても変えません。'
      - '判定に要る読み取りが足りない Issue は、判定を `unknown` にし、足りない読み取りを理由に入れます。'
      - '判定と列か Status の食い違う Issue があると、件数を `mismatches` に入れ、`pecot-board-sync` のワークフローを手で動かすよう `warnings` で案内します。'
      - 'リポジトリごとの Dependabot alert は出しません。公式の MCP の `list_dependabot_alerts` で読みます。'
      - 'ボードに `pecot-status` の欄が無いときは、項目に列を付けず、`warnings` に入れます。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        board: 'ボードの状態です。`items` の配列を持ち、Backlog・Pending・Blocked・Ready・Active・In Review にある開いた項目が入ります。要素は `id`・`workflow`（列。無ければ `null`）・`lane`・`title`・`updatedAt`・`content`・`readiness` を持ちます。`content` は `number`・`state`・`url`・`labels`・`repository` を持ちます。`readiness` は、判定した Issue だけが `kind`・`stackOn`・`reason`・`text` を持ち、ほかの項目は `null` です。'
        lanes: '`pecot-lane` の値ごとの Issue の数です。要素は `name`・`count`・`startable` を持ちます。選択肢の順に並び、値の無い組は `name` が `null` で末尾に来ます。ボードに `pecot-lane` が無ければ空の配列です。'
        mismatches: '判定した Issue のうち、列と Status のどちらかが判定と食い違うものの件数です。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: invalid-input
        when: '`repo` が `owner/repo` の形でないか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          reads:
            fields: '<list_project_fields の結果>'
            items: ['<list_project_items の結果>']
        note: 'ボードの表を返します。`reads` には、公式の MCP で読んだカードと欄を渡します。'
    default_notes:
      repo: '省くと、ボードの項目を絞り込みません。'
    behaviors:
      - id: PW-BOARD-SHOW-01
        pattern: event
        statement: 'ボードのカードと欄の読み取りを受けると、GitHub を読み書きせずに、Backlog から In Review までの開いた項目を `board` に入れます'
      - id: PW-BOARD-SHOW-02
        pattern: event
        statement: '`json` を付けて呼ぶと、同じ内容を JSON にします。結果の項目は、`json` を省いたときと同じです'
      - id: PW-BOARD-SHOW-03
        pattern: event
        statement: '`repo` を付けて呼ぶと、ボードの項目を 1 つのリポジトリに絞り、そのリポの Item だけで `lanes` を数えます'
      - id: PW-BOARD-SHOW-10
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-BOARD-SHOW-14
        pattern: event
        statement: '`reads.blocked_by` を渡した Ready か Blocked の Issue があると、その項目の `readiness` に判定を入れます。判定とずれた列にあっても動かしません'
      - id: PW-BOARD-SHOW-15
        pattern: event
        statement: '前提を読んでいない Issue と、Ready・Blocked の外の Issue は、`readiness` を `null` にします'
      - id: PW-BOARD-SHOW-18
        pattern: unwanted
        statement: 'もし判定に要る読み取りが足りないなら、判定を `unknown` にし、足りない読み取りを理由に入れます'
      - id: PW-BOARD-SHOW-33
        pattern: event
        statement: '判定と列か札の食い違う Issue があると、件数を `mismatches` に入れます。`warnings` にも、件数と `pecot-board-sync` のワークフローの案内を入れます'
      - id: PW-BOARD-SHOW-38
        pattern: state
        statement: 'ボードに single select の `pecot-lane` がある間、各 Item の `lane` に値を入れます。`lanes` には、値ごとの開いた Issue の数と着手できる数を、選択肢の順で入れます。PR は数えません'
      - id: PW-BOARD-SHOW-40
        pattern: state
        statement: 'ボードに single select の `pecot-lane` が無い間、各 Item の `lane` を null に、`lanes` を空にします'
      - id: PW-BOARD-SHOW-43
        pattern: unwanted
        statement: 'もし `reads.items` の最後のページに続きがあるなら、読んだ分だけを返し、`warnings` に 1 つ入れます'
  PW-BRANCH-CHECK:
    summary: '`github-ops` の `link-branch` に渡す値を、ブランチを作る前に pecot の着手の決まりに照らします。GitHub を読み書きしません。'
    arguments:
      owner: '作業の Issue のリポのオーナーです。`link-branch` を動かすリポです。'
      repo: '作業の Issue のリポの名前です。'
      issue: '`link-branch` の `params.issue` と同じです。作業の Issue の番号です。'
      branch: '`link-branch` の `params.branch` と同じです。`/<Issue の番号>` で終わるブランチの名前です。'
      base: '`link-branch` の `params.base` と同じです。ブランチを作る元のブランチです。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、Issue のリポを含む設定を使います。'
      reads: '決まりを確かめるのに要る、公式の MCP の読み取りの結果です。作業の Issue と前提・blocked-by・前提を閉じる PR を、結果のまま渡します。前提が Pending にあるかを見るときは、ボードのカードと欄も渡します。'
    constraints: []
    details:
      - '値を受けて、決まりに外れた所を `problems` に返します。GitHub を読み書きしません。'
      - 'Issue が開いているか、前提が着手を許すかを、`issue_dependency_check` と同じ規則で判定します。'
      - '前提の上にスタックするときは、`base` は前提のブランチでなければなりません。スタックしないときは、`base` を省くと、リポの既定のブランチから作られるため、開発ブランチを明示するよう求めます。'
      - 'スタックするときは、スタック先の Issue を `stacked_on` に返します。`session_start` に渡します。'
      - 'ブランチ名が `/<Issue の番号>` で終わるか、リポが設定の `repositories` にあるかを見ます。'
      - '作業ディレクトリの git remote が Issue のリポと違うときは、そのリポの worktree へ移るよう `repository-mismatch` の項目で案内します。'
      - '外れた所が無ければ、成功の結果の文は `ok` です。あれば、最初の外れた所の `<引数>: <内容>` です。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        problems: '決まりに外れた所の配列です。要素は `field`・`code`・`message` を必ず持ちます。受け付ける値が決まっているときは `candidates` に入れます。空なら、値をそのまま渡せます。'
        stacked_on: 'スタック先の Issue（`owner/repo/N`）です。開発ブランチから作るときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: github-mcp-shape
        when: '`reads` に渡した値が、公式の GitHub MCP のツールの結果の形と違います。'
      - kind: invalid-input
        when: '引数の形が誤っています。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。ツールの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'サーバがセッションのディレクトリを決められず、ツールを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。'
      - target: git
        kind: read
        what: '作業ディレクトリの git remote を読みます。'
    prerequisites:
      - 'Issue のリポを `repositories` に持つプロジェクトの設定が要ります。無いときは、失敗にせず `not-in-project` の項目を返します。'
    idempotent: true
    examples:
      - arguments:
          owner: acme
          repo: demo
          issue: 7
          branch: feat/7
          base: main
        note: 'Issue 7 のブランチを main から作ってよいかを確かめます。'
    default_notes: {}
    behaviors:
      - id: PW-BRANCH-CHECK-01
        pattern: event
        statement: '前提が済んだ Issue の値を受けると、GitHub を読み書きせずに、`base` が開発ブランチかを見て `problems` を返します'
      - id: PW-BRANCH-CHECK-02
        pattern: event
        statement: '前提の上にスタックできる Issue の値を受けると、`stacked_on` にスタック先を入れ、`base` が前提のブランチでなければ `base-mismatch` の項目を返します'
      - id: PW-BRANCH-CHECK-03
        pattern: unwanted
        statement: 'もし前提が着手を許さないか、Issue が閉じているなら、`prerequisite-open` か `issue-closed` の項目を返します'
      - id: PW-BRANCH-CHECK-04
        pattern: unwanted
