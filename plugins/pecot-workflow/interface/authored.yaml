  PW-WORKFLOW-DOCTOR:
    help:
      details:
        - Checks that the repository in --directory has the workflow file of the named template and the GitHub settings it needs. Nothing is written.
        - The repository is read from the git remote of --directory. The project config and the board are not read.
        - Prints one line per checked item to stdout, in the form <state> <name>. The state is ok, missing, outdated or skipped.
        - The items are the workflow file, the version marker on its first line, the secrets and variables the template needs, and the Claude GitHub App.
        - "For review: the secret PECOT_AGENT_APP_PRIVATE_KEY is needed, and printed as an item, only when the variable PECOT_AGENT_APP_CLIENT_ID is set. The secret CLAUDE_CODE_OAUTH_TOKEN, or all 4 variables PECOT_AGENT_ANTHROPIC_*, are needed."
        - Secrets and variables are read by name only, at the repository level and, for a repository of an organization, the organization level shared with the repository. Their values are never printed.
        - When the token cannot read a list (403 or 404), an item whose names are not found in the lists that were read is skipped, and a skipped item does not count as missing.
        - Whether the Claude GitHub App is installed cannot be read with the token of the repository, so it is always printed as skipped.
        - Fails when any item is missing or outdated.
      examples:
        - run: pecot workflow doctor review
          note: Check the files and settings for the automatic review.
      default_notes:
        directory: The current directory.
    summary: ワークフローの雛形と、雛形の要る設定が、導入先のリポにそろっているかを確かめます。
    arguments:
      name: '雛形の一覧の名前です。いまは `review` だけです。'
      directory: '対象の Git リポジトリの中のディレクトリです。サブディレクトリでも、リポのルートを使います。絶対パスと相対パスのどちらも渡せます。省くと、セッションのディレクトリです。'
    constraints: []
    details:
      - '`directory` のリポに、名前の雛形のワークフローのファイルと、雛形が要る GitHub の設定がそろっているかを確かめます。何も書きません。'
      - 'リポは `directory` の git remote から読みます。プロジェクトの設定とボードは読みません。'
      - '確かめた項目を、結果の `items` に 1 つずつ入れます。状態の `state` は `ok`・`missing`・`outdated`・`skipped` のどれかです。'
      - '項目は、ワークフローのファイル、その 1 行目の版の目印、雛形が要る secret と変数、Claude の GitHub App です。'
      - '`review` では、変数 `PECOT_AGENT_APP_CLIENT_ID` があるときだけ、secret `PECOT_AGENT_APP_PRIVATE_KEY` が要り、その項目を入れます。secret `CLAUDE_CODE_OAUTH_TOKEN` か、`PECOT_AGENT_ANTHROPIC_*` の 4 つの変数のすべてが要ります。'
      - 'secret と変数は、名前の有無だけを読みます。リポの単位と、organization のリポでは、リポに渡る organization の単位の両方を見ます。値は返しません。'
      - 'トークンで読めない一覧（403・404）があると、読めた一覧に名前の見つからない項目を `skipped` にします。`skipped` は足りないと数えません。'
      - 'Claude の GitHub App が入っているかは、リポのトークンでは読めません。いつも `skipped` で入れます。'
      - '`missing` か `outdated` の項目が 1 つでもあると、失敗を返します。'
    stdin: none
    output:
      format: text
      description: '確かめた項目ごとに、`<状態>: <名前>` の行を出します。'
    mcp_output:
      fields:
        repository: 'git remote のリポジトリです。`owner/repo` の形です。'
        items: '確かめた項目の一覧です。項目ごとに `name`（確かめたもの）と `state`（`ok`・`missing`・`outdated`・`skipped`）を持ちます。失敗のときも入ります。'
        ready: '`missing` と `outdated` の項目が無いかどうかです。'
    diagnostics: '足りない項目があると、その数を書いた `error` の行を標準エラーに出します。ほかの失敗でも `error` の行を出します。'
    environment: []
    exit_status:
      - kind: repo-setting-missing
        code: 1
        when: '`missing` か `outdated` の項目があります。'
      - kind: invalid-input
        code: 2
        when: '名前が雛形の一覧に無いか、`directory` が無いパス・ファイル・読めないディレクトリです。ほかの引数の誤りも含みます。'
      - kind: git-unresolved
        code: 1
        when: '`directory` が Git リポジトリの外か、その git remote からリポジトリを読めません。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub にリポジトリが見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返したか、GitHub に届きません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '`missing` か `outdated` の項目があるときは、`kind` が `repo-setting-missing` の失敗を返し、`detail` に足りない項目の数を入れます。この失敗の結果にも、`repository`・`items`・`ready` が入ります。'
    effects:
      - target: git
        kind: read
        what: '`directory` を含むリポのルートと、その remote の URL を読みます。'
      - target: file
        kind: read
        what: 'リポのルートの下のワークフローのファイルと、同梱の雛形を読みます。'
      - target: github
        kind: read
        what: 'リポの持ち主の種類と、Actions の secret と変数の名前の一覧を読みます。'
    prerequisites:
      - 'ホストの GitHub トークンと、secret と変数の一覧を読む権限が要ります。'
      - 'classic のトークンは `repo` の scope、fine-grained のトークンは Secrets と Variables の read です。どちらも、リポの collaborator であることが要ります。'
    idempotent: true
    examples:
      - arguments:
          name: review
        note: '自動レビューのファイルと設定を確かめます。'
    default_notes:
      directory: 'セッションのディレクトリです。'
    behaviors:
      - id: PW-WORKFLOW-DOCTOR-01
        pattern: event
        statement: '呼ぶと、確かめた項目を、`name` と `state` の組で結果の `items` に入れます'
      - id: PW-WORKFLOW-DOCTOR-02
        pattern: unwanted
        statement: 'もしワークフローのファイルが無いなら、その項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-03
        pattern: unwanted
        statement: 'もしファイルの版が同梱の雛形より古いなら、その項目を `outdated` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-04
        pattern: unwanted
        statement: 'もし変数 `PECOT_AGENT_APP_CLIENT_ID` を置き、秘密鍵の secret を置いていないなら、その項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-05
        pattern: unwanted
        statement: 'もしモデルの認証の secret も、4 つの変数のそろった組も無いなら、その項目を `missing` にして失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-06
        pattern: event
        statement: 'ファイルと設定がそろっていると、`ready` を `true` にして成功を返します'
      - id: PW-WORKFLOW-DOCTOR-07
        pattern: ubiquitous
        statement: '常に、Claude の GitHub App は確かめず、その項目を `skipped` で入れます'
      - id: PW-WORKFLOW-DOCTOR-08
        pattern: unwanted
        statement: 'もし secret か変数の一覧をトークンで読めないなら、読めた一覧に名前の見つからない項目を `skipped` で入れ、足りないと数えません'
      - id: PW-WORKFLOW-DOCTOR-09
        pattern: event
        statement: 'リポの持ち主が organization だと、リポに渡る organization の secret と変数も見ます'
      - id: PW-WORKFLOW-DOCTOR-10
        pattern: event
        statement: 'リポの持ち主が個人だと、organization の一覧を読みません'
      - id: PW-WORKFLOW-DOCTOR-11
        pattern: ubiquitous
        statement: '常に、secret と変数の値を結果に入れません'
      - id: PW-WORKFLOW-DOCTOR-12
        pattern: unwanted
        statement: 'もし名前が雛形の一覧に無いなら、一覧の名前を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-13
        pattern: unwanted
        statement: 'もし Git リポジトリの外か、git remote からリポジトリを読めないなら、GitHub を読まずに、`kind` が `git-unresolved` の失敗を返します'
      - id: PW-WORKFLOW-DOCTOR-14
        pattern: event
        statement: 'リポのサブディレクトリを `directory` に渡すと、リポのルートに置いたワークフローのファイルを見ます'
      - id: PW-WORKFLOW-DOCTOR-15
        pattern: event
        statement: '変数 `PECOT_AGENT_APP_CLIENT_ID` が無いと、秘密鍵の secret の項目を入れません'
  PW-WORKFLOW-INSTALL:
    help:
      details:
        - Writes the named workflow template bundled with pecot into the repository in --directory. For review, the file is .github/workflows/pecot-review.yml.
        - Creates the parent directories when they are missing.
        - After writing, prints the next steps to stdout. They are installing the Claude GitHub App, setting the model credential, and checking with pecot workflow doctor.
        - When the file already exists, the command stops unless --force is given.
        - With --force, the lines you added between the begin and end markers are printed as a warning before the file is overwritten.
        - With --check, nothing is written. The command checks that the file has the version of the bundled template on its first line, and fails with the command to update it when the file is missing or outdated.
        - --check cannot be used with --force or --dry-run.
        - With --dry-run, prints the plan line and writes nothing.
        - Values you change, such as the trigger phrase and the limits, live in repository variables, so overwriting the file keeps them.
      examples:
        - run: pecot workflow install review
          note: Write the automatic review workflow.
        - run: pecot workflow install review --check
          note: Check that the installed workflow is up to date.
        - run: pecot workflow install review --force
          note: Update the installed workflow to the bundled version.
      default_notes:
        directory: The current directory.
    summary: pecot が同梱する GitHub Actions のワークフローの雛形を、リポに書き出します。
    arguments:
      name: '雛形の一覧の名前です。いまは `review` だけです。'
      check: '書き出さずに、置いたファイルの版が同梱の雛形と同じかを確かめるかどうかです。'
      force: 'ファイルが既にあるときに上書きするかどうかです。'
      dry_run: '何も書かずに、書く予定だけを返すかどうかです。'
      directory: '対象の Git リポジトリの中のディレクトリです。サブディレクトリでも、リポのルートを使います。絶対パスと相対パスのどちらも渡せます。省くと、セッションのディレクトリです。'
    constraints:
      - conflicts: [check, force]
      - conflicts: [check, dry_run]
    details:
      - '名前の雛形を、`directory` のリポに書き出します。`review` の置き先は `.github/workflows/pecot-review.yml` です。'
      - '親のディレクトリが無ければ作ります。'
      - '書き出した後は、Claude の GitHub App を入れ、モデルの認証を設定し、`workflow_doctor` で確かめます。'
      - 'ファイルが既にあるときは、`force` が無ければ失敗を返します。'
      - '`force` では、利用者が begin と end の印の間に足した行を、結果の `removedLines` と `warnings` に入れてから上書きします。'
      - '`check` では何も書きません。ファイルの 1 行目の版が同梱の雛形と同じかを確かめ、結果の `upToDate` に入れます。ファイルが無いか古いときは、更新の呼び方を `detail` に入れて失敗を返します。'
      - '`dry_run` では、何も書かずに、書く予定を結果に入れます。'
      - '合言葉や上限など利用者が変える値は、リポの変数にあります。ファイルを上書きしても消えません。'
    stdin: none
    output:
      format: text
      description: '書き出したときだけ、次にすることを番号付きの行で出します。'
    mcp_output:
      fields:
        path: 'リポのルートからのワークフローのファイルのパスです。'
        version: '同梱の雛形の版です。'
        installedVersion: '置いてあったファイルの版です。ファイルが無いか、版の目印が無いときは入りません。'
        written: 'ファイルを書いたかどうかです。`check` と `dry_run` のときは、いつも `false` です。'
        upToDate: '`check` のときだけ入ります。置いたファイルの版が同梱の雛形と同じかどうかです。'
        removedLines: '既にあるファイルを上書きするときだけ入ります。利用者が印の間に足した行で、雛形の中身に置き換わります。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も書いていません。'
    diagnostics: '標準エラーに、書いたファイルの結果の行（`created`・`updated`）を出します。`--dry-run` のときは予定の行（`dry-run`）を、`--check` で版が同じときは `unchanged` の行を出します。消える行があると `warning` の行を出します。失敗では `error` の行を出します。'
    environment: []
    exit_status:
      - kind: already-exists
        code: 2
        when: 'ファイルが既にあり、`force` がありません。'
      - kind: not-ready
        code: 1
        when: '`check` で、ファイルが無いか、版が同梱の雛形より古いです。'
      - kind: invalid-input
        code: 2
        when: '名前が雛形の一覧に無いか、`check` を `force`・`dry_run` と一緒に渡したか、`directory` が無いパス・ファイル・読めないディレクトリです。ほかの引数の誤りも含みます。'
      - kind: git-unresolved
        code: 1
        when: '`directory` が Git リポジトリの外です。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。ファイルを書けないときも含みます。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '`check` でファイルが無いか古いときは、`kind` が `not-ready` の失敗を返し、`detail` に `workflow_install` での更新の呼び方を入れます。この失敗の結果にも、`path`・`version`・`written`・`upToDate` が入ります。ファイルが既にあって `force` が無いときは、`kind` が `already-exists` の失敗を返し、`detail` に `force` を付けた呼び方を入れます。'
    effects:
      - target: git
        kind: read
        what: '`directory` を含むリポのルートを読みます。'
      - target: file
        kind: read
        what: '同梱の雛形と、リポのルートの下に置いてあるワークフローのファイルを読みます。'
      - target: file
        kind: write
        what: 'リポのルートの下に、ワークフローのファイルを書きます。`force` のときは上書きします。'
    prerequisites: []
    idempotent: false
    examples:
      - arguments:
          name: review
        note: '自動レビューのワークフローを書き出します。'
      - arguments:
          name: review
          check: true
        note: '置いたワークフローが新しいかを確かめます。'
      - arguments:
          name: review
          force: true
        note: '置いたワークフローを、同梱の版に更新します。'
    default_notes:
      directory: 'セッションのディレクトリです。'
    behaviors:
      - id: PW-WORKFLOW-INSTALL-01
        pattern: event
        statement: '置き先にファイルが無いとき呼ぶと、雛形を書き出し、結果の `written` を `true` にします'
      - id: PW-WORKFLOW-INSTALL-02
        pattern: event
        statement: '雛形を書き出すと、結果の `path` に置き先を、`version` に同梱の雛形の版を入れます'
      - id: PW-WORKFLOW-INSTALL-03
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、何も書かずに、`written` を `false`、`dryRun` を `true` にして成功を返します'
      - id: PW-WORKFLOW-INSTALL-04
        pattern: unwanted
        statement: 'もし置き先にファイルのあるとき `force` を付けずに呼ぶなら、何も書かずに、`kind` が `already-exists` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-05
        pattern: event
        statement: '`force` を付けて呼ぶと、既にあるファイルを雛形で上書きし、`written` を `true` にします'
      - id: PW-WORKFLOW-INSTALL-06
        pattern: event
        statement: '`force` で、利用者の足した行が印の間にあると、消える行を `removedLines` と `warnings` に入れます'
      - id: PW-WORKFLOW-INSTALL-07
        pattern: event
        statement: '置いたファイルの版が同梱の雛形と同じとき `check` を付けて呼ぶと、何も書かずに、`upToDate` を `true` にして成功を返します'
      - id: PW-WORKFLOW-INSTALL-08
        pattern: unwanted
        statement: 'もし `check` で、ファイルが無いか版が古いなら、更新の呼び方を `detail` に入れて、`kind` が `not-ready` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-09
        pattern: unwanted
        statement: 'もし名前が雛形の一覧に無いなら、一覧の名前を `detail` に入れて、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-10
        pattern: unwanted
        statement: 'もし `check` を `force` か `dry_run` と一緒に渡したなら、何も書かずに、`kind` が `invalid-input` の失敗を返します'
      - id: PW-WORKFLOW-INSTALL-11
        pattern: event
        statement: 'リポのサブディレクトリを `directory` に渡すと、リポのルートからの置き先に書き出します'
      - id: PW-WORKFLOW-INSTALL-12
        pattern: unwanted
        statement: 'もし `directory` が Git リポジトリの外なら、何も書かずに、`kind` が `git-unresolved` の失敗を返します'
  PW-WORKTREE-ADD:
    help:
      details:
        - Creates a worktree of the repository in -D under <project root>/<wtN>/<repository directory name>, on a new branch named wtN.
        - The project root is the parent of base/ in the layout <project root>/base/<repository>.
        - A repository outside that layout stops the command.
        - Joins the lowest numbered wtN set that has no worktree of this repository yet, and starts the set max(N)+1 when every set already has one.
        - Skips every wtN that a worktree of this repository already uses, including a worktree made with --path, which is found by its record or by a checked out branch wtN.
        - Records wtN in the git administrative directory of the new worktree, which pecot session finish reads to return to wtN.
        - Creates the branch from <remote>/<base> with that branch as its upstream, where <remote> is the remote that points to a repository in a project config, checking origin first and then the others in git remote order, and <base> is --base or the develop_branch of the repository in its project config.
        - When the branch wtN already exists, stops unless its upstream is <remote>/<base> or --allow-existing-branch is given.
        - A matching branch that no worktree uses is deleted and created again.
        - Runs git worktree prune on the main worktree before it creates the worktree, also with --dry-run.
        - Needs .pecot/config/worktree-config.json and .pecot/config/.worktreeignore in the main worktree, which pecot worktree init creates.
        - The repository must be in a project config (its repositories or aggregation_repo). When several configs include it, the active project or --project chooses one.
        - Creates the symlinks of worktree-config.json, then copies the git-ignored files of the main worktree that .worktreeignore does not exclude and that are not under a created symlink, then runs the setup command in the new worktree.
        - With --path, the worktree is created at that path, and the copied files go to that path.
        - With --path, the symlinks and .pecot/.gitignore are created in the worktree at that path.
        - When a link path starts with .pecot/, writes .pecot/.gitignore in the new worktree by running a script of the plugin before it links.
        - The setup command is --setup, or setup_command of worktree-config.json, and runs through the shell with a closed stdin and the timeout setup_command_timeout.
        - A failed or timed out setup command is a warning and does not change the exit status.
        - A link whose target does not exist, whose path is tracked by git or that cannot be created is skipped with a warning, and does not change the exit status.
        - Needs a devcontainer.
        - The command stops before it runs when none of the checks passes.
        - "When the owner/repo cannot be read from the URL of the remote, --repo is not compared with it: with --repo the command prints a warning, and without --repo it stops. Because the command also needs the URL of the remote it uses, it then stops with the error of PW-WORKTREE-ADD-39 either way."
      examples:
        - run: pecot worktree add -D .
          note: Create the next worktree of the repository in the current directory.
        - run: pecot worktree add -D . --dry-run
          note: Show the worktree that would be created.
        - run: pecot worktree add -D . --base develop --setup "pnpm install"
          note: Branch from develop and run a setup command after creation.
      default_notes:
        base: The develop_branch of the repository in its project config.
        path: <project root>/<wtN>/<repository directory name>.
        setup: The setup_command of worktree-config.json; without it, no command runs.
    summary: 新しい worktree を作ります。
    arguments:
      allow_existing_branch: '既にあるブランチを、upstream が `develop_branch` と違っても使い回してよいかどうかです。'
      project: '使うプロジェクトの設定の名前です。`.pecot/config/projects` の下のファイル名から `.json` を除いたものです。省くと、remote のリポを含む設定を使います。2 つ以上あるときは、その中のアクティブなプロジェクトを使います。'
      base: '分岐元のブランチです。'
      directory: '対象の Git リポジトリのパスです。絶対パスと相対パスのどちらも渡せます。'
      dry_run: '何も変えずに、行う予定だけを返すかどうかです。'
      no_copy: '追跡していないファイルのコピーを飛ばすかどうかです。'
      no_link: 'シンボリックリンクの作成を飛ばすかどうかです。'
      path: 'worktree を作る場所です。'
      setup: '作った後で動かすコマンドです。'
    constraints: []
    details:
      - '`directory` のリポジトリの worktree を、`<プロジェクトのルート>/<wtN>/<リポジトリのディレクトリ名>` に作ります。ブランチは、`wtN` という名前の新しいブランチです。'
      - 'プロジェクトのルートは、`<プロジェクトのルート>/base/<リポジトリ>` の配置での `base/` の親です。'
      - 'この配置の外のリポジトリでは、失敗を返します。'
      - 'このリポジトリの worktree がまだ無い `wtN` のセットのうち、番号が最小のものに加わります。どのセットにも既にあるときは、最大の N に 1 を足したセットを始めます。'
      - 'このリポジトリの worktree が既に使っている `wtN` は、すべて飛ばします。`path` で作った worktree も含みます。その worktree は、記録か、チェックアウトしているブランチ `wtN` で見つけます。'
      - '新しい worktree の git の管理ディレクトリに、`wtN` を記録します。`session_finish` が、`wtN` へ戻るためにこの記録を読みます。'
      - 'ブランチは `<remote>/<base>` から作り、そのブランチを upstream にします。`<base>` は、引数 `base` か、プロジェクトの設定にあるリポジトリの `develop_branch` です。`<remote>` は、プロジェクトの設定にあるリポジトリを指す remote です。`origin` を先に見て、次に `git remote` の順で見ます。'
      - 'ブランチ `wtN` が既にあるときは、失敗を返します。upstream が `<remote>/<base>` のときと、`allow_existing_branch` を付けたときは別です。'
      - 'upstream が合っていて、どの worktree も使っていないブランチは、消して作り直します。'
      - 'worktree を作る前に、メインの worktree で `git worktree prune` を動かします。`dry_run` のときも動かします。'
      - 'メインの worktree に、`.pecot/config/worktree-config.json` と `.pecot/config/.worktreeignore` が要ります。どちらも `worktree_init` が作ります。'
      - 'リポジトリは、プロジェクトの設定の `repositories` か `aggregation_repo` に無ければなりません。含む設定が 2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - '`worktree-config.json` のシンボリックリンクを作ってから、メインの worktree で git が無視しているファイルをコピーします。`.worktreeignore` が除くファイルと、作ったシンボリックリンクの下のファイルはコピーしません。コピーの後、新しい worktree で setup のコマンドを動かします。'
      - '`path` を付けると、そのパスに worktree を作り、ファイルもそのパスへコピーします。'
      - '`path` を付けると、シンボリックリンクと `.pecot/.gitignore` も、そのパスの worktree に作ります。'
      - 'リンクのパスが `.pecot/` で始まるときは、リンクを作る前にプラグインのスクリプトを動かし、新しい worktree に `.pecot/.gitignore` を書きます。'
      - 'setup のコマンドは、引数 `setup` か、`worktree-config.json` の `setup_command` です。シェルを通して動かし、標準入力は閉じ、`setup_command_timeout` で時間切れにします。'
      - 'setup のコマンドが失敗するか時間切れになると、`warnings` に入れ、`setupFailed` を `true` にして成功を返します。'
      - '次のリンクは、`warnings` に入れて飛ばし、成功を返します。リンク先が無いもの、パスを git が追跡しているもの、作れないものです。'
      - 'devcontainer が要ります。'
      - 'devcontainer の確認がどれも通らないときは、何もせずに失敗を返します。'
      - 'remote の URL から `owner/repo` を読めないときは、引数 `repo` と比べません。`repo` があれば `warnings` に入れ、無ければ失敗を返します。このツールは使う remote の URL も要るので、`repo` があっても、そのあと `PW-WORKTREE-ADD-39` の失敗を返します。'
    stdin: none
    output:
      format: text
      description: '作った worktree のパスの 1 行です。`--dry-run` のときは、予定のパスです。'
    mcp_output:
      fields:
        name: 'worktree の名前です。`wtN` の形で番号を振ります。'
        path: 'worktree の絶対パスです。`dry_run` のときは、置く予定の場所です。'
        branch: 'worktree で checkout したブランチです。'
        base: 'ブランチの起点にした base ブランチです。'
        setupFailed: 'setup のコマンドが失敗したか、時間切れになったかです。成功したときと、実行しなかったときは `false` です。`dry_run` のときは入りません。'
        dryRun: '`dry_run` のときだけ `true` で入ります。何も変えていません。'
    diagnostics: '標準エラーに、`created` の行（`--dry-run` のときは `dry-run` の行）を出します。シンボリックリンクとコピーしたファイルの `count` の行も出します。`warning` の行を出すのは、次のものです。飛ばしたリンクそれぞれ、コピーできなかったファイルそれぞれ、失敗した setup のコマンド、書けなかった `wtN` の記録です。失敗したときは、`error` の行を出します。devcontainer の外のときも含みます。remote の URL から `owner/repo` を読めず `--repo` があるときは、`warning: using --repo <owner/repo>` で始まる行を出します。行の末尾は `(could not read the repository from the URL of the Git remote <name>)` です。`--repo` も無いときは、`error: the repository is ambiguous` の行に、理由と `--repo` の案内の行を続けます。'
    environment:
      - name: REMOTE_CONTAINERS
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: CODESPACES
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
      - name: DEVCONTAINER
        effect: '空でない値があると、環境を devcontainer とみなします。`/.dockerenv` があるときは読みません。'
    exit_status:
      - kind: repo-mismatch
        code: 1
        when: '引数 `repo` が今の git remote と違います。'
      - kind: git-unresolved
        code: 1
        when: 'git のリポジトリの外で `repo` を省きました。選んだ remote のリポジトリを GitHub の `owner/repo` として読めないときも含みます。`repo` を省いて remote の URL から `owner/repo` を読めないときも含みます。'
      - kind: not-initialized
        code: 1
        when: '`worktree-config.json` か `.worktreeignore` がありません。'
      - kind: config-invalid
        code: 1
        when: '`worktree-config.json` の内容が不正です。'
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: repo-not-in-project
        code: 1
        when: 'remote のリポを含むプロジェクトの設定がありません。`project` で選んだ設定が含まないときも含みます。'
      - kind: repo-setting-missing
        code: 1
        when: '`develop_branch` が未設定で、`base` もありません。'
      - kind: other
        code: 1
        when: 'worktree を作れません。次のどれかです。メインの worktree が見つかりません。リポジトリが `base/` の配置にありません。ブランチ `wtN` が別の upstream で既にあります。`git worktree add` が失敗しました。devcontainer の外で動かしました。'
      - kind: invalid-input
        code: 2
        when: '`directory` が無いか、既にあるディレクトリでないか、ほかの引数の誤りがあります。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '最初のエラーで止まり、失敗を返します。`git worktree add` の後で `worktree-config.json` の内容が不正だと分かったときは、worktree とブランチは残ります。リンク・コピーしたファイル・setup の実行はありません。`wtN` の記録を書けなくても、worktree はそのままです。prune した管理情報と、消した未使用のブランチは、元に戻しません。飛ばしたリンク・コピーできなかったファイル・失敗した setup のコマンド・書けなかった `wtN` の記録は、`warnings` に入れて成功を返します。'
    effects:
      - target: git
        kind: write
        what: '古い worktree の管理情報を prune します（`dry_run` のときも行います）。worktree とブランチ `wtN` を作り、upstream を設定します。worktree の git の管理ディレクトリに、`wtN` を記録します。'
      - target: git
        kind: destructive
        what: '期待する upstream と合っていて、worktree の無い既存のローカルブランチ `wtN` を消します。'
      - target: file
        kind: read
        what: '`worktree-config.json`、`.worktreeignore`、アクティブな設定ファイルを読みます。'
      - target: file
        kind: write
