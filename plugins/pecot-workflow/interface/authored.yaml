      - id: PW-PROJECT-SEARCH-05
        pattern: event
        statement: '`pecot-status` のフィールドを持つプロジェクトを一覧すると、その要素の `initialized` を `true` にします'
      - id: PW-PROJECT-SEARCH-06
        pattern: event
