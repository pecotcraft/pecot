format: 1
plugin: pecot-workflow
prose: ja
environment:
  - name: PECOT_GITHUB_API_URL
    effect: 'GitHub API のリクエストを、本物のホストではなくこの URL に送ります。受け付けるのは `http://127.0.0.1` か `http://localhost` の URL だけです。ほかの値では、サブコマンドが動く前に終了コード 1 で止まります。`--version` と最上位の `--help` は例外で、先に終了コード 0 で終わります。空の値は無視します。'
  - name: CLAUDE_PROJECT_DIR
    effect: 'あれば、プロジェクトのルートにします。git の toplevel より先に使います。設定ファイル・アクティブなプロジェクトの設定・作業ディレクトリは、この下で探します。`pecot mcp` は、次の 3 つがそろうとこのディレクトリへ移ります。サーバがプラグインのディレクトリの中で起動されたこと、`COPILOT_SESSION_CWD` が無いこと、`COPILOT_PLUGIN_ROOT` が無いことです。`COPILOT_PLUGIN_ROOT` があるときは、この値を使いません。GitHub Copilot CLI を起動したシェルから引き継いだ値だからです。'
  - name: CLAUDE_PLUGIN_ROOT
    effect: 'プラグインのディレクトリの場所です。`--version` が出す版は、この下の `.claude-plugin/plugin.json` から読みます。worktree のコマンドが動かすスクリプトも、この下で探します。`pecot mcp` では、作業ディレクトリがこのディレクトリか `PLUGIN_ROOT` のディレクトリの中にあるかどうかを見ます。中にあれば、ホストがサーバをセッションのディレクトリではなくプラグインのディレクトリで起動したとみなします。'
  - name: PLUGIN_ROOT
    effect: '`pecot mcp` だけが読みます。Agent Plugins 1.0 の仕様がサーバに約束する、プラグインのディレクトリです。作業ディレクトリがこのディレクトリか `CLAUDE_PLUGIN_ROOT` のディレクトリの中にあるかどうかを見ます。中にあれば、ホストがサーバをセッションのディレクトリではなくプラグインのディレクトリで起動したとみなします。空の値は無視します。'
  - name: COPILOT_PLUGIN_ROOT
    effect: '`pecot mcp` だけが読み、値があるかどうかだけを見ます。あれば、GitHub Copilot CLI がサーバを起動したとみなし、セッションのディレクトリを決めるのに `CLAUDE_PROJECT_DIR` を使いません。空の値は無視します。'
  - name: COPILOT_SESSION_CWD
    effect: '`pecot mcp` だけが読みます。サーバがプラグインのディレクトリ（`CLAUDE_PLUGIN_ROOT`）の中で起動されたときに、起動時に 1 回だけこのディレクトリへ移り、セッションのディレクトリとして扱います。`CLAUDE_PROJECT_DIR` より先に使います。値が既にあるディレクトリでないと、どのツールの呼び出しも終了コード 1 で失敗し、理由に変数の名前と値が出ます。この変数が無い 1.0.106 より古い GitHub Copilot CLI では、どのツールの呼び出しも終了コード 1 で失敗し、理由がアップグレードを求めます。空の値は無視します。'
  - name: PECOT_GITHUB_*_TOKEN
    effect: 'ホストの GitHub トークンを渡します。変数の名前は、`.pecot/config/hosts.json` に書いたそのホストの `env_var` です。書いていなければ、`github.com` は `PECOT_GITHUB_COM_TOKEN`、ほかのホストは `PECOT_GITHUB_<HOST>_TOKEN` です。`<HOST>` は、ホスト名を大文字にして `.` を `_` に替えたものです。変数は、`.pecot/config/.env` を読み込んだ後の環境から読みます。このファイルの行は、既にある環境変数を上書きしません。トークンが見つからないときは、`github.com` には `GITHUB_COM_TOKEN` を使い、その次に `gh auth token` のトークンを使います。トークンが 401 で拒否されると、`gh auth token` のトークンで 1 回だけやり直し、`warning` の行を出します。`GITHUB_COM_TOKEN` のトークンでも同じです。'
  - name: GITHUB_COM_TOKEN
    effect: '`github.com` の GitHub トークンを渡します。使うのは、`github.com` 用の名前の変数が無いときです。その名前は、`.pecot/config/hosts.json` に書いていなければ `PECOT_GITHUB_COM_TOKEN` です。変数は、プロジェクトのルートの `.env` を読み込んだ後の環境から読みます。このファイルの行は、既にある環境変数を上書きしません。このファイルは、`.pecot/config/.env` の後で読み込みます。'
  - name: CLAUDE_PLUGIN_DATA
    effect: '絶対パスのときに、データディレクトリになります。`PLUGIN_DATA`・`XDG_DATA_HOME`・`HOME` より先に使う、最初の候補です。場所を調べるだけでは、ディレクトリを作りません。'
  - name: PLUGIN_DATA
    effect: '絶対パスで、`CLAUDE_PLUGIN_DATA` が無いか使えないときに、データディレクトリになります。`XDG_DATA_HOME` と `HOME` より先に使います。'
  - name: XDG_DATA_HOME
    effect: '絶対パスで、`CLAUDE_PLUGIN_DATA` と `PLUGIN_DATA` のどちらも使えないときに、`<値>/pecot/pecot-workflow` がデータディレクトリになります。`HOME` より先に使います。'
  - name: HOME
    effect: 'データディレクトリの最後の候補です。絶対パスで、ほかの変数がどれも使えないときに、`<値>/.local/share/pecot/pecot-workflow` がデータディレクトリになります。どの変数も使えないときは、データディレクトリを決められません。'
  - name: PATH
    effect: 'git の toplevel の下に `node_modules/.bin/nx` が無いときに、nx の実行ファイルを順に探す場所です。空の要素は、今のディレクトリとして扱います。変数が無いときは、`/bin:/usr/bin` を探します。'
  - name: TERMINAL_WIDTH
    effect: '正の整数のときに、ヘルプとエラーの出力の幅（桁数）になります。`COLUMNS` と端末の幅より先に使います。'
  - name: COLUMNS
    effect: '正の整数で `TERMINAL_WIDTH` が無いときに、ヘルプとエラーの出力の幅（桁数）になります。端末の幅より先に使います。どれも無いときの幅は 80 です。'
entries:
  PW-BOARD-ADD:
    help:
      details:
        - Adds one Issue to the project board of the active project and then sets its Status field.
        - The Issue reference is owner/repo/N or the short form N.
        - The short form N refers to the Issue of the repository given by the global pecot --repo.
        - Without --repo, the short form N refers to the Issue of the repository of the git remote.
        - The repository of the Issue must be registered in the active project.
        - --status takes backlog, pending, blocked, ready, active, in_review or archived, and the Status is set to that value.
        - An empty --status skips the Status update and only adds the Issue.
        - An Issue that is already on the board is not added twice.
        - A --status value that is not one of these values stops the command before anything is added.
        - A --status value that the board does not define stops the command before anything is added.
        - With --dry-run, reads the Issue and prints dry-run lines for adding it to the board and setting its Status, and writes nothing to the board.
        - --project names the project config to use. Without it, the config that includes the repository of the Issue is used; when several do, the active one among them.
      examples:
        - run: pecot board add example-org/my-repo/123
          note: Add the Issue to the board with the Status ready.
        - run: pecot board add example-org/my-repo/123 --status backlog
          note: Add the Issue to the board with the Status backlog.
        - run: pecot board add example-org/my-repo/123 --dry-run
          note: Show what would be added without writing to the board.
      default_notes: {}
    summary: Issue をプロジェクトのボードに足し、Status を設定します。
    arguments:
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      status: '足した Issue に設定する Status です。`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - 'Issue を 1 件、アクティブなプロジェクトのボードに足し、続けて Status の欄を設定します。pecot の外で作った Issue に使います。'
      - 'Issue の参照は、`owner/repo/N` か、短い形の `N` です。'
      - '短い形の `N` は、引数 `repo` で渡したリポジトリの Issue を指します。'
      - '`repo` が無いときの短い形の `N` は、git remote のリポジトリの Issue を指します。'
      - 'Issue のリポジトリは、アクティブなプロジェクトに登録されていなければなりません。'
      - '`status` は `backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかで、Status をその値にします。'
      - '`status` を空にすると、Status を設定せず、Issue を足すだけです。'
      - '既にボードにある Issue を、重ねて足すことはありません。'
      - '`status` がこれらの値のどれでもないと、何も足さずに失敗を返します。'
      - '`status` の値をボードが定義していないと、何も足さずに失敗を返します。'
      - '`dry_run` を付けると、Issue を読み、足す予定と設定する予定の Status を結果に入れて、ボードには何も書きません。'
      - '`project` で、使うプロジェクトの設定の名前を渡します。省くと、Issue のリポジトリを含む設定を使い、2 つ以上あるときは、そのうちアクティブな設定を使います。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        issue: 'ボードに足した Issue です。`owner/repo/N` の形です。'
        added: 'Issue をボードに足したかどうかです。成功のときは、いつも `true` です。`dry_run` のときも `true` で、足す予定を示します。'
        status: '設定した Status です。`status` を空で渡したときは入りません。`dry_run` のときは、設定する予定の値です。'
        dryRun: '`dry_run` のときだけ `true` で入ります。ボードには何も書いていません。'
    diagnostics: '標準エラーに、足した Issue の結果の行（`added`）と、Status の結果の行（`set`）を出します。`--status` が有効な値でないときは、有効な値を並べた `error` の行を出します。`--status` の値をボードが定義していないときも、`error` の行を出します。値が `blocked` のときは、`hint` の行が `pecot project init` の実行を案内します。'
    environment: []
    exit_status:
      - kind: invalid-input
        code: 1
        when: '`status` が有効な値ではありません。'
      - kind: status-not-configured
        code: 1
        when: '`status` の値をボードが定義していません。'
      - kind: no-active-project
        code: 1
        when: '対象のリポを含むプロジェクトの設定が 2 つ以上あり、使う設定が決まりません。アクティブなプロジェクトが候補を指さず、`project` もありません。'
      - kind: project-not-found
        code: 1
        when: '`project` の名前の設定がありません。'
      - kind: repo-not-in-project
        code: 1
        when: 'リポジトリがプロジェクトにありません。'
      - kind: invalid-input
        code: 2
        when: 'Issue の参照の形が誤っています。リポジトリが決まらないのに短い形を渡したときと、ほかの引数の誤りも含みます。'
      - kind: github-auth
        code: 1
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        code: 1
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        code: 1
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        code: 1
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        code: 1
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        code: 1
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        code: 1
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '`status` が有効な値でないか、ボードが定義していない値のときは、Issue を足す前に失敗を返します。Issue を足した後で Status の設定に失敗したときは、Issue はボードに残ります。結果の `added` を `true` にしたまま失敗を返し、`detail` に書けなかった Status を示します。'
    effects:
      - target: github
        kind: read
        what: 'プロジェクトにつながっているリポジトリと、Issue の node ID を読みます。'
      - target: github
        kind: write
        what: 'Issue をプロジェクトのボードに足し、Status の欄を設定します。`dry_run` のときは書きません。'
      - target: file
        kind: read
        what: 'プロジェクトの設定ファイルを読みます。対象のリポを含む設定を探すため、`.pecot/config/projects` の設定ファイルとアクティブな設定ファイルを全部読みます。'
    prerequisites:
      - '対象のリポを `repositories` か `aggregation_repo` に持つプロジェクトの設定が要ります。2 つ以上あるときは、アクティブなプロジェクトか `project` で選びます。'
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - arguments:
          issue_ref: example-org/my-repo/123
        note: 'Issue をボードに足し、Status を `ready` にします。'
      - arguments:
          issue_ref: example-org/my-repo/123
          status: backlog
        note: 'Issue をボードに足し、Status を `backlog` にします。'
      - arguments:
          issue_ref: example-org/my-repo/123
          dry_run: true
        note: 'ボードへ書き込まず、する予定を返します。'
    default_notes: {}
    behaviors:
      - id: PW-BOARD-ADD-01
        pattern: event
        statement: 'Issue の参照を渡して呼ぶと、その Issue をアクティブなプロジェクトのボードに足します'
      - id: PW-BOARD-ADD-02
        pattern: event
        statement: '`status` を省いて呼ぶと、足した項目の Status を `ready` にします'
      - id: PW-BOARD-ADD-03
        pattern: event
        statement: '`status` に値を渡して呼ぶと、足した項目の Status をその値にします'
      - id: PW-BOARD-ADD-04
        pattern: event
        statement: '`status` に空文字を渡して呼ぶと、Status を設定せずに Issue だけをボードに足します'
      - id: PW-BOARD-ADD-05
        pattern: event
        statement: 'Issue の参照に番号だけを渡して `repo` を付けると、そのリポジトリの Issue を足します'
      - id: PW-BOARD-ADD-06
        pattern: event
        statement: 'Issue の参照に番号だけを渡して `repo` を省くと、git の remote のリポジトリの Issue を対象にします'
      - id: PW-BOARD-ADD-07
        pattern: event
        statement: 'Issue をボードに足すと、結果の `issue` にその Issue を入れ、`added` を `true` にします'
      - id: PW-BOARD-ADD-08
        pattern: event
        statement: 'Status を設定すると、結果の `status` にその値を入れます'
      - id: PW-BOARD-ADD-09
        pattern: unwanted
        statement: 'もし `status` が 7 つの有効な値のどれでもないなら、有効な値を並べた `detail` を返します'
      - id: PW-BOARD-ADD-10
        pattern: unwanted
        statement: 'もし `status` が `backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれでもないなら、Issue をボードに足しません'
      - id: PW-BOARD-ADD-11
        pattern: unwanted
        statement: 'もし `status` が 7 つの有効な値のどれでもないなら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-BOARD-ADD-12
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が 2 つ以上あり、アクティブなプロジェクトがそのどれも指さないなら、`kind` が `no-active-project` の失敗を返します。`detail` に候補の名前と `project` の案内を入れます'
      - id: PW-BOARD-ADD-13
        pattern: unwanted
        statement: 'もし Issue の参照が不正なら、`kind` が `invalid-input` の失敗を返します'
      - id: PW-BOARD-ADD-14
        pattern: unwanted
        statement: 'もし Issue のリポジトリがプロジェクトに登録されていないなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-BOARD-ADD-15
        pattern: unwanted
        statement: 'もし GitHub API がエラーを返したなら、失敗を返します'
      - id: PW-BOARD-ADD-16
        pattern: unwanted
        statement: 'もし `status` の値をボードが定義していないなら、Issue をボードに足しません'
      - id: PW-BOARD-ADD-17
        pattern: unwanted
        statement: 'もし `status` の値をボードが定義していないなら、`kind` が `status-not-configured` の失敗を返します'
      - id: PW-BOARD-ADD-18
        pattern: unwanted
        statement: 'もし `status` が `blocked` でボードが Blocked を定義していないなら、`project_init` で足し方を案内する文を `detail` に入れます'
      - id: PW-BOARD-ADD-19
        pattern: event
        statement: '`dry_run` を付けて呼ぶと、Issue をボードに足さず、足す予定と設定する予定の Status を結果に入れ、`dryRun` を `true` にして成功を返します'
      - id: PW-BOARD-ADD-20
        pattern: unwanted
        statement: 'もし Issue を足した後で Status の書き込みに失敗したなら、書けなかった Status を `detail` に入れて失敗を返します。選択肢の ID が古くて書けないときは、ID を読み直す `project_activate` の案内を添えます'
      - id: PW-BOARD-ADD-21
        pattern: unwanted
        statement: 'もし対象のリポを含む設定が無いなら、`kind` が `repo-not-in-project` の失敗を返します'
      - id: PW-BOARD-ADD-22
        pattern: event
        statement: '`project` に設定の名前を渡して呼ぶと、対象のリポを含む設定が 2 つ以上あっても、その設定を使います'
  PW-BOARD-MOVE:
    help:
      details:
        - Sets the Status of an Issue that is already on the project board of the active project.
        - The Issue reference is owner/repo/N or the short form N.
        - The short form N refers to the Issue of the repository given by the global pecot --repo.
        - Without --repo, the short form N refers to the Issue of the repository of the git remote.
        - The status is backlog, pending, blocked, ready, active, in_review or archived.
        - The status is checked before the config file is read.
        - The repository of the Issue must be registered in the active project, and the Issue must be on the board.
        - Unlike pecot board add, which only warns, a status that the board does not define stops the command with exit status 1.
        - With --dry-run, reads the board item and prints a dry-run line for setting the Status, and writes nothing to the board.
        - --project names the project config to use. Without it, the config that includes the repository of the Issue is used; when several do, the active one among them.
      examples:
        - run: pecot board move example-org/my-repo/123 in_review
          note: Move the Issue to In Review.
        - run: pecot board move example-org/my-repo/123 in_review --dry-run
          note: Show the planned Status change without writing to the board.
      default_notes: {}
    summary: Issue の番号で、プロジェクトのボード上の Issue の Status を更新します。ふだんは、pecot のコマンドが自分で Status を設定します。
    arguments:
      issue_ref: 'Issue の参照です。`owner/repo/N` か、番号だけの短い形 `N` で渡します。短い形の `N` は、引数 `repo` の値で補います。その値が無ければ、セッションのディレクトリの git remote で補います。'
      status: '設定する Status です。`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかを渡します。'
      project: '`.pecot/config/projects` の下にある、プロジェクトの設定の名前です。`.json` を付けずに渡します。省くと、Issue のリポジトリを含む設定を使います。'
      dry_run: '何も書かずに、する予定だけを返すかどうかです。'
    constraints: []
    details:
      - 'アクティブなプロジェクトのボードに既にある Issue の、Status を設定します。'
      - 'Issue の参照は、`owner/repo/N` か、短い形の `N` です。'
      - '短い形の `N` は、引数 `repo` で渡したリポジトリの Issue を指します。'
      - '`repo` が無いときの短い形の `N` は、git remote のリポジトリの Issue を指します。'
      - '`status` は、`backlog`・`pending`・`blocked`・`ready`・`active`・`in_review`・`archived` のどれかです。'
      - '`status` は、設定ファイルを読む前に確かめます。'
      - 'Issue のリポジトリはアクティブなプロジェクトに登録されていて、Issue はボードに載っていなければなりません。'
      - 'ボードが定義していない `status` を渡すと、失敗を返します。'
