  PW-PROJECT-GET:
    summary: 設定のキーの値を出します。キーは Epic を集めるリポジトリ（`aggregation_repo`）です。
    arguments:
      key: '設定のキーです。今のキーは `aggregation_repo`（Epic を集めるリポジトリ）だけです。'
    constraints: []
    details:
      - 'アクティブな設定ファイルに保存してある、Epic を集めるリポジトリを `value` に入れて返します。未設定のときは、`value` を入れません。'
      - 'キーは `aggregation_repo` だけです。ほかのキーを渡すと、`kind` が `invalid-input` の失敗を返します。'
    stdin: none
    output:
      format: text
      description: 'Epic を集めるリポジトリを `owner/repo` の形で書いた 1 行か、`none` です。'
    mcp_output:
      fields:
        key: '読んだ設定のキーです。今は `aggregation_repo` だけです。'
        value: 'キーの値です。未設定のときは入りません。'
    diagnostics: default
    environment: []
    exit_status:
      - kind: no-active-project
        when: 'アクティブなプロジェクトがありません。'
      - kind: config-invalid
        when: 'アクティブな設定ファイルの内容が不正です。'
      - kind: invalid-input
        when: '`key` がありません。`key` が `aggregation_repo` でないときと、知らない引数などほかの引数の誤りも含みます。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: default
    effects:
      - target: file
        kind: read
        what: 'アクティブな設定ファイルを読みます。'
    prerequisites:
      - 'アクティブなプロジェクトが要ります（`project_activate` で決めます）。'
    idempotent: true
    examples:
      - arguments:
          key: aggregation_repo
        note: 'Epic を集めるリポジトリを返します。'
    default_notes: {}
    behaviors:
      - id: PW-PROJECT-GET-01
        pattern: event
        statement: '値を設定していると、その値を結果の `value` に入れます'
      - id: PW-PROJECT-GET-02
        pattern: event
        statement: '未設定だと、結果に `value` を入れずに成功を返します'
      - id: PW-PROJECT-GET-03
        pattern: unwanted
        statement: 'もしアクティブなプロジェクトが無いなら、`kind` が `no-active-project` の失敗を返します'
      - id: PW-PROJECT-GET-04
        pattern: unwanted
        statement: 'もし `aggregation_repo` でないキーを渡したなら、`kind` が `invalid-input` の失敗を返します'
  PW-PROJECT-INIT:
    summary: 既にあるプロジェクトに pecot-status のフィールドを足し、旧い形から移します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。
    arguments:
      confirm_delete: 'pecot が使わないフィールドを消すかどうかです。消すフィールドは `migration.pending_delete` に出ます。消したフィールドの値は戻らないので、利用者が消すことを承認した後にだけ `true` にします。'
      host: 'GitHub のホストです。'
      lanes: '`pecot-lane` のフィールドの値の配列です。値は、プラグイン・チーム・サービスのような作業の領域です。1 つ以上渡します。'
      name: 'プロジェクトの題です。'
      owner: 'プロジェクトの所有者です。'
    constraints: []
    details:
      - '既にあるプロジェクトに、`pecot-status` のフィールドを足します。`pecot-priority`・`pecot-size` のフィールドは作りません。'
      - '旧い名前の `pecot-workflow-<suffix>` のフィールドがあり、`pecot-status` が無いときは、`pecot-status` に改名します。名前だけを変えるので、選択肢とカードの値は残ります。両方あるときは `pecot-status` を使い、旧いフィールドを消す予定に入れます。'
      - '既にあるフィールドは飛ばします。'
      - 'pecot が使わないフィールドは、`pecot-priority`・`pecot-size` と、`pecot-status` と並んで残る旧い `pecot-workflow-<suffix>` です。'
      - '`confirm_delete` が無いときは、使わないフィールドを消さず、名前を `migration.pending_delete` へ入れて `warnings` で知らせます。消したフィールドの値は戻りません。利用者へ名前を示し、承認を得てから `confirm_delete` を付けて呼び直します。'
      - '`confirm_delete` が `true` のときは、設定ファイルを書いた後に、使わないフィールドを消して `migration.deleted` に入れます。'
      - '設定ファイルに旧い形の `fields.priority`・`fields.size` が残っているときは、読み捨て、書き直して消します。'
      - '既にある `pecot-status` のフィールドには、Blocked の選択肢を Backlog の直後に足します。Backlog が無ければ Ready の直前、どちらも無ければ末尾に足します。'
      - 'Status のフィールドの末尾に、Needs Attention の選択肢を足します。プロジェクトに Status のフィールドが無いときは、何も足しません。'
      - '名前は、大文字と小文字を区別せずに比べます。既にある選択肢は、そのまま残します。'
      - '選択肢の一覧は、全体を送り直します。既にある選択肢は id・name・color・description を保つので、カードの値は残ります。'
      - '選択肢を足せないときは、`warnings` に入れて続けます。その選択肢を、id なしで送り直すことはありません。'
      - '`lanes` を渡し、`pecot-lane` のフィールドが無いときは、その値を選択肢に持つ single select の `pecot-lane` を作ります。値は、プラグイン・チーム・サービスのような作業の領域です。'
      - '`lanes` を渡し、`pecot-lane` があるときは、既にある選択肢を id ごと残し、無い値を末尾に足します。名前は、大文字と小文字を区別して比べます。'
      - '`lanes` が無く、`pecot-lane` も無いときは作らず、`lanes` の渡し方の案内を `warnings` に入れます。'
      - 'ボードに `pecot-lane` があると、`Lanes` という名前のボードのビューを作ります。列は `pecot-status`、グループは `pecot-lane` です。同じ名前のビューが既にあれば、作りません。'
      - 'GitHub がビューの作成を断ったとき（状態 403・404）は、画面で作る手順を `view.manual_steps` に入れて続けます。例えば、GitHub App のトークンでは、個人のボードにビューを作れません。'
      - '`pecot-lane` が single select でないときは、値を足さず、ビューも作らずに、`warnings` で知らせます。'
      - '何かを書く前に、既にある `pecot-status` か `pecot-workflow-<suffix>` のフィールドが必須の 6 つの選択肢を持つことを確かめます。6 つは Backlog・Pending・Ready・Active・In Review・Archived です。1 つでも欠けていれば、何も書かずに失敗を返します。'
      - 'その後、設定ファイル `<host>_<owner>_<番号>.json` を GitHub から作り直し、プロジェクトをアクティブにします。設定ファイルがあり、内容がボードから作るものと既に同じときは行いません。'
      - '同じプロジェクトを指す、別の名前の設定ファイルがあれば、新しい名前に移し、アクティブなプロジェクトも新しい名前にします。`project` の入力と Actions の変数 `PECOT_REVIEW_PROJECT` には、新しい名前を使います。移す元が 2 つ以上あるときは、何も移さずに失敗を返します。'
      - 'Status のフィールドの Todo・In Progress・Needs Attention は、ボードにあるときだけ設定ファイルに書きます。`pecot-lane` は設定ファイルに書きません。'
    stdin: none
    output:
      format: none
    mcp_output:
      fields:
        fields: 'プロジェクトのフィールドの配列です。`pecot-status`・`pecot-lane` のフィールドと、選択肢を調べたときの Status フィールドと、消したフィールドを含みます。要素は `name`・`change`・`addedOptions` を持ちます。`change` の値は `create`（作った）・`update`（選択肢を足した）・`unchanged`（何もしない）です。ほかに `skip`（飛ばした）・`rename`（旧い名前から改名した）・`delete`（消した）があります。`skip` は、フィールドが見つからないとき、`lanes` が無く `pecot-lane` を作らないとき、`pecot-lane` が single select でないときです。`addedOptions` は足した選択肢の名前の配列で、無ければ空です。'
        view: '`Lanes` のビューです。`created`（作ったか）・`name`・`url`・`manual_steps`（画面で作る手順）を持ちます。同じ名前のビューが既にあれば、`created` は false で、`url` にそのビューの URL が入ります。`url` は、画面で作るときは入りません。`manual_steps` は、GitHub が作成を断ったときだけ入ります。ボードに single select の `pecot-lane` が無いときは入りません。'
        migration: '旧い形から移したものです。`renamed` は `pecot-status` に改名した旧いフィールドの名前、`config_moved` は移した設定ファイルの `from`・`to` のファイル名で、無ければどちらも `null` です。`pending_delete` は、`confirm_delete` が無いので残した、pecot が使わないフィールドの名前の配列です。`deleted` は消したフィールドの名前の配列です。どちらも無ければ空です。設定ファイルの前に止まったときは入りません。'
    diagnostics: '標準エラーに、旧いフィールドを改名した行（`renamed`）、フィールドごとの結果の行（`created` か `skipped`）と、選択肢ごとの結果の行（`added` か `unchanged`）を出します。Status のフィールドが見つからないときは、`skipped` の行を出します。`lanes` が無く `pecot-lane` も無いときは、`skipped` の行と、`lanes` の渡し方を案内する `warning` の行を出します。ビューの結果の行（`created` か `skipped`）を出します。選択肢を足せないとき、ビューを作れないとき、`pecot-lane` が single select でないときは、`warning` の行を出します。設定ファイルを移したときは、`moved` の行と、新しい名前を使うよう案内する `warning` の行を出します。設定ファイルを書いたときは、設定ファイルの結果の行（`created` か `updated`）と、アクティブなプロジェクトの結果の行（`set`）を出します。pecot の使わないフィールドが残り、`confirm_delete` も無いときは、名前と承認を得る手順を書いた `warning` の行を出します。`confirm_delete` を付けたときは、消したフィールドごとに `deleted` の行を出します。'
    environment: []
    exit_status:
      - kind: project-not-found
        when: 'プロジェクトが見つかりません。'
      - kind: not-initialized
        when: 'プロジェクトのフィールドを読めません。既にある進行の欄に必須の選択肢が無いときも含みます。'
      - kind: config-invalid
        when: '同じプロジェクトを指す、別の名前の設定ファイルが 2 つ以上あります。'
      - kind: invalid-input
        when: '必須の `owner`・`name` のどちらかが無いか、知らない引数など、ほかの引数の誤りがあります。'
      - kind: github-auth
        when: 'GitHub トークンが見つからないか、GitHub がトークンを拒みました。'
      - kind: github-not-found
        when: 'GitHub に対象が見つかりません。'
      - kind: github-rate-limit
        when: 'GitHub API のレート制限に当たりました。'
      - kind: github-api
        when: 'GitHub API がほかのエラーを返しました。'
      - kind: project-root-not-found
        when: 'プロジェクトのルートを決められません。'
      - kind: other
        when: 'ほかの名前に当たらない失敗です。MCP のツールでは、コマンドの想定外の例外も含みます。'
      - kind: session-directory-unresolved
        when: 'MCP のツールだけで起きます。サーバがセッションのディレクトリを決められず、コマンドを動かしません。'
    on_error: '失敗した手順より前に作ったフィールドと足した選択肢は、プロジェクトに残ります。この失敗の結果にも、そこまでの `fields` が入ります。選択肢を足せなかったときと、ビューの作成を 403・404 で断られたときは、`warnings` で知らせて成功を返します。ビューの作成でほかのエラーが返ると、設定ファイルを書かずに失敗を返します。'
    effects:
      - target: github
        kind: read
        what: '所有者のプロジェクト、対象のプロジェクトのフィールドとビュー、つながっているリポジトリを読みます。'
      - target: github
        kind: write
        what: 'プロジェクトに足りないフィールドを作ります。`lanes` の値で `pecot-lane` を作り、`Lanes` のビューを作ります。'
      - target: github
        kind: destructive
        what: '旧い名前の進行の欄を改名します。既にあるフィールドの選択肢の一覧を置き換えて、Blocked と Needs Attention を足します。`lanes` の値で、既にある `pecot-lane` の選択肢の一覧を置き換えます。`confirm_delete` が `true` のときは、pecot が使わないフィールドを消します。'
      - target: file
        kind: destructive
        what: '`.pecot/config/projects/` の下に設定ファイルを書き、アクティブなプロジェクトを設定します。既にある設定ファイルが、ボードから作るものと同じときは書きません。同じプロジェクトを指す別の名前の設定ファイルは、新しい名前に移します。'
    prerequisites:
      - 'ホストの GitHub トークンと、プロジェクトを編集する権限が要ります。'
    idempotent: true
    examples:
      - arguments:
          owner: example-org
          name: Example Project
        note: '既にあるプロジェクトに `pecot-status` のフィールドを足します。旧い名前の進行の欄は `pecot-status` に改名します。既にあるフィールドには、Blocked と Needs Attention の選択肢を足します。消す予定のフィールドを `migration.pending_delete` に返します。'
      - arguments:
          owner: example-org
          name: Example Project
          lanes: [cli, skills]
        note: '2 つの値で `pecot-lane` を作るか、無い値を足し、`Lanes` のビューを作ります。'
      - arguments:
          owner: example-org
          name: Example Project
          confirm_delete: true
        note: '利用者が承認した後に、`pending_delete` に出たフィールドを消します。'
