  PW-WORKTREE-LINK:
    constraints: []
    details:
      - Applies the links of worktree-config.json to the worktree in -D, or to every sub-worktree with --all, and replaces a link that already exists.
      - The links are read from the main worktree of the repository.
      - Run pecot worktree init when the config file is missing.
      - Without --all, the target is the root of the worktree that contains -D, so -D may be a subdirectory. The command stops when that root is the main worktree.
      - With --all and no sub-worktree, the command only reports a count of 0.
      - A link whose target does not exist is skipped.
      - A path tracked by git, or a link that cannot be created, is an error that is shown as a warning and does not change the exit status.
      - A real file or directory at a link path is replaced only after a confirmation on stderr that is answered on stdin, or without asking with --force.
      - With --all and without --force, a real file is skipped without asking.
      - When a link path starts with .pecot/, writes .pecot/.gitignore in the worktree by running a script of the plugin before it links.
      - With --dry-run, shows for each link whether it would be created, updated or skipped, and changes nothing.
      - With --dry-run, each link is decided the same way as in the real run, so a link the run skips is planned as a skipped line with the same reason. With --all and without --force, a real file is planned as skipped.
      - A path tracked by git is planned as skipped, and the real run writes a warning line for it and counts it as an error.
      - Needs a devcontainer.
    stdin: A y or n answer to the overwrite prompt. The prompt is asked only for a single worktree, without --force, when a real file or directory that git does not track exists at a link path. An end of input aborts the command.
    output:
      format: none
    diagnostics: A count line of the symlinks created for each worktree, and a skipped line for each skipped link, on stderr. With --all and more than one worktree, count lines of the totals. A warning line for each link that could not be created. Dry-run lines with --dry-run. An error line for a failure. Outside a devcontainer or with an invalid config file, a traceback instead of an error line.
    environment:
      - name: REMOTE_CONTAINERS
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: CODESPACES
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
      - name: DEVCONTAINER
        effect: A non-empty value marks the environment as a devcontainer. Not read when /.dockerenv exists.
    exit_status:
      - code: 0
        when: The links were applied or planned, including when links were skipped or could not be created.
      - code: 1
        when: --repo differs from the current git remote, --repo is omitted outside a git repository, the config file is missing, the config file is invalid or the command runs outside a devcontainer (a traceback is printed), the main worktree or the project root cannot be found, -D is the main worktree without --all, the worktree list cannot be read, or the overwrite prompt is aborted.
      - code: 2
        when: -D is missing or is not an existing directory, or another command line error occurs.
    on_error: Links already created in this run stay. A link that could not be created is left as it was, and the other links are still processed.
    effects:
      - target: git
        kind: read
        what: Reads the worktree list and asks whether a link path is tracked.
      - target: file
        kind: read
        what: Reads worktree-config.json.
      - target: file
        kind: write
        what: Creates the symlinks, replaces the ones that exist, and writes .pecot/.gitignore in the worktree.
      - target: file
        kind: destructive
        what: Deletes a real file or directory at a link path that the user confirmed or --force allowed.
      - target: process
        kind: write
        what: Runs the script that writes .pecot/.gitignore.
    prerequisites:
      - The command runs in a devcontainer.
      - The repository is in the layout <project root>/base/<repository>, and worktree-config.json exists (pecot worktree init).
    idempotent: true
    examples:
      - run: pecot worktree link -D ../wt1/my-repo
        note: Apply the links to one sub-worktree.
      - run: pecot worktree link -D . --all --dry-run
        note: Show the links that would change in every sub-worktree.
      - run: pecot worktree link -D . --all --force
        note: Replace real files at link paths in every sub-worktree without asking.
    default_notes: {}
    behaviors:
      - id: PW-WORKTREE-LINK-01
        pattern: event
        statement: サブの worktree を -D に渡して打つと、worktree-config.json のリンクをその worktree に作る
      - id: PW-WORKTREE-LINK-02
        pattern: event
        statement: --all を付けて打つと、すべてのサブの worktree にリンクを作る
      - id: PW-WORKTREE-LINK-03
        pattern: event
        statement: すでにリンクがあると、張り替える
      - id: PW-WORKTREE-LINK-04
        pattern: event
        statement: リンク先が無いと、そのリンクを飛ばす
      - id: PW-WORKTREE-LINK-05
        pattern: event
        statement: --force を付けずにリンクのパスに実ファイルがあるサブの worktree を --all なしで打つと、上書きしてよいかを標準エラーで尋ねる
      - id: PW-WORKTREE-LINK-06
        pattern: event
        statement: 上書きの確認に y と答えると、実ファイルかディレクトリを消す
      - id: PW-WORKTREE-LINK-07
