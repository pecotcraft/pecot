[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

# `cli/` ディレクトリ自身が Python パッケージとして配布される (cli/__init__.py 存在)。
# setuptools 標準 find は where 配下の subdir しか検出しない。
# そのため cli/ 自体を明示的に package として宣言する。
# package-dir で「cli パッケージ = カレントディレクトリ」とマッピングする。

# `cli` は同一 monorepo 内のみで使う internal import 名で、PyPI への配布想定なし。
# distribution name は `pecot` ([project] name = "pecot") に対し import top-level は `cli` という
# 非対称になる。導入先では `bin/pecot` が cli/ の作業用コピーから、データ置き場の venv へ
# 非 editable で導入する（`uv sync --no-editable`）。開発とテストは `cli/.venv`（editable）を使う。
# src layout (cli/pecot/) へ戻したくなる reviewer 向けの記録（PR #743 #742 参照）。
[tool.setuptools]
packages = [
    "cli",
    "cli.commands",
    "cli.core",
    "cli.core.github",
    "cli.tests",
    "cli.tests.ci",
    "cli.tests.cli",
    "cli.tests.core",
    "cli.tests.unit",
    "cli.tests.e2e",
]
package-dir = { "cli" = "." }

[tool.setuptools.package-data]
cli = ["templates/**/*", "py.typed"]

[project]
name = "pecot"
# nx-release は CLI runtime 解決に切り替えたため bump 不要。
# 解決の方法は、bin/pecot が export する CLAUDE_PLUGIN_ROOT の plugin.json 直読み（ソースツリーでは __file__ 相対）。
# 0.0.0 pin は意図的設計（PR #741）。
version = "0.0.0"
license = "MIT"
description = "pecot-workflow CLI / plugin backend"
requires-python = ">=3.10,<3.15"
dependencies = [
    "typer>=0.26.0",
    "pydantic>=2.1",
    "httpx>=0.27.0",
    "gql[httpx]>=4.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pathspec>=1.0.0",
]

[project.scripts]
pecot = "cli.commands.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20250915",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "respx>=0.23.0",
]

# ruff設定
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (line-lengthで制御)
]

[tool.ruff.lint.isort]
known-first-party = ["cli"]

# pytest設定
# testpaths は plugins/pecot-workflow/cli/ を CWD として解決される
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 30
pythonpath = [".."]

# coverage設定
[tool.coverage.run]
source = ["cli"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# pyright設定
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
extraPaths = [".."]
# cli/ 直下を再帰的に拾うと .venv / build / __pycache__ も対象になり 30k+ エラーを生むため
# include を明示し、exclude で .venv 等を排除する。
include = ["commands", "core", "templates", "__init__.py", "__main__.py", "../scripts/ci/compare_junit.py"]
exclude = ["tests", "**/__pycache__", "**/.venv", "**/build", "**/*.egg-info"]

# uv の path source cache-keys
[tool.uv]
# 公開から 1 日未満の版を lock に入れない。lock には期間（exclude-newer-span）だけが反映される形で記録される。
# そのため時間が経っても uv sync --locked は落ちない。
exclude-newer = "1 day"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "{commands,core,templates}/**/*.py" },
    { file = "{commands,core,templates}/**/*.md" },
    { file = "__init__.py" },
    { file = "__main__.py" },
]
