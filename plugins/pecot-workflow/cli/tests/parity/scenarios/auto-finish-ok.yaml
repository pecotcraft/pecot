# 結果が pr-created なら、結果のコメントを書き、起動ラベルを外す。Status は書かない。GITHUB_RUN_ID が無いので、目印を付けない。
id: auto-finish-ok
command:
  path: [auto, finish]
  args: [acme/demo/7, --result, pr-created]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6",
                  "blocked": "o7"
                }
              },
              "status": {
                "id": "PVTSSF_status",
                "options": {
                  "needs_attention": "s1",
                  "todo": "s2"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: GetIssuePrerequisites
      variables: {owner: acme, repo: demo, number: 7}
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"id": "I_demo_7", "number": 7, "state": "OPEN", "title": "課題7", "repository": {"owner": {"login": "acme"}, "name": "demo"}, "issueType": {"name": "Task"}, "subIssues": {"totalCount": 0}, "projectItems": {"totalCount": 1, "nodes": [{"project": {"id": "PVT_1"}, "fieldValues": {"nodes": [{"name": "Active", "optionId": "o4", "field": {"id": "PVTSSF_workflow", "name": "pecot-status"}}]}, "label": null}]}, "linkedBranches": {"totalCount": 0, "nodes": []}, "closedByPullRequestsReferences": {"totalCount": 0, "nodes": []}, "body": "本文", "parent": null, "blockedBy": {"totalCount": 0, "nodes": []}}}}}
  - match:
      method: POST
      path: /repos/acme/demo/issues/7/comments
    respond:
      status: 201
      body: {id: 9, html_url: "https://ghes.example.com/acme/demo/issues/7#issuecomment-9"}
  - match:
      method: DELETE
      path: /repos/acme/demo/issues/7/labels/pecot-auto
    respond:
      status: 200
      body: []
