# Blocked の無い進行の欄と、Needs Attention の無い Status に値を足す（id 付きで全件を送り直す）。足した後の盤面で設定ファイルを作る。
id: project-init-ok-add-option
command:
  path: [project, init]
  args: [acme, board, --suffix, acme, --host, ghes.example.com]
setup:
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: ListProjectsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectsV2": {"nodes": [{"number": 1, "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "id": "PVT_1"}]}}}}
  - match:
      operation: GetProjectFieldsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectV2": {"id": "PVT_1", "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "views": {"nodes": [{"number": 1}]}, "fields": {"nodes": [{"id": "PVTF_title", "name": "Title"}, {"id": "MDEyOlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkNDU2", "name": "pecot-workflow-acme", "databaseId": 456, "options": [{"id": "o1", "name": "Pending", "color": "GRAY", "description": "Pending desc"}, {"id": "o2", "name": "Backlog", "color": "GRAY", "description": "Backlog desc"}, {"id": "o3", "name": "Ready", "color": "GRAY", "description": "Ready desc"}, {"id": "o4", "name": "Active", "color": "GRAY", "description": "Active desc"}, {"id": "o5", "name": "In Review", "color": "GRAY", "description": "In Review desc"}, {"id": "o6", "name": "Archived", "color": "GRAY", "description": "Archived desc"}]}, {"id": "PVTSSF_priority", "name": "pecot-priority", "options": [{"id": "p1", "name": "High"}, {"id": "p2", "name": "Medium"}, {"id": "p3", "name": "Low"}]}, {"id": "PVTSSF_size", "name": "pecot-size", "options": [{"id": "s1", "name": "XS"}, {"id": "s2", "name": "S"}, {"id": "s3", "name": "M"}, {"id": "s4", "name": "L"}]}, {"id": "PVTSSF_status", "name": "Status", "options": [{"id": "t1", "name": "Todo", "color": "GRAY", "description": "Todo desc"}, {"id": "t2", "name": "In Progress", "color": "GRAY", "description": "In Progress desc"}, {"id": "t3", "name": "Done", "color": "GRAY", "description": "Done desc"}]}]}}}}}
  - match:
      operation: UpdateProjectField
      variables: {"fieldId": "MDEyOlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkNDU2"}
    respond:
      status: 200
      body: {"data": {"updateProjectV2Field": {"projectV2Field": {"id": "MDEyOlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkNDU2", "name": "x", "options": []}}}}
  - match:
      operation: UpdateProjectField
      variables: {"fieldId": "PVTSSF_status"}
    respond:
      status: 200
      body: {"data": {"updateProjectV2Field": {"projectV2Field": {"id": "PVTSSF_status", "name": "x", "options": []}}}}
  - match:
      operation: ListProjectsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectsV2": {"nodes": [{"number": 1, "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "id": "PVT_1"}]}}}}
  - match:
      operation: GetProjectFieldsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectV2": {"id": "PVT_1", "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "views": {"nodes": [{"number": 1}]}, "fields": {"nodes": [{"id": "PVTF_title", "name": "Title"}, {"id": "MDEyOlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkNDU2", "name": "pecot-workflow-acme", "databaseId": 456, "options": [{"id": "o1", "name": "Pending", "color": "GRAY", "description": "Pending desc"}, {"id": "o2", "name": "Backlog", "color": "GRAY", "description": "Backlog desc"}, {"id": "o3", "name": "Blocked", "color": "GRAY", "description": "Blocked desc"}, {"id": "o4", "name": "Ready", "color": "GRAY", "description": "Ready desc"}, {"id": "o5", "name": "Active", "color": "GRAY", "description": "Active desc"}, {"id": "o6", "name": "In Review", "color": "GRAY", "description": "In Review desc"}, {"id": "o7", "name": "Archived", "color": "GRAY", "description": "Archived desc"}]}, {"id": "PVTSSF_priority", "name": "pecot-priority", "options": [{"id": "p1", "name": "High"}, {"id": "p2", "name": "Medium"}, {"id": "p3", "name": "Low"}]}, {"id": "PVTSSF_size", "name": "pecot-size", "options": [{"id": "s1", "name": "XS"}, {"id": "s2", "name": "S"}, {"id": "s3", "name": "M"}, {"id": "s4", "name": "L"}]}, {"id": "PVTSSF_status", "name": "Status", "options": [{"id": "t1", "name": "Todo", "color": "GRAY", "description": "Todo desc"}, {"id": "t2", "name": "In Progress", "color": "GRAY", "description": "In Progress desc"}, {"id": "t3", "name": "Done", "color": "GRAY", "description": "Done desc"}, {"id": "t4", "name": "Needs Attention", "color": "GRAY", "description": "Needs Attention desc"}]}]}}}}}
  - match:
      operation: GetLinkedRepositoriesUser
    respond:
      status: 200
      body: {"data": {"user": {"projectV2": {"repositories": {"nodes": []}}}}}
