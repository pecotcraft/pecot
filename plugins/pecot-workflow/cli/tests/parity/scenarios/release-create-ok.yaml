# CHANGELOG のリリースノートで GitHub release を作る。POST が 201。
id: release-create-ok
command:
  path: [release, create]
  args:
    - "0.2.0"
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main",
              "release_branch": "release"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      CHANGELOG.md: |
        # Changelog

        ## [0.2.0] - 2026-01-02

        ### 追加

        - 新機能 A
        - 新機能 B

        ## [0.1.0] - 2026-01-01

        ### 追加

        - 初回リリース
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: "POST"
      path: "/repos/acme/demo/releases"
      body: {"tag_name": "v0.2.0", "name": "v0.2.0", "target_commitish": "release", "draft": false, "prerelease": false}
    respond:
      status: 201
      body: {"id": 1, "tag_name": "v0.2.0", "html_url": "https://ghes.example.com/acme/demo/releases/tag/v0.2.0"}
