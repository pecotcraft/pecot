# 単独の PR を merge-async でマージする。200 の merged で、結果を読み直さずに終わる。
id: pr-merge-ok
tool: pr_merge
arguments:
  pr_ref: acme/demo/21
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main",
              "release_branch": "release"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: "GetPullRequestForMerge"
      variables: {"owner": "acme", "repo": "demo", "number": 21}
    respond:
      status: 200
      body: {"data": {"repository": {"pullRequest": {"number": 21, "state": "OPEN", "isDraft": false, "baseRefName": "main", "headRefOid": "abcdef0", "isMergeQueueEnabled": false, "isInMergeQueue": false}}}}
  - match:
      method: "GET"
      path: "/repos/acme/demo/stacks"
    respond:
      status: 200
      body: []
  - match:
      method: "PUT"
      path: "/repos/acme/demo/pulls/21/merge-async"
      body: {"sha": "abcdef0", "merge_method": "squash"}
    respond:
      status: 200
      body: {"status": "merged", "details": {"message": "Pull request merged", "sha": "1234567"}}
