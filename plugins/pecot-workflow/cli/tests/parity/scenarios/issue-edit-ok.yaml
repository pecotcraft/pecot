# ボードのフィールド Area を cli から docs に変える。定義と今の値を読み、変わる 1 つだけを書く。
id: issue-edit-ok
command:
  path: [issue, edit]
  args: [acme/demo/7, --attribute, "{\"name\":\"Area\",\"value\":\"docs\"}"]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: HasIssueFields
    times: 2
    respond:
      status: 200
      body: {"data": {"__type": {"name": "IssueFields"}}}
  - match:
      operation: GetIssueAttributes
      variables: {owner: acme, repo: demo, number: 7}
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"assignees": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": []}, "milestone": null, "labels": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": []}, "issueType": null, "issueFieldValues": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": []}, "projectItems": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": [{"id": "PVTI_7", "project": {"id": "PVT_1"}, "fieldValues": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": [{"__typename": "ProjectV2ItemFieldSingleSelectValue", "field": {"id": "F_area", "name": "Area", "dataType": "SINGLE_SELECT", "isIssueField": false}, "name": "cli"}]}}]}}}}}
  - match:
      operation: GetIssueAttributeDefinitions
      variables: {owner: acme, repo: demo, projectId: PVT_1}
    respond:
      status: 200
      body: {"data": {"project": {"fields": {"pageInfo": {"hasNextPage": false}, "nodes": [{"id": "F_area", "name": "Area", "dataType": "SINGLE_SELECT", "isIssueField": false, "options": [{"id": "A_cli", "name": "cli"}, {"id": "A_docs", "name": "docs"}]}]}}, "repository": {"issueTypes": {"pageInfo": {"hasNextPage": false}, "nodes": []}, "issueFields": {"pageInfo": {"hasNextPage": false}, "nodes": []}, "labels": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": []}, "milestones": {"pageInfo": {"hasNextPage": false, "endCursor": null}, "nodes": []}}}}
  - match:
      operation: UpdateProjectItemFieldValue
      variables: {projectId: PVT_1, itemId: PVTI_7, fieldId: F_area, value: {singleSelectOptionId: A_docs}}
    respond:
      status: 200
      body: {"data": {"updateProjectV2ItemFieldValue": {"projectV2Item": {"id": "PVTI_7"}}}}
