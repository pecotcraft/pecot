# PUT が 405。マージ失敗として exit 1。
id: release-merge-4xx
command:
  path: [release, merge]
  args:
    - "acme/demo/31"
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main",
              "release_branch": "release"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: "GetPullRequestSlim"
      variables: {"owner": "acme", "repo": "demo", "number": 31}
    respond:
      status: 200
      body: {"data": {"repository": {"pullRequest": {"number": 31, "state": "OPEN", "title": "release: v0.2.0 を出す", "body": "リリースの PR です。\n", "headRefName": "develop", "baseRefName": "release", "isDraft": false, "mergeable": "MERGEABLE", "comments": {"totalCount": 0}, "closingIssuesReferences": {"nodes": []}, "reviews": {"nodes": []}}}}}
  - match:
      method: "PUT"
      path: "/repos/acme/demo/pulls/31/merge"
      body: {"merge_method": "merge"}
    respond:
      status: 405
      body: {"message": "Pull Request is not mergeable"}
