# 設定に fields.status が無いと、GitHub を読まずに project init を案内して exit 1。
id: auto-gate-state-no-status
command:
  path: [auto, gate]
  args: [--event-name, issues, --event-path, event.json]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6",
                  "blocked": "o7"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      event.json: |
        {"action": "labeled", "label": {"name": "pecot-auto"}, "issue": {"number": 7, "state": "open"}, "sender": {"login": "alice"}, "repository": {"name": "demo", "full_name": "acme/demo", "owner": {"login": "acme"}}}
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github: []
