# 雛形の版と要る secret がそろう。変数の値は出さない。
id: workflow-doctor-ok
tool: workflow_doctor
arguments:
  name: review
setup:
  repo:
    files:
      .github/workflows/pecot-review.yml: |
        # pecot-workflow-template: review 10
        jobs:
          review:
            steps:
              - uses: pecotcraft/pecot/actions/review-finish@0123456789abcdef0123456789abcdef01234567 # pecot-actions/v1.0.0
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: GET
      path: /repos/acme/demo
    respond:
      status: 200
      body: {owner: {type: User}}
  - match:
      method: GET
      path: /repos/acme/demo/actions/secrets
    respond:
      status: 200
      body: {total_count: 1, secrets: [{name: CLAUDE_CODE_OAUTH_TOKEN}]}
  - match:
      method: GET
      path: /repos/acme/demo/actions/variables
    respond:
      status: 200
      body: {total_count: 1, variables: [{name: PECOT_AGENT_UNRELATED, value: must-not-appear}]}
