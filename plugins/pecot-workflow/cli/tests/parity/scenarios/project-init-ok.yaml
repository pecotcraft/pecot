# フィールドが 1 つも無いプロジェクトに init する。CreateProjectField を 1 回（pecot-status）受け、設定ファイルを作る。
id: project-init-ok
command:
  path: [project, init]
  args: [acme, board, --host, ghes.example.com]
setup:
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: ListProjectsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectsV2": {"nodes": [{"number": 1, "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "id": "PVT_1"}]}}}}
  - match:
      operation: GetProjectFieldsUser
      variables: {owner: acme, projectNumber: 1}
    respond:
      status: 200
      body: {"data": {"user": {"projectV2": {"id": "PVT_1", "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "fields": {"nodes": [{"id": "PVTF_title", "name": "Title"}]}}}}}
  - match:
      operation: CreateProjectField
      variables: {name: pecot-status}
    respond:
      status: 200
      body: {"data": {"createProjectV2Field": {"projectV2Field": {"id": "PVTSSF_w", "name": "pecot-status", "options": []}}}}
  - match:
      operation: ListProjectsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectsV2": {"nodes": [{"number": 1, "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "id": "PVT_1"}]}}}}
  - match:
      operation: GetProjectFieldsUser
    respond:
      status: 200
      body: {"data": {"user": {"projectV2": {"id": "PVT_1", "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "views": {"nodes": [{"number": 1}]}, "fields": {"nodes": [{"id": "PVTF_title", "name": "Title"}, {"id": "MDEyOlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkNDU2", "name": "pecot-status", "databaseId": 456, "options": [{"id": "o1", "name": "Backlog", "color": "GRAY", "description": "Backlog desc"}, {"id": "o2", "name": "Pending", "color": "GRAY", "description": "Pending desc"}, {"id": "o3", "name": "Ready", "color": "GRAY", "description": "Ready desc"}, {"id": "o4", "name": "Active", "color": "GRAY", "description": "Active desc"}, {"id": "o5", "name": "In Review", "color": "GRAY", "description": "In Review desc"}, {"id": "o6", "name": "Archived", "color": "GRAY", "description": "Archived desc"}]}]}}}}}
  - match:
      operation: GetLinkedRepositoriesUser
    respond:
      status: 200
      body: {"data": {"user": {"projectV2": {"repositories": {"nodes": []}}}}}
