# Dependabot の一覧が 403 で、vulnerability-alerts は 204（有効＝権限不足）。警告 2 行を出して通る（exit 0）。
id: release-preflight-ok-dependabot-unavailable
command:
  path: [release, preflight]
  args: []
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main",
              "release_branch": "release",
              "release_type": "nx"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: "GET"
      path: "/repos/acme/demo/dependabot/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 403
      body: {"message": "Resource not accessible by integration"}
  - match:
      method: "GET"
      path: "/repos/acme/demo/vulnerability-alerts"
    respond:
      status: 204
  - match:
      method: "GET"
      path: "/repos/acme/demo/code-scanning/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 200
      body: []
  - match:
      method: "GET"
      path: "/repos/acme/demo/secret-scanning/alerts"
      query: {"state": "open", "hide_secret": "true", "per_page": "100"}
    respond:
      status: 200
      body: []
