# 着手の跡の無い Active の Issue を、--dry-run で Ready へ戻す予定の行にする。書かない。
id: board-sync-ok-dry-run
command:
  path: [board, sync]
  args:
    - "--dry-run"
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "develop",
              "release_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: GET
      path: /rate_limit
    respond:
      status: 200
      body: {"resources": {"graphql": {"limit": 5000, "used": 100, "remaining": 4900, "reset": 1800000000}}}
  - match:
      operation: ListProjectItems
      variables: {projectId: PVT_1}
    respond:
      status: 200
      body: {"data": {"node": {"items": {"nodes": [{"id": "PVTI_2", "updatedAt": "2026-01-02T03:04:05Z", "fieldValues": {"nodes": [{"field": {"name": "pecot-workflow-acme"}, "name": "Active"}]}, "content": {"id": "I_2", "number": 2, "title": "作業中の課題", "state": "OPEN", "url": "https://ghes.example.com/acme/demo/issues/2", "labels": {"nodes": []}, "repository": {"owner": {"login": "acme"}, "name": "demo"}}}], "pageInfo": {"hasNextPage": false, "endCursor": null}}}}}
  - match:
      operation: GetIssuePrerequisites
      variables: {owner: acme, repo: demo, number: 2}
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"id": "I_2", "number": 2, "state": "OPEN", "title": "課題2", "repository": {"owner": {"login": "acme"}, "name": "demo"}, "issueType": {"name": "Task"}, "subIssues": {"totalCount": 0}, "projectItems": {"totalCount": 0, "nodes": []}, "linkedBranches": {"totalCount": 0, "nodes": []}, "closedByPullRequestsReferences": {"totalCount": 0, "nodes": []}, "timelineItems": {"totalCount": 0, "nodes": []}, "body": "本文", "parent": null, "blockedBy": {"totalCount": 0, "nodes": []}}}}}
  - match:
      method: GET
      path: /rate_limit
    respond:
      status: 200
      body: {"resources": {"graphql": {"limit": 5000, "used": 100, "remaining": 4900, "reset": 1800000000}}}
