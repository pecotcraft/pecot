# 上限で止まったレビューに、止まったことを知らせるコメントを書く。GITHUB_RUN_ID が無いので、目印を付けず既存のコメントも読まない。
id: review-finish-ok
command:
  path: [review, finish]
  args: [acme/demo/11, --result, limit]
setup:
  env:
    PECOT_GITHUB_COM_TOKEN: dummy-token
github:
  - match:
      method: GET
      path: /repos/acme/demo/pulls/11
    respond:
      status: 200
      body: {number: 11, state: open}
  - match:
      method: POST
      path: /repos/acme/demo/issues/11/comments
    respond:
      status: 201
      body: {id: 1, html_url: "https://github.com/acme/demo/pull/11#issuecomment-1"}
