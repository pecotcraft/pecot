# user が null のとき organization に切り替わる。ListProjectsUser のあと ListProjectsOrg を受ける。
id: project-search-ok-org
tool: project_search
arguments:
  host: ghes.example.com
  owner: acme
setup:
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: ListProjectsUser
    respond:
      status: 200
      body: {"data": {"user": null}}
  - match:
      operation: ListProjectsOrg
      variables: {owner: acme, first: 20}
    respond:
      status: 200
      body: {"data": {"organization": {"projectsV2": {"nodes": [{"number": 1, "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "id": "PVT_1"}]}}}}
  - match:
      operation: GetProjectFieldsUser
    respond:
      status: 200
      body: {"data": {"user": null}}
  - match:
      operation: GetProjectFieldsOrg
      variables: {owner: acme, projectNumber: 1}
    respond:
      status: 200
      body: {"data": {"organization": {"projectV2": {"id": "PVT_1", "title": "board", "url": "https://ghes.example.com/users/acme/projects/1", "views": {"nodes": [{"number": 1}]}, "fields": {"nodes": [{"id": "PVTF_title", "name": "Title"}, {"id": "MDEyOlByb2plY3RWMlNpbmdsZVNlbGVjdEZpZWxkNDU2", "name": "pecot-workflow-acme", "databaseId": 456, "options": [{"id": "o1", "name": "Backlog"}, {"id": "o2", "name": "Pending"}, {"id": "o3", "name": "Ready"}, {"id": "o4", "name": "Active"}, {"id": "o5", "name": "In Review"}, {"id": "o6", "name": "Archived"}]}, {"id": "PVTSSF_priority", "name": "pecot-priority", "options": [{"id": "p1", "name": "High"}, {"id": "p2", "name": "Medium"}, {"id": "p3", "name": "Low"}]}, {"id": "PVTSSF_size", "name": "pecot-size", "options": [{"id": "s1", "name": "XS"}, {"id": "s2", "name": "S"}, {"id": "s3", "name": "M"}, {"id": "s4", "name": "L"}]}]}}}}}
