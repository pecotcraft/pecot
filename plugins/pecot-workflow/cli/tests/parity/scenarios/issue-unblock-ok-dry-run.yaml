# --dry-run で、前提を外す予定の行だけを出す。書き込みは送らない。
id: issue-unblock-ok-dry-run
command:
  path: [issue, unblock]
  args: [acme/demo/7, --by, acme/demo/5, --dry-run]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6",
                  "blocked": "o7"
                }
              },
              "status": {
                "id": "PVTSSF_status",
                "options": {
                  "needs_attention": "s1",
                  "todo": "s2"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: GetLinkedRepositoriesUser
    respond:
      status: 200
      body:
        data:
          user:
            projectV2:
              repositories:
                nodes:
                  - {name: demo, owner: {login: acme}}
  - match:
      operation: GetIssueBlockedByReferences
    respond:
      status: 200
      body:
        data:
          repository:
            issue:
              id: I_demo_7
              body: "本文\n"
              blockedBy:
                totalCount: 1
                nodes:
                  - {id: I_demo_5, number: 5, state: OPEN, repository: {owner: {login: acme}, name: demo}}
