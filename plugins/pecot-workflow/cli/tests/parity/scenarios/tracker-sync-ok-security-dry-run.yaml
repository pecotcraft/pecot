# --dry-run は Tracker を立てる予定を表示するだけで、Issue を作らない。
id: tracker-sync-ok-security-dry-run
command:
  path: [tracker, sync]
  args: [security, --dry-run]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "develop",
              "release_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      method: "GET"
      path: "/repos/acme/demo/dependabot/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 200
      body: [{"number": 7, "html_url": "https://ghes.example.com/acme/demo/security/dependabot/7", "security_vulnerability": {"severity": "high"}, "security_advisory": {"ghsa_id": "GHSA-aaaa-bbbb-cccc", "summary": "Prototype Pollution in left-pad"}, "dependency": {"package": {"name": "left-pad"}}}]
  - match:
      method: "GET"
      path: "/repos/acme/demo/code-scanning/alerts"
      query: {"state": "open", "per_page": "100"}
    respond:
      status: 200
      body: []
  - match:
      method: "GET"
      path: "/repos/acme/demo/secret-scanning/alerts"
      query: {"state": "open", "hide_secret": "true", "per_page": "100"}
    respond:
      status: 200
      body: []
  - match:
      method: "GET"
      path: "/repos/acme/demo/issues"
      query: {"state": "all", "labels": "security-alert", "per_page": "100"}
    respond:
      status: 200
      body: []
