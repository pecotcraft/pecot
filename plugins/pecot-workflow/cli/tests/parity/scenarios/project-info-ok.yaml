# ボードに 3 件あり、登録リポ 1 つの Dependabot alert が 2 件。Markdown で出す。
id: project-info-ok
command:
  path: [project, info]
  args: []
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: ListProjectItems
      variables: {projectId: PVT_1}
    respond:
      status: 200
      body: {"data": {"node": {"items": {"nodes": [{"id": "PVTI_1", "updatedAt": "2026-01-02T03:04:05Z", "fieldValues": {"nodes": [{"field": {"name": "pecot-workflow-acme"}, "name": "Ready"}]}, "content": {"id": "I_1", "number": 1, "title": "準備済みの課題", "state": "OPEN", "url": "https://ghes.example.com/acme/demo/issues/1", "labels": {"nodes": [{"name": "bug"}]}, "repository": {"owner": {"login": "acme"}, "name": "demo"}}}, {"id": "PVTI_2", "updatedAt": "2026-01-02T03:04:05Z", "fieldValues": {"nodes": [{"field": {"name": "pecot-workflow-acme"}, "name": "Active"}]}, "content": {"id": "I_2", "number": 2, "title": "作業中の課題", "state": "OPEN", "url": "https://ghes.example.com/acme/demo/issues/2", "labels": {"nodes": [{"name": "bug"}]}, "repository": {"owner": {"login": "acme"}, "name": "demo"}}}, {"id": "PVTI_3", "updatedAt": "2026-01-02T03:04:05Z", "fieldValues": {"nodes": [{"field": {"name": "pecot-workflow-acme"}, "name": "Archived"}]}, "content": {"id": "I_3", "number": 3, "title": "完了した課題", "state": "CLOSED", "url": "https://ghes.example.com/acme/demo/issues/3", "labels": {"nodes": [{"name": "bug"}]}, "repository": {"owner": {"login": "acme"}, "name": "demo"}}}], "pageInfo": {"hasNextPage": false, "endCursor": null}}}}}
  - match:
      method: GET
      path: /repos/acme/demo/dependabot/alerts
      query: {state: open, per_page: "100"}
    respond:
      status: 200
      body: [{"security_vulnerability": {"severity": "high"}}, {"security_vulnerability": {"severity": "low"}}]
  - match:
      operation: GetIssuePrerequisites
      variables: {owner: acme, repo: demo, number: 1}
    respond:
      status: 200
      body: {"data": {"repository": {"issue": {"id": "I_1", "number": 1, "state": "OPEN", "title": "課題1", "repository": {"owner": {"login": "acme"}, "name": "demo"}, "issueType": {"name": "Task"}, "subIssues": {"totalCount": 0}, "projectItems": {"totalCount": 0, "nodes": []}, "linkedBranches": {"totalCount": 0, "nodes": []}, "closedByPullRequestsReferences": {"totalCount": 0, "nodes": []}, "timelineItems": {"totalCount": 0, "nodes": []}, "body": "本文", "parent": null, "blockedBy": {"totalCount": 0, "nodes": []}}}}}
