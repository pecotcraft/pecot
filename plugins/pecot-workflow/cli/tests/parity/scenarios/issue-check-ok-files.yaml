# 前提の付いた 2 ファイルを確かめる。何も作らずに、進め方の表とスタックできる並びを出す。
id: issue-check-ok-files
command:
  path: [issue, check]
  args: [first.md, second.md]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6",
                  "blocked": "o7"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      first.md: |
        ---
        title: 先に作る Issue
        type: task
        repository: acme/demo
        status: ready
        priority: high
        size: s
        parent_epic: acme/demo/3
        order: 2
        ---

        ## Goal — 先の Issue が作られる

        先の作業を終える。

        ## Acceptance — 先の作業が終わる

        - 先の作業の成果が出る — 確認: 画面を開く
      second.md: |
        ---
        title: 後に作る Issue
        type: task
        repository: acme/demo
        priority: high
        size: s
        parent_epic: acme/demo/3
        order: 3
        blocked_by:
          - issue: first
        ---

        ## Goal — 後の Issue が作られる

        {{issue:first}} の完了後に着手する。

        ## Acceptance — 後の作業が終わる

        - 後の作業の成果が出る — 確認: 画面を開く
      .pecot/state/issue-create-slash-pending: |
        1
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: GetLinkedRepositoriesUser
    respond:
      status: 200
      body:
        data:
          user:
            projectV2:
              repositories:
                nodes:
                  - {name: demo, owner: {login: acme}}
  - match:
      operation: HasAddBlockedByInput
    respond:
      status: 200
      body:
        data:
          __type: {name: AddBlockedByInput}
  - match:
      operation: GetIssueSlim
      variables: {owner: acme, repo: demo, number: 3}
    respond:
      status: 200
      body:
        data:
          repository:
            issue:
              number: 3
              state: OPEN
              title: 親の Epic
              body: ""
              comments: {totalCount: 0, nodes: []}
              parent:
              subIssues:
                nodes:
                  - {number: 9, state: OPEN, title: "#3-01: 先の子"}
              linkedBranches: {nodes: []}
              timelineItems: {nodes: []}
