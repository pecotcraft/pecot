# 本投稿の前の git 確認が、未 push を警告して exit 2 になる（API を呼ばない）。
id: pr-create-state-unpushed
tool: pr_create
arguments:
  message: |
    ## Summary — 見本の変更を取り込む

    見本の変更を取り込みます。

    ## Changes

    なし

    ## Verified — 見本の確認を終えた

    確認しました。

    - 見本の確認 — 通過

    ## Risks — 残る懸念はない

    なし。

    - 見本の懸念 — なし

    Closes #12
  title: "feat(demo): #12 見本の変更"
  base: main
  repo: acme/demo
  screenshot: CLI の出力の文を変えない変更のため撮らない
setup:
  repo:
    branch: feat/demo/12
    files:
      # session start が書く、開発ブランチから着手した記録
      .pecot/state/.pecot-base: |
        main 0000000000000000000000000000000000000000
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
          {
            "host": "ghes.example.com",
            "owner": "acme",
            "workflow_suffix": "acme",
            "project": {
              "number": 1,
              "id": "PVT_1",
              "board_url": "https://ghes.example.com/users/acme/projects/1",
              "fields": {
                "workflow": {
                  "id": "PVTSSF_workflow",
                  "options": {
                    "backlog": "o1",
                    "pending": "o2",
                    "ready": "o3",
                    "active": "o4",
                    "in_review": "o5",
                    "archived": "o6"
                  }
                },
                "priority": {
                  "id": "PVTSSF_priority",
                  "options": {
                    "high": "p1",
                    "medium": "p2",
                    "low": "p3"
                  }
                },
                "size": {
                  "id": "PVTSSF_size",
                  "options": {
                    "xs": "s1",
                    "s": "s2",
                    "m": "s3",
                    "l": "s4"
                  }
                }
              }
            },
            "repositories": [
              {
                "owner": "acme",
                "name": "demo",
                "develop_branch": "main"
              }
            ]
          }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github: []
