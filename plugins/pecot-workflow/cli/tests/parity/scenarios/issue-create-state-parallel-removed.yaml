# 廃止した parallel を書いたファイルを投稿する。何も投稿せずに、削除を促す error で exit 1 になる。
id: issue-create-state-parallel-removed
command:
  path: [issue, create]
  args: [draft.md]
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              },
              "priority": {
                "id": "PVTSSF_priority",
                "options": {
                  "high": "p1",
                  "medium": "p2",
                  "low": "p3"
                }
              },
              "size": {
                "id": "PVTSSF_size",
                "options": {
                  "xs": "s1",
                  "s": "s2",
                  "m": "s3",
                  "l": "s4"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
      draft.md: |
        ---
        title: 一覧に状態を出す
        type: task
        repository: acme/demo
        status: ready
        priority: high
        size: s
        parent_epic: acme/demo/3
        order: 2
        parallel: a
        ---

        ## Goal — 一覧画面から状態を確認できる

        利用者が一覧画面で各項目の状態を確認できる。

        ## Acceptance — 一覧に状態の列が出る

        - 状態の列が一覧に出る — 確認: 一覧画面を開く
      .pecot/state/issue-create-slash-pending: |
        1
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github: []
