# -m の直接投稿。REST の node_id でボードに追加し、status の欄を設定する。
id: issue-create-ok-message
tool: issue_create
arguments:
  message: |
    ## Goal — 一覧画面から状態を確認できる

    利用者が一覧画面で各項目の状態を確認できる。

    ## Acceptance — 一覧に状態の列が出る

    - 状態の列が一覧に出る — 確認: 一覧画面を開く
  title: 一覧に状態を出す
  repo: acme/demo
setup:
  repo:
    files:
      .pecot/config/projects/ghes.example.com_acme_board_acme.json: |
        {
          "host": "ghes.example.com",
          "owner": "acme",
          "workflow_suffix": "acme",
          "project": {
            "number": 1,
            "id": "PVT_1",
            "board_url": "https://ghes.example.com/users/acme/projects/1",
            "fields": {
              "workflow": {
                "id": "PVTSSF_workflow",
                "options": {
                  "backlog": "o1",
                  "pending": "o2",
                  "ready": "o3",
                  "active": "o4",
                  "in_review": "o5",
                  "archived": "o6"
                }
              }
            }
          },
          "repositories": [
            {
              "owner": "acme",
              "name": "demo",
              "develop_branch": "main"
            }
          ]
        }
      .pecot/config/projects/.active: |
        ghes.example.com_acme_board_acme.json
  env:
    PECOT_GITHUB_GHES_EXAMPLE_COM_TOKEN: dummy-token
github:
  - match:
      operation: GetLinkedRepositoriesUser
    respond:
      status: 200
      body:
        data:
          user:
            projectV2:
              repositories:
                nodes:
                  - {name: demo, owner: {login: acme}}
  - match:
      method: POST
      path: /repos/acme/demo/issues
    respond:
      status: 201
      body:
        number: 12
        title: 作成された Issue
        node_id: I_kwDO12
        html_url: https://ghes.example.com/acme/demo/issues/12
  - match:
      operation: AddToProject
    respond:
      status: 200
      body:
        data:
          addProjectV2ItemById:
            item: {id: PVTI_12}
  - match:
      operation: UpdateProjectItemField
    respond:
      status: 200
      body:
        data:
          updateProjectV2ItemFieldValue:
            projectV2Item: {id: PVTI_12}
